# =============================================================================
#  Test- und Diagnosewerkzeuge fuer die Entwicklung (wird NICHT veroeffentlicht)
# =============================================================================
# Seit 2026-10-16 auf ALLEN Remotes: templates/remote-halink.yaml bindet es ein (packages: dev), damit alle
# Remotes bis auf den Namen gleich sind. Die Dienste erscheinen in HA als esphome.remote_wz_<name>_<dienst>.
#
#   seite_zeigen  {seite}   Seite fuer Bildschirmfotos: "menue", "menue_x" (X markiert), "menue_rein" (markierten
#                           Eintrag oeffnen), "start" oder eine eingebaute Seite (media, ble, power ...).
#                           Mit "_zeitlupe" am Ende laufen alle Animationen 15x langsamer (z. B. "menue_zeitlupe").
#                           Bild holen: Schalter "Konfig-Modus (HTTP)" an, dann GET http://<ip>/sd/api/bild?y=0
#                           (rohes RGB565, 240x320; Umwandeln: scratchpad bild.py).
#   menue_popup_zu          (in der Firmware) Popup schliessen
#   mic_selbsttest          Mikrofon 1,5 s aufnehmen, Kennwerte ins Log und in den Sensor "Mikrofon-Selbsttest"
#   ram_messen {schritt}    internes RAM/PSRAM sofort ins Log, RAM-Sensoren aktualisieren
#   tiefschlaf_jetzt        sofort in den normalen Tiefschlaf (alle Weckquellen wie im Alltag)
#   weckprotokoll_log       ganzes Weckprotokoll (RTC) ins Log
#   pm_bericht              wer haelt den Prozessor wach (esp_pm-Sperren), zeilenweise ins HA-Log (Bruecke)
#   modus_starten {modus}   Folgemodus (cfg.modi) starten wie per Taste, z. B. "haengelampe"
#   taste {code, ms}        Hardware-Taste nachstellen: druecken, ms halten, loslassen (ueber die Belegung)
# =============================================================================

text_sensor:
  - platform: template
    id: mic_test_text
    name: "Mikrofon-Selbsttest"
    icon: "mdi:microphone-message"
    entity_category: diagnostic

api:
  services:
    - service: modus_starten
      variables: {modus: string}
      then:
        - script.execute: wake_backlight
        - delay: 300ms
        - lambda: 'id(tk_cfg)->modus_starten(modus.c_str());'
    - service: taste
      variables: {code: int, ms: int}
      then:
        - lambda: 'tasten::ereignis(code, true);'
        - delay: !lambda 'return (uint32_t) std::max<int32_t>(ms, 30);'
        - lambda: 'tasten::ereignis(code, false);'
    # Musik-Anzeige mit kuenstlicher Musik (Optik pruefen, auch wenn das Mikrofon gesperrt ist), 2026-10-18
    - service: musik_demo
      variables: {an: bool}
      then:
        - lambda: 'musik::demo(an); if (an) musik::zeigen(false);'
    - service: seite_zeigen
      variables: {seite: string}
      then:
        - script.execute: wake_backlight
        - lambda: |-
            const bool zl = seite.size() > 9 && seite.compare(seite.size() - 9, 9, "_zeitlupe") == 0;
            id(mn)->zeitlupe = zl ? 15 : 1;
        - if:
            condition: {lambda: 'return seite.rfind("menue", 0) == 0;'}
            then:
              - script.execute: open_menu
              - if: {condition: {lambda: 'return seite.rfind("menue_x", 0) == 0;'}, then: [{delay: 1500ms}, {lambda: 'id(mn)->fokus(0, -1);'}]}
              - if: {condition: {lambda: 'return seite.rfind("menue_rein", 0) == 0;'}, then: [{delay: 1500ms}, {lambda: 'id(mn)->ok();'}]}
            else:
              - if:
                  condition: {lambda: 'return seite.rfind("start", 0) == 0;'}
                  then: [{script.execute: go_home}]
                  else: [{lambda: 'tasten::spezial_zeigen(std::string(seite.c_str(), seite.size()));'}]
    - service: mic_selbsttest
      then:
        - script.execute: wake_backlight
        - lambda: |-
            struct MicTest { volatile bool an = false; uint32_t n = 0, null = 0; int32_t mn = 0, mx = 0; uint64_t sum = 0; uint32_t bytes = 0; };
            static MicTest *m = new MicTest();
            static bool reg = false;
            if (!reg) {
              reg = true;
              id(remote_mic)->add_data_callback([](const std::vector<uint8_t> &d) {
                if (!m->an) return;
                m->bytes += d.size();
                for (size_t i = 0; i + 3 < d.size(); i += 4) {
                  int32_t s; memcpy(&s, &d[i], 4); s >>= 8;
                  if (m->n == 0) { m->mn = m->mx = s; }
                  if (s < m->mn) m->mn = s;
                  if (s > m->mx) m->mx = s;
                  if (s == 0) m->null++;
                  m->sum += (uint64_t) (s < 0 ? -(int64_t) s : s);
                  m->n++;
                }
              });
            }
            *m = MicTest();
            id(mic_power)->turn_on();
            delay(400);
            m->an = true;
            id(remote_mic)->start();
            id(mic_test_text).publish_state("laeuft ...");
            // Auswertung nach 1,5 s
            App.scheduler.set_timeout(id(remote_mic), "mic_selbsttest", 1500, []() {
              m->an = false;
              id(remote_mic)->stop();
              char b[200];
              snprintf(b, sizeof(b), "Bytes %u, Samples %u, Null %u, Min %d, Max %d, Mittel|x| %u",
                       (unsigned) m->bytes, (unsigned) m->n, (unsigned) m->null, (int) m->mn, (int) m->mx,
                       (unsigned) (m->n ? m->sum / m->n : 0));
              ESP_LOGI("mictest", "%s", b);
              id(mic_test_text).publish_state(b);
              id(apply_mic_power).execute();
            });
    # Mikrofon-Spektrum bei verschiedener Beleuchtungs-PWM (2026-11-08): Pfeifen bei 1, 2, 3 ... kHz kommt evtl. von den
    # beiden ledc-Ausgaengen (ohne frequency: = 1000 Hz). Setzt beide auf pwm_hz (0 = unveraendert), verwirft 1 s
    # (Einschwingen), nimmt 2 s auf und loggt den Pegel (dB, Hann-Fenster, 50-ms-Bloecke gemittelt) bei 0,5 ... 7,5 kHz.
    # Ganze kHz = Pfeifen, halbe = Nachbar zum Vergleich. Ausgabe "10:-62" = 1,0 kHz -62 dB. Display bleibt dabei an.
    # Stoerton-Suche (2026-11-09): wie mic_spektrum, aber feines Raster (10 Hz, 100-ms-Bloecke) von f_von bis f_bis und
    # die 6 staerksten Spitzen ueber dem Grundrauschen (Median). wecken=false laesst das Display, wie es ist;
    # touch_aus=true haelt die Touch-Abfrage waehrend der Aufnahme an. Ausgabe "Grund -106 | 6000:-91 ...".
    - service: mic_suche
      variables: {wecken: bool, touch_aus: bool, f_von: int, f_bis: int}
      then:
        - lambda: |-
            struct Such { volatile bool an = false; int32_t *buf = nullptr; volatile uint32_t n = 0, skip = 0; bool touch = false; };
            static Such *su = new Such();
            static bool reg = false;
            if (su->buf == nullptr)
              su->buf = (int32_t *) heap_caps_malloc(32000 * sizeof(int32_t), MALLOC_CAP_SPIRAM);
            if (su->buf == nullptr) { ESP_LOGE("suche", "kein PSRAM fuer den Puffer"); return; }
            if (!reg) {
              reg = true;
              id(remote_mic)->add_data_callback([](const std::vector<uint8_t> &d) {
                if (!su->an) return;
                for (size_t i = 0; i + 3 < d.size(); i += 4) {
                  if (su->skip) { su->skip--; continue; }
                  if (su->n >= 32000) { su->an = false; return; }
                  int32_t s; memcpy(&s, &d[i], 4);
                  su->buf[su->n++] = s >> 8;
                }
              });
            }
            if (wecken) id(wake_backlight).execute();
            su->touch = touch_aus;
            if (touch_aus) id(main_touch)->stop_poller();
            su->n = 0;
            su->skip = 16000;
            id(mic_power)->turn_on();
            su->an = true;
            id(remote_mic)->start();
            id(mic_test_text).publish_state("Suche laeuft ...");
            const int von = std::max(100, (int) f_von);
            const int bis = std::min(7990, std::max(von + 10, (int) f_bis));
            App.scheduler.set_timeout(id(remote_mic), "mic_suche", 3800, [von, bis]() {
              su->an = false;
              id(remote_mic)->stop();
              id(apply_mic_power).execute();
              if (su->touch) id(main_touch)->start_poller();
              const int B = 1600;
              static float *win = nullptr;
              if (win == nullptr) {
                win = (float *) heap_caps_malloc(B * sizeof(float), MALLOC_CAP_SPIRAM);
                for (int i = 0; i < B; i++) win[i] = 0.5f - 0.5f * cosf(2.0f * (float) M_PI * i / (B - 1));
              }
              const uint32_t n = su->n;
              const int k = (bis - von) / 10 + 1;
              std::vector<float> db(k);
              for (int j = 0; j < k; j++) {
                const int f = von + j * 10;
                const float c = 2.0f * cosf(2.0f * (float) M_PI * f / 16000.0f);
                double sum = 0;
                int bl = 0;
                for (uint32_t b0 = 0; b0 + B <= n; b0 += B, bl++) {
                  float s1 = 0, s2 = 0;
                  for (int i = 0; i < B; i++) {
                    const float s0 = su->buf[b0 + i] * (1.0f / 8388608.0f) * win[i] + c * s1 - s2;
                    s2 = s1;
                    s1 = s0;
                  }
                  sum += (double) s1 * s1 + (double) s2 * s2 - (double) c * s1 * s2;
                }
                const double p = bl ? sum / bl / ((B / 2.0) * (B / 2.0)) : 0;
                db[j] = 10 * log10(p + 1e-15);
                if ((j & 15) == 0) App.feed_wdt();
              }
              std::vector<float> sort = db;
              std::nth_element(sort.begin(), sort.begin() + k / 2, sort.end());
              const float grund = sort[k / 2];
              // lokale Maxima, absteigend; Nachbarn innerhalb 40 Hz zaehlen nicht doppelt
              std::vector<std::pair<float, int>> sp;
              for (int j = 1; j + 1 < k; j++)
                if (db[j] >= db[j - 1] && db[j] >= db[j + 1] && db[j] > grund + 6) sp.push_back({db[j], von + j * 10});
              std::sort(sp.begin(), sp.end(), [](auto &a, auto &b) { return a.first > b.first; });
              char out[250];
              int o = snprintf(out, sizeof(out), "%d-%d Hz, Grund %.0f |", von, bis, grund);
              std::vector<int> genommen;
              for (auto &x : sp) {
                bool nah = false;
                for (int g : genommen) if (abs(g - x.second) <= 40) nah = true;
                if (nah) continue;
                genommen.push_back(x.second);
                o += snprintf(out + o, sizeof(out) - o, " %d:%.0f", x.second, x.first);
                if (genommen.size() >= 6 || o > (int) sizeof(out) - 14) break;
              }
              ESP_LOGI("suche", "%s", out);
              id(mic_test_text).publish_state(out);
            });
    - service: mic_spektrum
      variables: {pwm_hz: int}
      then:
        - script.execute: wake_backlight
        - lambda: |-
            struct Spek { volatile bool an = false; int32_t *buf = nullptr; volatile uint32_t n = 0, skip = 0; };
            static Spek *sp = new Spek();
            static bool reg = false;
            if (sp->buf == nullptr)
              sp->buf = (int32_t *) heap_caps_malloc(32000 * sizeof(int32_t), MALLOC_CAP_SPIRAM);
            if (sp->buf == nullptr) { ESP_LOGE("spektrum", "kein PSRAM fuer den Puffer"); return; }
            if (!reg) {
              reg = true;
              id(remote_mic)->add_data_callback([](const std::vector<uint8_t> &d) {
                if (!sp->an) return;
                for (size_t i = 0; i + 3 < d.size(); i += 4) {
                  if (sp->skip) { sp->skip--; continue; }
                  if (sp->n >= 32000) { sp->an = false; return; }
                  int32_t s; memcpy(&s, &d[i], 4);
                  sp->buf[sp->n++] = s >> 8;
                }
              });
            }
            if (pwm_hz > 0) {
              id(backlight_pwm)->update_frequency(pwm_hz);
              id(button_backlight_pwm)->update_frequency(pwm_hz);
            }
            sp->n = 0;
            sp->skip = 16000;
            id(mic_power)->turn_on();
            sp->an = true;
            id(remote_mic)->start();
            id(mic_test_text).publish_state("Spektrum laeuft ...");
            App.scheduler.set_timeout(id(remote_mic), "mic_spektrum", 3800, [pwm_hz]() {
              sp->an = false;
              id(remote_mic)->stop();
              id(apply_mic_power).execute();
              static float win[800];
              static bool win_ok = false;
              if (!win_ok) {
                for (int i = 0; i < 800; i++) win[i] = 0.5f - 0.5f * cosf(2.0f * (float) M_PI * i / 799.0f);
                win_ok = true;
              }
              const uint32_t n = sp->n;
              double rms = 0;
              for (uint32_t i = 0; i < n; i++) { const double v = sp->buf[i] / 8388608.0; rms += v * v; }
              rms = n ? sqrt(rms / n) : 0;
              char out[250];
              int o = snprintf(out, sizeof(out), "PWM %d Hz, %u Samples, RMS %.1f dB |", pwm_hz, (unsigned) n,
                               20 * log10(rms + 1e-12));
              for (int f = 500; f <= 7500 && o < (int) sizeof(out) - 10; f += 500) {
                const float c = 2.0f * cosf(2.0f * (float) M_PI * f / 16000.0f);
                double sum = 0;
                int bl = 0;
                for (uint32_t b0 = 0; b0 + 800 <= n; b0 += 800, bl++) {
                  float s1 = 0, s2 = 0;
                  for (int i = 0; i < 800; i++) {
                    const float s0 = sp->buf[b0 + i] * (1.0f / 8388608.0f) * win[i] + c * s1 - s2;
                    s2 = s1;
                    s1 = s0;
                  }
                  sum += (double) s1 * s1 + (double) s2 * s2 - (double) c * s1 * s2;
                }
                const double p = bl ? sum / bl / (400.0 * 400.0) : 0;   // auf Sinus-Amplitude normiert (Hann: Summe 400)
                o += snprintf(out + o, sizeof(out) - o, " %d:%.0f", f / 100, 10 * log10(p + 1e-15));
              }
              ESP_LOGI("spektrum", "%s", out);
              id(mic_test_text).publish_state(out);
            });
    - service: ram_messen
      variables: {schritt: string}
      then:
        - lambda: |-
            ESP_LOGI("ram", "[%s] intern frei %u, groesster Block %u, minimum seit Start %u, PSRAM frei %u KB",
                     schritt.c_str(), (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL),
                     (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL),
                     (unsigned) heap_caps_get_minimum_free_size(MALLOC_CAP_INTERNAL),
                     (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024));
        - component.update: ram_frei
        - component.update: ram_min
        - component.update: ram_block
    - service: tiefschlaf_jetzt
      then:
        - lambda: |-
            weck_log("Tiefschlaf (Test per HA)");
            g_deep_active = id(ps_deep) ? 0x5EEEu : 0;
        - delay: 500ms
        - script.execute: deep_sleep_powerdown
        - deep_sleep.enter: {id: nachtschlaf}
    - service: weckprotokoll_log
      then:
        - lambda: |-
            const std::string t = weck_log_ende(WECK_LOG_BYTES);
            for (size_t i = 0; i < t.size(); i += 180) ESP_LOGI("weckprot", "%s", t.substr(i, 180).c_str());
            id(weck_text).publish_state(weck_log_ende(250));
    # Strom-Diagnose: wer haelt den Prozessor wach (esp_pm-Sperren). Ausgabe zeilenweise ins HA-Log (Bruecke).
    - service: pm_bericht
      then:
        - lambda: |-
            char *buf = nullptr;
            size_t len = 0;
            FILE *f = open_memstream(&buf, &len);
            if (f == nullptr) return;
            esp_pm_dump_locks(f);
            fclose(f);
            std::string s(buf, len);
            free(buf);
            char kopf[96];
            snprintf(kopf, sizeof(kopf), "PM-Bericht: Display %s, Laufzeit %u s", id(disp_off) ? "aus" : "an", (unsigned) (millis() / 1000));
            id(tunnel).meldung(kopf);
            size_t a = 0;
            while (a < s.size()) {
              size_t e = s.find('\n', a);
              if (e == std::string::npos) e = s.size();
              std::string z = s.substr(a, e - a);
              if (z.find_first_not_of(" \t\r") != std::string::npos) id(tunnel).meldung(z);
              a = e + 1;
            }

# Dauerhaft online fuer Fernwartung (2026-11-08, Nutzer unterwegs): haelt den Testmodus (kein Tiefschlaf, WLAN an, auch im
# Dock-Betrieb) ohne das 12-h-Ende aktiv. Mit diesem Schalter abschaltbar; danach endet der Testmodus normal.
switch:
  - platform: template
    id: dev_dauer_online
    name: "Entwicklung: dauerhaft online"
    icon: "mdi:wifi-lock"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: 'id(testmodus) = true; id(testmodus_ab) = millis() | 1; ESP_LOGI("test", "Dauerhaft online AN");'
      - script.execute: apply_power
    turn_off_action:
      - lambda: 'ESP_LOGW("test", "Dauerhaft online AUS - Testmodus endet mit seinen 12 h");'

interval:
  - interval: 30s
    then:
      - lambda: |-
          if (!id(dev_dauer_online).state) return;
          const bool war = id(testmodus);
          id(testmodus) = true;
          id(testmodus_ab) = millis() | 1;
          if (!war) { ESP_LOGI("test", "Dauerhaft online: Testmodus wieder an"); id(apply_power).execute(); }
