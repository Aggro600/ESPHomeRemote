# ESPHomeRemote - Dock-Firmware, Kern (wird als Paket geladen, automatisch erzeugt)
# ESPHomeRemote Dock - Kern (2026-11-01): alles, was auf jedem ESP32 mit Bluetooth und WLAN laeuft
#   - Bluetooth-Proxy (HA ueber Bluetooth fuer die Remotes)
#   - Bluetooth-Tastatur fuer bis zu 4 Geraete (Fernseher, Streamer, Tablet ...)
#   - Funk direkt von der Remote (ESP-NOW): HA-Befehle, Zustand, Bluetooth-Eingaben
#
# Original-Dock (ESP32-C3 Super Mini + Platine Rev6): dock-base.yaml = dieser Kern + dock-board.yaml (IR,
# 433 MHz, LEDs, Taste, Ladekontakte). Dock-Nachbau auf einem anderen ESP32 (ESP32, -S3, -C3 ohne Platine, -C6):
# nur dieser Kern, Chip ueber die Substitutionen unten (legt der Konfigurator beim Flashen selbst an).
# Nicht moeglich: ESP32-S2 (kein Bluetooth), ESP32-H2 (kein WLAN).

substitutions:
  dock_board: esp32-c3-devkitm-1
  dock_variant: esp32c3
  dock_flash: 4MB

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:   # Version: setzt tools/release.py, der Konfigurator vergleicht sie mit der Integration (Update-Hinweis)
    name: aggro600.esphomeremote-dock
    version: "2026.11.9.1"
  includes:
    - <esp_mac.h>
    - <esp_heap_caps.h>
    - <esp_system.h>                                   # TEST Neustartgrund (2026-10-26)
    - <esphome/components/esp32/crash_handler.h>       # TEST Letzter Absturz (2026-10-26)
  on_boot:
    - priority: -100
      then:
        - script.execute: led_status
        # TEST (2026-10-26, kann evtl. wieder weg): Neustartgrund und Absturz des letzten Laufs als Sensoren - das Dock
        # startete am 26.10. um 05:43 ohne erkennbaren Grund neu. ESPHome schreibt den Absturz nur einmal ins Log und
        # loescht ihn, sobald ein Log-Abo ihn bekommt; hier noch einmal ausgeben, logger on_message faengt ihn ein.
        - lambda: |-
            const char *g = "unbekannt";
            switch (esp_reset_reason()) {
              case ESP_RST_POWERON: g = "Strom an"; break;
              case ESP_RST_SW: g = "gewollt (Neustart/Update)"; break;
              case ESP_RST_PANIC: g = "Absturz"; break;
              case ESP_RST_INT_WDT: g = "Watchdog (Interrupt)"; break;
              case ESP_RST_TASK_WDT: g = "Watchdog (Task)"; break;
              case ESP_RST_WDT: g = "Watchdog"; break;
              case ESP_RST_BROWNOUT: g = "Spannungseinbruch"; break;
              case ESP_RST_DEEPSLEEP: g = "Tiefschlaf"; break;
              case ESP_RST_EXT: g = "Reset-Pin"; break;
              default: break;
            }
            id(neustart_grund).publish_state(g);
            id(absturz_txt).publish_state("kein Absturz");
            #ifdef USE_ESP32_CRASH_HANDLER
            esp32::crash_handler_log();
            #endif
    # 433 MHz lernen: liest die Flanken direkt aus dem Empfangspuffer (keine Kopie je Rauschen), s. remote_receiver

esp32:
  board: ${dock_board}
  variant: ${dock_variant}
  flash_size: ${dock_flash}
  framework:
    type: esp-idf
    sdkconfig_options:
      # Interrupt-Watchdog 300 -> 800 ms (2026-10-22): das Dock startete mehrmals am Tag neu, "Interrupt wdt" im
      # Bluetooth-Controller (r_sch_prog_end_isr) bei Proxy + WLAN + ESP-NOW auf dem einen Funk des C3
      CONFIG_ESP_INT_WDT_TIMEOUT_MS: "800"
      # WLAN-Puffer begrenzen (2026-10-25): IDF erlaubt je 32 Empfangs-/Sendepuffer a ~1,6 kB, das Dock hat ~30 kB frei.
      # Unter Last fiel der Speicher auf 0,6 kB und das WLAN war minutenlang weg (Couchtisch 2026-10-25 00:02-00:18).
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "6"
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "12"
      CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM: "12"
      CONFIG_ESP_WIFI_AMPDU_TX_ENABLED: "n"
      CONFIG_ESP_WIFI_RX_BA_WIN: "4"

logger:
  level: INFO
  # TEST (2026-10-26, kann evtl. wieder weg): Absturz-Zeilen (esp32.crash) in den Sensor "Letzter Absturz"
  on_message:
    level: ERROR
    then:
      - lambda: |-
          if (strcmp(tag, "esp32.crash") != 0) return;
          static std::string t;
          if (strstr(message, "CRASH DETECTED") != nullptr) t.clear();
          else if (t.size() < 200) { if (!t.empty()) t += " | "; t += message; }
          if (t.size() > 250) t.resize(250);
          if (!t.empty()) id(absturz_txt).publish_state(t);

# Uhrzeit von HA (2026-11-06): das Dock gibt sie an Remotes im Dock-Betrieb weiter (dock_direkt typ 13/14) - die haben
# sonst nur SNTP per WLAN, nach einem Kaltstart fehlte die Uhr.
time:
  - platform: homeassistant
    id: ha_zeit

api:
  id: api_server
  encryption: {}   # Schluessel vergibt Home Assistant beim Einbinden
  on_client_connected:
    - script.execute: led_status
  on_client_disconnected:
    - script.execute: led_status
  actions:
    # Stand einer Remote (Startseite, Fernseher, Timer) als JSON - von der Integration bei jeder Aenderung; die Remote
    # holt ihn nach dem Tiefschlaf per Funk ab (dock_direkt typ 4/5), bevor ihre eigene HA-Verbindung steht
    - action: zustand
      variables: {remote: string, inhalt: string}
      then:
        - lambda: 'id(direkt).zustand_setzen(remote, inhalt);'
    # ---- Bluetooth-Tastatur fuer mehrere Geraete (dock_hid, 2026-10-22) - Plaetze 1..4 wie im Konfigurator
    # Koppeln: Dock 2 Minuten sichtbar; am Fernseher/Tablet/Laptop "Bluetooth-Geraet hinzufuegen" -> Name des Docks.
    # optionen: 1 = Maus/Touchpad, 2 = volle Tastatur (Buchstaben) - beides wirkt nur beim Koppeln.
    - action: bt_koppeln
      variables: {platz: int, name: string, optionen: int}
      then:
        - lambda: 'id(bt_hid).koppeln(platz - 1, name, optionen);'
    - action: bt_koppeln_abbrechen
      then:
        - lambda: 'id(bt_hid).koppeln_abbrechen();'
    - action: bt_vergessen
      variables: {platz: int}
      then:
        - lambda: 'id(bt_hid).vergessen(platz - 1);'
    # Geraet trennen und so lange nicht wieder verbinden lassen (Diagnose, 2026-10-23)
    - action: bt_trennen
      variables: {platz: int, sekunden: int}
      then:
        - lambda: 'id(bt_hid).trennen(platz - 1, sekunden);'
    - action: bt_optionen
      variables: {platz: int, name: string, optionen: int}
      then:
        - lambda: 'id(bt_hid).optionen(platz - 1, name, optionen);'
    # Suchtempo des Proxys (2026-10-22, HA dockscan.py jede Minute): Zeiten in ms, grund fuer die Anzeige, weck_* =
    # schnelle Suche nach einem Weckruf (Remote fragt ihren Stand ab), remotes = welche Remotes zaehlen ("a,b", leer = alle)
    - action: scan_stufe
      # fenster_verbunden: hoechstens so lange am Stueck hinhoeren, solange ein Geraet am Dock verbunden ist (0 = YAML)
      variables: {intervall: int, fenster: int, grund: string, weck_s: int, weck_intervall: int, weck_fenster: int, remotes: string, fenster_verbunden: int}
      then:
        - lambda: 'id(bt_hid).scan_stufe(intervall, fenster, grund, weck_s, weck_intervall, weck_fenster, remotes, fenster_verbunden);'
    # Taste an ein Geraet (Test im Konfigurator, Ausweg ueber HA): art consumer/taste/knopf/system, aktion tipp/druecken/loslassen
    - action: bt_senden
      variables: {platz: int, art: string, code: int, mod: int, aktion: string}
      then:
        - lambda: |-
            using namespace dock_hid;
            Ereignis e{CONSUMER, TIPP, {0, 0, 0, 0}};
            if (art == "taste") { e.art = TASTE; e.d[0] = mod; e.d[1] = code; }
            else if (art == "knopf") { e.art = KNOPF; e.d[0] = code; }
            else if (art == "system") { e.art = SYSTEM; e.d[0] = code; }
            else { e.d[0] = code & 0xFF; e.d[1] = (code >> 8) & 0xFF; }
            if (aktion == "druecken") e.aktion = DRUECKEN;
            else if (aktion == "loslassen") e.aktion = LOSLASSEN;
            if (!id(bt_hid).senden(platz - 1, e)) ESP_LOGW("dock_hid", "Platz %d nicht verbunden", platz);
            else id(led_sendet).execute();

ota:
  - platform: esphome
    id: ota_esphome   # eigene YAML kann ihn mit "id: !extend ota_esphome" anpassen (2026-11-04)
    password: "${ota_pw}"

wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"
  # Netzbetrieb: Funk nie schlafen lassen (wie im Original)
  power_save_mode: none
  # 1 min ohne WLAN -> Neustart (Standard 15 min). Bei Speichermangel kommt das WLAN von selbst nicht wieder
  # (Couchtisch 2026-10-25 00:50: Empfangspuffer 1,7 kB scheiterten, Dock 15 min weg) - Neustart dauert ~10 s.
  reboot_timeout: 1min
  # Kein Fallback-Hotspot mehr (2026-10-25): ohne WLAN machte das Dock nach 1 min zusaetzlich einen Hotspot samt
  # Webserver auf - kostet Speicher und Funkzeit genau dann, wenn es sich wieder verbinden soll. Notfall: USB.

script:
  # LED-Anzeige: beim Original-Dock in dock-board.yaml (!extend), beim Nachbau ohne LED nichts
  - id: led_status
    mode: restart
    then:
      - lambda: ""
  - id: led_sendet
    mode: restart
    then:
      - lambda: ""

interval:
  # Speicher-Notbremse (2026-10-25): groesster freier Block 20 s am Stueck unter 2 kB -> Neustart. Dann scheitern die
  # WLAN-Empfangspuffer (1,7 kB), Daten fuer HA stauen sich, der Speicher wird noch knapper - von selbst kommt es nicht raus.
  - interval: 1s
    then:
      - lambda: |-
          static uint8_t knapp = 0;
          if (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) >= 2048) { knapp = 0; return; }
          if (++knapp == 20) {
            ESP_LOGE("dock", "Speicher seit 20 s zerstueckelt (groesster Block < 2 kB) - Neustart");
            App.safe_reboot();
          }

button:
  - platform: restart
    id: neustart
    name: Neustart

binary_sensor:
  - platform: status
    name: Status


sensor:
  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Laufzeit
    update_interval: 300s
    entity_category: diagnostic
  # Freier Arbeitsspeicher (2026-10-22): Proxy + Bluetooth-Tastatur + WLAN teilen sich ~320 kB ohne PSRAM
  - platform: template
    name: Freier Speicher
    unit_of_measurement: kB
    accuracy_decimals: 0
    icon: mdi:memory
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024.0f;'
  - platform: template
    name: Kleinster freier Speicher
    unit_of_measurement: kB
    accuracy_decimals: 0
    icon: mdi:memory
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return heap_caps_get_minimum_free_size(MALLOC_CAP_INTERNAL) / 1024.0f;'
  # Groesster Block am Stueck (2026-10-25): zerstueckelter Speicher laesst Anforderungen scheitern, obwohl genug frei ist
  - platform: template
    name: Groesster freier Block
    unit_of_measurement: kB
    accuracy_decimals: 1
    icon: mdi:memory
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024.0f;'

text_sensor:
  # TEST (2026-10-26, kann evtl. wieder weg): warum das Dock zuletzt neu gestartet ist (s. on_boot)
  - platform: template
    id: neustart_grund
    name: Neustartgrund
    icon: mdi:restart-alert
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: absturz_txt
    name: Letzter Absturz
    icon: mdi:bug
    entity_category: diagnostic
    update_interval: never
  # Stand der Bluetooth-Plaetze (dock_hid) fuer den Konfigurator: {"k": Kopplung Platz-1 oder -1, "ks": Restzeit,
  # "p": [{"b": belegt, "n": Name, "v": verbunden, "o": Optionen}, ...]}
  - platform: template
    id: bt_geraete
    name: Bluetooth-Geraete
    icon: mdi:bluetooth-connect
    entity_category: diagnostic
    update_interval: never
  # Suchtempo des Proxys (Scan-Stufen): {"i": Intervall, "f": Fenster (ms), "g": Grund, "r": Rest Weckruf (s), "p": pausiert}
  - platform: template
    id: scan_tempo
    name: Suchtempo
    icon: mdi:radar
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: Bluetooth-Adresse
    icon: mdi:bluetooth
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      uint8_t m[6];
      esp_read_mac(m, ESP_MAC_BT);
      char b[18];
      snprintf(b, sizeof(b), "%02X:%02X:%02X:%02X:%02X:%02X", m[0], m[1], m[2], m[3], m[4], m[5]);
      return std::string(b);
  - platform: version
    name: ESPHome-Version
    hide_timestamp: true
  - platform: wifi_info
    ip_address:
      name: IP-Adresse

# ---------------------------------------------------------------- Bluetooth-Proxy
# Das Dock steht am Ladeplatz direkt neben der Remote: idealer Proxy fuer den HA-Link ueber Bluetooth
# (ha_tunnel). Die Remote nimmt den Link nur von bekannten Proxys an - Adresse unten ("Bluetooth-Adresse")
# im Konfigurator unter Bluetooth -> "Home Assistant ueber Bluetooth" anhaken.
esp32_ble_tracker:
  # Netzbetrieb: oefter hinhoeren als ein Akku-Proxy (2026-10-19) - die Remote wird nach dem Aufwachen schneller
  # gefunden. Ein Drittel der Zeit; mehr nimmt dem WLAN (gleicher Funk beim C3) zu viel.
  # Seit 2026-10-22 nur noch Standard: HA stellt das Tempo je nach Lage um (dock_hid Scan-Stufen, Konfigurator
  # Dockingstation > Suchtempo). Bei Aenderung auch dock_hid scan_intervall/scan_fenster anpassen.
  scan_parameters:
    # Passiv (2026-10-27): das Dock stuerzte etwa stuendlich im Interrupt-Watchdog ab, haengend in der Scan-Planung
    # des Bluetooth-Controllers (r_lld_scan_try_sched), meist wenn Remotes ueber das Dock mit HA verbunden waren.
    # Aktiv schickt zu jedem Fund eine Scan-Anfrage - mehr Arbeit fuer den Controller. Die Remotes findet HA auch
    # passiv (Kennung steht in den Werbedaten, nicht in der Scan-Antwort).
    active: false
    interval: 150ms
    window: 50ms
    # Nicht gleich beim Start: dock_hid startet den Scan 20 s spaeter, wenn WLAN, HA und die Bluetooth-Geraete am Dock
    # verbunden sind. Alles gleichzeitig brachte den Controller in den Interrupt-Watchdog (Absturzschleife 2026-10-22).
    continuous: false

bluetooth_proxy:
  active: true
  cache_services: true

# ---------------------------------------------------------------- Bluetooth-Tastatur fuer mehrere Geraete
# (2026-10-22) Das Dock bleibt dauerhaft mit bis zu 4 Geraeten gekoppelt und verbunden (Fernseher, Streamer, Tablet,
# Laptop ...). Die Remotes schicken Tasten und Touchpad per Funk (dock_direkt typ 10) - kommt sofort an, auch aus dem
# Tiefschlaf der Remote. Laeuft neben dem Proxy auf demselben Bluetooth (3 Proxy- + 4 Geraete-Verbindungen).
esp32_ble:
  max_connections: 7

dock_hid:
  id: bt_hid
  name: ${friendly_name}
  plaetze: 4
  status: bt_geraete
  scan_status: scan_tempo
  scan_intervall: 150ms   # = scan_parameters oben
  scan_fenster: 50ms
  # Sprache der Remote ueber das Dock an den Fernseher, beide Richtungen (Mikrofontaste / Fernseher fordert an), 2026-10-24
  sprache: true

# ---------------------------------------------------------------- Direkt von der Remote
# Infrarot/433 MHz kommen von den Remotes per ESP-NOW direkt hierher, ohne HA dazwischen (2026-10-18) - geht auch,
# wenn HA gerade nicht laeuft. Seit 2026-10-19 auch HA-Befehle: das Dock ist immer mit HA verbunden und fuehrt sie
# sofort aus (die Remote muss nach dem Aufwachen nicht erst ihre eigene HA-Verbindung aufbauen). Beschreibung: components/dock_direct/dock_direct.h
external_components:
  - source: {type: git, url: https://github.com/Aggro600/ESPHomeRemote, ref: stabil, path: components}
    refresh: 0s
    # bluetooth_connection: eigene Fassung (ESPHome 2026.9.1 + Dock-Takt fuer Proxy-Verbindungen, 2026-10-23)
    components: [dock_direct, dock_hid, bluetooth_connection]

dock_direct:
  id: direkt
  schluessel: "${direkt_schluessel}"
  # HA-Befehle der Remotes ausfuehren (Remote-Einstellung "HA-Befehle ueber das Dock")
  ha: true
  # Bilder/Konfiguration fuer die Remotes von HA holen (HTTP ueber das Dock, 2026-10-20) - Adresse wie ha_adresse der Remotes
  ha_http: "homeassistant.local:8123"
  # Bluetooth-Eingaben der Remotes an die gekoppelten Geraete (dock_hid)
  hid: bt_hid
  on_senden:
    - script.execute: {id: led_sendet}

