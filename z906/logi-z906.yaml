# Logitech Z906 on Wi-Fi – an ESP32 sits between the console and the amplifier (DE-15 cable).
# Volume, subwoofer/centre/rear level, input, effect and power state in Home Assistant; the console keeps working
# as usual (all bytes are passed through in both directions, also while the console starts up).
#
# Wiring (like github.com/Jupsi/logi_z906_wifi):
#   console pin 12   -> GPIO17 (TX to the console)      console pin 13   -> GPIO16 (RX from the console)
#   amplifier pin 12 -> GPIO22 (RX from the amplifier)  amplifier pin 13 -> GPIO23 (TX to the amplifier)
#   GND -> GND. Optional, display only: pin 8 -> GPIO32, pin 9 -> GPIO34, pin 15 -> GPIO35.
# The ESP32 needs its own power supply (USB), separate from the amplifier.
#
# Put this file into your ESPHome folder (e.g. as logi-z906.yaml) and the folder components/z906 next to it –
# or take the component straight from GitHub (see "external_components" below).
esphome:
  name: logi-z906
  friendly_name: Logitech Z906

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://Aggro600/ESPHomeRemote@stabil
    components: [z906]
    refresh: 0s

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key_z906

ota:
  - platform: esphome
    password: !secret ota_pw

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

captive_portal:

z906:
  id: z
  console_rx_pin: 16
  console_tx_pin: 17
  amp_rx_pin: 22
  amp_tx_pin: 23
  volume:
    name: "Volume"
  subwoofer:
    name: "Volume Bass"
  center:
    name: "Volume Center"
  rear:
    name: "Volume Rear"
  input:
    name: "Input"
  effect:
    name: "Effect"
  power:
    name: "Power"
  read_status:
    name: "Read status"
  # Troubleshooting: log every byte between console and amplifier
  debug_traffic: false
  # Troubleshooting: button that prints the capture of the first 3 minutes after start-up
  dump_capture:
    name: "Dump capture"

sensor:
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s
    entity_category: diagnostic
