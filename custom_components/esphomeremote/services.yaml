to_remotes:
  name: An alle Fernbedienungen
  description: Ruft einen ESPHome-Dienst auf allen verbundenen Fernbedienungen auf (esphome.[remote]_[service]).
  fields:
    service:
      name: Dienst
      description: "Teil hinter dem Geraetenamen, z. B. refresh_cover, doorbell_image, remote_show_keyboard"
      required: true
      example: refresh_cover
      selector:
        text:
    data:
      name: Daten
      required: false
      example: '{"door": 1}'
      selector:
        object:
rules:
  name: Schrittweise regeln
  description: "Für Tasten und Folgemodi der Fernbedienung: Licht heller/dunkler, Farbtemperatur, Lüfterstufe, Drehung umschalten."
  fields:
    entity_id:
      name: Entität
      required: true
      selector:
        entity:
          domain: [light, fan]
    type:
      name: Art
      required: true
      selector:
        select:
          options: [brightness, color_temp, speed, oscillation]
    step:
      name: Schritt
      description: "Helligkeit in %, Farbtemperatur in Kelvin, Lüfter in Stufen (negativ = runter/wärmer)"
      required: false
      example: 10
      selector:
        number:
          min: -2000
          max: 2000
remote_log:
  name: Remote-Protokoll über das Dock
  description: "Ruft das Dock auf, wenn eine Remote ohne eigene HA-Verbindung ihr Protokoll funkt (nur mit Debug-Protokoll an). Fehler und Warnungen landen im HA-Protokoll, alle Zeilen im Konfigurator."
  fields:
    geraet:
      name: Gerät
      required: true
      example: remote-wz-wohnzimmer
      selector:
        text:
    z:
      name: Zeilen
      example: "12 I dock: Startseite vom Dock"
      selector:
        text:
          multiline: true
wifi_coming:
  name: Remote schaltet ihr WLAN ein
  description: "Ruft das Dock auf, wenn eine Remote gleich ihr WLAN einschaltet (Sprache an HA, kein Dock). HA verbindet sich dann sofort, sobald sie erreichbar ist."
  fields:
    geraet:
      name: Gerät
      required: true
      example: remote-wz-wohnzimmer
      selector:
        text:
remote_status:
  name: Remote-Werte über das Dock
  description: "Ruft das Dock auf, wenn eine Remote ohne eigene HA-Verbindung ihre Werte funkt (Akku, Ladekabel, Aktivität, Tiefschlaf-Status, Tasten-Konfiguration). Trägt sie in die Entitäten der Remote ein, solange diese nicht selbst verbunden ist."
  fields:
    geraet:
      name: Gerät
      required: true
      example: remote-wz-wohnzimmer
      selector:
        text:
timer_extend:
  name: Timer verlängern
  description: "Startet den zuletzt abgelaufenen Timer (aus der Auswahl der Remotes) neu mit dieser Dauer - für den Knopf „+5 min“ im Timer-Popup."
  fields:
    minutes:
      name: Minuten
      default: 5
      selector:
        number:
          min: 1
          max: 600
timer_restart:
  name: Timer neu starten
  description: "Startet den zuletzt abgelaufenen Timer mit seiner bisherigen Dauer neu (Knopf „Nochmal“ im Timer-Popup)."
blaster_send:
  name: Über fremden IR-/RF-Sender senden
  description: "Schickt einen Rohcode über einen IR-Sender einer anderen Integration (infrared-Entität) oder einen Broadlink (IR oder 433 MHz) - so wie ein Dock. Die Remotes rufen das für Sender auf, die im Konfigurator statt eines Docks gewählt sind."
  fields:
    transmitter:
      name: Sender
      required: true
      selector:
        entity:
          domain: [infrared, remote]
    code:
      name: Code
      description: "Zeiten in Mikrosekunden, + an / - aus, mit Komma getrennt"
      required: true
      selector:
        text:
    carrier:
      name: Trägerfrequenz
      default: 38000
      selector:
        number:
          min: 10000
          max: 500000
    type:
      name: Art
      default: ir
      selector:
        select:
          options: [ir, rf]
    repeat:
      name: Wiederholen
      default: 1
      selector:
        number:
          min: 1
          max: 30
light:
  name: Licht steuern (Licht-Widget)
  description: "Bedienung des Licht-Widgets der Remote: schaltet, dimmt, setzt Farbtemperatur oder Farbe je Lampe nur so weit, wie sie es kann, oder aktiviert eine Szene."
  fields:
    entity_id:
      name: Lampen
      description: "Komma-getrennt, z. B. light.wohnzimmer,light.stehlampe"
      required: true
      selector:
        text:
    action:
      name: Aktion
      description: "on, off, toggle, brightness, kelvin, color or scene"
      required: true
      selector:
        select:
          options: ["on", "off", "toggle", "brightness", "kelvin", "color", "scene"]
    value:
      name: Wert
      description: "brightness: Prozent, kelvin: z. B. 2700, color: Farbton,Sättigung (z. B. 30,100), scene: scene.xyz"
      selector:
        text:

camera_tv:
  name: Kamera auf dem Fernseher
  description: Zeigt eine Kamera als Bild im Bild auf dem Fernseher (Konfigurator > Funktionen), oder blendet sie aus.
  fields:
    tv:
      name: Fernseher
      description: Name des Fernsehers aus dem Konfigurator (Funktionen › Kamera auf dem Fernseher). Leer = der erste.
      required: false
      example: Hisense
      selector:
        text:
    camera:
      name: Kamera
      description: camera.xyz, "last" (zuletzt gezeigte), "next"/"previous" (weiterschalten durch die Kameraliste) oder "off"
      example: last
      selector:
        text:

camera_size:
  name: Kamera-Größe auf dem Fernseher
  description: small, medium, large, almost_full oder "next" (durchschalten). Eine laufende Kamera übernimmt die neue Größe sofort.
  fields:
    tv:
      name: Fernseher
      description: Name des Fernsehers aus dem Konfigurator (Funktionen › Kamera auf dem Fernseher). Leer = der erste.
      required: false
      example: Hisense
      selector:
        text:
    size:
      name: Größe
      example: next
      selector:
        select:
          options: [small, medium, large, almost_full, next]

camera_position:
  name: Kamera-Ecke auf dem Fernseher
  description: Ecke der Kamera (top-left, top-right, bottom-right, bottom-left, center) oder "next" (im Uhrzeigersinn). Eine laufende Kamera rückt sofort.
  fields:
    tv:
      name: Fernseher
      description: Name des Fernsehers aus dem Konfigurator (Funktionen › Kamera auf dem Fernseher). Leer = der erste.
      required: false
      example: Hisense
      selector:
        text:
    position:
      name: Ecke
      example: next
      selector:
        select:
          options: [top-left, top-right, bottom-right, bottom-left, center, next]

restart:
  name: Gerät neu starten (ADB)
  description: Startet ein Android-Gerät neu, das im Konfigurator unter Funktionen eingetragen ist.
  fields:
    device:
      name: Gerät
      description: Name wie im Konfigurator (z. B. Streamer)
      selector:
        text:
