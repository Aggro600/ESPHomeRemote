an_remotes:
  name: An alle Fernbedienungen
  description: Ruft einen ESPHome-Dienst auf allen verbundenen Fernbedienungen auf (esphome.<remote>_<dienst>).
  fields:
    dienst:
      name: Dienst
      description: "Teil hinter dem Geraetenamen, z. B. refresh_cover, doorbell_image, remote_show_keyboard"
      required: true
      example: refresh_cover
      selector:
        text:
    daten:
      name: Daten
      required: false
      example: '{"door": 1}'
      selector:
        object:
regeln:
  name: Schrittweise regeln
  description: "Für Tasten und Folgemodi der Fernbedienung: Licht heller/dunkler, Farbtemperatur, Lüfterstufe, Drehung umschalten."
  fields:
    entity_id:
      name: Entität
      required: true
      selector:
        entity:
          domain: [light, fan]
    art:
      name: Art
      required: true
      selector:
        select:
          options: [helligkeit, farbtemperatur, stufe, drehung]
    schritt:
      name: Schritt
      description: "Helligkeit in %, Farbtemperatur in Kelvin, Lüfter in Stufen (negativ = runter/wärmer)"
      required: false
      example: 10
      selector:
        number:
          min: -2000
          max: 2000
