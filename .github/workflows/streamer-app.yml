# Builds the Streamer app from streamer-app/ (source of custom_components/esphomeremote/streamer_app/*.apk)
name: Streamer app

on:
  push:
    paths: ["streamer-app/**", ".github/workflows/streamer-app.yml"]
  pull_request:
    paths: ["streamer-app/**", ".github/workflows/streamer-app.yml"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - name: Build
        working-directory: streamer-app
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('../custom_components/esphomeremote/streamer_app/version.json'))['code'])")
          BT=$ANDROID_HOME/build-tools/35.0.0 JAR=$ANDROID_HOME/platforms/android-35/android.jar VERSION=$VERSION sh build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: esphomeremote-streamer-ci
          path: streamer-app/build/esphomeremote-streamer.apk
