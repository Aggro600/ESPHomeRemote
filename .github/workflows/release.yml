# Legt zu jedem Versions-Tag (v...) einen GitHub-Release an: Beschreibung aus CHANGELOG.md, dazu die Streamer-App.
# HACS zeigt damit in Home Assistant "Update verfuegbar" mit Versionsnummer und Aenderungen.
# Getaggt und auf den Zweig "stabil" geschoben wird von tools/release.py (Entwickler-Rechner).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Beta oder stabil? (2026-11-12) release.py schiebt erst den Zweig, dann das Tag: liegt der Stand auf "stabil",
      # ist es ein Release fuer alle - sonst eine Beta (Vorab-Release, HACS zeigt sie nur mit "Betas anzeigen").
      - name: Kanal bestimmen
        id: kanal
        run: |
          git fetch origin stabil --depth=1 || true
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/stabil 2>/dev/null; then echo "flag=" >> "$GITHUB_OUTPUT"; echo "stabil"
          else echo "flag=--prerelease" >> "$GITHUB_OUTPUT"; echo "beta"; fi

      - name: Beschreibung aus CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Version $v" > notes.md
          cat notes.md

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ${{ steps.kanal.outputs.flag }} --title "ESPHomeRemote ${GITHUB_REF_NAME#v}${{ steps.kanal.outputs.flag && ' (Beta)' || '' }}" --notes-file notes.md \
            streamer-app/esphomeremote-streamer.apk
