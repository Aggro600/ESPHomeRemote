# =============================================================================
#  Open Remote - Test 5: Homescreen + Menue (D-Pad + Touch)
# =============================================================================
# Homescreen (Touch): Uhr, "jetzt laeuft", MENUe-Button. INFO-Taste (S6) oeffnet
# ebenfalls das Menue (nochmal druecken schliesst).
#
# Menue (D-Pad + Touch):
#   - Hoch/Runter: eine Bedienzeile weiter. Nebeneinanderliegende Buttons
#     (z.B. Rollo Auf/Stop/Zu) zaehlen als EINE Zeile und werden dabei
#     uebersprungen, nicht einzeln durchlaufen.
#   - Links/Rechts: nur innerhalb der aktuellen Zeile, dort umlaufend.
#   - Auswaehlen: OK  (oder Button antippen)
#   - Zurueck: ZURUeCK-Taste (S18)  oder  "< Zurück"-Button unten
#   Der Fokus bleibt IMMER auf einem sichtbaren Button, die Seite scrollt mit.
#
#   Startseite:  [ Raeume ] [ Geraete (IR/BLE) ] [ SmartHome ]
#   Raeume:      [ Wohnzimmer ] [ Schlafzimmer ]
#   Wohnzimmer:  Licht (an/aus, heller/dunkler), Rollo (auf/stop/zu + Status),
#                Media Player
#   Schlafzimmer: Licht (an/aus, heller/dunkler), Rollo (auf/stop/zu + Status)
#   SmartHome:   WZ-Kamera-Testschalter  +  [ Geraete-Einstellungen ]
#   Geraete-Einstellungen: Tastenbeleuchtung an/aus (Standard: aus)
#
# Menue-Position wird 10 s gemerkt: geht man raus und innerhalb 10 s wieder rein
# (Menue-Taste oder Touch), landet man auf derselben Seite.
#
# Klingel-Overlay: sobald input_boolean.haustur_wurde_geklingelt = on, kommt
#   automatisch eine Seite mit "Tuer oeffnen" (lock.open auf lock.haustur).
#
# WICHTIG in HA: dem Geraet die Ausfuehrung von HA-Aktionen erlauben
#   (Einstellungen -> Geraete -> ESPHome -> dieses Geraet -> Zahnrad ->
#    "Diesem Geraet erlauben, Home Assistant Aktionen auszufuehren").
# =============================================================================

substitutions:
  device_name:    "open-remote"          # ESPHome-Node-Name (a-z, 0-9, -)
  friendly_name:  "Open Remote"          # Anzeigename: Bluetooth, WLAN-Fallback, Begruessung
  # ---- Tastenzeiten (ms), EINE Stelle fuer ALLES -----------------------------
  # Gilt fuer die Tastatur, die Tasten-Gesten (Menue-/Aus-Taste), die
  # Mikrofontaste UND den Tasten-Test - der zeigt damit genau das, was auch
  # im Betrieb passiert.
  #   key_debounce_ms  Software-Entprellung des Treibers. 0 = AUS (Stand 2026-09-20): der
  #                    Treiber liest oft mehrere Tastenereignisse auf einmal aus dem Chip
  #                    (alle mit derselben Uhrzeit) und verwarf so das Loslassen eines
  #                    schnellen Doppeldrucks -> Taste "haengt" -> falsches LANG. Den
  #                    Rest entprellt der Tastenchip (TCA8418) selbst.
  #   key_long_ms      So lange gehalten = LANGER Druck. Kuerzer = EINFACHER
  #                    Druck (und auch jeder Einzeltipp eines Doppeldrucks).
  #                    Feuert waehrend des Haltens. Ein normaler Tipp dauert ~80-250 ms;
  #                    wer laenger haelt, kann weder Einfach noch Doppelt meinen.
  #   key_dbl_ms       DOPPELDRUCK: hoechstens so viel Zeit zwischen dem
  #                    Loslassen des ersten und dem Druecken des zweiten Tipps.
  #                    Groesser = man darf langsamer druecken.
  key_debounce_ms: "0"
  key_long_ms:     "400"
  key_dbl_ms:      "160"
  # BLE-Tastatur-Bericht (Stand 2026-09-21, Test): "true" = volle Tastatur (Ziffern
  # UND Buchstaben, fuer Menue > Tastatur), "digits" = nur Ziffern/Enter/Backspace/
  # Leer (Menue > Ziffern; Android sieht keine alphabetische Tastatur), "false" =
  # gar keine (das war der Stand davor). Die Hosts merken sich die Beschreibung pro
  # Kopplung -> nach einer Aenderung Fernbedienung am Host neu koppeln.
  kb_tasten:       "true"
  ent_media:      "media_player.tv_wohnzimmer"
  ent_streamer:   "remote.tv_wohnzimmer_streamer"
  ent_adb:        "media_player.android_tv"
  ent_wz_light:   "light.wohnzimmer"
  ent_wz_cover:   "cover.wohnzimmer_rollo"
  ent_sz_light:   "light.schlafzimmer"
  ent_sz_cover:   "cover.schlafzimmer_rollo"
  ent_ku_cover:   "cover.kuche_rollo"
  ent_doorbell:   "input_boolean.haustur_wurde_geklingelt"
  ent_door_lock:  "lock.haustur"
  # LAN-IP statt homeassistant.local: mDNS-Aufloesung vom ESP32 aus war beim
  # Cover-Art-Download in open-remote.yaml (Prototyp) nicht zuverlaessig
  # genug getestet - lieber die feste interne HA-URL (curl gegen
  # /api/config bestaetigt: internal_url = http://<HA-IP>:8123).
  ha_host:        "<HA-IP>:8123"
  ent_sh_test:    "input_boolean.dashboard_wz_kamera"
  ent_doorbell2:  "input_boolean.wohnungstur_wurde_geklingelt"
  ent_door_lock2: "lock.wohnungstur"
  ent_open_ok1:   "input_boolean.haustur_offnen_erlauben"
  ent_open_ok2:   "input_boolean.wohnungstur_offnen_erlauben"
  ent_sleeptimer: "timer.sleeptimer_auto_off"
  # Signalgeber, ob der Sleeptimer laeuft. Wird nur GELESEN, nie geschaltet.
  ent_sleep_flag: "input_boolean.dashboard_wz_sleeptimer"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # Bringt esp_pm.h fuer die Prozessor-Drosselung mit.
  includes:
    - open-remote-pm.h
    - open-remote-musik.h
    - open-remote-strom.h
    - open-remote-eingabe.h
    - open-remote-sd-bilder.h
  on_boot:
    # Prioritaet 1100: laeuft VOR dem I2C-Bus (setup_priority BUS = 1000).
    # Nach einem Deep-Sleep-Wake zuerst die Holds loesen UND die +VSW-Rail
    # (GPIO38 -> Q4) wieder einschalten - sonst scannt der I2C-Bus (Pull-ups
    # R11/R12 haengen an +VSW) ins Leere ("Recovery failed, SCL held low"),
    # bevor das Display-Component die Rail viel spaeter hochfaehrt.
    # Auf einem Kaltstart schadet das nicht (Rail kommt eh gleich).
    - priority: 1100
      then:
        - lambda: |-
            gpio_deep_sleep_hold_dis();
            const gpio_num_t held[] = {
              GPIO_NUM_38, GPIO_NUM_9, GPIO_NUM_16, GPIO_NUM_6, GPIO_NUM_5, GPIO_NUM_46,
              GPIO_NUM_39, GPIO_NUM_40, GPIO_NUM_41, GPIO_NUM_42,
              GPIO_NUM_48, GPIO_NUM_47, GPIO_NUM_21, GPIO_NUM_14,
              GPIO_NUM_13, GPIO_NUM_12, GPIO_NUM_11, GPIO_NUM_10 };
            for (auto p : held) gpio_hold_dis(p);
            // ext1-Weckpins zuruecksetzen (im Schlaf als RTC-IO gehalten).
            rtc_gpio_hold_dis(GPIO_NUM_1);
            rtc_gpio_deinit(GPIO_NUM_1);
            rtc_gpio_deinit(GPIO_NUM_2);
            // +VSW an: GPIO38 LOW -> Q4 leitet -> Panel/Touch/I2C-Pullups versorgt.
            gpio_set_direction(GPIO_NUM_38, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_38, 0);
            // 300ms statt vorher 180ms (Stand 2026-09-16): OpenRemote hat in
            // seiner eigenen Phantom-Touch-Untersuchung auf genau dieser
            // Chipfamilie (FT5x06/FT6206, dort ebenfalls an der gleichen
            // LCD_EN-Rail wie das Panel haengend) gemessen, dass der
            // Touch-Controller ab Power-on ~300ms braucht, bis er eine
            // stabile kapazitive Nullreferenz hat - bei zu kurzer Wartezeit
            // (dort urspruenglich 5ms, spaeter 120ms) initialisiert er sich
            // noch waehrend das Display schon aktiv ist bzw. eine Hand noch
            // in der Naehe ist, und bleibt danach ueberempfindlich (Serie von
            // Geisterberuehrungen direkt nach dem Aufwachen). the device
            // teilt sich exakt dieselbe Situation (+VSW versorgt Panel UND
            // FT6236 gemeinsam) - deshalb hier dieselbe Korrektur.
            // Quelle: github.com/LORDSn1per/OpenRemote-Firmware,
            // archive/remote-2.0-port/PHANTOM_TOUCH_FINDINGS.md.
            delay(300);   // Panel-Regler + FT6236 einschwingen lassen
    - priority: 900
      then:
        # Weckgrund festhalten, bevor irgendetwas anderes laeuft.
        - lambda: |-
            const auto c = esp_sleep_get_wakeup_cause();
            if (c == ESP_SLEEP_WAKEUP_EXT1) {
              const uint64_t st = esp_sleep_get_ext1_wakeup_status();
              ESP_LOGI("schlaf", "Wake ext1 status=0x%llx -> %s",
                       (unsigned long long) st,
                       (st & (1ULL << 1)) ? "Ladekabel (GPIO1)" :
                       (st & (1ULL << 2)) ? "Bewegung (GPIO2)"  :
                       (st & (1ULL << 8)) ? "Taste (GPIO8)"     : "?");
            } else {
              ESP_LOGI("schlaf", "Wake cause=%d (Timer=%d)", (int) c, (int) ESP_SLEEP_WAKEUP_TIMER);
            }
            // Aufwachen aus dem Tiefschlaf (Timer oder Weckpin) ist KEIN echter
            // Boot -> keine 10-min-Schonfrist, sonst kaeme der Chip nie zum
            // Schlafen. Nur ein Kaltstart / Reset / OTA-Reboot behaelt sie.
            const bool deep_wake = (c == ESP_SLEEP_WAKEUP_TIMER || c == ESP_SLEEP_WAKEUP_GPIO ||
                                    c == ESP_SLEEP_WAKEUP_EXT0  || c == ESP_SLEEP_WAKEUP_EXT1);
            if (deep_wake) id(boot_grace) = false;
            // Aus RTC-Speicher wiederherstellen, ob wir im Tiefschlaf-Modus sind.
            // Der restore_value-Global reicht nicht - er wird evtl. nicht
            // rechtzeitig ins Flash geschrieben, bevor deep_sleep.enter laeuft.
            if (deep_wake && g_deep_active == 0x5EEEu) id(ps_deep) = true;
            if (!deep_wake) g_deep_active = 0;  // echter Boot: Modus geloescht
    - priority: 800
      then:
        - lambda: 'delay(300);'
    - priority: 100
      then:
        # NUR fuer den Mikrofon-A/B-Test (Sabrina vs. BT25, 25.09.2026):
        # Branch claude/modest-gauss-tktz74, NICHT master. Deutlich im Log
        # markiert, damit beim Vergleich sofort klar ist, welcher Build laeuft
        # (ESPHome-Logs bzw. "esphome logs" nach "TESTBUILD" durchsuchen).
        # Nach dem Test: Sabrinas Paket-Import wieder auf @master zeigen lassen,
        # dann verschwindet diese Zeile automatisch mit dem naechsten Flash.
        - lambda: 'ESP_LOGW("TESTBUILD", "=== MIKROFON-A/B-TEST 25.09.2026: Hochpass ~120Hz probeweise an (atv_voice) - branch claude/modest-gauss-tktz74 ===");'
        # Laeuft NACH dem Setup aller Komponenten (auch der Template-Schalter).
        # Echter Boot (nicht Deep-Sleep-Wake) -> Testmodus zwangsweise AUS
        # (Stand 2026-09-16, Nutzerwunsch: echtes Stromsparverhalten als
        # Standard). VORHER stand hier "AN", als Schutz dafuer, dass das
        # Geraet nach jedem Flash/Reset sicher per OTA erreichbar bleibt -
        # das faellt damit weg: nach einem Flash kann das Geraet in den
        # Tiefschlaf gehen und ist dann bis zum naechsten Tastendruck nicht
        # mehr per OTA ansprechbar. Nach einem Deep-Sleep-Wake (boot_grace
        # bereits false) weiterhin unangetastet lassen.
        - if:
            condition: {lambda: 'return id(boot_grace);'}
            then:
              - globals.set: {id: testmodus, value: "false"}
              - lambda: 'ESP_LOGI("test", "Echter Boot -> Testmodus AUS");'
        # Log-Ausfuehrlichkeit aus der Einstellung (Standard INFO).
        - if:
            condition: {lambda: 'return id(ps_log_debug);'}
            then: [{logger.set_level: {level: DEBUG}}]
            else: [{logger.set_level: {level: INFO}}]
        - script.execute: apply_motion_sens
        - script.execute: apply_motion_on
        - script.execute: apply_disp_timeout
        - script.execute: apply_brightness
        - script.execute: apply_activity
        - script.execute: apply_show
        - script.execute: fix_slider_geometry
        - script.execute: apply_assistant
        - script.execute: apply_tts_speaker
        - script.execute: apply_power
        - script.execute: boot_grace_timer
        # Ladezustand direkt aus dem CRATE-Register lesen, damit die
        # Tiefschlaf-Entscheidung gleich beim Booten stimmt (der Sensor
        # braucht sonst bis zu 60 s bis zur ersten Messung).
        - script.execute: refresh_laden
        - script.execute: wake_backlight
        # Kurz warten, bevor die Begruessung kommt: der erste Seitenaufbau
        # von LVGL kann sonst den Wechsel ueberschreiben (seit dem Update
        # auf ESPHome 2026.9 fehlte die Begruessung nach dem Flashen).
        - delay: 700ms
        - lvgl.page.show: {id: page_welcome, animation: FADE_IN, time: 250ms}

# Rev6 microSD: SPI-Modus. GPIO15=SCK, GPIO17=MOSI, GPIO7=MISO, GPIO18=CS,
# GPIO16=SD_EN (Q7-P-MOSFET, LOW=Karte an). SD_DET laeuft ueber TCA8418.
# ACHTUNG: SCK/MOSI/MISO teilen sich die Pins mit dem I2S-Sprachmikrofon (nur 4k7-Serienwiderstaende
# R45-47 trennen sie). Beides gleichzeitig geht nicht: nach dem Einbinden der Karte ist das Mikrofon
# bis zum Neustart tot. Deshalb wird die Karte NUR auf Wunsch eingebunden (Menue > Einstellungen >
# Wartung > SD-Karte) und beim Auswerfen startet die Remote neu.
sd_card:
  id: sdkarte
  clk_pin: GPIO15
  mosi_pin: GPIO17
  miso_pin: GPIO7
  cs_pin: GPIO18
  # KEIN power_pin: SD_EN (GPIO16) gehoert hier dem Schalter sd_power_off (ALWAYS_ON = Karte aus);
  # die Skripte sd_einbinden / sd_auswerfen schalten ihn.
  mount_point: /sd
  # 8 MHz: gemessen 650 KB/s roh, ~215 KB/s ueber FatFS/fread, fehlerfrei (20 MHz laeuft ebenfalls sauber, bringt
  # aber wenig). Die frueher gemessenen ~5 KB/s hatten NICHTS mit dem Takt zu tun: ein stromloses Mikrofon klemmte
  # MISO (GPIO7) nach Low, ESP-IDF wartete vor jedem Befehl 40 ms (poll_busy). Darum bleibt MIC_VDD waehrend der
  # Kartennutzung EIN (siehe sd_einbinden / sd_logo_holen und apply_mic_power).
  frequency: 8000kHz
  mount_on_boot: false        # nie automatisch: die Karte nimmt dem Mikrofon die Pins

# IR-Sender (Rev6): D2 (SFH4346) an Q5-Drain, Q5-Gate = IR_LED = GPIO5, aktiv-LOW
# (GPIO5 LOW -> Q5 EIN -> IR-LED leuchtet). 3R3 Serienwiderstand -> starker Puls.
remote_transmitter:
  id: ir_tx
  pin:
    number: GPIO5
    inverted: true
  carrier_duty_percent: 50%

# IR-Empfaenger (Rev6): U6 TSSP77038, OUT = IR_RX = GPIO4 (ueber R40 2k2),
# Vs = IR_VCC = GPIO6 (switch.ir_rx_power). TSOP-Ausgang ist aktiv-LOW.
# Zum IR-Lernen: IRDB-Befehle durch Anlernen der echten FB in raw umwandeln.
remote_receiver:
  id: ir_rx
  pin:
    number: GPIO4
    inverted: true
    mode: {input: true}
  rmt_symbols: 512
  idle: 12ms
  on_raw:
    then:
      - if:
          condition: {lambda: 'return id(ir_learn_armed) && x.size() >= 6;'}
          then:
            - lambda: |-
                std::string d = id(rc_test_device).state;
                std::string c = id(rc_test_command).state;
                bool ok = id(rc)->learn_capture(d, c, 38000, x);
                id(sd_status)->publish_state(id(rc)->last_result());
                std::string s;
                for (size_t i = 0; i < x.size() && i < 40; i++) { s += std::to_string(x[i]<0?-x[i]:x[i]); s += ' '; }
                id(sd_listing)->publish_state(s);
                id(ir_learn_armed) = false;
                id(ir_rx_power).turn_off();

# OMOTE-Konfigurator-Kompatibilitaet: liest /sd/runtime.json (Geraete, Befehle,
# Aktivitaeten) und fuehrt sie ueber IR (ir_tx) bzw. BLE-HID (kb) aus.
# Die vorhandene LVGL-Menue-Bedienung bleibt - sie ruft nur id(rc)->... auf.
json:

runtime_config:
  id: rc
  sd_card_id: sdkarte
  transmitter_id: ir_tx
  ble_keyboard_id: kb
  path: /runtime.json
  learned_path: /learned.json
  load_on_boot: false
  ir_send_times: 1
  on_load:
    # settings aus der Studio-runtime.json auf unsere Globals uebertragen:
    # Helligkeit, Display-Timeout, Hochheben-Empfindlichkeit.
    - lambda: |-
        const auto &s = id(rc)->settings();
        if (s.brightness >= 0) {
          id(disp_bri) = (int) ((s.brightness * 100 + 127) / 255);
          if (id(disp_bri) < 5) id(disp_bri) = 5;
          if (id(disp_bri) > 100) id(disp_bri) = 100;
        }
        if (s.sleep_seconds >= 0)
          id(disp_timeout_s) = s.sleep_seconds;
        if (s.wake_sensitivity >= 0 && s.wake_sensitivity <= 2)
          id(motion_mode) = s.wake_sensitivity;
        ESP_LOGI("rc", "settings uebernommen: bri=%d timeout=%d wake=%d",
                 id(disp_bri), id(disp_timeout_s), id(motion_mode));
    - script.execute: apply_brightness

# Datengetriebenes Menue aus /sd/menu.json (Weg 3). Widgets werden zur Laufzeit
# in dyn_root (LVGL-Seite page_dyn) erzeugt. HA-Aktionen laufen ueber die
# Trigger unten -> homeassistant.service (version-robust).
menu_ui:
  id: menu
  sd_card_id: sdkarte
  runtime_config_id: rc
  root: dyn_root
  title: dyn_title
  icon_font: mdi_menu
  path: /menu.json
  load_on_boot: false
  on_ha_service:
    - homeassistant.service:
        service: !lambda 'return service;'
        data:
          entity_id: !lambda 'return entity;'
  on_ha_number:
    # value trifft je nach Service auf brightness_pct (Licht) oder position (Rollo).
    - if:
        condition:
          lambda: 'return service == "cover.set_cover_position";'
        then:
          - homeassistant.service:
              service: cover.set_cover_position
              data:
                entity_id: !lambda 'return entity;'
                position: !lambda 'return to_string(value);'
        else:
          - homeassistant.service:
              service: !lambda 'return service;'
              data:
                entity_id: !lambda 'return entity;'
                brightness_pct: !lambda 'return to_string(value);'

esp32:
  board: esp32-s3-devkitc1-n16r8
  flash_size: 16MB
  framework:
    type: esp-idf
    # Pflicht fuer espidf_ble_keyboard: der treibt Bluedroid direkt an und
    # kann sich den Stack mit nichts teilen (kein esp32_ble / NimBLE).
    sdkconfig_options:
      # Fuer die Prozessor-Drosselung. Ohne PM_ENABLE liefert esp_pm_configure
      # nur ESP_ERR_NOT_SUPPORTED. Tickless Idle bleibt AUS - das wuerde die
      # Zeitsteuerung von Display-DMA und Bluetooth beruehren.
      CONFIG_PM_ENABLE: "y"
      CONFIG_BT_ENABLED: "y"
      CONFIG_BT_CONTROLLER_ENABLED: "y"
      CONFIG_BT_BLUEDROID_ENABLED: "y"
      CONFIG_BT_NIMBLE_ENABLED: "n"
      CONFIG_BT_BLE_ENABLED: "y"
      CONFIG_BT_GATTS_ENABLE: "y"
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: "y"
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: "n"
      CONFIG_BT_BLE_42_ADV_EN: "y"
      CONFIG_BT_BLE_42_SCAN_EN: "y"
      CONFIG_BT_BLE_SMP_ENABLE: "y"
      CONFIG_BT_ACL_CONNECTIONS: "4"
      # ESPHomes psram:-Component setzt selbst CONFIG_SPIRAM_USE_CAPS_ALLOC=y
      # (esphome/components/psram/__init__.py) - unter diesem Modus nutzen
      # normales `new`/`malloc` NIEMALS automatisch PSRAM, nur explizite
      # heap_caps_malloc(..., MALLOC_CAP_SPIRAM)-Aufrufe. Live reproduziert:
      # JPEGDEC (~20-30 KB fester Speicher, per plain `new`) ist deshalb
      # zuverlaessig an fragmentiertem INTERNEM Speicher gescheitert
      # (operator new -> bad_alloc -> abort), obwohl reichlich PSRAM frei
      # war. CONFIG_SPIRAM_USE_MALLOC macht malloc/new PSRAM-faehig (ueber
      # der ALWAYSINTERNAL-Schwelle); Nutzer-sdkconfig_options ueberschreiben
      # Component-Defaults nur zuverlaessig, wenn beide Seiten der
      # Kconfig-"choice" (USE_MALLOC/USE_CAPS_ALLOC) explizit gesetzt werden.
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_USE_CAPS_ALLOC: "n"
      # Kleine/zeitkritische Allokationen (< 16 KB) bleiben intern (schneller,
      # kein PSRAM-Cache-Overhead) - der JPEGDEC-Block (>16 KB) faellt darueber
      # automatisch auf PSRAM.
      # 512 statt 16384 (Stand 2026-09-21): unter 16 KB landete ALLES (LVGL-Objekte, Texte,
      # Puffer) im knappen internen RAM - nur noch 7 KB frei, dadurch konnte die Remote
      # ihre Entitaetenliste nicht mehr an HA senden. Jetzt liegt alles ab 512 Byte im PSRAM.
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "512"
      # --- Stapelspeicher-Nachtrag (Core 0), Stand 2026-09-17 -----------------
      # Der urspruengliche Fix (2026-09-16) hat pauschal fuenf Core-0-Tasks auf
      # einmal vergroessert, DARUNTER BTC/BTU (der Bluetooth-Stack selbst - das
      # hat "BLE_INIT: Malloc failed" und kaputte Bluetooth-Verbindungen
      # verursacht, s. Git-Historie) UND diese drei allgemeinen System-Tasks.
      # Nachdem BTC/BTU zurueckgenommen waren, kam ein WEITERER Nutzerhinweis
      # ("Sprachsuche zum Streamer erkennt fast nichts mehr") - die
      # Spracheingabe streamt Audio ebenfalls ueber BLE-Notifications, reagiert
      # also plausibel empfindlich auf genau dieselbe Art Aenderung. Keiner der
      # drei war je einzeln als noetig bestaetigt (nur pauschal mitgezogen, wie
      # BTC/BTU). Deshalb jetzt auch weg - siehe advanced:/loop_task_stack_size
      # unten fuer die einzige Aenderung, die tatsaechlich einzeln ueberprueft
      # wurde (behebt den Absturz beim Erweitern der Startseite nachweislich
      # allein). Kommt der Core-0-Ueberlauf dadurch zurueck, braucht es einen
      # gezielten statt eines pauschalen Fix - z.B. den tatsaechlich
      # ueberlaufenden Task per Taskname im naechsten Absturzbericht
      # identifizieren, dann NUR den anheben.
    advanced:
      # Stapelspeicher der ESPHome-Hauptschleife: 16 KB statt der 8 KB, die
      # ESPHome vorgibt. NICHT der ESP-IDF-Haupttask - ESPHome legt in
      # components/esp32/core.cpp einen eigenen Task "loopTask" an (auf Core 1
      # gepinnt) und laesst dort setup() und App.loop() laufen; LVGL haengt
      # also komplett an DIESEM Stapel.
      #
      # Ursache, sauber nachgewiesen (Stand 2026-09-16): Jeder Versuch, der
      # STARTSEITE ein weiteres Bedienelement hinzuzufuegen, endete
      # reproduzierbar (3 von 3) in einem Boot-Absturz, nach dem der
      # Bootloader automatisch auf die vorherige Firmware zurueckfiel -
      # "esphome logs" zeigte hartnaeckig den alten Kompilierzeitstempel, was
      # zunaechst wie ein Fehler am jeweils hinzugefuegten Widget aussah.
      # Auswertbar wurde es erst, nachdem die firmware.elf des FEHLERHAFTEN
      # Builds VOR dem Flashen weggesichert wurde: der Absturzbericht bezieht
      # sich immer auf den abgestuerzten, nie auf den gerade laufenden Build,
      # und dessen ELF war durch den naechsten Compile laengst ueberschrieben.
      # Aufgeloest ergab sich: panic_abort <- esp_system_abort <-
      # vApplicationStackOverflowHook <- vTaskSwitchContext, gemeldet fuer
      # Core 1 - also ein Stapelueberlauf im loopTask, kein Widget-Fehler.
      #
      # Warum ausgerechnet die Startseite: focus_apply laeuft dort (Fall 0)
      # REKURSIV durch den gesamten Widget-Baum (putzen()), um Markierungen
      # aufzuraeumen. Jedes zusaetzliche Element vertieft diese Rekursion -
      # die Seite lag damit schon vorher hart an der Grenze.
      loop_task_stack_size: 16384

psram:
  mode: octal
  speed: 80MHz

# -----------------------------------------------------------------------------
# Tiefschlaf fuer den Ruhezustand. Standardmaessig AUS - einschaltbar unter
# Einstellungen -> Energie sparen -> "Tiefschlaf im Ruhezustand".
#
# Kein run_duration und KEIN Timer-Wake: der Chip schlaeft AUSSCHLIESSLICH, wenn
# deep_ruhe_timer deep_sleep.enter aufruft, und wacht NUR auf, wenn jemand ihn
# weckt (Nutzerwunsch 2026-09-20: kein Aufwachen von selbst, auch nicht fuer den
# Akkustand).
#
# Weckquellen (Pins in deep_sleep_powerdown per ext1 als gemeinsame ANY_LOW-
# Maske - ESPHomes wakeup_pin kann nur EINEN Pin und wuerde die Maske
# ueberschreiben):
#   - GPIO8 (TCA8418-INT, aktiv LOW): jeder Tastendruck.
#   - GPIO2: Bewegung/Anheben.
#   - GPIO1: Ladekabel.
deep_sleep:
  id: nachtschlaf

external_components:
  - source: {type: local, path: components}
    components: [ili9341_i80, tca8418, max17048, lis3dh, espidf_ble_keyboard, atv_voice, ft63x6, sd_card, runtime_config, menu_ui]

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s
  on_client_connected:
    - globals.set: {id: api_ever, value: "true"}
    - script.execute: wifi_status_text
    # WLAN-Balken sofort auf gruen, nicht erst beim naechsten 10s-RSSI-Update warten -
    # sonst zeigt die Statusleiste nach dem Aufwachen scheinbar volles WLAN, obwohl
    # Home Assistant noch nicht erreichbar ist (Nutzerbeobachtung 2026-09-22).
    - script.execute: refresh_wifi_bars
    # Cover-Einstellungen nach dem Verbinden einmal an HA melden.
    - delay: 5s
    - script.execute: sync_cover_prefs
    - script.execute: cover_sync
    # Neue Firmware live? Dann einmal Ereignis an HA (Automation "Haengelampe blinkt").
    - lambda: |-
        uint32_t h = 2166136261u;
        for (const char *c = __DATE__ " " __TIME__; *c; c++) { h ^= (uint8_t) *c; h *= 16777619u; }
        ESP_LOGI("version", "Firmware-Hash: gespeichert %u, aktuell %u (%s %s)", (unsigned) id(fw_hash), (unsigned) h, __DATE__, __TIME__);
    - if:
        condition:
          lambda: |-
            uint32_t h = 2166136261u;
            for (const char *c = __DATE__ " " __TIME__; *c; c++) { h ^= (uint8_t) *c; h *= 16777619u; }
            return id(fw_hash) != h;
        then:
          - lambda: |-
              uint32_t h = 2166136261u;
              for (const char *c = __DATE__ " " __TIME__; *c; c++) { h ^= (uint8_t) *c; h *= 16777619u; }
              id(fw_hash) = h;
              ESP_LOGI("version", "Neue Firmware live: %s %s", __DATE__, __TIME__);
          - homeassistant.event:
              event: esphome.remote_neue_version
              data:
                geraet: !lambda 'return App.get_name();'
  # Ebenso sofort auf die Warnfarbe umstellen, wenn Home Assistant abhanden kommt - nicht erst
  # nach dem naechsten RSSI-Update oder gar erst, wenn die WLAN-Wache (interval, s.u.) nach 30 s
  # eingreift. Das WLAN selbst kann dabei weiter verbunden sein (bewusst KEIN globals.set auf
  # api_ever - das bleibt "war schon mal da").
  on_client_disconnected:
    - script.execute: refresh_wifi_bars
  services:
    # Von der HA-Automation "ESPHomeRemote: SmartTube Metadaten abfragen"
    # als LETZTER Schritt aufgerufen, NACH shell_command.esphomeremote_
    # smarttube_cover_resize (HA wartet auf dessen Ende, bevor die
    # Automation weiterlaeuft). Vorher loeste adb_title selbst (bei jeder
    # Titelaenderung) den Refetch aus - das lief dem Resize-Skript aber
    # immer einen Schritt hinterher (Titel kam sofort, das neue Bild lag
    # da noch nicht), sichtbar als "Cover vom vorherigen Lied". Getrennt
    # aufgerufen ist die Datei beim Fetch garantiert fertig.
    - service: refresh_cover
      then:
        - online_image.set_url:
            id: mp_cover_image
            url: "http://${ha_host}/local/esphomeremote_smarttube_cover_${device_name}.jpg"
        - lambda: 'id(cover_title) = id(adb_title).state;'
        - lvgl.widget.show: media_cover
        # home_cover_image wird jetzt NICHT mehr parallel hier angestossen,
        # sondern erst in mp_cover_image's on_download_finished/on_error (s.
        # dort) - verhindert zwei gleichzeitige HTTP-Downloads.
    # Live-Bild nachladen (HA hat den Snapshot verkleinert, s. Automation
    # "ESPHomeRemote: Kamerabild fürs Live-Bild").
    - service: cam_image
      then:
        - lambda: 'id(cam_try) = 0;'
        - script.execute: cam_load
    # Klingel-Bild nachladen (aufgerufen von der HA-Automation "ESPHomeRemote:
    # Klingel-Bild ..." kurz nach dem Klingeln, sobald das Foto verkleinert ist).
    # door: 1 = Haustuer, 2 = Wohnungstuer.
    - service: doorbell_image
      variables:
        door: int
      then:
        - if:
            condition: {lambda: "return door == 1;"}
            then:
              - online_image.set_url: {id: db_haus_image, url: "http://${ha_host}/local/esphomeremote_doorbell_haus.jpg"}
            else:
              - online_image.set_url: {id: db_wohn_image, url: "http://${ha_host}/local/esphomeremote_doorbell_wohnung.jpg"}
    # Diagnose-Dienste (Stand 2026-09-17, Nutzerwunsch "mach ne Testinstanz"):
    # loesen dieselbe Aktion aus wie das Halten der Mikrofontaste, aber per
    # HA-Aufruf statt physischem Druck - damit sich eine BLE-Audiositzung zum
    # Streamer auch ohne jemanden vor Ort testen laesst. voice_active setzen
    # + apply_mic_power ausfuehren, SONST bleibt das Mikrofon stromlos (gleiche
    # Bedingung wie beim echten Tastendruck) und es wuerde nur Stille/Muell
    # uebertragen.
    # Ruft jetzt EXAKT denselben Weg wie ein echter Tastendruck auf (statt
    # eigener Kurzfassung) - Stand 2026-09-17: die Kurzfassung zeigte 0
    # Aussetzer, ein echter Tastendruck aber welche ab ~1,2s. Unterschied war
    # vermutlich wake_backlight/die Seitenwechsel-Animation, die die
    # Kurzfassung nie ausgeloest hat.
    - service: mic_test_start
      then:
        - globals.set: {id: assistant, value: "0"}
        - script.execute: voice_start
    - service: mic_test_stop
      then:
        - script.execute: voice_stop
    # OMOTE-runtime.json-Befehle aus Home Assistant / Automationen ausloesen
    - service: remote_send_command
      variables: {device: string, command: string}
      then:
        - lambda: 'id(rc)->send_command_by_name(device, command);'
    - service: remote_run_activity
      variables: {activity: string}
      then:
        - lambda: 'id(rc)->run_activity_by_name(activity);'
    - service: remote_reload_config
      then:
        - script.execute: sd_neuladen

ota:
  - platform: esphome
    password: !secret ota_pw
    # Waehrend eines OTA-Updates niemals schlafen legen und das WLAN nicht
    # abschalten, egal was Tiefschlaf/Stufe 2 sagen.
    on_begin:
      then:
        - globals.set: {id: ota_aktiv, value: "true"}
        # Display wecken und die Update-Seite zeigen (Fortschrittsbalken) - sonst weiss man
        # beim Flashen nicht, warum die Fernbedienung ruckelt oder haengt.
        - script.execute: wake_backlight
        - lvgl.page.show: {id: page_ota, animation: NONE, time: 0ms}
        # WICHTIG: LVGL zeichnet normalerweise nur in seiner eigenen loop(). Waehrend des Updates
        # haengt die Uebertragung aber in der OTA-Schleife - ohne dieses erzwungene Neuzeichnen
        # blieb der Bildschirm dunkel/eingefroren (deshalb hat die Update-Seite bisher nie
        # etwas angezeigt).
        - lambda: |-
            // Hintergrundlicht sofort auf volle Helligkeit, direkt am PWM-Ausgang: light.turn_on
            // blendet ueber die Loop-Schleife auf, die waehrend des Updates steht - war das
            // Display vorher abgedunkelt, blieb es das (Rueckmeldung 2026-09-21).
            id(backlight_pwm)->set_level(1.0f);
            lv_refr_now(nullptr);
            ESP_LOGI("ota", "Update laeuft - Anzeige aktualisiert");
        - script.stop: backlight_idle_timeout
        - script.stop: wifi_ruhe_timer
        - script.stop: ble_ruhe_timer
        - script.stop: deep_ruhe_timer
        - deep_sleep.prevent: nachtschlaf
    on_progress:
      then:
        - lambda: |-
            static int letzt = -1;
            const int pct = (int) x;
            if (pct == letzt) return;
            letzt = pct;
            lv_bar_set_value(id(ota_bar), pct, LV_ANIM_OFF);
            char b[24];
            snprintf(b, sizeof(b), "%d %%", pct);
            lv_label_set_text(id(ota_pct_lbl), b);
            if (pct >= 100) lv_label_set_text(id(ota_hint_lbl), "Fertig - Neustart ...");
            lv_refr_now(nullptr);   // siehe on_begin: die OTA-Schleife laesst LVGL sonst nicht zeichnen
    on_error:
      then:
        - script.execute: go_home
        - globals.set: {id: ota_aktiv, value: "false"}
        - deep_sleep.allow: nachtschlaf
        # Wieder in den normalen Ruhe-/Schlafablauf zuruecklassen.
        - script.execute: backlight_idle_timeout
    # on_end folgt sowieso ein Reboot ins neue Image - nichts aufzuraeumen.

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # NICHT power_save: 'light'/'HIGH' halbieren den ATVV-Durchsatz waehrend
  # des Audio-Streamings (HANDOVER.md, VERSUCH 29).
  # 04.09. von none auf light. "none" heisst: der Funkteil schlaeft nie, auch
  # nicht zwischen zwei Paketen - dauerhaft rund 80-100 mA und damit mit
  # Abstand der groesste Verbraucher. Gemessen wurden 8 % Akku pro Stunde.
  # "none" stand hier wegen der Bluetooth-Koexistenz (eine Antenne fuer beides).
  # Falls Tastendruecke verzoegert ankommen oder die BLE-Verbindung abreisst,
  # ist das die erste Zeile zum Zurueckdrehen.
  power_save_mode: light
  ap: {ssid: "${friendly_name} Fallback", password: !secret ap_password}

captive_portal:

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin

