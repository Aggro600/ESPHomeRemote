  # androidtv_remote: turn_on mit "activity" schaltet den Streamer ein UND
  # oeffnet die App. Deep-Link statt Paketname - das nimmt die Integration direkt.
  # Alle Apps einheitlich ueber ADB auf dem Streamer (Beispiel-IP). Bewusst
  # NICHT gemischt mit Web-Deeplinks: die funktionieren zwar fuer vier der
  # sechs Apps, aber SmartTube und Kodi haben keinen, und zwei Verfahren
  # nebeneinander waeren nur eine Fehlerquelle mehr.
  #   "am start -a android.intent.action.MAIN -c android.intent.category.
  #   LAUNCHER -p <paket>" startet ueber den Paketnamen und braucht den
  #   Activity-Namen nicht - genau wie das vorher genutzte "monkey -p <paket>
  #   -c android.intent.category.LAUNCHER 1".
  # UMGESTELLT (Stand 2026-09-16, Nutzerwunsch "Apps oeffnen zu langsam"):
  # monkey ist eigentlich ein UI-Fuzzing-Testwerkzeug, kein App-Starter - es
  # faehrt beim Start sein komplettes Event-Injection-Subsystem hoch, bevor
  # es den einen Tap absetzt, der die App oeffnet. "am start" ruft direkt den
  # Activity Manager auf, ohne diesen Umweg - bei OpenRemote (s. dessen
  # GitHub-Firmware) gibt es dafuer kein Vorbild, das Projekt hat ueberhaupt
  # keinen ADB-App-Start, nur HID-Fernbedienung + IR - "am start" ist der in
  # der Android-Welt uebliche schnelle Weg, unabhaengig davon.
  # Paketnamen alle am Geraet ausgelesen, keiner geraten.
  # KORRIGIERT (Stand 2026-09-19): "am start -p <paket>" ist ein IMPLIZITER
  # Intent, und der findet nur Activities, die CATEGORY_DEFAULT deklarieren
  # (am Geraet mit "cmd package resolve-activity" geprueft: isDefault=true nur
  # bei SmartTube und YouTube). Kodi, Netflix, Disney+, Prime und RTL haben
  # isDefault=false - dort meldete am start "unable to resolve Intent" und
  # tat nichts. Deshalb bei diesen fuenf die Activity explizit mit -n
  # <paket>/<activity> angeben (jeweils am Streamer ausprobiert, alle starten).
  - {id: svc_app_smarttube, then: [{homeassistant.service: {service: androidtv.adb_command, data: {entity_id: "${ent_adb}", command: "am start -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p org.smarttube.stable"}}}]}
  # Beendet die laufende App auf dem Streamer wirklich (am force-stop auf die
  # per app_id ermittelte, gerade laufende App) - Taste 41 lang gedrueckt,
  # s. gesture_action. Logik (welche App, Sicherheitsausschluss Launcher)
  # steckt im HA-Skript script.esphomeremote_streamer_close_app
  # (packages/esphomeremote_smarttube.yaml), nicht hier - das braucht Jinja-
  # Templating auf den aktuellen app_id-Attributwert, das ein roher
  # homeassistant.service-Aufruf vom ESP32 aus nicht selbst ausfuehren kann.
  - {id: svc_streamer_close_app, then: [{homeassistant.service: {service: script.esphomeremote_streamer_close_app}}]}
  - {id: svc_app_youtube, then: [{homeassistant.service: {service: androidtv.adb_command, data: {entity_id: "${ent_adb}", command: "am start -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p com.google.android.youtube.tv"}}}]}
  - {id: svc_app_netflix, then: [{homeassistant.service: {service: androidtv.adb_command, data: {entity_id: "${ent_adb}", command: "am start -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n com.netflix.ninja/.MainActivity"}}}]}
  - {id: svc_app_disney, then: [{homeassistant.service: {service: androidtv.adb_command, data: {entity_id: "${ent_adb}", command: "am start -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n com.disney.disneyplus/com.bamtechmedia.dominguez.main.MainActivity"}}}]}
  - {id: svc_app_kodi, then: [{homeassistant.service: {service: androidtv.adb_command, data: {entity_id: "${ent_adb}", command: "am start -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n org.xbmc.kodi/.Splash"}}}]}
  - {id: svc_app_rtl, then: [{homeassistant.service: {service: androidtv.adb_command, data: {entity_id: "${ent_adb}", command: "am start -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n de.rtli.tvnow/com.bedrockstreaming.shared.tv.activity.SplashActivity"}}}]}
  - {id: svc_app_prime, then: [{homeassistant.service: {service: androidtv.adb_command, data: {entity_id: "${ent_adb}", command: "am start -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n com.amazon.amazonvideo.livingroom/com.amazon.ignition.IgnitionActivity"}}}]}
  - {id: svc_door_open,  then: [{homeassistant.service: {service: lock.open,            data: {entity_id: "${ent_door_lock}"}}}]}
  - {id: svc_door_open2, then: [{homeassistant.service: {service: lock.open,            data: {entity_id: "${ent_door_lock2}"}}}]}
  - {id: svc_open_ok1,   then: [{homeassistant.service: {service: input_boolean.toggle,  data: {entity_id: "${ent_open_ok1}"}}}]}
  - {id: svc_open_ok2,   then: [{homeassistant.service: {service: input_boolean.toggle,  data: {entity_id: "${ent_open_ok2}"}}}]}
  # Abbrechen, NICHT timer.finish - finish wuerde die Auto-Aus-Automation ausloesen.
  - {id: svc_sleep_cancel, then: [{homeassistant.service: {service: script.turn_on,       data: {entity_id: "script.sleeptimer_abbrechen"}}}]}
  # timer.change wirkt nur auf einen LAUFENDEN Timer und tut im Leerlauf nichts.
  # timer.start setzt ihn auf glatte 30 Minuten - und ist genau der Punkt, auf
  # den die Automation "NestHub Dash Sleeptimer Ein" triggert
  # (timer.started -> input_boolean.dashboard_wz_sleeptimer an).
  - {id: svc_sleep_plus30, then: [{homeassistant.service: {service: timer.start, data: {entity_id: "${ent_sleeptimer}", duration: "00:30:00"}}}]}

# --- Mikrofon-/SD-Stromversorgung (Rev6) -------------------------------------
# GPIO45 = MIC_VDD (active-high, gegen das Rev6-PCB verifiziert: U7 Pad 26).
# GPIO16 = SD_EN (active-low, HIGH = Karte aus, gibt die geteilten I2S-Pins frei).
# GPIO18 = SD_CS, von der Firmware vor jeder Mic-Nutzung auf HIGH gezogen.
switch:
  - platform: gpio
    id: mic_power
    # Nicht mehr direkt in Home Assistant - stattdessen der verstaendliche
    # Schalter "Mikrofon stumm" weiter unten. Der Zustand wird von
    # apply_mic_power gesetzt (erlaubt UND Display wach), deshalb hier kein
    # ALWAYS_ON mehr.
    internal: true
    pin: GPIO45
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: sd_power_off
    # Interner Aufbau (gibt die geteilten I2S-Pins frei), nichts zum Schalten.
    internal: true
    pin: GPIO16
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: sd_cs_idle
    internal: true
    pin: GPIO18
    restore_mode: ALWAYS_ON

  # Konfig-Modus: startet fuer 10 Minuten einen HTTP-Endpunkt (/sd/api/...) zum Hoch-/Runterladen von
  # runtime.json / menu.json auf die SD-Karte. KEIN Dauer-Webserver (Strom). Waehrend des Fensters kein
  # Tiefschlaf (ota_aktiv). Der Schalter spiegelt den echten Zustand.
  - platform: template
    name: "Konfig-Modus (HTTP)"
    icon: "mdi:cloud-upload"
    entity_category: config
    lambda: 'return id(sdkarte)->http_active();'
    turn_on_action:  [{script.execute: sd_konfig_start}]
    turn_off_action: [{script.stop: sd_konfig_start}, {script.execute: sd_konfig_stop}]
  # IR-Empfaenger-Versorgung (Rev6). GPIO6 = IR_VCC, speist U6 (TSSP77038) Pin 3
  # (Vs) DIREKT vom ESP-Pin - kein Load-Switch. Netz gegen den Rev6-Schaltplan
  # geprueft (U7 Pad 6 -> IR_VCC -> U6 Vs + C12). Aktiv HIGH = Empfaenger an.
  # Diese Firmware wertet noch kein IR aus -> Standard AUS. Die Referenz-Firmware
  # schaltet den Empfaenger im Schlaf hart ab ("+60 uA sonst"); hier ist er auch
  # im Wachbetrieb aus, bis IR-Empfang dazukommt - dann diesen Schalter an.
  # IR_RX (GPIO4) bleibt undeklariert = Eingang, kann so keinen Querstrom ziehen.
  - platform: gpio
    id: ir_rx_power
    name: "IR-Empfaenger Strom"
    icon: "mdi:remote"
    pin: GPIO6
    restore_mode: RESTORE_DEFAULT_OFF

  # Datenschutz: kappt die Versorgung des Mikrofons komplett. Solange er an
  # ist, kann der Chip physisch nichts aufnehmen - das ist mehr als eine
  # Software-Stummschaltung.
  # Assistentenwahl auch aus Home Assistant heraus.
  - platform: template
    name: "Assistent: Home Assistant"
    icon: "mdi:home-assistant"
    lambda: 'return id(assistant) == 1;'
    turn_on_action:
      - lambda: 'id(assistant) = 1;'
      - script.execute: apply_assistant
    turn_off_action:
      - lambda: 'id(assistant) = 0;'
      - script.execute: apply_assistant

  - platform: template
    name: "Mikrofon stumm"
    icon: "mdi:microphone-off"
    # Fragt den Merker ab, nicht die Versorgung - die folgt zusaetzlich dem
    # Display und wuerde den Schalter sonst von selbst umlegen.
    lambda: 'return !id(mic_allowed);'
    turn_on_action:
      - globals.set: {id: mic_allowed, value: "false"}
      - script.execute: apply_mic_power
    turn_off_action:
      - globals.set: {id: mic_allowed, value: "true"}
      - script.execute: apply_mic_power

  # Tiefschlaf im Ruhezustand - derselbe Schalter wie unter Einstellungen ->
  # Energie sparen, nur zusaetzlich aus Home Assistant erreichbar (praktisch
  # fuer Fernwartung: aus = Geraet bleibt sicher online, an = Akku schonen).
  - platform: template
    name: "Tiefschlaf im Ruhezustand"
    icon: "mdi:power-sleep"
    # DISABLED: der Schalter spiegelt nur das Global, das Global ist die
    # Wahrheit. Ohne das ruft der Schalter beim Boot turn_off_action und wuerde
    # ps_deep bei jedem Neustart (auch nach jedem Deep-Sleep-Wake!) auf false
    # zwingen.
    restore_mode: DISABLED
    lambda: 'return id(ps_deep);'
    turn_on_action:
      - lambda: 'id(ps_deep) = true; g_deep_active = 0x5EEEu;'
      - script.execute: apply_power
      # Den Ruhe-/Schlafablauf neu anstossen, damit der Tiefschlaf auch dann
      # greift, wenn das Display schon aus ist.
      - script.execute: backlight_idle_timeout
    turn_off_action:
      - lambda: 'id(ps_deep) = false; g_deep_active = 0;'
      - script.execute: apply_power

  # Spiegel von home_cams_visible fuer HA - die eigentliche Bedienung ist der
  # Ein-/Ausblenden-Button direkt auf der Startseite (script apply_home_layout).
  - platform: template
    name: "Startseite: Kamera-Buttons zeigen"
    icon: "mdi:cctv"
    restore_mode: DISABLED
    lambda: 'return id(home_cams_visible);'
    turn_on_action:
      - lambda: 'id(home_cams_visible) = true;'
      - script.execute: apply_home_layout
    turn_off_action:
      - lambda: 'id(home_cams_visible) = false;'
      - script.execute: apply_home_layout

  # Testmodus (Sicherheitsnetz): AN = Tiefschlaf und "WLAN aus im Ruhezustand"
  # sind komplett ausgehebelt, das Geraet bleibt immer per WLAN erreichbar und
  # flashbar. AUS = echtes Stromsparverhalten (fuer Akku-Messungen).
  # restore_mode DISABLED + Global restore_value:false/initial:true =>
  # nach JEDEM Boot wieder AN (sicherer Ausgangszustand).
  - platform: template
    name: "Testmodus (immer online)"
    icon: "mdi:shield-check"
    restore_mode: DISABLED
    lambda: 'return id(testmodus);'
    turn_on_action:
      - globals.set: {id: testmodus, value: "true"}
      - lambda: 'ESP_LOGI("test", "Testmodus AN - kein Tiefschlaf, kein WLAN-Aus");'
      - script.execute: apply_power
    turn_off_action:
      - globals.set: {id: testmodus, value: "false"}
      - lambda: 'ESP_LOGW("test", "Testmodus AUS - Stromsparfunktionen aktiv");'
      - script.execute: apply_power
      - script.execute: backlight_idle_timeout

  # Spiegel der drei Geraete-Toggles fuer HA (fuer Messungen aus der Ferne).
  - platform: template
    name: "Sparen: WLAN-Sparmodus"
    icon: "mdi:wifi-cog"
    restore_mode: DISABLED
    lambda: 'return id(ps_wifi);'
    turn_on_action:  [{globals.set: {id: ps_wifi, value: "true"}},  {script.execute: apply_power}]
    turn_off_action: [{globals.set: {id: ps_wifi, value: "false"}}, {script.execute: apply_power}]
  - platform: template
    name: "Sparen: WLAN aus im Ruhezustand"
    icon: "mdi:wifi-off"
    restore_mode: DISABLED
    lambda: 'return id(ps_wifi_off);'
    turn_on_action:  [{globals.set: {id: ps_wifi_off, value: "true"}},  {script.execute: apply_power}]
    turn_off_action: [{globals.set: {id: ps_wifi_off, value: "false"}}, {wifi.enable:}, {script.execute: apply_power}]
  - platform: template
    name: "Sparen: Prozessor drosseln"
    icon: "mdi:speedometer-slow"
    restore_mode: DISABLED
    lambda: 'return id(ps_cpu);'
    turn_on_action:  [{globals.set: {id: ps_cpu, value: "true"}},  {script.execute: apply_cpu}, {script.execute: apply_power}]
    turn_off_action: [{globals.set: {id: ps_cpu, value: "false"}}, {script.execute: apply_cpu}, {script.execute: apply_power}]

  # BLE-Verbindung im Ruhezustand verlangsamen (Intervall 150 ms, Latency 3).
  - platform: template
    name: "BLE-Verbindung verlangsamen"
    icon: "mdi:bluetooth-settings"
    restore_mode: DISABLED
    lambda: 'return id(ps_bleidle);'
    turn_on_action:
      - globals.set: {id: ps_bleidle, value: "true"}
      - script.execute: apply_power
      - if:
          condition:
            lambda: 'return id(disp_off) && !id(voice_active) && !id(host_mic);'
          then: [{lambda: 'id(kb).request_conn_profile(true);'}]
    turn_off_action:
      - globals.set: {id: ps_bleidle, value: "false"}
      - lambda: 'id(kb).request_conn_profile(false);'
      - script.execute: apply_power

# --- I2S-Mikrofon (MS3625, Rev6) ---------------------------------------------
# Pins aus dem Rev6-PCB: SD_SCK=IO15, SD_MOSI=IO17, SD_MISO=IO7. L/R liegt auf
# GND -> linker Slot. NICHT gegen die Referenz-Firmware pruefen, die ist Rev5
# und hat gar kein Mikrofon.
i2s_audio:
  - id: i2s_mic_bus
    i2s_lrclk_pin: GPIO17
    i2s_bclk_pin: GPIO15

microphone:
  - platform: i2s_audio
    id: remote_mic
    i2s_audio_id: i2s_mic_bus
    adc_type: external
    i2s_din_pin: GPIO7
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    # 04.09. dreimal geprueft, zuletzt mit nachweislich freien Leitungen:
    # links UND rechts liefern exakt Null. Das ist nicht der Kanal, sondern ein
    # frei liegender L/R-Anschluss - dann sendet das MS3625 in keinem
    # Zeitfenster. 'left' ist richtig, sobald L/R Masse hat.
    channel: left
    correct_dc_offset: true

# --- Sprachassistent von Home Assistant --------------------------------------
# Laeuft ueber die ESPHome-API, nicht ueber Bluetooth. Teilt sich das Mikrofon
# mit atv_voice: dessen Datenrueckruf steigt aus, solange dort nichts laeuft
# (Zustand ATVV_IDLE), und umgekehrt greift dieser hier nur waehrend einer
# eigenen Abfrage. Gleichzeitig benutzen laesst sich beides nicht - deshalb
# schaltet die Fernbedienung zwischen ihnen um.
# Kein Lautsprecher an Bord: Antworten kommen nicht auf der Fernbedienung,
# sondern werden von der Pipeline in Home Assistant ausgegeben.
voice_assistant:
  id: ha_voice
  microphone:
    microphone: remote_mic
    bits_per_sample: 16
    channels: [0]
  # Gleicher Verstaerkungsfaktor wie beim ATV-Mikrofon (atv_voice: gain: 6.5,
  # dort live gegen Clipping/Stille durchprobiert - s. Kommentar dort). Ohne
  # eigenes volume_multiplier bleibt der Standard 1.0 (kein Boost): dasselbe
  # Rohsignal vom I2S-Mikrofon (remote_mic), aber ohne die Verstaerkung, die
  # sich beim ATV-Pfad als noetig erwiesen hat - passender Verdacht fuer
  # Nutzerhinweis 2026-09-18 "scheint mich etwas schwer zu verstehen"
  # (schwaches/leises Signal verschlechtert die STT-Erkennung deutlich).
  volume_multiplier: 6.5
  on_start:
    - lambda: 'ESP_LOGI("assi", "Home-Assistant-Abfrage gestartet");'
    - script.execute: wake_backlight
    - lvgl.label.update: {id: voice_you,    text: "..."}
    - lvgl.label.update: {id: voice_answer, text: "hört zu"}
    - lvgl.page.show: {id: page_voice, animation: FADE_IN, time: 150ms}
  on_stt_end:
    - lambda: 'ESP_LOGI("assi", "verstanden: %s", x.c_str());'
    - lvgl.label.update: {id: voice_you, text: !lambda 'return x;'}
    - lvgl.label.update: {id: voice_answer, text: "denkt nach"}
  on_tts_start:
    - lambda: 'ESP_LOGI("assi", "Antwort: %s", x.c_str());'
    - lvgl.label.update: {id: voice_answer, text: !lambda 'return x;'}
    - lambda: 'lv_obj_scroll_to_y(id(voice_box), 0, LV_ANIM_OFF);'
  # on_tts_end liefert die Adresse der fertigen Sprachdatei. Die schicken wir
  # an den Lautsprecher im Wohnzimmer - so spricht der Raum, waehrend die
  # Fernbedienung den Text zeigt. Ziel vom Nutzer vorgegeben; der Anzeigename
  # lautet "Tablet Wohnzimmer", was in die Irre fuehren kann.
  on_tts_end:
    - if:
        condition: {lambda: "return id(tts_speaker);"}
        then:
          - homeassistant.service:
              service: media_player.play_media
              data:
                entity_id: "media_player.wohnzimmer"
                media_content_type: "music"
              data_template:
                media_content_id: "{{ url }}"
              variables:
                url: !lambda 'return x;'
          - lambda: 'ESP_LOGI("assi", "Antwort an die Wohnzimmer-Lautsprecher: %s", x.c_str());'
  on_error:
    - lambda: 'ESP_LOGW("assi", "Fehler: %s - %s", code.c_str(), message.c_str());'
    - lvgl.label.update: {id: voice_answer, text: !lambda 'return std::string("Fehler: ") + message;'}
  # Erst wenn die Pipeline wirklich fertig ist, faellt der Mikrofonstrom weg.
  on_end:
    - lambda: 'ESP_LOGI("assi", "Abfrage beendet");'
    - globals.set: {id: voice_active, value: "false"}
    - script.execute: apply_mic_power
    - lambda: 'id(kb).set_rssi_paused(false);'

# --- BLE-HID-Tastatur (4 Host-Slots) -----------------------------------------
espidf_ble_keyboard:
  id: kb
  # Name, unter dem sich die Fernbedienung per Bluetooth meldet (Nutzerwunsch
  # 2026-09-17, vorher "OpenRemote"). Achtung: gekoppelte Hosts merken sich den
  # alten Namen - Fernseher, Streamer und Tablet zeigen ihn bis zum erneuten
  # Koppeln weiter an.
  device_name: "${friendly_name}"
  host_slots: 4
  # Ohne Zeigegeraet melden. Android TV schaltet die Oberflaeche um, sobald ein
  # Zeigegeraet auftaucht - YouTube und der Launcher bauen ihr Bild dann bei
  # jedem Verbinden komplett neu auf. Echte Fernbedienungen melden nur Tastatur
  # und Medientasten. Achtung: der Host merkt sich die Geraetebeschreibung pro
  # Kopplung, nach dieser Aenderung muss neu gekoppelt werden.
  pointer: false
  # Auch die Tastatur weg. Wir brauchen sie nicht - D-Pad, OK, Zurueck, Home,
  # Lautstaerke und Transport laufen alle ueber die Medientasten-Seite
  # (consumer:0x00xx). Android behandelt eine angeschlossene Tastatur wie eine
  # Konfigurationsaenderung, woraufhin laufende Apps ihre Oberflaeche neu
  # aufbauen - genau das "Bild laedt neu" beim Verbinden.
  alpha_keyboard: ${kb_tasten}
  keyboard_layout: de
  web_control: false

# --- Android TV Voice (ATVV) -------------------------------------------------
atv_voice:
  id: voice
  keyboard_id: kb
  microphone: remote_mic
  codec: adpcm_16k
  agc: false
  # 04.09. eingeschaltet, nachdem der Mitschnitt es belegt hat: 19 von 58
  # Sprachabfragen wurden beschnitten, im schlimmsten Fall zu 11,6 %. Die
  # Verstaerkung bleibt bewusst bei 6.5 - beim ersten Versuch heute hatte ich
  # sie gleichzeitig auf 4.0 gesenkt, und DAS hat die Erkennung verschlechtert,
  # nicht die Begrenzung. Unterhalb des Knies (15000, rund 46 % Vollausschlag)
  # bleibt alles unveraendert; der gemessene Mittelwert liegt darunter.
  soft_limit: true
  # Der Fernseher kann die Aufnahme auch selbst anfordern - etwa das
  # Mikrofonsymbol in SmartTube, statt die Taste an der Fernbedienung zu
  # halten. Dann laeuft der Strom fuer das Mikrofon nicht, weil apply_mic_power
  # ihn nur waehrend einer eigenen Abfrage anlegt: der Fernseher bekam Stille.
  # Jetzt wird bei MIC_OPEN erst eingeschaltet, dann nach der Anlaufzeit
  # gestreamt, und am Ende faellt der Strom wieder weg.
  host_warmup: 250ms
  on_host_open:
    - globals.set: {id: host_mic, value: "true"}
    - globals.set: {id: voice_active, value: "true"}
    - script.execute: apply_mic_power
    - script.execute: wake_backlight
    - lvgl.label.update: {id: voice_you,    text: "Sprich jetzt"}
    - lvgl.label.update: {id: voice_answer, text: "Der Fernseher hat das Mikrofon angefordert. Das Erkannte erscheint auf dem Fernseher."}
    - lvgl.page.show: {id: page_voice, animation: FADE_IN, time: 150ms}
    - lambda: 'ESP_LOGI("assi", "Fernseher fordert das Mikrofon an");'
  on_stream_end:
    - globals.set: {id: host_mic, value: "false"}
    - globals.set: {id: voice_active, value: "false"}
    - script.execute: apply_mic_power
    - lambda: 'ESP_LOGI("assi", "Aufnahme fuer den Fernseher beendet - Mikrofon aus");'
    - delay: 1200ms
    - if:
        condition: {lambda: "return id(cur_page) == 26 && !id(host_mic);"}
        then: [{script.execute: go_home}]
  # 04.09. nach den ersten echten Sprachtests von 6.5 gesenkt. Gemessen wurden
  # Rohspitzen bis 16752 - mal 6,5 sind das 108888 gegen eine Grenze von 32767,
  # entsprechend Uebersteuerung in JEDEM lauten Durchlauf. Die AGC faengt das
  # nicht ab: sie regelt auf eine geglaettete Huellkurve (~1000) statt auf die
  # Spitzen, rechnet daraus 16000/1000 = 16, deckelt auf 6,5 und nimmt deshalb
  # nie zurueck - im Log durchgehend "AGC gain 6.5-6.5x" trotz clipping.
  # Abgeschnittene Spitzen sind bei ADPCM besonders teuer, weil der Decoder
  # danach mit falschem Praediktor weiterlaeuft.
  # ZURUECKGESETZT auf den belegt funktionierenden Stand von 2026-09-03
  # ("Sprachsuche am TV bestaetigt: Erkennung kommt durch"). Heutige Versuche
  # mit 3.0, 4.0 und 10.0 haben die Erkennung nur verschlechtert.
  gain: 6.5
  max_duration: 10s
  sync_interval: 0
  send_hid_key: false

# --- Tastenmatrix ------------------------------------------------------------
tca8418:
  id: keypad
  address: 0x34
  # GPIO8 ist zugleich Weckpin fuer den Tiefschlaf - aber ueber die ext1-Maske
  # in deep_sleep_powerdown (esp_sleep_enable_ext1_wakeup), nicht ueber eine
  # zweite ESPHome-Pin-Deklaration. Daher hier kein allow_other_uses noetig.
  interrupt_pin:
    number: GPIO8
  rows: 5
  columns: 5
  extra_gpi_pins: [5]
  debounce: ${key_debounce_ms}ms
  long_press: ${key_long_ms}ms
  on_key:
    - then:
        # Zustand VOR dem Wecken festhalten - wake_backlight setzt disp_off
        # sofort zurueck.
        - lambda: 'id(key_was_dark) = id(disp_off);'
        - script.execute: wake_backlight
        - lambda: |-
            id(last_input_ms) = millis();
            // Roh-Ereignis mit Zeitstempel (Fehlersuche Doppel/Einzel-Erkennung).
            ESP_LOGD("taste", "%d %s t=%u", (int) keycode, pressed ? "runter" : "hoch", (unsigned) millis());
            // ---- Reinigungsmodus: alle Tasten gesperrt, nur Zurueck LANG bricht ab.
            if (id(clean_mode)) {
              if (!pressed && keycode == 13 && long_press) id(clean_mode) = false;
              return;
            }
            // ---- Touch-Test: nur die Zurueck-Taste beendet ihn, alles andere ignorieren.
            if (id(cur_page) == 36) {
              if (pressed && keycode == 13) id(nav_back)->execute();
              return;
            }
            // ---- EINE Tasten-Logik fuer alle Gesten-Tasten UND den Tasten-Test ----
            // einfach / doppelt / lang, Zeiten zentral (key_long_ms, key_dbl_ms):
            //  - LANG feuert schon beim Halten, sobald key_long_ms erreicht sind
            //    (gesture_long) - nicht erst beim Loslassen.
            //  - DOPPELT: der zweite Druck beginnt innerhalb key_dbl_ms nach dem
            //    Loslassen des ersten.
            //  - EINFACH: entscheidet sich beim Loslassen; bei Tasten MIT Doppel-
            //    Aktion erst nach key_dbl_ms (sonst sofort).
            // Gesten-Tasten: Menue (31), Aus (102), Mikrofon (45) und die Taste rund
            // ums D-Pad (41, nur Startseite). Im Tasten-Test gilt dasselbe fuer ALLE
            // Tasten (nur Anzeige, nichts geht an einen Host) - er zeigt also genau,
            // was die Tasten im Betrieb erleben. Die Aktionen stehen in gesture_action.
            const bool test = id(button_test_mode);
            auto ist_geste  = [](int k, int seite) { (void) seite; return k == 31 || k == 102 || k == 45 || k == 41; };
            auto mit_doppel = [](int k) { return k == 45 || k == 102; };
            if (test || ist_geste(keycode, id(cur_page))) {
              const bool dbl_ok = test || mit_doppel(keycode);
              id(held_key) = 0;
              if (pressed) {
                // Zeit selbst messen: die Tastatur meldet die Haltedauer erst
                // beim Loslassen, wir wollen aber frueher ausloesen.
                id(gest_held) = keycode;
                id(gest_done) = false;
                id(bt_press_ms) = millis();
                // Zweiter Tipp innerhalb key_dbl_ms: Warte-Skript stoppen, das
                // Loslassen entscheidet dann "doppelt".
                id(gest_dbl) = (dbl_ok && id(gest_last_key) == keycode &&
                                (millis() - id(gest_last_ms)) < ${key_dbl_ms});
                if (id(gest_dbl)) id(gesture_single)->stop();
                id(gesture_long)->execute();
                return;
              }
              id(gesture_long)->stop();
              id(gest_held) = 0;
              const uint32_t jetzt = millis();
              if (id(gest_done)) {
                // Der lange Druck hat waehrend des Haltens bereits gefeuert.
                id(gest_done) = false;
                id(gest_last_key) = 0;
                // Mikrofon: Loslassen beendet die Aufnahme. voice_want SOFORT
                // loeschen (voice_stop hat im Google-Zweig ein delay von 1500 ms).
                if (!test && keycode == 45) {
                  id(voice_want) = false;
                  id(voice_stop)->execute();
                }
              } else if (id(gest_dbl) && id(gest_last_key) == keycode) {
                id(gesture_single)->stop();
                id(gest_key) = keycode; id(gest_kind) = 2;
                id(gest_last_key) = 0;
                id(gesture_action)->execute();
              } else if (dbl_ok) {
                id(gest_last_key) = keycode; id(gest_last_ms) = jetzt;
                id(gest_key) = keycode;
                id(gesture_single)->execute();      // wartet auf einen zweiten
              } else {
                id(gest_key) = keycode; id(gest_kind) = 0;
                id(gesture_action)->execute();      // sofort
              }
              return;
            }

            // Loslassen: gehaltene Taste am Fernseher freigeben und eine
            // laufende Menue-Wiederholung beenden.
            if (!pressed) {
              if (keycode == id(held_key)) id(held_key) = 0;
              id(kb).execute_action("release");
              return;
            }

            // War das Display dunkel, weckt der erste Druck einer MENUE-Taste
            // nur auf, statt gleich zu navigieren. Alle anderen Tasten -
            // Lautstaerke, Mute, Transport, Power, Sprachsuche - wirken sofort
            // wie gewohnt.
            //
            // Das gilt aber NUR, solange das Menue im Hintergrund noch offen
            // ist (Merk-Fenster, cur_page != 0). Auf der Startseite steuert das
            // D-Pad den Fernseher - dort gibt es nichts zu verschlucken, der
            // Druck muss durchgehen, sonst kommt beim ersten Mal kein Befehl
            // bei Fernseher/Google an.
            if (id(key_was_dark) && id(cur_page) != 0) {
              switch (keycode) {
                case 14: case 35: case 15: case 32: case 34: case 13: case 31:
                  id(held_key) = 0;
                  return;
                default: break;
              }
            }

            id(cur_key) = keycode;
            id(dispatch_key)->execute();

            // Software-Wiederholung nur noch fuer die MENUE-Navigation. Am
            // Fernseher wiederholt jetzt das Geraet selbst, weil die Taste dort
            // wirklich gehalten wird.
            // Eine Rate fuer alles: D-Pad, Zurueck, Home, Lautstaerke und
            // Transport wiederholen im selben Takt. OK nicht - das wird
            // gehalten statt getippt.
            // Auf der STARTSEITE haelt jetzt der Fernseher die Taste selbst -
            // dort darf die Software nicht zusaetzlich wiederholen, sonst
            // kaeme beides uebereinander. Im MENUE bleibt die eigene
            // Wiederholung, dort gibt es kein Geraet, das sie uebernimmt.
            // Auch im Menue: alle Tasten ausser der Navigation wie auf der Startseite
            // (echtes Halten am Geraet, keine Software-Wiederholung).
            const bool nav_taste2 = (keycode == 14 || keycode == 35 || keycode == 15 ||
                                     keycode == 32 || keycode == 34 || keycode == 13);
            if (id(cur_page) == 0 || !nav_taste2) {
              id(held_key) = 0;
              return;
            }
            switch (keycode) {
              case 34:
                id(held_key) = 0;
                break;
              case 14: case 35: case 15: case 32:
              case 33: case 43: case 13: case 3:
              case 2: case 4: case 11: case 5:
                id(held_key) = keycode;
                id(key_repeat)->execute();
                break;
              default:
                id(held_key) = 0;
                break;
            }

# --- Buttons ------------------------------------------------------------------
# PFLICHT, nicht optional: espidf_ble_keyboard ruft intern App.get_buttons()
# auf, und die Methode existiert nur, wenn ESPHome USE_BUTTON definiert - also
# nur, wenn die Konfiguration mindestens eine Button-Entity enthaelt. Fehlt der
# Block, bricht der Build mit
#   "class esphome::Application has no member named get_buttons"
# ab. Nicht loeschen.
button:
  - platform: restart
    name: "Neu starten"
    id: btn_restart
    icon: "mdi:restart"
  # ---- SD-Karten-Test (nur in open-remote-sd-test.yaml) ----
  # Achtung: nach dem Einbinden ist das Sprachmikrofon bis zum Neustart tot (geteilte Pins).
  - platform: template
    name: "SD: mounten"
    icon: "mdi:sd"
    entity_category: diagnostic
    on_press:
      - script.execute: sd_einbinden
  - platform: template
    name: "SD: Geschwindigkeitstest"
    icon: "mdi:speedometer"
    entity_category: diagnostic
    on_press:
      - script.execute: sd_bench
  - platform: template
    name: "SD: auswerfen"
    icon: "mdi:sd"
    entity_category: diagnostic
    on_press:
      - script.execute: sd_auswerfen
  - platform: template
    name: "SD: auswerfen und neu starten"
    icon: "mdi:sd"
    entity_category: diagnostic
    on_press:
      - script.execute: sd_auswerfen_neustart
  - platform: template
    name: "SD: Wurzel auflisten"
    icon: "mdi:folder-search"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          auto es = id(sdkarte)->list_dir("/");
          std::string s;
          for (auto &e : es) {
            s += e.is_dir ? "[" + e.name + "]" : e.name + " (" + std::to_string(e.size) + "B)";
            s += "  ";
          }
          if (s.empty()) s = "(leer oder nicht gemountet)";
          id(sd_listing)->publish_state(s.substr(0, 250));
  - platform: template
    name: "SD: Schreibtest"
    icon: "mdi:content-save"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          bool ok = id(sdkarte)->write_text("/openremote_test.txt",
                      "Open Remote SD-Test " + std::to_string(millis()) + "\n", true);
          id(sd_status)->publish_state(ok ? "geschrieben: /openremote_test.txt" : "Schreiben fehlgeschlagen");
  - platform: template
    name: "SD: Lesetest"
    icon: "mdi:file-eye"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          std::string c;
          bool ok = id(sdkarte)->read_text("/openremote_test.txt", c, 250);
          id(sd_listing)->publish_state(ok ? c : "Lesen fehlgeschlagen");

  # ---- OMOTE runtime.json ----
  - platform: template
    name: "Config: neu laden"
    icon: "mdi:refresh"
    entity_category: diagnostic
    on_press:
      - script.execute: sd_neuladen
  - platform: template
    name: "Menue (SD) oeffnen"
    icon: "mdi:view-dashboard"
    on_press:
      - lvgl.page.show: {id: page_dyn, animation: FADE_IN, time: 150ms}
  - platform: template
    name: "Config: Geraete auflisten"
    icon: "mdi:remote"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          std::string s;
          for (auto &n : id(rc)->device_names()) s += n + " | ";
          for (auto &n : id(rc)->activity_names()) s += "[Akt] " + n + " | ";
          id(sd_listing)->publish_state(s.empty() ? "leer" : s.substr(0,250));
  # Testbefehl: Geraet + Befehl per Text-Eingabe, dann diesen Button
  - platform: template
    name: "Config: Testbefehl senden"
    icon: "mdi:send"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          bool ok = id(rc)->send_command_by_name(id(rc_test_device).state, id(rc_test_command).state);
          id(sd_status)->publish_state(id(rc)->last_result());
  # IR-Lernen: Text-Eingaben (Geraet/Befehl) setzen, diesen Button, dann die
  # echte Fernbedienung auf den IR-Empfaenger halten und die Taste druecken.
  - platform: template
    name: "Config: IR lernen scharf"
    icon: "mdi:remote"
    entity_category: diagnostic
    on_press:
      - switch.turn_on: ir_rx_power
      - delay: 60ms
      - globals.set: {id: ir_learn_armed, value: "true"}
      - lambda: 'id(sd_status)->publish_state("IR-Learn scharf - echte FB-Taste jetzt druecken (30 s)");'
      - delay: 30s
      - if:
          condition: {lambda: 'return id(ir_learn_armed);'}
          then:
            - globals.set: {id: ir_learn_armed, value: "false"}
            - switch.turn_off: ir_rx_power
            - lambda: 'id(sd_status)->publish_state("IR-Learn abgelaufen (nichts empfangen)");'

  # WLAN sofort fuer 5 min erzwingen - falls man von HA aus gerade nicht warten
  # will, bis das stuendliche Wartungsfenster von selbst kommt.
  - platform: template
    name: "Wartungsfenster jetzt"
    icon: "mdi:wifi-refresh"
    entity_category: diagnostic
    on_press:
      - script.execute: wartungsfenster

  - platform: template
    name: "Koppeln: Google Streamer"
    icon: "mdi:bluetooth-connect"
    on_press:
      - lambda: 'id(kb).execute_action("forget_host:0"); id(kb).execute_action("switch_host:0");'
  - platform: template
    name: "Koppeln: Sony TV"
    icon: "mdi:bluetooth-connect"
    on_press:
      - lambda: 'id(kb).execute_action("forget_host:1"); id(kb).execute_action("switch_host:1");'
  - platform: template
    name: "Verbinden: Google Streamer"
    icon: "mdi:bluetooth"
    on_press:
      - lambda: 'id(kb).execute_action("switch_host:0");'
  - platform: template
    name: "Verbinden: Sony TV"
    icon: "mdi:bluetooth"
    on_press:
      - lambda: 'id(kb).execute_action("switch_host:1");'
  - platform: template
    name: "Kopplung löschen: Google Streamer"
    icon: "mdi:bluetooth-off"
    on_press:
      - lambda: 'id(kb).execute_action("forget_host:0");'
  - platform: template
    name: "Kopplung löschen: Sony TV"
    icon: "mdi:bluetooth-off"
    on_press:
      - lambda: 'id(kb).execute_action("forget_host:1");'
  # Loest den GEWAEHLTEN Assistenten aus, nicht mehr fest den Google-Weg.
  - platform: template
    # NICHT "Sprachsuche 4s" nennen: Test-4 lief auf derselben Platine, und
    # Home Assistant bildet seine Kennung aus MAC + Name. Die alte Entitaet aus
    # der Test-4-Zeit belegt diese Kennung noch und laesst unsere stillschweigend
    # unter den Tisch fallen.
    name: "Sprachabfrage starten (4 s)"
    icon: "mdi:microphone"
    on_press:
      - script.execute: voice_start
      - delay: 4s
      - script.execute: voice_stop

binary_sensor:
  # WLAN-Verbindung, damit man in Home Assistant beides nebeneinander sieht.
  - platform: status
    name: "WLAN verbunden"

  - platform: espidf_ble_keyboard
    keyboard_id: kb
    type: paired
    name: "Bluetooth verbunden"
    id: ble_paired
    on_state:
      - lvgl.label.update:
          id: ble_state_lbl
          text: !lambda 'return x ? std::string("Verbunden") : std::string("Nicht verbunden");'
      - lvgl.label.update:
          id: ble_state_short
          text: !lambda 'return x ? std::string("verbunden") : std::string("getrennt");'
      - lvgl.label.update:
          id: ble_state_short
          text_color: !lambda 'return x ? lv_color_hex(0x22C55E) : lv_color_hex(0x8B94A3);'
      # Verbindungszustand als Balken oben neben dem Akku.
      - script.execute: refresh_ble_bars
      - if:
          condition: {lambda: "return id(cur_page) == 10;"}
          then: [{script.execute: refresh_ble_slots}]

  - platform: homeassistant
    id: doorbell
    entity_id: "${ent_doorbell}"
    internal: true
    on_press:
      - script.execute: wake_backlight
      # Altes Foto vom letzten Klingeln ausblenden, bis das neue da ist.
      - lvgl.widget.hide: db_img_haus
      - lvgl.widget.show: db_ph_haus
      - lvgl.page.show: {id: page_doorbell, animation: FADE_IN, time: 200ms}
    on_release:
      - if:
          condition: {lambda: "return id(cur_page) == 7;"}
          then: [{script.execute: go_home}]

  # Laeuft der Sleeptimer, kommt die Seite von selbst hoch - man soll ihn
  # abbrechen koennen, ohne ihn erst im Menue suchen zu muessen. Das Flag wird
  # ausschliesslich gelesen, die Fernbedienung schaltet es nie.
  # LIS3DH INT1 - NICHT MEHR als Ausloeser genutzt (Nutzerbeobachtung 2026-09-23: das Symbol
  # blinkte pausenlos "an, aus, an, aus", waehrend die Fernbedienung unbewegt lag, und das
  # Display dimmte gar nicht mehr ab - 45s Live-Mitschnitt zeigte dabei KEINE einzige "Ruck"/
  # "Hochheben"-Meldung, also kam es nicht von der Software-Erkennung. Der Interrupt selbst
  # flattert offenbar unabhaengig von echter Bewegung (vermutlich Elektronikrauschen auf der
  # Leitung) - das war schon VOR den heutigen Aenderungen so (wake_backlight lief bislang bei
  # jedem Interrupt, auch im wachen Zustand, und hielt den Ruhe-Timer dabei unbemerkt am Laufen).
  # "Bewegung" wird daher jetzt genauso per Software erkannt wie "Hochheben" (Ruck-Intervall
  # weiter unten) - zuverlaessig, weil debounced (zwei Messungen in Folge) statt hardwaregetrieben.
  # Der Pin bleibt fuer den Tiefschlaf-Weckpfad (ext1) bestehen, hier nur noch zur Beobachtung.
  - platform: gpio
    id: motion_wake
    pin: {number: GPIO2, mode: {input: true}}
    internal: true
    filters:
      - delayed_off: 600ms
    on_press:
      - lambda: 'ESP_LOGD("motion", "GPIO2-Interrupt (nur Beobachtung, wirkt nicht mehr): Modus %d, %s", id(motion_mode), id(disp_off) ? "war aus" : (id(disp_dimmed) ? "war abgedunkelt" : "war hell"));'

  # TP4056 ~CHRG (GPIO1, Open-Drain, LOW = aktiv am Laden). Direkter Hardware-
  # Ladeindikator - zuverlaessiger als die CRATE-basierte laedt-Erkennung, vor
  # allem bei fast vollem Akku. Solange dieser Pin LOW ist (Sensor "on"), geht
  # die Fernbedienung NICHT in den Deep-Sleep (sonst weckt der ext1-Pin GPIO1
  # sie sofort wieder = Endlosschleife). Steckt man das Kabel im Schlaf an,
  # zieht der Pin LOW und weckt regulaer.
  # HINWEIS: bei VOLLEM Akku beendet der TP4056 das Laden -> ~CHRG geht Hi-Z ->
  # Sensor "off", obwohl das Kabel steckt. Damit "aufs Kabel legen" trotzdem
  # zuverlaessig ein Fernwartungs-/OTA-Fenster gibt, oeffnet die steigende
  # Flanke ein 3-min-Wartungsfenster (WLAN erzwungen an, kein Deep-Sleep).
  - platform: gpio
    id: charger_present
    name: "Ladekabel"
    device_class: battery_charging
    pin: {number: GPIO1, mode: {input: true, pullup: true}, inverted: true}
    filters:
      - delayed_off: 2s
      - delayed_on: 200ms
    on_press:
      - script.execute: apply_charge_icon
      - script.execute: wake_backlight
      - script.execute: refresh_laden
      - script.execute: wartungsfenster
    # Icon jetzt direkt hier (apply_charge_icon), nicht mehr nur ueber den
    # Umweg refresh_laden -> CRATE-Register - das reagiert traege, s.
    # Kommentar bei apply_charge_icon weiter oben. Nutzerhinweis
    # 2026-09-19: "auch beim Ausstecken dauert es lange".
    on_release:
      - script.execute: apply_charge_icon
      - script.execute: wake_backlight
      - script.execute: refresh_laden

  - platform: homeassistant
    id: sleep_flag
    entity_id: "${ent_sleep_flag}"
    internal: true
    on_press:
      - script.execute: wake_backlight
      - lvgl.label.update: {id: sleep_state_lbl,  text: "AN"}
      - lvgl.label.update: {id: sleep_state_lbl,  text_color: 0x22C55E}
      - lvgl.label.update: {id: tile_sleep_state, text: "AN"}
      - lvgl.label.update: {id: tile_sleep_state, text_color: 0x22C55E}
      - lvgl.page.show: {id: page_sleeptimer, animation: FADE_IN, time: 200ms}
    on_release:
      - lvgl.label.update: {id: sleep_state_lbl,  text: "AUS"}
      - lvgl.label.update: {id: sleep_state_lbl,  text_color: 0x8B94A3}
      - lvgl.label.update: {id: tile_sleep_state, text: "AUS"}
      - lvgl.label.update: {id: tile_sleep_state, text_color: 0x8B94A3}
      - lvgl.label.update: {id: sleep_rem_lbl,    text: "--:--:--"}
      - if:
          condition: {lambda: "return id(cur_page) == 12;"}
          then: [{script.execute: go_home}]

  - platform: homeassistant
    id: doorbell2
    entity_id: "${ent_doorbell2}"
    internal: true
    on_press:
      - script.execute: wake_backlight
      - lvgl.widget.hide: db_img_wohn
      - lvgl.widget.show: db_ph_wohn
      - lvgl.page.show: {id: page_doorbell2, animation: FADE_IN, time: 200ms}
    on_release:
      - if:
          condition: {lambda: "return id(cur_page) == 11;"}
          then: [{script.execute: go_home}]

sensor:
  # Position/Dauer der Wiedergabe (SmartTube, Netflix, Cast, Fernseher - alles, was
  # media_player.wohnzimmer_jetzt_lauft zusammenfasst). Die Attribute kommen nur, solange
  # eine Position bekannt ist; sonst bleibt die Anzeige aus.
  - platform: homeassistant
    id: mp_pos
    entity_id: media_player.wohnzimmer_jetzt_lauft
    attribute: media_position
    internal: true
    on_value:
      - lambda: |-
          id(media_pos_s) = std::isnan(x) ? -1 : (int) x;
          id(media_pos_at) = millis();
      - script.execute: update_media_pos
  - platform: homeassistant
    id: mp_dur
    entity_id: media_player.wohnzimmer_jetzt_lauft
    attribute: media_duration
    internal: true
    on_value:
      - lambda: 'id(media_dur_s) = std::isnan(x) ? 0 : (int) x;'
      - script.execute: update_media_pos

  # Empfangsstaerke der BLE-Verbindung. Speist die Balkenanzeige oben rechts;
  # taucht in Home Assistant nicht auf (internal).
  - platform: espidf_ble_keyboard
    keyboard_id: kb
    type: rssi
    id: ble_rssi
    internal: true
    update_interval: 3s
    on_value:
      - script.execute: refresh_ble_bars

  # WLAN-Staerke fuer die zweite Balkenanzeige oben.
  - platform: wifi_signal
    id: wifi_rssi
    internal: true
    update_interval: 10s
    on_value:
      - script.execute: refresh_wifi_bars

  # Momentane Lade-/Entladerate aus dem CRATE-Register des MAX17048 (0x16),
  # in %/h, mit Vorzeichen: + = laedt, - = entlaedt. Wird von refresh_laden
  # gefuettert (alle 60 s ueber den akku-Sensor). Messinstrument fuer die
  # Stromspar-Tests - viel schneller als das Abwarten der SOC-Drift.
  - platform: template
    id: entladerate
    name: "Akku Rate"
    unit_of_measurement: "%/h"
    accuracy_decimals: 2
    state_class: measurement
    force_update: true
    update_interval: never

  - platform: max17048
    id: akku
    address: 0x36
    # War 60s. refresh_laden (Ladeanzeige oben) haengt an diesem Update, s.
    # on_value unten - das Stecker-Ein/Aus-Signal (charger_present) fuellt
    # die Luecke inzwischen zwar mit einer sofortigen Extra-Messung (s.
    # on_press/on_release dort), aber 60s war als Ruecksicherungs-Fall immer
    # noch spuerbar traege. 20s ist ein guter Mittelweg (noch immer ein
    # niedrigfrequenter I2C-Read, kein spuerbarer Mehrverbrauch).
    update_interval: 20s
    battery_level:
      name: "Akkustand"
      on_value:
        - lvgl.label.update:
            id: lbl_batt
            text: !lambda |-
              char b[8];
              snprintf(b, sizeof(b), "%d%%", (int) x);
              return std::string(b);
        - lambda: 'id(akku_pct) = (int) x;'
        - script.execute: apply_low_bat
