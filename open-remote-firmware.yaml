      styles: [st_screen]
      pad_top: 50
      scrollbar_mode: "off"
      layout: {type: flex, flex_flow: column, flex_align_cross: start, pad_row: 10}
      on_load:
        - lambda: 'id(cur_page) = 1; id(frow) = 0; id(fcol) = 0;'
        - script.execute: focus_apply
      widgets:
        - obj:
            id: hdr_back_menu
            width: 100%
            height: 40
            bg_color: 0x0E1116
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollable: false
