              - label: {id: konf_title, text: "Menü", styles: [st_title, st_grow], pad_bottom: 0, height: 22, long_mode: DOT}
        - obj:
            id: konf_root
            x: 0
            y: 40
            width: 240
            height: 280
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            pad_bottom: 2
            scrollable: true
            scrollbar_mode: "off"
        - label: {hidden: true, text: !lambda "return lv_label_rueckrufe_leeren();"}   # schneller Start, s. esphomeremote-wlan.h

