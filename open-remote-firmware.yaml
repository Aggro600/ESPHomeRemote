  - {id: tts_speaker,    type: bool,      restore_value: true,  initial_value: "false"}
  # Mikrofon bei Display an vorwaermen (2026-10-07): sonst fehlen nach dem Tastendruck ~1,5 s am Anfang.
  # Standard AUS (Nutzerwunsch) - einschalten unter Einstellungen > Sprache.
  - {id: mic_vorwaermen, type: bool,      restore_value: true,  initial_value: "false"}
  - {id: assistant,      type: int,       restore_value: true,  initial_value: "0"}
  # Nur wirksam, wenn assistant == 0 (Google): 0 = Assistant (bisheriges Verhalten, allgemeiner
  # Google-Assistant-Bildschirm), 1 = Suche (Such-Taste, SmartTube startet mit "Instant voice
  # search" selbst die Spracheingabe, Nutzerwunsch 2026-09-28), 2 = Auto (Suche nur in SmartTube,
  # s. mp_app_name).
  - {id: google_mode,    type: int,       restore_value: true,  initial_value: "0"}
  - {id: voice_such_weg, type: bool,      restore_value: false, initial_value: "false"}   # Zwischenspeicher fuer google_mode 1/2, s. dort
  - {id: gest_dbl,       type: bool,      restore_value: false, initial_value: "false"}
  # Doppeldruck Menue-Taste: backlight_idle_timeout ohne Wartezeiten durchlaufen lassen
  # (Display sofort aus, sonst alles wie beim normalen Timeout). Wird dort zurueckgesetzt.
  - {id: sofort_aus,     type: bool,      restore_value: false, initial_value: "false"}
  # Bluetooth-Optionen (2026-09-29, Einstellungen > Bluetooth):
  #  kb_ziffern   - seit 2026-10-17 immer an (kein Schalter mehr): Ziffern-Tastatur fuer alle Plaetze ausser denen
  #                 mit "Tastatur" (voll_slots). Ein alter Wert "Buchstaben" wird beim Start zu voll_slots = alle.
  #  ble_parallel - beim Aktivitaetswechsel verbunden bleiben (Verbindung wird geparkt statt
  #                 getrennt) - das Neuladen beim Wechseln entfaellt, Zurueckwechseln ist sofort da.
  - {id: kb_ziffern,     type: bool,      restore_value: true,  initial_value: "true"}
  - {id: ble_parallel,   type: bool,      restore_value: true,  initial_value: "false"}
  # Dock-Anzeige (2026-10-17, esphomeremote-dock.h): dock_an = Smart Display im Dock; dock_disp 0 = Display wie sonst,
  # 1 = bleibt an, 2 = bleibt an von dock_von bis dock_bis Uhr
  - {id: dock_an,        type: bool,      restore_value: true,  initial_value: "true"}
  - {id: dock_disp,      type: int,       restore_value: true,  initial_value: "2"}
  - {id: dock_von,       type: int,       restore_value: true,  initial_value: "7"}
  - {id: dock_bis,       type: int,       restore_value: true,  initial_value: "23"}
  # Musik-Anzeige (2026-10-18, esphomeremote-musik.h): musik_dock = im Dock statt Smart Display, solange Musik laeuft;
  # musik_player = nur zuhoeren, wenn der "Jetzt laeuft"-Player spielt
  - {id: musik_dock,     type: bool,      restore_value: true,  initial_value: "true"}
  # Begruessung nach jedem Start/Aufwachen (2026-10-20, Konfigurator: Einstellungen > Begruessung). Text: cfg.begruessung
  # (leer = "Hallo <Name>").
  - {id: begruessung,    type: bool,      restore_value: true,  initial_value: "true"}
  # HA-Befehle ueber das Dock (2026-10-19, components/dock_direkt typ 3): 0 aus, 1 nur ohne HA-Verbindung,
  # 2 immer zuerst ueber das Dock (sofort, auch direkt nach dem Tiefschlaf) - sonst/als Ausweg wie bisher
  - {id: ha_dock,        type: int,       restore_value: true,  initial_value: "2"}
  # Bluetooth ueber das Dock (2026-10-22, components/dock_hid): 0 automatisch (Remote, wenn sie selbst verbunden ist,
  # sonst das Dock), 1 nur die Remote, 2 Dock zuerst. Zuordnung Platz -> Dock-Platz im Konfigurator (Bluetooth).
  - {id: bt_weg,         type: int,       restore_value: true,  initial_value: "0"}
  # Bluetooth-Notweg (2026-10-25): antwortet das Dock nicht, verbindet sich die Remote selbst mit dem Geraet.
  # 0 = aus, 1 = bis das Dock wieder antwortet (hoechstens 10 min) - s. tasten_konfig notweg_modus
  - {id: bt_notweg,      type: int,       restore_value: true,  initial_value: "1"}
  # Bilder/Konfiguration (HTTP) ueber das Dock (2026-10-20): 0 = nur als Ausweg (weder WLAN noch Bluetooth-Link),
  # 1 = zuerst ueber das Dock - s. ha_tunnel set_http_weg, dock_direkt http_relay
  - {id: http_dock,      type: int,       restore_value: true,  initial_value: "0"}
  # Neues Cover noch nicht geladen, je Seite (2026-10-20, s. cover_sichtbar)
  # Tasten beim Aufwachen aus dem Tiefschlaf (2026-10-20): 2 = alles senden, 1 = Weck-Taste nur wecken, 0 = nur wecken
  - {id: weck_tasten,      type: int,     restore_value: true,  initial_value: "2"}
  # Weck-Taste aus dem Tiefschlaf (2026-10-23): 0 = schon beim Start uebers Dock senden (wo moeglich), 1 = wie bisher
  # erst nach dem Start (~3,7 s)
  - {id: weck_dock,        type: int,     restore_value: true,  initial_value: "0"}
  - {id: wlan_nach_weck,   type: bool,    restore_value: false, initial_value: "false"}   # s. on_boot 1100/247
  # Weg zum Dock bei verbundenem WLAN (2026-10-23): 0 Funk, sonst Heimnetz | 1 nur Funk (ESP-NOW) | 2 Heimnetz zuerst
  - {id: dock_netz,        type: int,     restore_value: true,  initial_value: "0"}
  # Aufwecken aus dem Tiefschlaf bei (2026-10-21): -1 = wie "Aufwecken bei", 0 = aus, 1 = Bewegung, 2 = Hochheben
  - {id: tief_motion,      type: int,     restore_value: true,  initial_value: "-1"}
  # Bewegung verlaengert die Wartezeit bis zum Tiefschlaf wie ein Tastendruck (2026-10-21)
  - {id: bewegung_haelt,   type: bool,    restore_value: true,  initial_value: "false"}
  - {id: dunkel_start,     type: bool,    restore_value: false, initial_value: "false"}   # s. on_boot 100
  - {id: weck_pins,        type: uint32_t, restore_value: false, initial_value: "0"}    # ext1-Weckpins (on_boot 900)
  - {id: cover_mp_offen,   type: bool,    restore_value: false, initial_value: "false"}
  - {id: cover_home_offen, type: bool,    restore_value: false, initial_value: "false"}
  # HA-Verbindung (Bluetooth-Link) im Ruhezustand trennen: Minuten nach Display-Aus, 0 = immer verbunden (2026-10-19).
  # Wieder an beim Aufwecken oder wenn ein HA-Aufruf sie braucht. Befehle gehen solange uebers Dock (ha_dock).
  - {id: ha_link_ruhe,   type: int,       restore_value: true,  initial_value: "2"}
  # Was nach ha_link_ruhe passiert: 0 nichts (normaler Ruhetakt), 1 langsam (Verbindung bleibt, HA erreicht die Remote
  # in ~2 s - Klingel-Popups kommen weiter), 2 trennen (spart am meisten, HA erreicht die Remote erst nach dem Wecken)
  - {id: ha_link_modus,  type: int,       restore_value: true,  initial_value: "1"}
  - {id: zustand_da,     type: bool,      restore_value: false, initial_value: "false"}   # Stand vom Dock schon da
  - {id: musik_player,   type: bool,      restore_value: true,  initial_value: "true"}
  # Touchpad (esphomeremote-maus.h): Bit je Bluetooth-Platz - maus_slots = Maus melden, voll_slots = volle Tastatur
  # trotz kb_ziffern; maus_tempo = Zeigertempo in %
  - {id: maus_slots,     type: int,       restore_value: true,  initial_value: "0"}
  - {id: voll_slots,     type: int,       restore_value: true,  initial_value: "0"}
  - {id: maus_tempo,     type: int,       restore_value: true,  initial_value: "100"}
  # Touchpad per Steuerkreuz (2026-10-17): maus_dpad = D-Pad bewegt den Zeiger (OK = Klick, lang = Rechtsklick,
  # OK halten + Pfeile = Ziehen, Kanal +/- = Scrollen), maus_dpad_tempo in %, maus_zurueck = Zurueck-Taste dort:
  # 0 Touchpad schliessen, 1 Zurueck am Geraet, 2 Rechtsklick
  - {id: maus_dpad,      type: bool,      restore_value: true,  initial_value: "true"}
  - {id: maus_dpad_tempo, type: int,      restore_value: true,  initial_value: "100"}
  - {id: maus_zurueck,   type: int,       restore_value: true,  initial_value: "1"}
  # Bewegungsgesten (esphomeremote-gesten.h): an, auch bei dunklem Display, Empfindlichkeit 0 streng .. 2 empfindlich
  - {id: gesten_an,      type: bool,      restore_value: true,  initial_value: "false"}
  - {id: gesten_dunkel,  type: bool,      restore_value: true,  initial_value: "true"}
  - {id: gesten_sens,    type: int,       restore_value: true,  initial_value: "1"}
  - {id: home_aus_menue, type: bool,      restore_value: false, initial_value: "false"}
  # Rueckfrage-Seite 25: true = Herunterfahren, false = Neustart
  - {id: frage_aus,      type: bool,      restore_value: false, initial_value: "false"}
  # Seite (cur_page), die gerade als POP-UP offen ist (von selbst geoeffnet: Sleeptimer von HA,
  # Bildmodus beim App-Start, Bildschirmtastatur). -1 = keins. Zurueck schliesst dann nur das
  # Pop-up (-> Startseite) statt in ein Menue zu springen, in dem man nie war; der Knopf oben
  # zeigt "X" statt "<" (Nutzerwunsch 2026-09-28).
  - {id: popup_seite,    type: int,       restore_value: false, initial_value: "-1"}
  # Klingelbild-Stempel aus dem Dock-Stand (2026-10-24, dock_direkt on_zustand): zuletzt geladenes Bild je Tuer
  - {id: db_ts_haus,     type: uint32_t,  restore_value: false, initial_value: "0"}
  - {id: db_ts_wohn,     type: uint32_t,  restore_value: false, initial_value: "0"}
  # Popups (2026-10-03): popup_von = Seite, von der aus das Popup kam (Schliessen fuehrt dorthin
  # zurueck). popup_min = per Menuetaste/Timeout weggelegtes Popup, das die Menuetaste kurz
  # zurueckholt, solange sein Anlass besteht (max. 5 min). Popups werden nie als Menueseite gemerkt.
  - {id: popup_von,      type: int,       restore_value: false, initial_value: "0"}
  - {id: popup_min,      type: int,       restore_value: false, initial_value: "-1"}
  - {id: popup_min_ms,   type: uint32_t,  restore_value: false, initial_value: "0"}
  - {id: popup_zurueck,  type: bool,      restore_value: false, initial_value: "false"}
  # Wird die Sprachtaste noch gehalten? Nach dem Mikrofon-Vorlauf wird das
  # geprueft - sonst startet eine Abfrage, nachdem schon losgelassen wurde.
  - {id: voice_want,     type: bool,      restore_value: false, initial_value: "false"}
  - {id: voice_active,   type: bool,      restore_value: false, initial_value: "false"}
  - {id: mic_allowed,    type: bool,      restore_value: true,  initial_value: "true"}
  - {id: key_was_dark,   type: bool,      restore_value: false, initial_value: "false"}
  # Tippen waehrend die Seite noch schwingt: nur anhalten, nichts ausloesen (2026-10-11, wie am Handy)
  - {id: stopp_tipp,     type: bool,      restore_value: false, initial_value: "false"}
  - {id: click_obj,      type: "void *",  restore_value: false, initial_value: "nullptr"}
  - {id: disp_bri,       type: int,       restore_value: true,  initial_value: "65"}
  - {id: kbd_bri,        type: int,       restore_value: true,  initial_value: "51"}
  - {id: motion_sens,    type: int,       restore_value: true,  initial_value: "0"}   # 0 hoch, 1 mittel, 2 niedrig
  # "Aufhellen bei Bewegung": ein Ruck hellt die ABGEDUNKELTE Remote wieder auf - unabhaengig
  # von "Aufwecken bei" (Nutzerwunsch 2026-09-27), mit eigener Empfindlichkeit (dim_sens).
  - {id: dim_wake,       type: bool,      restore_value: true,  initial_value: "true"}
  # Noch eine eigene, unabhaengige Option: gar nicht erst abdunkeln (und auch nicht ausschalten),
  # solange die Remote in Bewegung ist - z.B. waehrend sie in der Hand gehalten wird. Standardmaessig
  # AUS: anders als dim_wake (die nur auf klare Ereignisse wie Anstossen/Hochheben reagiert) fragt
  # das hier alle 250 ms den Sensor ab, SOLANGE das Display hell ist, nicht nur kurz beim Einschlafen -
  # und haelt das Display bei jedem Zittern hell, was den groessten Verbraucher laenger laufen laesst.
  - {id: dim_hold_motion, type: bool,      restore_value: true,  initial_value: "true"}
  # Eigene Empfindlichkeit fuer die beiden Optionen oben (getrennt von "Empfindlichkeit" bei
  # "Aufwecken bei" - die bleibt beim eingespielten Wert). Gilt fuer dim_wake, WENN sie beim
  # Abdunkeln greift (nicht beim eigentlichen Aufwecken aus dem Ruhezustand - da bleibt es bei
  # motion_sens), und fuer dim_hold_motion.
  - {id: dim_sens,       type: int,       restore_value: true,  initial_value: "0"}   # 0 hoch, 1 mittel, 2 niedrig
  # Doppelt auf die Remote klopfen weckt sie (aus dem Ruhezustand und aus dem Abgedunkelten).
  # Erkennt der Bewegungs-Chip selbst (Klopf-Erkennung des LIS3DH), auch aus dem Tiefschlaf.
  - {id: klopf_wake,     type: bool,      restore_value: true,  initial_value: "false"}
  - {id: klopf_sens,     type: int,       restore_value: true,  initial_value: "0"}   # 0 hoch, 1 mittel, 2 niedrig
  # Tasten wecken: true = jede Taste weckt das Display, false = nur die Menue-Taste (kurz oder lang).
  # Andere Tasten senden ihren Befehl dann trotzdem, das Display bleibt aus (Nutzerwunsch 2026-09-27).
  - {id: keys_wake_all,  type: bool,      restore_value: true,  initial_value: "false"}
  # Menuetaste bei dunklem Display (2026-10-11, Nutzerwunsch): false = oeffnet gleich das Menue (wie bisher),
  # true = weckt nur das Display, erst der naechste Druck oeffnet das Menue. Gilt nur fuer die Menuetaste.
  - {id: menue_weckt_nur, type: bool,     restore_value: true,  initial_value: "true"}

i2c:
  id: hauptbus
  sda: GPIO20
  scl: GPIO19
  scan: true

# Tasten-Konfigurator (2026-10-03): Belegung aller Tasten je Aktivitaet und kurz/doppelt/lang,
# gepflegt in Home Assistant (Seitenleiste "Fernbedienung", custom_components/esphomeremote_konfig).
# Die Remote holt sie per HTTP, sobald HA einen neuen Stand ankuendigt (tk_hash_ha), und speichert
# sie im NVS. Ohne Belegung oder ausgeschaltet gilt die eingebaute Logik (on_key/gesture_action).
tasten_konfig:
  id: tk_cfg
  host: ${ha_host}
  key: "${konfig_key}"
  long_ms: ${key_long_ms}
  dbl_ms: ${key_dbl_ms}
  status: tk_status
  transfer: tk_transfer
  keyboard: kb
  transmitter: ir_tx
  direkt: direkt

# Direkter Funkweg zum Dock (2026-10-18): Infrarot/433 MHz ueber "Dock" gehen per ESP-NOW direkt ans Dock, ohne HA.
# Nur wenn das Dock nicht bestaetigt: ueber HA, sonst sendet die Remote selbst. Adressen der Docks kommen aus der
# Tasten-Konfiguration ("dmac"). Beschreibung: components/dock_direkt/dock_direkt.h
dock_direkt:
  id: direkt
  schluessel: "${direkt_schluessel}"
  # Stand vom Dock (2026-10-19): nach dem Start, bevor die eigene HA-Verbindung steht, sofort die richtigen Werte auf
  # der Startseite (Wiedergabe, Fernseher, Timer). Kommt HA danach, gelten dessen Werte.
  on_zustand:
    - lambda: |-
        if (api::global_api_server->is_connected()) return;
        JsonDocument d;
        if (deserializeJson(d, text) != DeserializationError::Ok) { ESP_LOGW("dock", "Stand vom Dock unlesbar"); return; }
        id(zustand_da) = true;
        // Wartungsfenster ueber das Dock (2026-10-25): HA will die Firmware aufspielen ("w": 1) - WLAN 3 min an. So geht
        // ein Update auch ohne Bluetooth-Link zu HA; einmal je Fenster.
        if ((d["w"] | 0) == 1 && (int32_t) (millis() - id(wartung_bis)) >= 0) {
          ESP_LOGI("wartung", "Wartungsfenster vom Dock angefordert");
          id(wartungsfenster)->execute();
        }
        // Konfigurator "Auf der Remote zeigen" (2026-10-25): Seite als Popup oeffnen, einmal je Nummer
        if (!d["tp"].isNull()) {
          const uint32_t nr = d["tp"][1] | 0u;
          if (nr != 0 && nr != id(test_popup_nr)) {
            id(test_popup_nr) = nr;
            tasten::menue_popup(d["tp"][0] | "");
          }
        }
        // Docks, die laut HA online sind (2026-10-25): die werden zuerst probiert
        if (!d["do"].isNull()) {
          std::vector<std::string> on;
          for (JsonVariantConst v : d["do"].as<JsonArrayConst>()) on.push_back(v.as<std::string>());
          id(tk_cfg).set_docks_online(std::move(on));
        }
        // Soll-Stand der Tasten-Konfiguration (2026-10-23): neuer Stand -> ueber das Dock holen (HTTP typ 6-9)
        if (!d["kh"].isNull()) id(tk_cfg).angekuendigt(d["kh"].as<std::string>());
        id(belegung_link_wecken).execute();   // gleich mit der Antwort, nicht erst beim naechsten Minutentakt (2026-10-24)
        // Popups ueber das Dock (2026-10-24): Zustaende der Popup-Ausloeser (Klingel, Sleeptimer, Tastatur ...) - nur
        // passend zur geladenen Konfiguration, sonst stimmt die Reihenfolge nicht. Klingelbild: Zeitstempel je Tuer,
        // neuer Stempel -> Bild holen (HTTP ueber das Dock). Nach dem Start nur, wenn es keine 5 min alt ist.
        if (!d["pz"].isNull() && id(tk_cfg).hash() == (d["kh"] | "")) id(mn)->zustaende_von_dock(d["pz"].as<JsonArrayConst>());
        if (!d["db"].isNull()) {
          const time_t uhr = ::time(nullptr);
          for (int i = 0; i < 2; i++) {
            const uint32_t ts = d["db"][i] | 0u;
            uint32_t &alt = i == 0 ? id(db_ts_haus) : id(db_ts_wohn);
            if (ts == 0 || ts == alt) continue;
            const bool neu_bild = alt != 0 || (uhr > 1700000000 && uhr - (time_t) ts < 300);
            alt = ts;
            if (!neu_bild) continue;
            ESP_LOGI("klingel", "Klingelbild %d ueber das Dock", i + 1);
            auto *b = i == 0 ? id(db_haus_image) : id(db_wohn_image);
            b->set_url(std::string("http://") + id(tk_cfg).host() + (i == 0 ? "/local/esphomeremote_doorbell_haus.jpg" : "/local/esphomeremote_doorbell_wohnung.jpg"));
            b->update();
          }
        }
        auto t = [&](text_sensor::TextSensor *s, const char *k) { if (!d[k].isNull()) s->publish_state(d[k].as<std::string>()); };
        auto z = [&](sensor::Sensor *s, const char *k) { if (!d[k].isNull()) s->publish_state(d[k].as<float>()); };
        t(id(mp_title), "mp_title"); t(id(adb_title), "mp_title"); t(id(mp_artist), "mp_artist");
        t(id(mp_app_name), "mp_app"); t(id(mp_app), "mp_app"); t(id(mp_cover_url), "mp_cover");
        t(id(mp_quelle), "mp_quelle"); z(id(mp_tempo), "mp_tempo"); z(id(mp_dur), "mp_dur");
        if (!d["mp_pos"].isNull()) {   // Position bis jetzt hochrechnen (Uhr laeuft im Tiefschlaf weiter)
          float p = d["mp_pos"].as<float>();
          const long ts = d["ts"] | 0L;
          const time_t jetzt = ::time(nullptr);
          if (d["mp_state"] == "playing" && ts > 0 && jetzt > 1700000000 && jetzt > ts) p += (jetzt - ts) * (d["mp_tempo"] | 1.0f);
          id(mp_pos).publish_state(p);
        }
        t(id(mp_state), "mp_state");
        t(id(tv_state), "tv");
        t(id(timer_wohnung_remaining_attr), "tm_rest"); t(id(timer_wohnung_end_attr), "tm_ende"); t(id(timer_wohnung_state), "tm");
        ESP_LOGI("dock", "Startseite vom Dock: %s", id(mp_title).state.c_str());
        // Neuer Titel: Cover gleich mit holen (liegt fertig verkleinert bei HA, kommt ueber das Dock) - 2026-10-20
        if (!id(adb_title).state.empty() && id(adb_title).state != id(cover_title)) {
          id(cover_mp_offen) = true;
          id(cover_home_offen) = true;
          id(cover_sichtbar).execute();
        }

# Konfigurierbares Menue (2026-10-03): Seiten/Eintraege aus derselben HA-Konfiguration, Raster 6x40 px.
# Anzeige auf page_konfig (Seite 98). Ohne Konfiguration gibt es kein Menue.
menue:
  - id: mn
    tasten_konfig: tk_cfg
  # Startseite je Aktivitaet (2026-10-27): eigene Menueseite statt der eingebauten Startseite, nur Anzeige/Touch
  - id: mn_home
    tasten_konfig: tk_cfg
    nur_anzeige: true

lis3dh:
  id: motion_chip
  setup_priority: 242   # nach dem WLAN-Start, s. display:

http_request:
  # Pflicht fuer online_image (Cover, Kamera-/Klingelbilder).
  verify_ssl: false
  # Kuerzer als der Standard (4,5 s): haengt ein Abruf (WLAN im Sparmodus, HA beschaeftigt),
  # blockiert er die Remote sonst so lange.
  timeout: 2500ms

# Cover-Art fuer die Media-Player-Seite (mp_cover_url-Textsensor unten setzt
# die echte URL per online_image.set_url, sobald HA eine entity_picture
# liefert). Platzhalter-URL hier nur fuers Schema - wird beim Boot noch
# nicht abgerufen (update_interval ist "never", siehe online_image-Default).
image:
  - platform: online_image
    id: mp_cover_image
    url: "http://${ha_host}/"
    # Cover als Hintergrund der Media-Seite (240x320 = volle Displaygroesse, in HA passend zugeschnitten).
    # JPEG; Byte-Reihenfolge Standard (little endian). Zwischen den beiden Cover-Downloads eine Pause: der gemeinsame
    # HTTP-Client ist direkt danach noch nicht wieder frei (ESP_ERR_HTTP_CONNECT).
    format: JPEG
    type: RGB565
    on_download_finished:
      - lvgl.image.update: {id: media_cover, src: mp_cover_image}
      # Geladenes Cover immer zeigen (2026-10-11): war es vorher ausgeblendet (leerer Titel beim App-Wechsel,
      # Fehler beim letzten Abruf), blieb die Medienseite leer, waehrend die Startseite das Bild schon hatte.
      - lvgl.widget.show: media_cover
      - script.execute: sd_logo_pruefen
    on_error:
      - lvgl.widget.hide: media_cover
      - script.execute: sd_logo_pruefen
  # Cover der Startseiten-Karte (216x172, in HA zugeschnitten), geladen wenn die Startseite zu sehen ist (cover_sichtbar).
  - platform: online_image
    id: home_cover_image
    url: "http://${ha_host}/"
    format: JPEG
    type: RGB565
    on_download_finished:
      - lvgl.image.update: {id: home_cover_img, src: home_cover_image}
      - script.execute: sd_logo_pruefen
    on_error:
      - lambda: 'ESP_LOGW("cover", "Startseiten-Cover-Download fehlgeschlagen");'

  # Bildplaetze der Widgets (2026-10-27): Kamera-Schnappschuss bzw. Cover, in HA passend verkleinert
  # (/api/esphomeremote_konfig/bild, custom_components/esphomeremote_konfig/widgets.py)
  - platform: online_image
    id: wbild_0
    url: "http://${ha_host}/"
    format: JPEG
    type: RGB565
    on_download_finished:
      - lambda: 'id(mn)->wbild_fertig(0); id(mn_home)->wbild_fertig(0);'
    on_error:
      - lambda: 'ESP_LOGW("widget", "Widget-Bild 1 konnte nicht geladen werden");'
  - platform: online_image
    id: wbild_1
    url: "http://${ha_host}/"
    format: JPEG
    type: RGB565
    on_download_finished:
      - lambda: 'id(mn)->wbild_fertig(1); id(mn_home)->wbild_fertig(1);'
    on_error:
      - lambda: 'ESP_LOGW("widget", "Widget-Bild 2 konnte nicht geladen werden");'

  # Klingel-Bild (Haustuer): dasselbe Foto wie aufs Handy, in HA auf 216x112
  # verkleinert (doorbell_image.py). Wird vom Dienst doorbell_image nachgeladen.
  - platform: online_image
    id: db_haus_image
    url: "http://${ha_host}/"
    format: JPEG
    type: RGB565
    on_download_finished:
      - lambda: 'id(mn)->bild_neu();'   # Kamerabild-Kacheln im Menue/Popup auffrischen
    on_error:
      - lambda: 'ESP_LOGW("klingel", "Klingelbild (Haustuer) konnte nicht geladen werden");'
  # Klingel-Bild (Wohnungstuer): dasselbe Foto wie aufs Handy, in HA auf 216x112
  # verkleinert (doorbell_image.py). Wird vom Dienst doorbell_image nachgeladen.
  - platform: online_image
    id: db_wohn_image
    url: "http://${ha_host}/"
    format: JPEG
    type: RGB565
    on_download_finished:
      - lambda: 'id(mn)->bild_neu();'   # Kamerabild-Kacheln im Menue/Popup auffrischen
    on_error:
      - lambda: 'ESP_LOGW("klingel", "Klingelbild (Wohnungstuer) konnte nicht geladen werden");'

  # Schnelles Live-Bild: HA schreibt ~45 s lang laufend neue Bilder (live_image.py), die
  # Remote laedt sie fortlaufend nach (script live_loop), sobald das letzte fertig ist.
  - platform: online_image
    id: cam_fast_image
    url: "http://${ha_host}/"
    format: JPEG
    type: RGB565
    on_download_finished:
      - lvgl.image.update: {id: cf_img, src: cam_fast_image}
      - lvgl.widget.show: cf_img
      - lvgl.widget.hide: cf_ph
      # 350 ms Pause bis zum naechsten Bild: Tasten/Touch werden in den Luecken bedient.
      - lambda: |-
          id(live_busy) = false;
          id(live_next_ms) = millis() + 350;
      - lvgl.label.update: {id: cf_state, text: "Live"}
    on_error:
      - lambda: |-
          id(live_busy) = false;
          id(live_next_ms) = millis() + 1500;

  # Live-Bild einer Kamera (Menue > Kameras > Live-Bild): Snapshot von HA, dort auf
  # 216x122 verkleinert (cam_image.py). Wird vom Dienst cam_image (HA) nachgeladen.
  - platform: online_image
    id: cam_live_image
    url: "http://${ha_host}/"
    format: JPEG
    type: RGB565
    on_download_finished:
      - lvgl.image.update: {id: cv_img, src: cam_live_image}
      - lvgl.widget.show: cv_img
      - lvgl.widget.hide: cv_ph
      - lvgl.label.update: {id: cv_state, text: "Aktuell"}
    on_error:
      # Abruf scheiterte (z. B. ESP_ERR_HTTP_CONNECT direkt nach dem Dienstaufruf): bis zu
      # 5 Mal wiederholen, aber nur solange die Seite offen ist und gerade niemand bedient.
      - lambda: |-
          id(cam_try)++;
          ESP_LOGW("kamera", "Kamerabild-Abruf gescheitert (Versuch %d)", id(cam_try));
      - if:
          condition: {lambda: "return id(cam_try) < 5 && id(cur_page) == 37;"}
          then:
            - delay: 1500ms
            - script.execute: cam_load
          else:
            - lvgl.label.update: {id: cv_state, text: "Bild nicht geladen - Aktualisieren"}

display:
  - platform: ili9341_i80
    id: main_display
    # Schnellerer WLAN-Start (2026-09-30): Display, Touch, LVGL und Bewegungssensor starten erst NACH dem
    # WLAN (Stufe 250). Sie brauchten davor zusammen ~3,5 s (feste Wartezeiten beim Einschalten, Aufbau),
    # das WLAN wartete so lange. Reihenfolge untereinander bleibt: Display 245 > Touch 244 > LVGL 243.
    setup_priority: 245
    cs_pin: GPIO39
    dc_pin: GPIO40
    wr_pin: GPIO41
    rd_pin: GPIO42
    enable_pin: {number: GPIO38}
    invert_colors: true
    data_pins: [GPIO48, GPIO47, GPIO21, GPIO14, GPIO13, GPIO12, GPIO11, GPIO10]
    dimensions: {width: 240, height: 320}
    # Die Referenz-Firmware faehrt LovyanGFX mit 40 MHz; ihr eigenes
    # Ghost-Touch-Protokoll (Changelog 2.42/2.46) sagt aber, dass ein
    # niedrigerer Takt weniger Stoerung in den I2C-Touch-Bus einkoppelt.
    bus_frequency: 20MHz
    # update() schiebt nichts mehr zum Panel - LVGL schickt nur noch die
    # geaenderten Rechtecke ueber draw_pixels_at(). Vorher ging alle 16 ms der
    # komplette Framebuffer raus, egal ob sich etwas geaendert hatte: genau das
    # hat den Bus gesaettigt und die Bilder zerrissen.
    update_interval: 1s

touchscreen:
  - platform: ft63x6
    id: main_touch
    setup_priority: 244   # nach dem Display, s. display:
    display: main_display
    # Abfrage alle 10 ms statt 50 ms (2026-10-11, Nutzerwunsch "schnelles Wischen geht nicht, so fluessig wie
    # beim Handy"): bei 50 ms sah LVGL von einem schnellen Wisch nur 2-3 Punkte - kein Scrollen, kein Schwung.
    # Im Ruhezustand gilt weiter die Einstellung ps_touch_ms (mindestens 50 ms, s. Display aus).
    update_interval: 10ms
    transform:
      mirror_x: true
      mirror_y: true
    on_touch:
      # ZUERST festhalten, ob das Display dunkel war - wake_backlight setzt
      # disp_off sofort zurueck, danach waere es nicht mehr feststellbar.
      - lambda: |-
          if (id(touch_active)) return;
          id(touch_active) = true;
          id(touch_moved) = false;
          id(touch_was_dark) = id(disp_off);
          id(touch_x) = touch.x;
          id(touch_y) = touch.y;
          id(last_input_ms) = millis();
          // Schwingt gerade etwas nach (LVGL-Scroll-Schwung)? Dann haelt dieser Tipp es nur an - beim Loslassen
          // kein Klick (s. on_release). LVGL stoppt den Schwung beim Druecken selbst.
          id(stopp_tipp) = false;
          for (lv_indev_t *in = lv_indev_get_next(nullptr); in != nullptr; in = lv_indev_get_next(in))
            if (lv_indev_get_type(in) == LV_INDEV_TYPE_POINTER && lv_indev_get_scroll_obj(in) != nullptr) id(stopp_tipp) = true;
          // Touch-Test: Punkt setzen und Ring an die Fingerposition.
          if (id(cur_page) == 36) {
            id(tt_x) = touch.x; id(tt_y) = touch.y;
            id(tt_press)->execute();
            id(tt_move)->execute();
          }
          if (id(disp_off)) weck_log("Touch");
      - script.execute: wake_backlight
    on_update:
      - lambda: |-
          // Solange der Finger liegt (langes Halten/Wischen) kommt nach dem ersten
          // Tipp kein neues Ereignis - der Display-Timeout lief trotzdem weiter und
          // dimmte/schaltete aus. Deshalb jede Sekunde den Ruhe-Timer erneuern.
          if (id(touch_active) && (millis() - id(touch_ping_ms)) > 1000) {
            id(touch_ping_ms) = millis();
            id(idle_touch_ping)->execute();
          }
          if (id(cur_page) == 36) {
            for (auto t : touches) { id(tt_x) = t.x; id(tt_y) = t.y; }
            id(tt_move)->execute();
          }
          bool neu_bewegt = false;
          // Ziehen ist kein Tippen (2026-10-02, s. esphomeremote-eingabe.h): ueberall ausser Touch-Test (36).
          // Aufsetzpunkt der JEWEILIGEN Beruehrung (x_org/y_org) - on_update laeuft bei einer neuen Beruehrung
          // VOR on_touch, touch_x/touch_y waeren dann noch die des vorigen Tipps (schnelle Tipps gingen verloren).
          for (auto t : touches) ziehen_pruefen((int) t.x - (int) t.x_org, (int) t.y - (int) t.y_org, id(cur_page) == 36 || id(cur_page) == 51, t.x_org, t.y_org);
          for (auto t : touches) {
            if (abs((int) t.x - (int) t.x_org) > 8 || abs((int) t.y - (int) t.y_org) > 8) {   // x_org: s. oben
              if (!id(touch_moved)) neu_bewegt = true;
              id(touch_moved) = true;
            }
          }
          // Sobald aus der Beruehrung ein Wischen wird, die laufende Eingabe
          // bei LVGL abbrechen. Auf scrollbaren Seiten macht LVGL daraus von
          // selbst ein Scrollen und verwirft den Klick - auf der Startseite
          // gibt es aber nichts zu scrollen, dort bleibt der Druck am Knopf
          // haengen und wird beim Abheben ausgeloest, obwohl der Finger
          // laengst woanders ist. lv_indev_reset beendet die Eingabe sauber,
          // ohne ein Klick-Ereignis zu erzeugen.
          // 2026-10-07: nur, wenn unter dem Finger NICHTS scrollen kann. Vorher galt "Bildschirm nicht scrollbar" -
          // im Konfigurator-Menue scrollt aber ein Bereich (konf_root) auf einem festen Bildschirm: jedes Wischen
          // wurde nach 8 px abgebrochen, schnelles Wischen scrollte nur ein Stueck und ohne Schwung.
          bool scrollt = false;
          if (neu_bewegt) {
            lv_obj_t *sc0 = lv_screen_active();
            for (auto t : touches) {
              lv_point_t p = {(int32_t) t.x_org, (int32_t) t.y_org};
              for (lv_obj_t *o = sc0 ? lv_indev_search_obj(sc0, &p) : nullptr; o != nullptr && !scrollt; o = lv_obj_get_parent(o))
                scrollt = lv_obj_has_flag(o, LV_OBJ_FLAG_SCROLLABLE) &&
                          (lv_obj_get_scroll_top(o) > 0 || lv_obj_get_scroll_bottom(o) > 0 ||
                           lv_obj_get_scroll_left(o) > 0 || lv_obj_get_scroll_right(o) > 0);
            }
          }
          // Touchpad (51): Ziehen IST dort die Bedienung - nie abbrechen (sonst kam nur ein kurzes Stueck Weg an)
          if (neu_bewegt && !scrollt && id(cur_page) != 51) {
            lv_obj_t *sc = lv_screen_active();
            ESP_LOGI("touch", "Wischen ohne scrollbaren Bereich: Eingabe zurueckgesetzt (Seite %d)", id(cur_page));
            if (sc != nullptr) {
              lv_indev_t *ind = lv_indev_get_next(nullptr);
              while (ind != nullptr) {
                if (lv_indev_get_type(ind) == LV_INDEV_TYPE_POINTER)
                  lv_indev_reset(ind, nullptr);
                ind = lv_indev_get_next(ind);
              }
            }
          }
    on_release:
      - lambda: |-
          id(touch_active) = false;
          // Kein Klick nach einem Stopp-Tipp oder einem Wisch, den LVGL nicht als Scrollen erkannt hat (der Chip
          // meldete bei schnellen Wischern oft nur Aufsetzen und Abheben - die Abhebe-Position liegt dann weit weg).
          // Scrollt LVGL selbst, verwirft es den Klick ohnehin - dann nichts anfassen.
          bool wisch = id(main_touch)->weg() > 14 && id(cur_page) != 36 && id(cur_page) != 51;
          if (wisch) {   // Regler duerfen gezogen werden (wie ziehen_pruefen)
            lv_point_t p0{(int32_t) id(touch_x), (int32_t) id(touch_y)};
            lv_obj_t *o = lv_indev_search_obj(lv_layer_top(), &p0);
            if (o == nullptr) o = lv_indev_search_obj(lv_screen_active(), &p0);
            for (lv_obj_t *q = o; q != nullptr && wisch; q = lv_obj_get_parent(q))
              if (lv_obj_check_type(q, &lv_slider_class) || lv_obj_check_type(q, &lv_bar_class)) wisch = false;
          }
          if (id(stopp_tipp) || wisch) {
            for (lv_indev_t *in = lv_indev_get_next(nullptr); in != nullptr; in = lv_indev_get_next(in))
              if (lv_indev_get_type(in) == LV_INDEV_TYPE_POINTER && lv_indev_get_scroll_obj(in) == nullptr) {
                lv_indev_wait_release(in);
                ESP_LOGI("touch", "Klick verworfen (%s, Weg %u px)", id(stopp_tipp) ? "Tipp stoppt Schwung" : "Wisch", id(main_touch)->weg());
              }
          }
          // Schneller Wisch, den LVGL nicht als Scrollen gesehen hat (der Chip lieferte nur Aufsetzen und Abheben):
          // selbst scrollen, mit Schwung nach Tempo - wie am Handy (2026-10-17).
          if (wisch && !id(stopp_tipp)) {
            bool lvgl_scrollt = false;
            for (lv_indev_t *in = lv_indev_get_next(nullptr); in != nullptr; in = lv_indev_get_next(in))
              if (lv_indev_get_type(in) == LV_INDEV_TYPE_POINTER && lv_indev_get_scroll_obj(in) != nullptr) lvgl_scrollt = true;
            const int dx = -id(main_touch)->wisch_dx(), dy = -id(main_touch)->wisch_dy();   // gespiegelt wie transform
            const uint32_t ms = std::max<uint32_t>(id(main_touch)->wisch_ms(), 20);
            if (!lvgl_scrollt && (abs(dx) > 20 || abs(dy) > 20)) {
              const bool senkrecht = abs(dy) >= abs(dx);
              const float v = (float) std::max(abs(dx), abs(dy)) / ms;          // px je ms
              const float f = 1.5f + 2.5f * std::min(v, 3.0f);                 // schneller Wisch = weiter
              lv_point_t p0{(int32_t) id(touch_x), (int32_t) id(touch_y)};
              lv_obj_t *o = lv_indev_search_obj(lv_screen_active(), &p0);
              for (; o != nullptr; o = lv_obj_get_parent(o)) {
                if (!lv_obj_has_flag(o, LV_OBJ_FLAG_SCROLLABLE)) continue;
                if (senkrecht ? (lv_obj_get_scroll_top(o) > 0 || lv_obj_get_scroll_bottom(o) > 0)
                              : (lv_obj_get_scroll_left(o) > 0 || lv_obj_get_scroll_right(o) > 0)) break;
              }
              if (o != nullptr) {
                lv_obj_scroll_by_bounded(o, senkrecht ? 0 : (int32_t) (dx * f), senkrecht ? (int32_t) (dy * f) : 0, LV_ANIM_ON);
                ESP_LOGI("touch", "Schneller Wisch: %d/%d px in %u ms -> gescrollt x%.1f", dx, dy, (unsigned) ms, f);
              }
            }
          }
          id(stopp_tipp) = false;
          if (id(cur_page) == 36) lv_obj_add_flag(id(tt_ring), LV_OBJ_FLAG_HIDDEN);
output:
  - platform: ledc
    id: backlight_pwm
    pin: {number: GPIO9, inverted: true}
  - platform: ledc
    id: button_backlight_pwm
    pin: {number: GPIO46}

light:
  - platform: monochromatic
    id: display_backlight
    output: backlight_pwm
    default_transition_length: 120ms
    # Beim Start AUS (2026-10-21, vorher ALWAYS_ON): an macht sie wake_backlight am Ende des Starts - so bleibt das Display
    # nach dem Aufwachen durch Bewegung bzw. eine Nicht-Menuetaste ganz dunkel (vorher leuchtete es die ~4 s Start ueber).
    restore_mode: ALWAYS_OFF
    # Absicherung: geht die Beleuchtung an, waehrend der Controller schlaeft (Weg ohne wake_backlight), ihn wecken
    on_turn_on:
      - lambda: 'if (id(panel_schlaeft)) { id(main_display).exit_sleep(); id(panel_schlaeft) = false; }'
  - platform: monochromatic
    id: button_backlight
    output: button_backlight_pwm
    default_transition_length: 120ms
    restore_mode: ALWAYS_OFF        # Tastenbeleuchtung standardmaessig aus

interval:
  # Werte ueber das Dock (2026-10-23): jede Minute, solange wach und ohne eigene HA-Verbindung (s. dock_status_melden)
  - interval: 60s
    then:
      - lambda: |-
          if (api::global_api_server->is_connected()) return;
          id(dock_status_melden).execute(false);
          // Stand (und Soll-Konfiguration "kh") beim Dock abfragen - neue Konfiguration kommt so auch bei dunklem Display
          id(tk_cfg).zustand_anfragen();
          // Neue Konfiguration angekuendigt, HA-Link aber pausiert: s. Skript belegung_link_wecken (hier nur Nachzuegler)
          id(belegung_link_wecken).execute();
  # HA-Link-Ruhe nachholen (2026-10-24): ha_link_ruhe_timer prueft nur einmal - lief er z. B. ins Wartungsfenster nach dem
  # Flashen oder in den Link-Weck fuer eine neue Konfiguration, blieb der Link dauerhaft an. Display aus, Link an, kein
  # Timer -> neu starten (seine Bedingungen gelten weiter).
  - interval: 30s
    then:
      - lambda: |-
          if (id(ha_link_ruhe) <= 0 || id(ha_link_modus) <= 0 || !id(disp_off)) return;
          if (id(kb).link_paused() || id(kb).link_schlummer() || id(ha_link_ruhe_timer).is_running()) return;
          id(ha_link_ruhe_timer).execute();
  # Dock-Symbol der Statusleiste nachfuehren, wenn sich der Weg der HA-Befehle aendert (2026-10-20) - die Balken
  # werden sonst nur vom WLAN-/Bluetooth-Takt aufgefrischt. Ist das Dock noch nicht bestaetigt (oder zuletzt nicht
  # erreicht), fragt die Remote bei Display an selbst den Stand ab - nichts wird ausgefuehrt; hoechstens alle 60 s.
  - interval: 2s
    then:
      - lambda: |-
          static int vorher = -1;
          static uint32_t geprueft = 0;
          const int dw = id(tk_cfg).dock_weg();
          if ((dw == 1 || dw == 3) && !id(disp_off) && (geprueft == 0 || millis() - geprueft > 60000)) {
            geprueft = millis() | 1;
            id(tk_cfg).dock_pruefen();
          }
          if (dw != vorher) { vorher = dw; id(refresh_wifi_bars).execute(); }
          // Funkkonzept "Dock, WLAN als Ausweg" (2026-10-25): Einstellung nachfuehren (kommt auch spaeter vom Konfigurator)
          id(kb).set_link_gesperrt(id(ha_link_modus) == 3);
          // Bei "WLAN aus" und Benutzung: kein Dock eingerichtet oder zuletzt keins erreicht -> eigenes WLAN. Steht es,
          // solange das Display an ist halten (sonst ginge es aus, sobald HA verbunden ist und das Dock-Symbol weg ist).
          // Antwortet das Dock wieder, laeuft der Bedarf aus (WLAN 30 s spaeter aus); bis dahin mit WLAN alle 10 s nachfragen
          // (2026-10-25: ein einziger Fehlschlag beim Aufwachen hielt sonst das WLAN, solange das Display an war).
          static uint32_t dock_nachgefragt = 0;
          if (wlan_zugriff::g_nur_ble && !id(disp_off)) {
            const bool hat_dock = !id(tk_cfg).dock_macs().empty();
            const bool dock_ok = id(tk_cfg).dock_erreichbar();
            if (!hat_dock) wlan_zugriff::bedarf(30000, "kein Dock eingerichtet");
            else if (dw == 3) wlan_zugriff::bedarf(30000, "Dock nicht erreicht");
            else if (wlan_zugriff::bedarf_aktiv() && !dock_ok) {
              wlan_zugriff::bedarf(30000, "Display an, Dock noch nicht zurueck");
              if (api::global_api_server->is_connected() && millis() - dock_nachgefragt > 10000) {
                dock_nachgefragt = millis();
                id(tk_cfg).dock_pruefen();
              }
            }
          }
  # Stand ueber das Dock auch waehrend der Nutzung (2026-10-20): Display an, aber keine eigene HA-Verbindung (z. B.
  # "Nur Dock" oder HA-Link pausiert) -> Startseite/Player/Fernseher/Timer/Popups beim Dock abfragen. Funk nur kurz an.
  # Takt (2026-10-26, Nutzerwunsch "schneller"): Display an jede Sekunde, sonst alle 2 s (bis 2026-10-25: 5 s).
  - interval: 1s
    then:
      - lambda: |-
          static bool ungerade = false;
          ungerade = !ungerade;
          if (id(disp_off) && ungerade) return;
          // In Benutzung (2026-10-25): Display an ODER in der letzten Minute Taste, Beruehrung oder Bewegung - auch bei
          // dunklem Display (Lautstaerke, Play/Pause, Remote in der Hand). Popups kommen so auch dann.
          const uint32_t jetzt = millis();
          const bool in_benutzung = !id(disp_off) || jetzt - id(last_input_ms) < 60000 ||
                                    (id(last_motion_ms) != 0 && jetzt - id(last_motion_ms) < 60000);
          if (!in_benutzung || id(ha_dock) == 0 || api::global_api_server->is_connected()) return;
          id(tk_cfg).zustand_anfragen();
  # Dock-Anzeige (im Dock? zurueck zur Dock-Seite, Uhr, Daten) und Bewegungsgesten (FIFO abholen), 2026-10-17
  - interval: 250ms
    then:
      - lambda: 'dockanz::takt();'
  - interval: 100ms
    then:
      - lambda: 'gesten::takt(); gestenseite::takt();'
  # Notanker HA-Verbindung (2026-10-16): nach dem Ausstecken des Docks war Remote 2 3 min fuer HA weg (WLAN aus, keine
  # Bluetooth-Werbung) bis zum Neustart. Ist HA 3 min nicht verbunden, WLAN per Wartungsfenster 3 min erzwingen -
  # die Bruecke (ble_link.py) nimmt dann den WLAN-Weg. Wiederholung fruehestens nach 10 min (2026-10-18: einzige
  # Rettung bei "Nur Bluetooth" - der Tunnel schaltet den Modus nicht mehr ab; vorher 30 min).
  - interval: 20s
    then:
      - lambda: |-
          static uint32_t ohne_ha = 0, letzter = 0;
          const uint32_t jetzt = millis();
          // HA-Link absichtlich pausiert (Ruhezustand, ha_link_ruhe): kein Notfall
          if (api::global_api_server->is_connected_with_state_subscription() || id(kb).funk_aus() || id(kb).link_paused()) { ohne_ha = 0; return; }
          // Dock als Zentrale (2026-10-24): hat das Dock in den letzten 3 min geantwortet, erreicht HA die Remote ueber
          // das Dock - kein Notfall. Sonst oeffnete der Notanker nachts alle 10-60 min das WLAN (Akku, Schlaf-Uhr neu).
          if (id(ha_dock) > 0 && id(direkt).ok_ms() != 0 && jetzt - id(direkt).ok_ms() < 180000) { ohne_ha = 0; return; }
          if (ohne_ha == 0) { ohne_ha = jetzt | 1; return; }
          if (jetzt - ohne_ha < 180000 || (letzter != 0 && jetzt - letzter < 600000) || jetzt < id(wartung_bis)) return;
          letzter = jetzt;
          weck_log("HA 3 min weg - WLAN-Notanker");
          id(wartungsfenster)->execute();
  # Positionsanzeige weiterzaehlen (Media-Seite offen und Wiedergabe laeuft - oder Startseite mit
  # ausgeklappter, grosser Player-Karte: dort zeigt der Fortschrittsbalken jetzt mit, Nutzerwunsch
  # 2026-09-22 "unterm Interpret").
  - interval: 1s
    then:
      - if:
          condition: {lambda: 'return (id(cur_page) == 6 || id(cur_page) == 0) && id(media_pos_s) >= 0 && id(mp_state).state == "playing";'}
          then: [{script.execute: update_media_pos}]
  # Hochheben erkennen: Winkel zwischen aktuellem Schwerkraftvektor und der
  # Lage beim Ablegen. Nur, solange das Display aus ist und "Aufwecken bei" =
  # Hochheben - sonst kostet es unnoetig I2C-Verkehr. Aus dem Abgedunkelten hellt
  # "Aufhellen bei Bewegung" (Ruck, siehe unten) auf, unabhaengig vom Weck-Modus.
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: "return id(disp_off) && id(motion_mode) == 2;"
          then:
            - lambda: |-
                float x, y, z;
                if (!lage_lesen(x, y, z)) return;
                const float deg = remote_strom::winkel_grad(x, y, z, id(mb_x), id(mb_y), id(mb_z));
                if (deg < 0) return;
                // Schwellen gesenkt (vorher 25/40/60) - beim normalen
                // Hochnehmen kippt die Fernbedienung weniger weit als
                // angenommen. Die Haltezeit von 750 ms filtert das Wackeln
                // ohnehin, der Winkel darf daher kleiner sein.
                // Laeuft nur bei Display aus (Bedingung oben): Empfindlichkeit "Aufwecken bei" (motion_sens).
                // Bei hellem/abgedunkeltem Display kuemmert sich das Kippen-Intervall darunter (dim_sens).
                static const float lim[3] = {12.0f, 20.0f, 35.0f};
                int i = id(motion_sens);
                if (i < 0) i = 0;
                if (i > 2) i = 2;

                // Wackeln auf der Couch kippt die Fernbedienung kurz und laesst
                // sie zurueckfallen - der Winkel ist also nur einen Augenblick
                // gross. Echtes Hochnehmen HAELT die neue Lage. Deshalb erst
                // wecken, wenn die Abweichung mehrere Messungen ueberdauert
                // (3 x 250 ms = 750 ms), statt beim ersten Ausschlag.
                if (deg >= lim[i]) {
                  id(lift_cnt)++;
                  ESP_LOGD("motion", "Winkel %.0f Grad (%d/3)", deg, id(lift_cnt));
                  if (id(lift_cnt) >= 3) {
                    ESP_LOGI("motion", "Hochheben erkannt: %.0f Grad, gehalten", deg);
                    id(lift_cnt) = 0;
                    // Das Icon erst HIER, wenn wirklich etwas passiert - nicht schon bei der
                    // ersten Einzelmessung ueber der Schwelle (sonst blinkt es, ohne dass sich
                    // am Display etwas tut - genau das hatte der Nutzer bemaengelt 2026-09-22).
                    id(motion_icon_blip)->execute();
                    weck_log("Bewegung (Hochheben)");
                    id(wake_backlight)->execute();
                  }
                } else if (id(lift_cnt) != 0) {
                  ESP_LOGD("motion", "Winkel wieder unter Schwelle (%.0f Grad) - verworfen", deg);
                  id(lift_cnt) = 0;
                }

  # Kippen bei hellem/abgedunkeltem Display (2026-10-13, Nutzer: "nur bei ruckartiger Bewegung? Es soll
  # natuerlich auch beim Winkel passieren"). Der Ruck unten kommt aus dem Hochpass des Chips - langsames
  # Neigen sieht der nicht. Hier: Winkel zur zuletzt gemerkten Lage; ab der Schwelle der Abdunkel-
  # Empfindlichkeit (dim_sens, 6/12/25 Grad wie beim Hochheben) wie ein Ruck: aufhellen bzw. hell halten.
  - interval: 250ms
    then:
      - lambda: |-
          static float rx = 0, ry = 0, rz = 0;   // Bezugslage
          static uint8_t treffer = 0;
          const bool hellt = id(disp_dimmed) && !id(disp_off) && id(dim_wake);
          const bool haelt = !id(disp_off) && !id(disp_dimmed) && id(dim_hold_motion);
          if (!hellt && !haelt) { rx = ry = rz = 0; treffer = 0; return; }
          float x, y, z;
          if (!lage_lesen(x, y, z)) return;
          if (rx == 0 && ry == 0 && rz == 0) { rx = x; ry = y; rz = z; return; }   // erste Lage = Bezug
          const float deg = remote_strom::winkel_grad(x, y, z, rx, ry, rz);
          if (deg < 0) return;
          static const float lim[3] = {6.0f, 12.0f, 25.0f};
          int i = id(dim_sens); if (i < 0) i = 0; if (i > 2) i = 2;
          if (deg < lim[i]) { treffer = 0; return; }
          if (++treffer < 2) return;   // zwei Messungen (500 ms) - ein einzelner Ausreisser zaehlt nicht
          treffer = 0;
          rx = x; ry = y; rz = z;      // neue Lage merken
          id(last_motion_ms) = millis();
          ESP_LOGI("motion", "Kippen erkannt: %.0f Grad (%s)", deg, hellt ? "war abgedunkelt" : "haelt hell");
          id(motion_icon_blip)->execute();
          id(idle_touch_ping)->execute();
  # Ruck und Doppelklopfen: wertet der Bewegungs-Chip bei JEDER Messung (200 Hz) selbst aus und
  # haelt ein Ereignis fest, bis es hier abgeholt wird. Frueher verglich die Software alle 250 ms
  # zwei Messungen und verlangte drei Treffer in Folge - ein kurzer Ruck fiel dabei fast immer
  # zwischen zwei Abfragen oder wurde als Ausreisser verworfen (Nutzerwunsch 2026-09-24: "ein
  # kurzer Ruck wird gar nicht registriert"). Die Ereignisse werden in JEDEM Takt abgeholt, auch
  # wenn keine Option sie braucht - sonst loeste ein alter, liegengebliebener Ruck spaeter aus.
  #   Ruck weckt:    "Aufwecken bei" = Bewegung, aus dem Ruhezustand
  #   Ruck hellt:    "Aufhellen bei Bewegung", aus dem Abgedunkelten - unabhaengig vom Weck-Modus
  #   Ruck haelt:    "Nicht abdunkeln bei Bewegung", solange das Display hell ist
  #   Doppelklopfen: "Doppelt klopfen weckt", aus dem Ruhezustand und dem Abgedunkelten
  - interval: 250ms
    then:
      - lambda: |-
          bool ruck = false, doppel = false;
          // Schwelle: aus dem Ruhezustand gilt "Empfindlichkeit" (motion_sens), sonst die eigene
          // Empfindlichkeit der Abdunkel-Optionen (dim_sens).
          id(motion_chip)->set_ruck_threshold(id(disp_off) ? remote_strom::ruck_ths(id(motion_sens)) : remote_strom::dim_ths(id(dim_sens)));
          if (!id(motion_chip)->poll_events(ruck, doppel)) return;
          // WLAN frueh einschalten: jede erkannte Bewegung bei dunklem Display, auch wenn sie es nicht weckt.
          if (ruck || doppel) id(last_motion_ms) = millis();
          if ((ruck || doppel) && id(disp_off)) { id(wlan_frueh_grund) = doppel ? "Klopfen" : "Bewegung"; id(wlan_frueh_an)->execute(); }
          const bool dunkel = id(disp_off) || id(disp_dimmed);
          const bool ruck_weckt = id(motion_mode) == 1 && id(disp_off);
          // Aufhellen und Nicht-Abdunkeln gelten unabhaengig von "Aufwecken bei" (Nutzerwunsch
          // 2026-09-27: ging vorher nur, wenn dort Bewegung bzw. Hochheben gewaehlt war).
          const bool ruck_hellt = id(disp_dimmed) && !id(disp_off) && id(dim_wake);
          const bool ruck_haelt = !dunkel && id(dim_hold_motion);
          ruck = ruck && (ruck_weckt || ruck_hellt || ruck_haelt);
          doppel = doppel && dunkel && id(klopf_wake);
          if (!ruck && !doppel) return;
          ESP_LOGI("motion", "%s erkannt (%s)", doppel ? "Doppelklopfen" : "Ruck",
                   id(disp_off) ? "war aus" : (id(disp_dimmed) ? "war abgedunkelt" : "haelt hell"));
          id(motion_icon_blip)->execute();
          if (id(disp_off)) { weck_log(doppel ? "Doppelklopfen" : "Bewegung (Ruck)"); id(wake_backlight)->execute(); }
          else id(idle_touch_ping)->execute();

  - interval: 1s
    then:
      # Statusleiste nachziehen, sobald sich ein Verbindungszustand aendert (WLAN an/aus, Bluetooth aus,
      # HA ueber WLAN/Bluetooth) - nicht jeder Wechsel hat ein eigenes Ereignis (2026-10-10).
      - lambda: |-
          auto *w = wifi::global_wifi_component;
          const bool ha_da = api::global_api_server->is_connected_with_state_subscription();
          const int z = (w->is_connected() ? 1 : 0) | (w->is_disabled() ? 2 : 0) | (wlan_zugriff::g_nur_ble ? 4 : 0) |
                        (id(kb).funk_aus() ? 8 : 0) | (ha_da ? 16 : 0) |
                        (ha_da && wlan_zugriff::g_link_ha && wlan_zugriff::g_link_ha() ? 32 : 0);
          static int vorher = -1;
          if (z != vorher) {
            vorher = z;
            id(refresh_wifi_bars).execute();
            id(refresh_ble_bars).execute();
          }
      # BLE-Signalstaerke (alle 3 s) nur fuer die Balken oben - bei Display aus pausieren (Strom, 2026-10-06).
      # Sprache pausiert ebenfalls (teilt sich den BT-Controller mit dem Audio).
      - lambda: 'id(kb).set_rssi_paused(id(disp_off) || id(voice_active) || id(host_mic));'
      # Mikrofon (I2S) nur bei Display an vorgewaermt - sonst kein Leichtschlaf (pm_bericht 2026-10-07)
      - lambda: 'id(voice).set_ruhe((id(disp_off) || !id(mic_vorwaermen)) && !id(voice_active) && !id(host_mic));'
      # Nur aktualisieren, wenn die Uhr auch zu sehen ist. Sie bleibt zwar als
      # Platzhalter stehen, damit die Statuszeile ihre Form behaelt - aber der
      # sekuendliche Textwechsel wuerde die Flaeche jedes Mal als veraendert
      # markieren und LVGL zum Neuzeichnen zwingen, ohne dass sich sichtbar
      # etwas tut. Wenig Aufwand, aber unnoetiger.
      - lambda: |-
          if (!id(show_clock) || id(disp_off)) return;
          auto t = id(sntp_time).now();
          char b[8] = "--:--";   // 8: Compiler rechnet mit bis zu 3 Ziffern je Feld
          if (t.is_valid()) snprintf(b, sizeof(b), "%02d:%02d", t.hour, t.minute);
          if (strcmp(lv_label_get_text(id(idle_clock)), b) != 0) lv_label_set_text(id(idle_clock), b);
      # Countdown "Timer Wohnung" NEBEN der Uhr (Nutzerwunsch 2026-09-17:
      # "neben der Uhr, nicht statt der Uhr") - unabhaengig von show_clock,
      # eigener kleiner Indikator. Lokale Sekunde runterzaehlen: HA schickt
      # das "remaining"-Attribut nur bei Start/Pause/Ende neu, nicht jede
      # Sekunde (s. timer_wohnung_remaining_attr weiter unten).
      - if:
          condition: {lambda: "return id(timer_wohnung_active) && !id(disp_off);"}
          then:
            - lvgl.label.update:
                id: timer_wohnung_lbl
                text: !lambda |-
                  // Restzeit aus dem Endzeitpunkt (finishes_at) - sonst, solange
                  // Uhrzeit oder Endzeit fehlen, sekundenweise runterzaehlen.
                  auto jetzt = id(sntp_time).now();
                  if (id(timer_wohnung_end) > 0 && jetzt.is_valid()) {
                    const long r = (long) id(timer_wohnung_end) - (long) jetzt.timestamp;
                    id(timer_wohnung_remaining) = r > 0 ? (int) r : 0;
                  } else if (id(timer_wohnung_remaining) > 0) {
                    id(timer_wohnung_remaining) -= 1;
                  }
                  int total = id(timer_wohnung_remaining);
                  if (total < 0) total = 0;
                  int hh = total / 3600, mm = (total % 3600) / 60, ss = total % 60;
                  char b[16];
                  if (hh > 0) snprintf(b, sizeof(b), "%d:%02d:%02d", hh, mm, ss);
                  else        snprintf(b, sizeof(b), "%d:%02d", mm, ss);
                  return std::string(b);

  # Speicher-Diagnose (Fehlersuche: HA konnte die Remote zeitweise nicht einrichten).
  # Debug-Modus (Einstellungen > Wartung & Tests, 2026-10-07): Diagnose-Werte an HA und ins Log nur, wenn er an ist.
  # Aus = kein regelmaessiger Funkverkehr fuer Diagnose (vorher RAM/Laufzeit/Config/"Verbunden mit" dauernd an HA,
  # Heap-Log alle 10 s).
  - interval: 60s
    id: diagnose_60s
    then:
      - if:
          condition: {lambda: 'return id(ps_log_debug);'}
          then:
            - lambda: |-
                ESP_LOGD("heap", "intern frei %u KB (groesster Block %u KB), PSRAM frei %u KB",
                         (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                         (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024),
                         (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024));
            - component.update: ram_frei
            - component.update: ram_min
            - component.update: ram_block
            - component.update: laufzeit
            - component.update: ble_host_txt

  # Tiefschlaf-Sicherheitsnetz: deep_ruhe_timer laeuft nur einmal je Display-Aus.
  # Endet er ohne Schlaf (Ladekabel, Sprachabfrage ...), probiert dieser Timer
  # es alle 4 min neu, solange das Display aus ist. Laeuft er noch, wird er
  # NICHT neu gestartet (sonst begaenne sein Countdown immer wieder von vorn).
  - interval: 4min
    then:
      - if:
          condition:
            and:
              - not: {script.is_running: deep_ruhe_timer}
              - lambda: 'return id(disp_timeout_s) > 0 && tiefschlaf_erlaubt(false);'
          then:
            - script.execute: deep_ruhe_timer
      - script.execute: schlaf_status_melden

script:
  # IR anlernen (Konfigurator, 2026-10-11): Empfaenger an, Fenster offen halten, danach wieder aus.
  - id: ir_lern_fenster
    mode: restart
    parameters: {sekunden: int}
    then:
      - switch.turn_on: ir_rx_power
      - delay: 60ms
      - globals.set: {id: ir_lern_ha, value: "true"}
      - delay: !lambda 'return (uint32_t) std::max(5, std::min(60, sekunden)) * 1000;'
      - if:
          condition: {lambda: 'return id(ir_lern_ha);'}
          then:
            - globals.set: {id: ir_lern_ha, value: "false"}
            - switch.turn_off: ir_rx_power
            - homeassistant.event:
                event: esphome.remote_ir_gelernt
                data:
                  geraet: !lambda 'return App.get_name();'
                  fehler: "Nichts empfangen"
  # Bluetooth-Platz verbinden / neu koppeln / loeschen (Bluetooth-Seite und Konfigurator). Neu koppeln auf einem
  # gerade verbundenen Platz tut nichts (ein zweiter Druck loeschte frueher eine eben geglueckte Kopplung).
  - id: bt_platz_aktion
    parameters: {aktion: string, platz: int}
    then:
      - lambda: |-
          if (platz < 0 || platz > 3) return;
          id(sel_slot) = platz;
          char act[24];
          snprintf(act, sizeof(act), "forget_host:%d", platz);
          if (aktion == "loeschen") { id(kb).execute_action(act); return; }
          if (aktion == "koppeln") {
            if (platz == (int) id(kb).active_host_slot() && id(ble_paired).state) {
              lv_label_set_text(id(ble_state_lbl), "Schon verbunden - zum Neukoppeln erst löschen");
              return;
            }
            id(kb).execute_action(act);   // alte Bindung weg: der Platz wirbt wieder sichtbar
          } else if (aktion != "verbinden") {
            return;
          }
          snprintf(act, sizeof(act), "switch_host:%d", platz);
          id(kb).execute_action(act);
          // Aktivitaet mitziehen, die diesen Platz nutzt - sonst schaltet apply_activity beim naechsten Start zurueck
          const int a = tasten::aktivitaet_von_platz(platz);
          if (a >= 0) id(activity) = a;
      - script.execute: refresh_ble_slots
      - script.execute: bt_status_melden
  # Bluetooth-Plaetze an den Konfigurator melden (2026-10-11): belegt je Platz, aktiver Platz, verbunden, Namen.
  - id: bt_status_melden
    mode: restart
    then:
      - homeassistant.event:
          event: esphome.remote_bt_status
          data:
            geraet: !lambda 'return App.get_name();'
            belegt: !lambda |-
              std::string b;
              for (int k = 0; k < 4; k++) { if (k) b += ','; b += id(kb).get_host_slot(k).occupied ? '1' : '0'; }
              return b;
            aktiv: !lambda 'return (int) id(kb).active_host_slot();'
            verbunden: !lambda 'return id(ble_paired).state ? 1 : 0;'
  # Einstellungen an den Konfigurator melden (2026-10-16, esphomeremote-einst-sync.h): JSON {"name": wert}
  # Neustart nach einer Aenderung, die erst beim Start greift (Maus-Merkmale der Bluetooth-Tastatur)
  - id: neustart_gleich
    mode: single
    then:
      - delay: 3s
      - lambda: 'App.safe_reboot();'
  # Maus je Platz geaendert (2026-10-22): Neustart erst 8 s nach der letzten Aenderung - so laesst sich an der
  # Remote ueber "Maus" hinweg weiterschalten (vorher startete sie schon beim ersten Druck neu)
  - id: neustart_spaeter
    mode: restart
    then:
      - delay: 8s
      - lambda: 'App.safe_reboot();'
  # Bewegungsgesten: erkannte Gesten (Test im Konfigurator)
  # Gesten-Seite der Remote (esphomeremote-gestenseite.h): Aenderungen an HA, das sie in cfg.gesten speichert
  - id: gesten_aendern_an_ha
    mode: queued
    max_runs: 8
    parameters: {aktion: string, gid: string, name: string, wert: string, v: string}
    then:
      - homeassistant.event:
          event: esphome.remote_gesten_aendern
          data:
            geraet: !lambda 'return App.get_name();'
            aktion: !lambda 'return aktion;'
            id: !lambda 'return gid;'
            name: !lambda 'return name;'
            wert: !lambda 'return wert;'
            v: !lambda 'return v;'
  - id: geste_lernstand_an_ha
    mode: queued
    max_runs: 6
    parameters: {gid: string, probe: int, text: string}
    then:
      - homeassistant.event:
          event: esphome.remote_geste_lernstand
          data:
            geraet: !lambda 'return App.get_name();'
            id: !lambda 'return gid;'
            probe: !lambda 'return probe;'
            text: !lambda 'return text;'
  - id: geste_erkannt_an_ha
    parameters: {name: string, abstand: string}
    then:
      - homeassistant.event:
          event: esphome.remote_geste_erkannt
          data:
            geraet: !lambda 'return App.get_name();'
            name: !lambda 'return name;'
            abstand: !lambda 'return abstand;'
  - id: einst_an_ha
    parameters: {werte: string}
    then:
      # Ohne eigene HA-Verbindung ueber das Dock (2026-10-23): passt der volle Stand nicht in ein Funkpaket, nur der
      # Konfigurations-Stand (hash) - damit hakt der Konfigurator die mitgeschickten Einstellungen als uebernommen ab
      - lambda: |-
          if (api::global_api_server->is_connected()) return;
          std::map<std::string, std::string> d;
          d["hash"] = id(tk_cfg)->hash();
          if (werte.size() < 1000) d["werte"] = werte;
          id(tk_cfg).dock_aufruf("esphomeremote_konfig.einst_melden", d);
      - homeassistant.event:
          event: esphome.remote_einstellungen
          data:
            geraet: !lambda 'return App.get_name();'
            hash: !lambda 'return id(tk_cfg)->hash();'
            werte: !lambda 'return werte;'
  - id: ir_lern_melden
    parameters: {code: string, anzahl: int}
    then:
      - homeassistant.event:
          event: esphome.remote_ir_gelernt
          data:
            geraet: !lambda 'return App.get_name();'
            code: !lambda 'return code;'
            anzahl: !lambda 'return anzahl;'
  # Anzeige von page_bright auffrischen - auch fuer Einstellungs-Eintraege im Konfigurator-Menue (2026-10-04)
  - id: einst_bright
    then:
      - script.execute: apply_brightness
      - script.execute: apply_disp_timeout
      - script.execute: apply_power
      - script.execute: apply_hints
      - lvgl.label.update: {id: kbd_light_lbl, text: !lambda 'return id(kbd_light_on) ? std::string("AN") : std::string("AUS");'}
  # Anzeige von page_show auffrischen - auch fuer Einstellungs-Eintraege im Konfigurator-Menue (2026-10-04)
  - id: einst_show
    then:
      - script.execute: apply_show
      - script.execute: sd_logo_label
      - script.execute: apply_power
      - script.execute: apply_hints
      - lvgl.label.update: {id: cover_player_lbl, text: !lambda 'return id(cover_ganz_player) ? std::string("GANZ") : std::string("VOLL");'}
      - lvgl.label.update: {id: cover_home_lbl, text: !lambda 'return id(cover_ganz_home) ? std::string("GANZ") : std::string("VOLL");'}
  # Anzeige von page_power auffrischen - auch fuer Einstellungs-Eintraege im Konfigurator-Menue (2026-10-04)
  - id: einst_power
    then:
      - script.execute: apply_power
      - script.execute: apply_motion_on
      - script.execute: apply_motion_sens
      - lambda: |-
          lv_label_set_text(id(dim_wake_lbl), id(dim_wake) ? "AN" : "AUS");
          lv_obj_set_style_text_color(id(dim_wake_lbl),
              lv_color_hex(id(dim_wake) ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          lv_label_set_text(id(keys_wake_lbl), id(keys_wake_all) ? "Alle" : "Nur Menü");
          lv_label_set_text(id(menue_weckt_lbl), id(menue_weckt_nur) ? "Nur Display" : "Menü öffnen");
          int ks = id(klopf_sens); if (ks < 0) ks = 0; if (ks > 2) ks = 2;
          lv_label_set_text(id(klopf_sens_lbl), (const char *[]){"Hoch", "Mittel", "Niedrig"}[ks]);
          lv_slider_set_value(id(kl_sld), 2 - ks, LV_ANIM_OFF);
          lv_label_set_text(id(klopf_lbl), id(klopf_wake) ? "AN" : "AUS");
          lv_obj_set_style_text_color(id(klopf_lbl),
              lv_color_hex(id(klopf_wake) ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          lv_label_set_text(id(dim_hold_lbl), id(dim_hold_motion) ? "AN" : "AUS");
          lv_obj_set_style_text_color(id(dim_hold_lbl),
              lv_color_hex(id(dim_hold_motion) ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          int ds = id(dim_sens); if (ds < 0) ds = 0; if (ds > 2) ds = 2;
          lv_label_set_text(id(dim_sens_lbl), (const char *[]){"Hoch", "Mittel", "Niedrig"}[ds]);
          lv_slider_set_value(id(ds_sld), 2 - ds, LV_ANIM_OFF);
      - script.execute: apply_hints
  # Anzeige von page_voice_set auffrischen - auch fuer Einstellungs-Eintraege im Konfigurator-Menue (2026-10-04)
  - id: einst_voice_set
    then:
      - script.execute: apply_assistant
      - script.execute: apply_tts_speaker
      - script.execute: apply_hints
      - script.execute: apply_mic_warm
  - id: apply_mic_warm
    then:
      - lambda: |-
          const bool an = id(mic_vorwaermen);
          lv_label_set_text(id(mic_warm_lbl), an ? "AN" : "AUS");
          lv_obj_set_style_text_color(id(mic_warm_lbl), lv_color_hex(an ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          lv_label_set_text(id(h_mic_warm), an
            ? "Das Mikrofon läuft schon, solange das Display an ist. Du kannst sofort nach dem Tastendruck sprechen."
            : "Das Mikrofon startet erst mit der Taste. Etwa 1,5 s warten, bevor du sprichst. Spart etwas Strom bei Display an.");
  # Anzeige von page_ble auffrischen - auch fuer Einstellungs-Eintraege im Konfigurator-Menue (2026-10-04)
  - id: einst_ble
    then:
      - script.execute: refresh_ble_slots
      - script.execute: ble_optionen_anzeigen
      - lambda: 'extras::touchpad_auffrischen();'
  # Anzeige von page_akku auffrischen - auch fuer Einstellungs-Eintraege im Konfigurator-Menue (2026-10-04)
  - id: einst_akku
    then:
      - script.execute: refresh_laden
      - script.execute: akku_anzeige
  # Anzeige von page_extras auffrischen - auch fuer Einstellungs-Eintraege im Konfigurator-Menue (2026-10-17)
  - id: einst_extras
    then:
      - lambda: 'extras::auffrischen();'
  # Anzeige von page_service auffrischen - auch fuer Einstellungs-Eintraege im Konfigurator-Menue (2026-10-04)
  - id: einst_service
    then:
      - lvgl.label.update: {id: clean_dur_lbl, text: !lambda 'char b[12]; snprintf(b, sizeof(b), "%d s", id(clean_s)); return std::string(b);'}
      - lambda: 'lv_slider_set_value(id(clean_dur_sld), stufen::index(stufen::REINIGEN, id(clean_s)), LV_ANIM_OFF);'
      # Nach Touch-Test/Reinigung den Display-Timeout wieder anlaufen lassen.
      - if: {condition: {lambda: "return id(disp_timeout_s) > 0;"}, then: [{script.execute: backlight_idle_timeout}]}
      - script.execute: apply_power
      - script.execute: apply_hints
  # ---- Ruhe-Zeiten (Energie & Wecken) ----
  # Alle starten beim Display-Aus (backlight_idle_timeout) und zaehlen ab da; wake_backlight stoppt sie. Bei
  # niedrigem Akku (low_bat) gelten gekuerzte Zeiten (esphomeremote-strom.h).
  - id: wifi_ruhe_timer
    mode: restart
    then:
      - lambda: 'id(wifi_t0) = millis();'
      - wait_until:
          condition:
            lambda: |-
              // Ab dem spaetesten von: Timer-Start, letzter Bedienung (Taste/Touch), letzter Bewegung.
              uint32_t t0 = (int32_t) (id(last_input_ms) - id(wifi_t0)) > 0 ? id(last_input_ms) : id(wifi_t0);
              if ((int32_t) (id(last_motion_ms) - t0) > 0) t0 = id(last_motion_ms);
              const int lim = remote_strom::eff_wifi_s(id(ps_wifi_off_s), id(ps_wifi_off_tv_s), id(tv_on), id(low_bat));
              return lim >= 0 && (millis() - t0) >= (uint32_t) lim * 1000;
      - if:
          condition:
            lambda: "return id(disp_off) && (id(ps_wifi_off) || id(low_bat)) && !id(testmodus) && !id(boot_grace) && (int32_t)(millis() - id(wartung_bis)) >= 0 && !id(ota_aktiv);"
          then:
            - lambda: 'ESP_LOGI("strom", "WLAN aus (%d s nach Display-Aus bzw. letzter Bedienung)", id(ps_wifi_off_s)); weck_log("WLAN aus");'
            - wifi.disable:

  # Prozessor drosseln: ps_cpu_s Sekunden nach Display-Aus (0 = sofort), 80 statt
  # 240 MHz. wake_backlight nimmt es sofort zurueck.
  - id: cpu_ruhe_timer
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t) remote_strom::eff_cpu_s(id(ps_cpu_s), id(low_bat)) * 1000;'
      - lambda: 'id(cpu_low) = true;'
      - script.execute: apply_cpu

  # Bluetooth langsam: ps_ble_s Sekunden nach Display-Aus. Intervall 150 ms +
  # Slave-Latency 3, damit der Funk im Leerlauf nur ~alle 600 ms statt alle
  # 15 ms aufwacht. Der HID-Link bleibt - ein Tastendruck geht beim naechsten
  # Event raus. NICHT waehrend einer Sprachabfrage.
  - id: ble_ruhe_timer
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t) remote_strom::eff_ble_s(id(ps_ble_s), id(low_bat)) * 1000;'
      - if:
          condition:
            lambda: 'return id(disp_off) && (id(ps_bleidle) || id(low_bat)) && !id(voice_active) && !id(host_mic);'
          then:
            - lambda: 'id(kb).request_conn_profile(true);'

  # Tiefschlaf: ps_deep_s Sekunden nach Display-Aus (bei laufendem Fernseher
  # ps_deep_tv_s). Der Chip schaltet sich fast ganz ab und wacht NUR auf, wenn du
  # ihn weckst (Taste, Anheben, Ladekabel) - kein Timer-Wake. Nicht am Ladekabel,
  # nicht waehrend einer Sprachabfrage. Die Wartezeit wird jede Sekunde neu
  # bewertet, damit ein wechselnder Fernseher-Status sofort greift.
  - id: deep_ruhe_timer
    mode: restart
    then:
      - lambda: 'id(deep_t0) = millis();'
      - script.execute: schlaf_status_melden
      - while:
          condition:
            lambda: |-
              // Tiefschlaf aus (und kein Akku-Sparmodus): gar nicht erst warten -
              // das Sicherheitsnetz (alle 4 min) startet den Timer bei Bedarf neu.
              if (!id(disp_off) || !(id(ps_deep) || id(low_bat))) return false;
              // Bluetooth verbunden + Option an: weiter warten (nicht schlafen). Faellt die Verbindung
              // weg (Geraet aus), greift die Zeit ab dem spaeteren von Display-Aus/Bedienung normal.
              if (id(deep_ohne_ble) && id(ble_paired).state && !id(low_bat)) return true;
              const int lim = remote_strom::eff_deep_s(id(ps_deep_s), id(ps_deep_tv_s), id(tv_on), id(low_bat));
              // Gezaehlt ab dem SPAETEREN von Display-Aus und letzter Bedienung (Taste/Touch):
              // jede Taste setzt die Wartezeit zurueck, auch wenn sie das Display nicht weckt
              // ("Tasten wecken" = Nur Menue) - Nutzerwunsch 2026-09-27.
              uint32_t t0 = (int32_t) (id(last_input_ms) - id(deep_t0)) > 0 ? id(last_input_ms) : id(deep_t0);
              // Bewegung haelt wach (Einstellung bewegung_haelt, 2026-10-21): eine Bewegung zaehlt wie ein Tastendruck
              if (id(bewegung_haelt) && (int32_t) (id(last_motion_ms) - t0) > 0) t0 = id(last_motion_ms);
              return lim < 0 || (millis() - t0) < (uint32_t) lim * 1000;
          then:
            - delay: 5s
            - script.execute: schlaf_status_melden
      - script.execute: schlaf_status_melden
      - if:
          condition:
            lambda: 'return tiefschlaf_erlaubt();'
          then:
            - lambda: |-
                weck_log("Tiefschlaf");
                ESP_LOGI("schlaf", "Tiefschlaf: %d s nach Display-Aus - Deep-Sleep (Wecken: Taste/Bewegung/Ladekabel)", (int) ((millis() - id(deep_t0)) / 1000));
                // Nur merken, wenn der Nutzer den Tiefschlaf selbst eingeschaltet
                // hat - ein Schlaf wegen niedrigem Akku darf die Einstellung
                // nach dem Aufwachen nicht auf AN setzen.
                g_deep_active = id(ps_deep) ? 0x5EEEu : 0;
            - script.execute: deep_sleep_powerdown
            - deep_sleep.enter:
                id: nachtschlaf

  # Stand beim Dock anfragen (nach dem Start): erst schnell (0,4 s), dann jede Sekunde, bis zu ~15 s - solange HA nicht
  # verbunden ist und noch keine Antwort kam (dock_direkt on_zustand). Laenger, weil ein gerade eingeschaltetes Dock
  # (Steckdose) ein paar Sekunden braucht, bis es funkt und seinen Stand von HA hat.
  - id: zustand_holen
    mode: single
    then:
      - repeat:
          count: 18
          then:
            - if:
                condition: {lambda: 'return !id(zustand_da) && !api::global_api_server->is_connected();'}
                then:
                  - lambda: 'id(tk_cfg).zustand_anfragen();'
                  - delay: !lambda 'return iteration < 4 ? 400 : 1000;'

  # HA-Link im Ruhezustand pausieren (Einstellung ha_link_ruhe): spart die zweite Bluetooth-Verbindung, solange niemand
  # die Remote benutzt. Nicht waehrend Sprache, Update oder Wartungsfenster.
  - id: ha_link_ruhe_timer
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t) std::max(1, (int) id(ha_link_ruhe)) * 60000u;'
      - if:
          condition:
            lambda: 'return id(ha_link_ruhe) > 0 && id(ha_link_modus) > 0 && id(disp_off) && !id(voice_active) && !id(host_mic) && !id(ota_aktiv) && (int32_t) (millis() - id(wartung_bis)) >= 0;'
          then:
            - lambda: |-
                if (id(ha_link_modus) == 2) id(kb).set_link_pause(true);
                else id(kb).set_link_schlummer(true);

  # Tiefschlaf-Status (Diagnose-Sensor) neu bewerten und nur bei Aenderung senden
  # Werte ueber das Dock an HA (2026-10-23, Umbau "Dock als Zentrale", HA: esphomeremote_konfig/dockstatus.py) - nur
  # ohne eigene HA-Verbindung; nach Aenderungen (kurz gesammelt) und jede Minute. schlaf = vor dem Tiefschlaf.
  # Weck-Taste / beim Start gedrueckte Taste sofort uebers Dock (2026-10-23): on_boot 248, 244.4, 101 - liest den
  # Tastenchip nach (tca8418::nachlesen), schickt die erste gedrueckte Taste einmal (tasten_konfig::weck_frueh).
  # Neue Konfiguration angekuendigt (auch ueber das Dock, "kh"), HA-Link aber pausiert (Dock als Zentrale, 2026-10-24):
  # geladen wird nur ueber die HA-Verbindung - Link kurz wecken; ha_link_ruhe_timer pausiert ihn danach wieder.
  - id: belegung_link_wecken
    mode: single
    then:
      - lambda: |-
          if (!id(tk_cfg).belegung_offen() || !(id(kb).link_paused() || id(kb).link_schlummer())) return;
          weck_log("Neue Konfiguration - HA-Link kurz an");
          id(kb).set_link_pause(false); id(kb).set_link_schlummer(false);
          if (id(ha_link_ruhe) > 0 && id(ha_link_modus) > 0) id(ha_link_ruhe_timer).execute();

  - id: weck_frueh_pruefen
    mode: single
    then:
      - lambda: |-
          const uint8_t wk = id(keypad).nachlesen();
          if (wk == 0 || id(weck_dock) != 0 || id(weck_tasten) != 2) return;
          id(tk_cfg).bt_weg_modus = []() { return (int) id(bt_weg); };   // sonst erst in tasten::einrichten (-100)
          if (id(tk_cfg).weck_frueh(wk, id(activity), true)) {
            id(keypad).weck_erledigt();
            id(last_input_ms) = millis();
            weck_log("Taste beim Start uebers Dock gesendet");
          }

  - id: dock_status_melden
    mode: restart
    parameters: {schlaf: bool}
    then:
      - delay: 300ms
      - lambda: |-
          std::map<std::string, std::string> d;
          char b[16];
          if (!std::isnan(id(akku_level).state)) { snprintf(b, sizeof(b), "%.0f", id(akku_level).state); d["a"] = b; }
          if (!std::isnan(id(akku_spannung).state)) { snprintf(b, sizeof(b), "%.2f", id(akku_spannung).state); d["v"] = b; }
          d["l"] = id(charger_present).state ? "1" : "0";
          d["b"] = id(ble_paired).state ? "1" : "0";
          if (!std::isnan(id(akt_sensor).state)) { snprintf(b, sizeof(b), "%.0f", id(akt_sensor).state); d["k"] = b; }
          if (id(tk_status).has_state()) d["h"] = id(tk_status).state;
          d["t"] = schlaf ? std::string("Tiefschlaf") : (id(schlaf_status_txt).has_state() ? id(schlaf_status_txt).state : std::string(""));
          if (id(letzter_neustart).has_state()) d["n"] = id(letzter_neustart).state;
          // Nur bei Aenderung, sonst hoechstens alle 10 min; vor dem Tiefschlaf immer (2026-10-25, vorher jede Minute -
          // Funk und Dock-Last). Spannung zaehlt nicht als Aenderung (schwankt staendig).
          static std::string zuletzt;
          static uint32_t zuletzt_ms = 0;
          std::string vergleich;
          for (auto &kv : d) if (kv.first != "v") vergleich += kv.first + "=" + kv.second + ";";
          if (schlaf || vergleich != zuletzt || zuletzt_ms == 0 || millis() - zuletzt_ms > 600000) {
            zuletzt = vergleich;
            zuletzt_ms = millis() | 1;
            id(tk_cfg).status_ueber_dock(d, schlaf);
          }
          // Protokoll ueber das Dock (2026-10-24): mit "Debug-Protokoll" an gehen die gepufferten Zeilen ab INFO mit -
          // hoechstens 2 Pakete je Meldung (Dock-Speicher), der Rest beim naechsten Mal. Mit eigener HA-Verbindung kam alles ueber die API.
          if (api::global_api_server->is_connected()) logpuffer::alles_gesendet();
          else if (id(ps_log_debug))
            for (int k = 0; k < 2; k++) {
              const uint32_t vorher = logpuffer::gesendet();
              const std::string z = logpuffer::fuer_dock(800);
              if (z.empty()) break;
              if (!id(tk_cfg).dock_aufruf("esphomeremote_konfig.remote_log", {{"z", z}}, false, [vorher]() { logpuffer::zurueck(vorher); })) {
                logpuffer::zurueck(vorher);
                break;
              }
            }

  - id: schlaf_status_melden
    then:
      - lambda: |-
          std::string t;
          if (const char *g = tiefschlaf_sperre()) {
            t = g;
          } else {
            const bool low = id(low_bat);
            const int lim = remote_strom::eff_deep_s(id(ps_deep_s), id(ps_deep_tv_s), id(tv_on), low);
            char b[64];
            snprintf(b, sizeof(b), id(bewegung_haelt) ? "wartet: schlaeft %d min nach der letzten Bedienung/Bewegung%s"
                                                      : "wartet: schlaeft %d min nach der letzten Bedienung%s", (lim + 59) / 60,
                     low ? " (Akku-Sparmodus)" : (id(tv_on) && id(ps_deep_tv_s) > 0 ? " (Fernseher an)" : ""));
            t = b;
          }
          // Nur bei Aenderung - auch ans Dock (2026-10-23: vorher bei jedem Aufruf, also alle paar Sekunden; zwei
          // Remotes brachten das Dock damit an den Speicherrand und es verlor die HA-Verbindung)
          if (!id(schlaf_status_txt).has_state() || id(schlaf_status_txt).state != t) {
            id(schlaf_status_txt).publish_state(t);
            id(dock_status_melden).execute(false);
          }

  - id: backlight_idle_timeout
    mode: restart
    then:
      - lambda: 'dockanz::ruhe_start_ms() = millis();'   # Dock: Uebernahme kurz vor dem Ausschalten
      # Optional erst abdunkeln (ps_dim_s < Display-Timeout), dann ausschalten.
      # wake_backlight stellt die volle Helligkeit bei jeder Bedienung wieder her.
      - if:
          condition:
            # Dock-/Musik-Anzeige im Dock mit "Bleibt an"/Zeitfenster nie abdunkeln: das Dock haelt sie alle 5 s wach -
            # mit Abdunkeln nach 5 s wurde es sonst staendig dunkel und wieder hell (2026-10-17). Die Fernbedienungs-
            # seiten dunkeln auch im Dock normal ab (2026-10-20), statt auszugehen kommt dann die Dock-Anzeige.
            lambda: "return !id(sofort_aus) && id(ps_dim_s) > 0 && id(ps_dim_s) < remote_strom::eff_disp_s(id(disp_timeout_s), id(low_bat)) && !dockanz::anzeige_haelt_an();"
          then:
            - delay: !lambda 'return (uint32_t) id(ps_dim_s) * 1000;'
            - light.turn_on:
                id: display_backlight
                brightness: !lambda 'return fmaxf(0.03f, (id(disp_bri) / 100.0f) * (id(ps_dim_pct) / 100.0f));'
            - lambda: 'id(disp_dimmed) = true;'
            # Lage beim Abdunkeln merken, damit "Hochheben" auch aus dem abgedunkelten
            # Zustand (noch nicht disp_off) aufhellen kann, nicht erst nach dem Ausschalten.
            - script.execute: capture_baseline
            - delay: !lambda 'return (uint32_t) (remote_strom::eff_disp_s(id(disp_timeout_s), id(low_bat)) - id(ps_dim_s)) * 1000;'
          else:
            - delay: !lambda 'return id(sofort_aus) ? 0 : (uint32_t) remote_strom::eff_disp_s(id(disp_timeout_s), id(low_bat)) * 1000;'
      # Von selbst ausgegangen (nicht bewusst ausgeschaltet): die naechsten 3 s weckt jede Taste (2026-10-07)
      - lambda: 'id(disp_aus_ms) = id(sofort_aus) ? 0 : millis();'
      - globals.set: {id: sofort_aus, value: "false"}
      - light.turn_off: display_backlight
      - light.turn_off: button_backlight
      - globals.set: {id: disp_off, value: "true"}
      # Displaycontroller schlafen legen (~1-2 mA): nach dem Ausblenden der Beleuchtung (120 ms)
      - delay: 150ms
      - lambda: 'if (id(disp_off) && !id(panel_schlaeft)) { id(main_display).enter_sleep(); id(panel_schlaeft) = true; }'
      - globals.set: {id: lift_cnt, value: "0"}
      # Reine Anzeigewerte anhalten, solange niemand hinschaut. Der Akkustand
      # laeuft weiter (alle 20 s ein I2C-Read faellt nicht ins Gewicht).
      # Die BLE-Empfangsstaerke fragt die Tastatur-Komponente selbst ab, nicht
      # der Sensor - component.suspend greift dort nicht. Stattdessen das
      # Intervall auf eine Stunde setzen, das haelt sie praktisch an.
      - lambda: 'id(kb).set_rssi_update_interval(3600000);'
      - component.suspend: wifi_rssi
      - component.suspend: ble_host_txt
      # WLAN-Sparmodus "max" im Ruhezustand (falls gewaehlt).
      - script.execute: apply_wifi_ps
      # Die einstellbaren Ruhe-Zeiten starten (s. oben).
      - script.execute: wifi_ruhe_timer
      - script.execute: ble_ruhe_timer
      - script.execute: deep_ruhe_timer
      - if:
          condition: {lambda: 'return id(ha_link_ruhe) > 0 && id(ha_link_modus) > 0;'}
          then: [{script.execute: ha_link_ruhe_timer}]
      - script.execute: capture_baseline
      - script.execute: cpu_ruhe_timer
      # Angehalten sieht LVGL die Beruehrung nicht - der erste Tipp weckt also
      # nur, statt gleich etwas auszuloesen.
      - lvgl.pause:
      # "Touch weckt" aus: Touch-Chip im Ruhezustand gar nicht mehr abfragen.
      - if:
          condition: {lambda: "return !id(ps_touch_wake);"}
          then:
            - component.suspend: main_touch
            - lambda: 'id(touch_susp) = true;'
          else:
            # Touch weckt AN: Abfrage im Ruhezustand nach Einstellung (Standard 50 ms
            # = normal). Groessere Werte sparen etwas Strom, lassen aber kurze Tipps
            # durchfallen.
            - if:
                condition: {lambda: "return id(ps_touch_ms) >= 50;"}   # wach 10 ms, s. touchscreen:
                then:
                  - lambda: |-
                      id(main_touch)->set_update_interval(id(ps_touch_ms));
                      id(main_touch)->stop_poller();
                      id(main_touch)->start_poller();
                      id(touch_slow) = true;
      # Nach menu_close_s Sekunden ab Display-Aus zurueck auf die Startseite (eigene Zeit, getrennt vom Merkfenster
      # mem_s). Nicht bei der Begruessung (24) - die bleibt bis zum Wegtippen. -1 = nie.
      - if:
          condition: {lambda: "return id(menu_close_s) >= 0;"}
          then:
            - delay: !lambda 'return (uint32_t) id(menu_close_s) * 1000;'
            - if:
                condition: {lambda: "return id(disp_off) && id(cur_page) != 24;"}
                then:
                  - lvgl.resume:
                  # Wie selbst geschlossen (Nutzerwunsch 2026-09-30): go_home merkt sich die
                  # Menueseite fuer das Merk-Fenster (mem_s, "Menue merken") - vorher wurde das
                  # hier danach wieder geloescht, das automatische Schliessen vergass also alles.
                  - script.execute: go_home
                  - lvgl.widget.redraw:
                  - delay: 400ms
                  - lvgl.pause:

  # WLAN-Sparmodus: light = Funkteil schlaeft zwischen den Empfangsfenstern,
  # none = nie, max = nur im Ruhezustand (Display aus) und nur wenn gewaehlt -
  # laengere Schlafphasen, Home Assistant antwortet dann traeger.
  - id: apply_wifi_ps
    then:
      - lambda: |-
          wifi::WiFiPowerSaveMode m = id(ps_wifi) ? wifi::WIFI_POWER_SAVE_LIGHT : wifi::WIFI_POWER_SAVE_NONE;
          if (id(ps_wifi) && id(ps_wifi_max) && id(disp_off)) m = wifi::WIFI_POWER_SAVE_HIGH;
          // Nur bei einer echten Aenderung an den Treiber geben - dieses Skript laeuft bei jedem
          // Touch/Tastendruck. ESPHome merkt sich den Modus selbst und setzt ihn nach jedem
          // WLAN-Neuaufbau wieder, eine periodische Wiederholung braucht es nicht.
          if ((int) m == id(ps_last_mode)) return;
          id(ps_last_mode) = (int) m;
          wifi::global_wifi_component->set_power_save_mode(m);
          ESP_LOGI("strom", "WLAN-Sparmodus %s", m == wifi::WIFI_POWER_SAVE_HIGH ? "max" : (m == wifi::WIFI_POWER_SAVE_LIGHT ? "light" : "none"));

  # Cover nach einem Neustart oder Aufwachen nachladen: HA stoesst es nur bei einem Titelwechsel an. Laedt nur,
  # wenn ein SmartTube-Titel da ist und das Cover dazu noch fehlt.
  - id: cover_sync
    mode: restart
    then:
      - delay: 1s   # Zustaende von HA kommen kurz nach dem Abo
      - if:
          condition:
            lambda: "return id(adb_title).has_state() && !id(adb_title).state.empty() && id(adb_title).state != id(cover_title);"
          then:
            - lambda: |-
                ESP_LOGI("cover", "Cover nach dem Verbinden nachladen: %s", id(adb_title).state.c_str());
                id(cover_mp_offen) = true; id(cover_home_offen) = true;
            - script.execute: cover_sichtbar

  # Wiedergabestatus als Farbe des Play/Pause-Symbols (Nutzerwunsch 2026-09-20):
  # aus = rot, spielt = gruen, pausiert = blau, alles andere = weiss.
  # Position anzeigen: Stand beim Empfang + seit dem vergangene Zeit (nur bei "playing").
  # Ohne Position (-1) bleibt das Label ganz weg und die Kopfspalte schrumpft.
  - id: update_media_pos
    then:
      - lambda: |-
          const int base = id(media_pos_s);
          const int d = id(media_dur_s);
          const bool zeigen = base >= 0;
          const bool mit_dauer = zeigen && d > 0;
          const bool war_zeile = !lv_obj_has_flag(id(media_time_row), LV_OBJ_FLAG_HIDDEN);
          const bool war_balken = !lv_obj_has_flag(id(media_bar), LV_OBJ_FLAG_HIDDEN);
          int p = base;
          if (zeigen && id(mp_state).state == "playing") p += (int) ((millis() - id(media_pos_at)) * id(media_tempo) / 1000);
          if (d > 0 && p > d) p = d;
          if (zeigen) {
            auto fmt = [](int sek, char *b, size_t n) {
              if (sek >= 3600) snprintf(b, n, "%d:%02d:%02d", sek / 3600, (sek / 60) % 60, sek % 60);
              else             snprintf(b, n, "%d:%02d", sek / 60, sek % 60);
            };
            char a[16], c[20];
            fmt(p, a, sizeof(a));
            lv_label_set_text(id(media_pos_lbl), a);
            lv_obj_remove_flag(id(media_time_row), LV_OBJ_FLAG_HIDDEN);
            if (mit_dauer) {
              c[0] = '-';
              fmt(d - p, c + 1, sizeof(c) - 1);
              lv_label_set_text(id(media_rest_lbl), c);
              lv_obj_remove_flag(id(media_rest_lbl), LV_OBJ_FLAG_HIDDEN);
              lv_bar_set_value(id(media_bar), (int) (((int64_t) p * 1000) / d), LV_ANIM_OFF);
              lv_obj_remove_flag(id(media_bar), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(media_rest_lbl), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(media_bar), LV_OBJ_FLAG_HIDDEN);
            }
          } else {
            lv_obj_add_flag(id(media_time_row), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(media_bar), LV_OBJ_FLAG_HIDDEN);
          }
          // Kleiner Fortschrittsbalken auf der ausgeklappten Startseiten-Karte (nur der Balken,
          // ohne Zeit-Zahlen - Nutzerwunsch 2026-09-22 "ganz unten unterm Interpret"). Nur bei
          // bekannter Dauer sichtbar, wie beim grossen Balken auch.
          if (zeigen && mit_dauer) {
            lv_bar_set_value(id(home_media_bar), (int) (((int64_t) p * 1000) / d), LV_ANIM_OFF);
            if (id(cur_page) == 0) lv_obj_remove_flag(id(home_media_bar), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(home_media_bar), LV_OBJ_FLAG_HIDDEN);
          }
          id(media_pos_neu_layout) = (zeigen != war_zeile) || (mit_dauer != war_balken);
      # Erscheint/verschwindet die Zeile oder der Balken, muss das Banner hinter Titel/Interpret neu passen.
      - if:
          condition: {lambda: "return id(media_pos_neu_layout);"}
          then: [{script.execute: media_layout}]

  - id: update_media_state
    then:
      - lambda: |-
          const std::string x = id(mp_state).state;
          uint32_t c = 0xF1F3F5;
          if (!id(tv_on) || x == "off" || x == "standby" || x == "unavailable") c = 0xEF4444;
          else if (x == "playing")  c = 0x22C55E;
          else if (x == "paused")   c = 0x3B82F6;
          lv_obj_set_style_text_color(id(m_pp_lbl), lv_color_hex(c), LV_PART_MAIN);

  # Titel auf hoechstens 2 Zeilen, Spalte an den Inhalt, schwarzes Banner dahinter
  # bis knapp unter die Spalte.
  - id: media_layout
    then:
      - lambda: |-
          {
            // Interpret: a18, wenn er passt, sonst a15 (dann mit "..." am Ende)
            lv_obj_t *ia = id(media_artist);
            const lv_font_t *gross = id(a18)->get_lv_font(), *klein = id(a15)->get_lv_font();
            lv_point_t g;
            lv_text_get_size(&g, lv_label_get_text(ia), gross, 0, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
            const int frei = 240 - 6 - 6 - 46 - 8;   // Kopfzeile minus Ränder, Zurück-Knopf, Abstand
            lv_obj_set_style_text_font(ia, g.x > frei ? klein : gross, LV_PART_MAIN);
          }
          lv_obj_t *t = id(media_title);
          const lv_font_t *f = lv_obj_get_style_text_font(t, LV_PART_MAIN);
          lv_point_t sz;
          lv_text_get_size(&sz, lv_label_get_text(t), f, 0, 0, 220, LV_TEXT_FLAG_NONE);
          const int lh = lv_font_get_line_height(f);
          lv_obj_set_height(t, sz.y > 2 * lh ? 2 * lh : (sz.y < lh ? lh : sz.y));
          lv_obj_t *c = id(media_head_col);
          lv_obj_update_layout(c);
          lv_area_t a;
          lv_obj_get_coords(c, &a);
          lv_obj_t *seite = lv_obj_get_parent(id(media_scrim_top));
          const int pl = lv_obj_get_style_pad_left(seite, LV_PART_MAIN);
          const int pt = lv_obj_get_style_pad_top(seite, LV_PART_MAIN);
          lv_obj_set_size(id(media_scrim_top), 240, a.y2 + 7);
          lv_obj_align(id(media_scrim_top), LV_ALIGN_TOP_LEFT, -pl, -pt);

  # ---- Touch-Test (Einstellungen > Touch-Test) ------------------------------------
  # Ring folgt dem Finger, bei jedem Tipp bleibt ein kleiner Punkt stehen (die
  # letzten 60). Koordinaten unten. Beenden nur mit der Zurueck-Taste.
  - id: tt_move
    then:
      - lambda: |-
          lv_obj_remove_flag(id(tt_ring), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_pos(id(tt_ring), id(tt_x) - 16, id(tt_y) - 16);
          char b[32];
          snprintf(b, sizeof(b), "x=%d  y=%d", id(tt_x), id(tt_y));
          lv_label_set_text(id(tt_lbl), b);
  - id: tt_press
    then:
      - lambda: |-
          lv_obj_t *page = lv_obj_get_parent(id(tt_ring));
          const int i = id(tt_n) % 60;
          id(tt_n)++;
          if (id(tt_dots)[i] != nullptr) lv_obj_delete((lv_obj_t *) id(tt_dots)[i]);
          lv_obj_t *d = lv_obj_create(page);
          lv_obj_remove_style_all(d);
          lv_obj_set_size(d, 10, 10);
          lv_obj_set_pos(d, id(tt_x) - 5, id(tt_y) - 5);
          lv_obj_set_style_radius(d, LV_RADIUS_CIRCLE, 0);
          lv_obj_set_style_border_width(d, 2, 0);
          lv_obj_set_style_border_color(d, lv_color_hex(0xF1F3F5), 0);
          lv_obj_set_style_bg_opa(d, LV_OPA_TRANSP, 0);
          lv_obj_remove_flag(d, LV_OBJ_FLAG_CLICKABLE);
          lv_obj_remove_flag(d, LV_OBJ_FLAG_SCROLLABLE);
          id(tt_dots)[i] = d;
          lv_obj_move_foreground(id(tt_ring));
  - id: tt_clear
    then:
      - lambda: |-
          for (int i = 0; i < 60; i++) {
            if (id(tt_dots)[i] != nullptr) { lv_obj_delete((lv_obj_t *) id(tt_dots)[i]); id(tt_dots)[i] = nullptr; }
          }
          id(tt_n) = 0;
          lv_obj_add_flag(id(tt_ring), LV_OBJ_FLAG_HIDDEN);
          lv_label_set_text(id(tt_lbl), "Tippe irgendwo");

  # ---- Reinigungsmodus: Touch und Tasten clean_s Sekunden tot. Zurueck-Taste LANG
  # haelt ab. Das Display bleibt solange an (Timeout gestoppt).
  - id: clean_run
    mode: restart
    then:
      - script.stop: backlight_idle_timeout
      - lambda: |-
          id(clean_mode) = true;
          id(clean_left) = id(clean_s);
      - lvgl.page.show: {id: page_clean, animation: FADE_IN, time: 150ms}
      - while:
          condition: {lambda: "return id(clean_mode) && id(clean_left) > 0;"}
          then:
            - lambda: |-
                char b[16];
                snprintf(b, sizeof(b), "%d s", id(clean_left));
                lv_label_set_text(id(clean_lbl), b);
            - delay: 1s
            - lambda: 'id(clean_left)--;'
      - lambda: 'id(clean_mode) = false;'
      - lvgl.page.show: {id: page_service, animation: FADE_IN, time: 150ms}

  # Finger liegt auf dem Display: nicht abdunkeln/ausschalten (s. on_update des Touch).
  - id: idle_touch_ping
    then:
      - if:
          condition: {lambda: "return id(disp_timeout_s) > 0 && !id(clean_mode) && id(cur_page) != 36 && !id(disp_off);"}
          then:
            - if:
                condition: {lambda: "return id(disp_dimmed);"}
                then:
                  - lambda: 'id(disp_dimmed) = false;'
                  - light.turn_on:
                      id: display_backlight
                      brightness: !lambda 'return id(disp_bri) / 100.0f;'
            - script.execute: backlight_idle_timeout

  # ---- Kamerabild: Kamera (Liste aus dem Konfigurator) waehlen, Bild bei HA anfordern ----
  - id: cam_view_request
    then:
      - lambda: |-
          const int n = id(tk_cfg).kameras();
          if (n > 0) id(cv_idx) = ((id(cv_idx) % n) + n) % n;
          lv_label_set_text(id(cv_name), n > 0 ? id(tk_cfg).kamera_name(id(cv_idx)).c_str() : "Keine Kamera");
          lv_label_set_text(id(cv_state), n > 0 ? "Lade Bild ..." : "Kameras im Konfigurator eintragen");
          lv_obj_add_flag(id(cv_img), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(cv_ph), LV_OBJ_FLAG_HIDDEN);
      - if:
          condition: {lambda: 'return id(tk_cfg).kameras() > 0;'}
          then:
            - homeassistant.event:
                event: esphome.remote_cam_snapshot
                data:
                  kamera: !lambda 'return id(tk_cfg).kamera_entitaet(id(cv_idx));'
                  geraet: !lambda 'return App.get_name();'

  # ---- Live-Bild (schnell): Kamera bei HA anfordern, dann Bilder fortlaufend nachladen ----
  - id: live_start
    then:
      - lambda: |-
          const int n = id(tk_cfg).kameras();
          if (n > 0) id(cv_idx) = ((id(cv_idx) % n) + n) % n;
          lv_label_set_text(id(cf_name), n > 0 ? id(tk_cfg).kamera_name(id(cv_idx)).c_str() : "Keine Kamera");
          lv_label_set_text(id(cf_state), n > 0 ? "Starte ..." : "Kameras im Konfigurator eintragen");
          lv_obj_add_flag(id(cf_img), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(cf_ph), LV_OBJ_FLAG_HIDDEN);
          id(live_until) = n > 0 ? millis() + 45000 : 0;
          id(live_busy) = false;
      - if:
          condition: {lambda: 'return id(tk_cfg).kameras() > 0;'}
          then:
            - homeassistant.event:
                event: esphome.remote_live_start
                data:
                  kamera: !lambda 'return id(tk_cfg).kamera_entitaet(id(cv_idx));'
                  geraet: !lambda 'return App.get_name();'
            - script.execute: live_loop
  - id: live_loop
    mode: restart
    then:
      - delay: 1500ms
      - while:
          condition: {lambda: "return id(cur_page) == 38 && (int32_t) (id(live_until) - millis()) > 0;"}
          then:
            - if:
                # Nur laden, wenn kein Bild laeuft, die Pause vorbei ist und gerade niemand
                # bedient (Taste/Touch in den letzten 1,2 s).
                condition: {lambda: "return (!id(live_busy) || (millis() - id(live_req_ms)) > 4000) && (int32_t) (millis() - id(live_next_ms)) >= 0 && (millis() - id(last_input_ms)) > 1200;"}
                then:
                  - lambda: |-
                      id(live_busy) = true;
                      id(live_req_ms) = millis();
                  - online_image.set_url: {id: cam_fast_image, url: !lambda 'return std::string("http://") + id(tk_cfg).host() + "/local/esphomeremote_live.jpg";'}
            - delay: 100ms
      - lambda: |-
          if (id(cur_page) == 38) lv_label_set_text(id(cf_state), "Beendet - Neu starten drücken");

  # Kamerabild (Standbild) abrufen: kurz warten, nicht waehrend der Bedienung (ein Abruf
  # blockiert die Remote), dann laden. on_error von cam_live_image wiederholt bei Bedarf.
  - id: cam_load
    mode: restart
    then:
      - delay: 400ms
      - wait_until:
          condition: {lambda: "return (millis() - id(last_input_ms)) > 1200 || id(cur_page) != 37;"}
          timeout: 5s
      - if:
          condition: {lambda: "return id(cur_page) == 37;"}
          then:
            - online_image.set_url: {id: cam_live_image, url: !lambda 'return std::string("http://") + id(tk_cfg).host() + "/local/esphomeremote_cam.jpg";'}

  - id: apply_low_bat
    then:
      - lambda: |-
          const bool neu = id(ps_low_pct) > 0 && id(akku_pct) <= id(ps_low_pct) && !id(laedt) && !id(charger_present).state;
          if (neu != id(low_bat)) {
            id(low_bat) = neu;
            ESP_LOGI("strom", "Sparmodus bei niedrigem Akku %s (%d %%)", neu ? "AN" : "AUS", id(akku_pct));
          }

  # Peripherie fuer den Tiefschlaf vorbereiten (Vorbild Original-Firmware). Darf NICHT yielden (kein delay:),
  # sonst laeuft deep_sleep.enter los, bevor die Rail aus ist; danach darf kein loop() mehr auf den I2C-Bus ohne
  # Pull-ups zugreifen. +VSW (GPIO38 -> Q4) versorgt Panel, Touch, I2C-Pull-ups; +3.3V bleibt fuer
  # Tastenchip und LIS3DH (Weckquellen GPIO8 / GPIO2).
  - id: deep_sleep_powerdown
    then:
      # Letzter Stand ueber das Dock (ohne eigene HA-Verbindung): "Tiefschlaf", sofort raus
      - lambda: |-
          // Gewollter Tiefschlaf = Firmware laeuft: als gut markieren (2026-10-25). Sonst zaehlt ein Tiefschlaf in den
          // ersten 60 s nach einem Update als Absturz und der Bootloader holt die alte Firmware zurueck.
          if (millis() > 15000) id(sicherer_start)->mark_successful();
          std::map<std::string, std::string> d;
          char b[16];
          if (!std::isnan(id(akku_level).state)) { snprintf(b, sizeof(b), "%.0f", id(akku_level).state); d["a"] = b; }
          d["l"] = id(charger_present).state ? "1" : "0";
          d["b"] = "0";
          d["t"] = "Tiefschlaf";
          id(tk_cfg).status_ueber_dock(d, true);
      # Funk aus (BT geht mit esp_deep_sleep_start() sowieso vollstaendig aus).
      - wifi.disable:
      - script.execute: apply_mic_power        # MIC_VDD (GPIO45) aus
      - component.suspend: main_touch          # ft63x6 pollt nicht mehr
      - light.turn_off: display_backlight
      - light.turn_off: button_backlight
      - lambda: |-
          // Akku-Statistik: letzter Messpunkt vor dem Schlaf
          if (!id(charger_present).state && id(sntp_time).now().is_valid())
            akkustat::probe(id(sntp_time).now().timestamp, id(akku_level).state, true);
          akkustat::einschlafen();   // Tiefschlaf-Zeit seit Ladung
          // --- 1. LIS3DH fuer den Bewegungs-Weck-Interrupt (Bus noch versorgt) ---
          uint64_t mask = (1ULL << 8);   // GPIO8 = TCA8418-INT (HW-Pull-up R36)
          // Ruck weckt bei "Bewegung" und "Hochheben" (wie bisher ueber den Hochpass-Interrupt),
          // Klopfen, wenn "Doppelt klopfen weckt" an ist.
          // Heruntergefahren: KEIN Bewegungs-/Klopfwecker, nur Aus-Taste/Ladekabel.
          const bool aus = g_ausgeschaltet == AUSGESCHALTET_MAGIC;
          // Bewegung = Ruck, Hochheben = Lagewechsel (seit 2026-10-20 auch im Tiefschlaf, vorher dort ebenfalls Ruck)
          // Eigene Einstellung fuer den Tiefschlaf (tief_motion, 2026-10-21): -1 = wie "Aufwecken bei", 0 aus, 1 Bewegung, 2 Hochheben
          const int tm = id(tief_motion) < 0 ? id(motion_mode) : id(tief_motion);
          const bool ruck = tm == 1 && !aus, hoch = tm == 2 && !aus, klopf = id(klopf_wake) && !aus;
          if (ruck || hoch || klopf) {
            id(motion_chip)->arm_for_sleep(ruck, remote_strom::ruck_ths(id(motion_sens)), klopf,
                                           remote_strom::klopf_ths(id(klopf_sens)), hoch, remote_strom::hoch_ths(id(motion_sens)));
            mask |= (1ULL << 2);                        // GPIO2 = LIS3DH INT1
          }

          // --- 2./3. Verbraucher abschalten und Pins ueber den Schlaf halten (esphomeremote-pm.h). Ab hier hat der
          // I2C-Bus keine Pull-ups mehr - keine I2C-Zugriffe mehr!
          peripherie_fuer_schlaf();
          // GPIO1 NUR als Weckquelle scharf schalten, wenn KEIN Kabel dran ist.
          // Bei angestecktem Kabel wuerde ANY_LOW das Geraet sofort wieder
          // wecken - Endlosschleife. Die Tiefschlaf-Bedingung oben verhindert
          // das eigentlich schon (!charger_present), doppelt haelt besser.
          const bool gpio1_frei = !id(charger_present).state;
          if (gpio1_frei) mask |= (1ULL << 1);
          // Befund Tiefschlaf-Test 2026-10-04: Weckgrund 4 (TIMER) nach ~3 s. Der automatische
          // Leichtschlaf (esp_pm, "Sparen: Leichtschlaf") stellt bei jedem Einnicken einen Timer-
          // Wecker; der blieb fuer den Tiefschlaf scharf. Also: Leichtschlaf aus, ALLE Weckquellen
          // loeschen, dann nur ext1 (Taste/Ladekabel/Bewegung) neu setzen.
          {
            esp_pm_config_t pm = {};
            pm.max_freq_mhz = 80;
            pm.min_freq_mhz = 80;
            pm.light_sleep_enable = false;
            esp_pm_configure(&pm);
          }
          esp_sleep_disable_wakeup_source(ESP_SLEEP_WAKEUP_ALL);
          esp_sleep_enable_ext1_wakeup(mask, ESP_EXT1_WAKEUP_ANY_LOW);
          { char wb[64]; snprintf(wb, sizeof(wb), "Schlaf-Maske 0x%llx, Pins jetzt: GPIO1=%d GPIO2=%d GPIO8=%d", (unsigned long long) mask,
                                  gpio_get_level(GPIO_NUM_1), gpio_get_level(GPIO_NUM_2), gpio_get_level(GPIO_NUM_8)); weck_log(wb); }
          ESP_LOGI("schlaf", "ext1 scharf: mask=0x%llx (GPIO8 Taste%s%s)",
                   (unsigned long long) mask,
                   (mask & (1ULL << 2)) ? " + GPIO2 Bewegung/Klopfen" : "",
                   gpio1_frei ? " + GPIO1 Ladekabel" : " [GPIO1 aktiv - nicht scharf]");
          // Rail + Pegel setzen lassen, bevor esp_deep_sleep_start() folgt
          // (Referenz: delay(100) vor dem Schlaf).
          delay(80);

  # Bewegungs-Icon in der Statusleiste (neben den Assistenten-Symbolen): kurz einblenden,
  # sobald der Sensor etwas registriert, nach 1,5 s ohne neue Meldung wieder ausblenden.
  # Rein informativ - unabhaengig von den Schaltern dim_wake/dim_hold_motion.
  - id: motion_icon_blip
    then:
      # Abschaltbar unter Anzeige > Bewegungs-Symbol (Nutzerwunsch 2026-09-28)
      - lambda: 'if (id(show_motion)) lv_obj_remove_flag(id(motion_icon), LV_OBJ_FLAG_HIDDEN);'
      - script.execute: motion_icon_hide_timer
  - id: motion_icon_hide_timer
    mode: restart
    then:
      - delay: 1500ms
      - lvgl.widget.hide: motion_icon

  # Taste im Dunkeln, die nicht wecken soll ("Tasten wecken" = Nur Menue): schnelles Bluetooth, WLAN ggf. wieder an.
  - id: lade_popup
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *&karte = lade_karte();
          static lv_obj_t *prozent = nullptr;
          if (karte == nullptr) {
            karte = lv_obj_create(lv_layer_top());
            lv_obj_remove_style_all(karte);
            lv_obj_set_size(karte, 200, 120);
            lv_obj_center(karte);
            lv_obj_set_style_bg_color(karte, lv_color_hex(0x1A1F27), 0);
            lv_obj_set_style_bg_opa(karte, LV_OPA_COVER, 0);
            lv_obj_set_style_radius(karte, 16, 0);
            lv_obj_set_style_border_width(karte, 2, 0);
            lv_obj_set_style_border_color(karte, lv_color_hex(0x22C55E), 0);
            lv_obj_add_flag(karte, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_add_event_cb(karte, [](lv_event_t *e) { lv_obj_add_flag((lv_obj_t *) lv_event_get_target(e), LV_OBJ_FLAG_HIDDEN); }, LV_EVENT_CLICKED, nullptr);
            lv_obj_t *icon = lv_label_create(karte);
            lv_obj_set_style_text_font(icon, id(ico_charge)->get_lv_font(), 0);
            lv_obj_set_style_text_color(icon, lv_color_hex(0x22C55E), 0);
            lv_label_set_text(icon, "\U000F0241");
            lv_obj_align(icon, LV_ALIGN_TOP_MID, 0, 14);
            lv_obj_t *titel = lv_label_create(karte);
            lv_obj_set_style_text_font(titel, id(a15)->get_lv_font(), 0);
            lv_obj_set_style_text_color(titel, lv_color_hex(0xF1F3F5), 0);
            lv_label_set_text(titel, "Wird geladen");
            lv_obj_align(titel, LV_ALIGN_TOP_MID, 0, 40);
            prozent = lv_label_create(karte);
            lv_obj_set_style_text_font(prozent, id(a18)->get_lv_font(), 0);
            lv_obj_set_style_text_color(prozent, lv_color_hex(0x22C55E), 0);
            lv_obj_align(prozent, LV_ALIGN_TOP_MID, 0, 70);
          }
          // Noch kein Messwert (Remote gerade vom Ladekabel geweckt): sofort selbst messen,
          // statt "Akku ?" anzuzeigen (Nutzerbefund 2026-10-03).
          if (std::isnan(id(akku_level).state)) id(akku)->update();
          lade_popup_text(prozent, id(akku_level).state);
          lv_obj_remove_flag(karte, LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(karte);
      # 4 s offen; der Wert wird nachgefuehrt, falls die erste Messung erst jetzt kommt
      - repeat:
          count: 8
          then:
            - delay: 500ms
            - lambda: |-
                lv_obj_t *k = lade_karte();
                if (k == nullptr || lv_obj_get_child_count(k) < 3) return;
                lade_popup_text(lv_obj_get_child(k, 2), id(akku_level).state);
      - lambda: 'if (lade_karte() != nullptr) lv_obj_add_flag(lade_karte(), LV_OBJ_FLAG_HIDDEN);'

  - id: key_ohne_wecken
    then:
      - lambda: 'id(kb).request_conn_profile(false);'
      - script.execute: ble_ruhe_timer
      - lambda: 'id(wlan_frueh_grund) = "Taste ohne Display";'
      - script.execute: wlan_frueh_an

  # WLAN wieder an, ohne das Display zu wecken (Option "WLAN frueh einschalten", wlan_frueh).
  - id: wlan_frueh_an
    then:
      - if:
          # nicht, solange nach dem Aufwachen das WLAN fuer den Funk zum Dock zurueckgehalten wird (on_boot 1100/-150)
          condition: {lambda: "return id(wlan_frueh) && !id(wlan_nach_weck) && (id(ps_wifi_off) || id(low_bat)) && wifi::global_wifi_component->is_disabled() && !wlan_zugriff::g_nur_ble;"}
          then:
            - lambda: 'std::string g = "WLAN an (" + id(wlan_frueh_grund) + ")"; weck_log(g.c_str());'
            - wifi.enable:
            - script.execute: wifi_ruhe_timer

  # Vorgemerktes Cover der sichtbaren Seite laden: Medienseite (6) das grosse, Startseite (0) den Ausschnitt; bei
  # dunklem Display nichts (2026-10-20). Aufgerufen vom Dienst refresh_cover, beim Einschalten und beim Seitenwechsel.
  - id: cover_sichtbar
    mode: queued
    then:
      - if:
          condition: {lambda: 'return !id(disp_off) && id(cur_page) == 6 && id(cover_mp_offen);'}
          then:
            - lambda: 'id(cover_mp_offen) = false; id(cover_title) = id(adb_title).state;'
            - online_image.set_url:
                id: mp_cover_image
                url: !lambda 'return id(cover_ganz_player) ? (std::string("http://") + id(tk_cfg).host() + "/local/esphomeremote_cover_${ha_name}_player_ganz.jpg") : (std::string("http://") + id(tk_cfg).host() + "/local/esphomeremote_cover_${ha_name}_player_voll.jpg");'
            - lvgl.widget.show: media_cover
      - if:
          condition: {lambda: 'return !id(disp_off) && id(cur_page) == 0 && id(cover_home_offen);'}
          then:
            - lambda: 'id(cover_home_offen) = false; id(cover_title) = id(adb_title).state;'
            - online_image.set_url:
                id: home_cover_image
                url: !lambda 'return id(cover_ganz_home) ? (std::string("http://") + id(tk_cfg).host() + "/local/esphomeremote_cover_${ha_name}_home_ganz.jpg") : (std::string("http://") + id(tk_cfg).host() + "/local/esphomeremote_cover_${ha_name}_home_voll.jpg");'

  - id: wake_backlight
    mode: restart
    then:
      # Bluetooth: ohne Partner wurde nach 60 s nur noch langsam geworben - bei Bedienung sofort
      # wieder schnell, damit ein gerade eingeschaltetes Geraet die Remote gleich findet.
      - lambda: |-
          id(kb).adv_fast_again();
          if (id(disp_off)) {
            weck_log("Display an");
            // Tastatur & Co. (2026-10-26): den naechsten Stand neu bewerten - ist die Streamer-Tastatur offen, kommt sie
            // auch dann, wenn die Remote ihr Zu- und Wiederaufgehen im Dunkeln verpasst hat. Und gleich beim Dock fragen.
            id(mn)->pegel_vergessen();
            if (id(ha_dock) != 0 && !api::global_api_server->is_connected()) id(tk_cfg).zustand_anfragen();
          }
          // Display geht an und zeigt die Startseite: Dock-Animation (Nutzerwunsch 2026-10-13)
          if (id(disp_off) && id(cur_page) == 0) tasten::dock_anim(400);
      # Ein Weckereignis (Taste, Bewegung, HA) bricht die Ruhe-Timer ab.
      - script.stop: ble_ruhe_timer
      - script.stop: deep_ruhe_timer
      - script.stop: ha_link_ruhe_timer
      - lambda: 'id(kb).set_link_pause(false); id(kb).set_link_schlummer(false);'   # HA-Link wieder normal
      - globals.set: {id: disp_off, value: "false"}
      - script.execute: schlaf_status_melden
      # BLE-Verbindung wieder auf das schnelle HID-Profil, Takt zurueck auf voll.
      - lambda: 'id(kb).request_conn_profile(false);'
      - script.stop: cpu_ruhe_timer
      - lambda: 'id(cpu_low) = false;'
      - script.execute: apply_cpu
      - script.execute: apply_wifi_ps
      # Touch-Abfrage wieder auf normalen Takt (10 ms, s. touchscreen:) bzw. wieder starten.
      - if:
          condition: {lambda: "return id(touch_slow);"}
          then:
            - lambda: |-
                id(main_touch)->set_update_interval(10);
                id(main_touch)->stop_poller();
                id(main_touch)->start_poller();
                id(touch_slow) = false;
      - if:
          condition: {lambda: "return id(touch_susp);"}
          then:
            - component.resume: main_touch
            - lambda: 'id(touch_susp) = false;'
      - lambda: 'id(kb).set_rssi_update_interval(3000);'
      - component.resume: wifi_rssi
      # Sofort die echte, aktuelle Farbe zeigen, nicht erst nach dem naechsten RSSI-Takt
      # (bis zu 10s): waehrend das Display aus/abgedunkelt war, ist wifi_rssi pausiert -
      # dessen on_value (das die Balken sonst aktualisiert) laeuft also nicht. Ohne diesen
      # Aufruf zeigten die Balken beim Aufwachen kurz noch die Farbe von VOR dem Einschlafen,
      # auch wenn sich die Verbindung zu Home Assistant zwischenzeitlich geaendert hatte
      # (Nutzerbeobachtung 2026-09-23: "orange, nachdem die Fernbedienung laenger lag").
      - script.execute: refresh_wifi_bars
      - component.resume: ble_host_txt
      - script.stop: wifi_ruhe_timer
      - if:
          condition: {lambda: "return id(ps_wifi_off) && !wlan_zugriff::g_nur_ble && !id(wlan_nach_weck);"}
          then: [{wifi.enable:}]
      # Displaycontroller wecken, bevor LVGL zeichnet und die Beleuchtung angeht (SLPOUT braucht 120 ms)
      - lambda: 'if (id(panel_schlaeft)) { id(main_display).exit_sleep(); id(panel_schlaeft) = false; }'
      - lvgl.resume:
      - lvgl.widget.redraw:
      - light.turn_on:
          id: display_backlight
          brightness: !lambda 'return id(disp_bri) / 100.0f;'
      - lambda: 'id(disp_dimmed) = false;'
      - script.execute: cover_sichtbar   # bei dunklem Display vorgemerktes Cover der sichtbaren Seite (2026-10-20)
      - if:
          condition: {lambda: "return id(kbd_light_on);"}
          then:
            - light.turn_on:
                id: button_backlight
                brightness: !lambda 'return id(kbd_bri) / 100.0f;'
      # 0 = nie abschalten: dann gar keinen Ablauf starten, statt mit
      # Verzoegerung 0 sofort wieder auszuschalten.
      - if:
          condition: {lambda: "return id(disp_timeout_s) > 0 && !id(clean_mode) && id(cur_page) != 36;"}
          then:  [{script.execute: backlight_idle_timeout}]
          else:  [{script.stop: backlight_idle_timeout}]

  # ---- SD-Karte ----------------------------------------------------------------
  # Anzeige auf der Seite "SD-Karte" aktualisieren.
  - id: sd_anzeige
    then:
      - lambda: |-
          const bool ok = id(sdkarte)->is_mounted();
          char b[96];
          if (ok) snprintf(b, sizeof(b), "Karte eingebunden: %.1f GB, %.1f GB frei",
                           id(sdkarte)->card_size_bytes() / 1073741824.0, id(sdkarte)->free_bytes() / 1073741824.0);
          else    snprintf(b, sizeof(b), "Keine Karte eingebunden");
          lv_label_set_text(id(sd_stat_lbl), b);
          lv_obj_set_style_text_color(id(sd_stat_lbl), lv_color_hex(ok ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          lv_label_set_text(id(sd_info_lbl), ok ? "Mikrofon gesperrt, solange die Karte eingebunden ist" : " ");
  # Karte mit Strom versorgen (Mikrofon vorher anhalten - es teilt sich die Pins mit der Karte).
  # Mikrofon-Versorgung bleibt AN: ein stromloses Mikrofon zieht ueber seine ESD-Diode die gemeinsame Leitung MISO
  # (GPIO7) nach Low, ESP-IDF wartete dann vor jedem SD-Befehl bis zu 40 ms.
  - id: sd_strom_an
    mode: queued
    then:
      - lambda: 'musik::sd_kommt(); id(voice)->set_mic_blocked(true);'   # I2S-Treiber stoppen: gibt GPIO15/17/7 frei
      - script.execute: refresh_mic_icon
      - wait_until:
          condition: {lambda: "return id(remote_mic).is_stopped();"}
          timeout: 2s
      - lambda: 'id(mic_power).turn_on();'
      - delay: 100ms
      - switch.turn_off: sd_power_off        # SD_EN LOW = Karte an
      - delay: 150ms
  # Karte einbinden (Seite SD-Karte). Bis zum Auswerfen ist das Mikrofon gesperrt.
  - id: sd_einbinden
    mode: restart
    then:
      - lambda: 'lv_label_set_text(id(sd_stat_lbl), "Karte wird eingebunden ...");'
      - script.execute: sd_strom_an
      - script.wait: sd_strom_an
      - lambda: 'id(sd_status)->publish_state(id(sdkarte)->mount() ? "gemountet" : "Mount fehlgeschlagen");'
      - script.execute: sd_anzeige
  # Karte auswerfen und das Mikrofon zurueckholen (ohne Neustart): SPI-Treiber gibt die Pins frei,
  # SD_EN aus, dann startet der I2S-Treiber wieder und legt die Pins neu an.
  - id: sd_auswerfen
    then:
      - lambda: |-
          id(sdkarte)->unmount();
          id(sd_status)->publish_state("ausgeworfen");
          lv_label_set_text(id(sd_stat_lbl), "Ausgeworfen");
      - switch.turn_on: sd_power_off         # Karte stromlos
      - delay: 300ms
      - lambda: 'id(voice)->set_mic_blocked(false);'
      - script.execute: apply_mic_power
      - script.execute: sd_anzeige
  # Karte auswerfen und die Remote neu starten (Rueckfall, falls das Mikrofon danach nicht geht).
  - id: sd_auswerfen_neustart
    then:
      - script.execute: sd_auswerfen
      - delay: 500ms
      - button.press: btn_restart
  # ---- Konfig-Modus: Dateizugang zur SD-Karte im WLAN (/sd/api/...), 10 Minuten -------------
  - id: sd_konfig_start
    mode: restart
    then:
      - script.execute: sd_strom_an
      - script.wait: sd_strom_an
      - lambda: |-
          if (!id(sdkarte)->is_mounted()) id(sdkarte)->mount();
          id(sdkarte)->http_enable(0);
          id(ota_aktiv) = true;
          char ipb[48] = {0};
          wifi::global_wifi_component->get_ip_addresses()[0].str_to(ipb);
          const std::string ip = ipb;
          std::string t = "http://" + ip + "/sd/api/list?path=/";
          lv_label_set_text(id(sd_info_lbl), t.c_str());
          lv_label_set_text(id(sd_stat_lbl), "Konfig-Modus AN (10 min)");
          ESP_LOGI("sd", "Konfig-Modus AN fuer 10 min - /sd/api/ auf %s", ip.c_str());
      - delay: 10min
      - script.execute: sd_konfig_stop
  - id: sd_konfig_stop
    then:
      - lambda: |-
          id(sdkarte)->http_disable();
          id(ota_aktiv) = false;
          ESP_LOGI("sd", "Konfig-Modus AUS");
      - script.execute: sd_anzeige
      - script.execute: backlight_idle_timeout       # Tiefschlaf-Pfad neu anstossen
  # ---- Logos/Cover von der SD-Karte ---------------------------------------------
  # Wird bei jeder Aenderung von App oder Cover-URL aufgerufen (und nach jedem Cover-Download). Hat Home
  # Assistant KEIN echtes Cover (Netflix-Logo bzw. neutrales Bild), zeigt die Remote das Logo der App von der
  # SD-Karte: aus dem Cache oder, falls noch nicht geladen, nach kurzem Einbinden der Karte.
  - id: sd_logo_pruefen
    then:
      - lambda: |-
          // Absturz-Schutz: endete der letzte Start mit einem Watchdog/Panic, werden die Logos von der SD-Karte
          // abgeschaltet (einmal pro Start geprueft) - sonst koennte ein Fehler hier eine Neustart-Schleife ausloesen.
          static bool geprueft = false;
          if (!geprueft) {
            geprueft = true;
            const esp_reset_reason_t r = esp_reset_reason();
            if (r == ESP_RST_TASK_WDT || r == ESP_RST_INT_WDT || r == ESP_RST_WDT || r == ESP_RST_PANIC) {
              id(sd_logos) = false;
              ESP_LOGW("sd", "Letzter Start endete mit Absturz (Grund %d): Logos von der SD-Karte sind abgeschaltet", (int) r);
            }
          }
      - lambda: |-
          const std::string cov = id(mp_cover_url).state;
          // Ohne eigenes Bild (leer bzw. Platzhalter der Streamer-Funktion): Logo der App von der SD-Karte
          const bool ohne = cov.empty() || cov.find("esphomeremote_netflix_n.png") != std::string::npos ||
                            cov.find("esphomeremote_cover_leer.png") != std::string::npos;
          const std::string s = sdbilder::slug(id(mp_app_name).state);
          id(logo_slug) = (id(sd_logos) && ohne && !s.empty()) ? s : std::string();
      - if:
          condition: {lambda: "return !id(logo_slug).empty();"}
          then:
            - if:
                condition: {lambda: "auto &c = sdbilder::cache(); auto it = c.find(id(logo_slug)); return it != c.end() && it->second.player.ok;"}
                then:
                  - script.execute: sd_logo_zeigen
                else:
                  - if:
                      condition: {lambda: "auto &c = sdbilder::cache(); auto it = c.find(id(logo_slug)); const bool erlaubt = it == c.end() || (it->second.fehlt_bis != 0 && (int32_t) (millis() - it->second.fehlt_bis) >= 0); return erlaubt && !id(sd_bild_laeuft) && !id(sdkarte)->is_mounted() && !id(voice_active) && !id(host_mic) && !id(ota_aktiv);"}
                      then:
                        - script.execute: sd_logo_holen
  - id: sd_logo_zeigen
    then:
      - lambda: |-
          auto &c = sdbilder::cache();
          auto it = c.find(id(logo_slug));
          if (it == c.end()) return;
          if (it->second.player.ok) {
            lv_image_set_src(id(media_cover), &it->second.player.dsc);
            lv_obj_remove_flag(id(media_cover), LV_OBJ_FLAG_HIDDEN);
          }
          if (it->second.home.ok) lv_image_set_src(id(home_cover_img), &it->second.home.dsc);
          ESP_LOGI("sd", "Logo von der SD-Karte: %s", id(logo_slug).c_str());
          // Speicher schonen: hoechstens 6 Apps im Cache, die gerade gezeigte bleibt.
          for (auto e = c.begin(); e != c.end() && c.size() > 6;) {
            if (e->first != id(logo_slug)) e = c.erase(e); else ++e;
          }
  # Karte kurz einbinden, beide Bilder der App in den Cache lesen, Karte auswerfen, Mikrofon zurueckholen.
  - id: sd_logo_holen
    mode: single
    then:
      - lambda: 'id(sd_bild_laeuft) = true;'
      - script.execute: sd_strom_an
      - script.wait: sd_strom_an
      # Lesen im Hintergrund-Task (die Karte ist langsam; im Hauptprogramm loeste das den Task-Watchdog aus)
      - lambda: 'sdbilder::starte(id(sdkarte), id(logo_slug));'
      - wait_until:
          condition: {lambda: "return !sdbilder::busy();"}
          timeout: 45s
      - lambda: |-
          auto &c = sdbilder::cache();
          const std::string s = id(logo_slug);
          const bool fertig = !sdbilder::busy();
          if (fertig && sdbilder::ergebnis().fehlt_bis == 0) {
            c[s] = std::move(sdbilder::ergebnis());
            ESP_LOGI("sd", "Logo %s: geladen", s.c_str());
          } else {
            c[s].fehlt_bis = millis() + 600000;   // Karte/Datei fehlt oder Zeitueberschreitung: 10 min nicht erneut versuchen
            ESP_LOGW("sd", "Logo %s: nicht verfuegbar%s", s.c_str(), fertig ? "" : " (Zeitueberschreitung)");
          }
          if (id(sdkarte)->is_mounted()) id(sdkarte)->unmount();
      - switch.turn_on: sd_power_off
      - delay: 200ms
      - lambda: |-
          id(voice)->set_mic_blocked(false);
          id(sd_bild_laeuft) = false;
      - script.execute: apply_mic_power
      - script.execute: sd_logo_zeigen
  # Cache leeren (nach dem Wechseln der Karte oder neuen Dateien). Die Bilder vorher vom Bildschirm nehmen,
  # sonst zeigt LVGL noch auf freigegebenen Speicher.
  - id: sd_logo_leeren
    then:
      - lvgl.image.update: {id: media_cover, src: mp_cover_image}
      - lvgl.image.update: {id: home_cover_img, src: home_cover_image}
      - lambda: 'sdbilder::cache().clear();'
      - script.execute: sd_logo_pruefen
  - id: sd_logo_label
    then:
      - lvgl.label.update: {id: sd_logos_lbl, text: !lambda 'return id(sd_logos) ? std::string("AN") : std::string("AUS");'}
      - lvgl.label.update: {id: sd_logos_lbl, text_color: !lambda 'return id(sd_logos) ? lv_color_hex(0x22C55E) : lv_color_hex(0x8B94A3);'}

  # Wartungsfenster: WLAN fuer 3 min erzwingen (Fernwartung / OTA). Nur noch auf
  # Anstoss - Ladekabel anstecken oder Schalter "Wartungsfenster jetzt" in HA;
  # kein stuendliches Aufwachen mehr. mode: restart, damit ein neuer Anstoss das
  # Fenster verlaengert statt zu stapeln.
  # Firmware-Update von der Remote anstossen (Wartung & Tests). HA baut und spielt auf (esphomeremote_konfig/firmware.py)
  # und meldet den Stand ueber fw_status.
  - id: fw_update_anfordern
    then:
      - if:
          condition: {lambda: 'return !api::global_api_server->is_connected_with_state_subscription();'}
          then:
            - lambda: 'extras::fw_status("Keine Verbindung zu Home Assistant. Bitte kurz warten und nochmal versuchen.", 3);'
          else:
            - lambda: 'extras::fw_status("Angefragt. Home Assistant baut jetzt die Firmware, das dauert einige Minuten.", 1);'
            - script.execute: fw_fenster
            - homeassistant.event:
                event: esphome.remote_update
                data:
                  geraet: !lambda 'return App.get_name();'
  # Waehrend eines Updates WLAN an und kein Schlaf (5 min, jede Meldung von HA verlaengert)
  - id: fw_fenster
    mode: restart
    then:
      - lambda: 'id(wartung_bis) = millis() + 300000UL;'
      - wifi.enable:
      - delay: 300s
      - lambda: 'if ((int32_t) (id(wartung_bis) - millis()) < 2000) id(wartung_bis) = millis();'
  - id: wartungsfenster
    mode: restart
    then:
      - lambda: |-
          id(wartung_bis) = millis() + 180000UL;
          ESP_LOGI("wartung", "Wartungsfenster: WLAN 3 min erzwungen an");
          weck_log("Wartungsfenster (WLAN 3 min)");
      - wifi.enable:
      - delay: 180s
      - lambda: 'if ((int32_t) (id(wartung_bis) - millis()) < 2000) id(wartung_bis) = millis();'
      - if:
          condition:
            lambda: 'return id(disp_off) && id(ps_wifi_off) && !id(testmodus) && !id(boot_grace) && !id(ota_aktiv) && (int32_t) (millis() - id(wartung_bis)) >= 0;'
          then:
            - lambda: 'ESP_LOGI("wartung", "Wartungsfenster vorbei - WLAN wieder aus");'
            - wifi.disable:

  # Boot-Schonfrist: nach jedem echten Boot (auch nach jedem OTA-Reboot)
  # sind Tiefschlaf und WLAN-Aus fuer 2 min gesperrt (bis 2026-10-20: 10 min - zum Testen zu lang; zum
  # Flashen gibt es inzwischen den Wartungsfenster-Knopf). So gibt es nach jedem
  # Flash sicher ein Fenster, um einen Fehler zu korrigieren. Nach dem Aufwachen
  # aus dem Tiefschlaf ist boot_grace schon in on_boot auf false gesetzt.
  - id: boot_grace_timer
    then:
      - if:
          condition: {lambda: 'return id(boot_grace);'}
          then:
            - lambda: 'ESP_LOGI("test", "Boot-Schonfrist: 2 min kein Tiefschlaf / kein WLAN-Aus");'
            - delay: 120s
            - globals.set: {id: boot_grace, value: "false"}
            - lambda: 'ESP_LOGI("test", "Boot-Schonfrist vorbei");'
            - script.execute: backlight_idle_timeout

  # Empfindlichkeit der Bewegungserkennung: INT1_THS (0x32) des LIS3DH.
  # Kleinerer Wert = empfindlicher. Wird direkt ins Register geschrieben,
  # damit die Aenderung sofort greift und nicht erst nach einem Neustart.
  # Liest den tatsaechlichen Zustand der vier Host-Slots aus dem
  # BLE-Component (get_host_slot(n).occupied) - nicht nur, was zuletzt
  # angetippt wurde.
  # Helligkeit uebernehmen. Bei ausgeschaltetem Display nur merken - sonst schaltete z. B. der Regler in HA die
  # Beleuchtung ohne Abschalt-Timer ein und sie blieb auf Akku an (2026-10-19). Abgedunkelt: gedimmter Wert.
  - id: apply_brightness
    then:
      - lambda: |-
          if (!id(disp_off)) {
            float b = id(disp_bri) / 100.0f;
            if (id(disp_dimmed)) b = fmaxf(0.03f, b * (id(ps_dim_pct) / 100.0f));
            auto c = id(display_backlight).turn_on(); c.set_brightness(b); c.perform();
            if (id(kbd_light_on)) { auto k = id(button_backlight).turn_on(); k.set_brightness(id(kbd_bri) / 100.0f); k.perform(); }
          }
          // HA-Regler nur bei Aenderung melden (vorher alle 5 s - weckte Funk und Prozessor)
          if (!id(num_disp_bri).has_state() || (int) id(num_disp_bri).state != id(disp_bri)) id(num_disp_bri).publish_state(id(disp_bri));
          if (!id(num_kbd_bri).has_state() || (int) id(num_kbd_bri).state != id(kbd_bri)) id(num_kbd_bri).publish_state(id(kbd_bri));
      - lvgl.label.update: {id: disp_bri_lbl, text: !lambda 'char b[8]; snprintf(b,sizeof(b),"%d%%", id(disp_bri)); return std::string(b);'}
      - lvgl.label.update: {id: kbd_bri_lbl,  text: !lambda 'char b[8]; snprintf(b,sizeof(b),"%d%%", id(kbd_bri));  return std::string(b);'}
      - lvgl.label.update: {id: qs_bri_pct,   text: !lambda 'char b[8]; snprintf(b,sizeof(b),"%d%%", id(disp_bri)); return std::string(b);'}
      - lvgl.label.update: {id: qs_kbd_pct,   text: !lambda 'char b[8]; snprintf(b,sizeof(b),"%d%%", id(kbd_bri));  return std::string(b);'}
      - lvgl.slider.update: {id: disp_bri_sld, value: !lambda 'return id(disp_bri);'}
      - lvgl.slider.update: {id: kbd_bri_sld,  value: !lambda 'return id(kbd_bri);'}

  - id: apply_disp_timeout
    then:
      - lambda: |-
          // Slider auf die passende Stufe stellen und den Klartext darueber
          // setzen. Der Slider selbst kennt nur 0..5.
          const int t = id(disp_timeout_s);
          lv_slider_set_value(id(to_sld), t, LV_ANIM_OFF);
          char b[16];
          if (t == 0)        snprintf(b, sizeof(b), "Nie");
          else if (t < 60)   snprintf(b, sizeof(b), "%d s", t);
          else if (t % 60 == 0) snprintf(b, sizeof(b), "%d min", t / 60);
          else               snprintf(b, sizeof(b), "%d:%02d min", t / 60, t % 60);
          lv_label_set_text(id(to_val_lbl), b);
      # Neue Zeit gleich anwenden - aber nur bei hellem Display (2026-10-21): beim dunklen Aufwachen (on_boot 100) schaltete
      # dieser Aufruf das Display ein ("Display an" im Weckprotokoll, kurzes Aufblitzen)
      - if:
          condition: {lambda: 'return !id(disp_off);'}
          then: [{script.execute: wake_backlight}]

  - id: apply_motion_on
    then:
      - lambda: |-
          lv_obj_t *mk[3] = {id(mm_0_mk), id(mm_1_mk), id(mm_2_mk)};
          for (int i = 0; i < 3; i++) {
            lv_label_set_text(mk[i], i == id(motion_mode) ? "AKTIV" : " ");
            lv_obj_set_style_text_color(mk[i], lv_color_hex(i == id(motion_mode) ? 0x22C55E : 0xF1F3F5), LV_PART_MAIN);
          }
      - lvgl.label.update:
          id: motion_mode_lbl
          text: !lambda |-
            switch (id(motion_mode)) {
              case 1:  return std::string("Bewegung");
              case 2:  return std::string("Hochheben");
              default: return std::string("AUS");
            }
      - lvgl.label.update:
          id: motion_mode_lbl
          text_color: !lambda 'return id(motion_mode) ? lv_color_hex(0x22C55E) : lv_color_hex(0x8B94A3);'

  # Aktivitaet anwenden: Bluetooth-Platz der Aktivitaet verbinden und die Leiste der Startseite markieren.
  - id: apply_activity
    then:
      - lambda: |-
          int a = id(activity);
          if (a >= tasten::aktivitaeten_anzahl()) { a = 0; id(activity) = 0; }
          const int platz = tasten::aktivitaet_slot(a);
          // Dock-Platz (2026-10-23): bedient das Dock das Geraet, verbindet sich die Remote nicht selbst
          id(tk_cfg).bt_weg_modus = []() { return (int) id(bt_weg); };
          id(kb).set_hid_ruhe(id(tk_cfg).platz_ueber_dock(platz));
          // Sprache ueber das Dock (2026-10-24): Funk nach Eingaben ueber das Dock kurz offen - fordert der Fernseher
          // daraufhin das Mikrofon an (Mikrofon-Symbol in SmartTube), kommt der Wunsch an. Nur mit erlaubtem Mikrofon.
          id(tk_cfg).sprache_lauschen_ms = id(mic_allowed) ? 1500 : 0;
          static bool sprache_dock_an = false;
          if (!sprache_dock_an) {
            sprache_dock_an = true;
            id(voice)->set_dock_weg([](const std::vector<uint8_t> &p) { return id(tk_cfg).sprache_senden(p); });
            id(direkt).add_on_sprache([](uint8_t platz, uint8_t art, const uint8_t *d, uint16_t n) {
              if (art == 2 && (!id(mic_allowed) || !id(tk_cfg).sprache_ziel())) return;
              id(voice)->dock_host(art, d, n);
            });
          }
          if ((int) id(kb).active_host_slot() != platz) {
            char act[24];
            snprintf(act, sizeof(act), "switch_host:%d", platz);
            id(kb).execute_action(act);
          }
          tasten::dock_anwenden(a);
          id(akt_sensor).publish_state(id(akt_an) ? a : -1);   // HA: Aktivitaets-Schalter
          id(dock_status_melden).execute(false);
          // Auf der sichtbaren Startseite gewechselt: Dock-Animation
          static int vorher = -1;
          if (vorher >= 0 && vorher != a && id(cur_page) == 0 && !id(disp_off)) tasten::dock_anim();
          vorher = a;

  # Startseite anordnen: Wiedergabe-Karte mit Cover (216 x 172, von HA passend zugeschnitten), danach die
  # eigene Anordnung aus dem Konfigurator (tasten::startseite_anwenden) und die Aktivitaetsleiste.
  - id: apply_home_layout
    then:
      - lambda: |-
          // Abdunklung und Beschriftungen sind einfache obj/Labels - LVGL macht obj klickbar. Sonst schluckten sie
          // die Tipps auf den unteren Teil der Karte; ohne das Flag faellt der Klick auf den Kartenknopf durch.
          lv_obj_remove_flag(id(home_card_scrim), LV_OBJ_FLAG_CLICKABLE);
          lv_obj_remove_flag(id(home_player_lbl), LV_OBJ_FLAG_CLICKABLE);
          lv_obj_remove_flag(id(home_player_artist), LV_OBJ_FLAG_CLICKABLE);
          lv_obj_set_size(id(home_player_btn), 216, 172);
          lv_obj_align(id(home_player_btn), LV_ALIGN_TOP_MID, 0, 28);
          lv_obj_clear_flag(id(home_cover_img), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(home_card_scrim), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(home_player_artist), LV_OBJ_FLAG_HIDDEN);
          lv_obj_align(id(home_player_lbl), LV_ALIGN_BOTTOM_MID, 0, -26);
          tasten::startseite_anwenden();
          tasten::dock_anwenden(id(activity));

  - id: fix_slider_geometry
    then:
      - lambda: |-
          // JEDER neue Regler MUSS hier mit rein: ohne das bleibt er bei LVGLs eigener (kleinerer) Standardgroesse,
          // egal was width/height im YAML sagen. Farben stehen hier statt im YAML (dort ~270 Byte setup() je Regler).
          lv_obj_t *alle[] = {id(disp_bri_sld), id(kbd_bri_sld), id(to_sld), id(ms_sld), id(ps_dim_sld), id(ds_sld), id(kl_sld), id(ps_dimp_sld), id(ps_wifis_sld), id(ps_wifitv_sld), id(ps_cpu_sld), id(ps_bles_sld), id(ps_touchms_sld), id(ps_deeps_sld), id(ps_deeptv_sld), id(ps_low_sld), id(mem_sld), id(menu_close_sld), id(clean_dur_sld), id(home_bri_sld), id(home_kbd_sld), id(dock_von_sld), id(dock_bis_sld), id(maus_tempo_sld), id(maus_dpad_sld)};
          const lv_style_selector_t IND_F = (int) LV_PART_INDICATOR | (int) LV_STATE_FOCUSED;
          const lv_style_selector_t KNB_F = (int) LV_PART_KNOB | (int) LV_STATE_FOCUSED;
          for (lv_obj_t *s : alle) {
            lv_obj_set_style_pad_all(s, 3, LV_PART_MAIN);
            lv_obj_set_style_bg_color(s, lv_color_hex(0x3B82F6), LV_PART_INDICATOR);
            lv_obj_set_style_bg_color(s, lv_color_hex(0x60A5FA), IND_F);
            // Knopf: normal hellgrau, markiert (D-Pad) reinweiss mit blauem Ring
            lv_obj_set_style_bg_color(s, lv_color_hex(0xC9CED6), LV_PART_KNOB);
            lv_obj_set_style_bg_color(s, lv_color_hex(0xFFFFFF), KNB_F);
            lv_obj_set_style_border_color(s, lv_color_hex(0x3B82F6), KNB_F);
            lv_obj_set_style_border_width(s, 4, KNB_F);
            // Fokus = graue Schiene statt Rahmen
            lv_obj_set_style_border_width(s, 0, LV_STATE_FOCUSED);
            lv_obj_set_style_outline_width(s, 0, LV_STATE_FOCUSED);
            lv_obj_set_style_bg_color(s, lv_color_hex(0x3A424E), LV_STATE_FOCUSED);
            // 180 breit und mittig: Einstellungsseiten 216 breit (18 Rand je Seite), Schnellmenue 208 (14)
            const bool schnell = s == id(home_bri_sld) || s == id(home_kbd_sld);
            lv_obj_set_size(s, 180, 26);
            lv_obj_set_style_margin_left(s, schnell ? 14 : 18, LV_PART_MAIN);
            lv_obj_set_style_margin_right(s, schnell ? 14 : 18, LV_PART_MAIN);
          }

  # Mikrofon-Versorgung = erlaubt UND Display wach. Die LED an MIC_VDD leuchtet
  # sonst rund um die Uhr, und Mikrofon plus LED ziehen zusammen rund 2,5 mA -
  # auf einem Akkugeraet Verschwendung, solange es nur herumliegt. Erst beim
  # Sprechen einzuschalten waere sparsamer, wuerde aber die ersten Silben
  # abschneiden: ein MEMS-Mikrofon braucht nach dem Einschalten Anlaufzeit.
  - id: apply_mic_power
    then:
      - if:
          condition:
            lambda: "return (id(mic_allowed) && id(voice_active)) || id(voice)->mic_blocked();"
          then:  [{switch.turn_on:  mic_power}]
          else:  [{switch.turn_off: mic_power}]
      - lambda: |-
          // Wert wie bei allen Schaltern: AN gruen, AUS grau (2026-10-07, vorher "Mikrofon: AN" in Weiss)
          lv_label_set_text(id(mic_lbl), id(mic_allowed) ? "AN" : "AUS");
          lv_obj_set_style_text_color(id(mic_lbl),
            lv_color_hex(id(mic_allowed) ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
      - script.execute: refresh_mic_icon

  # Ausgelagert aus dem on_click der Kachel "Mikrofon" (page_voice_set): jeder Code, der
  # direkt in einem LVGL-Widget-Callback steht, wird beim Kompilieren in setup() inline
  # kopiert - dort war schon vorher kaum noch Platz (l32r-Grenze, siehe Kommentar bei
  # "lvgl: theme:"). Ein script.execute-Aufruf braucht dort dagegen nur wenige Bytes.
  - id: toggle_mic
    then:
      - lambda: 'id(mic_allowed) = !id(mic_allowed); id(tk_cfg).sprache_lauschen_ms = id(mic_allowed) ? 1500 : 0;'
      - script.execute: apply_mic_power

  # Durchgestrichenes Mikrofon-Symbol in der Statusleiste: sichtbar, solange kein Ton
  # aufgenommen werden kann - egal ob wegen des Datenschutz-Schalters "Mikrofon" (Sprache-
  # Einstellungen) oder weil die SD-Karte gerade im Zugriff ist (teilt sich Pins mit dem
  # Mikrofon, siehe sd_einbinden/sd_konfig_start/sd_logo_holen). Eigenes Script statt
  # nur ein Teil von apply_mic_power, weil set_mic_blocked(true) dort bewusst OHNE
  # apply_mic_power aufgerufen wird (die SD-Skripte steuern MIC_VDD selbst, zeitkritisch) -
  # das Symbol muss trotzdem sofort umschalten (Nutzerwunsch 2026-09-24).
  # Knopf "Fernseher einschalten" (Media-Seite): nur bei gewaehltem Fernseher (Verknuepfung "tv"), solange er aus ist.
  # Auch nach jeder neuen Konfiguration (esphomeremote-tasten.h) - die Verknuepfung kann nach dem TV-Zustand kommen.
  - id: tv_knopf_pruefen
    then:
      - lambda: |-
          if (id(tv_on) || id(tk_cfg).ent("tv").empty()) lv_obj_add_flag(id(m_tv_on), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(m_tv_on), LV_OBJ_FLAG_HIDDEN);

  - id: refresh_mic_icon
    then:
      - lambda: |-
          const bool aus = !id(mic_allowed) || id(voice)->mic_blocked();
          if (aus) lv_obj_remove_flag(id(mic_off_icon), LV_OBJ_FLAG_HIDDEN);
          else     lv_obj_add_flag(id(mic_off_icon), LV_OBJ_FLAG_HIDDEN);

  # ---- Schnellmenue (2026-10-06, Nutzerwunsch "wie beim Android-Handy") ----
  # Ein Tipp auf die Statusleiste (links ODER rechts) oeffnet alles zusammen:
  # links Tastenlicht-Regler + AN/AUS-Feld, rechts Display-Regler, in der Mitte
  # die Kacheln WLAN und Bluetooth. Dahinter ein abgedunkelter Schleier - Tipp
  # darauf schliesst. Nach 8 s ohne Bedienung schliesst es von selbst.
  - id: hide_bri_overlay
    mode: restart
    then:
      - delay: 8s
      - script.execute: close_bri_overlay
  - id: hide_kbd_overlay
    then: [{script.execute: hide_bri_overlay}]
  - id: close_bri_overlay
    then:
      - lambda: |-
          lv_obj_add_flag(id(qs_scrim), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(qs_panel), LV_OBJ_FLAG_HIDDEN);
  - id: qs_refresh
    then:
      - lambda: |-
          auto kachel = [](lv_obj_t *btn, lv_obj_t *lbl, bool an, const char *txt) {
            lv_label_set_text(lbl, txt);
            lv_obj_set_style_text_color(lbl, lv_color_hex(an ? 0xF1F3F5 : 0x8B94A3), LV_PART_MAIN);
            lv_obj_set_style_bg_color(btn, lv_color_hex(an ? 0x1E3A8A : 0x232A35), LV_PART_MAIN);
            lv_obj_set_style_border_color(btn, lv_color_hex(an ? 0x3B82F6 : 0x232A35), LV_PART_MAIN);
          };
          const bool wlan = !wlan_zugriff::g_nur_ble;
          const bool wlan_ok = wifi::global_wifi_component->is_connected();
          kachel(id(qs_wlan_btn), id(qs_wlan_lbl), wlan, !wlan ? "AUS" : (wlan_ok ? "verbunden" : "AN"));
          const bool bt = !id(kb).funk_aus();
          // wie WLAN: "verbunden", sobald ein Geraet (Streamer, TV ...) gekoppelt verbunden ist
          kachel(id(qs_bt_btn), id(qs_bt_lbl), bt, !bt ? "AUS" : (id(ble_paired).state ? "verbunden" : "AN"));
  - id: toggle_bri_overlay
    then:
      - if:
          condition: {lambda: "return !lv_obj_has_flag(id(qs_panel), LV_OBJ_FLAG_HIDDEN);"}
          then:
            - script.stop: hide_bri_overlay
            - script.execute: close_bri_overlay
          else:
            - lambda: |-
                lv_slider_set_value(id(home_bri_sld), id(disp_bri), LV_ANIM_OFF);
                lv_slider_set_value(id(home_kbd_sld), id(kbd_bri), LV_ANIM_OFF);
                // Reihenfolge = Stapel: Schleier unten, darueber das Panel
                lv_obj_t *o[2] = {id(qs_scrim), id(qs_panel)};
                for (auto *x : o) { lv_obj_remove_flag(x, LV_OBJ_FLAG_HIDDEN); lv_obj_move_foreground(x); }
                char b[8];
                snprintf(b, sizeof(b), "%d%%", id(disp_bri)); lv_label_set_text(id(qs_bri_pct), b);
                snprintf(b, sizeof(b), "%d%%", id(kbd_bri));  lv_label_set_text(id(qs_kbd_pct), b);
            - script.execute: kbd_box_refresh
            - script.execute: qs_refresh
            - script.execute: hide_bri_overlay
  - id: toggle_kbd_overlay
    then: [{script.execute: toggle_bri_overlay}]
  # WLAN-Kachel: AUS = "Nur Bluetooth" (WLAN bleibt aus, HA laeuft ueber den
  # Tunnel). Ohne Tunnel (keine g_set_nur_ble) wirkt es nur bis zum Neustart.
  - id: qs_wlan_toggle
    then:
      - lambda: |-
          wlan_zugriff::g_nur_ble = !wlan_zugriff::g_nur_ble;
          if (wlan_zugriff::g_set_nur_ble) wlan_zugriff::g_set_nur_ble(wlan_zugriff::g_nur_ble);
      - if:
          condition: {lambda: "return wlan_zugriff::g_nur_ble;"}
          then: [{wifi.disable:}]
          # nach dem Aufwachen startet das WLAN erst nach dem Zeitfenster fuer den Funk zum Dock (on_boot -150)
          else: [{if: {condition: {lambda: "return !id(wlan_nach_weck);"}, then: [{wifi.enable:}]}}]
      - script.execute: qs_refresh
      - script.execute: apply_power
      - script.execute: hide_bri_overlay
  # Bluetooth-Kachel ("Flugmodus" fuer Bluetooth, Nutzerwahl "b ohne WLAN"):
  # trennt alle Verbindungen (Hosts UND HA-Tunnel) und wirbt nicht mehr.
  # WLAN springt dafuer NICHT an. Wird nicht gespeichert - Neustart = wieder an.
  - id: qs_bt_toggle
    then:
      - lambda: 'id(kb).set_funk_aus(!id(kb).funk_aus());'
      - script.execute: qs_refresh
      - script.execute: hide_bri_overlay
  - id: kbd_box_refresh
    then:
      - lambda: |-
          lv_label_set_text(id(home_kbd_lbl), id(kbd_light_on) ? "AN" : "AUS");
          lv_obj_set_style_text_color(id(home_kbd_lbl), lv_color_hex(id(kbd_light_on) ? 0xF1F3F5 : 0x8B94A3), LV_PART_MAIN);
          lv_obj_set_style_border_color(id(home_kbd_box), lv_color_hex(id(kbd_light_on) ? 0x3B82F6 : 0x3A424E), LV_PART_MAIN);
  - id: kbd_overlay_light
    then:
      - script.execute: toggle_kbd_light
      - if:
          condition: {lambda: "return id(kbd_light_on);"}
          then: [{script.execute: apply_brightness}]
      - script.execute: kbd_box_refresh
      - script.execute: hide_kbd_overlay

  - id: refresh_wifi_bars
    then:
      - lambda: |-
          // Farben der Statusleiste (Nutzerwunsch 2026-10-10), gleiche Regel fuer Bluetooth, WLAN und HA:
          //   Farbe  = verbunden (Bluetooth blau, WLAN gruen; Balkenzahl = Empfang)
          //   grau   = eingeschaltet, aber nicht verbunden (alle drei Balken)
          //   dunkel = wird gar nicht benutzt (WLAN aus, z. B. "Nur Bluetooth" oder im Ruhezustand)
          // Ob Home Assistant da ist, zeigt jetzt allein das HA-Symbol dahinter - die WLAN-Balken nicht mehr.
          lv_obj_t *b[3] = {id(wifi_bar0), id(wifi_bar1), id(wifi_bar2)};
          const float r = id(wifi_rssi).state;   // dBm
          auto *w = wifi::global_wifi_component;
          const bool wlan_da = w->is_connected();
          uint32_t farbe = 0x2A3340;   // dunkel: WLAN aus
          int an = 0;
          if (wlan_da) {
            farbe = 0x22C55E;
            an = 1;
            if (!std::isnan(r) && r > -60.0f) an = 3;
            else if (!std::isnan(r) && r > -75.0f) an = 2;
          } else if (!w->is_disabled() && !wlan_zugriff::g_nur_ble) {
            farbe = 0x6B7280;   // grau: WLAN an, aber nicht verbunden
            an = 3;
          }
          for (int i = 0; i < 3; i++)
            lv_obj_set_style_bg_color(b[i], lv_color_hex(i < an ? farbe : 0x2A3340), LV_PART_MAIN);
          // HA-Symbol: gruen = ueber WLAN, blau = ueber Bluetooth (Tunnel, nur -halink), grau = nicht verbunden.
          // "Verbunden" erst mit dem Zustands-Abo von HA (2026-10-04: is_connected() zaehlte auch Log-Clients).
          const bool ha_da = api::global_api_server->is_connected_with_state_subscription();
          const bool ha_ble = ha_da && wlan_zugriff::g_link_ha && wlan_zugriff::g_link_ha();
          lv_obj_set_style_text_color(id(ha_ble_dot),
            lv_color_hex(!ha_da ? 0x6B7280 : (ha_ble ? 0x3B82F6 : 0x22C55E)), LV_PART_MAIN);
          if (id(show_ha)) lv_obj_remove_flag(id(ha_ble_dot), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(ha_ble_dot), LV_OBJ_FLAG_HIDDEN);
          // Dock-Symbol: HA-Befehle gehen ueber das Dock (tasten_konfig::dock_weg, 2026-10-20)
          const int dw = id(tk_cfg).dock_weg();
          lv_obj_set_style_text_color(id(dock_weg_ico),
            lv_color_hex(dw == 2 ? 0x3B82F6 : dw == 3 ? 0xEF4444 : 0x6B7280), LV_PART_MAIN);
          if (id(show_ha) && dw != 0) lv_obj_remove_flag(id(dock_weg_ico), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(dock_weg_ico), LV_OBJ_FLAG_HIDDEN);

  # Sichtbarkeit der vier Kopfzeilen-Elemente anwenden.
  - id: apply_show
    then:
      - lambda: |-
          // Balken und Akku sitzen in einem eigenen, rechtsbuendigen Rahmen -
          // die duerfen aus der Anordnung verschwinden, der Rest rutscht dann
          // sauber nach.
          struct { lv_obj_t *o; bool an; } e[3] = {
            {id(ble_bars),  id(show_ble)},
            {id(wifi_bars), id(show_wifi)},
            {id(lbl_batt),  id(show_batt)},
          };
          for (int i = 0; i < 3; i++) {
            if (e[i].an) lv_obj_remove_flag(e[i].o, LV_OBJ_FLAG_HIDDEN);
            else         lv_obj_add_flag(e[i].o, LV_OBJ_FLAG_HIDDEN);
          }
          // Die Uhr wirklich ausblenden: die linke Gruppe (Uhr + Timer) ist von der
          // rechten unabhaengig, der Timer rutscht dann nach links.
          if (id(show_clock)) lv_obj_remove_flag(id(idle_clock), LV_OBJ_FLAG_HIDDEN);
          else                lv_obj_add_flag(id(idle_clock), LV_OBJ_FLAG_HIDDEN);
          // Assistenten-Symbol: nur eines von beiden sichtbar, passend zum
          // gerade gewaehlten Assistenten (id(assistant): 0 = Google,
          // 1 = Home Assistant) - komplett aus, wenn der Schalter
          // "Anzeige" -> "Assistenten-Symbol" aus ist.
          const bool ha_gewaehlt = id(assistant) == 1;
          const bool zeig_google = id(show_assi_icon) && !ha_gewaehlt;
          const bool zeig_ha     = id(show_assi_icon) && ha_gewaehlt;
          if (zeig_google) lv_obj_remove_flag(id(assi_icon_google), LV_OBJ_FLAG_HIDDEN);
          else              lv_obj_add_flag(id(assi_icon_google), LV_OBJ_FLAG_HIDDEN);
          if (zeig_ha)      lv_obj_remove_flag(id(assi_icon_ha), LV_OBJ_FLAG_HIDDEN);
          else              lv_obj_add_flag(id(assi_icon_ha), LV_OBJ_FLAG_HIDDEN);
          if (!id(show_motion)) lv_obj_add_flag(id(motion_icon), LV_OBJ_FLAG_HIDDEN);
          if (id(show_ha)) lv_obj_remove_flag(id(ha_ble_dot), LV_OBJ_FLAG_HIDDEN);
          else             lv_obj_add_flag(id(ha_ble_dot), LV_OBJ_FLAG_HIDDEN);
          lv_obj_t *m[7] = {id(sh_ble_lbl), id(sh_wifi_lbl), id(sh_batt_lbl), id(sh_clock_lbl), id(sh_assi_lbl), id(sh_motion_lbl), id(sh_ha_lbl)};
          bool v[7] = {id(show_ble), id(show_wifi), id(show_batt), id(show_clock), id(show_assi_icon), id(show_motion), id(show_ha)};
          for (int i = 0; i < 7; i++) {
            lv_label_set_text(m[i], v[i] ? "AN" : "AUS");
            lv_obj_set_style_text_color(m[i],
              lv_color_hex(v[i] ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          }

  - id: refresh_ble_bars
    then:
      - lambda: |-
          // blau = verbunden (Balken = Empfang), grau = an, aber nicht verbunden, dunkel = Bluetooth aus
          // (Kachel "Bluetooth" im Schnellmenue) - wie die WLAN-Balken, s. refresh_wifi_bars (2026-10-10).
          lv_obj_t *b[3] = {id(ble_bar0), id(ble_bar1), id(ble_bar2)};
          uint32_t farbe = 0x2A3340;
          int an = 0;
          if (id(ble_paired).state) {
            const float r = id(ble_rssi).state;   // dBm, typisch -40 bis -95
            farbe = 0x3B82F6;
            an = 1;
            if (!std::isnan(r)) {
              if (r > -70.0f) an = 3;
              else if (r > -85.0f) an = 2;
            }
          } else if (!id(kb).funk_aus()) {
            farbe = 0x6B7280;
            an = 3;
          }
          for (int i = 0; i < 3; i++)
            lv_obj_set_style_bg_color(b[i], lv_color_hex(i < an ? farbe : 0x2A3340), LV_PART_MAIN);

  - id: refresh_ble_slots
    then:
      - lambda: |-
          lv_obj_t *lbl[4] = {id(ble_slot0_lbl), id(ble_slot1_lbl),
                              id(ble_slot2_lbl), id(ble_slot3_lbl)};
          const bool conn = id(ble_paired).state;
          static const char *std_namen[4] = {"Platz 1", "Platz 2", "Platz 3", "Platz 4"};
          // Namen aus dem Konfigurator (Bluetooth > Plaetze), sonst die eingebauten (2026-10-11)
          std::string nm[4];
          lv_obj_t *titel[4] = {id(ble_slot0_name), id(ble_slot1_name), id(ble_slot2_name), id(ble_slot3_name)};
          for (int k = 0; k < 4; k++) {
            nm[k] = id(tk_cfg).slot_name(k);
            if (nm[k].empty()) nm[k] = std_namen[k];
            lv_label_set_text(titel[k], (std::to_string(k + 1) + "  " + nm[k]).c_str());
          }
          const char *names[4] = {nm[0].c_str(), nm[1].c_str(), nm[2].c_str(), nm[3].c_str()};
          {
            char hdr[48];
            snprintf(hdr, sizeof(hdr), "Gewählt: %d  %s",
                     id(sel_slot) + 1, names[id(sel_slot) & 3]);
            lv_label_set_text(id(ble_target_lbl), hdr);
          }
          for (int k = 0; k < 4; k++) {
            const bool occ = id(kb).get_host_slot(k).occupied;
            const bool sel = (k == id(sel_slot));
            // conn ist der GLOBALE Verbindungszustand. Frueher stand er an
            // jedem gewaehlten Slot - also auch "Frei · VERBUNDEN" an einem
            // Slot, der nie gekoppelt war. Verbunden kann immer nur der aktive
            // Slot sein, und nur wenn er ueberhaupt belegt ist.
            const bool active = (k == id(kb).active_host_slot());
            std::string t = occ ? std::string("Gekoppelt") : std::string("Frei");
            if (occ && active && conn) t = "Verbunden";
            t += std::string(" · ") + extras::platz_text(extras::platz_modus(k));
            lv_label_set_text(lbl[k], t.c_str());
            lv_obj_set_style_text_color(lbl[k],
                lv_color_hex(occ && active && conn ? 0x22C55E
                                                  : (occ ? 0xF1F3F5 : 0x8B94A3)),
                LV_PART_MAIN);
            // Gewaehlter Slot bekommt einen gruenen Grund. Der Fokusrahmen
            // bleibt blau - so sieht man beide Zustaende gleichzeitig und
            // verwechselt "worauf stehe ich" nicht mit "was ist gewaehlt".
            lv_obj_t *row_obj[4] = {id(ble_slot0), id(ble_slot1),
                                    id(ble_slot2), id(ble_slot3)};
            lv_obj_set_style_bg_color(row_obj[k],
                lv_color_hex(sel ? 0x2A3340 : 0x1A1F27), LV_PART_MAIN);
          }
          extras::touchpad_auffrischen();   // Eingabeart des gewaehlten Platzes


  - id: apply_motion_sens
    then:
      # Eine Einstellung fuer alle Modi: Rohdaten fuer "Hochheben", dazu Ruck- und Klopf-Erkennung
      # im Chip (siehe lis3dh.cpp). Die Ruck-Schwelle passt das 250-ms-Intervall laufend an.
      - lambda: 'id(motion_chip)->configure_runtime(remote_strom::ruck_ths(id(motion_sens)), remote_strom::klopf_ths(id(klopf_sens)));'
      - lvgl.label.update:
          id: motion_sens_lbl
          text: !lambda |-
            switch (id(motion_sens)) {
              case 0:  return std::string("Hoch");
              case 2:  return std::string("Niedrig");
              default: return std::string("Mittel");
            }
      - lambda: |-
          // Slider nachfuehren (gedreht: rechts = empfindlicher).
          int st = id(motion_sens); if (st < 0) st = 0; if (st > 2) st = 2;
          lv_slider_set_value(id(ms_sld), 2 - st, LV_ANIM_OFF);

  # Grundlage merken, sobald das Display ausgeht - der Winkel wird immer
  # gegen die Lage gemessen, in der die Fernbedienung abgelegt wurde.
  - id: capture_baseline
    then:
