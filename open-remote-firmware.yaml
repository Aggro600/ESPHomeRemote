            case 16: // Kueche
              row(id(ku_sc_0),       nullptr,          nullptr);
              row(id(ku_sc_1),       nullptr,          nullptr);
              row(id(ku_sc_2),       nullptr,          nullptr);
              row(id(ku_sc_3),       nullptr,          nullptr);
              row(id(ku_room_light_btn), nullptr,      nullptr);
              row(id(ku_dim_down),   id(ku_dim_up),    nullptr);
              row(id(ku_kochen_btn), nullptr,          nullptr);
              row(id(ku_hood_btn),   nullptr,          nullptr);
              row(id(ku_hood_down),  id(ku_hood_up),   nullptr);
              row(id(ku_light_btn),  nullptr,          nullptr);
              row(id(ku_rollo_up),   id(ku_rollo_stop), id(ku_rollo_down));
              row(id(ku_r20),        id(ku_r50),       nullptr);
              row(id(back_room_ku),  nullptr,          nullptr);
              break;
            case 5:  // SmartHome
              row(id(sh_test_btn),      nullptr, nullptr);
              row(id(tile_sleep),       nullptr, nullptr);
              row(id(cam_haustuer_btn), nullptr, nullptr);
              row(id(cam_drucker_btn),  nullptr, nullptr);
              row(id(cam_aus_btn),      nullptr, nullptr);
              row(id(back_sh),          nullptr, nullptr);
              break;
            case 6:  // Media Player
              row(id(m_prev),     id(m_playpause), id(m_next));
              row(id(m_voldown),  id(m_volup),     nullptr);
              row(id(back_media), nullptr,         nullptr);
              break;
            case 7:  // Klingel Haustuer
              row(id(door_open_btn),    nullptr, nullptr);
              row(id(door_ok1_btn),     nullptr, nullptr);
              row(id(door_dismiss_btn), nullptr, nullptr);
              break;
            case 11: // Klingel Wohnungstuer
              row(id(door2_open_btn),    nullptr, nullptr);
              row(id(door_ok2_btn),      nullptr, nullptr);
              row(id(door2_dismiss_btn), nullptr, nullptr);
              break;
            case 12: // Sleeptimer
              row(id(sleep_plus30), nullptr, nullptr);
              row(id(sleep_cancel), nullptr, nullptr);
              row(id(back_sleep),   nullptr, nullptr);
              break;
            case 28: // Aktivitaeten
              row(id(akt_tab), nullptr, nullptr);
              row(id(akt_str), nullptr, nullptr);
              row(id(akt_tv),  nullptr, nullptr);
              row(id(back_akt), nullptr, nullptr);
              break;
            case 29: // Kameras
              row(id(mc_h), nullptr, nullptr); row(id(mc_w), nullptr, nullptr);
              row(id(mc_g), nullptr, nullptr); row(id(mc_d), nullptr, nullptr);
              row(id(mc_z), nullptr, nullptr); row(id(mc_x), nullptr, nullptr);
              row(id(back_cams), nullptr, nullptr);
              break;
            case 27: // Energie sparen
              row(id(ps_wifi_btn),     nullptr, nullptr);
              row(id(ps_wifi_off_btn), nullptr, nullptr);
              row(id(ps_cpu_btn),      nullptr, nullptr);
              row(id(ps_bleidle_btn),  nullptr, nullptr);
              row(id(ps_deep_btn),     nullptr, nullptr);
              row(id(testmod_btn),     nullptr, nullptr);
              row(id(back_power),      nullptr, nullptr);
              break;
            case 23: // Anzeige
              row(id(show_ble_btn),   nullptr, nullptr);
              row(id(show_wifi_btn),  nullptr, nullptr);
              row(id(show_batt_btn),  nullptr, nullptr);
              row(id(show_clock_btn), nullptr, nullptr);
              row(id(back_show),      nullptr, nullptr);
              break;
            case 8:  // Einstellungen
              row(id(kbd_light_btn), nullptr, nullptr);
              row(id(tile_bright),   nullptr, nullptr);
              row(id(tile_display),  nullptr, nullptr);
              row(id(tile_motion),   nullptr, nullptr);
              row(id(tile_show),     nullptr, nullptr);
              row(id(tile_assi),     nullptr, nullptr);
              row(id(tile_tts),      nullptr, nullptr);
              row(id(tile_ble),      nullptr, nullptr);
              row(id(tile_power),    nullptr, nullptr);
              row(id(tile_restart),  nullptr, nullptr);
              row(id(back_settings), nullptr, nullptr);
              break;
            case 13: // Display-Timeout
              row(id(to_sld), nullptr, nullptr);
              row(id(back_display), nullptr, nullptr);
              break;
            case 17: // Musik
              row(id(mus_group_btn),    nullptr, nullptr);
              row(id(mus_pause), id(mus_stop), nullptr);
              row(id(mus_google_btn),   nullptr, nullptr);
              row(id(mrvideo_btn),      nullptr, nullptr);
              row(id(mrvideo_auto_btn), nullptr, nullptr);
              row(id(back_music),       nullptr, nullptr);
              break;
            case 30: // Lautsprecher der Multiroom-Gruppe
              row(id(grp_b0), nullptr, nullptr); row(id(grp_b1), nullptr, nullptr);
              row(id(grp_b2), nullptr, nullptr); row(id(grp_b3), nullptr, nullptr);
              row(id(grp_b4), nullptr, nullptr); row(id(grp_b5), nullptr, nullptr);
              row(id(grp_b6), nullptr, nullptr);
              row(id(grp_alle_an), id(grp_alle_aus), nullptr);
              row(id(back_musgrp), nullptr, nullptr);
              break;
            case 31: // Musik ueber Google
              row(id(mus_0), nullptr, nullptr); row(id(mus_1), nullptr, nullptr);
              row(id(mus_2), nullptr, nullptr); row(id(mus_3), nullptr, nullptr);
              row(id(mus_4), nullptr, nullptr);
              row(id(back_musgoo), nullptr, nullptr);
              break;
            case 22: // Helligkeit
              row(id(disp_bri_sld), nullptr, nullptr);
              row(id(kbd_bri_sld),  nullptr, nullptr);
              row(id(back_bright),  nullptr, nullptr);
              break;
            case 15: // Apps
              row(id(app_0), nullptr, nullptr); row(id(app_1), nullptr, nullptr);
              row(id(app_2), nullptr, nullptr); row(id(app_3), nullptr, nullptr);
              row(id(app_4), nullptr, nullptr); row(id(app_5), nullptr, nullptr);
              row(id(app_6), nullptr, nullptr);
              row(id(back_apps), nullptr, nullptr);
              break;
            case 14: // Bewegung
              row(id(mm_0), nullptr, nullptr); row(id(mm_1), nullptr, nullptr);
              row(id(mm_2), nullptr, nullptr);
              row(id(ms_sld), nullptr, nullptr);
              row(id(back_motion), nullptr, nullptr);
              break;
            case 10: // Bluetooth
              row(id(ble_slot0),   nullptr, nullptr);
              row(id(ble_slot1),   nullptr, nullptr);
              row(id(ble_slot2),   nullptr, nullptr);
              row(id(ble_slot3),   nullptr, nullptr);
              row(id(ble_connect), nullptr, nullptr);
              row(id(ble_pair),    nullptr, nullptr);
              row(id(ble_forget),  nullptr, nullptr);
              row(id(back_ble),    nullptr, nullptr);
              break;
            default: return;
          }
          if (nr == 0) return;

          // LVGL entscheidet selbst zuverlaessig, ob eine Beruehrung ein Klick
          // oder ein Wischen war - das muss man nicht nachbauen. Kinderklicks
          // an die Seite durchreichen und dort EINMAL einen Zuhoerer setzen,
          // der den Fokus auf das wirklich geklickte Feld zieht.
          {
            lv_obj_t *sc = lv_screen_active();
            for (int i2 = 0; i2 < nr; i2++)
              for (int j2 = 0; j2 < rl[i2]; j2++) {
                // Bis zur Seite hinauf durchreichen: liegt ein Knopf in einer
                // Zeile oder in der Kopfzeile, muss auch dieser Zwischenbehaelter
                // weiterreichen - sonst erreicht der Klick den Zuhoerer nie und
                // der Fokus springt nicht mit (fiel beim Zurueck-Knopf auf).
                for (lv_obj_t *up = g[i2][j2]; up != nullptr && up != sc;
                     up = lv_obj_get_parent(up))
                  lv_obj_add_flag(up, LV_OBJ_FLAG_EVENT_BUBBLE);
                // Entscheidend: LVGL nimmt anklickbare Felder beim Beruehren in
                // seine EIGENE Fokusgruppe auf und setzt dort LV_STATE_FOCUSED -
                // denselben Zustand, den auch unsere Tastensteuerung benutzt.
                // Dadurch waren zwei Felder gleichzeitig markiert (per Diagnose
                // nachgewiesen). Wir vergeben den Fokus selbst, also nehmen wir
                // LVGL diese Zustaendigkeit weg.
                lv_obj_remove_flag(g[i2][j2], LV_OBJ_FLAG_CLICK_FOCUSABLE);
              }
            // Die Kopfzeile ist der Elternteil des Zurueck-Knopfes (letzte
            // Zeile). FLOATING nimmt sie aus dem Fluss - sie bleibt beim
            // Scrollen stehen, statt mit nach oben zu wandern.
            if (nr > 0) {
              lv_obj_t *bk = g[nr - 1][0];
              lv_obj_t *hd = bk ? lv_obj_get_parent(bk) : nullptr;
              if (hd != nullptr && hd != sc) {
                lv_obj_add_flag(hd, LV_OBJ_FLAG_FLOATING);
                // Randlos: die Kopfzeile deckt die volle Displaybreite ab und
                // reicht bis an den oberen Rand. Sonst scheinen beim Scrollen
                // oben und seitlich Knoepfe daran vorbei. Die Ausrichtung
                // bezieht sich auf die INHALTSFLAECHE, deshalb der Versatz um
                // die Seitenraender (-12 / -42).
                // Versatz aus den Seitenraendern BERECHNEN statt fest
                // eintragen: die Ausrichtung bezieht sich auf die
                // Inhaltsflaeche, und feste Werte laufen aus dem Ruder, sobald
                // sich pad_top einer Seite aendert.
                const int pl = lv_obj_get_style_pad_left(sc, LV_PART_MAIN);
                const int pt = lv_obj_get_style_pad_top(sc, LV_PART_MAIN);
                lv_obj_set_width(hd, 240);
                lv_obj_set_height(hd, 44);
                lv_obj_align(hd, LV_ALIGN_TOP_LEFT, -pl, -pt);
                // Innenabstand, damit der Zurueck-Knopf nicht am Displayrand
                // klebt - links wie oben.
                lv_obj_set_style_pad_left(hd, 16, LV_PART_MAIN);
                lv_obj_set_style_pad_right(hd, 16, LV_PART_MAIN);
                lv_obj_set_style_pad_top(hd, 8, LV_PART_MAIN);
                lv_obj_move_foreground(hd);
              }
            }
            if (sc != nullptr && lv_obj_get_user_data(sc) == nullptr) {
              lv_obj_set_user_data(sc, (void *) 1);
              lv_obj_add_event_cb(sc, [](lv_event_t *e) {
                // Auf Seiten, die nicht scrollen, macht LVGL aus einem Wischen
                // trotzdem einen Klick - es gibt ja keine Scrollbewegung, die
                // ihn abbrechen wuerde. Deshalb hier zusaetzlich pruefen, ob
                // der Finger sich bewegt hat.
                if (id(touch_moved)) return;
                id(click_obj) = lv_event_get_target(e);
                // Helligkeits-Ueberlagerung schliessen, sobald woanders
                // hingetippt wird - ausser auf ihr selbst oder auf der
                // Statuszeile, die sie oeffnet.
                lv_obj_t *t = (lv_obj_t *) lv_event_get_target(e);
                if (t != id(home_bri_sld) && t != id(home_status_btn) &&
                    lv_obj_get_parent(t) != id(home_status_btn))
                  id(close_bri_overlay)->execute();
                id(focus_apply)->execute();
              }, LV_EVENT_CLICKED, nullptr);
            }
          }

          bool moved = (id(fdrow) != 0 || id(fdcol) != 0);
          int r = id(frow);
          int c = id(fcol);

          // Beruehrung: den Fokus auf das angetippte Feld setzen, damit die
          // Tasten danach von dort weiterlaufen und nur EIN Feld markiert ist.
          bool from_touch = false;
          if (id(click_obj) != nullptr) {
            lv_obj_t *hit = (lv_obj_t *) id(click_obj);
            id(click_obj) = nullptr;
            id(fdrow) = 0;
            id(fdcol) = 0;
            bool found = false;
            for (int i2 = 0; i2 < nr && !found; i2++)
              for (int j2 = 0; j2 < rl[i2]; j2++)
                if (g[i2][j2] == hit) { r = i2; c = j2; found = true; break; }
            if (!found) return;      // Klick lag nicht auf einem Bedienfeld
            from_touch = true;
            moved = false;
          } else if (id(touch_sync)) {
            id(touch_sync) = false;
            from_touch = true;
            id(fdrow) = 0;
            id(fdcol) = 0;
            moved = false;
            const int tx = id(touch_x), ty = id(touch_y);
            bool hit = false;
            for (int i2 = 0; i2 < nr && !hit; i2++) {
              for (int j2 = 0; j2 < rl[i2]; j2++) {
                lv_area_t a;
                lv_obj_get_coords(g[i2][j2], &a);
                if (tx >= a.x1 && tx <= a.x2 && ty >= a.y1 && ty <= a.y2) {
                  r = i2; c = j2; hit = true; break;
                }
              }
            }
            if (!hit) return;   // daneben getippt - Fokus unveraendert lassen
          } else if (id(fdrow) != 0) {
            // Hoch/Runter: Zeile wechseln, unten/oben umlaufen. Die Spalte wird
            // in die neue Zeile eingepasst (nicht umgebrochen), damit man aus
            // der rechten Spalte auch rechts wieder herauskommt.
            const int from = rl[r];
            r += id(fdrow);
            if (r < 0)   r = nr - 1;
            if (r >= nr) r = 0;
            // Spalte proportional auf die neue Zeilenbreite abbilden und dabei
            // abrunden: aus der Mitte einer Dreierzeile geht es damit nach
            // links, nicht nach rechts. (Play/Pause -> leiser, nicht lauter.)
            if (from > 0 && rl[r] != from) c = (c * rl[r]) / from;
            if (c >= rl[r]) c = rl[r] - 1;
            if (c < 0)      c = 0;
          } else if (id(fdcol) != 0) {
            // Links/Rechts: nur innerhalb der Zeile, dort umlaufend.
            c += id(fdcol);
            if (c < 0)      c = rl[r] - 1;
            if (c >= rl[r]) c = 0;
          } else {
            // Seitenwechsel: nur auf Gueltigkeit pruefen.
            if (r < 0 || r >= nr)  r = 0;
            if (c < 0 || c >= rl[r]) c = 0;
          }
          id(fdrow) = 0;
          id(fdcol) = 0;
          id(frow) = r;
          id(fcol) = c;

          for (int i = 0; i < nr; i++) {
            for (int j = 0; j < rl[i]; j++) {
              if (i == r && j == c) lv_obj_add_state(g[i][j], LV_STATE_FOCUSED);
              else                  lv_obj_remove_state(g[i][j], LV_STATE_FOCUSED);
              lv_obj_invalidate(g[i][j]);
            }
          }
          id(cur_focus) = g[r][c];
          lv_obj_t *scr = lv_obj_get_screen(g[r][c]);
          if (from_touch) {
            // Fokus nur setzen, Ansicht nicht bewegen.
          } else if (r == 0 && scr != nullptr) {
            // Erste Zeile = Seitenanfang. scroll_to_view scrollt nur so weit,
            // dass der Button gerade sichtbar wird - die Ueberschrift darueber
            // bliebe abgeschnitten. Also bewusst ganz nach oben.
            lv_obj_scroll_to_y(scr, 0, moved ? LV_ANIM_ON : LV_ANIM_OFF);
          } else if (moved) {
            // lv_obj_scroll_to_view() schiebt nur so weit, dass das Feld
            // GERADE eben anliegt - am unteren Rand blieb es dadurch halb
            // verdeckt. Deshalb selbst rechnen, mit etwas Luft.
            if (scr != nullptr) {
              lv_obj_update_layout(scr);
              lv_area_t a, pa;
              lv_obj_get_coords(g[r][c], &a);
              lv_obj_get_coords(scr, &pa);
              // Oben schwebt die Kopfzeile ueber dem Inhalt. Mit einem festen
              // kleinen Abstand landete das ausgewaehlte Feld darunter - es war
              // markiert, aber verdeckt. Der Platz, den die Kopfzeile
              // beansprucht, steht als pad_top der Seite; den nehmen wir.
              const int32_t margin_oben = lv_obj_get_style_pad_top(scr, LV_PART_MAIN) + 4;
              const int32_t margin_unten = 10;
              int32_t sy = lv_obj_get_scroll_y(scr);
              if (a.y2 > pa.y2 - margin_unten)     sy += (a.y2 - (pa.y2 - margin_unten));
              else if (a.y1 < pa.y1 + margin_oben) sy -= ((pa.y1 + margin_oben) - a.y1);
              if (sy < 0) sy = 0;
              lv_obj_scroll_to_y(scr, sy, LV_ANIM_ON);
            }
          } else if (scr != nullptr) {
            // Seitenwechsel: immer ganz oben starten, damit die Ueberschrift
            // vollstaendig sichtbar ist.
            lv_obj_scroll_to_y(scr, 0, LV_ANIM_OFF);
          }
  - id: focus_up
    then:
      - lambda: 'id(fdrow) = -1;'
      - script.execute: focus_apply
  - id: focus_down
    then:
      - lambda: 'id(fdrow) = 1;'
      - script.execute: focus_apply
  - id: focus_left
    then:
      - lambda: 'id(fdcol) = -1;'
      - script.execute: focus_apply
  - id: focus_right
    then:
      - lambda: 'id(fdcol) = 1;'
      - script.execute: focus_apply
  - id: activate
    then:
      # Beim Bestaetigen per D-Pad schicken wir nur das Klick-Ereignis - den
      # gedrueckten Zustand setzt LVGL dabei nicht, der entsteht nur bei echter
      # Beruehrung. Ohne ihn bleibt die blaue Rueckmeldung aus, die es per
      # Finger gibt. Also kurz selbst setzen.
      - lambda: |-
          if (id(cur_focus) == nullptr) return;
          lv_obj_t *o = (lv_obj_t *) id(cur_focus);
          id(flash_obj) = o;
          lv_obj_add_state(o, LV_STATE_PRESSED);
          lv_obj_send_event(o, LV_EVENT_CLICKED, nullptr);
      - script.execute: unflash

  # Nimmt die Faerbung nach kurzer Zeit wieder weg. Eigenes Skript, damit die
  # Aktion des Knopfes nicht auf die Wartezeit warten muss.
  # Sprachtaste gedrueckt: erst Strom, kurz warten, dann aufnehmen. Ohne den
  # Vorlauf faengt ein MEMS-Mikrofon die ersten Silben nicht sauber ein - es
  # braucht nach dem Einschalten einen Moment, bis es eingeschwungen ist.
  - id: voice_start
    mode: restart
    then:
      # Zuerst wecken - das schaltet bei Stufe 2 auch das WLAN wieder ein.
      # Frueher stand das nur im Google-Zweig, wodurch der Home-Assistant-
      # Assistent bei schlafendem Display gar keine Verbindung hatte.
      - script.execute: wake_backlight
      - globals.set: {id: voice_want, value: "true"}
      - globals.set: {id: voice_active, value: "true"}
      - script.execute: apply_mic_power
      - delay: 200ms
      # Nur starten, wenn die Taste noch gehalten wird. Ein kurzer Tipp - etwa
      # beim Doppeltipp zum Umschalten - startet sonst eine Abfrage, in die
      # niemand mehr hineinspricht.
      - if:
          condition: {lambda: "return id(voice_want);"}
          then:
            - if:
                condition: {lambda: "return id(assistant) == 0;"}
                then:
                  - lambda: 'id(kb).execute_action("atv_mic_start");'
                  # Anzeigen, DASS aufgenommen wird. Den erkannten Text kann
                  # die Fernbedienung hier nicht wissen: Der Android-TV-Dienst
                  # schickt Audio nur in eine Richtung, die Erkennung laeuft im
                  # Fernseher und kommt nie zu uns zurueck.
                  - script.execute: wake_backlight
                  - lvgl.label.update: {id: voice_you,    text: "Sprich jetzt"}
                  - lvgl.label.update: {id: voice_answer, text: "Google hört zu. Das Erkannte erscheint auf dem Fernseher."}
                  - lvgl.page.show: {id: page_voice, animation: FADE_IN, time: 150ms}
                else:
                  # Kommt die Fernbedienung gerade aus dem Ruhezustand, braucht
                  # das WLAN ein paar Sekunden. Ohne Verbindung tut
                  # voice_assistant.start schlicht nichts - man steht dann vor
                  # einem Geraet, das nicht reagiert und nichts sagt.
                  - if:
                      condition:
                        not: {api.connected:}
                      then:
                        - lvgl.label.update: {id: voice_you,    text: "Moment"}
                        - lvgl.label.update: {id: voice_answer, text: "Verbinde mit Home Assistant ..."}
                        - lvgl.page.show: {id: page_voice, animation: FADE_IN, time: 150ms}
                        - wait_until:
                            condition: {api.connected:}
                            timeout: 8s
                  - if:
                      condition: {api.connected:}
                      then: [{voice_assistant.start:}]
                      else:
                        - lvgl.label.update: {id: voice_you,    text: "Keine Verbindung"}
                        - lvgl.label.update: {id: voice_answer, text: "Home Assistant ist nicht erreichbar. Google geht trotzdem - mit doppeltem Druck umschalten."}
                        - lvgl.page.show: {id: page_voice, animation: FADE_IN, time: 150ms}
                        - lambda: 'ESP_LOGW("assi", "keine API-Verbindung - Abfrage nicht gestartet");'
                        - globals.set: {id: voice_active, value: "false"}
                        - script.execute: apply_mic_power
            - script.execute: voice_power_guard
          else:
            - lambda: 'ESP_LOGD("assi", "zu kurz gedrueckt - keine Abfrage");'
            - globals.set: {id: voice_active, value: "false"}
            - script.execute: apply_mic_power

  # Loslassen: Aufnahme beenden, dann den Strom wieder wegnehmen. Die kurze
  # Nachlaufzeit verhindert, dass das letzte Stueck Audio abgeschnitten wird.
  # Notbremse: bleibt eine Home-Assistant-Abfrage haengen, faellt der
  # Mikrofonstrom trotzdem wieder weg.
  - id: voice_power_guard
    mode: restart
    then:
      - delay: 25s
      - globals.set: {id: voice_active, value: "false"}
      - script.execute: apply_mic_power
      - lambda: 'ESP_LOGW("assi", "Abfrage lief zu lange - Mikrofon abgeschaltet");'

  - id: voice_stop
    then:
      - globals.set: {id: voice_want, value: "false"}
      - if:
          condition: {lambda: "return id(assistant) == 0;"}
          then:
            # Google: Loslassen IST das Ende, der Fernseher wertet selbst aus.
            - lambda: 'id(kb).execute_action("atv_mic_stop");'
            - lvgl.label.update: {id: voice_answer, text: "Ergebnis auf dem Fernseher"}
            - delay: 1500ms
            - if:
                condition: {lambda: "return id(cur_page) == 26;"}
                then: [{script.execute: go_home}]
            - delay: 300ms
            - globals.set: {id: voice_active, value: "false"}
            - script.execute: apply_mic_power
          else:
            # Home Assistant: NICHT abbrechen. Die Pipeline erkennt das
            # Sprachende selbst und braucht danach noch einen Moment fuer
            # Erkennung und Absicht. Ein Abbruch beim Loslassen wirft die
            # Abfrage weg ("Starting STT by VAD" kommt, das Ergebnis nie).
            # Strom bleibt bis on_end an.
            - lambda: 'ESP_LOGD("assi", "losgelassen - Pipeline laeuft weiter");'

  - id: toggle_assistant
    then:
      - lambda: 'id(assistant) = id(assistant) == 0 ? 1 : 0;'
      - script.execute: apply_assistant

  # Der MAX17048 fuehrt in Register 0x16 (CRATE) die Lade- bzw. Entladerate in
  # 0,208 % pro Stunde je Schritt, mit Vorzeichen. ESPHome legt den Wert nicht
  # offen, also lesen wir ihn direkt vom Bus. Positiv heisst: der Akku fuellt
  # sich - das ist eine echte Ladeerkennung und kein Vergleich zweier
  # Messpunkte, der Minuten braeuchte.
  - id: refresh_laden
    then:
      - lambda: |-
          uint8_t d[2];
          i2c::I2CDevice dev;
          dev.set_i2c_bus(id(hauptbus));
          dev.set_i2c_address(0x36);
          if (dev.read_register(0x16, d, 2) != i2c::ERROR_OK) {
            ESP_LOGW("akku", "CRATE-Register nicht lesbar");
            return;
          }
          const int16_t roh = (int16_t) ((uint16_t) d[0] << 8 | d[1]);
          const float rate = roh * 0.208f;              // Prozent pro Stunde
          ESP_LOGD("akku", "CRATE roh=%d -> %.2f %%/h", roh, (double) rate);
          id(entladerate).publish_state(rate);
          const bool neu = rate > 0.5f;                 // kleiner Totbereich
          if (neu != id(laedt)) {
            const bool flanke_an = neu && !id(laedt);
            id(laedt) = neu;
            ESP_LOGI("akku", "%s (%.1f %%/h)",
                     neu ? "laedt" : "laedt nicht", (double) rate);
            // Ladegeraet gerade angesteckt -> aufwecken und WLAN 5 min
            // erzwingen. So wird die Fernbedienung ueber "ans Kabel legen"
            // zuverlaessig per Home Assistant / OTA erreichbar, auch wenn sie
            // im Ruhezustand (Stufe 2) das WLAN abgeschaltet hatte.
            if (flanke_an) {
              ESP_LOGI("akku", "Ladegeraet angesteckt -> Wartungsfenster");
              id(wake_backlight)->execute();
              id(wartungsfenster)->execute();
            }
          }
          // Akku-Text nur beim Laden gruen, sonst gedaempftes Grau. Zusaetzlich
          // der Blitz daneben ein/aus.
          lv_obj_set_style_text_color(id(lbl_batt),
            lv_color_hex(neu ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          if (neu) lv_obj_clear_flag(id(lbl_batt_chg), LV_OBJ_FLAG_HIDDEN);
          else     lv_obj_add_flag(id(lbl_batt_chg), LV_OBJ_FLAG_HIDDEN);

  # Prozessortakt: 80 MHz nur wenn "Prozessor drosseln" AN UND Display aus
  # (Referenz-Firmware laeuft BLE-HID nachweislich stabil bei 80 MHz). Bei
  # Display an oder waehrend OTA immer 240 MHz. Der BT-Treiber holt sich fuer
  # Funkarbeit ohnehin selbst wieder Takt.
  - id: apply_cpu
    then:
      - lambda: |-
          const bool spar = id(ps_cpu) && id(disp_off) && !id(ota_aktiv);
          esp_pm_config_t pm = {};
          pm.max_freq_mhz = spar ? 80 : 240;
          pm.min_freq_mhz = 80;
          pm.light_sleep_enable = false;
          const esp_err_t r = esp_pm_configure(&pm);
          ESP_LOGI("strom", "CPU max %d MHz (%s)", (int) pm.max_freq_mhz,
                   r == ESP_OK ? "ok" : "abgelehnt");

  - id: apply_power
    then:
      - lambda: |-
          // WLAN-Sparmodus: light laesst den Funkteil zwischen den
          // Empfangsfenstern schlafen, none haelt ihn dauerhaft wach.
          wifi::global_wifi_component->set_power_save_mode(
            id(ps_wifi) ? wifi::WIFI_POWER_SAVE_LIGHT : wifi::WIFI_POWER_SAVE_NONE);
      - script.execute: apply_cpu
      - lambda: |-
          ESP_LOGI("strom", "WLAN-Sparmodus %s | WLAN-Ruhe %s | BLE-Idle %s",
                   id(ps_wifi) ? "an" : "aus", id(ps_wifi_off) ? "an" : "aus",
                   id(ps_bleidle) ? "an" : "aus");
          lv_obj_t *m[6] = {id(ps_wifi_lbl), id(ps_off_lbl), id(ps_cpu_lbl), id(ps_deep_lbl), id(testmod_lbl), id(ps_bleidle_lbl)};
          bool v[6] = {id(ps_wifi), id(ps_wifi_off), id(ps_cpu), id(ps_deep), id(testmodus), id(ps_bleidle)};
          for (int i = 0; i < 6; i++) {
            lv_label_set_text(m[i], v[i] ? "AN" : "AUS");
            lv_obj_set_style_text_color(m[i],
              lv_color_hex(v[i] ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          }
          // (Stufe 2 greift jetzt auch mit HA-Assistent - voice_start weckt
          //  zuerst und wartet auf die API. Kein "ruht"-Hinweis mehr noetig.)

  - id: apply_tts_speaker
    then:
      - lambda: |-
          const bool an = id(tts_speaker);
          lv_label_set_text(id(tts_lbl), an ? "AN" : "AUS");
          lv_obj_set_style_text_color(id(tts_lbl),
            lv_color_hex(an ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);

  - id: apply_assistant
    then:
      # Die Anzeige der Sparstufe mitziehen: mit Home Assistant ruht Stufe 2.
      - script.execute: apply_power
      - lambda: |-
          const bool ha = id(assistant) == 1;
          lv_label_set_text(id(assi_lbl), ha ? "Home Assistant" : "Google");
          lv_obj_set_style_text_color(id(assi_lbl),
            lv_color_hex(ha ? 0x22C55E : 0x3B82F6), LV_PART_MAIN);
          ESP_LOGI("assi", "Sprachassistent: %s", ha ? "Home Assistant" : "Google");

  - id: unflash
    mode: restart
    then:
      - delay: 180ms
      - lambda: |-
          if (id(flash_obj) != nullptr) {
            lv_obj_remove_state(id(flash_obj), LV_STATE_PRESSED);
            id(flash_obj) = nullptr;
          }

  # Fuehrt die Aktion fuer id(cur_key) aus. Ausgelagert, damit die
  # Wiederholung beim Halten exakt dieselbe Logik benutzt wie der erste Druck.
  - id: dispatch_key
    then:
      - lambda: |-
          const int keycode = id(cur_key);
          const int p = id(cur_page);

          // ================= HOMESCREEN =================
          // Die Aktivitaet bestimmt das Tastenlayout (Harmony-Prinzip).
          // Aktivitaet 0 "TV": alles per BLE-HID an den Streamer.
          if (p == 0) {
            uint16_t cc = 0;
            switch (id(activity)) {
              case 0:
              default:
                switch (keycode) {
                  case 14:  cc = 0x0042; break;  // Hoch
                  case 35:  cc = 0x0043; break;  // Runter
                  case 15:  cc = 0x0044; break;  // Links
                  case 32:  cc = 0x0045; break;  // Rechts
                  case 34:  cc = 0x0041; break;  // OK
                  case 13:  cc = 0x0224; break;  // Zurueck
                  case 3:   cc = 0x0223; break;  // Menue (S23) -> Home
                  case 33:  cc = 0x00E9; break;  // Lauter
                  case 43:  cc = 0x00EA; break;  // Leiser
                  case 44:  cc = 0x00E2; break;  // Mute
                  case 2:   cc = 0x00CD; break;  // Play / Pause
                  case 5:   cc = 0x00B7; break;  // Stop
                  case 4:   cc = 0x00B4; break;  // Rewind
                  case 11:  cc = 0x00B3; break;  // Forward
                  case 102: cc = 0x0030; break;  // Power
                  default:  cc = 0;      break;
                }
                break;
            }
            if (cc != 0) {
              char act[32];
              // 04.09. umgestellt auf ECHTES Halten. Vorher gingen alle Tasten
              // ausser OK als Tippfolge raus, damit die Wiederholrate ueberall
              // gleich ist - der Fernseher hat das aber als schnelle
              // Einzeldruecke gewertet statt als gehaltene Taste. Jetzt wird
              // die Taste wirklich gehalten und beim Loslassen freigegeben;
              // die Wiederholung macht das Geraet selbst, so wie es seine
              // eigene Fernbedienung auch tut. Preis: die Rate ist je Taste
              // verschieden, weil der Fernseher sie bestimmt.
              const bool hold = true;
              snprintf(act, sizeof(act), hold ? "consumer_hold:0x%04X" : "consumer:0x%04X",
                       (unsigned) cc);
              if (hold) id(kb).hold_action(act);
              else      id(kb).execute_action(act);
            }
            return;
          }

          // Sprachantwort: Hoch/Runter scrollt den Text, statt den Fokus zu
          // bewegen - dort gibt es nur einen Knopf.
          if (p == 26 && (keycode == 14 || keycode == 35)) {
            lv_obj_scroll_by(id(voice_box), 0, keycode == 14 ? 40 : -40, LV_ANIM_ON);
            return;
          }

          // ================= MENUE =================
          // Nur die Navigation gehoert dem Display. Alles andere - Lautstaerke,
          // Mute, Transport, Power - geht weiter an den Fernseher, damit man
          // im Menue nicht die Kontrolle ueber das Geraet verliert.
          // Steht der Fokus auf einem Regler, aendern Links/Rechts dessen Wert,
          // statt die Spalte zu wechseln - sonst waere er nur per Finger
          // bedienbar.
          if ((keycode == 15 || keycode == 32) && id(cur_focus) != nullptr &&
              lv_obj_check_type((lv_obj_t *) id(cur_focus), &lv_slider_class)) {
            lv_obj_t *sl = (lv_obj_t *) id(cur_focus);
            // Frueher fest +-5 und auf 5..100 begrenzt - das war fuer den
            // Helligkeitsregler geschrieben und machte alle anderen
            // unbedienbar (der Timeout-Regler ging nur von 0 bis 5, ein
            // Tastendruck sprang also sofort ans Ende). Jetzt kommen
            // Schrittweite und Grenzen aus dem Regler selbst.
            const int32_t lo = lv_slider_get_min_value(sl);
            const int32_t hi = lv_slider_get_max_value(sl);
            // Schrittweite 1: fein genug fuer Sekunden beim Timeout. Beim
            // Halten laeuft die Wiederholung mit 55 ms, der volle Bereich ist
            // also in wenigen Sekunden durchfahren.
            const int32_t schritt = 1;
            (void) lo; (void) hi;
            int32_t v = lv_slider_get_value(sl) + (keycode == 32 ? schritt : -schritt);
            if (v < lo) v = lo;
            if (v > hi) v = hi;
            lv_slider_set_value(sl, v, LV_ANIM_OFF);
            lv_obj_send_event(sl, LV_EVENT_VALUE_CHANGED, nullptr);
            return;
          }
          switch (keycode) {
            case 13:  id(nav_back)->execute();    return;
            case 14:  id(focus_up)->execute();    return;
            case 35:  id(focus_down)->execute();  return;
            case 15:  id(focus_left)->execute();  return;
            case 32:  id(focus_right)->execute(); return;
            case 34:  id(activate)->execute();    return;
            default: break;
          }
          {
            uint16_t cc = 0;
            switch (keycode) {
              case 33:  cc = 0x00E9; break;  // Lauter
              case 43:  cc = 0x00EA; break;  // Leiser
              case 44:  cc = 0x00E2; break;  // Mute
              case 2:   cc = 0x00CD; break;  // Play / Pause
              case 5:   cc = 0x00B7; break;  // Stop
              case 4:   cc = 0x00B4; break;  // Rewind
              case 11:  cc = 0x00B3; break;  // Forward
              case 102: cc = 0x0030; break;  // Power
              default:  return;
            }
            char act[32];
            snprintf(act, sizeof(act), "consumer:0x%04X", (unsigned) cc);
            id(kb).execute_action(act);
          }

  # Halten laesst nachfeuern: erst eine Pause, damit ein normaler Druck nicht
  # doppelt ausloest, danach in kurzen Abstaenden bis zum Loslassen.
  - id: key_repeat
    mode: restart
    then:
      - lambda: 'id(rep_count) = 0;'
      - delay: 300ms
      - while:
          # Notbremse: bleibt ein Loslassen mal aus (verlorenes Tastenereignis),
          # liefe die Wiederholung sonst endlos weiter und wuerde den Fernseher
          # zuspammen. Nach rund 10 Sekunden ist Schluss.
          condition:
            lambda: "return id(held_key) != 0 && id(rep_count) < 170;"
          then:
            - script.execute: dispatch_key
            - lambda: 'id(rep_count)++;'
            - delay: 55ms
      - lambda: |-
          if (id(rep_count) >= 160) {
            ESP_LOGW("tasten", "Wiederholung nach 10 s abgebrochen - Loslassen der Taste %d kam nie an", id(held_key));
            id(held_key) = 0;
            id(kb).execute_action("release");
          }

  - id: go_home
    then:
      - lambda: |-
          int p = id(cur_page);
          if (p == 6 && id(media_from) == 3) p = 3;
          // Alle Menueseiten merken (nicht Home / Media-vom-Home / Klingel).
          // Frueher standen hier nur die ersten acht Seiten. Alles, was
          // spaeter dazukam (Apps, Musik, Kueche, Bad, Flur, Alle Raeume, TV,
          // Timeout, Bewegung, Helligkeit, Anzeige), wurde NICHT gemerkt - die
          // Erinnerung behielt dann den alten Wert und sprang beim naechsten
          // Oeffnen auf eine voellig andere Seite.
          // Apps zaehlt nur als Menueseite, wenn sie aus dem Menue kam.
          if (p == 15 && id(apps_from_home)) p = 0;
          if (p == 1 || p == 2 || p == 3 || p == 4 || p == 5 || p == 8 || p == 9 || p == 10 || p == 12 || p == 13 || p == 14 || p == 15 || p == 16 || p == 17 || p == 18 || p == 19 || p == 20 || p == 21 || p == 22 || p == 23 || p == 27 || p == 28 || p == 29 || p == 30 || p == 31) {
            id(last_menu_page) = p;
            id(last_menu_ms) = millis();
          }
      - lvgl.page.show: {id: page_home, animation: MOVE_RIGHT, time: 150ms}
  # Immer die oberste Menueseite, ohne die Erinnerung. Fuer den langen Druck:
  # dort will man bewusst nach ganz oben, nicht dorthin zurueck, wo man war.
  - id: open_menu_top
    then:
      - lambda: 'id(last_menu_ms) = 0;'
      - lvgl.page.show: {id: page_menu, animation: MOVE_LEFT, time: 150ms}

  - id: open_menu
    then:
      - lambda: |-
          bool recent = id(last_menu_ms) != 0 && (millis() - id(last_menu_ms)) < 10000;
          id(menu_target) = recent ? id(last_menu_page) : 1;
      - if: {condition: {lambda: "return id(menu_target) == 2;"}, then: [{lvgl.page.show: {id: page_rooms, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 3;"}, then: [{lvgl.page.show: {id: page_room_wz, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 4;"}, then: [{lvgl.page.show: {id: page_devices, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 5;"}, then: [{lvgl.page.show: {id: page_smarthome, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 8;"}, then: [{lvgl.page.show: {id: page_settings, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 9;"}, then: [{lvgl.page.show: {id: page_room_sz, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 10;"}, then: [{lvgl.page.show: {id: page_ble, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 12;"}, then: [{lvgl.page.show: {id: page_sleeptimer, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 13;"}, then: [{lvgl.page.show: {id: page_display, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 14;"}, then: [{lvgl.page.show: {id: page_motion, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 15;"}, then: [{lvgl.page.show: {id: page_apps, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 16;"}, then: [{lvgl.page.show: {id: page_room_ku, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 17;"}, then: [{lvgl.page.show: {id: page_music, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 18;"}, then: [{lvgl.page.show: {id: page_tv, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 19;"}, then: [{lvgl.page.show: {id: page_room_bad, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 20;"}, then: [{lvgl.page.show: {id: page_room_flur, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 21;"}, then: [{lvgl.page.show: {id: page_all_rooms, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 22;"}, then: [{lvgl.page.show: {id: page_bright, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 23;"}, then: [{lvgl.page.show: {id: page_show, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 27;"}, then: [{lvgl.page.show: {id: page_power, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 28;"}, then: [{lvgl.page.show: {id: page_activities, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 29;"}, then: [{lvgl.page.show: {id: page_cams, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 30;"}, then: [{lvgl.page.show: {id: page_music_group, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 31;"}, then: [{lvgl.page.show: {id: page_music_google, animation: MOVE_LEFT, time: 150ms}}]}
      - if:
          condition:
            lambda: |-
              int t = id(menu_target);
              return !(t == 2 || t == 3 || t == 4 || t == 5 || t == 8 || t == 9 || t == 10 || t == 12 || t == 13 || t == 14 || t == 15 || t == 16 || t == 17 || t == 18 || t == 19 || t == 20 || t == 21 || t == 22 || t == 23 || t == 27 || t == 28 || t == 29 || t == 30 || t == 31);
          then: [{lvgl.page.show: {id: page_menu, animation: MOVE_LEFT, time: 150ms}}]
  # ---- Tastengesten -------------------------------------------------------
  # Die Tastatur liefert nur "gedrueckt", "losgelassen" und beim Loslassen die
  # Haltedauer. Kurz und lang lassen sich damit direkt unterscheiden. Ein
  # Doppeldruck braucht dagegen eine Wartezeit nach dem ersten Loslassen -
  # deshalb faellt sie NUR bei Tasten an, fuer die unten eine Doppel-Aktion
  # hinterlegt ist. Alle anderen loesen weiterhin sofort aus.
  - id: gesture_action
    then:
      - lambda: |-
          const int k = id(gest_key);
          const int art = id(gest_kind);
          switch (k) {
            case 31:  // Menue-Taste
              if (art == 1)      id(open_menu_top)->execute();      // lang: nach ganz oben
              else if (art == 2) ESP_LOGI("geste", "31 doppelt - noch frei");
              else if (id(cur_page) != 0) id(go_home)->execute();   // kurz
              else               id(open_menu)->execute();
              break;
            default:
              ESP_LOGD("geste", "Taste %d Art %d ohne Aktion", k, art);
              break;
          }

  # Feuert den langen Druck, SOBALD die Haltezeit erreicht ist - nicht erst
  # beim Loslassen. Nur so merkt man beim Halten, dass es gezaehlt hat.
  - id: gesture_long
    mode: restart
    then:
      - delay: 700ms
      - if:
          condition: {lambda: "return id(gest_held) != 0 && !id(gest_done);"}
          then:
            - lambda: |-
                id(gest_done) = true;
                id(gest_key) = id(gest_held);
                id(gest_kind) = 1;
            - script.execute: gesture_action

  - id: gesture_single
    mode: restart
    then:
      - delay: 400ms
      - lambda: 'id(gest_kind) = 0;'
      - script.execute: gesture_action

  - id: nav_back
    then:
      - if: {condition: {lambda: "return id(cur_page) == 2;"}, then: [{lvgl.page.show: {id: page_menu,      animation: MOVE_RIGHT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(cur_page) == 3 || id(cur_page) == 9 || id(cur_page) == 16 || id(cur_page) == 19 || id(cur_page) == 20 || id(cur_page) == 21;"}, then: [{lvgl.page.show: {id: page_rooms, animation: MOVE_RIGHT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(cur_page) == 18;"}, then: [{lvgl.page.show: {id: page_devices, animation: MOVE_RIGHT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(cur_page) == 30 || id(cur_page) == 31;"}, then: [{lvgl.page.show: {id: page_music, animation: MOVE_RIGHT, time: 150ms}}]}
      # Apps von der Startseite aus geoeffnet: zurueck fuehrt dorthin zurueck,
      # nicht ins Menue - man war ja nie im Menue.
      - if: {condition: {lambda: "return id(cur_page) == 15 && id(apps_from_home);"}, then: [{script.execute: go_home}]}
