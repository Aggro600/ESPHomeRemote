                  border_color: 0x1A1F27
                  on_click:
                    - script.execute: svc_cam_wohnungstuer
                    # Rueckmeldung bleibt eine knappe Sekunde stehen - beim
                    # blossen Antippen waere sie sonst kaum zu sehen.
                    - lambda: |-
                        lv_obj_set_style_bg_color(id(cam_w), lv_color_hex(0x2563EB), LV_PART_MAIN);
                        lv_obj_set_style_border_color(id(cam_w), lv_color_hex(0x60A5FA), LV_PART_MAIN);
                    - delay: 900ms
                    - lambda: |-
                        lv_obj_set_style_bg_color(id(cam_w), lv_color_hex(0x1A1F27), LV_PART_MAIN);
                        lv_obj_set_style_border_color(id(cam_w), lv_color_hex(0x1A1F27), LV_PART_MAIN);
                  widgets: [{label: {align: CENTER, text: "Wohnung", text_font: a13}}]
              - button:
                  id: cam_g
