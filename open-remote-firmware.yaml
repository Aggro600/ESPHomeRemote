    # ================================================ 41: TASTATUR
    # Ziffernblock (Menue > Ziffern, kbd_mode 0, braucht kb_tasten digits/true) und
    # Bildschirmtastatur QWERTZ (Menue > Tastatur, kbd_mode 1, braucht "true") an den
    # aktiven Host - EINE Seite, EINE Tastenmatrix, Belegung/Aussehen setzt kbd_setup.
    # Bewusst keine Einzelbuttons: ESPHome erzeugt daraus so viel Code in setup(), dass
    # der Linker (l32r, 256 KB Reichweite) scheiterte ("literal target out of range").
    - id: page_keyboard
      styles: [st_screen]
      scrollbar_mode: "off"
      pad_top: 50
      pad_left: 4
      pad_right: 4
      pad_bottom: 4
      layout: {type: flex, flex_flow: column, flex_align_cross: start, pad_row: 8}
      on_load:
        - lambda: 'id(cur_page) = 41; id(frow) = 0; id(fcol) = 0; id(kbd_shift) = false; id(kbd_sel) = -1; id(kbd_kopf) = -1; eingabewahl::kbd_einrichten();'
        - script.execute: popup_kopf
        - lvgl.label.update: {id: kbd_title, text: !lambda 'return std::string(id(kbd_mode) == 0 ? "Ziffern" : "Tastatur");'}
        - lambda: 'if (gestenseite::z().eingabe) { id(kbd_shift) = gestenseite::z().text.empty(); gestenseite::kbd_titel(); }'
        - script.execute: kbd_setup
        - script.execute: focus_apply
        # Das D-Pad gehoert hier der Tastenmatrix, nicht dem Zurueck-Knopf (Zurueck-Taste geht trotzdem).
        - lambda: |-
            lv_obj_remove_state(id(back_keyboard), LV_STATE_FOCUSED);
            id(cur_focus) = nullptr;
      widgets:
        - obj:
            width: 100%
            height: 40
            bg_color: 0x0E1116
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollable: false
            styles: [st_fx_r8]
            widgets:
              - button:
                  id: back_keyboard
                  width: 46
                  height: 30
                  styles: [st_back]
                  focused: {border_color: 0xF1F3F5}
                  on_click:
                    - if:
                        condition: {lambda: 'return !gestenseite::kbd_abbruch();'}
                        then: [{script.execute: nav_back}]
                  widgets: [{label: {id: back_kbd_lbl, align: CENTER, text: "<", text_font: a15}}]
              - label: {id: kbd_title, text: "Tastatur", styles: [st_title, st_grow], pad_bottom: 0, height: 22, long_mode: DOT}
              # Rechts: Umschalter Maus | Tastatur | Ziffern (esphomeremote-maus.h, eingabewahl - wird beim Laden angehaengt)
        - buttonmatrix:
            id: kbd_matrix
            width: 100%
            flex_grow: 1
            rows:
              - buttons:
                  - text: "x"
            # Gedrueckt halten wiederholt (2026-10-26, Nutzer: v. a. Loeschen): ab dem langen Druck (~0,4 s) und dann
            # immer wieder; das Loslassen danach tippt nicht noch einmal. Umschalten (^) wiederholt nicht.
            on_press:
              - lambda: 'id(kbd_wdh_lief) = false;'
            on_long_press:
              - lambda: |-
                  lv_obj_t *m = id(kbd_matrix)->obj;
                  const char *t = lv_buttonmatrix_get_button_text(m, lv_buttonmatrix_get_selected_button(m));
                  if (t == nullptr || !strcmp(t, "^")) return;
                  id(kbd_wdh_lief) = true;
                  id(kbd_press)->execute();
            on_long_press_repeat:
              - lambda: 'if (id(kbd_wdh_lief)) id(kbd_press)->execute();'
            on_click:
              - lambda: |-
                  if (id(kbd_wdh_lief)) { id(kbd_wdh_lief) = false; return; }
                  id(kbd_press)->execute();
        - label: {hidden: true, text: !lambda "return lv_label_rueckrufe_leeren();"}   # schneller Start, s. esphomeremote-wlan.h


    # ================================================ 98: KONFIGURIERBARES MENUE
    # Inhalt baut components/menue zur Laufzeit in konf_root (Raster 6 x 40 px).
    - id: page_konfig
      styles: [st_screen]
      scrollbar_mode: "off"
      scrollable: false
      pad_all: 0
      on_load:
        - lambda: 'id(cur_page) = 98; tasten::kopf_linie(lv_obj_get_parent(id(konf_back)), id(konf_back));'
      widgets:
        # Kopfzeile 40 px ab y=0, X wie auf allen Seiten bei y=6 und buendig mit den Karten darunter (x=6, RAND) (2026-10-12: X klebte am oberen Displayrand,
        # wirkte abgeschnitten, und sass anders als die Zurueck-Knoepfe). Darunter 280 px = 7 Rasterzeilen
        # (2 + 7 x 40 - 4 = 278, Rand oben RAND_O in menue.cpp) plus 2 px Rand unten. Inhalt + Innenabstand unten =
        # genau die Hoehe -> kein Mini-Scrollen beim letzten Eintrag.
        - obj:
            x: 0
            y: 0
            width: 240
            height: 40
            bg_color: 0x0E1116
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            pad_left: 6
            pad_right: 6
            pad_top: 6
            pad_bottom: 4
            scrollable: false
            styles: [st_fx_r8]
            widgets:
