        - button:
            id: menu_home_btn
            align: BOTTOM_MID
            x: -54
            y: -46
            width: 104
            height: 44
            bg_color: 0x1A1F27
            radius: 12
            border_width: 2
            border_color: 0x1A1F27
            on_click: [{script.execute: open_menu}]
            widgets: [{label: {align: CENTER, text: "Menü", text_font: a15}}]
        - button:
            id: app_home_btn
            align: BOTTOM_MID
            x: 54
            y: -46
            width: 104
            height: 44
            # Gleicher Hintergrund wie MENUE - vorher 0x232A35 gegen 0x1A1F27.
            bg_color: 0x1A1F27
            radius: 12
            border_width: 2
            border_color: 0x1A1F27
            on_click:
              - lambda: 'id(apps_from_home) = true;'
              - lvgl.page.show: {id: page_apps, animation: MOVE_LEFT, time: 150ms}
            widgets: [{label: {align: CENTER, text: "Apps", text_font: a15}}]
        # MENUE-Button entfernt (Nutzerwunsch, Startseite war zu voll) - die
        # INFO-Taste (S6, physisch) oeffnet das Menue weiterhin genauso, s.
        # open_menu-Script/Tastenbelegung. Der Player-Button unten nutzt den
        # freigewordenen Platz.
        #
        # Player-Kurzzugriff auf der Startseite - direkt zu page_media, zeigt
        # den Titel (adb_title/mp_title pflegen home_player_lbl mit).
        #
        # Cover-Hintergrund (Stand 2026-09-16, DRITTER Anlauf): der erste
        # Versuch (volles 240x320-Bild als Kind dieses Buttons) hat LVGL
        # NICHT an den Buttongrenzen beschnitten - blutete ueber Apps drueber
        # UND blockierte dessen Touch komplett. Diesmal anders geloest: das
        # Bild (home_cover_img/home_cover_image) kommt SERVERSEITIG schon
        # exakt in der Groesse des ausgeklappten Zustands (216x160, s.
        # HOME_SIZE in smarttube_cover_resize.py) - kein Skalieren/Zoomen auf
        # dem Geraet noetig, das Bildwidget ist also nie groesser als sein
        # Elternbutton und kann folglich weder darueber hinausragen noch
        # dessen Touch-Bereich stehlen.
        - button:
            id: home_player_btn
            align: TOP_MID
            y: 144
            width: 216
            height: 56
            radius: 12
            border_width: 2
            border_color: 0x1A1F27
            bg_color: 0x1A1F27
            clip_corner: true
            # Ohne das erbt der Knopf den Innenabstand des LVGL-Standardthemas.
            # Das Cover ist exakt so gross wie die Karte und sass dadurch
            # verschoben in der eingerueckten Inhaltsflaeche - rechts und unten
            # abgeschnitten. Den verbleibenden Versatz durch den 2px-Rahmen
            # gleicht home_cover_img mit x/y: -2 aus.
            pad_all: 0
            on_click:
              - lambda: 'id(media_from) = 0;'
              - lvgl.page.show: {id: page_media, animation: MOVE_LEFT, time: 150ms}
            widgets:
              # Reihenfolge ist Zeichenreihenfolge (LVGL): Cover ganz unten,
              # dann Scrim, dann Text, dann der schwebende Kameras-Button
              # obenauf.
              # x/y: -2 hebt den 2px-Rahmen auf, damit das 216x160-Bild genau
              # auf der 216x160-Karte liegt (s. pad_all-Kommentar oben).
              - image: {id: home_cover_img, src: home_cover_image, x: -2, y: -2, width: 216, height: 172, hidden: true}
              - obj:
                  id: home_card_scrim
                  align: BOTTOM_MID
                  # y: 2 / height: 58 = bis in den 2-px-Rahmen der Karte hinein.
                  # Das Cover liegt auch ueber dem Rahmen; das Banner endete am
                  # Innenrand, darunter blitzte ein Streifen Cover hervor.
                  y: 2
                  width: 216
                  height: 58
                  radius: 0
                  bg_color: 0x000000
                  bg_opa: 55%
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  hidden: true
              # long_mode DOT kuerzt nur bei FESTER Hoehe (s. tile_wz_media_sub
              # oben) - ohne die brach ein langer Titel auf 3 Zeilen um und
              # sprengte den Button nach unten in Apps rein. Position wird von
              # apply_home_layout je nach Zustand (kompakt/ausgeklappt) neu
              # gesetzt.
              - label: {id: home_player_lbl, align: CENTER, text: "Player", text_font: a15, text_color: 0xF1F3F5, width: 190, height: 20, long_mode: DOT}
              - label: {id: home_player_artist, align: BOTTOM_MID, y: -10, text: " ", styles: [st_muted], width: 190, height: 18, long_mode: DOT, hidden: true}
              # Kleiner Fortschrittsbalken ganz unten, unter dem Interpreten (Nutzerwunsch
              # 2026-09-22) - nur der Balken, keine Zeit-Zahlen (die stehen auf der grossen
              # Media-Seite). Sichtbarkeit/Wert kommen aus update_media_pos.
              - bar: {id: home_media_bar, align: BOTTOM_MID, y: -3, width: 190, height: 4, min_value: 0, max_value: 1000, value: 0, radius: 2, bg_color: 0x4B5563, border_width: 0, indicator: {bg_color: 0xEF4444, radius: 2}, hidden: true}
              # Kamera-Raster ein-/ausblenden - schwebt als Button AUF der
              # Karte (Nutzerwunsch 2026-09-16: keine eigene Zeile, soll auch
              # bei ausgeklappter Karte erreichbar bleiben), oben rechts,
              # ausreichend gross zum sicheren Treffen. Eigenstaendig
              # klickbar (LVGL behandelt verschachtelte Buttons unabhaengig -
              # ein Treffer hier loest NICHT zusaetzlich den Kartenklick aus).
              - button:
                  id: cam_toggle_btn
                  align: TOP_RIGHT
                  x: -4
                  y: 4
                  width: 34
                  height: 30
                  radius: 8
                  bg_color: 0x0E1116
                  bg_opa: 70%
                  border_width: 0
                  on_click:
                    - lambda: 'id(home_cams_visible) = !id(home_cams_visible);'
                    - script.execute: apply_home_layout
                  widgets: [{label: {id: cam_toggle_lbl, align: CENTER, text: "\U000F07AE", text_font: ico_cctv}}]
        # Helligkeit direkt auf der Startseite: ein Tipp auf die Statuszeile
        # oben rechts klappt ihn ein, nach oben wird es heller. Er schwebt ueber
        # allem und blendet sich nach ein paar Sekunden von selbst wieder aus.
        - slider:
            id: home_bri_sld
            hidden: true
            align: RIGHT_MID
            x: -4
            y: 6
            width: 30
            height: 176
            min_value: 5
            max_value: 100
            value: 100
            main: {pad_all: 3, bg_color: 0x1A1F27}
            indicator:
              bg_color: 0x3B82F6
              focused: {bg_color: 0x60A5FA}
            knob:
              bg_color: 0xF1F3F5
              focused: {bg_color: 0x3B82F6}
            on_value:
              - lambda: 'id(disp_bri) = (int) x;'
              - script.execute: apply_brightness
              - script.execute: hide_bri_overlay
        # Statt zweier Textzeilen ("Aktivität: TV" / "TV getrennt") jetzt
        # Knoepfe, die zugleich anzeigen, welche Aktivitaet laeuft. Der
        # Verbindungszustand steht als Punkt oben neben der Akkuanzeige.
        # Dock: eine durchgehende schwarze Leiste ueber die ganze Displaybreite und
        # buendig mit dem unteren Rand (Nutzerwunsch 2026-09-20) - keine
        # freistehenden Buttons. Die drei Knoepfe sind Segmente ohne Rundung, nur
        # durch 2 px Leistenfarbe getrennt. Displayrand 320, Leiste 276..320.
        - obj:
            id: home_dock
            align: BOTTOM_MID
            # Durchgehende Leiste, unten bueckig mit dem Displayrand (270..320).
            # Oben eine gerade blaue Linie, direkt an den Segmenten (keine Luecke,
            # keine Rundung) - das aktive Segment ist auch blau und geht in sie ueber.
            y: 12
            width: 240
            height: 50
            radius: 0
            bg_color: 0x000000
            bg_opa: COVER
            border_width: 3
            border_side: TOP
            border_color: 0x3B82F6
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center, pad_column: 2}
            widgets:
              - button:
                  id: home_act_1
                  width: 78
                  height: 100%
                  bg_color: 0x1A1F27
                  radius: 0
                  border_width: 0
                  on_click:
                    - lambda: 'id(activity) = 1;'
                    - script.execute: apply_activity
                  widgets: [{label: {align: CENTER, text: "TV", text_font: a13}}]
              - button:
                  id: home_act_0
                  width: 80
                  height: 100%
                  bg_color: 0x3B82F6
                  radius: 0
                  border_width: 0
                  on_click:
                    - lambda: 'id(activity) = 0;'
                    - script.execute: apply_activity
                  widgets: [{label: {align: CENTER, text: "Streamer", text_font: a13}}]
              - button:
                  id: home_act_2
                  width: 78
                  height: 100%
                  bg_color: 0x1A1F27
                  radius: 0
                  border_width: 0
                  on_click:
                    - lambda: 'id(activity) = 2;'
                    - script.execute: apply_activity
                  widgets: [{label: {align: CENTER, text: "Tablet", text_font: a13}}]
        # ---- Dock-Zierde (LCARS-Stil), reine Anzeige, nicht klickbar ----
        # Ausrundungen: zwischen der blauen Linie und dem AKTIVEN Segment, nach
        # aussen zu den Nachbarn hin (Mitte: links und rechts, aussen: nur zur
        # Mitte). Je 10x10 blau, darin eine Kreisscheibe in Segmentfarbe, deren
        # Mittelpunkt in der Ecke abseits der Linie liegt - uebrig bleibt die
        # konkave Rundung. apply_activity blendet die passenden ein.
        - obj:
            id: dock_f_b1_s1
            align: TOP_LEFT
            x: 66
            y: 263
            width: 10
            height: 10
            radius: 0
            bg_color: 0x3B82F6
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
            hidden: true
            widgets:
              - obj: {x: 0, y: 0, width: 20, height: 20, radius: 10, bg_color: 0x1A1F27, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false, clickable: false}
        - obj:
            id: dock_f_b1_s2
            align: TOP_LEFT
            x: 58
            y: 263
            width: 10
            height: 10
            radius: 0
            bg_color: 0x3B82F6
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
            hidden: true
            widgets:
              - obj: {x: -10, y: 0, width: 20, height: 20, radius: 10, bg_color: 0x1A1F27, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false, clickable: false}
        - obj:
            id: dock_f_b2_s2
            align: TOP_LEFT
            x: 148
            y: 263
            width: 10
            height: 10
            radius: 0
            bg_color: 0x3B82F6
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
            hidden: true
            widgets:
              - obj: {x: 0, y: 0, width: 20, height: 20, radius: 10, bg_color: 0x1A1F27, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false, clickable: false}
        - obj:
            id: dock_f_b2_s3
            align: TOP_LEFT
            x: 140
            y: 263
            width: 10
            height: 10
            radius: 0
            bg_color: 0x3B82F6
            bg_opa: COVER
