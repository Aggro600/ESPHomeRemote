  # ---- Countdown "Timer Wohnung" neben der Uhr (Nutzerwunsch 2026-09-17) -----
  # Nur das Icon hier ein-/ausblenden - der eigentliche Countdown-Text laeuft
  # im interval: 1s oben (zeigt dort statt der Uhrzeit), damit er wirklich
  # sekundengenau tickt statt nur bei HA-Updates zu springen.
  - platform: homeassistant
    id: timer_wohnung_state
    entity_id: timer.timer_wohnung
    internal: true
    on_value:
      - lambda: |-
          id(timer_wohnung_active) = (x == "active");
          if (id(timer_wohnung_active)) {
            lv_obj_clear_flag(id(timer_wohnung_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(timer_wohnung_lbl),  LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(timer_wohnung_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(timer_wohnung_lbl),  LV_OBJ_FLAG_HIDDEN);
          }

  # Liefert nur "H:MM:SS" bei Start/Pause/Ende (kein Sekundentakt von HA aus) -
  # setzt hier lediglich die lokale Sekundenbasis, die das interval: 1s dann
  # selbst runterzaehlt.
  - platform: homeassistant
    id: timer_wohnung_remaining_attr
    entity_id: timer.timer_wohnung
    attribute: remaining
    internal: true
    on_value:
      - lambda: |-
          int h = 0, m = 0, s = 0;
          if (sscanf(x.c_str(), "%d:%d:%d", &h, &m, &s) == 3)
            id(timer_wohnung_remaining) = h * 3600 + m * 60 + s;

  # Endzeitpunkt des Timers, z. B. "2026-09-20T01:15:30+00:00" (HA liefert UTC).
  # Daraus rechnet das interval: 1s die Restzeit - stimmt damit auch nach einem
  # Neustart der Remote.
  - platform: homeassistant
    id: timer_wohnung_end_attr
    entity_id: timer.timer_wohnung
    attribute: finishes_at
    internal: true
    on_value:
      - lambda: |-
          id(timer_wohnung_end) = 0;
          int Y, M, D, h, mi, se;
          if (sscanf(x.c_str(), "%d-%d-%dT%d:%d:%d", &Y, &M, &D, &h, &mi, &se) != 6) return;
          // Tage seit 1970-01-01 (Zivilkalender, ohne timegm)
          int y = Y - (M <= 2);
          const int era = (y >= 0 ? y : y - 399) / 400;
          const unsigned yoe = (unsigned) (y - era * 400);
          const unsigned doy = (153 * (M + (M > 2 ? -3 : 9)) + 2) / 5 + D - 1;
          const unsigned doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
          long tage = (long) era * 146097 + (long) doe - 719468;
          long t = tage * 86400L + h * 3600L + mi * 60L + se;
          // Zeitzonen-Versatz am Ende (+HH:MM / -HH:MM), "Z" oder nichts = UTC.
          const size_t tp = x.find('T');
          const size_t op = (tp == std::string::npos) ? std::string::npos : x.find_first_of("+-", tp);
          if (op != std::string::npos) {
            int oh = 0, om = 0;
            if (sscanf(x.c_str() + op + 1, "%d:%d", &oh, &om) >= 1)
              t -= (x[op] == '-' ? -1L : 1L) * (oh * 3600L + om * 60L);
          }
          if (t > 0) id(timer_wohnung_end) = (uint32_t) t;

  # ---- Klingel-Seite: Tuer oeffnet gerade / Automatik aktiv ----
  # Skript haustur_offnen/wohnungstur_offnen laeuft = Tuer wird gerade aufgedrueckt
  # -> Tuer-oeffnen-Knopf blau "Oeffnet ...". Die Gruppen ... _nach_klingeln_ ...
