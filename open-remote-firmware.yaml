        - button:
            id: ble_connect
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            focused: {border_color: 0x3B82F6}
            pressed: {bg_color: 0x2563EB, border_color: 0x60A5FA, outline_width: 0}
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            on_click:
              - lambda: |-
                  char act[24];
                  snprintf(act, sizeof(act), "switch_host:%d", id(sel_slot));
                  id(kb).execute_action(act);
              - script.execute: refresh_ble_slots
            widgets: [{label: {align: CENTER, text: "Verbinden", text_font: a15}}]
        - button:
            id: ble_pair
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            focused: {border_color: 0x3B82F6}
            pressed: {bg_color: 0x2563EB, border_color: 0x60A5FA, outline_width: 0}
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            on_click:
              - lambda: |-
                  // Neu koppeln = alte Bindung loeschen, dann auf den Slot
                  // wechseln. Erst dadurch wirbt er wieder sichtbar, statt
                  // nur den alten Host zu suchen.
                  //
                  // SCHUTZ: Auf einem Platz, der GERADE VERBUNDEN ist, tut der
                  // Knopf nichts mehr. Am 04.09. hat ein zweiter Druck elf
                  // Sekunden nach einer geglueckten Sony-Kopplung diese sofort
                  // wieder geloescht - auf dem Display war ja nicht zu sehen,
                  // dass sie stand. Zum Loesen gibt es "Kopplung loeschen".
                  if (id(sel_slot) == (int) id(kb).active_host_slot() &&
                      id(ble_paired).state) {
                    lv_label_set_text(id(ble_state_lbl),
                                      "Schon verbunden - zum Neukoppeln erst löschen");
                    return;
                  }
                  char act[24];
                  snprintf(act, sizeof(act), "forget_host:%d", id(sel_slot));
                  id(kb).execute_action(act);
                  snprintf(act, sizeof(act), "switch_host:%d", id(sel_slot));
                  id(kb).execute_action(act);
              - script.execute: refresh_ble_slots
            widgets: [{label: {align: CENTER, text: "Neu koppeln", text_font: a15}}]
        - button:
            id: ble_forget
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            focused: {border_color: 0x3B82F6}
            pressed: {bg_color: 0x2563EB, border_color: 0x60A5FA, outline_width: 0}
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            on_click:
              - lambda: |-
                  char act[24];
                  snprintf(act, sizeof(act), "forget_host:%d", id(sel_slot));
                  id(kb).execute_action(act);
              - script.execute: refresh_ble_slots
            widgets: [{label: {align: CENTER, text: "Kopplung löschen", text_font: a15}}]
