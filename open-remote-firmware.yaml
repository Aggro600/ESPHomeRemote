        - button:
            id: app_home_btn
            align: BOTTOM_MID
            y: -48
            width: 216
            height: 44
            # Gleicher Hintergrund wie MENUE - vorher 0x232A35 gegen 0x1A1F27.
            bg_color: 0x1A1F27
            radius: 12
            border_width: 2
            border_color: 0x1A1F27
            focused: {border_color: 0x3B82F6}
            pressed: {bg_color: 0x2563EB, border_color: 0x60A5FA, outline_width: 0}
            on_click:
              - lambda: 'id(apps_from_home) = true;'
              - lvgl.page.show: {id: page_apps, animation: MOVE_LEFT, time: 150ms}
            widgets: [{label: {align: CENTER, text: "Apps", text_font: a15}}]
        - button:
            id: home_menu_btn
            align: TOP_MID
            y: 152
            width: 216
            height: 44
            bg_color: 0x1A1F27
            radius: 12
            border_width: 2
            border_color: 0x1A1F27
            focused: {border_color: 0x3B82F6}
            pressed: {bg_color: 0x2563EB, border_color: 0x60A5FA, outline_width: 0}
            on_click: [{script.execute: open_menu}]
            widgets:
              # Gleiche Groesse wie "Apps" - vorher a18 gegen a15, das fiel auf.
              - label: {align: CENTER, text: "MENÜ", text_font: a15}
        # Helligkeit direkt auf der Startseite: ein Tipp auf die Statuszeile
        # oben rechts klappt ihn ein, nach oben wird es heller. Er schwebt ueber
        # allem und blendet sich nach ein paar Sekunden von selbst wieder aus.
        - slider:
            id: home_bri_sld
            hidden: true
            align: RIGHT_MID
            x: -4
            y: 6
            width: 30
            height: 176
            min_value: 5
            max_value: 100
            value: 100
            main: {pad_all: 3, bg_color: 0x1A1F27}
            indicator:
              bg_color: 0x3B82F6
              focused: {bg_color: 0x60A5FA}
            knob:
              bg_color: 0xF1F3F5
              focused: {bg_color: 0x3B82F6}
            on_value:
              - lambda: 'id(disp_bri) = (int) x;'
              - script.execute: apply_brightness
              - script.execute: hide_bri_overlay

        # Statt zweier Textzeilen ("Aktivität: TV" / "TV getrennt") jetzt
        # Knoepfe, die zugleich anzeigen, welche Aktivitaet laeuft. Der
        # Verbindungszustand steht als Punkt oben neben der Akkuanzeige.
        - obj:
            align: BOTTOM_MID
            y: 0
            width: 216
            height: 34
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center, pad_column: 8}
            widgets:
              - button:
                  id: home_act_1
                  flex_grow: 1
                  height: 30
                  bg_color: 0x1A1F27
                  radius: 8
                  border_width: 0
                  pressed: {bg_color: 0x2563EB, border_color: 0x60A5FA, outline_width: 0}
                  on_click:
                    - lambda: 'id(activity) = 1;'
                    - script.execute: apply_activity
                  widgets: [{label: {align: CENTER, text: "TV", text_font: a13}}]
