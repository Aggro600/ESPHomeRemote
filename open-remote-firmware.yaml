              - script.execute: apply_power
        - label: {id: ps_h_dimp, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - label: {hidden: true, text: !lambda "return lv_label_rueckrufe_leeren();"}   # schneller Start, s. esphomeremote-wlan.h
    # ================================================ 23: ANZEIGE
    # ================================================ 24: BEGRUESSUNG
    # Wird nach jedem Start gezeigt. Nebenbei die Rueckmeldung, dass wirklich
    # eine neue Firmware drauf ist - deshalb steht die Kompilierzeit darunter.
    - id: page_welcome
      styles: [st_screen]
      scrollbar_mode: "off"
      scrollable: false
      on_load:
        - lambda: |-
            id(cur_page) = 24; id(frow) = 0; id(fcol) = 0; ESP_LOGI("boot", "Begruessung angezeigt");
            // Eigener Text aus dem Konfigurator (cfg.begruessung), sonst der Name der Remote
            const char *t = id(tk_cfg).konfig("begruessung") | "";
            lv_label_set_text(id(welcome_lbl), *t ? t : "Hallo");
        # Der Abdunkel-/Ausschalt-Countdown wurde schon beim Booten gestartet (wake_backlight
        # laeuft VOR dieser Seite, mit dem cur_page-Stand von davor) - der galt aber noch fuer
        # die ALTE Seite. Hier einmal sauber NEU starten (nicht stoppen - die Begruessung soll
        # sich ganz normal wie jede andere Seite verhalten und nach der eingestellten Zeit auch
        # ganz normal abdunkeln/ausgehen, nur eben nicht durch den Aufweck-Tastendruck selbst
        # sofort verschwinden - das regeln touch_was_dark/key_was_dark unten.
        - if:
            condition: {lambda: "return id(disp_timeout_s) > 0 && !id(clean_mode);"}
            then:  [{script.execute: backlight_idle_timeout}]
            else:  [{script.stop: backlight_idle_timeout}]
        - script.execute: focus_apply
      widgets:
        - button:
            id: welcome_hit
            align: CENTER
            width: 240
            height: 320
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            # Nur wirken, wenn das Display beim Antippen schon an war (touch_was_dark, gesetzt
            # beim Touch-Runter noch VOR wake_backlight) - der Tipp, mit dem man die Remote
            # gerade erst aufweckt, egal wie lange sie vorher dunkel war, soll die Begruessung
            # nicht im selben Moment schon wieder wegschalten. millis() > 6000 wieder da (s.
            # Kommentar bei nav_back/id(cur_page)==24 oben - deckt den Neustart-Sonderfall ab).
            on_click:
              - if:
                  condition: {lambda: "return !id(touch_was_dark) && millis() > 6000;"}
                  then: [{script.execute: go_home}]
            widgets:
              - label:
                  id: welcome_lbl
                  align: CENTER
                  y: 0
                  width: 216
                  long_mode: WRAP
                  text_align: CENTER
                  text: "Hallo"
                  text_font: a18
                  text_color: 0xF1F3F5
              # Hinweise ganz nach unten, die Begruessung bleibt mittig.
              - label:
                  align: BOTTOM_MID
                  y: -12
                  width: 216
                  text: "Tippen oder Menütaste"
                  text_font: a13
                  text_color: 0x3B82F6
                  text_align: CENTER
        - label: {hidden: true, text: !lambda "return lv_label_rueckrufe_leeren();"}   # schneller Start, s. esphomeremote-wlan.h

    # ================================================ 25: NEUSTART-RUECKFRAGE
    - id: page_restart
      styles: [st_screen]
      scrollbar_mode: "off"
      scrollable: false
      on_load:
        - lambda: |-
            id(cur_page) = 25; id(frow) = 0; id(fcol) = 0;
            // Zuruecksetzen, falls man vorher auf "Ja" war und dann doch abgebrochen hat
            // (z.B. ueber die physische Zurueck-Taste) - sonst fehlten beim naechsten
            // Aufruf dieser Seite die beiden Buttons.
            lv_label_set_text(id(restart_frage_lbl), id(frage_aus)
              ? "Gerät wirklich herunterfahren?\n\nEinschalten: Aus-Taste drücken oder Ladekabel anstecken."
              : "Gerät wirklich neu starten?");
            lv_label_set_text(id(restart_yes_lbl), id(frage_aus) ? "Ja, herunterfahren" : "Ja, neu starten");
            lv_obj_align(id(restart_frage_lbl), LV_ALIGN_TOP_MID, 0, id(frage_aus) ? 30 : 60);
            lv_obj_remove_flag(id(restart_yes), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(restart_no),  LV_OBJ_FLAG_HIDDEN);
        - script.execute: focus_apply
      widgets:
        - label:
            id: restart_frage_lbl
            align: TOP_MID
            y: 60
            width: 216
            text: "Gerät wirklich neu starten?"
            text_font: a15
            text_color: 0xF1F3F5
            text_align: CENTER
        - button:
            id: restart_yes
            align: CENTER
            y: 10
            width: 200
            height: 46
            styles: [st_ctrlbtn]
            on_click:
              - lambda: |-
                  lv_label_set_text(id(restart_frage_lbl), id(frage_aus)
                    ? "Wird heruntergefahren …\n\nEinschalten mit der Aus-Taste."
                    : "Wird neu gestartet …");
                  // Ohne die Knoepfe steht nur noch dieser Text da - mittig statt oben haengend
                  lv_obj_align(id(restart_frage_lbl), LV_ALIGN_CENTER, 0, 0);
                  lv_obj_add_flag(id(restart_yes), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_add_flag(id(restart_no),  LV_OBJ_FLAG_HIDDEN);
                  lv_refr_now(nullptr);   // sonst zeichnet LVGL das nicht mehr, bevor der Neustart die Schleife anhaelt
              - if:
                  condition: {lambda: "return id(frage_aus);"}
                  then: [{script.execute: herunterfahren}]
                  else: [{button.press: btn_restart}]
            widgets: [{label: {id: restart_yes_lbl, align: CENTER, text: "Ja, neu starten", text_font: a15}}]
        - button:
            id: restart_no
            align: CENTER
            y: 70
            width: 200
            height: 46
            styles: [st_ctrlbtn]
            on_click: [{script.execute: nav_back}]
            widgets: [{label: {align: CENTER, text: "Abbrechen", text_font: a15}}]
        - label: {hidden: true, text: !lambda "return lv_label_rueckrufe_leeren();"}   # schneller Start, s. esphomeremote-wlan.h

    # ================================================ 26: SPRACHANTWORT
    # Zeigt, was Home Assistant verstanden hat und was es antwortet. Die
    # Fernbedienung hat keinen Lautsprecher - ohne diese Seite bekaeme man von
    # der Antwort gar nichts mit.
    - id: page_voice
      styles: [st_screen, st_fx_c10]
      scrollbar_mode: "off"
      pad_top: 14
      on_load:
        - lambda: 'id(cur_page) = 26; id(frow) = 0; id(fcol) = 0;'
        - script.execute: focus_apply
      widgets:
        # "Du sagst" und "Antwort" in EINEM scrollbaren Rahmen (Hoch/Runter scrollt, s. dispatch_key).
        - obj:
            id: voice_box
            width: 216
            height: 250
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollbar_mode: AUTO
            layout: {type: flex, flex_flow: column, flex_align_cross: start, pad_row: 6}
            widgets:
              - label: {text: "Du sagst", styles: [st_muted]}
              - label:
                  id: voice_you
                  width: 210
                  text: "..."
                  text_font: a15
                  text_color: 0xF1F3F5
                  long_mode: WRAP
              - label: {text: "Antwort", styles: [st_muted]}
              - label:
                  id: voice_answer
                  width: 210
                  text: ""
                  text_font: a15
                  text_color: 0x3B82F6
                  long_mode: WRAP
        - button:
            id: voice_close
            width: 216
            height: 38
            styles: [st_ctrlbtn]
            on_click: [{script.execute: go_home}]
            widgets: [{label: {align: CENTER, text: "Schließen", text_font: a13}}]
        - label: {hidden: true, text: !lambda "return lv_label_rueckrufe_leeren();"}   # schneller Start, s. esphomeremote-wlan.h

    # ================================================ 27: ENERGIE SPAREN
    - id: page_power
      styles: [st_screen, st_fx_c10]
      scrollbar_mode: "off"
      pad_top: 50
      pad_bottom: 6
      on_load:
        - lambda: 'id(cur_page) = 27; id(frow) = 0; id(fcol) = 0;'
