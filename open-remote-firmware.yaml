          lv_label_set_text(id(h_top_ble), "Fernseher, Streamer und Tablet koppeln und verbinden.");
          lv_label_set_text(id(h_top_srv), "Touch- und Tasten-Test, Reinigung, Debug, Neustart.");
          lv_label_set_text(id(h_bri), "Helligkeit des Displays im Betrieb. Niedriger spart Akku, denn das Display ist meist der größte Verbraucher.");
