    - id: page_display
      styles: [st_screen]
      scrollbar_mode: "off"
      pad_top: 50
      pad_bottom: 6
      layout: {type: flex, flex_flow: column, flex_align_cross: start, pad_row: 5}
      on_load:
        - lambda: 'id(cur_page) = 13; id(frow) = 0; id(fcol) = 0;'
        - script.execute: fix_slider_geometry
        - script.execute: focus_apply
      widgets:
        - obj:
            id: hdr_back_display
            width: 100%
            height: 40
            bg_color: 0x0E1116
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 8}
            widgets:
              - button:
                  id: back_display
                  width: 46
                  height: 30
                  styles: [st_back]
                  focused: {border_color: 0x3B82F6, text_color: 0xF1F3F5}
                  pressed: {bg_color: 0x2563EB, border_color: 0x60A5FA, outline_width: 0}
                  scrolled: {bg_color: 0x1A1F27, border_color: 0x1A1F27, outline_width: 0}
                  on_click: [{script.execute: nav_back}]
                  widgets: [{label: {align: CENTER, text: "<", text_font: a15}}]
              - label: {text: "Display-Timeout", styles: [st_title], flex_grow: 1, pad_bottom: 0, height: 28, long_mode: DOT}
        # Slider mit sechs festen Stufen statt sechs Knoepfen. Zwischenwerte
        # waeren hier nicht sinnvoll, deshalb rastet er auf die Stufen ein und
        # zeigt sie als Klartext an - eine reine Sekundenzahl sagt wenig.
        - obj:
            width: 100%
            height: 26
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center}
            widgets:
              - label: {text: "Display aus nach", styles: [st_muted]}
              - label: {id: to_val_lbl, text: "--", text_font: a15, text_color: 0xF1F3F5}
        - slider:
            id: to_sld
            width: 180
            height: 26
            align: TOP_MID
            # Sekundengenau statt sechs Rasten: 0 heisst "Nie", darueber die
            # Sekunden direkt. Ueber das D-Pad sind es 15er-Schritte, per
            # Finger geht es feiner.
            min_value: 0
            max_value: 300
            value: 30
            main: {pad_all: 3}
            indicator:
              bg_color: 0x3B82F6
              focused: {bg_color: 0x60A5FA}
            knob:
              bg_color: 0xF1F3F5
              focused: {bg_color: 0x3B82F6}
            # Auswahl INNERHALB des Reglers zeigen. Ein Ring aussen herum
            # wurde am Displayrand abgeschnitten und war deshalb nicht zu
            # sehen - und er liess den Regler zugleich zu breit wirken.
            # Jetzt: helle Schiene, blauer Knopf, kraeftigerer Balken.
            focused: {border_width: 0, outline_width: 0, bg_color: 0x3A424E}
            on_value:
              - lambda: |-
                  int v = (int) x;
                  if (v > 0 && v < 5) v = 5;   // darunter ist es unbrauchbar
                  id(disp_timeout_s) = v;
              - script.execute: apply_disp_timeout

