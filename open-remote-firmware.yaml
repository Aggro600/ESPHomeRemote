    - id: page_media
      styles: [st_screen]
      scrollbar_mode: "off"
      scrollable: false
      on_load:
        - lambda: |-
            id(cur_page) = 6; id(frow) = 0; id(fcol) = 1;
            id(cover_sichtbar).execute();   // vorgemerktes Cover dieser Seite (2026-10-20)
            // Markierung nur 10 s nach dem Verlassen behalten (wie im Menue).
            // Sonst blieb sie ueber den Player-Knopf der Startseite beliebig
            // lange erhalten - dieser Weg laeuft nicht durch open_menu, das
            // sonst aufraeumt.
            // "Vergessen" heisst hier: Startposition = Play/Pause (Nutzerwunsch
            // 2026-09-20). Die Position wird beim Seitenwechsel aus fmem
            // gelesen und ueberschrieb sonst das fcol = 1 von oben mit 0, also
            // "<<". 0 = nie besucht / per Timeout oder Menue geleert,
            // 0xFFFFFFFF = per Zurueck verlassen (s. nav_back).
            const uint32_t links = id(media_left_ms);
            if (links == 0 || links == 0xFFFFFFFFu || (id(mem_s) >= 0 && (millis() - links) >= (uint32_t) id(mem_s) * 1000)) {
              // Steht "Fernseher einschalten" als eigene Zeile oben, ist
              // Play/Pause erst in Zeile 1.
              id(fmem_row)[6] = lv_obj_has_flag(id(m_tv_on), LV_OBJ_FLAG_HIDDEN) ? 1 : 2;
              id(fmem_col)[6] = 2;
              id(media_btn_col) = 2;
              id(media_left_ms) = 0;
            }
            // Das Cover soll RANDLOS ueber die ganzen 240x320 liegen. Kinder
            // sitzen in LVGL aber in der INHALTSFLAECHE, und die ist bei jeder
            // Seite um st_screens Innenabstand eingerueckt (12 seitlich, 10
            // oben) - das Bild landete dadurch verschoben und wurde rechts und
            // unten abgeschnitten (nachgemessen: nur 216 statt 240 breit
            // sichtbar). Versatz aus dem Stil BERECHNEN statt fest eintragen,
            // gleiches Vorgehen wie bei der schwebenden Kopfzeile in
            // focus_apply - dann stimmt es auch, wenn sich st_screen aendert.
            lv_obj_t *seite = lv_obj_get_parent(id(media_cover));
            if (seite != nullptr) {
              const int pl = lv_obj_get_style_pad_left(seite, LV_PART_MAIN);
              const int pt = lv_obj_get_style_pad_top(seite, LV_PART_MAIN);
              lv_obj_align(id(media_cover), LV_ALIGN_TOP_LEFT, -pl, -pt);
              // Dasselbe fuer den dunklen Banner hinter Titel/Interpret: er
              // sass sonst um pl/pt eingerueckt (links Luecke bis zum
              // Zurueck-Button, oben ein Streifen Cover). Unterkante bleibt
              // bei 72 (+ pt), nur Links/Oben wandern an den Displayrand.
              lv_obj_align(id(media_scrim_top), LV_ALIGN_TOP_LEFT, -pl, -pt);   // Hoehe: media_layout
              // Untere Leiste genauso: reichte nur bis zum Innenrand (12 px
              // ueber dem Displayende). Oberkante bleibt, sie waechst nach
              // unten bis zum Rand; die Tasten behalten ihre Position.
              const int pb = lv_obj_get_style_pad_bottom(seite, LV_PART_MAIN);
              lv_obj_set_size(id(media_scrim_bottom), 240, 74 + pb);
              lv_obj_align(id(media_scrim_bottom), LV_ALIGN_BOTTOM_MID, 0, pb);
            }
        - lambda: 'tasten::kopf_linie(id(media_hdr), id(back_media));'
        - script.execute: media_layout
        - script.execute: focus_apply
      widgets:
        # Cover als Vollbild-Hintergrund (240x320, s. adb_title oben und
        # esphomeremote_konfig/cover.py) - MUSS das erste Widget sein, damit es
        # hinter allem anderen liegt (LVGL zeichnet in Listenreihenfolge).
        # Start versteckt - erst adb_title zeigt es, sonst haengt ein
        # leeres/kaputtes Bild rum, solange HA noch keine Cover-URL hat.
        - image: {id: media_cover, src: mp_cover_image, x: 0, y: 0, width: 240, height: 320, hidden: true}
        # Dunkles Scrim hinter dem Titel/Interpret-Text, sonst schwer lesbar
        # vor einem hellen/bunten Cover.
        - obj:
            id: media_scrim_top
            x: 0
            y: 0
            width: 240
            height: 72
            radius: 0
            bg_color: 0x000000
            bg_opa: 55%
            border_width: 0
            pad_all: 0
            scrollable: false
        # Kopfzeile wie auf allen Seiten (240x44 ab Displayecke, Zurueck-Knopf bei x=6, y=6) - hier fest eingetragen,
        # weil der Zurueck-Knopf nicht in der letzten Fokuszeile steht und focus_apply die Kopfzeile nicht anfasst.
        - obj:
            id: media_hdr
            align: TOP_LEFT
            x: -12
            y: -10
            width: 240
            height: 40   # wie die Menue-Kopfzeile (2026-10-13), Linie bei y=37
            bg_color: 0x0E1116   # deckend wie ueberall - die Ausrundungen der Kopflinie brauchen die Farbe
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            pad_left: 6
            pad_right: 6
            pad_top: 6
            pad_bottom: 4
            scrollable: false
            styles: [st_fx_r8]
            widgets:
              - button:
                  id: back_media
                  width: 46
                  height: 30
                  styles: [st_back]
                  focused: {border_color: 0xF1F3F5}
                  on_click: [{script.execute: nav_back}]
                  widgets: [{label: {align: CENTER, text: "<", text_font: a15}}]
              # Interpret als normale Ueberschrift wie in allen Menues (2026-10-18, vorher hellblau). Passt er nicht in
              # a18, schaltet media_layout auf a15 - immer einzeilig.
