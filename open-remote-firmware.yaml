            case 19: // Badezimmer
              row(id(bad_sc0), id(bad_sc1), id(bad_sc2));
              row(id(bad_light_btn), nullptr, nullptr);
              row(id(bad_dim_down),  id(bad_dim_up), nullptr);
              row(id(back_room_bad), nullptr, nullptr);
