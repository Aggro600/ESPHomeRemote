  # Music Assistant nimmt einen Lautsprecher ueber media_player.join in die
  # Gruppe auf und ueber media_player.unjoin wieder heraus. Beim Aufnehmen ist
  # das Ziel die Gruppe, beim Entfernen der Lautsprecher selbst - deshalb zwei
  # getrennte Aufrufe statt eines mit Schalter.
  - id: svc_grp_join
    then:
      - homeassistant.service:
          service: media_player.join
          data:
            entity_id: "media_player.multiroom_audio"
            group_members: !lambda "return id(grp_target);"
  - id: svc_grp_unjoin
    then:
      - homeassistant.service:
          service: media_player.unjoin
          data:
            entity_id: !lambda "return id(grp_target);"

  - id: mus_grp_toggle
    parameters: {idx: int}
    then:
      - lambda: |-
          if (idx < 0 || idx >= MUS_GRP_N) return;
          const bool drin = mus_grp_ist_dabei(id(grp_members), idx);
          id(grp_target) = MUS_GRP_ID[idx];
          if (drin) id(svc_grp_unjoin)->execute();
          else      id(svc_grp_join)->execute();
          // Sofort umschalten, damit der Druck spuerbar wirkt. Home Assistant
          // meldet den echten Stand ein bis zwei Sekunden spaeter nach und
          // korrigiert das hier notfalls wieder.
          if (drin) {
            const size_t pos = id(grp_members).find(MUS_GRP_ID[idx]);
            if (pos != std::string::npos)
              id(grp_members).erase(pos, strlen(MUS_GRP_ID[idx]));
          } else {
            id(grp_members) += std::string(" ") + MUS_GRP_ID[idx] + " ";
          }
      - script.execute: mus_grp_refresh

  - id: mus_grp_alle
    parameters: {rein: bool}
    then:
      - lambda: |-
          for (int i = 0; i < MUS_GRP_N; i++) {
            if (mus_grp_ist_dabei(id(grp_members), i) == rein) continue;
            id(grp_target) = MUS_GRP_ID[i];
            if (rein) id(svc_grp_join)->execute();
            else      id(svc_grp_unjoin)->execute();
          }

  - id: mus_grp_refresh
    then:
      - lambda: |-
          lv_obj_t *lbl[MUS_GRP_N] = {
            id(grp_l0), id(grp_l1), id(grp_l2), id(grp_l3),
            id(grp_l4), id(grp_l5), id(grp_l6)};
          int dabei = 0;
          for (int i = 0; i < MUS_GRP_N; i++) {
            const bool drin = mus_grp_ist_dabei(id(grp_members), i);
            if (drin) dabei++;
            lv_label_set_text(lbl[i], drin ? "dabei" : "aus");
            lv_obj_set_style_text_color(lbl[i],
              lv_color_hex(drin ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          }
          char b[32];
          snprintf(b, sizeof(b), "%d von %d", dabei, MUS_GRP_N);
          lv_label_set_text(id(mus_grp_lbl), b);

