        - slider:
            id: disp_bri_sld
            # 204 statt 100 % (216). Der Fokusring liegt AUSSERHALB des
            # Sliders; bei voller Breite lief er rechts aus dem Display und war
            # damit unsichtbar - genau der Grund, warum die Auswahl nicht zu
            # erkennen war.
            width: 180
            height: 26
            align: TOP_MID
            min_value: 5
            max_value: 100
            value: 100
            # Fuellung um 3 px eingerueckt, damit die dunkle Schiene als Rand
            # sichtbar bleibt - sonst geht bei 100 % die Fuellung nahtlos in
            # den Rahmen ueber.
            main: {pad_all: 3}
            indicator:
              bg_color: 0x3B82F6
              focused: {bg_color: 0x60A5FA}
            knob:
              bg_color: 0xF1F3F5
              focused: {bg_color: 0x3B82F6}
            # Der Fokusrahmen lag frueher AUF der Schiene: blau auf blau war
            # bei 100 % nicht mehr zu erkennen. Jetzt liegt er als Ring mit
            # Abstand AUSSERHALB des Sliders.
            # Auswahl INNERHALB des Reglers zeigen. Ein Ring aussen herum
            # wurde am Displayrand abgeschnitten und war deshalb nicht zu
            # sehen - und er liess den Regler zugleich zu breit wirken.
