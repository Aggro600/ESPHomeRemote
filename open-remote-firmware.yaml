              - label: {id: ble_slot2_lbl, text: "-", text_font: a13, text_color: 0x8B94A3, width: 190, long_mode: DOT, height: 16}
        - button:
            id: ble_slot3
            styles: [st_tile2]
            scrolled: {bg_color: 0x1A1F27, border_color: 0x1A1F27, outline_width: 0}
            layout: {type: flex, flex_flow: column, flex_align_cross: start, pad_row: 2}
            on_click:
              - lambda: 'id(sel_slot) = 3;'
              - script.execute: refresh_ble_slots
            widgets:
              - label: {text: "4  Slot 4", text_font: a15, width: 190, long_mode: DOT, height: 18}
              - label: {id: ble_slot3_lbl, text: "-", text_font: a13, text_color: 0x8B94A3, width: 190, long_mode: DOT, height: 16}
        - label: {id: ble_target_lbl, text: "Aktion für: 1", styles: [st_muted], pad_top: 4}
        - button:
            id: ble_connect
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            on_click:
              - lambda: |-
                  char act[24];
                  snprintf(act, sizeof(act), "switch_host:%d", id(sel_slot));
                  id(kb).execute_action(act);
                  // "Aktivitaet" (id(activity), fuer die Startseiten-Knoepfe
                  // Streamer/TV/Tablet) sonst nicht synchron mit dem
                  // tatsaechlich verbundenen BLE-Platz - beim naechsten Boot
                  // ruft apply_activity() dann faelschlich switch_host auf
                  // die alte Aktivitaet auf und reisst die hier gewaehlte
                  // Verbindung wieder weg (Fehler gefunden 2026-09-17: "Tablet
                  // verbindet sich, aber nach Tiefschlaf/Neustart wieder beim
                  // Streamer"). Slot 3 (4. Platz) hat keine eigene Aktivitaet
                  // - dort bleibt id(activity) unveraendert.
                  if (id(sel_slot) <= 2) id(activity) = id(sel_slot);
              - script.execute: refresh_ble_slots
            widgets: [{label: {align: CENTER, text: "Verbinden", text_font: a15}}]
        - button:
            id: ble_pair
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            on_click:
              - lambda: |-
                  // Neu koppeln = alte Bindung loeschen, dann auf den Slot
                  // wechseln. Erst dadurch wirbt er wieder sichtbar, statt
                  // nur den alten Host zu suchen.
                  //
                  // SCHUTZ: Auf einem Platz, der GERADE VERBUNDEN ist, tut der
                  // Knopf nichts mehr. Am 04.09. hat ein zweiter Druck elf
                  // Sekunden nach einer geglueckten Sony-Kopplung diese sofort
                  // wieder geloescht - auf dem Display war ja nicht zu sehen,
                  // dass sie stand. Zum Loesen gibt es "Kopplung loeschen".
                  if (id(sel_slot) == (int) id(kb).active_host_slot() &&
                      id(ble_paired).state) {
                    lv_label_set_text(id(ble_state_lbl),
                                      "Schon verbunden - zum Neukoppeln erst löschen");
                    return;
                  }
                  char act[24];
                  snprintf(act, sizeof(act), "forget_host:%d", id(sel_slot));
                  id(kb).execute_action(act);
                  snprintf(act, sizeof(act), "switch_host:%d", id(sel_slot));
                  id(kb).execute_action(act);
                  // s. Kommentar bei ble_connect - sonst weicht id(activity)
                  // vom tatsaechlich verbundenen Platz ab.
                  if (id(sel_slot) <= 2) id(activity) = id(sel_slot);
              - script.execute: refresh_ble_slots
            widgets: [{label: {align: CENTER, text: "Neu koppeln", text_font: a15}}]
        - button:
            id: ble_forget
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            on_click:
              - lambda: |-
                  char act[24];
                  snprintf(act, sizeof(act), "forget_host:%d", id(sel_slot));
                  id(kb).execute_action(act);
              - script.execute: refresh_ble_slots
            widgets: [{label: {align: CENTER, text: "Kopplung löschen", text_font: a15}}]
    - id: page_media
      styles: [st_screen]
      scrollbar_mode: "off"
      scrollable: false
      on_load:
        - lambda: |-
            id(cur_page) = 6; id(frow) = 0; id(fcol) = 1;
            // Markierung nur 10 s nach dem Verlassen behalten (wie im Menue).
            // Sonst blieb sie ueber den Player-Knopf der Startseite beliebig
            // lange erhalten - dieser Weg laeuft nicht durch open_menu, das
            // sonst aufraeumt.
            // "Vergessen" heisst hier: Startposition = Play/Pause (Nutzerwunsch
            // 2026-09-20). Die Position wird beim Seitenwechsel aus fmem
            // gelesen und ueberschrieb sonst das fcol = 1 von oben mit 0, also
            // "<<". 0 = nie besucht / per Timeout oder Menue geleert,
            // 0xFFFFFFFF = per Zurueck verlassen (s. nav_back).
            const uint32_t links = id(media_left_ms);
            if (links == 0 || links == 0xFFFFFFFFu || (millis() - links) >= (uint32_t) id(mem_s) * 1000) {
              // Steht "Fernseher einschalten" als eigene Zeile oben, ist
              // Play/Pause erst in Zeile 1.
              id(fmem_row)[6] = lv_obj_has_flag(id(m_tv_on), LV_OBJ_FLAG_HIDDEN) ? 1 : 2;
              id(fmem_col)[6] = 2;
              id(media_btn_col) = 2;
              id(media_left_ms) = 0;
            }
            // Das Cover soll RANDLOS ueber die ganzen 240x320 liegen. Kinder
            // sitzen in LVGL aber in der INHALTSFLAECHE, und die ist bei jeder
            // Seite um st_screens Innenabstand eingerueckt (12 seitlich, 10
            // oben) - das Bild landete dadurch verschoben und wurde rechts und
            // unten abgeschnitten (nachgemessen: nur 216 statt 240 breit
            // sichtbar). Versatz aus dem Stil BERECHNEN statt fest eintragen,
            // gleiches Vorgehen wie bei der schwebenden Kopfzeile in
            // focus_apply - dann stimmt es auch, wenn sich st_screen aendert.
            lv_obj_t *seite = lv_obj_get_parent(id(media_cover));
            if (seite != nullptr) {
              const int pl = lv_obj_get_style_pad_left(seite, LV_PART_MAIN);
              const int pt = lv_obj_get_style_pad_top(seite, LV_PART_MAIN);
              lv_obj_align(id(media_cover), LV_ALIGN_TOP_LEFT, -pl, -pt);
              // Dasselbe fuer den dunklen Banner hinter Titel/Interpret: er
              // sass sonst um pl/pt eingerueckt (links Luecke bis zum
              // Zurueck-Button, oben ein Streifen Cover). Unterkante bleibt
              // bei 72 (+ pt), nur Links/Oben wandern an den Displayrand.
              lv_obj_align(id(media_scrim_top), LV_ALIGN_TOP_LEFT, -pl, -pt);   // Hoehe: media_layout
              // Untere Leiste genauso: reichte nur bis zum Innenrand (12 px
              // ueber dem Displayende). Oberkante bleibt, sie waechst nach
              // unten bis zum Rand; die Tasten behalten ihre Position.
              const int pb = lv_obj_get_style_pad_bottom(seite, LV_PART_MAIN);
              lv_obj_set_size(id(media_scrim_bottom), 240, 74 + pb);
              lv_obj_align(id(media_scrim_bottom), LV_ALIGN_BOTTOM_MID, 0, pb);
            }
        - script.execute: media_layout
        - script.execute: focus_apply
      widgets:
        # Cover als Vollbild-Hintergrund (240x320, s. adb_title oben und
        # smarttube_cover_resize.py) - MUSS das erste Widget sein, damit es
        # hinter allem anderen liegt (LVGL zeichnet in Listenreihenfolge).
        # Start versteckt - erst adb_title zeigt es, sonst haengt ein
        # leeres/kaputtes Bild rum, solange HA noch keine Cover-URL hat.
        - image: {id: media_cover, src: mp_cover_image, x: 0, y: 0, width: 240, height: 320, hidden: true}
        # Dunkles Scrim hinter dem Titel/Interpret-Text, sonst schwer lesbar
        # vor einem hellen/bunten Cover.
        - obj:
            id: media_scrim_top
            x: 0
            y: 0
            width: 240
            height: 72
            radius: 0
            bg_color: 0x000000
            bg_opa: 55%
            border_width: 0
            pad_all: 0
            scrollable: false
        # Kopfzeile im Menue-Stil: Zurueck-Button + Wiedergabestatus GROSS und weiss.
        # Darunter, ohne Zurueck-Button also volle Breite: Titel (kleiner, weiss,
        # bis 2 Zeilen) und Interpret (grau). Eine Spalte, die sich dem Inhalt
        # anpasst - script media_layout richtet das schwarze Banner danach aus.
        - obj:
            align: TOP_MID
            y: 4
            width: 228
            height: 30
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 6}
            widgets:
              - button:
                  id: back_media
                  width: 46
                  height: 30
                  styles: [st_back]
                  focused: {border_color: 0x3B82F6, text_color: 0xF1F3F5}
                  scrolled: {bg_color: 0x1A1F27, border_color: 0x1A1F27, outline_width: 0}
                  on_click: [{script.execute: nav_back}]
                  widgets: [{label: {align: CENTER, text: "<", text_font: a15}}]
              - label: {id: media_artist, flex_grow: 1, text: "Media Player", styles: [st_title], pad_bottom: 0, height: 28, long_mode: DOT}
        - obj:
            id: media_head_col
            align: TOP_MID
            y: 38
            width: 228
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_top: 0
            pad_bottom: 0
            pad_left: 4
            pad_right: 4
            scrollable: false
            clickable: false
            layout: {type: flex, flex_flow: column, flex_align_main: start, flex_align_cross: start, pad_row: 3}
            widgets:
              - label: {id: media_title, width: 100%, text: "Nichts läuft", text_font: a15, text_color: 0x8B94A3, long_mode: DOT}
              # Zeitleiste wie bei YouTube: roter Balken (Anteil gespielt), darunter links die
              # Position, rechts die Restzeit. Ohne bekannte Dauer (z. B. Netflix) nur die Position.
              - bar: {id: media_bar, width: 100%, height: 6, min_value: 0, max_value: 1000, value: 0, radius: 3, bg_color: 0x4B5563, border_width: 0, indicator: {bg_color: 0xEF4444, radius: 3}, hidden: true}
              - obj:
                  id: media_time_row
                  width: 100%
                  height: 16
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  clickable: false
                  hidden: true
                  layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center}
                  widgets:
                    - label: {id: media_pos_lbl, text: "0:00", text_font: a13, text_color: 0xF1F3F5}
                    - label: {id: media_rest_lbl, text: " ", text_font: a13, text_color: 0x8B94A3, hidden: true}
              # Fernseher-an-Button: erscheint nur, solange der Fernseher aus ist
              # (tv_state blendet um) und steht dann unter Titel/Interpret.
              - button:
                  id: m_tv_on
                  width: 140
                  height: 24
                  hidden: true
                  styles: [st_ctrlbtn]
                  scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
                  on_click:
                    - homeassistant.service:
                        service: media_player.turn_on
                        data: {entity_id: "media_player.tv_wz"}
                  widgets: [{label: {align: CENTER, text: "Fernseher einschalten", text_font: a13}}]
        # Bedienleiste ganz am unteren Bildschirmrand, EINE Zeile (Stand
        # 2026-09-16, Nutzerwunsch: Lauter/Leiser sollen weniger vom Cover
        # verdecken) - Lauter/Leiser als kleine Buttons aussen neben
        # Zurueck/Play/Vor, statt einer eigenen Reihe darueber.
        - obj:
            id: media_scrim_bottom
            align: BOTTOM_MID
            y: 0
            width: 240
            height: 74
            radius: 0
            bg_color: 0x000000
            bg_opa: 55%
            border_width: 0
            pad_all: 0
            scrollable: false
        - button:
            id: m_voldown
            align: BOTTOM_MID
            x: -95
            y: -16
            width: 34
            height: 38
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            on_click: [{script.execute: svc_voldown}]
            widgets: [{label: {align: CENTER, text: "-", text_font: a18}}]
        - button:
            id: m_prev
            align: BOTTOM_MID
            x: -52
            y: -8
            width: 46
            height: 54
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            on_click: [{script.execute: svc_prev}]
            widgets: [{label: {align: CENTER, text: "<<", text_font: a18}}]
        - button:
            id: m_playpause
            align: BOTTOM_MID
            x: 0
            y: -6
            width: 56
            height: 58
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
