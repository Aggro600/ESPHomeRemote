# ALTER NAME - bitte auf esphomeremote-firmware.yaml umstellen (Konfigurator > Firmware & Geraete > Umstellen).
# Diese Kopie faellt in einem spaeteren Release weg.
# =============================================================================
#  ESPHomeRemote - Firmware (wird als Paket von esphomeremote.yaml geladen)
# =============================================================================
# Nicht hier anpassen: Namen, Entitaeten und die HA-Adresse stehen als substitutions in
# esphomeremote.yaml, Passwoerter in secrets.yaml. Diese Datei wird automatisch aus der
# Entwickler-Fassung erzeugt (tools/veroeffentlichen.py).
# =============================================================================
# GENERIERT aus templates/remote.yaml durch tools/remotes.py - NICHT von Hand bearbeiten (Aenderungen in der Vorlage machen).
# VORLAGE fuer ALLE Fernbedienungen (seit 2026-10-16) - nur diese Datei von Hand pflegen.
# tools/remotes.py erzeugt daraus remote-wz-<name>.yaml (Platzhalter remotename/Remotename/REMOTENAME,
# nur in Code-Zeilen). Kommentare unten stammen teils aus der Zeit, als die erste Remote Datei die Vorlage war.
# =============================================================================
#  ESPHomeRemote - Firmware fuer die OMOTE / Open Remote Rev6 (ESP32-S3)
# =============================================================================
# Startseite: Uhr und Statusleiste, Wiedergabe-Karte ("Jetzt laeuft"), Menue/Apps, Aktivitaetsleiste.
# Tasten, Menue, Startseite und Popups kommen aus dem Konfigurator in Home Assistant
# (custom_components/esphomeremote_konfig, Seitenleiste "Fernbedienung"): die Remote laedt die
# Belegung per HTTP (tasten_konfig) und baut das Menue zur Laufzeit (components/menue).
# Eingebaute Seiten: Media-Player, Kamerabild/Live-Bild, Tastatur und die Einstellungen (Bildschirm,
# Anzeige, Energie & Wecken, Sprache, Bluetooth, Akku, Wartung & Tests, SD-Karte).
#
# WICHTIG in HA: dem Geraet die Ausfuehrung von HA-Aktionen erlauben
#   (Einstellungen -> Geraete -> ESPHome -> dieses Geraet -> Zahnrad ->
#    "Diesem Geraet erlauben, Home Assistant Aktionen auszufuehren").
# =============================================================================

substitutions:
  device_name:    "esphomeremote"
  friendly_name:  "ESPHomeRemote"
  ha_name:        "esphomeremote"        # = device_name mit _ statt - (Entity-IDs in HA)
  # ---- Tastenzeiten (ms) - gelten fuer den Tasten-Konfigurator (tasten_konfig) und den Tasten-Test ----
  #   key_debounce_ms  Software-Entprellung des Treibers. 0 = aus: der Treiber liest oft mehrere Ereignisse auf
  #                    einmal aus dem Chip und verwarf so das Loslassen eines schnellen Doppeldrucks. Den Rest
  #                    entprellt der Tastenchip (TCA8418) selbst.
  #   key_long_ms      So lange gehalten = LANGER Druck (feuert schon waehrend des Haltens).
  #   key_dbl_ms       DOPPELDRUCK: hoechstens so viel Zeit zwischen Loslassen des ersten und Druecken des zweiten.
  key_debounce_ms: "0"
  key_long_ms:     "400"
  key_dbl_ms:      "160"
  # Bluetooth-Tastatur: "true" = volle Tastatur (Ziffern und Buchstaben, Seite Tastatur), "digits" = nur
  # Ziffern/Enter/Backspace/Leer, "false" = keine. Die Geraete merken sich die Beschreibung pro Kopplung - nach einer
  # Aenderung neu koppeln. Ziffern oder volle Tastatur je Platz (Einstellungen > Bluetooth > Maus & Tastatur je Geraet, voll_slots).
  kb_tasten:       "true"
  # HA-Adresse fuer Bilder (Cover, Kamera) und die Konfiguration: LAN-IP statt homeassistant.local
  # (mDNS-Aufloesung vom ESP32 aus war nicht zuverlaessig).
  ha_host:        "homeassistant.local:8123"
  ha_adresse:     "homeassistant.local:8123"   # dasselbe fuer den Bluetooth-Tunnel (dort ist ha_host der Tunnel selbst)
  # Nur der Startwert: Home Assistant kuendigt seine Adresse an (Attribut "basis" von
  # sensor.esphomeremote_konfig_<remote>), die Remote uebernimmt sie zur Laufzeit.
  # true in der Bluetooth-Schicht (remote-halink.yaml): dort laeuft HTTP ueber den Tunnel, der die Adresse bekommt.
  ha_ueber_tunnel: "false"
  # Entitaeten in Home Assistant (Media Player, Fernseher, Lautsprecher, Streamer, Timer) waehlt man im Konfigurator
  # (Seite "Verknuepfungen", 2026-10-19). Gelesen wird ueber die Spiegel der Integration
  # (sensor.esphomeremote_spiegel_<remote>_<rolle>, custom_components/esphomeremote_konfig/spiegel.py), Aktionen gehen
  # an die gewaehlte Entitaet (id(tk_cfg).ent("tv") ...).

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:   # Version: setzt tools/release.py, der Konfigurator vergleicht sie mit der Integration (Update-Hinweis)
    name: aggro600.esphomeremote
    version: "2026.10.28.4"
  # Bringt esp_pm.h fuer die Prozessor-Drosselung mit.
  includes:
    - esphomeremote-logpuffer.h   # Protokoll-Puffer (auch fuers Protokoll ueber das Dock), s. logger.on_message
    - esphomeremote-pm.h
    - esphomeremote-strom.h
    - esphomeremote-eingabe.h
    - esphomeremote-einstellungen.h   # Einstellungen fuers Konfigurator-Menue (generiert, 2026-10-04)
    - esphomeremote-tasten.h   # Tasten-Konfigurator (2026-10-03)
    - esphomeremote-wlan.h
    - esphomeremote-sd-bilder.h
    - esphomeremote-stufen.h
    - esphomeremote-akku.h
    - esphomeremote-rmt.h   # IR-Kanaele nur bei Bedarf (Leichtschlaf, 2026-10-07)
    - esphomeremote-schlaf.h   # Bedingungen fuer den Tiefschlaf
    - esphomeremote-einst-sync.h   # Einstellungen mit dem Konfigurator abgleichen (2026-10-16)
    - esphomeremote-dock.h   # Dock-Anzeige / Smart Display (2026-10-17)
    - esphomeremote-maus.h   # Touchpad (2026-10-17)
    - esphomeremote-gesten.h   # Bewegungsgesten (2026-10-17)
    - esphomeremote-extras.h   # Einstellungsseite Smart Display + Bluetooth "Maus & Tastatur" (2026-10-17)
    - esphomeremote-gestenseite.h   # Seite Gesten: Liste, Belegung, Anlernen (2026-10-17)
    - esphomeremote-musik.h   # Musik-Anzeige: Spektrum ueber das Mikrofon (2026-10-18)
  on_boot:
    # Prioritaet 1100: laeuft VOR dem I2C-Bus (setup_priority BUS = 1000).
    # Nach einem Deep-Sleep-Wake zuerst die Holds loesen UND die +VSW-Rail
    # (GPIO38 -> Q4) wieder einschalten - sonst scannt der I2C-Bus (Pull-ups
    # R11/R12 haengen an +VSW) ins Leere ("Recovery failed, SCL held low"),
    # bevor das Display-Component die Rail viel spaeter hochfaehrt.
    # Auf einem Kaltstart schadet das nicht (Rail kommt eh gleich).
    - priority: 1100
      then:
        - lambda: |-
            gpio_deep_sleep_hold_dis();
            const gpio_num_t held[] = {
              GPIO_NUM_38, GPIO_NUM_9, GPIO_NUM_16, GPIO_NUM_6, GPIO_NUM_5, GPIO_NUM_46,
              GPIO_NUM_39, GPIO_NUM_40, GPIO_NUM_41, GPIO_NUM_42,
              GPIO_NUM_48, GPIO_NUM_47, GPIO_NUM_21, GPIO_NUM_14,
              GPIO_NUM_13, GPIO_NUM_12, GPIO_NUM_11, GPIO_NUM_10 };
            // Display-Beleuchtung (GPIO9, invertiert: HIGH = aus) VOR dem Freigeben vollstaendig als Ausgang auf aus
            // einrichten (2026-10-22): der Pin kommt per RTC-Haltung durch den Schlaf (esphomeremote-pm.h). Wurde er erst nach
            // dem Loesen eingestellt, schwebte er kurz - Q3 leitete halb, die Beleuchtung glomm schwach, bis ledc (Stufe 800)
            // den Pin uebernahm (Test 2026-10-22: Schimmern verschob sich mit einer Pause hier). Waehrend der Haltung
            // greifen die Einstellungen erst beim Loesen - es gibt also keine Luecke.
            gpio_set_level(GPIO_NUM_9, 1);
            {
              gpio_config_t bl = {};
              bl.pin_bit_mask = 1ULL << GPIO_NUM_9;
              bl.mode = GPIO_MODE_OUTPUT;
              bl.pull_up_en = GPIO_PULLUP_ENABLE;
              bl.pull_down_en = GPIO_PULLDOWN_DISABLE;
              gpio_config(&bl);
            }
            gpio_set_level(GPIO_NUM_9, 1);
            for (auto p : held) gpio_hold_dis(p);
            rtc_gpio_hold_dis(GPIO_NUM_9);
            gpio_set_level(GPIO_NUM_9, 1);
            // Weck-Taste frueh uebers Dock (2026-10-23): bei Tasten-Wecken das WLAN erst NACH dem Versand starten (on_boot
            // 247). Sonst sendet die Remote auf dem Kanal, auf dem sie sich gerade verbindet (FRITZ!Box) - das Dock am
            // Repeater hoert dort nicht, und uebers Heimnetz ging es erst nach ~4 s. So funkt dock_direkt selbst auf dem
            // Kanal des Docks.
            // Auch beim Wecken durch Bewegung (Hochnehmen, GPIO2): meist folgt gleich ein Tastendruck.
            if (esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_EXT1 && (esp_sleep_get_ext1_wakeup_status() & ((1ULL << 8) | (1ULL << 2)))) {
              wifi::global_wifi_component->set_enable_on_boot(false);
              id(wlan_nach_weck) = true;
            }
            // ext1-Weckpins zuruecksetzen (im Schlaf als RTC-IO gehalten).
            rtc_gpio_hold_dis(GPIO_NUM_1);
            rtc_gpio_deinit(GPIO_NUM_1);
            rtc_gpio_deinit(GPIO_NUM_2);
            // +VSW an: GPIO38 LOW -> Q4 leitet -> Panel/Touch/I2C-Pullups versorgt.
            gpio_set_direction(GPIO_NUM_38, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_38, 0);
            // 300 ms: der Touch-Controller (FT6236, an derselben Rail wie das Panel) braucht ab dem Einschalten ~300 ms
            // fuer eine stabile Nullreferenz - sonst Geisterberuehrungen nach dem Aufwachen (gemessen von OpenRemote,
            // LORDSn1per/OpenRemote-Firmware, PHANTOM_TOUCH_FINDINGS.md).
            delay(300);   // Panel-Regler + FT6236 einschwingen lassen
    # Prioritaet 950: I2C-Bus (1000) laeuft schon, sonst noch nichts. War die Remote
    # heruntergefahren, startet sie nur bei Aus-Taste (Code 102) oder Ladekabel - jede andere
    # Taste schickt sie sofort wieder schlafen (Nutzerwunsch 2026-09-28, s. esphomeremote-pm.h).
    - priority: 950
      then:
        - lambda: |-
            // Tiefentladeschutz: war der Akku leer, nur mit Ladekabel oder erholter Zelle starten.
            if (g_akku_leer == AKKU_LEER_MAGIC) {
              const bool kabel = gpio_get_level(GPIO_NUM_1) == 0;
              float v = 0;
              i2c::I2CDevice fg;
              fg.set_i2c_bus(id(hauptbus));
              fg.set_i2c_address(0x36);
              uint8_t d[2];
              if (fg.read_register(0x02, d, 2) == i2c::ERROR_OK) v = (((uint16_t) d[0] << 8) | d[1]) * 78.125e-6f;
              if (!kabel && v > 0.5f && v < AKKU_WIEDER_V) {
                id(sicherer_start)->clean_rtc();
                aus_wieder_schlafen();   // kehrt nicht zurueck
              }
              g_akku_leer = 0;
              ESP_LOGI("akku", "Start nach Tiefentladeschutz (%.2f V, Kabel %s)", v, kabel ? "ja" : "nein");
            }
            if (g_ausgeschaltet != AUSGESCHALTET_MAGIC) return;
            const auto c = esp_sleep_get_wakeup_cause();
            bool starten = true;
            if (c == ESP_SLEEP_WAKEUP_EXT1) {
              const uint64_t st = esp_sleep_get_ext1_wakeup_status();
              if (!(st & (1ULL << 1))) {   // nicht das Ladekabel -> Tastenpuffer ansehen
                starten = false;
                i2c::I2CDevice dev;
                dev.set_i2c_bus(id(hauptbus));
                dev.set_i2c_address(0x34);
                uint8_t n = 0, e = 0, d = 0;
                dev.read_register(0x03, &n, 1);
                n &= 0x0F;
                for (uint8_t i = 0; i < n; i++) {
                  dev.read_register(0x04, &e, 1);
                  if (e == (0x80 | 102)) starten = true;   // Aus-Taste gedrueckt
                }
                // INT-Leitung freigeben (sonst weckt sie sofort wieder)
                dev.read_register(0x11, &d, 1);
                dev.read_register(0x12, &d, 1);
                dev.read_register(0x13, &d, 1);
                const uint8_t clr = 0x1F;
                dev.write_register(0x02, &clr, 1);
              }
            } else if (c == ESP_SLEEP_WAKEUP_TIMER || c == ESP_SLEEP_WAKEUP_GPIO || c == ESP_SLEEP_WAKEUP_EXT0) {
              starten = false;
            }
            if (!starten) {
              // Dieser Kurz-Start hat den Safe-Mode-Zaehler schon erhoeht (sofort im Flash) -
              // zuruecksetzen, sonst kaeme nach 10 Tastendruecken im Aus-Zustand der
              // abgesicherte Modus. Ein normaler Tiefschlaf macht das per on_safe_shutdown.
              id(sicherer_start)->clean_rtc();
              global_preferences->sync();
              aus_wieder_schlafen();   // kehrt nicht zurueck
            }
            g_ausgeschaltet = 0;
            ESP_LOGI("aus", "Eingeschaltet (war heruntergefahren)");
    - priority: 900
      then:
        # Weckgrund festhalten, bevor irgendetwas anderes laeuft.
        - lambda: |-
            akkustat::aufgewacht();   // Akku-Statistik: Tiefschlaf-Dauer aufsummieren
            const auto c = esp_sleep_get_wakeup_cause();
            {   // Weckprotokoll: genauer Weckgrund (welcher Pin)
              char wb[64];
              if (c == ESP_SLEEP_WAKEUP_EXT1) {
                const uint64_t st = esp_sleep_get_ext1_wakeup_status();
                snprintf(wb, sizeof(wb), "Weckgrund Pin:%s%s%s (0x%llx)", (st & (1ULL << 1)) ? " Ladekabel" : "",
                         (st & (1ULL << 2)) ? " Bewegung" : "", (st & (1ULL << 8)) ? " Taste" : "", (unsigned long long) st);
              } else snprintf(wb, sizeof(wb), "Weckgrund %d", (int) c);
              if (c != ESP_SLEEP_WAKEUP_UNDEFINED) weck_log(wb);
              else { snprintf(wb, sizeof(wb), "Start (Grund %d)", (int) esp_reset_reason()); weck_log(wb); }   // 2026-10-16
            }
            if (c == ESP_SLEEP_WAKEUP_EXT1) {
              const uint64_t st = esp_sleep_get_ext1_wakeup_status();
              id(weck_pins) = (uint32_t) st;   // fuer die Dunkel-Entscheidung in on_boot 100 (dort ist der Status nicht mehr sicher)
              ESP_LOGI("schlaf", "Wake ext1 status=0x%llx -> %s",
                       (unsigned long long) st,
                       (st & (1ULL << 1)) ? "Ladekabel (GPIO1)" :
                       (st & (1ULL << 2)) ? "Bewegung/Klopfen (GPIO2)" :
                       (st & (1ULL << 8)) ? "Taste (GPIO8)"     : "?");
            } else {
              ESP_LOGI("schlaf", "Wake cause=%d (Timer=%d)", (int) c, (int) ESP_SLEEP_WAKEUP_TIMER);
            }
            // Aufwachen aus dem Tiefschlaf (Timer oder Weckpin) ist KEIN echter
            // Boot -> keine 2-min-Schonfrist, sonst kaeme der Chip nie zum
            // Schlafen. Nur ein Kaltstart / Reset / OTA-Reboot behaelt sie.
            const bool deep_wake = (c == ESP_SLEEP_WAKEUP_TIMER || c == ESP_SLEEP_WAKEUP_GPIO ||
                                    c == ESP_SLEEP_WAKEUP_EXT0  || c == ESP_SLEEP_WAKEUP_EXT1);
            if (deep_wake) id(boot_grace) = false;
            // Aus RTC-Speicher wiederherstellen, ob wir im Tiefschlaf-Modus sind.
            // Der restore_value-Global reicht nicht - er wird evtl. nicht
            // rechtzeitig ins Flash geschrieben, bevor deep_sleep.enter laeuft.
            if (deep_wake && g_deep_active == 0x5EEEu) id(ps_deep) = true;
            if (!deep_wake) g_deep_active = 0;  // echter Boot: Modus geloescht
    # Display-Beleuchtung frueh aus (2026-10-21). (Der fruehe Bluetooth-Start vom 2026-10-20 ist zurueckgenommen: er liess
    # die Remote beim Aufwachen abstuerzen und Kopplungen verlorengehen - die Tastatur startet wieder bei -200.)
    - priority: 795
      then:
        - lambda: |-
            // Display-Beleuchtung sofort aus (2026-10-21): der PWM-Ausgang (Stufe 800) startet "an", die Licht-Komponente
            // schreibt ihren Zustand erst nach dem kompletten Start (~3,7 s) - bis dahin leuchtete das noch weisse Panel,
            // auch wenn die Remote dunkel aufwachen sollte. An macht sie wake_backlight.
            id(backlight_pwm).set_level(0.0f);
            // Bluetooth-Optionen VOR dem fruehen Start der Tastatur (Stufe 790, s. espidf_ble_keyboard: start_prioritaet)
            if (!id(kb_ziffern)) { id(voll_slots) |= 0x0F; id(kb_ziffern) = true; }   // alter Schalter "Buchstaben"
            id(kb).set_kb_digits(true);
            if (id(kb).set_slot_flags(id(maus_slots), id(voll_slots))) {
              ESP_LOGW("maus", "Maus-Merkmale geaendert - Neustart");
              id(neustart_gleich)->execute();
            }
            id(kb).set_parallel(id(ble_parallel));
            // Funkkonzept "Dock, WLAN als Ausweg" (2026-10-25): ha_link_modus 3 = kein Bluetooth zu HA - der Link wird
            // gar nicht erst beworben; HA laeuft ueber das Dock (ESP-NOW) oder bei Bedarf ueber das eigene WLAN
            id(kb).set_link_gesperrt(id(ha_link_modus) == 3);
    # Weck-Taste schon waehrend des Starts senden (2026-10-23, Einstellung weck_dock): direkt nach dock_direkt (249),
    # vor Display (245) und LVGL - ~1 s nach dem Aufwachen statt ~3,7 s. Nur Tasten, die lediglich "kurz" mit
    # Bluetooth/Infrarot/433 MHz ueber ein Dock belegt sind (tasten_konfig::weck_frueh); alles andere wie bisher.
    - priority: 248
      then:
        - script.execute: weck_frueh_pruefen
    # Noch einmal nach Display/Touch und vor dem Ende des Starts: Taste erst nach dem Hochnehmen gedrueckt (2026-10-23)
    - priority: 244.4
      then:
        - script.execute: weck_frueh_pruefen
    - priority: 101
      then:
        - script.execute: weck_frueh_pruefen
    # WLAN nach dem fruehen Versand der Weck-Taste starten (s. on_boot 1100)
    # Bis dahin funkt dock_direkt auf dem Kanal des Docks (Tasten, Stand, Werte sofort); 4 s nach dem Start.
    - priority: -150
      then:
        - delay: 4s
        - lambda: |-
            if (!id(wlan_nach_weck)) return;
            id(wlan_nach_weck) = false;
            wifi::global_wifi_component->set_enable_on_boot(true);
            // "Nur Bluetooth": WLAN nur bei Bedarf (Wartungsfenster/OTA/Notanker), sonst ging es hier kurz an und der
            // Tunnel gleich wieder aus - Strom und ein Kanalwechsel mitten im Funk zum Dock (2026-10-25)
            if (wlan_zugriff::g_nur_ble && (int32_t) (millis() - id(wartung_bis)) >= 0) {
              ESP_LOGI("wlan", "Nach dem Aufwachen: WLAN bleibt aus (Nur Bluetooth)");
              return;
            }
            wifi::global_wifi_component->enable();
    - priority: 246
      then:
        # Dunkel aufwachen? VOR dem Display-Start (245) entscheiden (2026-10-21): Tastenchip und Tasten-Konfiguration (DATA)
        # sind schon da. Das Panel startet dann gar nicht erst (set_dunkel_starten) - vorher schimmerte es beim Einrichten
        # ~1 s weiss, und apply_brightness (on_boot 100) schaltete die Beleuchtung ein.
        # Faelle: Weck-Taste ohne Display ("Nur die Menuetaste", Taste wird gesendet) oder Bewegung bei "Aufwecken bei: Aus".
        - lambda: |-
            bool dunkel = false;
            const uint8_t wk = id(keypad).weck_taste();
            if (wk != 0) {
              dunkel = !id(keys_wake_all) && id(weck_tasten) == 2 && !tasten::weckt(wk);
            } else if (id(weck_pins) != 0) {
              // Klopfen laeuft ueber denselben Pin und ist nicht zu unterscheiden - mit "Doppelt klopfen weckt" immer hell
              const uint32_t st = id(weck_pins);
              dunkel = (st & (1u << 2)) && !(st & ((1u << 8) | (1u << 1))) && id(motion_mode) == 0 && !id(klopf_wake);
            }
            id(dunkel_start) = dunkel;
            if (dunkel) {
              id(disp_off) = true;
              id(panel_schlaeft) = true;   // wake_backlight weckt das Panel dann mit exit_sleep()
              id(main_display).set_dunkel_starten(true);
            }
    - priority: 244.5
      then:
        - lambda: 'delay(300);'
    # WLAN-Schnellstart aus: feste IP vor dem WLAN-Start (Prioritaet 250) entfernen -> DHCP.
    # Boot-Zeitplan (Messung 2026-09-30): millis() je Setup-Stufe -> Sensor "Boot-Zeitplan"
    # Flex-Layouts der gemeinsamen Styles st_fx_* / st_grow (siehe lvgl: style_definitions).
    # ESPHome kann layout/flex_* nicht in Styles schreiben - daher hier per Lambda.
    # Prioritaet 450 (2026-09-30): die Styles gibt es schon (setup()), die Widgets noch nicht (LVGL-Setup
    # bei 400). So entfaellt lv_obj_report_style_change() - das rechnete vorher als Script
    # "laufzeit_styles" (on_boot 100) jedes Widget aller Seiten neu und kostete 2,6 s beim Start,
    # genau in der Zeit, in der das WLAN schon verbunden war, ESPHome es aber nicht melden konnte.
    - priority: 450
      then:
        - lambda: |-
            struct Fx { lv_style_t *s; lv_flex_flow_t flow; lv_flex_align_t main, cross; };
            const Fx fx[] = {
              {id(st_fx_r10), LV_FLEX_FLOW_ROW,    LV_FLEX_ALIGN_START,         LV_FLEX_ALIGN_CENTER},
              {id(st_fx_r8),  LV_FLEX_FLOW_ROW,    LV_FLEX_ALIGN_START,         LV_FLEX_ALIGN_CENTER},
              {id(st_fx_c10), LV_FLEX_FLOW_COLUMN, LV_FLEX_ALIGN_START,         LV_FLEX_ALIGN_START},
              {id(st_fx_sb8), LV_FLEX_FLOW_ROW,    LV_FLEX_ALIGN_SPACE_BETWEEN, LV_FLEX_ALIGN_CENTER},
              {id(st_fx_sb),  LV_FLEX_FLOW_ROW,    LV_FLEX_ALIGN_SPACE_BETWEEN, LV_FLEX_ALIGN_CENTER},
            };
            for (const Fx &f : fx) {
              lv_style_set_layout(f.s, LV_LAYOUT_FLEX);
              lv_style_set_flex_flow(f.s, f.flow);
              lv_style_set_flex_main_place(f.s, f.main);
              lv_style_set_flex_cross_place(f.s, f.cross);
              lv_style_set_flex_track_place(f.s, LV_FLEX_ALIGN_START);
            }
            lv_style_remove_prop(id(st_fx_sb), LV_STYLE_PAD_COLUMN);   // hatte kein pad_column
            lv_style_remove_prop(id(st_grow), LV_STYLE_PAD_COLUMN);    // nur Platzhalter im YAML
            lv_style_set_flex_grow(id(st_grow), 1);
    # WLAN-Schnellstart-Schalter: vor dem WLAN-Start (Stufe 250) - AUS = feste IP entfernen -> DHCP.
    # (Versuch 2026-09-30, das WLAN hier per wifi->call() bei 940 selbst zu starten: Absturz beim Booten,
    # automatische Rueckkehr zur alten Firmware. Stattdessen laufen Display/LVGL/LIS3DH jetzt NACH dem
    # WLAN-Start, siehe deren setup_priority.)
    - priority: 260
      then:
        - lambda: |-
            if (!id(wifi_fest)) {
              wlan_zugriff::dhcp_statt_fester_ip();
              ESP_LOGI("wlan", "Schnellstart AUS: DHCP statt fester IP");
            }
    - priority: -100
      then:
        - script.execute: zustand_holen
        - lambda: |-
            // IR-Kanaele nach dem Start abschalten (nur bei Bedarf an, s. esphomeremote-rmt.h)
            rmt_bedarf::sender(id(ir_tx), false);
            if (!id(ir_rx_power).state) rmt_bedarf::empfaenger(id(ir_rx), false);
            // Wischen wie am Handy: laengerer Schwung nach dem Loslassen (LVGL-Standard bremst 10 % je Bild,
            // hier 4 %) und Scrollen schon ab 6 px statt 10 px
            for (lv_indev_t *in = lv_indev_get_next(nullptr); in != nullptr; in = lv_indev_get_next(in)) {
              if (lv_indev_get_type(in) != LV_INDEV_TYPE_POINTER) continue;
              lv_indev_set_scroll_throw(in, 4);
              lv_indev_set_scroll_limit(in, 6);
            }
            tasten::einrichten();   // Tasten-Konfigurator + Menue: Hooks setzen (esphomeremote-tasten.h)
            einst_sync::einrichten();   // Einstellungen <-> Konfigurator (esphomeremote-einst-sync.h)
            // HA-Befehl hat kein Dock erreicht (er wartet jetzt auf die eigene Verbindung): bei "WLAN aus" das WLAN holen
            id(tk_cfg).ha_wecken = []() { if (wlan_zugriff::g_nur_ble) wlan_zugriff::bedarf(60000, "Dock nicht erreicht"); };
            // WLAN kommt: HA ueber das Dock Bescheid sagen (verbindet dann sofort, Bruecke ble_link.py wlan_kommt)
            wlan_zugriff::g_bedarf_neu = []() { id(tk_cfg).dock_aufruf("esphomeremote_konfig.wlan_kommt", {}, true); };
            // Bluetooth-Notweg: Einstellung, und danach den Platz der Aktivitaet wieder anwenden (Dock uebernimmt)
            id(tk_cfg).notweg_modus = []() { return (int) id(bt_notweg); };
            id(tk_cfg).notweg_vorbei = []() { id(apply_activity).execute(); };
            id(mn)->set_anzeige(id(konf_root), id(konf_title), id(konf_back_lbl), id(konf_back));
            id(mn)->set_fonts(id(a15)->get_lv_font(), id(a13)->get_lv_font(), id(mdi_menu)->get_lv_font(), id(a18)->get_lv_font(),
                              id(a11)->get_lv_font(), id(a24)->get_lv_font());
            // Widgets (2026-10-27) und Startseite je Aktivitaet (mn_home in home_eigen)
            id(mn_home)->set_anzeige(id(home_eigen), nullptr, nullptr, nullptr);
            for (auto *m : {id(mn), id(mn_home)}) {
              if (m != id(mn)) m->set_fonts(id(a15)->get_lv_font(), id(a13)->get_lv_font(), id(mdi_menu)->get_lv_font(), id(a18)->get_lv_font(),
                                            id(a11)->get_lv_font(), id(a24)->get_lv_font());
              m->set_widget_fonts(id(a48)->get_lv_font(), id(mdi_wetter)->get_lv_font());
              m->zeit = [](int &h, int &mi, int &wt, int &tg, int &mo) {
                auto t = id(sntp_time).now();
                if (!t.is_valid()) return false;
                h = t.hour; mi = t.minute; wt = (t.day_of_week + 5) % 7; tg = t.day_of_month; mo = t.month;
                return true;
              };
              m->akku = [](int &p, bool &l) { p = id(akku_pct); l = id(laedt); };
              m->wbild = [](int slot) -> const void * { return (slot == 0 ? id(wbild_0) : id(wbild_1))->get_lv_image_dsc(); };
              m->wbild_laden = [](int slot, const std::string &url) {
                auto *b = slot == 0 ? id(wbild_0) : id(wbild_1);
                b->set_url(url);
                b->update();
              };
            }
    - priority: 100
      then:
        # Nach dem Setup aller Komponenten. Echter Start (nicht Aufwachen aus dem Tiefschlaf): Testmodus aus.
        - if:
            condition: {lambda: 'return id(boot_grace);'}
            then:
              - globals.set: {id: testmodus, value: "false"}
              - lambda: 'ESP_LOGI("test", "Echter Boot -> Testmodus AUS");'
        # Log-Ausfuehrlichkeit aus der Einstellung (Standard INFO).
        - if:
            condition: {lambda: 'return id(ps_log_debug);'}
            then: [{logger.set_level: {level: DEBUG}}]
            else: [{logger.set_level: {level: INFO}}]
        - lambda: |-
            id(letzter_neustart)->update();
            std::string g = "Start: " + id(letzter_neustart)->state;
            weck_log(g.c_str());
        - script.execute: apply_motion_sens
        - script.execute: apply_motion_on
        - script.execute: apply_disp_timeout
        - script.execute: apply_brightness
        - script.execute: apply_activity
        - script.execute: apply_show
        - script.execute: fix_slider_geometry
        - script.execute: apply_assistant
        - script.execute: apply_tts_speaker
        - script.execute: refresh_mic_icon
        - script.execute: apply_power
        - script.execute: boot_grace_timer
        # Ladezustand direkt aus dem CRATE-Register lesen, damit die
        # Tiefschlaf-Entscheidung gleich beim Booten stimmt (der Sensor
        # braucht sonst bis zu 60 s bis zur ersten Messung).
        - script.execute: refresh_laden
        # Tasten beim Aufwachen (Einstellung weck_tasten, 2026-10-20): 2 = Weck-Taste und alles bis zur Verbindung senden,
        # 1 = Weck-Taste weckt nur, danach gedrueckte senden, 0 = nur wecken, Bluetooth-Tasten vor der Verbindung verwerfen.
        - lambda: |-
            id(keypad).set_weck_verwerfen(id(weck_tasten) < 2);
            id(tk_cfg).set_vor_verbindung_merken(id(weck_tasten) > 0);
        # "Tasten wecken: Nur die Menuetaste" gilt auch nach dem Tiefschlaf (2026-10-20): hat eine andere Taste geweckt und
        # wird sie gesendet, bleibt das Display aus (die Taste geht an den Fernseher). Wird die Weck-Taste verworfen, geht
        # das Display an - sonst passierte beim Wecken gar nichts Sichtbares.
        - if:
            # Entschieden ganz vorne in diesem Block (dunkel_start): nur der Chip wacht auf, Bluetooth verbindet schon,
            # die naechste Taste wirkt sofort
            condition: {lambda: 'return id(dunkel_start);'}
            then:
              - lambda: |-
                  id(disp_off) = true;
                  id(sofort_aus) = true;
                  weck_log("Aufgewacht ohne Display (Weck-Taste/Bewegung schalten es laut Einstellung nicht ein)");
              - script.execute: backlight_idle_timeout
            else:
              - script.execute: wake_backlight
        # Kurz warten, bevor die Begruessung kommt: der erste Seitenaufbau
        # von LVGL kann sonst den Wechsel ueberschreiben (seit dem Update
        # auf ESPHome 2026.9 fehlte die Begruessung nach dem Flashen).
        - delay: 700ms
        - if:
            condition: {lambda: 'return id(begruessung) && !id(disp_off);'}
            then: [{lvgl.page.show: {id: page_welcome, animation: FADE_IN, time: 250ms}}]

# Rev6 microSD: SPI-Modus. GPIO15=SCK, GPIO17=MOSI, GPIO7=MISO, GPIO18=CS,
# GPIO16=SD_EN (Q7-P-MOSFET, LOW=Karte an). SD_DET laeuft ueber TCA8418.
# ACHTUNG: SCK/MOSI/MISO teilen sich die Pins mit dem I2S-Sprachmikrofon (nur 4k7-Serienwiderstaende
# R45-47 trennen sie). Beides gleichzeitig geht nicht: nach dem Einbinden der Karte ist das Mikrofon
# bis zum Neustart tot. Deshalb wird die Karte NUR auf Wunsch eingebunden (Menue > Einstellungen >
# Wartung > SD-Karte) und beim Auswerfen startet die Remote neu.
sd_card:
  id: sdkarte
  clk_pin: GPIO15
  mosi_pin: GPIO17
  miso_pin: GPIO7
  cs_pin: GPIO18
  # KEIN power_pin: SD_EN (GPIO16) gehoert hier dem Schalter sd_power_off (ALWAYS_ON = Karte aus);
  # die Skripte sd_einbinden / sd_auswerfen schalten ihn.
  mount_point: /sd
  # 8 MHz: gemessen 650 KB/s roh, ~215 KB/s ueber FatFS/fread, fehlerfrei (20 MHz laeuft ebenfalls sauber, bringt
  # aber wenig). Die frueher gemessenen ~5 KB/s hatten NICHTS mit dem Takt zu tun: ein stromloses Mikrofon klemmte
  # MISO (GPIO7) nach Low, ESP-IDF wartete vor jedem Befehl 40 ms (poll_busy). Darum bleibt MIC_VDD waehrend der
  # Kartennutzung EIN (siehe sd_einbinden / sd_logo_holen und apply_mic_power).
  frequency: 8000kHz
  mount_on_boot: false        # nie automatisch: die Karte nimmt dem Mikrofon die Pins

# IR-Sender (Rev6): D2 (SFH4346) an Q5-Drain, Q5-Gate = IR_LED = GPIO5, aktiv-LOW
# (GPIO5 LOW -> Q5 EIN -> IR-LED leuchtet). 3R3 Serienwiderstand -> starker Puls.
remote_transmitter:
  id: ir_tx
  pin:
    number: GPIO5
    inverted: true
  carrier_duty_percent: 50%
  # RMT-Kanal nur waehrend des Sendens aktiv - sonst blockiert seine Stromspar-Sperre den Leichtschlaf
  # dauerhaft (pm_bericht 2026-10-07, esphomeremote-rmt.h)
  on_transmit:
    - lambda: 'rmt_bedarf::sender(id(ir_tx), true);'
  on_complete:
    - lambda: 'rmt_bedarf::sender(id(ir_tx), false);'

# IR-Empfaenger (Rev6): U6 TSSP77038, OUT = IR_RX = GPIO4 (ueber R40 2k2),
# Vs = IR_VCC = GPIO6 (switch.ir_rx_power). TSOP-Ausgang ist aktiv-LOW.
# Zum IR-Lernen: IRDB-Befehle durch Anlernen der echten FB in raw umwandeln.
remote_receiver:
  id: ir_rx
  pin:
    number: GPIO4
    inverted: true
    mode: {input: true}
  # 2026-10-22: ohne DMA fasst ein Empfangskanal am S3 hoechstens 192 Symbole (4 Bloecke a 48) - mit 512 schlug
  # die Einrichtung bei jedem Start fehl ("out of RMT symbol memory"), Anlernen ging nie.
  # 2026-10-25: mit DMA scheiterte rmt_receive bei jedem Start (ESP_ERR_INVALID_ARG - ESPHome legt den Puffer nicht
  # DMA-gerecht ausgerichtet an), der Empfaenger blieb aus. Daher ohne DMA mit 192 Symbolen (384 Flanken): reicht fuer
  # Fernseher, Streamer, Licht; sehr lange Klimaanlagen-Telegramme werden abgeschnitten.
  use_dma: false
  rmt_symbols: 192
  receive_symbols: 192
  idle: 12ms
  on_raw:
    then:
      # IR anlernen aus dem Konfigurator (2026-10-11): erstes vollstaendiges Telegramm als Ereignis an HA.
      # Ab 16 Flanken - NEC-Wiederholcodes (4 Flanken) und Stoerungen fallen raus.
      - if:
          condition: {lambda: 'return id(ir_lern_ha) && x.size() >= 16;'}
          then:
            - lambda: |-
                std::string s;
                s.reserve(x.size() * 6);
                for (size_t i = 0; i < x.size() && i < 1200; i++) {
                  if (i) s += ',';
                  s += std::to_string(x[i]);
                }
                id(ir_lern_ha) = false;
                id(ir_rx_power).turn_off();
                id(ir_lern_melden).execute(s, (int) std::min<size_t>(x.size(), 1200));




esp32:
  board: esp32-s3-devkitc1-n16r8
  flash_size: 16MB
  framework:
    type: esp-idf
    # Pflicht fuer espidf_ble_keyboard: der treibt Bluedroid direkt an und
    # kann sich den Stack mit nichts teilen (kein esp32_ble / NimBLE).
    sdkconfig_options:
      # Fuer die Prozessor-Drosselung. Ohne PM_ENABLE liefert esp_pm_configure
      # nur ESP_ERR_NOT_SUPPORTED.
      CONFIG_PM_ENABLE: "y"
      # Leichtschlaf (Schalter "Sparen: Leichtschlaf"):
      # Tickless Idle + Bluetooth-Modem-Schlaf mit dem Hauptquarz als Takt, sonst haelt der
      # BT-Controller eine PM-Sperre und der Prozessor schlaeft nie. Solange light_sleep_enable
      # false ist (Display an / Schalter aus), aendert sich am Verhalten nichts.
      CONFIG_FREERTOS_USE_TICKLESS_IDLE: "y"
      CONFIG_BT_CTRL_MODEM_SLEEP: "y"
      CONFIG_BT_CTRL_MODEM_SLEEP_MODE_1: "y"
      CONFIG_BT_CTRL_LPCLK_SEL_MAIN_XTAL: "y"
      CONFIG_BT_CTRL_MAIN_XTAL_PU_DURING_LIGHT_SLEEP: "y"
      CONFIG_BT_ENABLED: "y"
      CONFIG_BT_CONTROLLER_ENABLED: "y"
      CONFIG_BT_BLUEDROID_ENABLED: "y"
      CONFIG_BT_NIMBLE_ENABLED: "n"
      CONFIG_BT_BLE_ENABLED: "y"
      CONFIG_BT_GATTS_ENABLE: "y"
      # 2026-09-29d: Bluetooth-5-Werbeschnittstelle (Extended Advertising, gesendet werden weiterhin
      # die alten "Legacy"-Pakete). Jedes Werbe-Set hat eine eigene Adresse - noetig fuer parallele
      # Verbindungen mit eigener Adresse pro Platz. Alt- und Neu-Schnittstelle duerfen nicht gemischt werden.
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: "n"
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: "y"
      # Bluetooth-Stack (Bluedroid) holt Speicher bevorzugt aus dem PSRAM (2026-10-04): jede BLE-Verbindung
      # kostete ~12 KB internes RAM (gemessen 18,7 -> 6,4 KB beim Verbinden), danach scheiterten WLAN/HA.
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_BT_BLE_SMP_ENABLE: "y"
      CONFIG_BT_ACL_CONNECTIONS: "4"
      # ESPHomes psram:-Component setzt selbst CONFIG_SPIRAM_USE_CAPS_ALLOC=y
      # (esphome/components/psram/__init__.py) - unter diesem Modus nutzen
      # normales `new`/`malloc` NIEMALS automatisch PSRAM, nur explizite
      # heap_caps_malloc(..., MALLOC_CAP_SPIRAM)-Aufrufe. Live reproduziert:
      # JPEGDEC (~20-30 KB fester Speicher, per plain `new`) ist deshalb
      # zuverlaessig an fragmentiertem INTERNEM Speicher gescheitert
      # (operator new -> bad_alloc -> abort), obwohl reichlich PSRAM frei
      # war. CONFIG_SPIRAM_USE_MALLOC macht malloc/new PSRAM-faehig (ueber
      # der ALWAYSINTERNAL-Schwelle); Nutzer-sdkconfig_options ueberschreiben
      # Component-Defaults nur zuverlaessig, wenn beide Seiten der
      # Kconfig-"choice" (USE_MALLOC/USE_CAPS_ALLOC) explizit gesetzt werden.
      CONFIG_SPIRAM_USE_MALLOC: "y"
      # Stapel eigener Hilfs-Tasks (tasten_konfig/menue: HTTP) im PSRAM statt im knappen internen RAM (2026-10-04)
      CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY: "y"
      # WLAN- und LWIP-Puffer ins PSRAM (2026-10-04): internes RAM war erschoepft - Mikrofon ESP_ERR_NO_MEM im
      # Sekundentakt, BT-Tasten kamen gesammelt/gar nicht an, HA-API "Buffer full". Die Remote braucht keinen
      # WLAN-Durchsatz (Sprache/Tasten laufen ueber Bluetooth).
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      # Ohne WPA3-SAE meldet sich die Remote im WPA2/WPA3-Mischbetrieb des Routers per WPA2 an (2026-09-30).
      # Gemessen: WLAN-Start bis IP 0,06 s statt 1,9 s (nach "WLAN aus"), beim Booten 0,17 statt 0,7 s.
      # Die SAE-Rechnung (elliptische Kurven) war der Grossteil der Verbindungszeit. Spart ausserdem ~15 KB
      # internes RAM (frei 27 statt 12 KB).
      CONFIG_ESP_WIFI_ENABLE_WPA3_SAE: "n"
      CONFIG_SPIRAM_USE_CAPS_ALLOC: "n"
      # Kleine/zeitkritische Allokationen (< 16 KB) bleiben intern (schneller,
      # kein PSRAM-Cache-Overhead) - der JPEGDEC-Block (>16 KB) faellt darueber
      # automatisch auf PSRAM.
      # 512 statt 16384 (Stand 2026-09-21): unter 16 KB landete ALLES (LVGL-Objekte, Texte,
      # Puffer) im knappen internen RAM - nur noch 7 KB frei, dadurch konnte die Remote
      # ihre Entitaetenliste nicht mehr an HA senden. Jetzt liegt alles ab 512 Byte im PSRAM.
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "512"
      # Die Stapel der Core-0-Tasks (BTC/BTU u. a.) bleiben bewusst beim Standard: pauschal vergroessert brachen
      # Bluetooth und die Sprachsuche ein. Bei einem Ueberlauf gezielt nur den betroffenen Task anheben.
    advanced:
      # Stapel der ESPHome-Hauptschleife (loopTask, Core 1, darin laeuft LVGL): 16 KB statt 8 KB. Mit 8 KB endete
      # das Erweitern der Startseite reproduzierbar in einem Stapelueberlauf (vApplicationStackOverflowHook, Core 1).
      loop_task_stack_size: 16384

psram:
  mode: octal
  speed: 80MHz

# -----------------------------------------------------------------------------
# Tiefschlaf fuer den Ruhezustand. Standardmaessig AUS - einschaltbar unter
# Einstellungen -> Energie sparen -> "Tiefschlaf im Ruhezustand".
#
# Kein run_duration und KEIN Timer-Wake: der Chip schlaeft AUSSCHLIESSLICH, wenn
# deep_ruhe_timer deep_sleep.enter aufruft, und wacht NUR auf, wenn jemand ihn
# weckt (Nutzerwunsch 2026-09-20: kein Aufwachen von selbst, auch nicht fuer den
# Akkustand).
#
# Weckquellen (Pins in deep_sleep_powerdown per ext1 als gemeinsame ANY_LOW-
# Maske - ESPHomes wakeup_pin kann nur EINEN Pin und wuerde die Maske
# ueberschreiben):
#   - GPIO8 (TCA8418-INT, aktiv LOW): jeder Tastendruck.
#   - GPIO2: Bewegung/Anheben.
#   - GPIO1: Ladekabel.
deep_sleep:
  id: nachtschlaf

external_components:
  - source: {type: git, url: https://github.com/Aggro600/ESPHomeRemote, ref: stabil, path: components}
    refresh: 0s
    # online_image: eigene Fassung (2026-10-10) - Download und JPEG-Dekodierung im Hintergrund-Task, die Remote
    # bleibt bedienbar, waehrend Cover/Klingelbilder per WLAN oder Bluetooth kommen (s. components/online_image).
    components: [ili9341_i80, tca8418, max17048, lis3dh, espidf_ble_keyboard, atv_voice, ft63x6, sd_card, tasten_konfig, menue, online_image, dock_direkt]

logger:
  level: DEBUG
  # Letzte Zeilen ab INFO im PSRAM merken (auch bei WLAN aus): Knopf "Protokoll-Puffer ausgeben", Protokoll ueber das
  # Dock (2026-10-24, s. dock_status_melden)
  on_message:
    level: INFO
    then:
      - lambda: 'logpuffer::merken(level, tag, message);'

api:
  encryption: {}   # Schluessel vergibt Home Assistant beim Einbinden
  reboot_timeout: 0s
  on_client_connected:
    - globals.set: {id: api_ever, value: "true"}
    - lambda: 'if (id(ps_log_debug)) id(weck_text).publish_state(weck_log_ende(250));'
    - script.execute: refresh_wifi_bars
    # HA-Symbol gruen erst mit dem Zustands-Abo von HA (kommt kurz nach dem Verbinden), dann Cover nachladen
    - wait_until:
        condition: {lambda: 'return api::global_api_server->is_connected_with_state_subscription();'}
        timeout: 10s
    - script.execute: refresh_wifi_bars
    - script.execute: cover_sync
    # Helligkeit nach Lichtsensor: HA schickt daraufhin sofort die passenden Werte (helligkeit_auto)
    - homeassistant.event:
        event: esphome.remote_verbunden
        data:
          geraet: !lambda 'return App.get_name();'
    # Neue Firmware live (Hash der Kompilierzeit weicht vom gespeicherten ab)? Dann einmal Ereignis an HA.
    - if:
        condition:
          lambda: |-
            uint32_t h = 2166136261u;
            for (const char *c = __DATE__ " " __TIME__; *c; c++) { h ^= (uint8_t) *c; h *= 16777619u; }
            if (id(fw_hash) == h) return false;
            id(fw_hash) = h;
            ESP_LOGI("version", "Neue Firmware live: %s %s", __DATE__, __TIME__);
            return true;
        then:
          - homeassistant.event:
              event: esphome.remote_neue_version
              data:
                geraet: !lambda 'return App.get_name();'
  # Ebenso sofort auf die Wartefarbe (grau) umstellen, wenn Home Assistant abhanden kommt - nicht
  # erst nach dem naechsten RSSI-Update. Das WLAN selbst kann dabei weiter verbunden sein (bewusst KEIN globals.set auf
  # api_ever - das bleibt "war schon mal da").
  on_client_disconnected:
    - script.execute: refresh_wifi_bars
  services:
    # Aktivitaet von HA (Schalter je Aktivitaet, esphomeremote_konfig): nr = Index, -1 = laufende beenden
    - service: aktivitaet_setzen
      variables:
        nr: int
      then:
        - lambda: 'if (nr < 0) tasten::aktivitaet_aus(); else tasten::aktivitaet_setzen(nr);'
    # Cover neu laden: von der Integration (esphomeremote_konfig/cover.py), NACHDEM sie das Bild verkleinert abgelegt
    # hat - sonst kam das Cover des vorherigen Titels.
    # Neues Cover (2026-10-20): beide Bilder nur vormerken, geladen wird je Seite, wenn sie zu sehen ist (cover_sichtbar) -
    # vorher lud jede Remote bei jedem Titelwechsel beide Bilder, auch bei dunklem Display durch den langsamen
    # Ruhe-Takt der HA-Verbindung (20-30 s, oft abgebrochen).
    - service: refresh_cover
      then:
        - lambda: 'id(cover_mp_offen) = true; id(cover_home_offen) = true;'
        - script.execute: cover_sichtbar
        # home_cover_image wird jetzt NICHT mehr parallel hier angestossen,
        # sondern erst in mp_cover_image's on_download_finished/on_error (s.
        # dort) - verhindert zwei gleichzeitige HTTP-Downloads.
    # Live-Bild nachladen (HA hat den Snapshot verkleinert, s. Automation
    # "ESPHomeRemote: Kamerabild fürs Live-Bild").
    - service: cam_image
      then:
        - lambda: 'id(cam_try) = 0;'
        - script.execute: cam_load
    # Klingel-Bild nachladen (aufgerufen von der HA-Automation "ESPHomeRemote:
    # Klingel-Bild ..." kurz nach dem Klingeln, sobald das Foto verkleinert ist).
    # door: 1 = Haustuer, 2 = Wohnungstuer.
    - service: doorbell_image
      variables:
        door: int
      then:
        - if:
            condition: {lambda: "return door == 1;"}
            then:
              - online_image.set_url: {id: db_haus_image, url: !lambda 'return std::string("http://") + id(tk_cfg).host() + "/local/esphomeremote_doorbell_haus.jpg";'}
            else:
              - online_image.set_url: {id: db_wohn_image, url: !lambda 'return std::string("http://") + id(tk_cfg).host() + "/local/esphomeremote_doorbell_wohnung.jpg";'}
    # Menue-Seite als Popup zeigen / schliessen (z. B. Kamera-Popup, s. packages/esphomeremote_kamera_tv.yaml)
    - service: menue_popup
      variables: {seite: string}
      then:
        - lambda: 'tasten::menue_popup(std::string(seite.c_str(), seite.size()));'
    - service: menue_popup_zu
      then:
        - lambda: 'tasten::menue_popup_zu();'
    # Tasten-Konfigurator: Belegung sofort neu aus HA holen
    - service: tasten_neu_laden
      then:
        - lambda: 'id(tk_cfg).neu_laden();'
    # IR anlernen (Konfigurator): Original-Fernbedienung auf die Remote halten -> Ereignis esphome.remote_ir_gelernt
    - service: ir_lernen
      variables: {sekunden: int}
      then:
        - script.execute: {id: ir_lern_fenster, sekunden: !lambda 'return sekunden;'}
    # IR-Befehl testen (Konfigurator, 2026-10-11): ein IR-Schritt als JSON, Sendeweg Remote/Dock wie eingestellt
    # Konfig-Modus (HTTP, SD-Karte im Browser / Bildschirmfoto) an/aus - ersetzt den Schalter in HA (2026-10-18)
    - service: konfig_http
      variables: {an: bool}
      then:
        - if:
            condition: {lambda: 'return an;'}
            then: [{switch.turn_on: konfig_http_sw}]
            else: [{switch.turn_off: konfig_http_sw}]
    - service: ir_test
      variables: {schritt: string}
      then:
        - lambda: 'id(tk_cfg).ir_test(schritt);'
    # Bluetooth-Plaetze aus dem Konfigurator (2026-10-11): aktion = verbinden / koppeln / loeschen, platz 0..3.
    # Gleiche Logik wie die Knoepfe unter Menue > Einstellungen > Bluetooth (inkl. Schutz beim Neukoppeln).
    - service: bt_platz
      variables: {aktion: string, platz: int}
      then:
        - script.execute: {id: bt_platz_aktion, aktion: !lambda 'return aktion;', platz: !lambda 'return platz;'}
    - service: bt_status
      then:
        - script.execute: bt_status_melden
    # Konfigurator: Geste an der Remote anlernen (dreimal ausfuehren, je mit OK bestaetigen; 2026-10-17)
    - service: geste_anlernen
      variables: {gid: string, name: string}
      then:
        - lambda: 'gestenseite::lern_starten(gid, name);'
    # Firmware-Update (2026-10-17, Variable heisst meldung - "text" verbietet ESPHome): HA meldet den Stand (Wartung & Tests > Firmware aktualisieren). stufe 0 = Info
    # (aktuell / Update da), 1 = laeuft (haelt WLAN und Remote 5 min wach), 2 = fertig, 3 = Fehler.
    - service: fw_status
      variables: {meldung: string, stufe: int}
      then:
        - lambda: 'extras::fw_status(meldung, stufe);'
        - if:
            condition: {lambda: 'return stufe == 1;'}
            then: [{script.execute: fw_fenster}]
    # Helligkeit nach Lichtsensor (Konfigurator, 2026-10-17): HA rechnet die Kurve und schickt die Werte (-1 = lassen).
    # Setzt dieselben Werte wie die Regler; ein dunkles bzw. abgedunkeltes Display bleibt dunkel bzw. abgedunkelt.
    # Verstellt jemand die Regler von Hand, meldet der Einstellungs-Abgleich das an HA - die Kurve lernt daraus.
    - service: helligkeit_auto
      variables: {disp: int, kbd: int}
      then:
        - lambda: |-
            bool geaendert = false;
            if (disp >= 5 && disp <= 100 && disp != id(disp_bri)) { id(disp_bri) = disp; geaendert = true; }
            if (kbd >= 5 && kbd <= 100 && kbd != id(kbd_bri)) { id(kbd_bri) = kbd; geaendert = true; }
            if (!geaendert) return;
            ESP_LOGI("licht", "Helligkeit nach Lichtsensor: Display %d %%, Tasten %d %%", id(disp_bri), id(kbd_bri));
            if (id(display_backlight).current_values.is_on()) {
              float b = id(disp_bri) / 100.0f;
              if (id(disp_dimmed)) b = fmaxf(0.03f, b * (id(ps_dim_pct) / 100.0f));
              auto c = id(display_backlight).turn_on(); c.set_brightness(b); c.set_transition_length(1500); c.perform();
            }
            if (id(kbd_light_on) && id(button_backlight).current_values.is_on()) {
              auto c = id(button_backlight).turn_on(); c.set_brightness(id(kbd_bri) / 100.0f); c.set_transition_length(1500); c.perform();
            }
            char b[8];
            snprintf(b, sizeof(b), "%d%%", id(disp_bri)); lv_label_set_text(id(disp_bri_lbl), b); lv_label_set_text(id(qs_bri_pct), b);
            snprintf(b, sizeof(b), "%d%%", id(kbd_bri));  lv_label_set_text(id(kbd_bri_lbl), b); lv_label_set_text(id(qs_kbd_pct), b);
            lv_slider_set_value(id(disp_bri_sld), id(disp_bri), LV_ANIM_OFF);
            lv_slider_set_value(id(kbd_bri_sld), id(kbd_bri), LV_ANIM_OFF);
            lv_slider_set_value(id(home_bri_sld), id(disp_bri), LV_ANIM_OFF);
            lv_slider_set_value(id(home_kbd_sld), id(kbd_bri), LV_ANIM_OFF);

ota:
  - platform: esphome
    password: "${ota_pw}"
    # Waehrend eines OTA-Updates niemals schlafen legen und das WLAN nicht
    # abschalten, egal was Tiefschlaf/WLAN-Aus sagen.
    on_begin:
      then:
        - globals.set: {id: ota_aktiv, value: "true"}
        # Display wecken und die Update-Seite zeigen (Fortschrittsbalken) - sonst weiss man
        # beim Flashen nicht, warum die Fernbedienung ruckelt oder haengt.
        - script.execute: wake_backlight
        - lvgl.page.show: {id: page_ota, animation: NONE, time: 0ms}
        # WICHTIG: LVGL zeichnet normalerweise nur in seiner eigenen loop(). Waehrend des Updates
        # haengt die Uebertragung aber in der OTA-Schleife - ohne dieses erzwungene Neuzeichnen
        # blieb der Bildschirm dunkel/eingefroren (deshalb hat die Update-Seite bisher nie
        # etwas angezeigt).
        - lambda: |-
            // Hintergrundlicht sofort auf volle Helligkeit, direkt am PWM-Ausgang: light.turn_on
            // blendet ueber die Loop-Schleife auf, die waehrend des Updates steht - war das
            // Display vorher abgedunkelt, blieb es das (Rueckmeldung 2026-09-21).
            id(backlight_pwm)->set_level(1.0f);
            lv_refr_now(nullptr);
            ESP_LOGI("ota", "Update laeuft - Anzeige aktualisiert");
        - script.stop: backlight_idle_timeout
        - script.stop: wifi_ruhe_timer
        - script.stop: ble_ruhe_timer
        - script.stop: deep_ruhe_timer
        - deep_sleep.prevent: nachtschlaf
    on_progress:
      then:
        - lambda: |-
            static int letzt = -1;
            const int pct = (int) x;
            if (pct == letzt) return;
            letzt = pct;
            lv_bar_set_value(id(ota_bar), pct, LV_ANIM_OFF);
            char b[24];
            snprintf(b, sizeof(b), "%d %%", pct);
            lv_label_set_text(id(ota_pct_lbl), b);
            if (pct >= 100) lv_label_set_text(id(ota_hint_lbl), "Fertig - Neustart ...");
            lv_refr_now(nullptr);   // siehe on_begin: die OTA-Schleife laesst LVGL sonst nicht zeichnen
    on_error:
      then:
        - script.execute: go_home
        - globals.set: {id: ota_aktiv, value: "false"}
        - deep_sleep.allow: nachtschlaf
        # Wieder in den normalen Ruhe-/Schlafablauf zuruecklassen.
        - script.execute: backlight_idle_timeout
    # on_end folgt sowieso ein Reboot ins neue Image - nichts aufzuraeumen.

wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"
  # WLAN-Sparmodus light: "none" hielt den Funkteil dauerhaft wach (~80-100 mA, gemessen 8 % Akku pro Stunde).
  # Kommen Tastendruecke verzoegert an oder reisst Bluetooth ab (eine Antenne fuer beides), hier zuerst zurueckdrehen.
  # Im Ruhezustand optional "max" (apply_wifi_ps).
  power_save_mode: light
  # Schneller verbinden (2026-09-29): keine Kanalsuche, direkt zum bekannten Netz, und feste
  # IP statt DHCP. Die IP liegt in secrets.yaml (ip_remote_wz_<name>) - so bekommt jede Remote
  # ueber den Namenstausch automatisch ihre eigene. Im Router fest zugeordnet lassen!
  fast_connect: true
  # Gestartet wird das WLAN frueh per on_boot 940 (siehe dort), nicht erst bei seiner Standardstufe 250.
  # Feste IP: bei Bedarf hier manual_ip eintragen (sonst vergibt der Router die Adresse).
  ap: {ssid: "${friendly_name} Fallback", password: "${ap_password}"}
  # Balken sofort aktualisieren, wenn das WLAN weg ist (sonst blieb der letzte Stand stehen, 2026-10-06)
  on_disconnect:
    - script.execute: refresh_wifi_bars

captive_portal:

# Nur um die ID zu haben (Werte = ESPHome-Standard); gebraucht beim Herunterfahren (on_boot 950).
safe_mode:
  id: sicherer_start

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin

