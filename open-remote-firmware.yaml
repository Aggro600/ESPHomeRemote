# =============================================================================
#  Open Remote - Firmware (OMOTE / Open Remote Rev6)
# =============================================================================
# Startbildschirm (Touch): Uhr, "jetzt laeuft", Menue-Button. Die Info-Taste
# oeffnet das Menue ebenfalls (nochmal druecken schliesst).
#
# Menuebedienung (D-Pad und Touch):
#   - Hoch/Runter: eine Bedienzeile weiter. Nebeneinanderliegende Buttons
#     (z. B. Rollo Auf/Stop/Zu) zaehlen als EINE Zeile.
#   - Links/Rechts: innerhalb der aktuellen Zeile, umlaufend.
#   - Auswaehlen: OK oder Button antippen.
#   - Zurueck: Zurueck-Taste oder der "< Zurueck"-Button unten.
#   Der Fokus bleibt immer auf einem sichtbaren Button, die Seite scrollt mit.
#   Die Menueposition wird 10 s gemerkt.
#
# Klingel-Overlay: wird der als ent_doorbell konfigurierte Sensor "on", kommt
#   automatisch eine "Tuer oeffnen"-Seite (lock.open auf ent_door_lock).
#
# WICHTIG in Home Assistant: dem Geraet die Ausfuehrung von HA-Aktionen
#   erlauben (Einstellungen -> Geraete -> ESPHome -> dieses Geraet -> Zahnrad).
#
# Anpassen an die eigene Installation: die substitutions unten sowie die im
# README beschriebenen fest hinterlegten Menue-Seiten.
# =============================================================================

substitutions:
  # --- Geraet ---------------------------------------------------------------
  device_name:    "open-remote"          # ESPHome-Node-Name (a-z, 0-9, -)
  friendly_name:  "Open Remote"

  # --- Home-Assistant-Entitaeten -----------------------------------------
  # Die mitgelieferte Konfiguration ist eine vollstaendige Beispiel-
  # installation. Die Menue-Seiten SmartHome / Raeume / Musik / Szenen rufen
  # konkrete HA-Entitaeten auf - hier auf die eigenen aendern (siehe README,
  # Abschnitt "An dein Zuhause anpassen"). Der Rest (IR, Bluetooth, Menue-
  # Bedienung, Sprache, Energie) laeuft ohne Aenderung.
  ent_media:      "media_player.tv_wohnzimmer"
  ent_streamer:   "remote.tv_wohnzimmer_streamer"
  ent_adb:        "media_player.android_tv"          # ADB-Mediaplayer deines Streamers
  ent_wz_light:   "light.wohnzimmer"
  ent_wz_cover:   "cover.wohnzimmer_rollo"
  ent_sz_light:   "light.schlafzimmer"
  ent_sz_cover:   "cover.schlafzimmer_rollo"
  ent_ku_cover:   "cover.kuche_rollo"
  ent_doorbell:   "input_boolean.haustur_wurde_geklingelt"
  ent_door_lock:  "lock.haustur"
  ent_sh_test:    "input_boolean.dashboard_wz_kamera"
  ent_doorbell2:  "input_boolean.wohnungstur_wurde_geklingelt"
  ent_door_lock2: "lock.wohnungstur"
  ent_open_ok1:   "input_boolean.haustur_offnen_erlauben"
  ent_open_ok2:   "input_boolean.wohnungstur_offnen_erlauben"
  ent_sleeptimer: "timer.sleeptimer_auto_off"
  # Signalgeber, ob der Sleeptimer laeuft. Wird nur GELESEN, nie geschaltet.
  ent_sleep_flag: "input_boolean.dashboard_wz_sleeptimer"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: "Aggro600.ESPHomeRemote"
    version: "1.0"
  # esp_pm.h / g_deep_active / Multiroom-Tabelle kommen aus der Komponente
  # open_remote_core (per external_components), sichtbar in allen Lambdas.
  on_boot:
    # Prioritaet 1100: laeuft VOR dem I2C-Bus (setup_priority BUS = 1000).
    # Nach einem Deep-Sleep-Wake zuerst die Holds loesen UND die +VSW-Rail
    # (GPIO38 -> Q4) wieder einschalten - sonst scannt der I2C-Bus (Pull-ups
    # R11/R12 haengen an +VSW) ins Leere ("Recovery failed, SCL held low"),
    # bevor das Display-Component die Rail viel spaeter hochfaehrt.
    # Auf einem Kaltstart schadet das nicht (Rail kommt eh gleich).
    - priority: 1100
      then:
        - lambda: |-
            gpio_deep_sleep_hold_dis();
            const gpio_num_t held[] = {
              GPIO_NUM_38, GPIO_NUM_9, GPIO_NUM_16, GPIO_NUM_6, GPIO_NUM_5, GPIO_NUM_46,
              GPIO_NUM_39, GPIO_NUM_40, GPIO_NUM_41, GPIO_NUM_42,
              GPIO_NUM_48, GPIO_NUM_47, GPIO_NUM_21, GPIO_NUM_14,
              GPIO_NUM_13, GPIO_NUM_12, GPIO_NUM_11, GPIO_NUM_10 };
            for (auto p : held) gpio_hold_dis(p);
            // ext1-Weckpins zuruecksetzen (im Schlaf als RTC-IO gehalten).
            rtc_gpio_hold_dis(GPIO_NUM_1);
            rtc_gpio_deinit(GPIO_NUM_1);
            rtc_gpio_deinit(GPIO_NUM_2);
            // +VSW an: GPIO38 LOW -> Q4 leitet -> Panel/Touch/I2C-Pullups versorgt.
            gpio_set_direction(GPIO_NUM_38, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_38, 0);
            delay(180);   // Panel-Regler + FT6236 einschwingen lassen
    - priority: 900
      then:
        # Weckgrund festhalten, bevor irgendetwas anderes laeuft.
        - lambda: |-
            const auto c = esp_sleep_get_wakeup_cause();
            id(woke_timer) = (c == ESP_SLEEP_WAKEUP_TIMER);
            if (c == ESP_SLEEP_WAKEUP_EXT1) {
              const uint64_t st = esp_sleep_get_ext1_wakeup_status();
              ESP_LOGI("schlaf", "Wake ext1 status=0x%llx -> %s",
                       (unsigned long long) st,
                       (st & (1ULL << 1)) ? "Ladekabel (GPIO1)" :
                       (st & (1ULL << 2)) ? "Bewegung (GPIO2)"  :
                       (st & (1ULL << 8)) ? "Taste (GPIO8)"     : "?");
            } else {
              ESP_LOGI("schlaf", "Wake cause=%d (Timer=%d)", (int) c, (int) ESP_SLEEP_WAKEUP_TIMER);
            }
            // Aufwachen aus dem Tiefschlaf (Timer oder Weckpin) ist KEIN echter
            // Boot -> keine 10-min-Schonfrist, sonst kaeme der Chip nie zum
            // Schlafen. Nur ein Kaltstart / Reset / OTA-Reboot behaelt sie.
            const bool deep_wake = (c == ESP_SLEEP_WAKEUP_TIMER || c == ESP_SLEEP_WAKEUP_GPIO ||
                                    c == ESP_SLEEP_WAKEUP_EXT0  || c == ESP_SLEEP_WAKEUP_EXT1);
            if (deep_wake) id(boot_grace) = false;
            // Aus RTC-Speicher wiederherstellen, ob wir im Tiefschlaf-Modus sind.
            // Der restore_value-Global reicht nicht - er wird evtl. nicht
            // rechtzeitig ins Flash geschrieben, bevor deep_sleep.enter laeuft.
            if (deep_wake && g_deep_active == 0x5EEEu) id(ps_deep) = true;
            if (!deep_wake) g_deep_active = 0;  // echter Boot: Modus geloescht
    - priority: 800
      then:
        - lambda: 'delay(300);'
    - priority: 100
      then:
        # Laeuft NACH dem Setup aller Komponenten (auch der Template-Schalter).
        # Echter Boot (nicht Deep-Sleep-Wake) -> Testmodus zwangsweise AN, damit
        # das Geraet nach jedem Flash/Reset sicher erreichbar ist. Nach einem
        # Deep-Sleep-Wake (boot_grace bereits false) unangetastet lassen.
        - if:
            condition: {lambda: 'return id(boot_grace);'}
            then:
              - globals.set: {id: testmodus, value: "true"}
              - lambda: 'ESP_LOGI("test", "Echter Boot -> Testmodus AN");'
        - script.execute: apply_motion_sens
        - script.execute: apply_motion_on
        - script.execute: apply_disp_timeout
        - script.execute: apply_brightness
        - script.execute: apply_activity
        - script.execute: apply_show
        - script.execute: fix_slider_geometry
        - script.execute: apply_assistant
        - script.execute: apply_tts_speaker
        - script.execute: apply_power
        - script.execute: boot_grace_timer
        # Ladezustand direkt aus dem CRATE-Register lesen, damit die
        # Tiefschlaf-Entscheidung gleich beim Booten stimmt (der Sensor
        # braucht sonst bis zu 60 s bis zur ersten Messung).
        - script.execute: refresh_laden
        - if:
            condition:
              lambda: 'return id(woke_timer) && id(ps_deep) && !id(laedt) && !id(charger_present).state;'
            then:
              # Nur der 6-h-Ruecksicherungs-Timer hat geweckt: Display
              # aus lassen, ~60 s online bleiben (Akkustand an HA, OTA-Fenster),
              # dann per timer_nickerchen wieder in den Tiefschlaf.
              - lambda: 'ESP_LOGI("schlaf", "Vom Ruecksicherungs-Timer geweckt - Display bleibt aus");'
              - light.turn_off: display_backlight
              - light.turn_off: button_backlight
              - globals.set: {id: disp_off, value: "true"}
              - lvgl.pause:
              - script.execute: timer_nickerchen
            else:
              - script.execute: wake_backlight
              - lvgl.page.show: {id: page_welcome, animation: FADE_IN, time: 250ms}

esp32:
  board: esp32-s3-devkitc1-n16r8
  flash_size: 16MB
  framework:
    type: esp-idf
    # Pflicht fuer espidf_ble_keyboard: der treibt Bluedroid direkt an und
    # kann sich den Stack mit nichts teilen (kein esp32_ble / NimBLE).
    sdkconfig_options:
      # Fuer die Prozessor-Drosselung. Ohne PM_ENABLE liefert esp_pm_configure
      # nur ESP_ERR_NOT_SUPPORTED. Tickless Idle bleibt AUS - das wuerde die
      # Zeitsteuerung von Display-DMA und Bluetooth beruehren.
      CONFIG_PM_ENABLE: "y"
      CONFIG_BT_ENABLED: "y"
      CONFIG_BT_CONTROLLER_ENABLED: "y"
      CONFIG_BT_BLUEDROID_ENABLED: "y"
      CONFIG_BT_NIMBLE_ENABLED: "n"
      CONFIG_BT_BLE_ENABLED: "y"
      CONFIG_BT_GATTS_ENABLE: "y"
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: "y"
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: "n"
      CONFIG_BT_BLE_42_ADV_EN: "y"
      CONFIG_BT_BLE_42_SCAN_EN: "y"
      CONFIG_BT_BLE_SMP_ENABLE: "y"
      CONFIG_BT_ACL_CONNECTIONS: "4"

psram:
  mode: octal
  speed: 80MHz

# -----------------------------------------------------------------------------
# Tiefschlaf fuer den Ruhezustand. Standardmaessig AUS - einschaltbar unter
# Einstellungen -> Energie sparen -> "Tiefschlaf im Ruhezustand".
#
# Kein run_duration: der Chip schlaeft AUSSCHLIESSLICH, wenn das Script
# backlight_idle_timeout (bzw. timer_nickerchen) deep_sleep.enter aufruft.
#
# Weckquellen:
#   - GPIO8 (TCA8418-INT, aktiv LOW): jeder Tastendruck weckt.
#   - Timer nach 15 min als Ruecksicherung. Sollte der Weckpin auf der
#     Hardware nicht ziehen (fehlender Pull-up o. ae.), kommt das Geraet so
#     trotzdem regelmaessig hoch und ist ~60 s per Home Assistant / OTA
#     erreichbar (siehe timer_nickerchen) - dann laesst sich aus der Ferne
#     flashen oder der Schalter wieder ausschalten.
deep_sleep:
  id: nachtschlaf
  # 6 h: seltener Timer-Wake nur fuer NTP-Nachziehen + Akkustand.
  # Die Weckpins (GPIO8 Taste / GPIO1 Ladekabel / GPIO2 Bewegung) werden NICHT
  # hier gesetzt, sondern in deep_sleep_powerdown per esp_sleep_enable_ext1_wakeup
  # als gemeinsame ANY_LOW-Maske - ESPHomes wakeup_pin kann nur EINEN Pin und
  # wuerde die Maske ueberschreiben.
  sleep_duration: 6h

# Sammelheader (esp_pm.h, g_deep_active, Multiroom-Tabelle) vor die Lambdas.
open_remote_core:

external_components:
  # Aus diesem Repo. Funktioniert sowohl beim lokalen Klon als auch beim
  # Adoptieren ueber die ESPHome-Oberflaeche.
  - source: github://Aggro600/ESPHomeRemote@master
    components: [open_remote_core, ili9341_i80, tca8418, max17048, lis3dh, espidf_ble_keyboard, atv_voice]
  # Zum lokalen Entwickeln stattdessen:
  # - source: {type: local, path: components}
  #   components: [open_remote_core, ili9341_i80, tca8418, max17048, lis3dh, espidf_ble_keyboard, atv_voice]

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s
  on_client_connected:
    - globals.set: {id: api_ever, value: "true"}

ota:
  - platform: esphome
    password: !secret ota_pw
    # Waehrend eines OTA-Updates niemals schlafen legen und das WLAN nicht
    # abschalten, egal was Tiefschlaf/Stufe 2 sagen.
    on_begin:
      then:
        - globals.set: {id: ota_aktiv, value: "true"}
        - script.stop: timer_nickerchen
        - script.stop: backlight_idle_timeout
        - deep_sleep.prevent: nachtschlaf
    on_error:
      then:
        - globals.set: {id: ota_aktiv, value: "false"}
        - deep_sleep.allow: nachtschlaf
        # Wieder in den normalen Ruhe-/Schlafablauf zuruecklassen.
        - script.execute: backlight_idle_timeout
    # on_end folgt sowieso ein Reboot ins neue Image - nichts aufzuraeumen.

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # NICHT power_save: 'light'/'HIGH' halbieren den ATVV-Durchsatz waehrend
  # des Audio-Streamings.
  # 'none' hielte den Funkteil dauerhaft wach (rund 80-100 mA, ~8 %/h) und war
  # ueber die Bluetooth-Koexistenz begruendet (eine Antenne fuer beides). Falls
  # Tastendruecke verzoegert ankommen oder die BLE-Verbindung abreisst, ist das
  # die erste Zeile zum Zurueckdrehen.
  power_save_mode: light
  ap: {ssid: "Open-Remote Fallback", password: !secret ap_password}

captive_portal:

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin

# -----------------------------------------------------------------------------
# EINE Schriftart ueberall: Audiowide. Wird per gfonts:// aus Google Fonts
# geladen (kein lokales File noetig - wichtig fuers Adoptieren). Keine
# gemischten Schriftarten, nirgendwo.
# -----------------------------------------------------------------------------
font:
  - file: "gfonts://Audiowide"
    id: a13
    size: 13
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~€°±·«»¿¡ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÑÒÓÔÕÖØÙÚÛÜÝßàáâãäåæçèéêëìíîïñòóôõöøùúûüýÿ–—’‘”“…"
  - file: "gfonts://Audiowide"
    id: a15
    size: 15
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~€°±·«»¿¡ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÑÒÓÔÕÖØÙÚÛÜÝßàáâãäåæçèéêëìíîïñòóôõöøùúûüýÿ–—’‘”“…"
  - file: "gfonts://Audiowide"
    id: a18
    size: 18
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~€°±·«»¿¡ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÑÒÓÔÕÖØÙÚÛÜÝßàáâãäåæçèéêëìíîïñòóôõöøùúûüýÿ–—’‘”“…"
  # Nur EIN Zeichen: der Blitz (mdi:flash) als Ladesymbol. mdi-Font direkt aus
  # diesem Repo (raw), damit auch das Adoptieren ohne lokale Datei geht.
  - file: "https://raw.githubusercontent.com/Aggro600/ESPHomeRemote/master/fonts/mdi-subset.ttf"
    id: ico_charge
    size: 14
    bpp: 4
    glyphs: ["\U000F0241"]

globals:
  - {id: cur_page,       type: int,       restore_value: false, initial_value: "0"}
  - {id: frow,           type: int,       restore_value: false, initial_value: "0"}   # Fokus: Zeile
  - {id: fcol,           type: int,       restore_value: false, initial_value: "0"}   # Fokus: Spalte in der Zeile
  - {id: fdrow,          type: int,       restore_value: false, initial_value: "0"}
  - {id: fdcol,          type: int,       restore_value: false, initial_value: "0"}
  - {id: cur_focus,      type: "void *",  restore_value: false, initial_value: "nullptr"}
  - {id: media_from,     type: int,       restore_value: false, initial_value: "0"}   # 0 = vom Home, 3 = aus WZ
  - {id: apps_from_home, type: bool,      restore_value: false, initial_value: "false"}
  - {id: last_menu_page, type: int,       restore_value: false, initial_value: "1"}
  - {id: last_menu_ms,   type: uint32_t,  restore_value: false, initial_value: "0"}
  - {id: menu_target,    type: int,       restore_value: false, initial_value: "1"}
  - {id: kbd_light_on,   type: bool,      restore_value: true,  initial_value: "false"}   # Tastenbeleuchtung: Standard aus
  # Aktivitaet bestimmt das Tastenlayout auf dem Homescreen (wie bei Harmony).
  # 0 = TV (alles per BLE an den Google Streamer). Weitere folgen.
  - {id: activity,       type: int,       restore_value: true,  initial_value: "0"}
  - {id: sel_slot,       type: int,       restore_value: false, initial_value: "0"}   # Slot fuer "Kopplung loeschen"
  - {id: disp_timeout_s, type: int,       restore_value: true,  initial_value: "45"}  # 0 = nie ausschalten
  # 0 = aus, 1 = Bewegung (Interrupt mit Hochpassfilter), 2 = Hochheben
  # (Achsen pollen, Winkel gegen die Grundlage). Beides gleichzeitig geht
  # nicht: mit gesetztem FDS-Bit stehen GEFILTERTE Werte in den Ausgangs-
  # registern, die Schwerkraft ist herausgerechnet - und genau die braucht
  # man fuer den Neigungswinkel. Die Referenz-Firmware schaltet deshalb
  # ebenfalls zwischen zwei Chip-Konfigurationen um.
  - {id: motion_mode,    type: int,       restore_value: true,  initial_value: "1"}
  - {id: mb_x,           type: int,       restore_value: false, initial_value: "0"}
  - {id: mb_y,           type: int,       restore_value: false, initial_value: "0"}
  - {id: mb_z,           type: int,       restore_value: false, initial_value: "0"}
  - {id: disp_off,       type: bool,      restore_value: false, initial_value: "false"}
  - {id: lift_cnt,       type: int,       restore_value: false, initial_value: "0"}
  - {id: cur_key,        type: int,       restore_value: false, initial_value: "0"}
  - {id: held_key,       type: int,       restore_value: false, initial_value: "0"}
  - {id: rep_count,      type: int,       restore_value: false, initial_value: "0"}
  # Beruehrungspunkt, damit der Fokus dem Finger folgt: sonst markiert der
  # Touch das eine Feld und die Tasten laufen von einer anderen Stelle weiter -
  # es waren dann zwei Felder gleichzeitig hervorgehoben.
  - {id: touch_x,        type: int,       restore_value: false, initial_value: "0"}
  - {id: touch_y,        type: int,       restore_value: false, initial_value: "0"}
  - {id: touch_sync,     type: bool,      restore_value: false, initial_value: "false"}
  - {id: touch_active,   type: bool,      restore_value: false, initial_value: "false"}
  - {id: touch_moved,    type: bool,      restore_value: false, initial_value: "false"}
  - {id: touch_was_dark, type: bool,      restore_value: false, initial_value: "false"}
  - {id: touch_sy0,      type: int,       restore_value: false, initial_value: "0"}
  # Was oben in der Kopfzeile der Startseite sichtbar ist. Alles einzeln
  # abschaltbar unter Einstellungen -> Anzeige.
  - {id: show_ble,       type: bool,      restore_value: true,  initial_value: "true"}
  - {id: show_wifi,      type: bool,      restore_value: true,  initial_value: "true"}
  - {id: show_batt,      type: bool,      restore_value: true,  initial_value: "true"}
  - {id: show_clock,     type: bool,      restore_value: true,  initial_value: "true"}
  # Tastengesten: kurz / lang / doppelt. gest_kind 0=kurz 1=lang 2=doppelt.
  - {id: gest_key,       type: int,       restore_value: false, initial_value: "0"}
  - {id: gest_kind,      type: int,       restore_value: false, initial_value: "0"}
  - {id: gest_last_key,  type: int,       restore_value: false, initial_value: "0"}
  - {id: gest_last_ms,   type: uint32_t,  restore_value: false, initial_value: "0"}
  # Welche Gestentaste gerade gehalten wird und ob sie schon als "lang"
  # ausgeloest hat - dann darf das Loslassen nicht noch einmal feuern.
  - {id: gest_held,      type: int,       restore_value: false, initial_value: "0"}
  - {id: gest_done,      type: bool,      restore_value: false, initial_value: "false"}
  # Datenschutzschalter "Mikrofon stumm". Getrennt von der tatsaechlichen
  # Versorgung, weil die zusaetzlich dem Display folgt.
  # Feld, das nach einem D-Pad-Druck kurz blau bleiben soll.
  - {id: flash_obj,      type: "lv_obj_t *", restore_value: false, initial_value: "nullptr"}
  # Laeuft gerade eine Sprachabfrage? Nur dann bekommt das Mikrofon Strom.
  # Welcher Sprachassistent: 0 = Google (ueber den Fernseher), 1 = Home
  # Assistant (ueber die ESPHome-API).
  # Antwort des Home-Assistant-Assistenten zusaetzlich ueber die
  # Wohnzimmer-Lautsprecher ausgeben. Die Fernbedienung hat keinen eigenen.
  # Energiesparstufen, einzeln schaltbar.
  # Laeuft der Fernseher? Kommt aus Home Assistant, damit der Power-Knopf
  # gezielt ein- oder ausschaltet statt blind umzuschalten - beim Sony sind
  # turn_on und turn_off verschiedene Wege (WoL bzw. Netzwerkbefehl).
  - {id: tv_on, type: bool, restore_value: false, initial_value: "false"}

  # Laeuft gerade eine Aufnahme, die der Fernseher angefordert hat? Getrennt
  # von voice_active, damit der Tastenweg unberuehrt bleibt.
  - {id: host_mic, type: bool, restore_value: false, initial_value: "false"}

  # Mitgliederliste der Multiroom-Gruppe, so wie Home Assistant sie schickt,
  # und der Lautsprecher, den der naechste Dienstaufruf betrifft.
  - {id: grp_members, type: std::string, restore_value: false}
  - {id: grp_target,  type: std::string, restore_value: false}

  # Laedt der Akku gerade? Kommt aus dem CRATE-Register des MAX17048.
  - {id: laedt,          type: bool,      restore_value: false, initial_value: "false"}
  - {id: ps_wifi,        type: bool,      restore_value: true,  initial_value: "true"}
  - {id: ps_wifi_off,    type: bool,      restore_value: true,  initial_value: "false"}
  # CPU 80 MHz bei Display aus - spart ~4,5 %/h. Standard AN.
  - {id: ps_cpu,         type: bool,      restore_value: true,  initial_value: "true"}
  # Tiefschlaf im Ruhezustand (Einstellungen -> Energie sparen). Standard AUS.
  - {id: ps_deep,        type: bool,      restore_value: true,  initial_value: "false"}
  # BLE-Verbindung im Ruhezustand verlangsamen (Intervall 150 ms, Latency 3).
  # Halbiert den Verbrauch (-25 -> -12 %/h), kein Reconnect. Standard AN.
  - {id: ps_bleidle,     type: bool,      restore_value: true,  initial_value: "true"}
  # Nach dem Aufwachen: true = der Ruecksicherungs-Timer hat geweckt,
  # nicht ein Tastendruck. Wird nur in on_boot ausgewertet.
  - {id: woke_timer,     type: bool,      restore_value: false, initial_value: "false"}
  # millis()-Zeitpunkt, bis zu dem das WLAN im Wartungsfenster erzwungen an
  # bleibt (Fernwartung / Flashen, wenn niemand das Geraet wecken kann).
  - {id: wartung_bis,    type: uint32_t,  restore_value: false, initial_value: "0"}
  # Laeuft gerade ein OTA-Update? Dann kein WLAN abschalten und kein Tiefschlaf.
  - {id: ota_aktiv,      type: bool,      restore_value: false, initial_value: "false"}
  # ---- Sicherheitsnetz fuers Ferntesten (nie aussperren) ----
  # Testmodus AN = alle Stromspar-Funktionen, die die Erreichbarkeit kappen
  # (Tiefschlaf, "WLAN aus im Ruhezustand"), sind ausgehebelt.
  # restore_value: true, damit der Zustand ueber die Deep-Sleep-Weck-Reboots
  # erhalten bleibt (sonst kaeme der Chip nach dem ersten Wake nie wieder in
  # den Tiefschlaf). Bei einem ECHTEN Boot (nicht Deep-Sleep-Wake) wird er in
  # on_boot prio 850 zwangsweise auf AN gesetzt - siehe boot_grace.
  - {id: testmodus,      type: bool,      restore_value: true,  initial_value: "true"}
  # Erste 10 min nach JEDEM Boot: kein Tiefschlaf, kein WLAN-Aus - so gibt es
  # nach jedem Flash sicher ein Fenster, um einen Fehler wieder zu flashen.
  - {id: boot_grace,     type: bool,      restore_value: false, initial_value: "true"}
  # Wurde die Home-Assistant-API seit dem Boot schon einmal verbunden? Nur dann
  # darf ueberhaupt in den Tiefschlaf gegangen werden.
  - {id: api_ever,       type: bool,      restore_value: false, initial_value: "false"}
  - {id: tts_speaker,    type: bool,      restore_value: true,  initial_value: "false"}
  - {id: assistant,      type: int,       restore_value: true,  initial_value: "0"}
  - {id: mic_press_ms,   type: uint32_t,  restore_value: false, initial_value: "0"}
  - {id: mic_tap_ms,     type: uint32_t,  restore_value: false, initial_value: "0"}
  # Wird die Sprachtaste noch gehalten? Nach dem Mikrofon-Vorlauf wird das
  # geprueft - sonst startet eine Abfrage, nachdem schon losgelassen wurde.
  - {id: voice_want,     type: bool,      restore_value: false, initial_value: "false"}
  - {id: voice_active,   type: bool,      restore_value: false, initial_value: "false"}
  - {id: mic_allowed,    type: bool,      restore_value: true,  initial_value: "true"}
  - {id: key_was_dark,   type: bool,      restore_value: false, initial_value: "false"}
  - {id: touch_page0,    type: int,       restore_value: false, initial_value: "-1"}
  - {id: click_obj,      type: "void *",  restore_value: false, initial_value: "nullptr"}
  - {id: disp_bri,       type: int,       restore_value: true,  initial_value: "100"}
  - {id: kbd_bri,        type: int,       restore_value: true,  initial_value: "60"}
  - {id: motion_sens,    type: int,       restore_value: true,  initial_value: "1"}   # 0 hoch, 1 mittel, 2 niedrig

i2c:
  id: hauptbus
  sda: GPIO20
  scl: GPIO19
  scan: true

lis3dh:
  id: motion_chip

display:
  - platform: ili9341_i80
    id: main_display
    cs_pin: GPIO39
    dc_pin: GPIO40
    wr_pin: GPIO41
    rd_pin: GPIO42
    enable_pin: {number: GPIO38}
    invert_colors: true
    data_pins: [GPIO48, GPIO47, GPIO21, GPIO14, GPIO13, GPIO12, GPIO11, GPIO10]
    dimensions: {width: 240, height: 320}
    # Die Referenz-Firmware faehrt LovyanGFX mit 40 MHz; ihr eigenes
    # Ghost-Touch-Protokoll (Changelog 2.42/2.46) sagt aber, dass ein
    # niedrigerer Takt weniger Stoerung in den I2C-Touch-Bus einkoppelt.
    bus_frequency: 20MHz
    # update() schiebt nichts mehr zum Panel - LVGL schickt nur noch die
    # geaenderten Rechtecke ueber draw_pixels_at(). Vorher ging alle 16 ms der
    # komplette Framebuffer raus, egal ob sich etwas geaendert hatte: genau das
    # hat den Bus gesaettigt und die Bilder zerrissen.
    update_interval: 1s

touchscreen:
  - platform: ft63x6
    id: main_touch
    display: main_display
    transform:
      mirror_x: true
      mirror_y: true
    on_touch:
      # ZUERST festhalten, ob das Display dunkel war - wake_backlight setzt
      # disp_off sofort zurueck, danach waere es nicht mehr feststellbar.
      - lambda: |-
          if (id(touch_active)) return;
          id(touch_active) = true;
          id(touch_moved) = false;
          id(touch_was_dark) = id(disp_off);
          id(touch_x) = touch.x;
          id(touch_y) = touch.y;
          lv_obj_t *scr0 = lv_screen_active();
          id(touch_sy0) = scr0 ? lv_obj_get_scroll_y(scr0) : 0;
          id(touch_page0) = id(cur_page);
      - script.execute: wake_backlight
    on_update:
      - lambda: |-
          bool neu_bewegt = false;
          for (auto t : touches) {
            if (abs(t.x - id(touch_x)) > 8 || abs(t.y - id(touch_y)) > 8) {
              if (!id(touch_moved)) neu_bewegt = true;
              id(touch_moved) = true;
            }
          }
          // Sobald aus der Beruehrung ein Wischen wird, die laufende Eingabe
          // bei LVGL abbrechen. Auf scrollbaren Seiten macht LVGL daraus von
          // selbst ein Scrollen und verwirft den Klick - auf der Startseite
          // gibt es aber nichts zu scrollen, dort bleibt der Druck am Knopf
          // haengen und wird beim Abheben ausgeloest, obwohl der Finger
          // laengst woanders ist. lv_indev_reset beendet die Eingabe sauber,
          // ohne ein Klick-Ereignis zu erzeugen.
          if (neu_bewegt) {
            lv_obj_t *sc = lv_screen_active();
            if (sc != nullptr && !lv_obj_has_flag(sc, LV_OBJ_FLAG_SCROLLABLE)) {
              lv_indev_t *ind = lv_indev_get_next(nullptr);
              while (ind != nullptr) {
                if (lv_indev_get_type(ind) == LV_INDEV_TYPE_POINTER)
                  lv_indev_reset(ind, nullptr);
                ind = lv_indev_get_next(ind);
              }
            }
          }
    on_release:
      - lambda: 'id(touch_active) = false;'
output:
  - platform: ledc
    id: backlight_pwm
    pin: {number: GPIO9, inverted: true}
  - platform: ledc
    id: button_backlight_pwm
    pin: {number: GPIO46}

light:
  - platform: monochromatic
    id: display_backlight
    output: backlight_pwm
    default_transition_length: 120ms
    restore_mode: ALWAYS_ON
  - platform: monochromatic
    id: button_backlight
    output: button_backlight_pwm
    default_transition_length: 120ms
    restore_mode: ALWAYS_OFF        # Tastenbeleuchtung standardmaessig aus

interval:
  # Hochheben erkennen: Winkel zwischen aktuellem Schwerkraftvektor und der
  # Lage beim Ablegen. Nur pollen, wenn das Display aus ist und der Modus
  # aktiv ist - sonst kostet es unnoetig I2C-Verkehr.
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: "return id(disp_off) && id(motion_mode) == 2;"
          then:
            - lambda: |-
                uint8_t d[6];
                if (!id(motion_chip)->read_bytes(0x28 | 0x80, d, 6)) return;
                const float x = ((int16_t)((uint16_t) d[1] << 8 | d[0])) >> 4;
                const float y = ((int16_t)((uint16_t) d[3] << 8 | d[2])) >> 4;
                const float z = ((int16_t)((uint16_t) d[5] << 8 | d[4])) >> 4;
                const float bx = id(mb_x), by = id(mb_y), bz = id(mb_z);
                const float mb = sqrtf(bx*bx + by*by + bz*bz);
                const float mc = sqrtf(x*x + y*y + z*z);
                if (mb < 1.0f || mc < 1.0f) return;
                float cosang = (x*bx + y*by + z*bz) / (mb * mc);
                if (cosang > 1.0f) cosang = 1.0f;
                if (cosang < -1.0f) cosang = -1.0f;
                const float deg = acosf(cosang) * 57.2957795f;
                // Schwellen gesenkt (vorher 25/40/60) - beim normalen
                // Hochnehmen kippt die Fernbedienung weniger weit als
                // angenommen. Die Haltezeit von 750 ms filtert das Wackeln
                // ohnehin, der Winkel darf daher kleiner sein.
                const float lim[3] = {12.0f, 20.0f, 35.0f};
                int i = id(motion_sens);
                if (i < 0) i = 0;
                if (i > 2) i = 2;

                // Wackeln auf der Couch kippt die Fernbedienung kurz und laesst
                // sie zurueckfallen - der Winkel ist also nur einen Augenblick
                // gross. Echtes Hochnehmen HAELT die neue Lage. Deshalb erst
                // wecken, wenn die Abweichung mehrere Messungen ueberdauert
                // (3 x 250 ms = 750 ms), statt beim ersten Ausschlag.
                if (deg >= lim[i]) {
                  id(lift_cnt)++;
                  ESP_LOGD("motion", "Winkel %.0f Grad (%d/3)", deg, id(lift_cnt));
                  if (id(lift_cnt) >= 3) {
                    ESP_LOGI("motion", "Hochheben erkannt: %.0f Grad, gehalten", deg);
                    id(lift_cnt) = 0;
                    id(wake_backlight)->execute();
                  }
                } else if (id(lift_cnt) != 0) {
                  ESP_LOGD("motion", "Winkel wieder unter Schwelle (%.0f Grad) - verworfen", deg);
                  id(lift_cnt) = 0;
                }

  # Ergebnis des fruehen Leitungstests ausgeben, sobald das Log haengt.
  - interval: 1s
    then:
      # Nur aktualisieren, wenn die Uhr auch zu sehen ist. Sie bleibt zwar als
      # Platzhalter stehen, damit die Statuszeile ihre Form behaelt - aber der
      # sekuendliche Textwechsel wuerde die Flaeche jedes Mal als veraendert
      # markieren und LVGL zum Neuzeichnen zwingen, ohne dass sich sichtbar
      # etwas tut. Wenig Aufwand, aber unnoetiger.
      - if:
          condition: {lambda: "return id(show_clock);"}
          then:
            - lvgl.label.update:
                id: idle_clock
                text: !lambda |-
                  auto t = id(sntp_time).now();
                  if (!t.is_valid()) return std::string("--:--");
                  char b[6]; snprintf(b,sizeof(b),"%02d:%02d",t.hour,t.minute);
                  return std::string(b);

  # Wartungsfenster: stuendlich das WLAN kurz erzwingen (falls Stufe 2 es
  # abgeschaltet hat) - damit Home Assistant einmal pro Stunde den Akkustand
  # bekommt und es ein OTA-Fenster gibt. Externe WLAN-Erreichbarkeit ist sonst
  # nicht noetig (bewusste Entscheidung). Im Tiefschlaf laeuft dieser Timer NICHT.
  - interval: 60min
    then:
      - if:
          condition:
            lambda: 'return id(disp_off) && !id(ota_aktiv);'
          then:
            - script.execute: wartungsfenster

  # Tiefschlaf-Sicherheitsnetz: backlight_idle_timeout ist der EINZIGE Weg in
  # den Deep-Sleep, wird aber nur bei bestimmten Ereignissen angestossen (Boot,
  # wake_backlight, Schalter). Nach einem Wartungsfenster, einem Ladekabel-
  # Abziehen oder einer Sprachabfrage bleibt das Geraet sonst wach im
  # Ruhezustand haengen (Config D, ~90 mA) und prueft den Tiefschlaf nie wieder.
  # Dieser Timer stösst die Schlaf-Sequenz alle 4 min neu an - aber nur wenn
  # sie NICHT ohnehin schon laeuft (sonst wuerde der 90-s-Countdown darin immer
  # wieder zurueckgesetzt).
  - interval: 4min
    then:
      - if:
          condition:
            and:
              - not: {script.is_running: backlight_idle_timeout}
              - lambda: 'return id(disp_off) && id(disp_timeout_s) > 0 && id(ps_deep) && !id(testmodus) && !id(boot_grace) && !id(charger_present).state && !id(laedt) && !id(voice_active) && !id(host_mic) && !id(tv_on) && !id(ota_aktiv);'
          then:
            - script.execute: backlight_idle_timeout

script:
  - id: backlight_idle_timeout
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t) id(disp_timeout_s) * 1000;'
      - light.turn_off: display_backlight
      - light.turn_off: button_backlight
      - globals.set: {id: disp_off, value: "true"}
      - globals.set: {id: lift_cnt, value: "0"}
      # Reine Anzeigewerte anhalten, solange niemand hinschaut. Das gilt
      # unabhaengig von den Sparstufen - es waere auch sonst unsinnig, alle paar
      # Sekunden etwas zu messen, das kein Display zeigt. Der Akkustand laeuft
      # weiter: den will Home Assistant wissen, und einmal pro Minute faellt
      # nicht ins Gewicht.
      # Die BLE-Empfangsstaerke fragt die Tastatur-Komponente selbst ab, nicht
      # der Sensor - component.suspend greift dort nicht. Stattdessen das
      # Intervall auf eine Stunde setzen, das haelt sie praktisch an.
      - lambda: 'id(kb).set_rssi_update_interval(3600000);'
      - component.suspend: wifi_rssi
      - component.suspend: ble_host_txt
      # Stufe 2: WLAN aus, solange das Display schlaeft. Als Bluetooth-
      # Fernbedienung bleibt sie voll benutzbar - aber fuer Home Assistant und
      # fuer das Flashen ist sie in dieser Zeit nicht erreichbar.
      #
      # Genau daran scheiterte der Home-Assistant-Assistent: der laeuft ueber
      # die API, und ohne WLAN gibt es keine API. Google merkte davon nichts,
      # weil es reines Bluetooth ist.
      # FRUEHER: solange Home Assistant als Assistent gewaehlt war, ruhte diese
      # Stufe komplett. Auf Wunsch entfernt - der HA-Assistent wird ohnehin nur
      # bei wachem Display benutzt, und `voice_start` weckt zuerst (schaltet
      # WLAN wieder ein) und wartet bis zu 8 s auf die API, bevor es die Abfrage
      # startet. WLAN darf also auch bei HA-Assistent im Ruhezustand aus.
      # Stufe 2: WLAN aus - ABER nur wenn NICHT Tiefschlaf gewaehlt ist. Sonst
      # wuerde das WLAN abgeschaltet BEVOR unten der Tiefschlaf-Check laeuft,
      # und der scheiterte dann an "keine API-Verbindung". Mit ps_deep bleibt
      # das WLAN an, bis der Chip in den Deep-Sleep geht (dort geht eh alles aus).
      - if:
          condition:
            lambda: "return id(ps_wifi_off) && !id(ps_deep) && !id(testmodus) && !id(boot_grace) && (int32_t)(millis() - id(wartung_bis)) >= 0 && !id(ota_aktiv);"
          then: [{wifi.disable:}]
      - script.execute: capture_baseline
      # Prozessortakt jetzt (disp_off ist true) auf 80 MHz, wenn "Prozessor
      # drosseln" aktiv ist.
      - script.execute: apply_cpu
      # Angehalten sieht LVGL die Beruehrung nicht - der erste Tipp weckt also
      # nur, statt gleich etwas auszuloesen.
      - lvgl.pause:
      # Nach dem Merk-Fenster auch aus dem Menue heraus, damit man beim
      # naechsten Aufwecken auf der Startseite landet.
      - delay: 10s
      - if:
          condition: {lambda: "return id(disp_off);"}
          then:
            - lvgl.resume:
            - script.execute: go_home
            - lvgl.widget.redraw:
            - delay: 400ms
            - lvgl.pause:
      # BLE-Verbindung verlangsamen: Intervall 150 ms + Slave-Latency 3, damit
      # der Funk im Leerlauf nur ~alle 600 ms statt alle 15 ms aufwacht. Der
      # HID-Link bleibt - ein Tastendruck geht beim naechsten Event raus.
      # NICHT waehrend einer Sprachabfrage. ~11 s nach Display-aus (die
      # Referenz wartet 2,5 s; Renegotiation direkt im Uebergang blockt GAP).
      - if:
          condition:
            lambda: 'return id(disp_off) && id(ps_bleidle) && !id(voice_active) && !id(host_mic);'
          then:
            - lambda: 'id(kb).request_conn_profile(true);'
      # -------- Tiefschlaf (Einstellungen -> Energie sparen) --------
      # Nach weiteren 90 s ohne Aktivitaet geht der Chip in den Deep-Sleep.
      # NICHT am Ladekabel, nicht waehrend einer Sprachabfrage und nicht bei
      # laufendem Fernseher. Der erste Tastendruck weckt danach nur (Reconnect
      # ~3 s), erst der zweite loest aus - deshalb ist der Schalter Standard AUS.
      # Ist der Schalter aus, passiert hier gar nichts.
      # Deadman jetzt ueber api_ever (irgendwann seit Boot verbunden) statt
      # api.connected (gerade verbunden) - sonst blockiert die Stufe-2-
      # Abschaltung oben den Tiefschlaf. Sicherheit bleibt ueber boot_grace +
      # "ans Ladekabel legen weckt".
      - if:
          condition:
            lambda: 'return id(ps_deep) && !id(testmodus) && !id(boot_grace) && id(api_ever) && !id(laedt) && !id(charger_present).state && !id(voice_active) && !id(host_mic) && !id(tv_on) && !id(ota_aktiv) && (int32_t)(millis() - id(wartung_bis)) >= 0;'
          then:
            - delay: 90s
            - if:
                condition:
                  lambda: 'return id(disp_off) && id(ps_deep) && !id(testmodus) && !id(boot_grace) && id(api_ever) && !id(laedt) && !id(charger_present).state && !id(voice_active) && !id(host_mic) && !id(tv_on) && !id(ota_aktiv) && (int32_t)(millis() - id(wartung_bis)) >= 0;'
                then:
                  - lambda: 'ESP_LOGI("schlaf", "Tiefschlaf: 90 s ohne Aktivitaet - Deep-Sleep (Wecken: Taste/Bewegung/Ladekabel, Timer 6 h)");'
                  - script.execute: deep_sleep_powerdown
                  - lambda: 'g_deep_active = 0x5EEEu;'
                  - deep_sleep.enter:
                      id: nachtschlaf

  # Peripherie-Vorbereitung fuer den Deep-Sleep - nach dem Rev6-Vorbild der
  # Original-Firmware (sleep_hal_esp32.cpp / enterSleep()).
  #
  # WICHTIG: dieses Script darf NICHT yielden (kein `- delay:`), sonst laeuft
  # der Aufrufer (g_deep_active + deep_sleep.enter) los, BEVOR die Rail
  # abgeschaltet ist. Solange alles synchron ist, fuehrt script.execute das
  # Script komplett aus, bevor die naechste Aktion drankommt - und zwischen
  # "Rail aus" und esp_deep_sleep_start() laeuft dann KEIN Component-loop()
  # mehr, der auf den pull-up-losen I2C-Bus pollen und haengenbleiben koennte
  # (eine beobachtete Absturz-Ursache). Settle-Zeiten daher als blockierendes
  # delay() in der Lambda.
  #
  # Rev6-Power-Architektur:
  #   +VSW  = +3.3V ueber Q4 (P-MOSFET), Gate an GPIO38 (LCD_EN) + R26 10k->+3.3V.
  #           GPIO38 HIGH/Hi-Z -> Q4 AUS -> Panel, Touch-Controller, die
  #           I2C-Pull-ups R11/R12 und (analog, Q7) microSD sind stromlos.
  #   +3.3V = Dauerstrom: TCA8418 (Keypad) + LIS3DH (Accel) bleiben an ->
  #           Wecken ueber GPIO8 / GPIO2 funktioniert.
  - id: deep_sleep_powerdown
    then:
      # Funk aus (BT geht mit esp_deep_sleep_start() sowieso vollstaendig aus).
      - wifi.disable:
      - script.execute: apply_mic_power        # MIC_VDD (GPIO45) aus
      - component.suspend: main_touch          # ft63x6 pollt nicht mehr
      - light.turn_off: display_backlight
      - light.turn_off: button_backlight
      - lambda: |-
          // --- 1. LIS3DH fuer den Bewegungs-Weck-Interrupt (Bus noch versorgt) ---
          uint64_t mask = (1ULL << 8);   // GPIO8 = TCA8418-INT (HW-Pull-up R36)
          if (id(motion_mode) != 0) {
            id(motion_chip)->write_byte(0x20, 0x2F);   // CTRL_REG1: 10 Hz Low-Power, XYZ
            id(motion_chip)->write_byte(0x21, 0x09);   // CTRL_REG2: HPIS1 + FDS (Hochpass -> INT1)
            id(motion_chip)->write_byte(0x23, 0x80);   // CTRL_REG4: BDU
            id(motion_chip)->write_byte(0x24, 0x00);   // CTRL_REG5: kein Latch
            id(motion_chip)->write_byte(0x25, 0x02);   // CTRL_REG6: INT-Polaritaet aktiv-LOW
            const uint8_t thr[3] = {0x10, 0x20, 0x30};
            int si = id(motion_sens); if (si < 0) si = 0; if (si > 2) si = 2;
            id(motion_chip)->write_byte(0x32, thr[si]); // INT1_THS
            id(motion_chip)->write_byte(0x33, 0x02);    // INT1_DURATION (~2/ODR)
            uint8_t dmy = 0;
            id(motion_chip)->read_byte(0x26, &dmy);     // REFERENCE lesen -> Nulllage
            id(motion_chip)->read_byte(0x31, &dmy);     // INT1_SRC lesen -> Latch klaeren
            id(motion_chip)->write_byte(0x30, 0x2A);    // INT1_CFG: X/Y/Z high, OR
            id(motion_chip)->write_byte(0x22, 0x40);    // CTRL_REG3: AOI1 -> INT1
            mask |= (1ULL << 2);                        // GPIO2 = LIS3DH INT1
          }

          // --- 2. Verbraucher auf +VSW / Sonderpfade abschalten ---
          const gpio_num_t lcd_ctrl[] = { GPIO_NUM_39, GPIO_NUM_40, GPIO_NUM_41, GPIO_NUM_42 };
          const gpio_num_t lcd_data[] = { GPIO_NUM_48, GPIO_NUM_47, GPIO_NUM_21, GPIO_NUM_14,
                                          GPIO_NUM_13, GPIO_NUM_12, GPIO_NUM_11, GPIO_NUM_10 };
          for (auto p : lcd_ctrl) { gpio_set_direction(p, GPIO_MODE_OUTPUT); gpio_set_level(p, 0); }
          for (auto p : lcd_data) { gpio_set_direction(p, GPIO_MODE_OUTPUT); gpio_set_level(p, 0); }
          // LCD_EN (GPIO38) HIGH treiben -> Q4 sicher AUS -> +VSW weg. Ab hier
          // hat der I2C-Bus keine Pull-ups mehr - keine I2C-Zugriffe mehr!
          gpio_set_direction(GPIO_NUM_38, GPIO_MODE_OUTPUT); gpio_set_level(GPIO_NUM_38, 1);
          // Display-Backlight-PWM (GPIO9, invertiert -> HIGH = aus).
          gpio_set_direction(GPIO_NUM_9, GPIO_MODE_OUTPUT);  gpio_set_level(GPIO_NUM_9, 1);
          // Tasten-Backlight (GPIO46) aus.
          gpio_set_direction(GPIO_NUM_46, GPIO_MODE_OUTPUT); gpio_set_level(GPIO_NUM_46, 0);
          // microSD: SD_EN (GPIO16) HIGH -> Q7 AUS -> Karte stromlos.
          gpio_set_direction(GPIO_NUM_16, GPIO_MODE_OUTPUT); gpio_set_level(GPIO_NUM_16, 1);
          // IR-Empfaenger: IR_VCC (GPIO6) LOW -> TSSP77038 stromlos.
          // IR-Sender:     IR_LED (GPIO5) HIGH -> Q5 (P-MOSFET) AUS -> IR-Dioden
          //                D2/D5 von +3.3V getrennt (R20 10k haelt das Gate eh
          //                oben, wir setzen es nur sauber).
          // IR_RX (GPIO4) hochohmig -> kein Querstrom in den toten Empfaenger
          // (Referenz: sonst ~60 uA).
          gpio_set_direction(GPIO_NUM_6, GPIO_MODE_OUTPUT); gpio_set_level(GPIO_NUM_6, 0);
          gpio_set_direction(GPIO_NUM_5, GPIO_MODE_OUTPUT); gpio_set_level(GPIO_NUM_5, 1);
          gpio_reset_pin(GPIO_NUM_4);
          // I2C-Pins (GPIO19/20) vom Bus loesen und hochohmig: der Touch-
          // Controller haengt an +VSW (jetzt tot) - keine internen Pull-ups
          // sollen ueber seine ESD-Dioden die tote Rail speisen.
          gpio_reset_pin(GPIO_NUM_19);
          gpio_reset_pin(GPIO_NUM_20);

          // --- 3. Schalt-/Power-Pins ueber den Schlaf HALTEN ---
          // (Referenz: "Force display pins to high impedance / gpio_hold_en -
          //  ohne das wacht das Display evtl. nicht auf.")
          gpio_hold_en(GPIO_NUM_38);   // LCD_EN -> Q4 (Display/Touch/+VSW/I2C-Pullups) aus
          gpio_hold_en(GPIO_NUM_9);    // LCD_BL -> Q3 (Display-Backlight von +3.3V) aus
          gpio_hold_en(GPIO_NUM_16);   // SD_EN  -> Q7 (microSD) aus
          gpio_hold_en(GPIO_NUM_6);    // IR_VCC      (IR-Empfaenger TSSP77038) aus
          gpio_hold_en(GPIO_NUM_5);    // IR_LED -> Q5 (IR-Sendedioden von +3.3V) aus
          // GPIO46 (SW_BL) NICHT halten - Strapping-Pin. Nur LOW getrieben,
          // im Schlaf hochohmig (Tasten-Backlight ist dann ohnehin aus).
          gpio_deep_sleep_hold_en();

          // --- 4. Weckquellen scharf: ext1 ANY_LOW ---
          // GPIO1 (TP4056 ~CHRG) hat KEINEN HW-Pull-up -> interner RTC-Pull-up,
          // damit "nicht am Laden" sicher HIGH ist; im Schlaf gehalten.
          rtc_gpio_init(GPIO_NUM_1);
          rtc_gpio_set_direction(GPIO_NUM_1, RTC_GPIO_MODE_INPUT_ONLY);
          rtc_gpio_pulldown_dis(GPIO_NUM_1);
          rtc_gpio_pullup_en(GPIO_NUM_1);
          rtc_gpio_hold_en(GPIO_NUM_1);
          // GPIO1 NUR als Weckquelle scharf schalten, wenn KEIN Kabel dran ist.
          // Bei angestecktem Kabel wuerde ANY_LOW das Geraet sofort wieder
          // wecken - Endlosschleife. Die Tiefschlaf-Bedingung oben verhindert
          // das eigentlich schon (!charger_present), doppelt haelt besser.
          const bool gpio1_frei = !id(charger_present).state;
          if (gpio1_frei) mask |= (1ULL << 1);
          esp_sleep_enable_ext1_wakeup(mask, ESP_EXT1_WAKEUP_ANY_LOW);
          ESP_LOGI("schlaf", "ext1 scharf: mask=0x%llx (GPIO8 Taste%s%s)",
                   (unsigned long long) mask,
                   id(motion_mode) ? " + GPIO2 Bewegung" : "",
                   gpio1_frei ? " + GPIO1 Ladekabel" : " [GPIO1 aktiv - nicht scharf]");
          // Rail + Pegel setzen lassen, bevor esp_deep_sleep_start() folgt
          // (Referenz: delay(100) vor dem Schlaf).
          delay(80);
  - id: wake_backlight
    mode: restart
    then:
      # Ein Weckereignis (Taste, Bewegung, HA) bricht ein laufendes
      # Timer-Nickerchen ab - dann bleibt das Geraet wach.
      - script.stop: timer_nickerchen
      - globals.set: {id: disp_off, value: "false"}
      # BLE-Verbindung wieder auf das schnelle HID-Profil, Takt zurueck auf voll.
      - lambda: 'id(kb).request_conn_profile(false);'
      - script.execute: apply_cpu
      - lambda: 'id(kb).set_rssi_update_interval(3000);'
      - component.resume: wifi_rssi
      - component.resume: ble_host_txt
      - if:
          condition: {lambda: "return id(ps_wifi_off);"}
          then: [{wifi.enable:}]
      - lvgl.resume:
      - lvgl.widget.redraw:
      - light.turn_on:
          id: display_backlight
          brightness: !lambda 'return id(disp_bri) / 100.0f;'
      - if:
          condition: {lambda: "return id(kbd_light_on);"}
          then:
            - light.turn_on:
                id: button_backlight
                brightness: !lambda 'return id(kbd_bri) / 100.0f;'
      # 0 = nie abschalten: dann gar keinen Ablauf starten, statt mit
      # Verzoegerung 0 sofort wieder auszuschalten.
      - if:
          condition: {lambda: "return id(disp_timeout_s) > 0;"}
          then:  [{script.execute: backlight_idle_timeout}]
          else:  [{script.stop: backlight_idle_timeout}]

  # Timer-Wake aus dem Tiefschlaf (alle 6 h, nicht per Taste). Wie die
  # OMOTE-Referenz: das Geraet meldet sich NICHT regelmaessig im WLAN, es
  # nutzt den seltenen Timer-Wake nur, um kurz die Uhr per NTP nachzuziehen
  # und - falls WLAN in ~25 s da ist - den Akkustand zu melden. Dann sofort
  # zurueck in den Tiefschlaf. Kein Deadman: einen Fehler-Flash faengt die
  # 10-min-Boot-Schonfrist ab (Testmodus wird dann erzwungen), und "ans
  # Ladekabel legen" weckt jederzeit fuer ein OTA-Fenster.
  # Ein Tastendruck ruft wake_backlight -> stoppt dieses Script -> bleibt wach.
  - id: timer_nickerchen
    then:
      - delay: 25s
      - script.execute: refresh_laden
      - delay: 500ms
      - if:
          condition:
            lambda: 'return id(ps_deep) && !id(testmodus) && !id(laedt) && !id(charger_present).state && !id(voice_active) && !id(host_mic) && !id(ota_aktiv);'
          then:
            - lambda: |-
                ESP_LOGI("schlaf", "Timer-Wake vorbei (~25 s) - zurueck in den Tiefschlaf");
                g_deep_active = 0x5EEEu;
            - script.execute: deep_sleep_powerdown
            - deep_sleep.enter:
                id: nachtschlaf
          else:
            - lambda: 'ESP_LOGW("schlaf", "Timer-Wake: Bedingung nicht erfuellt - bleibe wach");'
            - script.execute: wake_backlight

  # Wartungsfenster: WLAN fuer 5 min erzwingen (Fernwartung / OTA). Wird vom
  # stuendlichen Interval angestossen, wenn das Display aus ist. mode: restart, damit
  # ein neuer Anstoss das Fenster verlaengert statt zu stapeln.
  - id: wartungsfenster
    mode: restart
    then:
      - lambda: |-
          id(wartung_bis) = millis() + 180000UL;
          ESP_LOGI("wartung", "Wartungsfenster: WLAN 3 min erzwungen an");
      - wifi.enable:
      - delay: 180s
      - lambda: 'id(wartung_bis) = millis();'
      - if:
          condition:
            lambda: 'return id(disp_off) && id(ps_wifi_off) && !id(testmodus) && !id(boot_grace) && !id(ota_aktiv);'
          then:
            - lambda: 'ESP_LOGI("wartung", "Wartungsfenster vorbei - WLAN wieder aus");'
            - wifi.disable:

  # 10-min-Boot-Schonfrist: nach jedem echten Boot (auch nach jedem OTA-Reboot)
  # sind Tiefschlaf und WLAN-Aus fuer 10 min gesperrt. So gibt es nach jedem
  # Flash sicher ein Fenster, um einen Fehler zu korrigieren. Nach dem Aufwachen
  # aus dem Tiefschlaf ist boot_grace schon in on_boot auf false gesetzt.
  - id: boot_grace_timer
    then:
      - if:
          condition: {lambda: 'return id(boot_grace);'}
          then:
            - lambda: 'ESP_LOGI("test", "Boot-Schonfrist: 10 min kein Tiefschlaf / kein WLAN-Aus");'
            - delay: 600s
            - globals.set: {id: boot_grace, value: "false"}
            - lambda: 'ESP_LOGI("test", "Boot-Schonfrist vorbei");'
            - script.execute: backlight_idle_timeout

  # Empfindlichkeit der Bewegungserkennung: INT1_THS (0x32) des LIS3DH.
  # Kleinerer Wert = empfindlicher. Wird direkt ins Register geschrieben,
  # damit die Aenderung sofort greift und nicht erst nach einem Neustart.
  # Liest den tatsaechlichen Zustand der vier Host-Slots aus dem
  # BLE-Component (get_host_slot(n).occupied) - nicht nur, was zuletzt
  # angetippt wurde.
  - id: apply_brightness
    then:
      - light.turn_on:
          id: display_backlight
          brightness: !lambda 'return id(disp_bri) / 100.0f;'
      - if:
          condition: {lambda: "return id(kbd_light_on);"}
          then:
            - light.turn_on:
                id: button_backlight
                brightness: !lambda 'return id(kbd_bri) / 100.0f;'
      - lvgl.label.update: {id: disp_bri_lbl, text: !lambda 'char b[8]; snprintf(b,sizeof(b),"%d%%", id(disp_bri)); return std::string(b);'}
      - lvgl.label.update: {id: kbd_bri_lbl,  text: !lambda 'char b[8]; snprintf(b,sizeof(b),"%d%%", id(kbd_bri));  return std::string(b);'}
      - lvgl.slider.update: {id: disp_bri_sld, value: !lambda 'return id(disp_bri);'}
      - lvgl.slider.update: {id: kbd_bri_sld,  value: !lambda 'return id(kbd_bri);'}

  - id: apply_disp_timeout
    then:
      - lambda: |-
          // Slider auf die passende Stufe stellen und den Klartext darueber
          // setzen. Der Slider selbst kennt nur 0..5.
          const int t = id(disp_timeout_s);
          lv_slider_set_value(id(to_sld), t, LV_ANIM_OFF);
          char b[16];
          if (t == 0)        snprintf(b, sizeof(b), "Nie");
          else if (t < 60)   snprintf(b, sizeof(b), "%d s", t);
          else if (t % 60 == 0) snprintf(b, sizeof(b), "%d min", t / 60);
          else               snprintf(b, sizeof(b), "%d:%02d min", t / 60, t % 60);
          lv_label_set_text(id(to_val_lbl), b);
      - lvgl.label.update:
          id: disp_to_lbl
          text: !lambda |-
            int t = id(disp_timeout_s);
            if (t == 0) return std::string("Nie");
            if (t >= 60) { char b[12]; snprintf(b,sizeof(b),"%d min", t/60); return std::string(b); }
            char b[12]; snprintf(b,sizeof(b),"%d s", t); return std::string(b);
      - script.execute: wake_backlight

  - id: apply_motion_on
    then:
      - lambda: |-
          lv_obj_t *mk[3] = {id(mm_0_mk), id(mm_1_mk), id(mm_2_mk)};
          for (int i = 0; i < 3; i++)
            lv_label_set_text(mk[i], i == id(motion_mode) ? "AKTIV" : " ");
      - lvgl.label.update:
          id: motion_on_lbl
          text: !lambda |-
            switch (id(motion_mode)) {
              case 1:  return std::string("Bewegung");
              case 2:  return std::string("Hochheben");
              default: return std::string("AUS");
            }
      - lvgl.label.update:
          id: motion_on_lbl
          text_color: !lambda 'return id(motion_mode) ? lv_color_hex(0x22C55E) : lv_color_hex(0x8B94A3);'
      - lvgl.label.update:
          id: motion_mode_lbl
          text: !lambda |-
            switch (id(motion_mode)) {
              case 1:  return std::string("Bewegung");
              case 2:  return std::string("Hochheben");
              default: return std::string("AUS");
            }
      - lvgl.label.update:
          id: motion_mode_lbl
          text_color: !lambda 'return id(motion_mode) ? lv_color_hex(0x22C55E) : lv_color_hex(0x8B94A3);'

  # Aktivitaet 0 = Google Streamer (BLE-Platz 1), 1 = TV (BLE-Platz 2).
  # Die Aktivitaet bestimmt, an WELCHES Geraet das D-Pad geht - deshalb
  # schaltet sie den BLE-Host gleich mit um.
  - id: apply_activity
    then:
      - lambda: |-
          const int a = id(activity);
          if ((int) id(kb).active_host_slot() != a) {
            char act[24];
            snprintf(act, sizeof(act), "switch_host:%d", a);
            id(kb).execute_action(act);
          }
          // Aktivitaet 0 = Streamer (Platz 1), 1 = TV (Platz 2),
          // 2 = Tablet Wohnzimmer (Platz 3).
          lv_obj_t *b[3] = {id(home_act_0), id(home_act_1), id(home_act_2)};
          for (int i = 0; i < 3; i++) {
            if (i == a) {
              lv_obj_set_style_bg_color(b[i], lv_color_hex(0x3B82F6), LV_PART_MAIN);
              lv_obj_set_style_text_color(b[i], lv_color_hex(0xF1F3F5), LV_PART_MAIN);
            } else {
              lv_obj_set_style_bg_color(b[i], lv_color_hex(0x1A1F27), LV_PART_MAIN);
              lv_obj_set_style_text_color(b[i], lv_color_hex(0x8B94A3), LV_PART_MAIN);
            }
          }
          // Dieselbe Auswahl auf der Menueseite markieren.
          lv_obj_t *mk[3] = {id(akt_str_mk), id(akt_tv_mk), id(akt_tab_mk)};
          for (int i = 0; i < 3; i++)
            lv_label_set_text(mk[i], i == a ? "AKTIV" : " ");

  # Balkenanzeige oben rechts. Getrennt = alle drei dunkel. Verbunden = so
  # viele Balken blau, wie die Empfangsstaerke hergibt; die restlichen bleiben
  # als Umriss sichtbar, damit man sieht, dass es drei sein koennten.
  # Die Breite aus dem YAML kommt bei den Reglern nicht an - gemessen wurden
  # 260 px, obwohl 180 bzw. 30 eingetragen sind. Deshalb hier zur Laufzeit
  # setzen, wo nichts mehr dazwischengeraet. Ausserdem den Startseiten-Regler
  # sicher ausblenden; auch "hidden: true" im YAML hat nicht gegriffen.
  - id: fix_slider_geometry
    then:
      - lambda: |-
          lv_obj_t *waag[4] = {id(disp_bri_sld), id(kbd_bri_sld),
                               id(to_sld), id(ms_sld)};
          for (int i = 0; i < 4; i++) {
            lv_obj_set_width(waag[i], 180);
            lv_obj_set_height(waag[i], 26);
            // Mittig statt linksbuendig: die Seite ist 216 breit, der Regler
            // 180 - also 18 auf jede Seite. Sonst klebte der Knopf am linken
            // Rand und rechts blieb eine grosse Luecke.
            lv_obj_set_style_margin_left(waag[i], 18, LV_PART_MAIN);
            lv_obj_set_style_margin_right(waag[i], 18, LV_PART_MAIN);
          }
          // Hochkant: Hoehe deutlich groesser als Breite, daran erkennt LVGL
          // die Ausrichtung.
          lv_obj_set_width(id(home_bri_sld), 30);
          lv_obj_set_height(id(home_bri_sld), 176);
          lv_obj_align(id(home_bri_sld), LV_ALIGN_RIGHT_MID, -6, 6);
          lv_obj_add_flag(id(home_bri_sld), LV_OBJ_FLAG_HIDDEN);

  # Mikrofon-Versorgung = erlaubt UND Display wach. Die LED an MIC_VDD leuchtet
  # sonst rund um die Uhr, und Mikrofon plus LED ziehen zusammen rund 2,5 mA -
  # auf einem Akkugeraet Verschwendung, solange es nur herumliegt. Erst beim
  # Sprechen einzuschalten waere sparsamer, wuerde aber die ersten Silben
  # abschneiden: ein MEMS-Mikrofon braucht nach dem Einschalten Anlaufzeit.
  - id: apply_mic_power
    then:
      - if:
          condition:
            lambda: "return id(mic_allowed) && id(voice_active);"
          then:  [{switch.turn_on:  mic_power}]
          else:  [{switch.turn_off: mic_power}]

  - id: hide_bri_overlay
    mode: restart
    then:
      - delay: 4s
      - lambda: 'lv_obj_add_flag(id(home_bri_sld), LV_OBJ_FLAG_HIDDEN);'

  # Schliesst die Helligkeits-Ueberlagerung, sobald irgendwo anders getippt
  # wird - vorher blieb sie bis zum Ablauf der vier Sekunden stehen.
  - id: close_bri_overlay
    then:
      - lambda: 'lv_obj_add_flag(id(home_bri_sld), LV_OBJ_FLAG_HIDDEN);'

  - id: toggle_bri_overlay
    then:
      - lambda: |-
          lv_obj_t *o = id(home_bri_sld);
          if (lv_obj_has_flag(o, LV_OBJ_FLAG_HIDDEN)) {
            lv_slider_set_value(o, id(disp_bri), LV_ANIM_OFF);
            lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
            lv_obj_move_foreground(o);
          } else {
            lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          }
      - script.execute: hide_bri_overlay

  - id: refresh_wifi_bars
    then:
      - lambda: |-
          lv_obj_t *b[3] = {id(wifi_bar0), id(wifi_bar1), id(wifi_bar2)};
          const float r = id(wifi_rssi).state;   // dBm
          int an = 0;
          if (!std::isnan(r)) {
            an = 1;
            if (r > -60.0f) an = 3;
            else if (r > -75.0f) an = 2;
          }
          for (int i = 0; i < 3; i++)
            lv_obj_set_style_bg_color(b[i],
              lv_color_hex(i < an ? 0x22C55E : 0x2A3340), LV_PART_MAIN);

  # Sichtbarkeit der vier Kopfzeilen-Elemente anwenden.
  - id: apply_show
    then:
      - lambda: |-
          // Balken und Akku sitzen in einem eigenen, rechtsbuendigen Rahmen -
          // die duerfen aus der Anordnung verschwinden, der Rest rutscht dann
          // sauber nach.
          struct { lv_obj_t *o; bool an; } e[3] = {
            {id(ble_bars),  id(show_ble)},
            {id(wifi_bars), id(show_wifi)},
            {id(lbl_batt),  id(show_batt)},
          };
          for (int i = 0; i < 3; i++) {
            if (e[i].an) lv_obj_remove_flag(e[i].o, LV_OBJ_FLAG_HIDDEN);
            else         lv_obj_add_flag(e[i].o, LV_OBJ_FLAG_HIDDEN);
          }
          // Die Uhr NICHT ausblenden, sondern nur unsichtbar machen. Die Zeile
          // verteilt ihre beiden Haelften auf die volle Breite; faellt die Uhr
          // aus der Anordnung, ist die rechte Haelfte die einzige und rutscht
          // nach links. Mit Deckkraft 0 behaelt sie ihren Platz.
          lv_obj_set_style_opa(id(idle_clock),
            id(show_clock) ? LV_OPA_COVER : LV_OPA_TRANSP, LV_PART_MAIN);
          lv_obj_t *m[4] = {id(sh_ble_lbl), id(sh_wifi_lbl), id(sh_batt_lbl), id(sh_clock_lbl)};
          bool v[4] = {id(show_ble), id(show_wifi), id(show_batt), id(show_clock)};
          for (int i = 0; i < 4; i++) {
            lv_label_set_text(m[i], v[i] ? "AN" : "AUS");
            lv_obj_set_style_text_color(m[i],
              lv_color_hex(v[i] ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          }

  - id: refresh_ble_bars
    then:
      - lambda: |-
          lv_obj_t *b[3] = {id(ble_bar0), id(ble_bar1), id(ble_bar2)};
          int an = 0;
          if (id(ble_paired).state) {
            const float r = id(ble_rssi).state;   // dBm, typisch -40 bis -95
            an = 1;
            if (!std::isnan(r)) {
              if (r > -70.0f) an = 3;
              else if (r > -85.0f) an = 2;
            }
          }
          for (int i = 0; i < 3; i++)
            lv_obj_set_style_bg_color(b[i],
              lv_color_hex(i < an ? 0x3B82F6 : 0x2A3340), LV_PART_MAIN);

  - id: refresh_ble_slots
    then:
      - lambda: |-
          lv_obj_t *lbl[4] = {id(ble_slot0_lbl), id(ble_slot1_lbl),
                              id(ble_slot2_lbl), id(ble_slot3_lbl)};
          const bool conn = id(ble_paired).state;
          static const char *names[4] = {"Google Streamer", "Sony TV", "Tablet Wohnzimmer", "Slot 4"};
          {
            char hdr[48];
            snprintf(hdr, sizeof(hdr), "Aktion für:  %d  %s",
                     id(sel_slot) + 1, names[id(sel_slot) & 3]);
            lv_label_set_text(id(ble_target_lbl), hdr);
          }
          for (int k = 0; k < 4; k++) {
            const bool occ = id(kb).get_host_slot(k).occupied;
            const bool sel = (k == id(sel_slot));
            // conn ist der GLOBALE Verbindungszustand. Frueher stand er an
            // jedem gewaehlten Slot - also auch "Frei · VERBUNDEN" an einem
            // Slot, der nie gekoppelt war. Verbunden kann immer nur der aktive
            // Slot sein, und nur wenn er ueberhaupt belegt ist.
            const bool active = (k == id(kb).active_host_slot());
            std::string t = occ ? std::string("Gekoppelt") : std::string("Frei");
            if (occ && active && conn) t += "  ·  VERBUNDEN";
            if (sel)                   t += "  ·  GEWÄHLT";
            lv_label_set_text(lbl[k], t.c_str());
            lv_obj_set_style_text_color(lbl[k],
                lv_color_hex(occ && active && conn ? 0x22C55E
                                                  : (occ ? 0xF1F3F5 : 0x8B94A3)),
                LV_PART_MAIN);
            // Gewaehlter Slot bekommt einen gruenen Grund. Der Fokusrahmen
            // bleibt blau - so sieht man beide Zustaende gleichzeitig und
            // verwechselt "worauf stehe ich" nicht mit "was ist gewaehlt".
            lv_obj_t *row_obj[4] = {id(ble_slot0), id(ble_slot1),
                                    id(ble_slot2), id(ble_slot3)};
            lv_obj_set_style_bg_color(row_obj[k],
                lv_color_hex(sel ? 0x14532D : 0x1A1F27), LV_PART_MAIN);
          }


  - id: apply_motion_sens
    then:
      - lambda: |-
          int i = id(motion_sens);
          if (i < 0) i = 0;
          if (i > 2) i = 2;
          const int m = id(motion_mode);

          if (m == 2) {
            // Hochheben: ungefilterte Achsen, kein Interrupt.
            // CTRL_REG1 0x3F = 25 Hz Low-Power, alle Achsen an.
            id(motion_chip)->write_byte(0x20, 0x3F);
            id(motion_chip)->write_byte(0x21, 0x00);  // kein Hochpass -> Schwerkraft bleibt
            id(motion_chip)->write_byte(0x22, 0x00);  // INT1 aus
            id(motion_chip)->write_byte(0x30, 0x00);
            id(motion_chip)->write_byte(0x23, 0x80);  // BDU
          } else {
            // Bewegung: Hochpass in den Interruptgenerator, INT1 auf GPIO2.
            const uint8_t thr[3] = {0x08, 0x10, 0x20};
            id(motion_chip)->write_byte(0x20, 0x3F);
            id(motion_chip)->write_byte(0x21, 0x09);  // HPIS1 + FDS
            id(motion_chip)->write_byte(0x23, 0x80);
            id(motion_chip)->write_byte(0x24, 0x00);
            id(motion_chip)->write_byte(0x32, thr[i]);
            id(motion_chip)->write_byte(0x33, 0x02);
            uint8_t dummy = 0;
            id(motion_chip)->read_byte(0x26, &dummy);  // Nulllage setzen
            id(motion_chip)->read_byte(0x31, &dummy);
            id(motion_chip)->write_byte(0x30, 0x2A);  // INT1_CFG
            id(motion_chip)->write_byte(0x22, 0x40);  // CTRL_REG3
          }
      - lvgl.label.update:
          id: motion_sens_lbl
          text: !lambda |-
            switch (id(motion_sens)) {
              case 0:  return std::string("Hoch");
              case 2:  return std::string("Niedrig");
              default: return std::string("Mittel");
            }
      - lambda: |-
          // Slider nachfuehren (gedreht: rechts = empfindlicher).
          int st = id(motion_sens); if (st < 0) st = 0; if (st > 2) st = 2;
          lv_slider_set_value(id(ms_sld), 2 - st, LV_ANIM_OFF);

  # Grundlage merken, sobald das Display ausgeht - der Winkel wird immer
  # gegen die Lage gemessen, in der die Fernbedienung abgelegt wurde.
  - id: capture_baseline
    then:
      - lambda: |-
          uint8_t d[6];
          if (!id(motion_chip)->read_bytes(0x28 | 0x80, d, 6)) return;
          id(mb_x) = ((int16_t)((uint16_t) d[1] << 8 | d[0])) >> 4;
          id(mb_y) = ((int16_t)((uint16_t) d[3] << 8 | d[2])) >> 4;
          id(mb_z) = ((int16_t)((uint16_t) d[5] << 8 | d[4])) >> 4;

  # ---- Fokus setzen: haelt den Fokus IMMER auf einem sichtbaren Button der
  #      aktuellen Seite und scrollt ihn in den sichtbaren Bereich. -----------
  - id: focus_apply
    then:
      - lambda: |-
          // Fokus-Raster der aktuellen Seite: eine Zeile pro Bedienzeile.
          // Hoch/Runter wechselt die ZEILE, Links/Rechts nur die Spalte
          // INNERHALB der Zeile - nebeneinanderliegende Buttons werden beim
          // Runterdruecken also uebersprungen, nicht durchlaufen.
          // 20 Zeilen mit Reserve. Die Kueche hatte 13 und schrieb damit
          // ueber das Ende des Feldes hinaus - das hat das Geraet zum
          // Absturz gebracht. Die Begrenzung unten faengt so etwas kuenftig ab.
          lv_obj_t *g[20][3] = {};
          int rl[20] = {};
          int nr = 0;
          auto row = [&](lv_obj_t *a, lv_obj_t *b, lv_obj_t *c) {
            if (nr >= 20) {
              ESP_LOGE("fokus", "Seite %d hat mehr als 20 Zeilen - Rest ignoriert",
                       id(cur_page));
              return;
            }
            int k = 0;
            g[nr][k++] = a;
            if (b != nullptr) g[nr][k++] = b;
            if (c != nullptr) g[nr][k++] = c;
            rl[nr] = k;
            nr++;
          };
          switch (id(cur_page)) {
            case 25: // Neustart-Rueckfrage - Abbrechen steht vorne, damit
                     // ein versehentliches OK nichts ausloest.
              row(id(restart_no),  nullptr, nullptr);
              row(id(restart_yes), nullptr, nullptr);
              break;
            case 26: // Sprachantwort
              row(id(voice_close), nullptr, nullptr);
              break;
            case 24: // Begruessung - nichts zu fokussieren, sie wird
                     // weggetippt oder mit Zurueck geschlossen.
              id(cur_focus) = nullptr;
              return;
            case 0:  // Home - kein Fokus: das D-Pad steuert hier den Fernseher,
                     // die Kacheln werden per Touch bedient.
              // Ohne das hier behalten angetippte Knoepfe ihre Markierung:
              // LVGL setzt sie beim Klick, und auf dieser Seite raeumt sie
              // niemand wieder weg. Die kurze Rueckmeldung beim Druecken
              // uebernimmt der pressed-Zustand.
              {
                std::function<void(lv_obj_t *)> putzen = [&](lv_obj_t *o) {
                  uint32_t n = lv_obj_get_child_count(o);
                  for (uint32_t i = 0; i < n; i++) {
                    lv_obj_t *c = lv_obj_get_child(o, i);
                    lv_obj_remove_flag(c, LV_OBJ_FLAG_CLICK_FOCUSABLE);
                    lv_obj_remove_state(c, LV_STATE_FOCUSED);
                    putzen(c);
                  }
                };
                // `sc` wird erst nach diesem Auswahlblock deklariert -
                // deshalb den aktiven Bildschirm direkt holen.
                lv_obj_t *akt = lv_screen_active();
                if (akt != nullptr) putzen(akt);
              }
              lv_obj_remove_state(id(app_home_btn), LV_STATE_FOCUSED);
              lv_obj_remove_state(id(app_home_btn),    LV_STATE_FOCUSED);
              lv_obj_remove_state(id(home_menu_btn),   LV_STATE_FOCUSED);
              id(cur_focus) = nullptr;
              return;
            case 1:  // Menue
              row(id(tile_rooms),         nullptr, nullptr);
              row(id(tile_activities),    nullptr, nullptr);
              row(id(tile_cams),          nullptr, nullptr);
              row(id(tile_devices),       nullptr, nullptr);
              row(id(tile_apps),          nullptr, nullptr);
              row(id(tile_music),         nullptr, nullptr);
              row(id(tile_smarthome),     nullptr, nullptr);
              row(id(tile_settings_main), nullptr, nullptr);
              row(id(back_menu),          nullptr, nullptr);
              break;
            case 2:  // Raeume
              row(id(tile_wz),    nullptr, nullptr);
              row(id(tile_sz),    nullptr, nullptr);
              row(id(tile_ku),    nullptr, nullptr);
              row(id(tile_bad),   nullptr, nullptr);
              row(id(tile_flur),  nullptr, nullptr);
              row(id(tile_all),   nullptr, nullptr);
              row(id(back_rooms), nullptr, nullptr);
              break;
            case 3:  // Wohnzimmer
              row(id(sc_tv),         id(sc_kino),      id(sc_hell));
              row(id(wz_light_btn),  nullptr,          nullptr);
              row(id(wz_dim_down),   id(wz_dim_up),    nullptr);
              row(id(tile_wz_media), nullptr,          nullptr);
              row(id(wz_stern_btn),  nullptr,          nullptr);
              row(id(wz_ambi_btn),   nullptr,          nullptr);
              row(id(wz_fan_btn),    nullptr,          nullptr);
              row(id(wz_fan_down),   id(wz_fan_up),    id(wz_fan_dreh));
              row(id(wz_rollo_up),   id(wz_rollo_stop), id(wz_rollo_down));
              row(id(wz_r20),        id(wz_r50),       nullptr);
              row(id(back_room_wz),  nullptr,          nullptr);
