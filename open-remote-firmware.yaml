      - if: {condition: {lambda: "return id(cur_page) == 10 || id(cur_page) == 13 || id(cur_page) == 14 || id(cur_page) == 22 || id(cur_page) == 23 || id(cur_page) == 25 || id(cur_page) == 27;"}, then: [{lvgl.page.show: {id: page_settings, animation: MOVE_RIGHT, time: 150ms}}]}
