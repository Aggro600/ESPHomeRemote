    # ================================================ 41: TASTATUR
    # Ziffernblock (Menue > Ziffern, kbd_mode 0, braucht kb_tasten digits/true) und
    # Bildschirmtastatur QWERTZ (Menue > Tastatur, kbd_mode 1, braucht "true") an den
    # aktiven Host - EINE Seite, EINE Tastenmatrix, Belegung/Aussehen setzt kbd_setup.
    # Bewusst keine Einzelbuttons: ESPHome erzeugt daraus so viel Code in setup(), dass
    # der Linker (l32r, 256 KB Reichweite) scheiterte ("literal target out of range").
    - id: page_keyboard
      styles: [st_screen]
      scrollbar_mode: "off"
      pad_top: 50
      pad_left: 4
      pad_right: 4
      pad_bottom: 4
      layout: {type: flex, flex_flow: column, flex_align_cross: start, pad_row: 8}
      on_load:
        - lambda: 'id(cur_page) = 41; id(frow) = 0; id(fcol) = 0; id(kbd_shift) = false; id(kbd_sel) = -1;'
        - lvgl.label.update: {id: kbd_title, text: !lambda 'return std::string(id(kbd_mode) == 0 ? "Ziffern" : "Tastatur");'}
        - script.execute: kbd_setup
        - script.execute: focus_apply
        # Das D-Pad gehoert hier der Tastenmatrix, nicht dem Zurueck-Knopf (Zurueck-Taste geht trotzdem).
        - lambda: |-
            lv_obj_remove_state(id(back_keyboard), LV_STATE_FOCUSED);
            id(cur_focus) = nullptr;
      widgets:
        - obj:
            width: 100%
            height: 40
            bg_color: 0x0E1116
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 8}
            widgets:
              - button:
                  id: back_keyboard
                  width: 46
                  height: 30
                  styles: [st_back]
                  focused: {border_color: 0x3B82F6, text_color: 0xF1F3F5}
                  scrolled: {bg_color: 0x1A1F27, border_color: 0x1A1F27, outline_width: 0}
                  on_click: [{script.execute: nav_back}]
                  widgets: [{label: {align: CENTER, text: "<", text_font: a15}}]
              - label: {id: kbd_title, text: "Tastatur", styles: [st_title], flex_grow: 1, pad_bottom: 0, height: 28, long_mode: DOT}
        - buttonmatrix:
            id: kbd_matrix
            width: 100%
            flex_grow: 1
            rows:
              - buttons:
                  - text: "x"
            on_click:
              - script.execute: kbd_press

    # ================================================ 99: SD-MENUE (page_dyn)
    # Alle Widgets werden von menu_ui zur Laufzeit aus /sd/menu.json (bzw. dem Studio-Export
    # runtime.json) in dyn_root erzeugt. Touch geht direkt, das D-Pad ueber dispatch_key (Seite 99).
    - id: page_dyn
      styles: [st_screen]
      scrollbar_mode: "off"
      scrollable: false
      on_load:
        - lambda: |-
            id(cur_page) = 99;
            if (id(menu)->loaded()) {
              id(menu)->reopen();
              id(menu)->focus_move(0, 0);
            }
      widgets:
        - label:
            id: dyn_title
            align: TOP_MID
            y: 4
            text: "Menue"
            text_font: a15
        - obj:
            id: dyn_root
            x: 0
            y: 26
            width: 240
            height: 290
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: true
            scrollbar_mode: "off"

    # ================================================ 42: SD-KARTE
    - id: page_sd
      styles: [st_screen]
      scrollbar_mode: "off"
      pad_top: 50
      pad_bottom: 6
      layout: {type: flex, flex_flow: column, flex_align_cross: start, pad_row: 10}
      on_load:
        - lambda: 'id(cur_page) = 42; id(frow) = 0; id(fcol) = 0;'
        - script.execute: apply_hints
        - script.execute: sd_anzeige
        - script.execute: focus_apply
      widgets:
        - obj:
            width: 100%
            height: 40
            bg_color: 0x0E1116
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 8}
            widgets:
              - button:
                  id: back_sd
                  width: 46
                  height: 30
                  styles: [st_back]
                  focused: {border_color: 0x3B82F6, text_color: 0xF1F3F5}
                  scrolled: {bg_color: 0x1A1F27, border_color: 0x1A1F27, outline_width: 0}
                  on_click: [{script.execute: nav_back}]
                  widgets: [{label: {align: CENTER, text: "<", text_font: a15}}]
              - label: {text: "SD-Karte", styles: [st_title], flex_grow: 1, pad_bottom: 0, height: 28, long_mode: DOT}
        - label: {id: sd_stat_lbl, width: 216, text: "Keine Karte eingebunden", text_font: a15, text_color: 0x8B94A3, long_mode: WRAP}
        - label: {id: sd_info_lbl, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - button:
            id: sd_menu_btn
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click: [{lvgl.page.show: {id: page_dyn, animation: MOVE_LEFT, time: 150ms}}]
            widgets:
              - label: {text: "SD-Menü öffnen", text_font: a15, flex_grow: 1}
        - label: {id: h_sd_menu, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - button:
            id: sd_mount_btn
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click: [{script.execute: sd_einbinden}]
            widgets:
              - label: {text: "Karte einbinden", text_font: a15, flex_grow: 1}
        - label: {id: h_sd_mount, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - button:
            id: sd_reload_btn
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click: [{script.execute: sd_neuladen}]
            widgets:
              - label: {text: "Neu laden", text_font: a15, flex_grow: 1}
        - label: {id: h_sd_reload, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - button:
            id: sd_logoreset_btn
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click: [{script.execute: sd_logo_leeren}]
            widgets:
              - label: {text: "Logos neu laden", text_font: a15, flex_grow: 1}
        - label: {id: h_sd_logoreset, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - button:
            id: sd_konfig_btn
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click: [{script.execute: sd_konfig_start}]
            widgets:
              - label: {text: "Konfig-Modus (10 min)", text_font: a15, flex_grow: 1}
        - label: {id: h_sd_konfig, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - button:
            id: sd_eject_btn
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click: [{script.execute: sd_auswerfen}]
            widgets:
              - label: {text: "Auswerfen", text_font: a15, flex_grow: 1}
        - label: {id: h_sd_eject, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}

    # ================================================ 39: UPDATE (OTA)
    - id: page_ota
      styles: [st_screen]
      scrollbar_mode: "off"
      scrollable: false
      on_load:
        - lambda: |-
            id(cur_page) = 39; id(frow) = 0; id(fcol) = 0;
            lv_bar_set_value(id(ota_bar), 0, LV_ANIM_OFF);
            lv_label_set_text(id(ota_pct_lbl), "0 %");
            lv_label_set_text(id(ota_hint_lbl), "Nicht ausschalten");
      widgets:
        - label: {align: CENTER, y: -60, text: "Neue Software", text_font: a18, text_color: 0xF1F3F5}
        - label: {id: ota_pct_lbl, align: CENTER, y: -20, text: "0 %", text_font: a18, text_color: 0x3B82F6}
        - bar:
            id: ota_bar
            align: CENTER
            y: 14
            width: 200
            height: 16
            min_value: 0
            max_value: 100
            value: 0
            indicator: {bg_color: 0x3B82F6}
        - label: {id: ota_hint_lbl, align: CENTER, y: 56, width: 200, text_align: CENTER, text: "Nicht ausschalten", text_font: a13, text_color: 0x8B94A3}

    # ================================================ 35: REINIGUNGSMODUS
    - id: page_clean
      styles: [st_screen]
      scrollbar_mode: "off"
      scrollable: false
      on_load:
        - lambda: 'id(cur_page) = 35; id(frow) = 0; id(fcol) = 0;'
      widgets:
        - label: {align: TOP_MID, y: 30, text: "Reinigungsmodus", styles: [st_title]}
        - label: {id: clean_lbl, align: CENTER, y: -10, text: "-", text_font: a18, text_color: 0x3B82F6}
        - label: {align: BOTTOM_MID, y: -30, width: 216, text: "Display und Tasten sind gesperrt. Zurück-Taste lang halten bricht ab.", text_font: a13, text_color: 0x8B94A3, text_align: CENTER, long_mode: WRAP}

    # ================================================ 36: TOUCH-TEST
    - id: page_touch_test
      styles: [st_screen]
      pad_top: 0
      pad_bottom: 0
      pad_left: 0
      pad_right: 0
      scrollbar_mode: "off"
      scrollable: false
      on_load:
        - lambda: 'id(cur_page) = 36; id(frow) = 0; id(fcol) = 0;'
        - script.execute: tt_clear
      widgets:
        - label: {align: TOP_MID, y: 10, text: "Touch-Test", text_font: a15, text_color: 0x8B94A3}
        - label: {id: tt_lbl, align: TOP_MID, y: 34, text: "Tippe irgendwo", text_font: a13, text_color: 0x3B82F6}
        - label: {align: CENTER, y: 0, text: "Beenden: Zurück-Taste", text_font: a13, text_color: 0x8B94A3}
        # Zielpunkte (Mitte je 12 px): tippe genau darauf und vergleiche, wo der Ring erscheint
        # und welche Koordinaten unten stehen. Unterer Rand: y = 300 und 314 (Displayende 320).
        - obj: {x: 24, y: 294, width: 12, height: 12, radius: 6, bg_opa: TRANSP, border_width: 2, border_color: 0x8B94A3, pad_all: 0, clickable: false, scrollable: false}
        - obj: {x: 114, y: 294, width: 12, height: 12, radius: 6, bg_opa: TRANSP, border_width: 2, border_color: 0x8B94A3, pad_all: 0, clickable: false, scrollable: false}
        - obj: {x: 204, y: 294, width: 12, height: 12, radius: 6, bg_opa: TRANSP, border_width: 2, border_color: 0x8B94A3, pad_all: 0, clickable: false, scrollable: false}
        - obj: {x: 114, y: 308, width: 12, height: 12, radius: 6, bg_opa: TRANSP, border_width: 2, border_color: 0xEF9F1A, pad_all: 0, clickable: false, scrollable: false}
        - obj: {x: 24, y: 8, width: 12, height: 12, radius: 6, bg_opa: TRANSP, border_width: 2, border_color: 0x8B94A3, pad_all: 0, clickable: false, scrollable: false}
        - obj: {x: 204, y: 8, width: 12, height: 12, radius: 6, bg_opa: TRANSP, border_width: 2, border_color: 0x8B94A3, pad_all: 0, clickable: false, scrollable: false}
        - obj: {id: tt_ring, x: 0, y: 0, width: 32, height: 32, radius: 16, bg_opa: TRANSP, border_width: 3, border_color: 0x3B82F6, pad_all: 0, hidden: true, scrollable: false, clickable: false}

    # ================================================ 34: TASTEN-TEST
    # Zeigt fuer jeden physischen Tastendruck Einzeln/Doppelt/Lang und die
    # gemessene Haltedauer, ohne dabei etwas an einen verbundenen Host zu
    # senden - s. Abfangpunkt ganz oben in on_key: (tca8418:). Nutzerwunsch
    # 2026-09-17.
    - id: page_button_test
      styles: [st_screen]
      scrollbar_mode: "off"
      pad_top: 50
      pad_bottom: 6
      layout: {type: flex, flex_flow: column, flex_align_cross: start, pad_row: 10}
      on_load:
        - lambda: |-
            id(cur_page) = 34; id(frow) = 0; id(fcol) = 0;
            lv_label_set_text(id(bt_toggle_lbl), id(button_test_mode) ? "AN" : "AUS");
        - script.execute: focus_apply
      widgets:
        - obj:
            id: hdr_back_button_test
            width: 100%
            height: 40
            bg_color: 0x0E1116
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 8}
            widgets:
              - button:
                  id: back_button_test
                  width: 46
                  height: 30
                  styles: [st_back]
                  focused: {border_color: 0x3B82F6, text_color: 0xF1F3F5}
                  scrolled: {bg_color: 0x1A1F27, border_color: 0x1A1F27, outline_width: 0}
                  on_click:
                    # Sicherheitsnetz: beim Verlassen der Seite den Test immer
                    # abschalten, egal wie man sie verlaesst - niemand soll
                    # aus Versehen mit ausgeschalteter Fernbedienungsfunktion
                    # herumlaufen.
                    - lambda: 'id(button_test_mode) = false;'
                    - script.execute: nav_back
                  widgets: [{label: {align: CENTER, text: "<", text_font: a15}}]
              - label: {text: "Tasten-Test", styles: [st_title], flex_grow: 1, pad_bottom: 0, height: 28, long_mode: DOT}
        - button:
            id: bt_toggle_btn
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click:
              - lambda: |-
                  id(button_test_mode) = !id(button_test_mode);
                  id(bt_wait_key) = 0;
                  id(bt_count) = 0;
              - lvgl.label.update:
                  id: bt_toggle_lbl
                  text: !lambda 'return id(button_test_mode) ? std::string("AN") : std::string("AUS");'
              - lvgl.label.update: {id: bt_result_kind, text: "—", text_color: 0x8B94A3}
              - lvgl.label.update: {id: bt_result_detail, text: "Noch kein Druck"}
              - lvgl.label.update: {id: bt_hist_0, text: " "}
              - lvgl.label.update: {id: bt_hist_1, text: " "}
              - lvgl.label.update: {id: bt_hist_2, text: " "}
              - lvgl.label.update: {id: bt_hist_3, text: " "}
              - lvgl.label.update: {id: bt_hist_4, text: " "}
            widgets:
              - label: {text: "Tasten-Test", text_font: a13, flex_grow: 1}
              - label: {id: bt_toggle_lbl, text: "AUS", text_font: a13, text_color: 0x8B94A3}
        - label:
            width: 216
            text: "AN = Tasten senden nichts mehr an Fernseher/Streamer/Tablet, sondern werden hier nur ausgewertet."
            styles: [st_muted]
            long_mode: WRAP
        # Grosse Anzeige des letzten Ergebnisses.
        - obj:
            width: 100%
            height: 70
            styles: [st_tile]
            layout: {type: flex, flex_flow: column, flex_align_cross: center, flex_align_main: center, pad_row: 4}
            widgets:
              - label: {id: bt_result_kind, text: "—", text_font: a18, text_color: 0x8B94A3}
              - label: {id: bt_result_detail, text: "Noch kein Druck", text_font: a13, styles: [st_muted]}
        - label: {text: "Verlauf (neuester oben)", styles: [st_muted], pad_top: 4}
        - label: {id: bt_hist_0, text: " ", text_font: a13, width: 216, long_mode: DOT}
        - label: {id: bt_hist_1, text: " ", text_font: a13, width: 216, long_mode: DOT, styles: [st_muted]}
        - label: {id: bt_hist_2, text: " ", text_font: a13, width: 216, long_mode: DOT, styles: [st_muted]}
        - label: {id: bt_hist_3, text: " ", text_font: a13, width: 216, long_mode: DOT, styles: [st_muted]}
        - label: {id: bt_hist_4, text: " ", text_font: a13, width: 216, long_mode: DOT, styles: [st_muted]}
