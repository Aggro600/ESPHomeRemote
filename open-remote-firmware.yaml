          lv_label_set_text(id(h_to), "So lange ohne Bedienung, dann geht das Display aus und die Remote schläft. Ganz links = Nie (kostet viel Akku). Ein Tipp oder Tastendruck weckt sie wieder.");
          lv_label_set_text(id(h_sh_ble), "Zeigt oben, ob die Remote mit dem Fernseher oder Streamer verbunden ist.");
          lv_label_set_text(id(h_sh_wifi), "Zeigt die WLAN-Verbindung. Grün: WLAN und Home Assistant beide da. Bernstein: WLAN verbunden, Home Assistant noch nicht (kurz nach dem Aufwachen normal). Grau: kein WLAN. Im Ruhezustand ist sie oft aus.");
          lv_label_set_text(id(h_sh_batt), "Ladezustand in Prozent. Beim Laden erscheint ein Blitz, ist der Akku voll, steht dort grün „voll“.");
          lv_label_set_text(id(h_sh_clock), "Uhrzeit oben in der Leiste. Ohne Uhr rutscht der Sleeptimer-Countdown nach links.");
          lv_label_set_text(id(h_sh_assi), "Zeigt, welcher Sprachassistent auf der Mikrofon-Taste liegt: Google oder Home Assistant.");
          lv_label_set_text(id(h_cov_p), "GANZ: Das Bild wird vollständig gezeigt, es können Ränder bleiben. VOLL: Es füllt die ganze Fläche, die Ränder werden abgeschnitten. Gilt für den Player.");
          lv_label_set_text(id(h_cov_h), "GANZ: Das Bild wird vollständig gezeigt, es können Ränder bleiben. VOLL: Es füllt die ganze Fläche, die Ränder werden abgeschnitten. Gilt für die Startseite.");
          lv_label_set_text(id(h_motion), "Was die Remote im Ruhezustand von selbst aufweckt. Aus: nur Tasten und Touch. Bewegung: schon ein Anstoßen. Hochheben: erst, wenn sie aus der Ablage gehoben wird.");
          lv_label_set_text(id(h_sens), "Wie stark die Remote bewegt werden muss. Rechts = empfindlicher, aber auch mehr ungewollte Weckungen, etwa durch Erschütterungen am Tisch.");
          lv_label_set_text(id(h_dim_wake), "AN: Bewegung bzw. Hochheben (siehe oben, je nach „Aufwecken bei“) hellt die Remote schon auf, wenn sie nur abgedunkelt ist - nicht erst, wenn sie ganz aus ist. AUS: wie bisher, dann holt erst ein Tipp sie aus dem Abgedunkelten zurück.");
          lv_label_set_text(id(h_dim_hold), "AN: Solange sich die Remote bewegt, dunkelt sie gar nicht erst ab und schaltet auch nicht aus - praktisch, wenn man sie länger in der Hand hält. Kostet selbst kaum Strom (ein kurzer Sensor-Check alle 250 ms), aber indirekt mehr: Das Display bleibt dann länger hell, auch wenn nur der Tisch wackelt oder man im Auto sitzt - und das Display ist der größte Verbraucher. Darum standardmäßig AUS.");
          lv_label_set_text(id(h_dim_sens), "Eigene Empfindlichkeit für die beiden Optionen oben, getrennt von „Empfindlichkeit“ bei Aufwecken bei. Rechts = empfindlicher, aber auch mehr Fehlauslöser.");
          lv_label_set_text(id(h_assi), "Google: Die Mikrofon-Taste startet die Google-Sprachsuche am Streamer, wie bei der Originalfernbedienung. Home Assistant: Die Abfrage geht an Assist in Home Assistant, zum Beispiel für Smart-Home-Befehle. Tippen schaltet um. Das Mikrofon-Symbol in SmartTube funktioniert immer.");
          lv_label_set_text(id(h_tts), "AN: Antworten von Home Assistant werden zusätzlich über die Lautsprecher im Wohnzimmer gesprochen. AUS: Die Antwort steht nur auf dem Display der Remote.");
          lv_label_set_text(id(h_touch), "Zeigt, wo du das Display berührst. Zum Prüfen der Touch-Genauigkeit, besonders am Rand. Beenden mit der Zurück-Taste.");
          lv_label_set_text(id(h_btn), "Zeigt für jede Taste, ob sie als einfach, doppelt oder lang erkannt wird. Nur Anzeige, nichts geht an den Fernseher.");
          lv_label_set_text(id(h_cleandur), "So lange sind Tasten und Touch gesperrt, damit du das Display abwischen kannst. Tippen schaltet durch: 10, 20, 30, 60 s.");
          lv_label_set_text(id(h_clean), "Startet die Reinigung: Tasten und Touch sind gesperrt, bis die Zeit abgelaufen ist. Vorzeitig beenden: Zurück-Taste lang halten. Startet auch mit zwei kurzen Drücken auf die Aus-Taste.");
          lv_label_set_text(id(h_sd_tile), "Einstellungen und Menü von der SD-Karte: IR-Geräte, Aktivitäten, eigenes Menü. Mit eingebundener Karte ist das Mikrofon gesperrt, nach dem Auswerfen geht die Sprachsuche wieder.");
          lv_label_set_text(id(h_sd_logos), "AN: Zu Apps ohne eigenes Cover (Netflix, Disney+ und andere) zeigt die Remote das Logo von der SD-Karte (Ordner covers). Die Karte wird dafür kurz eingebunden und sofort wieder ausgeworfen, das Mikrofon ist nur kurz gesperrt. AUS: wie bisher das neutrale Bild aus Home Assistant.");
          lv_label_set_text(id(h_sd_logoreset), "Löscht die geladenen Logos aus dem Speicher und liest sie beim nächsten Bedarf neu von der Karte, zum Beispiel nach dem Wechseln der Karte oder neuen Dateien.");
          lv_label_set_text(id(h_sd_menu), "Zeigt das Menü aus menu.json oder das aus dem Studio-Export (runtime.json) erzeugte. Erst nach dem Einbinden der Karte verfügbar.");
          lv_label_set_text(id(h_sd_mount), "Bindet die Karte ein und lädt runtime.json und menu.json. Solange sie eingebunden ist, ist das Mikrofon gesperrt (gleiche Anschlüsse), die Sprachsuche geht also nicht.");
          lv_label_set_text(id(h_sd_reload), "Liest runtime.json und menu.json neu ein, zum Beispiel nach dem Ändern der Dateien.");
          lv_label_set_text(id(h_sd_konfig), "Öffnet für 10 Minuten einen Upload-Zugang im WLAN (die Adresse steht oben). Damit lassen sich runtime.json und menu.json hoch- und herunterladen. Kein Passwort, nur im Heimnetz nutzen.");
          lv_label_set_text(id(h_sd_eject), "Wirft die Karte aus und gibt das Mikrofon wieder frei. Ein Neustart ist nicht nötig. Falls die Sprachsuche danach nicht geht, hilft „Gerät neu starten“ unter Wartung.");
          lv_label_set_text(id(h_restart), "Startet die Remote neu, zum Beispiel wenn etwas hängt. Einstellungen bleiben erhalten. Vorher kommt eine Rückfrage.");

  - id: apply_tts_speaker
    then:
      - lambda: |-
          const bool an = id(tts_speaker);
          lv_label_set_text(id(tts_lbl), an ? "AN" : "AUS");
          lv_obj_set_style_text_color(id(tts_lbl),
            lv_color_hex(an ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);

  - id: apply_assistant
    then:
      # Die Anzeige der Sparstufe mitziehen: mit Home Assistant ruht Stufe 2.
      - script.execute: apply_power
      # Assistenten-Symbol in der Statusleiste (Google/Home Assistant) auf
      # den neuen Stand bringen - die eigentliche Logik steckt in apply_show,
      # das auch beim Umschalten des Sichtbar-Schalters selbst laeuft.
      - script.execute: apply_show
      - lambda: |-
          const bool ha = id(assistant) == 1;
          lv_label_set_text(id(assi_lbl), ha ? "Home Assistant" : "Google");
          lv_obj_set_style_text_color(id(assi_lbl),
            lv_color_hex(0x22C55E), LV_PART_MAIN);
          ESP_LOGI("assi", "Sprachassistent: %s", ha ? "Home Assistant" : "Google");

  - id: unflash
    mode: restart
    then:
      - delay: 180ms
      - lambda: |-
          if (id(flash_obj) != nullptr) {
            lv_obj_remove_state(id(flash_obj), LV_STATE_PRESSED);
            id(flash_obj) = nullptr;
          }

  # Fuehrt die Aktion fuer id(cur_key) aus. Ausgelagert, damit die
  # Wiederholung beim Halten exakt dieselbe Logik benutzt wie der erste Druck.
  - id: dispatch_key
    then:
      - lambda: |-
          const int keycode = id(cur_key);
          const int p = id(cur_page);
          // ================= DATENGETRIEBENES MENUE (SD, page_dyn) =========
          // Eigene Fokus-Navigation in der menu_ui-Komponente. Lautstaerke,
          // Mute, Transport und Power gehen weiter an den Fernseher.
          if (p == 99) {
            switch (keycode) {
              case 14:  id(menu)->focus_move(0, -1); return;   // Hoch
              case 35:  id(menu)->focus_move(0,  1); return;   // Runter
              case 15:  id(menu)->focus_move(-1, 0); return;   // Links
              case 32:  id(menu)->focus_move( 1, 0); return;   // Rechts
              case 34:  id(menu)->focus_activate(); return;    // OK
              case 13:                                         // Zurueck
                if (id(menu)->at_root()) id(go_home)->execute();
                else                     id(menu)->go_back();
                return;
              case 3:   id(go_home)->execute(); return;        // Menue -> raus
              default: break;
            }
            uint16_t cc = 0;
            switch (keycode) {
              case 33:  cc = 0x00E9; break;  // Lauter
              case 43:  cc = 0x00EA; break;  // Leiser
              case 44:  cc = 0x00E2; break;  // Mute
              case 2:   cc = 0x00CD; break;  // Play / Pause
              case 5:   cc = 0x00B7; break;  // Stop
              case 4:   cc = 0x00B4; break;  // Rewind
              case 11:  cc = 0x00B3; break;  // Forward
              case 102: cc = 0x0030; break;  // Power
              default:  return;
            }
            char act[32];
            snprintf(act, sizeof(act), "consumer:0x%04X", (unsigned) cc);
            id(kb).execute_action(act);
            return;
          }

          // ================= HOMESCREEN =================
          // Die Aktivitaet bestimmt das Tastenlayout (Harmony-Prinzip).
          // Aktivitaet 0 "TV": alles per BLE-HID an den Streamer.
          // Keycode 41 (Taste rund ums D-Pad) wird seit 2026-09-18 direkt im
          // on_key-Handler abgefangen (kurz/lang ueber long_press, s. dort) -
          // kommt hier also nie mehr an, dispatch_key wird fuer 41 nicht
          // mehr aufgerufen.
          // Im Menue sind NUR die Navigationstasten gesperrt (D-Pad, OK, Zurueck -
          // die Menue-Taste laeuft ueber die Gesten). Alle anderen Tasten
          // (Lautstaerke, Mute, Transport, Power, 3, 41 ...) machen dort dasselbe wie
          // auf der Startseite (Nutzerwunsch 2026-09-20).
          const bool nav_taste = (keycode == 14 || keycode == 35 || keycode == 15 ||
                                  keycode == 32 || keycode == 34 || keycode == 13);
          if (p == 0 || !nav_taste) {
            uint16_t cc = 0;
            switch (id(activity)) {
              case 0:
              default:
                switch (keycode) {
                  case 14:  cc = 0x0042; break;  // Hoch
                  case 35:  cc = 0x0043; break;  // Runter
                  case 15:  cc = 0x0044; break;  // Links
                  case 32:  cc = 0x0045; break;  // Rechts
                  case 34:  cc = 0x0041; break;  // OK
                  case 13:  cc = 0x0224; break;  // Zurueck
                  case 3:   cc = 0x0223; break;  // Menue (S23) -> Home
                  case 33:  cc = 0x00E9; break;  // Lauter
                  case 43:  cc = 0x00EA; break;  // Leiser
                  case 44:  cc = 0x00E2; break;  // Mute
                  case 2:   cc = 0x00CD; break;  // Play / Pause
                  case 5:   cc = 0x00B7; break;  // Stop
                  case 4:   cc = 0x00B4; break;  // Rewind
                  case 11:  cc = 0x00B3; break;  // Forward
                  case 102: cc = 0x0030; break;  // Power
                  default:  cc = 0;      break;
                }
                break;
            }
            if (cc == 0) ESP_LOGI("tasten", "Taste %d hat keine Belegung", keycode);
            if (cc != 0) {
              char act[32];
              // 04.09. umgestellt auf ECHTES Halten. Vorher gingen alle Tasten
              // ausser OK als Tippfolge raus, damit die Wiederholrate ueberall
              // gleich ist - der Fernseher hat das aber als schnelle
              // Einzeldruecke gewertet statt als gehaltene Taste. Jetzt wird
              // die Taste wirklich gehalten und beim Loslassen freigegeben;
              // die Wiederholung macht das Geraet selbst, so wie es seine
              // eigene Fernbedienung auch tut. Preis: die Rate ist je Taste
              // verschieden, weil der Fernseher sie bestimmt.
              const bool hold = true;
              snprintf(act, sizeof(act), hold ? "consumer_hold:0x%04X" : "consumer:0x%04X",
                       (unsigned) cc);
              if (hold) id(kb).hold_action(act);
              else      id(kb).execute_action(act);
            }
            return;
          }

          // Ziffernblock / Tastatur (Seite 41): D-Pad markiert eine Taste der Matrix,
          // OK druckt sie. Erster Druck zeigt nur die Startmarkierung.
          if (p == 41 && (keycode == 14 || keycode == 35 || keycode == 15 || keycode == 32 || keycode == 34)) {
            const auto &L = eingabe::layout(id(kbd_mode), id(kbd_shift));
            lv_obj_t *m = id(kbd_matrix)->obj;
            if (keycode == 34) {
              if (id(kbd_sel) < 0 || id(kbd_sel) >= L.anzahl) id(kbd_sel) = L.start;
              else {
                lv_buttonmatrix_set_selected_button(m, id(kbd_sel));
                id(kbd_press)->execute();
                return;
              }
            } else {
              id(kbd_sel) = eingabe::weiter(L, id(kbd_sel), keycode == 14 ? 0 : keycode == 35 ? 1 : keycode == 15 ? 2 : 3);
            }
            lv_buttonmatrix_clear_button_ctrl_all(m, LV_BUTTONMATRIX_CTRL_CHECKED);
            lv_buttonmatrix_set_button_ctrl(m, id(kbd_sel), LV_BUTTONMATRIX_CTRL_CHECKED);
            return;
          }

          // Sprachantwort: Hoch/Runter scrollt den Text, statt den Fokus zu
          // bewegen - dort gibt es nur einen Knopf.
          if (p == 26 && (keycode == 14 || keycode == 35)) {
            lv_obj_scroll_by(id(voice_box), 0, keycode == 14 ? 40 : -40, LV_ANIM_ON);
            return;
          }

          // ================= MENUE =================
          // Nur die Navigation gehoert dem Display. Alles andere - Lautstaerke,
          // Mute, Transport, Power - geht weiter an den Fernseher, damit man
          // im Menue nicht die Kontrolle ueber das Geraet verliert.
          // Steht der Fokus auf einem Regler, aendern Links/Rechts dessen Wert,
          // statt die Spalte zu wechseln - sonst waere er nur per Finger
          // bedienbar.
          if ((keycode == 15 || keycode == 32) && id(cur_focus) != nullptr &&
              lv_obj_check_type((lv_obj_t *) id(cur_focus), &lv_slider_class)) {
            lv_obj_t *sl = (lv_obj_t *) id(cur_focus);
            // Frueher fest +-5 und auf 5..100 begrenzt - das war fuer den
            // Helligkeitsregler geschrieben und machte alle anderen
            // unbedienbar (der Timeout-Regler ging nur von 0 bis 5, ein
            // Tastendruck sprang also sofort ans Ende). Jetzt kommen
            // Schrittweite und Grenzen aus dem Regler selbst.
            const int32_t lo = lv_slider_get_min_value(sl);
            const int32_t hi = lv_slider_get_max_value(sl);
            // Schrittweite 1: fein genug fuer Sekunden beim Timeout. Beim
            // Halten laeuft die Wiederholung mit 55 ms, der volle Bereich ist
            // also in wenigen Sekunden durchfahren.
            const int32_t schritt = 1;
            (void) lo; (void) hi;
            int32_t v = lv_slider_get_value(sl) + (keycode == 32 ? schritt : -schritt);
            if (v < lo) v = lo;
            if (v > hi) v = hi;
            lv_slider_set_value(sl, v, LV_ANIM_OFF);
            lv_obj_send_event(sl, LV_EVENT_VALUE_CHANGED, nullptr);
            return;
          }
          switch (keycode) {
            case 13:  id(nav_back)->execute();    return;
            case 14:  id(focus_up)->execute();    return;
            case 35:  id(focus_down)->execute();  return;
            case 15:  id(focus_left)->execute();  return;
            case 32:  id(focus_right)->execute(); return;
            case 34:  id(activate)->execute();    return;
            default: break;
          }
          {
            uint16_t cc = 0;
            switch (keycode) {
              case 33:  cc = 0x00E9; break;  // Lauter
              case 43:  cc = 0x00EA; break;  // Leiser
              case 44:  cc = 0x00E2; break;  // Mute
              case 2:   cc = 0x00CD; break;  // Play / Pause
              case 5:   cc = 0x00B7; break;  // Stop
              case 4:   cc = 0x00B4; break;  // Rewind
              case 11:  cc = 0x00B3; break;  // Forward
              case 102: cc = 0x0030; break;  // Power
              default:  return;
            }
            char act[32];
            snprintf(act, sizeof(act), "consumer:0x%04X", (unsigned) cc);
            id(kb).execute_action(act);
          }

  # Halten laesst nachfeuern: erst eine Pause, damit ein normaler Druck nicht
  # doppelt ausloest, danach in kurzen Abstaenden bis zum Loslassen.
  - id: key_repeat
    mode: restart
    then:
      - lambda: 'id(rep_count) = 0;'
      - delay: 300ms
      - while:
          # Notbremse: bleibt ein Loslassen mal aus (verlorenes Tastenereignis),
          # liefe die Wiederholung sonst endlos weiter und wuerde den Fernseher
          # zuspammen. Nach rund 10 Sekunden ist Schluss.
          condition:
            lambda: "return id(held_key) != 0 && id(rep_count) < 170;"
          then:
            - script.execute: dispatch_key
            - lambda: 'id(rep_count)++;'
            - delay: 55ms
      - lambda: |-
          if (id(rep_count) >= 160) {
            ESP_LOGW("tasten", "Wiederholung nach 10 s abgebrochen - Loslassen der Taste %d kam nie an", id(held_key));
            id(held_key) = 0;
            id(kb).execute_action("release");
          }

  - id: go_home
    then:
      - lambda: |-
          int p = id(cur_page);
          // Media-Seite: Verlassen-Zeitpunkt fuer das 10s-Fenster der Markierung
          // festhalten. Nur aus dem Menue (Raeume > Wohnzimmer) geoeffnet zaehlt
          // sie als Menueseite und wird selbst gemerkt (Nutzerwunsch
          // 2026-09-19) - vorher wurde daraus "Wohnzimmer", das Menue oeffnete
          // dann eine Ebene zu weit oben. Vom Home aus geoeffnet: keine
          // Menueseite.
          if (p == 6) {
            if (id(media_left_ms) != 0xFFFFFFFFu) id(media_left_ms) = millis();
            if (id(media_from) != 3) p = 0;
          }
          // Alle Menueseiten merken (nicht Home / Media-vom-Home / Klingel).
          // Frueher standen hier nur die ersten acht Seiten. Alles, was
          // spaeter dazukam (Apps, Musik, Kueche, Bad, Flur, Alle Raeume, TV,
          // Timeout, Bewegung, Helligkeit, Anzeige), wurde NICHT gemerkt - die
          // Erinnerung behielt dann den alten Wert und sprang beim naechsten
          // Oeffnen auf eine voellig andere Seite.
          // Apps zaehlt nur als Menueseite, wenn sie aus dem Menue kam.
          if (p == 15 && id(apps_from_home)) p = 0;
          if (p == 1 || p == 2 || p == 3 || p == 4 || p == 5 || p == 6 || p == 8 || p == 9 || p == 10 || p == 12 || p == 13 || p == 14 || p == 15 || p == 16 || p == 17 || p == 18 || p == 19 || p == 20 || p == 21 || p == 22 || p == 23 || p == 27 || p == 28 || p == 29 || p == 30 || p == 31) {
            id(last_menu_page) = p;
            id(last_menu_ms) = millis();
          }
      - lvgl.page.show: {id: page_home, animation: MOVE_RIGHT, time: 150ms}
  # Immer die oberste Menueseite, ohne die Erinnerung. Fuer den langen Druck:
  # dort will man bewusst nach ganz oben, nicht dorthin zurueck, wo man war.
  - id: open_menu_top
    then:
      - lambda: |-
          id(last_menu_ms) = 0;
          // Springt direkt ins Startmenue, ohne die einzelnen Zwischenschritte
          // ueber nav_back zu durchlaufen - deshalb hier die komplette
          // Fokus-Erinnerung leeren statt nur eine Seite (Nutzerwunsch
          // 2026-09-17: im Startmenue immer ganz oben ankommen).
          for (int i = 0; i < 44; i++) { id(fmem_row)[i] = 0; id(fmem_col)[i] = 0; }
          id(fmem_last_page) = -1;
          id(media_left_ms) = 0;
      - lvgl.page.show: {id: page_menu, animation: MOVE_LEFT, time: 150ms}

  - id: open_menu
    then:
      - lambda: |-
          bool recent = id(last_menu_ms) != 0 && (millis() - id(last_menu_ms)) < (uint32_t) id(mem_s) * 1000;
          id(menu_target) = recent ? id(last_menu_page) : 1;
          // Merkfenster abgelaufen: auch die Markierungen aller Seiten
          // vergessen, sonst steht z.B. "Hell" unter Raeume > Wohnzimmer beim
          // naechsten Besuch wieder markiert.
          if (!recent) {
            for (int i = 0; i < 44; i++) { id(fmem_row)[i] = 0; id(fmem_col)[i] = 0; }
            id(fmem_last_page) = -1;
            id(media_left_ms) = 0;
          }
      - if: {condition: {lambda: "return id(menu_target) == 2;"}, then: [{lvgl.page.show: {id: page_rooms, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 3;"}, then: [{lvgl.page.show: {id: page_room_wz, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 4;"}, then: [{lvgl.page.show: {id: page_devices, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 5;"}, then: [{lvgl.page.show: {id: page_smarthome, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 6;"}, then: [{lambda: 'id(media_from) = 3;'}, {lvgl.page.show: {id: page_media, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 8;"}, then: [{lvgl.page.show: {id: page_settings, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 9;"}, then: [{lvgl.page.show: {id: page_room_sz, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 10;"}, then: [{lvgl.page.show: {id: page_ble, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 12;"}, then: [{lvgl.page.show: {id: page_sleeptimer, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 13;"}, then: [{lvgl.page.show: {id: page_voice_set, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 14;"}, then: [{lvgl.page.show: {id: page_service, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 15;"}, then: [{lvgl.page.show: {id: page_apps, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 16;"}, then: [{lvgl.page.show: {id: page_room_ku, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 17;"}, then: [{lvgl.page.show: {id: page_music, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 18;"}, then: [{lvgl.page.show: {id: page_tv, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 19;"}, then: [{lvgl.page.show: {id: page_room_bad, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 20;"}, then: [{lvgl.page.show: {id: page_room_flur, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 21;"}, then: [{lvgl.page.show: {id: page_all_rooms, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 22;"}, then: [{lvgl.page.show: {id: page_bright, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 23;"}, then: [{lvgl.page.show: {id: page_show, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 27;"}, then: [{lvgl.page.show: {id: page_power, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 28;"}, then: [{lvgl.page.show: {id: page_activities, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 29;"}, then: [{lvgl.page.show: {id: page_cams, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 30;"}, then: [{lvgl.page.show: {id: page_music_group, animation: MOVE_LEFT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(menu_target) == 31;"}, then: [{lvgl.page.show: {id: page_music_google, animation: MOVE_LEFT, time: 150ms}}]}
      - if:
          condition:
            lambda: |-
              int t = id(menu_target);
              return !(t == 2 || t == 3 || t == 4 || t == 5 || t == 6 || t == 8 || t == 9 || t == 10 || t == 12 || t == 13 || t == 14 || t == 15 || t == 16 || t == 17 || t == 18 || t == 19 || t == 20 || t == 21 || t == 22 || t == 23 || t == 27 || t == 28 || t == 29 || t == 30 || t == 31);
          then: [{lvgl.page.show: {id: page_menu, animation: MOVE_LEFT, time: 150ms}}]
  # ---- Tastengesten -------------------------------------------------------
  # Die Tastatur liefert nur "gedrueckt", "losgelassen" und beim Loslassen die
  # Haltedauer. Kurz und lang lassen sich damit direkt unterscheiden. Ein
  # Doppeldruck braucht dagegen eine Wartezeit nach dem ersten Loslassen -
  # deshalb faellt sie NUR bei Tasten an, fuer die unten eine Doppel-Aktion
  # hinterlegt ist. Alle anderen loesen weiterhin sofort aus.
  - id: gesture_action
    then:
      - lambda: |-
          const int k = id(gest_key);
          const int art = id(gest_kind);
          ESP_LOGD("geste", "Taste %d -> %s t=%u", k, art == 1 ? "LANG" : (art == 2 ? "DOPPELT" : "EINZELN"), (unsigned) millis());
          // Tasten-Test: nur anzeigen, was erkannt wurde.
          if (id(button_test_mode)) {
            id(bt_result_key) = k;
            id(bt_result_art) = art == 1 ? "Lang" : (art == 2 ? "Doppelt" : "Einzeln");
            id(bt_result_dur) = millis() - id(bt_press_ms);
            id(bt_show_result)->execute();
            return;
          }
          switch (k) {
            case 31:  // Menue-Taste
              if (art == 1)      id(open_menu_top)->execute();      // lang: nach ganz oben
              else if (art == 2) ESP_LOGI("geste", "31 doppelt - noch frei");
              else if (id(cur_page) != 0) id(go_home)->execute();   // kurz
              else               id(open_menu)->execute();
              break;
            case 102: // Aus-Taste (Nutzerwunsch 2026-09-20)
              // kurz: nur das Bild des Fernsehers aus (Ton laeuft weiter) -
              // lang: wie bisher Power an den Streamer/das gewaehlte Geraet -
              // doppelt: Reinigungsmodus (Nutzerwunsch 2026-09-21). Dafuer wartet der
              // kurze Druck jetzt key_dbl_ms auf einen zweiten Tipp.
              if (art == 1)      id(kb).execute_action("consumer:0x0030");
              else if (art == 2) id(clean_run)->execute();
              else               id(svc_tv_screen_off)->execute();
              break;
            case 45:  // Mikrofontaste
              // lang: Assistent starten (die Aufnahme laeuft bis zum Loslassen) -
              // doppelt: zwischen Google und Home Assistant umschalten.
              if (art == 1)      id(voice_start)->execute();
              else if (art == 2) id(toggle_assistant)->execute();
              break;
            case 41:  // Taste rund ums D-Pad (nur Startseite)
              // einfach: SmartTube auf dem Streamer oeffnen, lang: die laufende
              // App wirklich beenden.
              if (art == 1)      id(svc_streamer_close_app)->execute();
              else if (art == 0) id(svc_app_smarttube)->execute();
              break;
            default:
              ESP_LOGD("geste", "Taste %d Art %d ohne Aktion", k, art);
              break;
          }

  # Feuert den langen Druck, SOBALD die Haltezeit erreicht ist - nicht erst
  # beim Loslassen. Nur so merkt man beim Halten, dass es gezaehlt hat.
  - id: gesture_long
    mode: restart
    then:
      - delay: ${key_long_ms}ms
      - if:
          condition: {lambda: "return id(gest_held) != 0 && !id(gest_done);"}
          then:
            - lambda: |-
                id(gest_done) = true;
                id(gest_key) = id(gest_held);
                id(gest_kind) = 1;
            - script.execute: gesture_action

  # ---- Bildschirmtastatur (Seite 41) ----------------------------------------
  # Belegung (QWERTZ, 10 Einheiten pro Reihe), Umschalten (^) und Tastendruck.
  # Karten und Breiten sind static: LVGL merkt sich nur die Zeiger.
  - id: kbd_setup
    then:
      - lambda: |-
          // Belegung, Breiten und Navigation stehen in open-remote-eingabe.h.
          const auto &L = eingabe::layout(id(kbd_mode), id(kbd_shift));
          static lv_buttonmatrix_ctrl_t ctrl[45];
          static bool init = false;
          lv_obj_t *m = id(kbd_matrix)->obj;
          if (!init) {
            init = true;
            lv_obj_set_style_bg_opa(m, LV_OPA_TRANSP, LV_PART_MAIN);
            lv_obj_set_style_border_width(m, 0, LV_PART_MAIN);
            lv_obj_set_style_pad_all(m, 0, LV_PART_MAIN);
            lv_obj_set_style_pad_row(m, 5, LV_PART_MAIN);
            lv_obj_set_style_pad_column(m, 4, LV_PART_MAIN);
            lv_obj_set_style_bg_color(m, lv_color_hex(0x232A35), LV_PART_ITEMS);
            lv_obj_set_style_bg_opa(m, LV_OPA_COVER, LV_PART_ITEMS);
            lv_obj_set_style_radius(m, 6, LV_PART_ITEMS);
            lv_obj_set_style_border_width(m, 0, LV_PART_ITEMS);
            lv_obj_set_style_shadow_width(m, 0, LV_PART_ITEMS);
            lv_obj_set_style_text_color(m, lv_color_hex(0xF1F3F5), LV_PART_ITEMS);
            lv_obj_set_style_bg_color(m, lv_color_hex(0x2563EB), (lv_style_selector_t) LV_PART_ITEMS | LV_STATE_PRESSED);
            // Vom D-Pad markierte Taste (CHECKED): blauer Rahmen wie im Menue.
            lv_obj_set_style_bg_color(m, lv_color_hex(0x2A3340), (lv_style_selector_t) LV_PART_ITEMS | LV_STATE_CHECKED);
            lv_obj_set_style_border_width(m, 2, (lv_style_selector_t) LV_PART_ITEMS | LV_STATE_CHECKED);
            lv_obj_set_style_border_color(m, lv_color_hex(0x3B82F6), (lv_style_selector_t) LV_PART_ITEMS | LV_STATE_CHECKED);
            lv_obj_set_style_text_color(m, lv_color_hex(0xF1F3F5), (lv_style_selector_t) LV_PART_ITEMS | LV_STATE_CHECKED);
          }
          for (int i = 0; i < L.anzahl; i++) ctrl[i] = (lv_buttonmatrix_ctrl_t) L.breite[i];
          // Ziffernblock: grosse Schrift (a18 von der Play-Taste); Tastatur: a13
          lv_obj_set_style_text_font(m, lv_obj_get_style_text_font(id(kbd_mode) == 0 ? id(m_pp_lbl) : id(cv_state), LV_PART_MAIN), LV_PART_ITEMS);
          lv_buttonmatrix_set_map(m, L.map);
          lv_buttonmatrix_set_ctrl_map(m, ctrl);
          lv_buttonmatrix_clear_button_ctrl_all(m, LV_BUTTONMATRIX_CTRL_CHECKED);
          if (id(kbd_sel) >= 0 && id(kbd_sel) < L.anzahl)
            lv_buttonmatrix_set_button_ctrl(m, id(kbd_sel), LV_BUTTONMATRIX_CTRL_CHECKED);

  - id: kbd_press
    then:
      - lambda: |-
          lv_obj_t *m = id(kbd_matrix)->obj;
          const uint32_t i = lv_buttonmatrix_get_selected_button(m);
          if (i == LV_BUTTONMATRIX_BUTTON_NONE) return;
          const char *t = lv_buttonmatrix_get_button_text(m, i);
          if (t == nullptr) return;
          const std::string s(t);
          if (s == "^") {
            id(kbd_shift) = !id(kbd_shift);
            id(kbd_setup)->execute();
          } else if (s == "<–") {
            id(kb).send_key_combo(0, 0x2A);
          } else if (s == "Ent" || s == "OK") {
            id(kb).send_key_combo(0, 0x28);
          } else if (s == "Leer") {
            id(kb).send_key_combo(0, 0x2C);
          } else {
            id(kb).send_string(s);
            if (id(kbd_shift)) { id(kbd_shift) = false; id(kbd_setup)->execute(); }   // einmaliges Umschalten
          }

  - id: gesture_single
    mode: restart
    then:
      - delay: ${key_dbl_ms}ms
      - lambda: 'id(gest_kind) = 0;'
      - script.execute: gesture_action

  # ---- Tasten-Test ---------------------------------------------------------
  # Traegt ein Ergebnis in die kleine Verlaufsliste ein und in die grosse
  # Anzeige oben - beides nur, wenn die Seite gerade offen ist (sonst
  # unnoetiges LVGL-Redraw im Hintergrund).
  - id: bt_show_result
    then:
      - lambda: |-
          if (id(cur_page) != 34) return;
          std::string art = id(bt_result_art);
          uint32_t col = 0x8B94A3;
          if (art == "Einzeln")      col = 0x22C55E;
          else if (art == "Doppelt") col = 0x3B82F6;
          else if (art == "Lang")    col = 0xEF9F1A;
          lv_label_set_text(id(bt_result_kind), art.c_str());
          lv_obj_set_style_text_color(id(bt_result_kind), lv_color_hex(col), LV_PART_MAIN);
          char detail[48];
          snprintf(detail, sizeof(detail), "Taste %d · %u ms", id(bt_result_key), (unsigned) id(bt_result_dur));
          lv_label_set_text(id(bt_result_detail), detail);
          // Verlauf: neuester Eintrag oben, fuenf sichtbar. Ein simples
          // Durchschieben reicht - die Liste ist bewusst kurz und einfach
          // gehalten ("schoene Auswertung" heisst hier: klar lesbar, nicht
          // ueberladen).
          lv_obj_t *rows[5] = {id(bt_hist_0), id(bt_hist_1), id(bt_hist_2),
                                id(bt_hist_3), id(bt_hist_4)};
          for (int i = 4; i > 0; i--)
            lv_label_set_text(rows[i], lv_label_get_text(rows[i - 1]));
          id(bt_count)++;
          char row0[64];
          snprintf(row0, sizeof(row0), "#%d  Taste %d  %s  %u ms",
                   id(bt_count), id(bt_result_key), art.c_str(), (unsigned) id(bt_result_dur));
          lv_label_set_text(rows[0], row0);

  # Wartet, ob ein zweiter Druck derselben Taste kommt (Doppel-Erkennung).
  # Kommt keiner, ist es ein Einzeldruck.
  - id: bt_single_fire
    mode: restart
    then:
      # Fenster ab dem Loslassen des ersten Drucks, zentral: key_dbl_ms
      # (substitutions ganz oben). Beginnt der zweite Druck innerhalb davon,
      # stoppt on_key dieses Skript - dann wird es ein Doppeldruck.
      - delay: ${key_dbl_ms}ms
      - lambda: |-
          if (id(bt_wait_key) == 0) return;   // durch einen zweiten Druck schon erledigt
          id(bt_result_art) = "Einzeln";
          id(bt_result_key) = id(bt_wait_key);
          id(bt_wait_key) = 0;
      - script.execute: bt_show_result

  # Vom on_key-Handler bei JEDEM Loslassen aufgerufen, solange der Tasten-Test
  # laeuft. long_press kommt fertig von der TCA8418-Komponente (deren eigener
  # long_press:700ms-Schwellwert, s. Kommentar dort) - die Haltedauer messen
  # wir zusaetzlich selbst, um sie genau anzeigen zu koennen.
  - id: bt_on_release
    then:
      - lambda: |-
          const int k = id(cur_key);
          const uint32_t dauer = millis() - id(bt_press_ms);
          id(bt_result_key) = k;
          id(bt_result_dur) = dauer;
          if (id(bt_long_press)) {
            id(bt_wait_key) = 0;   // ein langer Druck zaehlt nie als erster Teil eines Doppeldrucks
            id(bt_result_art) = "Lang";
          } else if (id(bt_dbl) && id(bt_wait_key) == k) {
            id(bt_wait_key) = 0;
            id(bt_dbl) = false;
            id(bt_result_art) = "Doppelt";
          } else {
            id(bt_wait_key) = k;
            id(bt_wait_ms) = millis();
            id(bt_single_fire)->execute();
            return;   // Einzeln/Doppelt entscheidet sich erst nach der Wartezeit
          }
      - script.execute: bt_show_result

  - id: nav_back
    then:
      # Verlassene Seite vergessen (Nutzerwunsch 2026-09-17): "zurueck" merkt
      # sich die Position nur, solange man nicht wieder herausgegangen ist -
      # ein spaeterer, neuer Abstieg in dieselbe Seite startet wieder ganz
      # oben statt an der alten Stelle. cur_page ist hier noch die Seite, die
      # gerade verlassen wird (der Wechsel passiert erst unten).
      - lambda: |-
          const int seite = id(cur_page);
          if (seite >= 0 && seite < 44) {
            id(fmem_row)[seite] = 0;
            id(fmem_col)[seite] = 0;
          }
          // Media-Seite per Zurueck verlassen: go_home darf den Zeitpunkt nicht
          // setzen, sonst bliebe die Markierung 10 s stehen.
          if (seite == 6) id(media_left_ms) = 0xFFFFFFFFu;
      - if: {condition: {lambda: "return id(cur_page) == 2;"}, then: [{lvgl.page.show: {id: page_menu,      animation: MOVE_RIGHT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(cur_page) == 3 || id(cur_page) == 9 || id(cur_page) == 16 || id(cur_page) == 19 || id(cur_page) == 20 || id(cur_page) == 21;"}, then: [{lvgl.page.show: {id: page_rooms, animation: MOVE_RIGHT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(cur_page) == 17 || id(cur_page) == 18 || id(cur_page) == 28 || id(cur_page) == 32 || id(cur_page) == 33 || id(cur_page) == 40 || id(cur_page) == 41;"}, then: [{lvgl.page.show: {id: page_devices, animation: MOVE_RIGHT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(cur_page) == 37 || id(cur_page) == 38;"}, then: [{lvgl.page.show: {id: page_cams, animation: MOVE_RIGHT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(cur_page) == 30 || id(cur_page) == 31;"}, then: [{lvgl.page.show: {id: page_music, animation: MOVE_RIGHT, time: 150ms}}]}
      # Apps von der Startseite aus geoeffnet: zurueck fuehrt dorthin zurueck,
      # nicht ins Menue - man war ja nie im Menue.
      - if: {condition: {lambda: "return id(cur_page) == 15 && id(apps_from_home);"}, then: [{script.execute: go_home}]}
      - if: {condition: {lambda: "return id(cur_page) == 4 || id(cur_page) == 5 || (id(cur_page) == 15 && !id(apps_from_home));"}, then: [{lvgl.page.show: {id: page_menu, animation: MOVE_RIGHT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(cur_page) == 8;"}, then: [{lvgl.page.show: {id: page_menu,     animation: MOVE_RIGHT, time: 150ms}}]}
      # 23 (Anzeige) fehlte hier - die Seite war dadurch nur ueber das lange
      # Halten der Menuetaste zu verlassen.
      - if: {condition: {lambda: "return id(cur_page) == 10 || id(cur_page) == 13 || id(cur_page) == 14 || id(cur_page) == 22 || id(cur_page) == 23 || id(cur_page) == 27;"}, then: [{lvgl.page.show: {id: page_settings, animation: MOVE_RIGHT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(cur_page) == 25 || id(cur_page) == 34 || id(cur_page) == 36 || id(cur_page) == 42;"}, then: [{lvgl.page.show: {id: page_service, animation: MOVE_RIGHT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(cur_page) == 12 || id(cur_page) == 29;"}, then: [{lvgl.page.show: {id: page_smarthome, animation: MOVE_RIGHT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(cur_page) == 6 && id(media_from) == 3;"}, then: [{lvgl.page.show: {id: page_room_wz, animation: MOVE_RIGHT, time: 150ms}}]}
      - if: {condition: {lambda: "return id(cur_page) <= 1 || id(cur_page) == 7 || id(cur_page) == 11 || id(cur_page) == 26 || (id(cur_page) == 6 && id(media_from) != 3);"}, then: [{script.execute: go_home}]}
      # 24 (Begruessung) getrennt: nur wirken, wenn das Display beim Druck schon an war - sonst
      # schaltet genau die Zurueck-Taste, mit der man die Remote gerade erst aufweckt (egal wie
      # lange sie vorher dunkel war), die Begruessung im selben Moment schon wieder weg.
      # millis() > 6000 WIEDER da (Nutzerbestaetigung 2026-09-23: "kurz aus/an = bleibt da, lang
      # aus/an = weg" - exakt der Neustart-Fall): bei einer LAENGEREN Pause schlaeft der Chip
      # tatsaechlich ganz ein und startet beim naechsten Tastendruck komplett neu - dabei ist
      # disp_off beim Verarbeiten der weckenden Taste IMMER erst false (kein gespeicherter Wert),
      # key_was_dark also faelschlich false. Vorher versehentlich entfernt, weil das als "nur das
      # Verhalten direkt nach dem Flashen" missverstanden wurde - es betrifft aber JEDEN echten
      # Neustart, auch aus einer laengeren Ruhephase.
      - if: {condition: {lambda: "return id(cur_page) == 24 && !id(key_was_dark) && millis() > 6000;"}, then: [{script.execute: go_home}]}

