                  pressed: {bg_color: 0x2563EB, border_color: 0x60A5FA, outline_width: 0}
                  scrolled: {bg_color: 0x1A1F27, border_color: 0x1A1F27, outline_width: 0}
                  on_click: [{script.execute: nav_back}]
                  widgets: [{label: {align: CENTER, text: "<", text_font: a15}}]
              - label: {text: "Bewegung", styles: [st_title], flex_grow: 1, pad_bottom: 0, height: 28, long_mode: DOT}
        - obj:
            width: 100%
            height: 22
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center}
            widgets:
              - label: {text: "Aufwecken bei", styles: [st_muted]}
              - label: {id: motion_mode_lbl, text: "Bewegung", text_font: a13, text_color: 0x22C55E}
        - button:
            id: mm_0
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            focused: {border_color: 0x3B82F6}
            pressed: {bg_color: 0x2563EB, border_color: 0x60A5FA, outline_width: 0}
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click:
              - lambda: 'id(motion_mode) = 0;'
              - script.execute: apply_motion_sens
              - script.execute: apply_motion_on
            widgets:
              - label: {text: "Aus", text_font: a13, flex_grow: 1}
              - label: {id: mm_0_mk, text: " ", text_font: a13, text_color: 0x22C55E}
        - button:
            id: mm_1
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            focused: {border_color: 0x3B82F6}
            pressed: {bg_color: 0x2563EB, border_color: 0x60A5FA, outline_width: 0}
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click:
              - lambda: 'id(motion_mode) = 1;'
              - script.execute: apply_motion_sens
              - script.execute: apply_motion_on
            widgets:
              - label: {text: "Bewegung", text_font: a13, flex_grow: 1}
              - label: {id: mm_1_mk, text: " ", text_font: a13, text_color: 0x22C55E}
        - button:
            id: mm_2
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            focused: {border_color: 0x3B82F6}
            pressed: {bg_color: 0x2563EB, border_color: 0x60A5FA, outline_width: 0}
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click:
              - lambda: 'id(motion_mode) = 2;'
              - script.execute: apply_motion_sens
              - script.execute: apply_motion_on
            widgets:
              - label: {text: "Hochheben", text_font: a13, flex_grow: 1}
              - label: {id: mm_2_mk, text: " ", text_font: a13, text_color: 0x22C55E}
        - obj:
            width: 100%
            height: 22
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center}
            widgets:
              - label: {text: "Empfindlichkeit", styles: [st_muted]}
              - label: {id: motion_sens_lbl, text: "Mittel", text_font: a13, text_color: 0xF1F3F5}
        # Dreistufiger Slider statt drei Knoepfen. Die Stufe steht als Wort
        # darueber - eine blosse Zahl sagt nicht, ob hoch auch empfindlich
        # bedeutet.
        - slider:
            id: ms_sld
            width: 180
            height: 26
            align: TOP_MID
            min_value: 0
            max_value: 2
            value: 1
            main: {pad_all: 3}
            indicator:
              bg_color: 0x3B82F6
              focused: {bg_color: 0x60A5FA}
            knob:
              bg_color: 0xF1F3F5
              focused: {bg_color: 0x3B82F6}
            # Auswahl INNERHALB des Reglers zeigen. Ein Ring aussen herum
            # wurde am Displayrand abgeschnitten und war deshalb nicht zu
            # sehen - und er liess den Regler zugleich zu breit wirken.
            # Jetzt: helle Schiene, blauer Knopf, kraeftigerer Balken.
            focused: {border_width: 0, outline_width: 0, bg_color: 0x3A424E}
            on_value:
              - lambda: |-
                  // Slider links = niedrig, rechts = hoch. Intern ist 0 die
                  // hoechste Empfindlichkeit, deshalb gedreht.
                  int i = (int) x; if (i < 0) i = 0; if (i > 2) i = 2;
                  id(motion_sens) = 2 - i;
              - script.execute: apply_motion_sens
