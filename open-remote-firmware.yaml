# =============================================================================
lvgl:
  displays: [main_display]
  touchscreens: [main_touch]
  default_font: a15
  # Fuer ALLE Buttons gleich (vorher an ~210 Buttons einzeln notiert): gedrueckt =
  # blau, Fokus (D-Pad) = blauer Rahmen. ESPHome erzeugt daraus sonst pro Button
  # mehrere Aufrufe in setup(); zusammen mit der Groesse des Seitenbaums scheiterte
  # der Linker (l32r, 256 KB Reichweite: "literal target out of range").
  # Einzelne Buttons koennen es weiter selbst ueberschreiben.
  # NICHT loeschen: ohne diesen Block leuchtet kein Button beim Antippen/Markieren.
  theme:
    button:
      pressed: {bg_color: 0x2563EB, border_color: 0x60A5FA, outline_width: 0}
      focused: {border_color: 0x3B82F6}
  # 25 % = 240x80x2 = 38 KB. Passt in den internen RAM (ein 100 %-Puffer landet
  # im PSRAM und ist beim Rendern deutlich langsamer - daher die
  # "lvgl took a long time"-Warnungen).
  buffer_size: 25%
  bg_color: 0x0E1116
  text_color: 0xF1F3F5
  border_color: 0x2E3643

  style_definitions:
    - id: st_screen
      bg_color: 0x0E1116
      bg_opa: COVER
      pad_all: 12
      pad_top: 10
      pad_row: 9
      border_width: 0
      text_color: 0xF1F3F5
    - id: st_title
      text_font: a18
      text_color: 0xF1F3F5
      pad_bottom: 4
    - id: st_tile
      bg_color: 0x1A1F27
      bg_opa: COVER
      radius: 14
      border_width: 2
      border_color: 0x1A1F27
      pad_all: 12
      width: 100%
      height: 44
      text_color: 0xF1F3F5
      text_font: a15
    # Zwei Zeilenformate, an die sich alles haelt:
    #   st_tile / st_ctrlbtn = einzeilig, 44 px
    #   st_tile2             = zweizeilig (Name + Zustand darunter), 60 px
    - id: st_tile2
      bg_color: 0x1A1F27
      bg_opa: COVER
      radius: 14
      border_width: 2
      border_color: 0x1A1F27
      pad_all: 10
      width: 100%
      height: 60
      text_color: 0xF1F3F5
    - id: st_ctrlbtn
      bg_color: 0x232A35
      bg_opa: COVER
      radius: 11
      border_width: 2
      border_color: 0x232A35
      pad_all: 8
      text_color: 0xF1F3F5
      text_font: a13
    - id: st_back
      bg_color: 0x1A1F27
      bg_opa: COVER
      radius: 20
      border_width: 2
      border_color: 0x1A1F27
      pad_all: 8
      text_color: 0x8B94A3
      text_font: a13
    - id: st_muted
      text_color: 0x8B94A3
      text_font: a13
      bg_opa: TRANSP
      border_width: 0

  # ==========================================================================================
  # CHECKLISTE NEUES BEDIENELEMENT (Nutzer-Erinnerung 2026-09-22 - jedes Mal pruefen, bevor ein
  # neuer Button/Slider/Widget als "fertig" gilt):
  #
  #  1. FOKUS-TABELLE: JEDES mit dem D-Pad erreichbare Widget MUSS im Script "focus_apply"
  #     (Suche nach "id: focus_apply") in der row(...)-Liste des jeweiligen "case <cur_page>:"
  #     eingetragen sein - sonst laesst es sich nicht anwaehlen/markieren UND sein "focused:"-
  #     Aussehen (z.B. beim Slider die hellere Farbe) wird NIE sichtbar, weil es nie fokussiert
  #     wird. Row-Reihenfolge = Navigationsreihenfolge (oben nach unten); bis zu drei Widgets
  #     nebeneinander in einer Zeile (row(a,b,c)) = Links/Rechts wechselt zwischen ihnen.
  #  2. NEUER SLIDER: zusaetzlich in "id: fix_slider_geometry" eintragen (Array "waag[]")! LVGL
  #     ignoriert bei diesem Aufbau sonst width/height/align aus dem YAML und zeigt seine eigene,
  #     viel kleinere Standardgroesse - sichtbar als "duenner und schmaler" als die anderen
  #     Slider, OBWOHL der YAML-Code buchstabengetreu identisch zu einem funktionierenden Slider
  #     ist (am 2026-09-22 zweimal in Folge uebersehen: erst die Fokus-Tabelle, DANN erst diese
  #     zweite, unabhaengige Ursache gefunden - beide pruefen, nicht nur eine).
  #  3. cur_page: jede Seite setzt in on_load "id(cur_page) = <Nummer>;" - die Nummer MUSS mit
  #     dem "case" in focus_apply uebereinstimmen.
  #  4. Neue Seite mit D-Pad-Bedienung: on_load braucht "id(frow) = 0; id(fcol) = 0;" und
  #     "script.execute: focus_apply" (siehe jede bestehende Seite als Vorlage).
  #  5. Neuer Button/Switch/Slider mit HA-Zustand: passenden Eintrag unter "text_sensor:
  #     platform: homeassistant" (fuer den Live-Zustand, z.B. AN/AUS-Label) UND einen
  #     "svc_*"-Script-Eintrag fuer die Aktion nicht vergessen (Beispiele: bad_light_state /
  #     svc_bad_light).
  #  6. Neue Erklaerung/Hinweistext (h_*): den Text in "id: apply_hints" ergaenzen, SONST bleibt
  #     das Feld leer (" ").
  #  7. Vor dem Flashen kurz die betroffene Seite in Gedanken durchgehen: laesst sich JEDES neue
  #     Element mit dem D-Pad anwaehlen (nicht nur antippen), und sieht jeder neue Slider genauso
  #     gross aus wie die bestehenden?
  # ==========================================================================================
  pages:
    # ================================================ 0: HOME
    - id: page_home
      styles: [st_screen]
      scrollbar_mode: "off"
      scrollable: false
      on_load:
        # Fokus-Erinnerung hier NICHT loeschen: sonst waere das 10s-Merkfenster
        # kaputt (Menue kurz schliessen und gleich wieder oeffnen zeigte die
        # Markierung nicht mehr). Vergessen wird an genau zwei Stellen:
        #  - open_menu: liegt das Verlassen des Menues mehr als 10s zurueck,
        #    wird alles geleert und das Menue beginnt ganz oben,
        #  - Display-aus-Timeout (Skript weiter oben): nach 10s Ruhe geht es
        #    heim UND vergisst sofort (Nutzerwunsch 2026-09-19: Raeume >
        #    Wohnzimmer > "Hell" darf nach Ablauf der 10s nicht mehr
        #    markiert sein).
        # fmem_last_page = -1, damit beim naechsten Betreten JEDER Seite die
        # gemerkte Position eingelesen wird (die Startseite selbst kehrt in
        # focus_apply vorzeitig zurueck und aktualisiert es nicht).
        - lambda: |-
            id(fmem_last_page) = -1;
            id(cur_page) = 0; id(frow) = 0; id(fcol) = 0;
        - script.execute: fix_slider_geometry
        - script.execute: apply_home_layout
        - script.execute: focus_apply
      widgets:
        - obj:
            align: TOP_MID
            y: 0
            width: 228
            height: 24
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            # Kein gemeinsames Flex-Layout mehr: linke Gruppe (Uhr + Timer) klebt
            # links, rechte Gruppe (Symbole/Akku) rechts - jede so breit wie ihr
            # Inhalt. Ohne festes 116-px-Fenster wird der Timer nicht mehr rechts
            # abgeschnitten (bei 1:00:00 fehlte die letzte Ziffer), und blendet man
            # die Uhr aus, rutscht der Timer nach links.
            widgets:
              - obj:
                  id: home_clock_group
                  align: LEFT_MID
                  width: SIZE_CONTENT
                  height: 22
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 3}
                  widgets:
                    # Uhr UND Sanduhr+Countdown nebeneinander (Nutzerwunsch
                    # 2026-09-17: "neben der Uhr, nicht statt der Uhr") -
                    # Icon+Label nur sichtbar, waehrend timer.timer_wohnung
                    # laeuft. home_status_btn daneben ist dafuer von 132 auf
                    # 108 geschrumpft (passt dort weiterhin locker).
                    - label: {id: idle_clock, text: "--:--", styles: [st_muted], text_font: a15}
                    - label: {id: timer_wohnung_icon, text: "\U000F051F", text_font: ico_timer, text_color: 0x3B82F6, hidden: true}
                    - label: {id: timer_wohnung_lbl, text: "0:00", text_font: a15, text_color: 0x3B82F6, hidden: true}
              # Nur noch Anzeige. Antippen laeuft ueber die unsichtbare
              # Tippflaeche home_bri_hit (letztes Widget dieser Seite = ganz
              # oben) - vorher schluckten die Symbole/Balken darin (einfache
              # obj = klickbar) so manchen Tipp, das Oeffnen war unzuverlaessig.
              - obj:
                  id: home_status_btn
                  align: RIGHT_MID
                  width: SIZE_CONTENT
                  height: 22
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  shadow_width: 0
                  scrollable: false
                  clickable: false
                  layout: {type: flex, flex_flow: row, flex_align_main: end, flex_align_cross: center, pad_column: 3}
                  widgets:
                    # Diese Reihe ist rechtsbuendig gepackt (flex_align_main: end) - dabei
                    # kehrt sich die Lesereihenfolge um: das ERSTE Widget hier landet ganz
                    # RECHTS, das letzte ganz links. Damit das Bewegungs-Icon NACH (rechts von)
                    # dem Assistenten-Symbol erscheint, muss es VOR den beiden Assistenten-
                    # Icons in der Liste stehen (Nutzerkorrektur 2026-09-22).
                    - label: {id: motion_icon, text: "\U000F1370", text_font: ico_motion, text_color: 0x3B82F6, hidden: true}
                    # Zeigt, welcher Sprachassistent gerade gewaehlt ist -
                    # nur eines von beiden sichtbar (s. apply_show/
                    # apply_assistant), komplett ausblendbar ueber die
                    # "Anzeige"-Einstellungen (Nutzerwunsch 2026-09-18).
                    - label: {id: assi_icon_google, text: "\U000F07CD", text_font: ico_google_assistant, text_color: 0x8B94A3, hidden: true}
                    - label: {id: assi_icon_ha,     text: "\U000F07D0", text_font: ico_home_assistant,   text_color: 0x8B94A3, hidden: true}
                    # Drei gezeichnete Balken statt eines Textzeichens - das
                    # sass in dieser Schrift schief und zeigte nur an/aus.
                    # Jetzt: Hoehe fest, Farbe nach Empfangsstaerke.
                    - obj:
                        id: ble_bars
                        width: 15
                        height: 16
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        widgets:
                          # Alle drei am UNTEREN Rand ausgerichtet, damit sie
                          # als Treppe stehen. Mit freien y-Werten sassen sie
                          # versetzt und sahen aus wie ein Hufeisen.
                          - obj: {id: ble_bar0, align: BOTTOM_LEFT, x: 0,  y: 0, width: 3, height: 6,  radius: 1, bg_color: 0x2A3340, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false}
                          - obj: {id: ble_bar1, align: BOTTOM_LEFT, x: 5,  y: 0, width: 3, height: 11,  radius: 1, bg_color: 0x2A3340, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false}
                          - obj: {id: ble_bar2, align: BOTTOM_LEFT, x: 10, y: 0, width: 3, height: 15, radius: 1, bg_color: 0x2A3340, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false}
                    - obj:
                        id: wifi_bars
                        width: 15
                        height: 16
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        widgets:
                          - obj: {id: wifi_bar0, align: BOTTOM_LEFT, x: 0,  y: 0, width: 3, height: 6,  radius: 1, bg_color: 0x2A3340, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false}
                          - obj: {id: wifi_bar1, align: BOTTOM_LEFT, x: 5,  y: 0, width: 3, height: 11,  radius: 1, bg_color: 0x2A3340, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false}
                          - obj: {id: wifi_bar2, align: BOTTOM_LEFT, x: 10, y: 0, width: 3, height: 15, radius: 1, bg_color: 0x2A3340, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false}
                    # Ladesymbol (Blitz) - nur sichtbar waehrend geladen wird.
                    - label:
                        id: lbl_batt_chg
                        text: "\U000F0241"
                        text_font: ico_charge
                        text_color: 0x22C55E
                        hidden: true
                    - label: {id: lbl_batt, text: "-%", styles: [st_muted], text_font: a15}
        # Kamerabilder auf den Fernseher legen. Ersetzt die fruehere
        # Medienkarte - was gerade laeuft, wird hier nicht mehr gebraucht.
        # Ein-/Ausblenden jetzt ueber cam_toggle_btn, das als schwebender
        # Button AUF der Wiedergabe-Karte sitzt (home_player_btn weiter
        # unten) statt einer eigenen Zeile hier oben - Nutzerwunsch
        # 2026-09-16, spart die Zeile komplett statt nur zu verkleinern.
        - obj:
            id: cam_grid
            align: TOP_MID
            y: 28
            # Behaelter ist 6 px breiter (je Seite) und 6 px hoeher als die
            # Buttons: LVGL beschneidet Kinder am Rand des Elternobjekts - dadurch
            # fehlte bei "Zelt"/"Aus" (unterste Reihe) der helle Unterrand.
            width: 228
            height: 114
            bg_opa: TRANSP
            border_width: 0
            pad_top: 0
            pad_bottom: 0
            pad_left: 6
            pad_right: 6
            scrollable: false
            layout: {type: flex, flex_flow: row_wrap, flex_align_main: space_between, flex_align_cross: center, pad_row: 6, pad_column: 8}
            widgets:
              - button:
                  id: cam_h
                  width: 104
                  height: 32
                  bg_color: 0x1A1F27
                  radius: 10
                  border_width: 2
                  border_color: 0x1A1F27
                  on_click:
                    - script.execute: svc_cam_haustuer
                    # Rueckmeldung bleibt eine knappe Sekunde stehen - beim
                    # blossen Antippen waere sie sonst kaum zu sehen.
                    - lambda: |-
                        lv_obj_set_style_bg_color(id(cam_h), lv_color_hex(0x2563EB), LV_PART_MAIN);
                        lv_obj_set_style_border_color(id(cam_h), lv_color_hex(0x60A5FA), LV_PART_MAIN);
                    - delay: 900ms
                    - lambda: |-
                        lv_obj_set_style_bg_color(id(cam_h), lv_color_hex(0x1A1F27), LV_PART_MAIN);
                        lv_obj_set_style_border_color(id(cam_h), lv_color_hex(0x1A1F27), LV_PART_MAIN);
                  widgets: [{label: {align: CENTER, text: "Haustür", text_font: a13}}]
              - button:
                  id: cam_w
                  width: 104
                  height: 32
