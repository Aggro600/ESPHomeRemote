      - lvgl.label.update: {id: sh_test_lbl, text_color: !lambda 'return x=="on" ? lv_color_hex(0x22C55E) : lv_color_hex(0x8B94A3);'}

# =============================================================================
lvgl:
  displays: [main_display]
  touchscreens: [main_touch]
  default_font: a15
  # 25 % = 240x80x2 = 38 KB. Passt in den internen RAM (ein 100 %-Puffer landet
  # im PSRAM und ist beim Rendern deutlich langsamer - daher die
  # "lvgl took a long time"-Warnungen).
  buffer_size: 25%
  bg_color: 0x0E1116
  text_color: 0xF1F3F5
  border_color: 0x2E3643

  style_definitions:
    - id: st_screen
      bg_color: 0x0E1116
      bg_opa: COVER
      pad_all: 12
      pad_top: 10
      pad_row: 9
      border_width: 0
      text_color: 0xF1F3F5
    - id: st_title
      text_font: a18
      text_color: 0xF1F3F5
      pad_bottom: 4
    - id: st_tile
      bg_color: 0x1A1F27
      bg_opa: COVER
      radius: 14
      border_width: 2
      border_color: 0x1A1F27
      pad_all: 12
      width: 100%
      height: 44
      text_color: 0xF1F3F5
      text_font: a15
    # Zwei Zeilenformate, an die sich alles haelt:
    #   st_tile / st_ctrlbtn = einzeilig, 44 px
    #   st_tile2             = zweizeilig (Name + Zustand darunter), 60 px
    - id: st_tile2
      bg_color: 0x1A1F27
      bg_opa: COVER
      radius: 14
      border_width: 2
      border_color: 0x1A1F27
      pad_all: 10
      width: 100%
      height: 60
      text_color: 0xF1F3F5
    - id: st_ctrlbtn
      bg_color: 0x232A35
      bg_opa: COVER
      radius: 11
      border_width: 2
      border_color: 0x232A35
      pad_all: 8
      text_color: 0xF1F3F5
      text_font: a13
    - id: st_back
      bg_color: 0x1A1F27
      bg_opa: COVER
      radius: 20
      border_width: 2
      border_color: 0x1A1F27
      pad_all: 8
      text_color: 0x8B94A3
      text_font: a13
    - id: st_muted
      text_color: 0x8B94A3
      text_font: a13
      bg_opa: TRANSP
      border_width: 0

  pages:
    # ================================================ 0: HOME
    - id: page_home
      styles: [st_screen]
      scrollbar_mode: "off"
      scrollable: false
      on_load:
        - lambda: 'id(cur_page) = 0; id(frow) = 0; id(fcol) = 0;'
        - script.execute: fix_slider_geometry
        - script.execute: focus_apply
      widgets:
        - obj:
            align: TOP_MID
            y: 0
            width: 216
            height: 20
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center}
            widgets:
              - label: {id: idle_clock, text: "--:--", styles: [st_muted]}
              # Antippbar: oeffnet den Helligkeitsregler am rechten Rand.
              - button:
                  id: home_status_btn
                  width: 132
                  height: 18
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  shadow_width: 0
                  scrollable: false
                  on_click: [{script.execute: toggle_bri_overlay}]
                  layout: {type: flex, flex_flow: row, flex_align_main: end, flex_align_cross: center, pad_column: 6}
                  widgets:
                    # Drei gezeichnete Balken statt eines Textzeichens - das
                    # sass in dieser Schrift schief und zeigte nur an/aus.
                    # Jetzt: Hoehe fest, Farbe nach Empfangsstaerke.
                    - obj:
                        id: ble_bars
                        width: 15
                        height: 14
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        widgets:
                          # Alle drei am UNTEREN Rand ausgerichtet, damit sie
                          # als Treppe stehen. Mit freien y-Werten sassen sie
                          # versetzt und sahen aus wie ein Hufeisen.
                          - obj: {id: ble_bar0, align: BOTTOM_LEFT, x: 0,  y: 0, width: 3, height: 5,  radius: 1, bg_color: 0x2A3340, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false}
                          - obj: {id: ble_bar1, align: BOTTOM_LEFT, x: 5,  y: 0, width: 3, height: 9,  radius: 1, bg_color: 0x2A3340, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false}
                          - obj: {id: ble_bar2, align: BOTTOM_LEFT, x: 10, y: 0, width: 3, height: 13, radius: 1, bg_color: 0x2A3340, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false}
                    - obj:
                        id: wifi_bars
                        width: 15
                        height: 14
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        widgets:
                          - obj: {id: wifi_bar0, align: BOTTOM_LEFT, x: 0,  y: 0, width: 3, height: 5,  radius: 1, bg_color: 0x2A3340, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false}
                          - obj: {id: wifi_bar1, align: BOTTOM_LEFT, x: 5,  y: 0, width: 3, height: 9,  radius: 1, bg_color: 0x2A3340, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false}
                          - obj: {id: wifi_bar2, align: BOTTOM_LEFT, x: 10, y: 0, width: 3, height: 13, radius: 1, bg_color: 0x2A3340, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false}
                    # Ladesymbol (Blitz) - nur sichtbar waehrend geladen wird.
                    - label:
                        id: lbl_batt_chg
                        text: "\U000F0241"
                        text_font: ico_charge
                        text_color: 0x22C55E
                        hidden: true
                    - label: {id: lbl_batt, text: "-%", styles: [st_muted]}
        # Kamerabilder auf den Fernseher legen. Ersetzt die fruehere
        # Medienkarte - was gerade laeuft, wird hier nicht mehr gebraucht.
        - obj:
            align: TOP_MID
            y: 28
            width: 216
            height: 116
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: row_wrap, flex_align_main: space_between, flex_align_cross: center, pad_row: 6, pad_column: 8}
            widgets:
              - button:
                  id: cam_h
                  width: 104
                  height: 34
                  bg_color: 0x1A1F27
                  radius: 10
                  border_width: 2
                  border_color: 0x1A1F27
                  focused: {border_color: 0x3B82F6}
                  pressed: {bg_color: 0x2563EB, border_color: 0x60A5FA, outline_width: 0}
                  on_click:
                    - script.execute: svc_cam_haustuer
                    # Rueckmeldung bleibt eine knappe Sekunde stehen - beim
                    # blossen Antippen waere sie sonst kaum zu sehen.
                    - lambda: |-
                        lv_obj_set_style_bg_color(id(cam_h), lv_color_hex(0x2563EB), LV_PART_MAIN);
                        lv_obj_set_style_border_color(id(cam_h), lv_color_hex(0x60A5FA), LV_PART_MAIN);
                    - delay: 900ms
                    - lambda: |-
                        lv_obj_set_style_bg_color(id(cam_h), lv_color_hex(0x1A1F27), LV_PART_MAIN);
                        lv_obj_set_style_border_color(id(cam_h), lv_color_hex(0x1A1F27), LV_PART_MAIN);
                  widgets: [{label: {align: CENTER, text: "Haustür", text_font: a13}}]
              - button:
