            widgets:
              - obj: {x: -10, y: 0, width: 20, height: 20, radius: 10, bg_color: 0x1A1F27, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false, clickable: false}
        # ---- Tastenlicht-Overlay (linke Haelfte der Statusleiste antippen) ----
        # Senkrechter Regler fuer die TASTENhelligkeit (bernstein) + kleines Feld zum
        # An-/Ausschalten der Tastenbeleuchtung. Blendet sich nach 4 s aus.
        - slider:
            id: home_kbd_sld
            hidden: true
            # Gleiche Laenge und Lage wie home_bri_sld (RIGHT_MID, x:-6, y:6, height:176) -
            # LEFT_MID statt TOP_LEFT gespiegelt, damit beide Regler exakt gleich lang sind und
            # oben/unten auf derselben Hoehe enden (Nutzerwunsch 2026-09-23: "unterschiedlich
            # gross und unterschiedlich lang"). Vorher begann er bei y:74, nur 8px unter dem
            # AN/AUS-Knopf (der bis y:66 reicht) - der Regler-Knopf am oberen Anschlag konnte
            # dadurch mit dem Knopf kollidieren. Jetzt 12px Abstand (Knopf bis 66, Regler ab 78).
            # HINWEIS: "id: fix_slider_geometry" setzt Groesse/Position zur Laufzeit ohnehin neu -
            # die Werte hier nur der Vollstaendigkeit halber synchron gehalten.
            align: LEFT_MID
            x: 6
            y: 6
            width: 30
            height: 176
            min_value: 5
            max_value: 100
            value: 60
            main: {pad_all: 3, bg_color: 0x1A1F27}
            indicator:
              bg_color: 0xF59E0B
              focused: {bg_color: 0xFBBF24}
            knob:
              bg_color: 0xF1F3F5
              focused: {bg_color: 0xF59E0B}
            on_value:
              - lambda: 'id(kbd_bri) = (int) x;'
              - script.execute: apply_brightness
              - script.execute: hide_kbd_overlay
        - button:
            id: home_kbd_box
            hidden: true
            align: TOP_LEFT
            x: -6
            y: 36
            width: 30
            height: 30
            radius: 8
            bg_color: 0x1A1F27
            border_width: 2
            border_color: 0x3A424E
            pad_all: 0
            pressed: {bg_color: 0x2563EB}
            on_click: [{script.execute: kbd_overlay_light}]
            widgets: [{label: {id: home_kbd_lbl, align: CENTER, text: "AUS", text_font: a13, text_color: 0x8B94A3}}]
        # Unsichtbare Tippflaeche ueber der RECHTEN Haelfte der Statusleiste
        # (Displayrand bis Displayrand, oben 0..36 px): oeffnet den
        # Helligkeitsregler. Als LETZTES Widget liegt sie ueber allem - die
        # Symbole darunter (WLAN, Bluetooth, Akku ...) koennen keinen Tipp mehr
        # abfangen. Endet vor den Kamera-Buttons (ab ca. 38 px).
        - obj:
            id: home_bri_hit
            align: TOP_RIGHT
            x: 12
            y: -10
            width: 120
            height: 36
            bg_opa: TRANSP
            border_width: 0
            outline_width: 0
            shadow_width: 0
            pad_all: 0
            scrollable: false
            on_click: [{script.execute: toggle_bri_overlay}]
        # Linke Haelfte: Tastenlicht (s. oben).
        - obj:
            id: home_kbd_hit
            align: TOP_LEFT
            x: -12
            y: -10
            width: 120
            height: 36
            bg_opa: TRANSP
            border_width: 0
            outline_width: 0
            shadow_width: 0
            pad_all: 0
            scrollable: false
            on_click: [{script.execute: toggle_kbd_overlay}]

