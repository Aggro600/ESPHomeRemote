          text: !lambda |-
            // Home Assistant liefert die Raumnamen klein ("bad"). Jeden
            // Namen gross anfangen lassen, auch nach einem Komma.
            if (x.empty()) return std::string("keine");
            std::string r = x;
            bool anfang = true;
            for (size_t i = 0; i < r.size(); i++) {
              if (anfang && r[i] >= 'a' && r[i] <= 'z') r[i] = (char) (r[i] - 32);
              anfang = (r[i] == ',' || r[i] == ' ');
