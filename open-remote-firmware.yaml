  # ---- Fokus setzen: haelt den Fokus IMMER auf einem sichtbaren Button der
  #      aktuellen Seite und scrollt ihn in den sichtbaren Bereich. -----------
  - id: focus_apply
    then:
      - lambda: |-
          // Fokus-Raster der aktuellen Seite: eine Zeile pro Bedienzeile.
          // Hoch/Runter wechselt die ZEILE, Links/Rechts nur die Spalte
          // INNERHALB der Zeile - nebeneinanderliegende Buttons werden beim
          // Runterdruecken also uebersprungen, nicht durchlaufen.
          // Bis zu 48 Zeilen (Energie & Wecken hat 34) und 5 Spalten (Media-Seite: - << Play >> +); die Begrenzung
          // in row() verhindert, dass eine zu lange Seite ueber das Feldende schreibt.
          lv_obj_t *g[48][5] = {};
          int rl[48] = {};
          int nr = 0;
          auto row = [&](lv_obj_t *a, lv_obj_t *b, lv_obj_t *c) {
            if (nr >= 48) {
              ESP_LOGE("fokus", "Seite %d hat mehr als 48 Zeilen - Rest ignoriert",
                       id(cur_page));
              return;
            }
            int k = 0;
            g[nr][k++] = a;
            if (b != nullptr) g[nr][k++] = b;
            if (c != nullptr) g[nr][k++] = c;
            rl[nr] = k;
            nr++;
          };
          // Zeile mit bis zu fuenf Feldern (Media-Seite).
          auto row5 = [&](lv_obj_t *a, lv_obj_t *b, lv_obj_t *c, lv_obj_t *d, lv_obj_t *e) {
            if (nr >= 48) return;
            lv_obj_t *l[5] = {a, b, c, d, e};
            int k = 0;
            for (int i = 0; i < 5; i++) if (l[i] != nullptr) g[nr][k++] = l[i];
            rl[nr] = k;
            nr++;
          };
          switch (id(cur_page)) {
            case 25: // Neustart-Rueckfrage - Abbrechen steht vorne, damit
                     // ein versehentliches OK nichts ausloest.
              row(id(restart_no),  nullptr, nullptr);
              row(id(restart_yes), nullptr, nullptr);
              break;
            case 26: // Sprachantwort
              row(id(voice_close), nullptr, nullptr);
              break;
            case 24: // Begruessung - nichts zu fokussieren, sie wird weggetippt oder mit
                     // der Menuetaste geschlossen; die Tasten steuern solange das Geraet.
              id(cur_focus) = nullptr;
              return;
            case 0:  // Home - kein Fokus: das D-Pad steuert hier den Fernseher,
                     // die Kacheln werden per Touch bedient.
              // Ohne das hier behalten angetippte Knoepfe ihre Markierung:
              // LVGL setzt sie beim Klick, und auf dieser Seite raeumt sie
              // niemand wieder weg. Die kurze Rueckmeldung beim Druecken
              // uebernimmt der pressed-Zustand.
              {
                std::function<void(lv_obj_t *)> putzen = [&](lv_obj_t *o) {
                  uint32_t n = lv_obj_get_child_count(o);
                  for (uint32_t i = 0; i < n; i++) {
                    lv_obj_t *c = lv_obj_get_child(o, i);
                    lv_obj_remove_flag(c, LV_OBJ_FLAG_CLICK_FOCUSABLE);
                    lv_obj_remove_state(c, LV_STATE_FOCUSED);
                    putzen(c);
                  }
                };
                // `sc` wird erst nach diesem Auswahlblock deklariert -
                // deshalb den aktiven Bildschirm direkt holen.
                lv_obj_t *akt = lv_screen_active();
                if (akt != nullptr) putzen(akt);
              }
              lv_obj_remove_state(id(app_home_btn), LV_STATE_FOCUSED);
              lv_obj_remove_state(id(home_player_btn), LV_STATE_FOCUSED);
              id(cur_focus) = nullptr;
              return;
            case 43: // Akku (nur Anzeige)
              row(id(back_akku), nullptr, nullptr);
              break;
            case 6:  // Media Player
              // Von oben nach unten wie auf dem Bildschirm: Zurueck, (Fernseher
              // einschalten, nur solange der Fernseher aus ist), dann EINE Reihe
              // - << Play >> + . Runter aus Zurueck landet auf Play, Links/Rechts
              // laeuft durch die fuenf Tasten, Runter aus der Reihe wieder auf
              // Zurueck (umlaufend).
              row(id(back_media), nullptr, nullptr);
              if (!lv_obj_has_flag(id(m_tv_on), LV_OBJ_FLAG_HIDDEN))
                row(id(m_tv_on), nullptr, nullptr);
              row5(id(m_voldown), id(m_prev), id(m_playpause), id(m_next), id(m_volup));
              break;
            case 41: // Ziffern/Tastatur (nur Touch, die Zurueck-Taste geht auch)
              row(id(back_keyboard), nullptr, nullptr);
              break;
            case 38: // Live-Bild (schnell)
              row(id(cf_prev), id(cf_next), nullptr);
              row(id(cf_restart), nullptr, nullptr);
              row(id(back_camlive), nullptr, nullptr);
              break;
            case 37: // Kamerabild
              row(id(cv_prev), id(cv_next), nullptr);
              row(id(cv_refresh), nullptr, nullptr);
              row(id(back_camview), nullptr, nullptr);
              break;
            case 27: // Energie & Wecken
              row(id(ps_wifi_btn),     nullptr, nullptr);
              row(id(ps_wifimax_btn),  nullptr, nullptr);
              row(id(ps_wifi_off_btn), nullptr, nullptr);
              row(id(ps_wifis_sld),    nullptr, nullptr);
              row(id(ps_wifitv_sld),   nullptr, nullptr);
              row(id(ps_cpu_sld),      nullptr, nullptr);
              row(id(ps_light_btn),    nullptr, nullptr);
              row(id(ps_wfest_btn),    nullptr, nullptr);
              row(id(ps_wfrueh_btn),   nullptr, nullptr);
              if (wlan_zugriff::g_set_nur_ble) row(id(ps_nurble_btn), nullptr, nullptr);
              row(id(ps_bleidle_btn),  nullptr, nullptr);
              row(id(ps_bles_sld),     nullptr, nullptr);
              row(id(mm_0),            nullptr, nullptr);
              row(id(mm_1),            nullptr, nullptr);
              row(id(mm_2),            nullptr, nullptr);
              row(id(ms_sld),          nullptr, nullptr);
              row(id(keys_wake_btn),   nullptr, nullptr);
              row(id(menue_weckt_btn), nullptr, nullptr);
              row(id(dim_wake_btn),    nullptr, nullptr);
              row(id(dim_hold_btn),    nullptr, nullptr);
              row(id(ds_sld),          nullptr, nullptr);
              row(id(klopf_btn),       nullptr, nullptr);
              row(id(kl_sld),          nullptr, nullptr);
              row(id(ps_touch_btn),    nullptr, nullptr);
              row(id(ps_touchms_sld),  nullptr, nullptr);
              row(id(ps_deep_btn),     nullptr, nullptr);
              row(id(ps_deepble_btn),  nullptr, nullptr);
              row(id(ps_deeps_sld),    nullptr, nullptr);
              row(id(ps_deeptv_sld),   nullptr, nullptr);
              row(id(ps_low_sld),      nullptr, nullptr);
              row(id(back_power),      nullptr, nullptr);
              break;
            case 44: // Smart Display
              row(id(dock_an_btn),       nullptr, nullptr);
              row(id(dock_disp_btn),     nullptr, nullptr);
              row(id(dock_von_sld),      nullptr, nullptr);
              row(id(dock_bis_sld),      nullptr, nullptr);
              row(id(musik_dock_btn),    nullptr, nullptr);
              row(id(musik_player_btn),  nullptr, nullptr);
              row(id(ha_dock_btn),       nullptr, nullptr);
              row(id(ha_link_btn),       nullptr, nullptr);
              row(id(ha_linkm_btn),      nullptr, nullptr);
              row(id(back_extras),       nullptr, nullptr);
              break;
            case 23: // Anzeige
              row(id(show_ble_btn),   nullptr, nullptr);
              row(id(show_wifi_btn),  nullptr, nullptr);
              row(id(show_batt_btn),  nullptr, nullptr);
              row(id(show_clock_btn), nullptr, nullptr);
              row(id(show_assi_btn),  nullptr, nullptr);
              row(id(show_motion_btn), nullptr, nullptr);
              row(id(show_ha_btn),     nullptr, nullptr);
              row(id(cover_player_btn), nullptr, nullptr);
              row(id(cover_home_btn),   nullptr, nullptr);
              row(id(mem_sld),        nullptr, nullptr);
              row(id(menu_close_sld), nullptr, nullptr);
              row(id(sd_logos_btn),   nullptr, nullptr);
              row(id(back_show),      nullptr, nullptr);
              break;
            case 13: // Sprache
              row(id(tile_assi),        nullptr, nullptr);
              row(id(tile_google_mode), nullptr, nullptr);
              row(id(tile_tts),         nullptr, nullptr);
              row(id(tile_mic),    nullptr, nullptr);
              row(id(tile_mic_warm), nullptr, nullptr);
              row(id(back_voice),  nullptr, nullptr);
              break;
            case 22: // Bildschirm
              row(id(disp_bri_sld),  nullptr, nullptr);
              row(id(kbd_light_btn), nullptr, nullptr);
              row(id(kbd_bri_sld),   nullptr, nullptr);
              row(id(to_sld),        nullptr, nullptr);
              row(id(ps_dim_sld),    nullptr, nullptr);
              row(id(ps_dimp_sld),   nullptr, nullptr);
              row(id(back_bright),   nullptr, nullptr);
              break;
            case 42: // SD-Karte
              row(id(sd_mount_btn),  nullptr, nullptr);
              row(id(sd_logoreset_btn), nullptr, nullptr);
              row(id(sd_konfig_btn), nullptr, nullptr);
              row(id(sd_eject_btn),  nullptr, nullptr);
              row(id(back_sd),       nullptr, nullptr);
              break;
            case 14: // Wartung & Tests
              row(id(tile_touchtest),    nullptr, nullptr);
              row(id(tile_button_test),  nullptr, nullptr);
              row(id(clean_dur_sld),     nullptr, nullptr);
              row(id(tile_clean),        nullptr, nullptr);
              row(id(tile_sd),           nullptr, nullptr);
              row(id(ps_log_btn),        nullptr, nullptr);
              row(id(testmod_btn),       nullptr, nullptr);
              row(id(tile_shutdown),     nullptr, nullptr);
              row(id(tile_restart),      nullptr, nullptr);
              row(id(back_service),      nullptr, nullptr);
              break;
            case 10: // Bluetooth
              row(id(ble_slot0),   nullptr, nullptr);
              row(id(ble_slot1),   nullptr, nullptr);
              row(id(ble_slot2),   nullptr, nullptr);
              row(id(ble_slot3),   nullptr, nullptr);
              row(id(ble_connect), id(ble_pair), id(ble_forget));
              row(id(ble_eing0_btn), nullptr, nullptr);
              row(id(ble_eing1_btn), nullptr, nullptr);
              row(id(ble_eing2_btn), nullptr, nullptr);
              row(id(ble_eing3_btn), nullptr, nullptr);
              row(id(ble_par_btn), nullptr, nullptr);
              row(id(bt_weg_btn), nullptr, nullptr);
              row(id(maus_tempo_sld), nullptr, nullptr);
              row(id(maus_dpad_btn), nullptr, nullptr);
              row(id(maus_dpad_sld), nullptr, nullptr);
              row(id(maus_zurueck_btn), nullptr, nullptr);
              row(id(back_ble),    nullptr, nullptr);
              break;
            case 34: // Tasten-Test
              row(id(bt_toggle_btn),     nullptr, nullptr);
              row(id(back_button_test),  nullptr, nullptr);
              break;
            default: return;
          }
          if (nr == 0) return;

          // ---- Fokusposition je Seite merken -----------------------------
          // Kommt man aus einem Untermenue zurueck, steht die Markierung
          // wieder auf dem Eintrag, ueber den man hineingegangen ist
          // (Nutzerwunsch 2026-09-16). Bewusst HIER und nicht in jeder Seite
          // einzeln: die on_load-Lambdas setzen zwar weiterhin frow/fcol auf
          // 0, das wird beim Seitenwechsel aber sofort durch den gemerkten
          // Wert ersetzt. Dadurch gilt das Merken automatisch auch fuer jede
          // kuenftige Seite, ohne dass dort irgendetwas ergaenzt werden muss.
          // Ungueltig gewordene Positionen (Seite hat heute weniger Zeilen als
          // beim letzten Besuch) faengt die Gueltigkeitspruefung weiter unten
          // ab, die beim Seitenwechsel ohnehin laeuft.
          // fmem_row/fmem_col/fmem_last_page sind jetzt globals (nicht mehr
          // static hier drin) - nav_back setzt beim Verlassen einer Seite
          // deren Eintrag zurueck auf 0, open_menu_top (langer Druck) leert
          // beim Sprung ins Startmenue alles (Nutzerwunsch 2026-09-17: nur
          // merken, bis man wieder zurueckgeht - nicht dauerhaft).
          const int seite = id(cur_page);
          const bool seitenwechsel = (seite != id(fmem_last_page));
          if (seitenwechsel) {
            id(fmem_last_page) = seite;
            if (seite >= 0 && seite < 44) {
              id(frow) = id(fmem_row)[seite];
              id(fcol) = id(fmem_col)[seite];
            }
            // Eine noch anliegende Richtung gehoert zur VORHERIGEN Seite -
            // sonst wandert die wiederhergestellte Position sofort weiter.
            id(fdrow) = 0;
            id(fdcol) = 0;
          }

          // LVGL entscheidet selbst zuverlaessig, ob eine Beruehrung ein Klick
          // oder ein Wischen war - das muss man nicht nachbauen. Kinderklicks
          // an die Seite durchreichen und dort EINMAL einen Zuhoerer setzen,
          // der den Fokus auf das wirklich geklickte Feld zieht.
          {
            lv_obj_t *sc = lv_screen_active();
            for (int i2 = 0; i2 < nr; i2++)
              for (int j2 = 0; j2 < rl[i2]; j2++) {
                // Bis zur Seite hinauf durchreichen: liegt ein Knopf in einer
                // Zeile oder in der Kopfzeile, muss auch dieser Zwischenbehaelter
                // weiterreichen - sonst erreicht der Klick den Zuhoerer nie und
                // der Fokus springt nicht mit (fiel beim Zurueck-Knopf auf).
                for (lv_obj_t *up = g[i2][j2]; up != nullptr && up != sc;
                     up = lv_obj_get_parent(up))
                  lv_obj_add_flag(up, LV_OBJ_FLAG_EVENT_BUBBLE);
                // Entscheidend: LVGL nimmt anklickbare Felder beim Beruehren in
                // seine EIGENE Fokusgruppe auf und setzt dort LV_STATE_FOCUSED -
                // denselben Zustand, den auch unsere Tastensteuerung benutzt.
                // Dadurch waren zwei Felder gleichzeitig markiert (per Diagnose
                // nachgewiesen). Wir vergeben den Fokus selbst, also nehmen wir
                // LVGL diese Zustaendigkeit weg.
                lv_obj_remove_flag(g[i2][j2], LV_OBJ_FLAG_CLICK_FOCUSABLE);
              }
            // Die Kopfzeile ist der Elternteil des Zurueck-Knopfes (letzte
            // Zeile). FLOATING nimmt sie aus dem Fluss - sie bleibt beim
            // Scrollen stehen, statt mit nach oben zu wandern.
            if (nr > 0) {
              lv_obj_t *bk = g[nr - 1][0];
              lv_obj_t *hd = bk ? lv_obj_get_parent(bk) : nullptr;
              if (hd != nullptr && hd != sc) {
                lv_obj_add_flag(hd, LV_OBJ_FLAG_FLOATING);
                // Randlos: die Kopfzeile deckt die volle Displaybreite ab und
                // reicht bis an den oberen Rand. Sonst scheinen beim Scrollen
                // oben und seitlich Knoepfe daran vorbei. Die Ausrichtung
                // bezieht sich auf die INHALTSFLAECHE, deshalb der Versatz um
                // die Seitenraender (-12 / -42).
                // Versatz aus den Seitenraendern BERECHNEN statt fest
                // eintragen: die Ausrichtung bezieht sich auf die
                // Inhaltsflaeche, und feste Werte laufen aus dem Ruder, sobald
                // sich pad_top einer Seite aendert.
                const int pl = lv_obj_get_style_pad_left(sc, LV_PART_MAIN);
                const int pt = lv_obj_get_style_pad_top(sc, LV_PART_MAIN);
                lv_obj_set_width(hd, 240);
                lv_obj_set_height(hd, 44);
                lv_obj_align(hd, LV_ALIGN_TOP_LEFT, -pl, -pt);
                // Innenabstand, damit der Zurueck-Knopf nicht am Displayrand
                // klebt - links wie oben.
                // Zurueck-Knopf ueberall an derselben Stelle wie im Menue: x=6, y=9 (2026-10-13).
                lv_obj_set_style_pad_left(hd, 6, LV_PART_MAIN);
                lv_obj_set_style_pad_right(hd, 6, LV_PART_MAIN);
                // Zurueck-Knopf bei y=6 auf allen Seiten gleich (2026-10-12, auch Menue und Media Player):
                // 6 oben + 30 Knopf + 8 unten = 44 (2026-10-13: 3 px hoeher).
                lv_obj_set_style_pad_top(hd, 6, LV_PART_MAIN);
                lv_obj_set_style_pad_bottom(hd, 8, LV_PART_MAIN);
                lv_obj_move_foreground(hd);
                tasten::kopf_linie(hd, bk, lv_color_to_u32(lv_obj_get_style_bg_color(hd, LV_PART_MAIN)) & 0xFFFFFF);
              }
            }
            if (sc != nullptr && lv_obj_get_user_data(sc) == nullptr) {
              lv_obj_set_user_data(sc, (void *) 1);
              lv_obj_add_event_cb(sc, [](lv_event_t *e) {
                // Auf Seiten, die nicht scrollen, macht LVGL aus einem Wischen
                // trotzdem einen Klick - es gibt ja keine Scrollbewegung, die
                // ihn abbrechen wuerde. Deshalb hier zusaetzlich pruefen, ob
                // der Finger sich bewegt hat.
                if (id(touch_moved)) return;
                id(click_obj) = lv_event_get_target(e);
                // Helligkeits-Ueberlagerung schliessen, sobald woanders
                // hingetippt wird - ausser auf ihr selbst oder auf der
                // Statuszeile, die sie oeffnet.
                lv_obj_t *t = (lv_obj_t *) lv_event_get_target(e);
                // Schnellmenue: alles darin (auch Kinder der Kacheln) zaehlt als "selbst".
                bool im_qs = false;
                for (lv_obj_t *p = t; p != nullptr && !im_qs; p = lv_obj_get_parent(p))
                  im_qs = p == id(qs_panel) || p == id(home_kbd_box);
                if (!im_qs && t != id(home_bri_sld) && t != id(home_kbd_sld) &&
                    t != id(home_bri_hit) && t != id(home_kbd_hit))
                  id(close_bri_overlay)->execute();
                id(focus_apply)->execute();
              }, LV_EVENT_CLICKED, nullptr);
            }
          }

          bool moved = (id(fdrow) != 0 || id(fdcol) != 0);
          int r = id(frow);
          int c = id(fcol);

          // Beruehrung: den Fokus auf das angetippte Feld setzen, damit die
          // Tasten danach von dort weiterlaufen und nur EIN Feld markiert ist.
          bool from_touch = false;
          if (id(click_obj) != nullptr) {
            lv_obj_t *hit = (lv_obj_t *) id(click_obj);
            id(click_obj) = nullptr;
            id(fdrow) = 0;
            id(fdcol) = 0;
            bool found = false;
            for (int i2 = 0; i2 < nr && !found; i2++)
              for (int j2 = 0; j2 < rl[i2]; j2++)
                if (g[i2][j2] == hit) { r = i2; c = j2; found = true; break; }
            if (!found) return;      // Klick lag nicht auf einem Bedienfeld
            from_touch = true;
            moved = false;
          } else if (id(fdrow) != 0) {
            // Hoch/Runter: Zeile wechseln, unten/oben umlaufen. Die Spalte wird
            // in die neue Zeile eingepasst (nicht umgebrochen), damit man aus
            // der rechten Spalte auch rechts wieder herauskommt.
            const int from = rl[r];
            r += id(fdrow);
            if (r < 0)   r = nr - 1;
            if (r >= nr) r = 0;
            // Spalte proportional auf die neue Zeilenbreite abbilden und dabei
            // abrunden: aus der Mitte einer Dreierzeile geht es damit nach
            // links, nicht nach rechts. (Play/Pause -> leiser, nicht lauter.)
            if (from > 0 && rl[r] != from) c = (c * rl[r]) / from;
            // Media-Seite: in die Tastenreihe auf die zuletzt markierte Taste (beim
            // ersten Mal Play/Pause in der Mitte).
            if (id(cur_page) == 6 && rl[r] == 5) c = id(media_btn_col);
            if (c >= rl[r]) c = rl[r] - 1;
            if (c < 0)      c = 0;
          } else if (id(fdcol) != 0) {
            // Links/Rechts: nur innerhalb der Zeile, dort umlaufend.
            c += id(fdcol);
            if (c < 0)      c = rl[r] - 1;
            if (c >= rl[r]) c = 0;
          } else {
            // Seitenwechsel: nur auf Gueltigkeit pruefen.
            if (r < 0 || r >= nr)  r = 0;
            if (c < 0 || c >= rl[r]) c = 0;
          }
          id(fdrow) = 0;
          id(fdcol) = 0;
          id(frow) = r;
          id(fcol) = c;
          if (id(cur_page) == 6 && rl[r] == 5) id(media_btn_col) = c;
          if (seite >= 0 && seite < 44) {
            id(fmem_row)[seite] = (int8_t) r;
            id(fmem_col)[seite] = (int8_t) c;
          }

          for (int i = 0; i < nr; i++) {
            for (int j = 0; j < rl[i]; j++) {
              if (i == r && j == c) lv_obj_add_state(g[i][j], LV_STATE_FOCUSED);
              else                  lv_obj_remove_state(g[i][j], LV_STATE_FOCUSED);
              lv_obj_invalidate(g[i][j]);
            }
          }
          id(cur_focus) = g[r][c];
          lv_obj_t *scr = lv_obj_get_screen(g[r][c]);
          if (from_touch) {
            // Fokus nur setzen, Ansicht nicht bewegen.
          } else if (r == 0 && scr != nullptr) {
            // Erste Zeile = Seitenanfang. scroll_to_view scrollt nur so weit,
            // dass der Button gerade sichtbar wird - die Ueberschrift darueber
            // bliebe abgeschnitten. Also bewusst ganz nach oben.
            lv_obj_scroll_to_y(scr, 0, moved ? LV_ANIM_ON : LV_ANIM_OFF);
          } else if (scr != nullptr) {
            // Gilt fuer BEIDES: Bewegung per D-Pad (mit Animation) und
            // Seitenwechsel mit wiederhergestellter Position weiter unten
            // (ohne Animation - die Seite soll gleich richtig dastehen, nicht
            // sichtbar hinscrollen). Frueher sprang der Seitenwechsel-Fall
            // immer nach ganz oben; seit die Fokusposition gemerkt wird, waere
            // die Markierung dann ausserhalb des sichtbaren Bereichs.
            //
            // lv_obj_scroll_to_view() schiebt nur so weit, dass das Feld
            // GERADE eben anliegt - am unteren Rand blieb es dadurch halb
            // verdeckt. Deshalb selbst rechnen, mit etwas Luft.
            lv_obj_update_layout(scr);
            lv_area_t a, pa;
            lv_obj_get_coords(g[r][c], &a);
            lv_obj_get_coords(scr, &pa);
            // Oben schwebt die Kopfzeile ueber dem Inhalt. Mit einem festen
            // kleinen Abstand landete das ausgewaehlte Feld darunter - es war
            // markiert, aber verdeckt. Der Platz, den die Kopfzeile
            // beansprucht, steht als pad_top der Seite; den nehmen wir.
            const int32_t margin_oben = lv_obj_get_style_pad_top(scr, LV_PART_MAIN) + 4;
            const int32_t margin_unten = 10;
            int32_t sy = lv_obj_get_scroll_y(scr);
            if (a.y2 > pa.y2 - margin_unten)     sy += (a.y2 - (pa.y2 - margin_unten));
            else if (a.y1 < pa.y1 + margin_oben) sy -= ((pa.y1 + margin_oben) - a.y1);
            if (sy < 0) sy = 0;
            lv_obj_scroll_to_y(scr, sy, moved ? LV_ANIM_ON : LV_ANIM_OFF);
          }
  - id: focus_up
    then:
      - lambda: 'id(fdrow) = -1;'
      - script.execute: focus_apply
  - id: focus_down
    then:
      - lambda: 'id(fdrow) = 1;'
      - script.execute: focus_apply
  - id: focus_left
    then:
      - lambda: 'id(fdcol) = -1;'
      - script.execute: focus_apply
  - id: focus_right
    then:
      - lambda: 'id(fdcol) = 1;'
      - script.execute: focus_apply
  - id: activate
    then:
      # Beim Bestaetigen per D-Pad schicken wir nur das Klick-Ereignis - den
      # gedrueckten Zustand setzt LVGL dabei nicht, der entsteht nur bei echter
      # Beruehrung. Ohne ihn bleibt die blaue Rueckmeldung aus, die es per
      # Finger gibt. Also kurz selbst setzen.
      - lambda: |-
          if (id(cur_focus) == nullptr) return;
          lv_obj_t *o = (lv_obj_t *) id(cur_focus);
          id(flash_obj) = o;
          lv_obj_add_state(o, LV_STATE_PRESSED);
          lv_obj_send_event(o, LV_EVENT_CLICKED, nullptr);
      - script.execute: unflash

  # Nimmt die Faerbung nach kurzer Zeit wieder weg. Eigenes Skript, damit die
  # Aktion des Knopfes nicht auf die Wartezeit warten muss.
  # Sprachtaste gedrueckt: erst Strom, kurz warten, dann aufnehmen. Ohne den
  # Vorlauf faengt ein MEMS-Mikrofon die ersten Silben nicht sauber ein - es
  # braucht nach dem Einschalten einen Moment, bis es eingeschwungen ist.
  - id: voice_start
    mode: restart
    then:
      - if:
          condition: {lambda: "return id(sdkarte)->is_mounted();"}
          then:
            - lambda: 'ESP_LOGW("sd", "Sprache nicht moeglich: SD-Karte eingebunden (geteilte Pins) - Auswerfen startet neu");'
            - script.stop: voice_start
      # Jeder neue Druck beendet zuerst alles Alte (auch einen noch nachlaufenden voice_stop, dessen Google-Zweig
      # 1,8 s spaeter das Mikrofon abschalten wuerde).
      - script.stop: voice_stop
      # Lief noch eine HA-Pipeline: kurz warten, bis HA sie aufgeraeumt hat - ein sofortiger Neustart endete sonst selbst.
      - if:
          condition: {voice_assistant.is_running:}
          then:
            - voice_assistant.stop:
            - delay: 400ms
          else:
            - voice_assistant.stop:
      - lambda: 'id(kb).execute_action("atv_mic_stop");'
      # RSSI-Abfrage pausieren, solange gesprochen wird: sie laeuft ueber denselben Bluetooth-Controller wie das Audio
      # (sonst "Link congested" und Paketverluste).
      - lambda: 'id(kb).set_rssi_paused(true);'
      # Zuerst wecken - das schaltet ein abgeschaltetes WLAN wieder ein.
      # Frueher stand das nur im Google-Zweig, wodurch der Home-Assistant-
      # Assistent bei schlafendem Display gar keine Verbindung hatte.
      - script.execute: wake_backlight
      - globals.set: {id: voice_want, value: "true"}
      - globals.set: {id: voice_active, value: "true"}
      - script.execute: apply_mic_power
      # Mindestens 250 ms warten: ein kurzer Tipp (Doppeltipp zum Umschalten) kann so noch loslassen, ohne dass eine
      # Abfrage startet.
      - delay: 250ms
      # Und auf die schnelle Bluetooth-Verbindung warten (aus dem Ruheprofil dauert das Umschalten > 200 ms).
      - wait_until:
          condition: {lambda: "return id(kb).conn_fast_ready() || id(tk_cfg).platz_ueber_dock(id(kb).active_host_slot());"}
          timeout: 450ms
      # Nur starten, wenn die Taste noch gehalten wird. Ein kurzer Tipp - etwa
      # beim Doppeltipp zum Umschalten - startet sonst eine Abfrage, in die
      # niemand mehr hineinspricht.
      - if:
          condition: {lambda: "return id(voice_want);"}
          then:
            - if:
                condition: {lambda: "return id(assistant) == 0;"}
                then:
                  # google_mode: 0 Assistant = selbst streamen. 1 Suche / 2 Auto (nur in SmartTube): Such-Taste (0x0221) - mit
                  # SmartTubes "Instant voice search" startet SmartTube dann selbst die Spracheingabe (MIC_OPEN, on_host_open).
                  - lambda: |-
                      id(voice_such_weg) = id(google_mode) == 1 ||
                        (id(google_mode) == 2 && id(mp_app_name).state == "SmartTube");
                      // Bedient das Dock den Fernseher (bt_weg, 2026-10-24): Such-Taste bzw. Sprache ueber das Dock
                      if (id(voice_such_weg)) {
                        if (!id(tk_cfg).eingabe_ueber_dock(0, 0x0221, 0, []() { id(kb).execute_action("consumer:0x0221"); }))
                          id(kb).execute_action("consumer:0x0221");
                      } else if (id(tk_cfg).sprache_ziel()) {
                        id(voice)->dock_start();
                      } else {
                        id(kb).execute_action("atv_mic_start");
                      }
                  # Anzeigen, DASS aufgenommen wird. Den erkannten Text kann
                  # die Fernbedienung hier nicht wissen: Der Android-TV-Dienst
                  # schickt Audio nur in eine Richtung, die Erkennung laeuft im
                  # Fernseher und kommt nie zu uns zurueck.
                  - script.execute: wake_backlight
                  - lvgl.label.update: {id: voice_you,    text: "Sprich jetzt"}
                  - lvgl.label.update: {id: voice_answer, text: !lambda 'return std::string(id(voice_such_weg) ? "SmartTube-Suche hört zu." : "Google hört zu. Das Erkannte erscheint auf dem Fernseher.");'}
                  - lvgl.page.show: {id: page_voice, animation: FADE_IN, time: 150ms}
                else:
                  # HA verbunden, aber kein WLAN -> Sprache ueber den Bluetooth-Tunnel (ha_tunnel, 2026-10-06).
                  # Der Haken ist nur in den -halink-Konfigurationen gesetzt; ohne ihn alles wie bisher.
                  - if:
                      condition: {lambda: "return !wifi::global_wifi_component->is_connected() && api::global_api_server->is_connected() && wlan_zugriff::g_link_voice_start && wlan_zugriff::g_link_voice_start();"}
                      then:
                        - script.execute: wake_backlight
                        - lvgl.label.update: {id: voice_you,    text: "..."}
                        - lvgl.label.update: {id: voice_answer, text: "hört zu (Bluetooth)"}
                        - lvgl.page.show: {id: page_voice, animation: FADE_IN, time: 150ms}
                      else:
                        # Kommt die Fernbedienung gerade aus dem Ruhezustand, braucht
                        # das WLAN ein paar Sekunden. Ohne Verbindung tut
                        # voice_assistant.start schlicht nichts - man steht dann vor
                        # einem Geraet, das nicht reagiert und nichts sagt.
                        - if:
                            condition:
                              not: {voice_assistant.connected:}
                            then:
                              # WLAN aus (Dock-Betrieb): fuer den HA-Assistenten das eigene WLAN holen (2026-10-25)
                              - lambda: 'if (wlan_zugriff::g_nur_ble) wlan_zugriff::bedarf(60000, "Sprache an HA");'
                              - lvgl.label.update: {id: voice_you,    text: "Moment"}
                              - lvgl.label.update: {id: voice_answer, text: "Verbinde mit Home Assistant ..."}
                              - lvgl.page.show: {id: page_voice, animation: FADE_IN, time: 150ms}
                              # Auf den Assistenten warten, nicht nur auf die API: HA meldet sich dafuer erst nach dem
                              # Verbindungsaufbau an - vorher endete der Start in "No API client connected" (2026-10-25)
                              - wait_until:
                                  condition: {voice_assistant.connected:}
                                  timeout: 12s   # 8 -> 12 s (2026-10-25): bei "WLAN aus" startet das WLAN erst jetzt
                        - if:
                            condition: {voice_assistant.connected:}
                            then: [{voice_assistant.start:}]
                            else:
                              - lvgl.label.update: {id: voice_you,    text: "Keine Verbindung"}
                              - lvgl.label.update: {id: voice_answer, text: "Home Assistant ist nicht erreichbar. Google geht trotzdem - mit doppeltem Druck umschalten."}
                              - lvgl.page.show: {id: page_voice, animation: FADE_IN, time: 150ms}
                              - lambda: 'ESP_LOGW("assi", "keine API-Verbindung - Abfrage nicht gestartet");'
                              - globals.set: {id: voice_active, value: "false"}
                              - script.execute: apply_mic_power
                              - lambda: 'id(kb).set_rssi_paused(false);'
            - script.execute: voice_power_guard
          else:
            - lambda: 'ESP_LOGD("assi", "zu kurz gedrueckt - keine Abfrage");'
            - globals.set: {id: voice_active, value: "false"}
            - script.execute: apply_mic_power
            - lambda: 'id(kb).set_rssi_paused(false);'

  # Loslassen: Aufnahme beenden, dann den Strom wieder wegnehmen. Die kurze
  # Nachlaufzeit verhindert, dass das letzte Stueck Audio abgeschnitten wird.
  # Notbremse: bleibt eine Home-Assistant-Abfrage haengen, faellt der
  # Mikrofonstrom trotzdem wieder weg.
  - id: voice_power_guard
    mode: restart
    then:
      - delay: 25s
      - globals.set: {id: voice_active, value: "false"}
      - script.execute: apply_mic_power
      - lambda: 'id(kb).set_rssi_paused(false);'
      - lambda: 'ESP_LOGW("assi", "Abfrage lief zu lange - Mikrofon abgeschaltet");'

  - id: voice_stop
    # restart statt Standard "single": der Google-Zweig unten haelt mit
    # delay: 1500ms eine Weile an - ohne restart wuerde ein zweiter Aufruf
    # waehrend dieser Zeit (schneller Doppeltipp) still verworfen, s.
    # Kommentar in voice_start).
    mode: restart
    then:
      - globals.set: {id: voice_want, value: "false"}
      # SmartTube-Suche: die Aufnahme hat SmartTube angefordert (MIC_OPEN), laeuft aber, weil die
      # Taste gehalten wurde - also beendet das Loslassen sie wie jede andere (Nutzerwunsch
      # 2026-09-28; der Rest laeuft ueber on_stream_end). Kam noch keine Anforderung, nur das
      # Vorbereitete zuruecknehmen; fordert der Streamer danach von sich aus an, beendet er selbst.
      - if:
          condition: {lambda: "return id(voice_such_weg);"}
          then:
            - globals.set: {id: voice_such_weg, value: "false"}
            - if:
                condition: {lambda: "return id(host_mic);"}
                then:
                  - lambda: 'id(kb).execute_action("atv_mic_stop");'
                else:
                  - delay: 3s
                  - if:
                      condition: {lambda: "return !id(host_mic);"}
                      then:
                        - globals.set: {id: voice_active, value: "false"}
                        - script.execute: apply_mic_power
                        - lambda: 'id(kb).set_rssi_paused(false);'
                        - if:
                            condition: {lambda: "return id(cur_page) == 26;"}
                            then: [{script.execute: go_home}]
            - script.stop: voice_stop
      - if:
          condition: {lambda: "return id(assistant) == 0;"}
          then:
            # Google: Loslassen IST das Ende, der Fernseher wertet selbst aus.
            - lambda: 'id(kb).execute_action("atv_mic_stop");'
            - lvgl.label.update: {id: voice_answer, text: "Ergebnis auf dem Fernseher"}
            - delay: 1500ms
            - if:
                condition: {lambda: "return id(cur_page) == 26;"}
                then: [{script.execute: go_home}]
            - delay: 300ms
            - globals.set: {id: voice_active, value: "false"}
            - script.execute: apply_mic_power
            - lambda: 'id(kb).set_rssi_paused(false);'
          else:
            # Home Assistant: NICHT abbrechen. Die Pipeline erkennt das
            # Sprachende selbst und braucht danach noch einen Moment fuer
            # Erkennung und Absicht. Ein Abbruch beim Loslassen wirft die
            # Abfrage weg - genau das ist am 04.09. passiert: "Starting STT by
            # VAD" kam, das Ergebnis nie. Strom bleibt bis on_end an.
            - lambda: 'ESP_LOGD("assi", "losgelassen - Pipeline laeuft weiter");'
            # Sprache ueber Bluetooth: Aufnahme beenden (die HA-Bruecke schliesst damit den Audiostrom)
            - lambda: 'if (wlan_zugriff::g_link_voice_stop) wlan_zugriff::g_link_voice_stop();'

  - id: toggle_assistant
    then:
      - lambda: 'id(assistant) = id(assistant) == 0 ? 1 : 0;'
      - script.execute: apply_assistant

  # Der MAX17048 fuehrt in Register 0x16 (CRATE) die Lade- bzw. Entladerate in
  # 0,208 % pro Stunde je Schritt, mit Vorzeichen. ESPHome legt den Wert nicht
  # offen, also lesen wir ihn direkt vom Bus. Positiv heisst: der Akku fuellt
  # sich - das ist eine echte Ladeerkennung und kein Vergleich zweier
  # Messpunkte, der Minuten braeuchte.
  - id: refresh_laden
    then:
      - lambda: |-
          uint8_t d[2];
          i2c::I2CDevice dev;
          dev.set_i2c_bus(id(hauptbus));
          dev.set_i2c_address(0x36);
          if (dev.read_register(0x16, d, 2) != i2c::ERROR_OK) {
            ESP_LOGW("akku", "CRATE-Register nicht lesbar");
            return;
          }
          const int16_t roh = (int16_t) ((uint16_t) d[0] << 8 | d[1]);
          const float rate = roh * 0.208f;              // Prozent pro Stunde
          ESP_LOGD("akku", "CRATE roh=%d -> %.2f %%/h", roh, (double) rate);
          id(entladerate).publish_state(rate);
          const bool neu = rate > 0.5f;                 // kleiner Totbereich
          if (neu != id(laedt)) {
            const bool flanke_an = neu && !id(laedt);
            id(laedt) = neu;
            id(apply_low_bat)->execute();
            ESP_LOGI("akku", "%s (%.1f %%/h)",
                     neu ? "laedt" : "laedt nicht", (double) rate);
            // Ladegeraet gerade angesteckt -> aufwecken und WLAN 3 min
            // erzwingen. So wird die Fernbedienung ueber "ans Kabel legen"
            // zuverlaessig per Home Assistant / OTA erreichbar, auch wenn sie
            // im Ruhezustand das WLAN abgeschaltet hatte.
            if (flanke_an) {
              ESP_LOGI("akku", "Ladegeraet angesteckt -> Wartungsfenster");
              id(wake_backlight)->execute();
              // "Nur Bluetooth": kein WLAN beim Einstecken - Updates laufen durch den Tunnel (2026-10-07)
              if (!wlan_zugriff::g_nur_ble) id(wartungsfenster)->execute();
            }
          }
      - script.execute: apply_charge_icon

  # Blitz und Farbe des Akkustands direkt am Ladepin (charger_present, reagiert sofort) - nicht an der CRATE-Rate,
  # die sich im MAX17048 nur alle paar Sekunden aendert.
  - id: apply_charge_icon
    then:
      - lambda: |-
          const bool an = id(charger_present).state;
          // "voll": Der Lade-IC (Pin) meldet am Ladeende "laedt nicht mehr", der
          // Prozentwert steigt aber noch nach. War das Kabel dran (charge_latch),
          // zeigt der Akku-Text deshalb gruen "voll" statt der Prozent - ab 95 %
          // und solange der Messer kein Entladen meldet (Rate >= -0,5 %/h). Sobald
          // er Entladen sieht (Kabel ab), oder < 90 %, faellt es weg.
          const float rate = id(entladerate).state;
          if (an) id(charge_latch) = true;
          else if (id(akku_pct) < 90 || (!std::isnan(rate) && rate < -0.5f)) id(charge_latch) = false;
          const bool voll = !an && id(charge_latch) && id(akku_pct) >= 95;
          id(akku_voll) = voll;
          // kein "voll" mehr (Nutzerwunsch 2026-10-04): 100 % nur bei vollem Akku, sonst hoechstens 99 %
          char pb[8];
          snprintf(pb, sizeof(pb), "%d%%", akku_anzeige_pct(id(akku_pct), voll));
          lv_label_set_text(id(lbl_batt), pb);
          lv_obj_set_style_text_color(id(lbl_batt),
            lv_color_hex((an || voll) ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          if (an) lv_obj_clear_flag(id(lbl_batt_chg), LV_OBJ_FLAG_HIDDEN);
          else    lv_obj_add_flag(id(lbl_batt_chg), LV_OBJ_FLAG_HIDDEN);

  # Prozessortakt: 80 MHz nur wenn "Prozessor drosseln" AN UND Display aus
  # (Referenz-Firmware laeuft BLE-HID nachweislich stabil bei 80 MHz). Bei
  # Display an oder waehrend OTA immer 240 MHz. Der BT-Treiber holt sich fuer
  # Funkarbeit ohnehin selbst wieder Takt.
  - id: apply_cpu
    then:
      - lambda: |-
          const bool spar = (id(ps_cpu) || id(low_bat)) && id(disp_off) && id(cpu_low) && !id(ota_aktiv);
          // Leichtschlaf nur gedrosselt, ohne laufende Sprachabfrage (Mikrofon/I2S).
          const bool leicht = spar && id(ps_light) && !id(voice_active) && !id(host_mic);
          // Nur bei einer echten Aenderung neu einstellen und loggen - wake_backlight
          // ruft das bei JEDEM Tastendruck/Tipp auf.
          static int letzt = -1;
          const int zustand = (spar ? 80 : 240) + (leicht ? 1 : 0);
          if (zustand == letzt) return;
          letzt = zustand;
          esp_pm_config_t pm = {};
          pm.max_freq_mhz = spar ? 80 : 240;
          // Display an: auch die Untergrenze auf 240 MHz (2026-09-30). Mit aktivem Power-Management
          // laeuft der Prozessor sonst auf min_freq, solange niemand eine CPU-Sperre haelt - auch
          // LVGL beim Rendern nicht. Animationen (Menue von unten) wirkten dadurch hakelig.
          pm.min_freq_mhz = !spar ? 240 : (leicht ? 40 : 80);
          pm.light_sleep_enable = leicht;
          const esp_err_t r = esp_pm_configure(&pm);
          // Laengere Schleifenrunde im Leichtschlaf: der Prozessor kann laenger am Stueck schlafen.
          // Tasten werden trotzdem jede Runde abgefragt (TCA8418 pollt den INT-Pegel).
          // Wach 8 ms statt 16 ms (2026-10-11): LVGL liest den Touch und zeichnet nur einmal je Runde - mit 16 ms
          // wirkte Wischen ruckelig. Kostet bei leuchtendem Display kaum etwas (der Prozessor wartet sonst nur).
          App.set_loop_interval(leicht ? 50 : 8);
          ESP_LOGI("strom", "CPU max %d MHz, Leichtschlaf %s (%s)", (int) pm.max_freq_mhz,
                   leicht ? "AN" : "aus", r == ESP_OK ? "ok" : "abgelehnt");

  - id: apply_power
    then:
      - script.execute: apply_wifi_ps
      - script.execute: apply_low_bat
      - script.execute: apply_cpu
      - lambda: |-
          ESP_LOGI("strom", "WLAN-Sparmodus %s | WLAN-Ruhe %s | BLE-Idle %s",
                   id(ps_wifi) ? "an" : "aus", id(ps_wifi_off) ? "an" : "aus",
                   id(ps_bleidle) ? "an" : "aus");
          lv_obj_t *m[6] = {id(ps_wifi_lbl), id(ps_off_lbl), id(ps_cpu_lbl), id(ps_deep_lbl), id(testmod_lbl), id(ps_bleidle_lbl)};
          bool v[6] = {id(ps_wifi), id(ps_wifi_off), id(ps_cpu), id(ps_deep), id(testmodus), id(ps_bleidle)};
          for (int i = 0; i < 6; i++) {
            lv_label_set_text(m[i], v[i] ? "AN" : "AUS");
            lv_obj_set_style_text_color(m[i],
              lv_color_hex(v[i] ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          }
          // "Nur Bluetooth": nur mit Tunnel sichtbar
          if (wlan_zugriff::g_set_nur_ble) {
            lv_obj_remove_flag(id(ps_nurble_btn), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(ps_nurble_h), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(ps_nurble_lbl), wlan_zugriff::g_nur_ble ? "AN" : "AUS");
            lv_obj_set_style_text_color(id(ps_nurble_lbl),
              lv_color_hex(wlan_zugriff::g_nur_ble ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          }
          // ---- Zeiten, Hinweise und Ablauf (Energie-Seite) ----
          auto fmt = [](int sek) -> std::string {
            char b[16];
            if (sek <= 0)              return std::string("sofort");
            if (sek < 60)              snprintf(b, sizeof(b), "%d s", sek);
            else if (sek % 3600 == 0)  snprintf(b, sizeof(b), "%d Std", sek / 3600);
            else if (sek % 60 == 0)    snprintf(b, sizeof(b), "%d min", sek / 60);
            else                       snprintf(b, sizeof(b), "%d s", sek);
            return std::string(b);
          };
          auto an = [](bool v) { return v ? "AN" : "AUS"; };
          auto farbe = [](lv_obj_t *o, bool aktiv) {
            lv_obj_set_style_text_color(o, lv_color_hex(aktiv ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          };
          char pb[16];
          const int t_disp = id(disp_timeout_s);
          const std::string s_disp = t_disp > 0 ? fmt(t_disp) : std::string("nie");
          const std::string s_wifi = fmt(id(ps_wifi_off_s));
          const std::string s_ble  = fmt(id(ps_ble_s));
          const std::string s_cpu  = fmt(id(ps_cpu_s));
          const std::string s_deep = fmt(id(ps_deep_s));
          const std::string s_mem  = id(mem_s) < 0 ? std::string("Unendlich") : fmt(id(mem_s));
          const std::string s_close = id(menu_close_s) < 0 ? std::string("Unendlich") : fmt(id(menu_close_s));
          const bool dim_ok = id(ps_dim_s) > 0 && (t_disp <= 0 || id(ps_dim_s) < t_disp);

          // ---- Beschriftungen der Werte ----
          lv_label_set_text(id(ps_dim_lbl), id(ps_dim_s) > 0 ? fmt(id(ps_dim_s)).c_str() : "AUS");
          lv_slider_set_value(id(ps_dim_sld), id(ps_dim_s), LV_ANIM_OFF);
          farbe(id(ps_dim_lbl), dim_ok);
          snprintf(pb, sizeof(pb), "%d %%", id(ps_dim_pct));
          lv_label_set_text(id(ps_dimp_lbl), pb);
          farbe(id(ps_dimp_lbl), dim_ok);
          lv_label_set_text(id(ps_wifimax_lbl), an(id(ps_wifi_max)));
          farbe(id(ps_wifimax_lbl), id(ps_wifi_max) && id(ps_wifi));
          lv_label_set_text(id(ps_wifis_lbl), s_wifi.c_str());
          farbe(id(ps_wifis_lbl), id(ps_wifi_off));
          {
            const int wtv = id(ps_wifi_off_tv_s);
            lv_label_set_text(id(ps_wifitv_lbl), wtv == 0 ? "nie" : (wtv < 0 ? "wie oben" : fmt(wtv).c_str()));
            farbe(id(ps_wifitv_lbl), id(ps_wifi_off) && wtv != 0);
          }
          lv_label_set_text(id(ps_cpu_lbl), id(ps_cpu) ? s_cpu.c_str() : "AUS");
          farbe(id(ps_cpu_lbl), id(ps_cpu));
          lv_label_set_text(id(ps_bles_lbl), s_ble.c_str());
          farbe(id(ps_bles_lbl), id(ps_bleidle));
          lv_label_set_text(id(ps_touch_lbl), an(id(ps_touch_wake)));
          snprintf(pb, sizeof(pb), "%d ms", id(ps_touch_ms));
          lv_label_set_text(id(ps_touchms_lbl), pb);
          farbe(id(ps_touchms_lbl), id(ps_touch_wake) && id(ps_touch_ms) > 50);
          farbe(id(ps_touch_lbl), id(ps_touch_wake));
          lv_label_set_text(id(ps_deeps_lbl), s_deep.c_str());
          farbe(id(ps_deeps_lbl), id(ps_deep));
          {
            const int tv = id(ps_deep_tv_s);
            lv_label_set_text(id(ps_deeptv_lbl), tv == 0 ? "nie" : (tv < 0 ? "wie oben" : fmt(tv).c_str()));
            farbe(id(ps_deeptv_lbl), id(ps_deep) && tv != 0);
          }
          if (id(ps_low_pct) > 0) { snprintf(pb, sizeof(pb), "%d %%", id(ps_low_pct)); lv_label_set_text(id(ps_low_lbl), pb); }
          else lv_label_set_text(id(ps_low_lbl), "AUS");
          farbe(id(ps_low_lbl), id(ps_low_pct) > 0);
          lv_label_set_text(id(mem_lbl), s_mem.c_str());
          farbe(id(mem_lbl), true);
          lv_label_set_text(id(menu_close_lbl), s_close.c_str());
          farbe(id(menu_close_lbl), true);
          lv_label_set_text(id(ps_log_lbl), an(id(ps_log_debug)));
          lv_label_set_text(id(ps_light_lbl), an(id(ps_light)));
          farbe(id(ps_light_lbl), id(ps_light));
          lv_label_set_text(id(ps_wfest_lbl), an(id(wifi_fest)));
          lv_label_set_text(id(ps_deepble_lbl), an(id(deep_ohne_ble)));
          lv_label_set_text(id(ps_wfrueh_lbl), an(id(wlan_frueh)));
          farbe(id(ps_wfrueh_lbl), id(wlan_frueh));
          farbe(id(ps_deepble_lbl), id(deep_ohne_ble));
          farbe(id(ps_wfest_lbl), id(wifi_fest));
          farbe(id(ps_log_lbl), id(ps_log_debug));

          // ---- Stufen-Regler auf den gespeicherten Wert stellen ----
          lv_slider_set_value(id(ps_dimp_sld), stufen::index(stufen::DIM_PCT, id(ps_dim_pct)), LV_ANIM_OFF);
          lv_slider_set_value(id(ps_wifis_sld), stufen::index(stufen::WIFI_AUS, id(ps_wifi_off_s)), LV_ANIM_OFF);
          lv_slider_set_value(id(ps_wifitv_sld), stufen::index(stufen::TV_AUS, id(ps_wifi_off_tv_s)), LV_ANIM_OFF);
          lv_slider_set_value(id(ps_cpu_sld), stufen::index(stufen::CPU, (id(ps_cpu) ? id(ps_cpu_s) : -1)), LV_ANIM_OFF);
          lv_slider_set_value(id(ps_bles_sld), stufen::index(stufen::BLE, id(ps_ble_s)), LV_ANIM_OFF);
          lv_slider_set_value(id(ps_touchms_sld), stufen::index(stufen::TOUCH_MS, id(ps_touch_ms)), LV_ANIM_OFF);
          lv_slider_set_value(id(ps_deeps_sld), stufen::index(stufen::TIEF, id(ps_deep_s)), LV_ANIM_OFF);
          lv_slider_set_value(id(ps_deeptv_sld), stufen::index(stufen::TV_AUS, id(ps_deep_tv_s)), LV_ANIM_OFF);
          lv_slider_set_value(id(ps_low_sld), stufen::index(stufen::AKKU_PCT, id(ps_low_pct)), LV_ANIM_OFF);
          lv_slider_set_value(id(mem_sld), stufen::index(stufen::MERKEN, id(mem_s)), LV_ANIM_OFF);
          lv_slider_set_value(id(menu_close_sld), stufen::index(stufen::SCHLIESSEN, id(menu_close_s)), LV_ANIM_OFF);

          // ---- Hinweise ----
          if (id(ps_dim_s) <= 0)
            lv_label_set_text(id(ps_h_dim), "AUS: Das Display geht direkt aus, ohne vorher dunkler zu werden. Der Bildschirm ist meist der größte Verbraucher; zuerst abdunkeln spart Strom und ist beim Wegschauen unauffälliger.");
          else if (!dim_ok)
            lv_label_set_text(id(ps_h_dim), ("Achtung: Abdunkeln nach " + fmt(id(ps_dim_s)) + " ist nicht kürzer als der Display-Timeout (" + s_disp + ") und bleibt daher ohne Wirkung. Timeout unter Anzeige ändern oder kürzer wählen.").c_str());
          else
            lv_label_set_text(id(ps_h_dim), ("Nach " + fmt(id(ps_dim_s)) + " ohne Bedienung wird das Display abgedunkelt, nach " + s_disp + " geht es aus. Ein Tipp oder Tastendruck macht es sofort wieder hell.").c_str());
          lv_label_set_text(id(ps_h_dimp),
            "Helligkeit beim Abdunkeln in Prozent der eingestellten Bildschirmhelligkeit. Wirkt nur bei Abdunkeln nach = eine Zeit.");
          {
            const int wtv = id(ps_wifi_off_tv_s);
            lv_label_set_text(id(ps_h_wifitv), wtv == 0
              ? "nie: Solange der Fernseher läuft, bleibt das WLAN an. Praktisch, wenn Home Assistant oder Flashen dann erreichbar bleiben soll."
              : (wtv < 0
                ? "wie oben: Bei laufendem Fernseher gilt dieselbe Zeit wie bei „WLAN aus nach“."
                : ("Bei laufendem Fernseher schaltet das WLAN erst " + fmt(wtv) + " nach Display-Aus bzw. der letzten Bedienung ab (sonst nach " + s_wifi + ").").c_str()));
          }
          lv_label_set_text(id(ps_h_wifi),
            "Der WLAN-Chip schläft zwischen den Datenpaketen. Spart im Betrieb viel Strom, Home Assistant antwortet nur minimal später. Empfehlung: AN.");
          lv_label_set_text(id(ps_h_wifimax),
            "Im Ruhezustand (Display aus) schläft der WLAN-Chip noch länger zwischen den Datenpaketen. Spart mehr, Home Assistant antwortet dann träger. Bei Bedienung gilt wieder der normale Sparmodus. Wirkt nur bei WLAN-Sparmodus = AN.");
          lv_label_set_text(id(ps_h_off), id(ps_wifi_off)
            ? ("AN: Bei ausgeschaltetem Display wird das WLAN " + (id(ps_wifi_off_s) > 0 ? "nach " + s_wifi + " ohne Bedienung" : std::string("sofort")) + " abgeschaltet - jede Taste startet die Zeit neu. Bluetooth (Tasten) läuft weiter; Home Assistant und Flashen gehen dann nicht. Ein Tastendruck oder Tipp schaltet das WLAN sofort wieder ein, ebenso das Anstecken des Ladekabels (dann 3 min offen zum Flashen).").c_str()
            : "AUS: Das WLAN bleibt auch bei ausgeschaltetem Display immer an. Home Assistant erreicht die Remote jederzeit, das kostet aber Strom.");
          lv_label_set_text(id(ps_h_offs),
            "Wartezeit ab Display-Aus, bis das WLAN abgeschaltet wird (sofort = beim Display-Aus). Kürzer spart mehr, Home Assistant ist dann früher weg. Wirkt nur bei WLAN aus im Ruhezustand = AN.");
          lv_label_set_text(id(ps_h_cpu), id(ps_cpu)
            ? ("Der Prozessor läuft " + (id(ps_cpu_s) > 0 ? s_cpu + " nach Display-Aus" : std::string("ab Display-Aus")) + " mit 80 statt 240 MHz. Ein Tastendruck oder Tipp schaltet sofort wieder auf volle Leistung, bei der Bedienung merkst du keinen Unterschied.").c_str()
            : "AUS: Der Prozessor läuft immer mit bis zu 240 MHz, auch bei ausgeschaltetem Display. Kostet im Ruhezustand Strom.");
          lv_label_set_text(id(ps_h_ble), id(ps_bleidle)
            ? ("AN: " + s_ble + " nach Display-Aus meldet sich die Remote per Bluetooth nur noch alle ca. 0,6 s statt alle 15 ms. Die Verbindung bleibt bestehen, der erste Tastendruck kommt minimal später an.").c_str()
            : "AUS: Bluetooth bleibt auch im Ruhezustand voll aktiv. Der erste Tastendruck kommt sofort an, das kostet aber Strom.");
          lv_label_set_text(id(ps_h_bles),
            "Wartezeit ab Display-Aus, bis Bluetooth in den langsamen Takt wechselt. Wirkt nur bei BLE-Verbindung langsam = AN.");
          lv_label_set_text(id(ps_h_touch), id(ps_touch_wake)
            ? "AN: Ein Tipp aufs Display weckt die Remote, so wie eine Taste oder das Anheben."
            : "AUS: Im Ruhezustand wird der Touch-Chip nicht mehr abgefragt - es wecken nur Tasten, Bewegung, Klopfen und Ladekabel. Spart etwas Strom; der erste Tipp aufs dunkle Display bewirkt nichts. Aus dem Tiefschlaf weckt Touch ohnehin nie.");
          lv_label_set_text(id(ps_h_touchms), id(ps_touch_ms) <= 50
            ? "50 ms (Standard): Der Touch-Chip wird auch im Ruhezustand alle 50 ms gefragt, jeder Tipp weckt sicher."
            : "Der Touch-Chip wird im Ruhezustand seltener gefragt. Das spart etwas Strom (nicht gemessen), aber ein kurzer Tipp kann zwischen zwei Abfragen durchfallen - dann musst du mehrfach tippen, bis das Display angeht. Wirkt nur bei Touch weckt = AN.");
          std::string h_deep;
          if (id(ps_deep)) {
            if (t_disp <= 0) h_deep = "AN, aber Display-Timeout ist auf nie gestellt: das Display geht nie aus, der Tiefschlaf beginnt daher nie.";
            else {
              h_deep = "AN: " + fmt(t_disp + id(ps_deep_s)) + " nach der letzten Bedienung (Display-Timeout " + s_disp + " + " + s_deep + ") schaltet sich der Chip fast ganz ab und wacht nie von selbst auf. Wecken: beliebige Taste, Bewegung bzw. Hochheben (je nach Einstellung), Doppelklopfen oder Ladekabel - Touch weckt aus dem Tiefschlaf nicht. Das ist ein Neustart von etwa 4 s; ob die Weck-Taste und was du in der Zeit drückst danach wirken, stellt der Konfigurator ein (Tasten beim Aufwachen). Kein Tiefschlaf am Ladekabel und beim Sprechen.";
            }
          } else {
            h_deep = "AUS: Der Chip schläft nie ganz. Im Ruhezustand bleibt Bluetooth bereit und die Remote sofort bedienbar, verbraucht dadurch aber dauerhaft mehr Strom. Für langen Akku: AN.";
          }
          lv_label_set_text(id(ps_h_deep), h_deep.c_str());
          lv_label_set_text(id(ps_h_deeps),
            "Wartezeit ab Display-Aus bzw. ab dem letzten Tastendruck, bis der Tiefschlaf beginnt - jede Taste startet sie neu, auch wenn das Display dabei aus bleibt. Kürzer spart mehr, dafür wartest du beim Aufwecken öfter auf die Neuverbindung. Wirkt nur bei Tiefschlaf im Ruhezustand = AN.");
          {
            const int tv = id(ps_deep_tv_s);
            lv_label_set_text(id(ps_h_deeptv), tv == 0
              ? "nie: Solange der Fernseher läuft, bleibt die Remote wach und sofort bedienbar. Das kostet viel Strom, wenn der Fernseher lange läuft."
              : (tv < 0
                ? "wie oben: Bei laufendem Fernseher gilt dieselbe Tiefschlaf-Zeit wie sonst. Der erste Tastendruck weckt die Remote nur."
                : ("Bei laufendem Fernseher beginnt der Tiefschlaf erst " + fmt(tv) + " nach Display-Aus (sonst nach " + s_deep + "). Beim Fernsehen schläft die Remote so nicht zu früh ein.").c_str()));
          }
          lv_label_set_text(id(ps_h_low), id(ps_low_pct) > 0
            ? ("Fällt der Akku auf " + std::to_string(id(ps_low_pct)) + " % oder weniger (nicht beim Laden), gelten gekürzte Zeiten: Display nach höchstens 15 s aus, WLAN und Prozessor sofort gedrosselt, Bluetooth nach 5 s langsam, Tiefschlaf nach höchstens 30 s - auch bei laufendem Fernseher und wenn diese Optionen sonst AUS sind.").c_str()
            : "AUS: Bei niedrigem Akku ändert sich nichts.");
          lv_label_set_text(id(ps_h_mem),
            "So lange nach dem Verlassen des Menüs (und ab Display-Aus) bleiben Menüseite und Markierung erhalten - ein Wiederöffnen springt dann direkt dorthin zurück. Danach beginnt das Menü wieder ganz oben. Gilt auch für die Media-Player-Seite. Unendlich: wird nie vergessen.");
          lv_label_set_text(id(h_menu_close),
            "So lange nach dem Ausschalten des Displays bleibt ein offenes Menü im Hintergrund stehen. Danach springt es von selbst auf die Startseite, damit du sie beim nächsten Aufwecken siehst - unabhängig davon, ob die Position beim Wiederöffnen noch gemerkt wird (siehe „Menü merken für“). Unendlich: schließt sich nie von selbst.");
          lv_label_set_text(id(ps_h_log), id(ps_log_debug)
            ? "AN: Für die Fehlersuche - ausführliches Log, Diagnosewerte (RAM, Laufzeit, Verbindung) jede Minute an Home Assistant, Messwerte des Menüs und Status der Bluetooth-Verbindung ins HA-Log. Kostet etwas Akku."
            : "AUS: Normalbetrieb. Nur wichtige Log-Meldungen, keine Diagnosewerte an Home Assistant. Zum Suchen von Fehlern auf AN stellen.");
          lv_label_set_text(id(ps_h_test),
            "AN: Kein Tiefschlaf und kein WLAN-Aus, die Remote ist immer per WLAN erreichbar (z. B. zum Flashen). Nach einem Neustart wird er automatisch ausgeschaltet; in den ersten 2 min nach dem Start sind Tiefschlaf und WLAN-Aus ohnehin gesperrt.");

          // ---- Ablauf-Plan, nach Zeit sortiert (alles ab Display-Aus) ----
          std::string ab = dim_ok
            ? "Ablauf: Nach " + fmt(id(ps_dim_s)) + " wird das Display abgedunkelt, nach " + s_disp + " geht es aus."
            : "Ablauf: Das Display geht nach " + s_disp + " ohne Bedienung aus.";
          if (id(low_bat)) ab += "\nAkku niedrig: gekürzte Zeiten aktiv!";
          if (id(testmodus)) {
            ab += "\nTestmodus AN: kein WLAN-Aus, kein Tiefschlaf.";
          } else {
            int   zt[6];
            std::string tx[6];
            int n = 0;
            auto add = [&](int sek, const std::string &t) {
              int k = n++;
              while (k > 0 && zt[k - 1] > sek) { zt[k] = zt[k - 1]; tx[k] = tx[k - 1]; k--; }
              zt[k] = sek; tx[k] = t;
            };
            auto fp = [&](int sek) { return sek <= 0 ? std::string("0 s") : fmt(sek); };
            if (id(ps_cpu))      add(id(ps_cpu_s), "Prozessor gedrosselt");
            if (id(ps_bleidle))  add(id(ps_ble_s), "Bluetooth langsam");
            // menu_close_s = -1 (Unendlich) gehoert NICHT in die sortierte Zeitliste - fp(-1)
            // waere "0 s" und liese es wie "sofort" statt "nie" aussehen. Seit 2026-09-28 eigene
            // Einstellung, getrennt von mem_s ("Menü merken für").
            if (id(menu_close_s) >= 0) add(id(menu_close_s), "Menü zurück auf Start");
            if (id(ps_wifi_off)) add(id(ps_wifi_off_s), "WLAN aus");
            if (id(ps_deep))     add(id(ps_deep_s), id(ps_deep_tv_s) == 0 ? "Tiefschlaf (nicht bei TV an)" : "Tiefschlaf");
            ab += "\nDanach ab Display-Aus:";
            for (int k = 0; k < n; k++) ab += "\n+" + fp(zt[k]) + "  " + tx[k];
            if (id(menu_close_s) < 0) ab += "\nMenü zurück auf Start: nie";
          }
          lv_label_set_text(id(ps_timeline), ab.c_str());

  # Erklaerungen zu den Einstellungen (Menue > Einstellungen). Die Texte, die vom
  # aktuellen Wert abhaengen (Energie sparen), setzt apply_power; hier stehen die
  # festen. Aufgerufen beim Oeffnen jeder Einstellungsseite.
  - id: apply_hints
    then:
      - lambda: |-
          extras::fw_status(id(fw_upd_text), id(fw_upd_stufe));
          lv_label_set_text(id(h_bri), "Helligkeit des Displays im Betrieb. Niedriger spart Akku, denn das Display ist meist der größte Verbraucher.");
          lv_label_set_text(id(h_kbdon), "AN: Die Tasten sind beleuchtet. AUS spart Akku, die Tasten funktionieren trotzdem. Schneller geht es über die linke Hälfte der Statusleiste auf der Startseite.");
          lv_label_set_text(id(h_kbdbri), "Helligkeit der Tastenbeleuchtung, wenn sie eingeschaltet ist.");
          lv_label_set_text(id(h_to), "So lange ohne Bedienung, dann geht das Display aus und die Remote schläft. Ganz links = Nie (kostet viel Akku). Ein Tipp oder Tastendruck weckt sie wieder.");
          lv_label_set_text(id(h_sh_ble), "Bluetooth zu Fernseher oder Streamer. Blau: verbunden (Balken = Empfang). Grau: an, aber nicht verbunden. Dunkel: Bluetooth aus.");
          lv_label_set_text(id(h_sh_wifi), "WLAN. Grün: verbunden (Balken = Empfang). Grau: an, aber nicht verbunden. Dunkel: WLAN aus, z. B. im Ruhezustand oder bei „Nur Bluetooth“.");
          lv_label_set_text(id(h_sh_ha), "Symbol hinter den Balken: Verbindung zu Home Assistant. Grün: über WLAN. Blau: über Bluetooth. Grau: nicht verbunden.");
          lv_label_set_text(id(h_sh_batt), "Ladezustand in Prozent. Beim Laden erscheint ein Blitz; 100 % erst, wenn der Akku wirklich voll geladen ist.");
          lv_label_set_text(id(h_sh_clock), "Uhrzeit oben in der Leiste. Ohne Uhr rutscht der Sleeptimer-Countdown nach links.");
          lv_label_set_text(id(h_sh_assi), "Zeigt, welcher Sprachassistent auf der Mikrofon-Taste liegt: Google oder Home Assistant.");
          lv_label_set_text(id(h_cov_p), "GANZ: Das Bild wird vollständig gezeigt, es können Ränder bleiben. VOLL: Es füllt die ganze Fläche, die Ränder werden abgeschnitten. Gilt für den Player.");
          lv_label_set_text(id(h_cov_h), "GANZ: Das Bild wird vollständig gezeigt, es können Ränder bleiben. VOLL: Es füllt die ganze Fläche, die Ränder werden abgeschnitten. Gilt für die Startseite.");
          lv_label_set_text(id(h_motion), "Was das Display im Ruhezustand von selbst einschaltet. Aus: Bewegung weckt nie (nur Tasten, Touch, Klopfen). Bewegung: schon ein Anstoßen. Hochheben: erst, wenn sie gekippt bzw. aus der Ablage gehoben wird - ein Stoß gegen den Tisch weckt dann nicht. Für den Tiefschlaf gibt es im Konfigurator eine eigene Einstellung (sonst gilt diese).");
          lv_label_set_text(id(h_sens), "Wie stark die Remote bewegt werden muss. Rechts = empfindlicher, aber auch mehr ungewollte Weckungen, etwa durch Erschütterungen am Tisch.");
          lv_label_set_text(id(h_dim_wake), "AN: Ist die Remote abgedunkelt, hellt eine Bewegung sie wieder auf - egal, was bei „Aufwecken bei“ eingestellt ist. AUS: Aus dem Abgedunkelten holt sie dann erst ein Tipp oder eine Taste zurück.");
          lv_label_set_text(id(h_dim_hold), "AN: Solange sich die Remote bewegt, dunkelt sie gar nicht erst ab und schaltet auch nicht aus - praktisch, wenn man sie länger in der Hand hält. Kostet selbst kaum Strom (ein kurzer Sensor-Check alle 250 ms), aber indirekt mehr: Das Display bleibt dann länger hell, auch wenn nur der Tisch wackelt oder man im Auto sitzt - und das Display ist der größte Verbraucher. Darum standardmäßig AUS.");
          lv_label_set_text(id(h_klopf), "AN: Zweimal kurz auf die Remote klopfen weckt sie auf, auch aus dem Tiefschlaf und dem Abgedunkelten. Wie fest geklopft werden muss, stellt der Regler darüber ein - rechts = schon leichtes Klopfen.");
          lv_label_set_text(id(h_menue_weckt), "Menü öffnen: Ein Druck auf die Menütaste weckt das Display und öffnet gleich das Menü. Nur Display: Der erste Druck (kurz oder lang) weckt nur, der nächste öffnet das Menü. Gilt nur für die Menütaste, auch wenn alle Tasten wecken.");
          lv_label_set_text(id(h_keys), "Gilt im Ruhezustand. Alle: Jede Taste schaltet das Display ein. Nur Menü: Nur die Menü-Taste (kurz oder lang). Andere Tasten wirken trotzdem - Lautstärke, Play usw. gehen an den Fernseher, das Display bleibt aber aus. Gilt auch nach dem Tiefschlaf, wenn die Weck-Taste gesendet wird.");
          lv_label_set_text(id(h_dim_sens), "Eigene Empfindlichkeit für die beiden Optionen oben, getrennt von „Empfindlichkeit“ bei Aufwecken bei. Rechts = empfindlicher, aber auch mehr Fehlauslöser.");
          lv_label_set_text(id(h_assi), "Google: Die Mikrofon-Taste startet die Google-Sprachsuche am Streamer, wie bei der Originalfernbedienung. Home Assistant: Die Abfrage geht an Assist in Home Assistant, zum Beispiel für Smart-Home-Befehle. Tippen schaltet um. Das Mikrofon-Symbol in SmartTube funktioniert immer.");
          lv_label_set_text(id(h_google_mode), "Nur bei Assistent = Google. Assistant: allgemeine Google-Sprachsuche. Suche: öffnet die SmartTube-Suche, das Gesprochene landet im Suchfeld - dafür in SmartTube unter Einstellungen > Suche \"Instant voice search\" einschalten. Auto: Suche nur, wenn SmartTube läuft, sonst Assistant. Tippen schaltet durch.");
          lv_label_set_text(id(h_tts), "AN: Antworten von Home Assistant werden zusätzlich über einen Lautsprecher gesprochen. AUS: Die Antwort steht nur auf dem Display der Remote.");
          lv_label_set_text(id(h_touch), "Zeigt, wo du das Display berührst. Zum Prüfen der Touch-Genauigkeit, besonders am Rand. Beenden mit der Zurück-Taste.");
          lv_label_set_text(id(h_btn), "Zeigt für jede Taste, ob sie als einfach, doppelt oder lang erkannt wird. Nur Anzeige, nichts geht an den Fernseher.");
          lv_label_set_text(id(h_cleandur), "So lange sind Tasten und Touch gesperrt, damit du das Display abwischen kannst.");
          lv_label_set_text(id(h_clean), "Startet die Reinigung: Tasten und Touch sind gesperrt, bis die Zeit abgelaufen ist. Vorzeitig beenden: Zurück-Taste lang halten. Startet auch mit zwei kurzen Drücken auf die Aus-Taste.");
          lv_label_set_text(id(h_sd_tile), "App-Logos und andere Dateien auf der SD-Karte. Mit eingebundener Karte ist das Mikrofon gesperrt, nach dem Auswerfen geht die Sprachsuche wieder.");
          lv_label_set_text(id(h_sd_logos), "AN: Zu Apps ohne eigenes Cover (Netflix, Disney+ und andere) zeigt die Remote das Logo von der SD-Karte (Ordner covers). Die Karte wird dafür kurz eingebunden und sofort wieder ausgeworfen, das Mikrofon ist nur kurz gesperrt. AUS: wie bisher das neutrale Bild aus Home Assistant.");
          lv_label_set_text(id(h_sd_logoreset), "Löscht die geladenen Logos aus dem Speicher und liest sie beim nächsten Bedarf neu von der Karte, zum Beispiel nach dem Wechseln der Karte oder neuen Dateien.");
          lv_label_set_text(id(h_sd_mount), "Bindet die Karte ein. Solange sie eingebunden ist, ist das Mikrofon gesperrt (gleiche Anschlüsse), die Sprachsuche geht also nicht.");
          lv_label_set_text(id(h_sd_konfig), "Öffnet für 10 Minuten einen Dateizugang im WLAN (die Adresse steht oben), z. B. zum Hochladen der App-Logos. Kein Passwort, nur im Heimnetz nutzen.");
          lv_label_set_text(id(h_sd_eject), "Wirft die Karte aus und gibt das Mikrofon wieder frei. Ein Neustart ist nicht nötig. Falls die Sprachsuche danach nicht geht, hilft „Gerät neu starten“ unter Wartung.");
          lv_label_set_text(id(h_restart), "Startet die Remote neu, zum Beispiel wenn etwas hängt. Einstellungen bleiben erhalten. Vorher kommt eine Rückfrage.");

  - id: apply_tts_speaker
    then:
      - lambda: |-
          const bool an = id(tts_speaker);
          lv_label_set_text(id(tts_lbl), an ? "AN" : "AUS");
          lv_obj_set_style_text_color(id(tts_lbl),
            lv_color_hex(an ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);

  - id: apply_assistant
    then:
      - script.execute: apply_power
      # Assistenten-Symbol in der Statusleiste (Google/Home Assistant) auf
      # den neuen Stand bringen - die eigentliche Logik steckt in apply_show,
      # das auch beim Umschalten des Sichtbar-Schalters selbst laeuft.
      - script.execute: apply_show
      - lambda: |-
          const bool ha = id(assistant) == 1;
          lv_label_set_text(id(assi_lbl), ha ? "Home Assistant" : "Google");
          lv_obj_set_style_text_color(id(assi_lbl),
            lv_color_hex(ha ? 0x22C55E : 0x3B82F6), LV_PART_MAIN);   // wie das Mikrofon-Symbol oben
          static const char *gnames[3] = {"Assistant", "Suche", "Auto"};
          int gm = id(google_mode); if (gm < 0 || gm > 2) gm = 0;
          lv_label_set_text(id(google_mode_lbl), gnames[gm]);
          ESP_LOGI("assi", "Sprachassistent: %s", ha ? "Home Assistant" : "Google");

  - id: unflash
    mode: restart
    then:
      - delay: 180ms
      - lambda: |-
          if (id(flash_obj) != nullptr) {
            lv_obj_remove_state(id(flash_obj), LV_STATE_PRESSED);
            id(flash_obj) = nullptr;
          }

  # Navigationstasten (D-Pad, OK, Zurueck) auf den Seiten der Remote. Alle uebrigen Tasten belegt der
  # Tasten-Konfigurator (tasten::ereignis in on_key). key_repeat ruft das beim Halten wiederholt auf.
  - id: dispatch_key
    then:
      - lambda: |-
          const int keycode = id(cur_key);
          const int p = id(cur_page);
          // Ziffernblock / Tastatur (Seite 41): D-Pad markiert eine Taste der Matrix,
          // OK druckt sie. Erster Druck zeigt nur die Startmarkierung.
          if (p == 41 && (keycode == 14 || keycode == 35 || keycode == 15 || keycode == 32 || keycode == 34)) {
            const auto &L = eingabe::layout(id(kbd_mode), id(kbd_shift));
            lv_obj_t *m = id(kbd_matrix)->obj;
            // Kopfzeile: aus der obersten Reihe "hoch" -> Zurueck und Umschalter Maus | Tastatur | Ziffern
            // (2026-10-18); links/rechts wechselt, OK drueckt, "runter" zurueck in die Tasten
            const auto &W = eingabewahl::kbd();
            lv_obj_t *kopf[4] = {id(back_keyboard), W.kn[0], W.kn[1], W.kn[2]};
            const int nk = eingabewahl::kbd_umschalter_da() ? 4 : 1;
            if (id(kbd_kopf) >= 0) {
              if (keycode == 15) id(kbd_kopf) = (id(kbd_kopf) + nk - 1) % nk;
              else if (keycode == 32) id(kbd_kopf) = (id(kbd_kopf) + 1) % nk;
              else if (keycode == 34) { lv_obj_send_event(kopf[id(kbd_kopf)], LV_EVENT_CLICKED, nullptr); return; }
              else if (keycode == 35) id(kbd_kopf) = -1;
              for (int i = 0; i < nk; i++) {
                if (i == id(kbd_kopf)) lv_obj_add_state(kopf[i], LV_STATE_FOCUSED);
                else lv_obj_remove_state(kopf[i], LV_STATE_FOCUSED);
              }
              if (id(kbd_kopf) >= 0) return;
              if (id(kbd_sel) < 0 || id(kbd_sel) >= L.anzahl) id(kbd_sel) = L.start;
              lv_buttonmatrix_set_button_ctrl(m, id(kbd_sel), LV_BUTTONMATRIX_CTRL_CHECKED);
              return;
            }
            if (keycode == 14 && id(kbd_sel) >= 0 && id(kbd_sel) < L.reihen[0]) {
              id(kbd_kopf) = 0;
              lv_buttonmatrix_clear_button_ctrl_all(m, LV_BUTTONMATRIX_CTRL_CHECKED);
              lv_obj_add_state(kopf[0], LV_STATE_FOCUSED);
              return;
            }
            if (keycode == 34) {
              if (id(kbd_sel) < 0 || id(kbd_sel) >= L.anzahl) id(kbd_sel) = L.start;
              else {
                lv_buttonmatrix_set_selected_button(m, id(kbd_sel));
                id(kbd_press)->execute();
                return;
              }
            } else {
              id(kbd_sel) = eingabe::weiter(L, id(kbd_sel), keycode == 14 ? 0 : keycode == 35 ? 1 : keycode == 15 ? 2 : 3);
            }
            lv_buttonmatrix_clear_button_ctrl_all(m, LV_BUTTONMATRIX_CTRL_CHECKED);
            lv_buttonmatrix_set_button_ctrl(m, id(kbd_sel), LV_BUTTONMATRIX_CTRL_CHECKED);
            return;
          }

          // Sprachantwort (26): Tasten gehen seit 2026-10-28 wie auf der Startseite ans Geraet - hier kommt nichts an.

          // Steht der Fokus auf einem Regler, aendern Links/Rechts dessen Wert (Schritt 1, Grenzen vom Regler).
          if ((keycode == 15 || keycode == 32) && id(cur_focus) != nullptr &&
              lv_obj_check_type((lv_obj_t *) id(cur_focus), &lv_slider_class)) {
            lv_obj_t *sl = (lv_obj_t *) id(cur_focus);
            const int32_t lo = lv_slider_get_min_value(sl);
            const int32_t hi = lv_slider_get_max_value(sl);
            int32_t v = lv_slider_get_value(sl) + (keycode == 32 ? 1 : -1);
            if (v < lo) v = lo;
            if (v > hi) v = hi;
            lv_slider_set_value(sl, v, LV_ANIM_OFF);
            lv_obj_send_event(sl, LV_EVENT_VALUE_CHANGED, nullptr);
            return;
          }
          if (p == 45 && gestenseite::taste(keycode)) return;   // Gesten-Seite: eigene Fokus-Navigation
          if (p == 41 && keycode == 13 && gestenseite::kbd_abbruch()) return;   // Namenseingabe abbrechen
          if (p == 98) {   // konfigurierbares Menue: eigene Fokus-Navigation
            switch (keycode) {
              case 14: id(mn)->fokus(0, -1); return;
              case 35: id(mn)->fokus(0, 1); return;
              case 15: id(mn)->fokus(-1, 0); return;
              case 32: id(mn)->fokus(1, 0); return;
              case 34: id(mn)->ok(); return;
              case 13: id(nav_back)->execute(); return;
              default: break;
            }
          }
          switch (keycode) {
            case 13:  id(nav_back)->execute();    return;
            case 14:  id(focus_up)->execute();    return;
            case 35:  id(focus_down)->execute();  return;
            case 15:  id(focus_left)->execute();  return;
            case 32:  id(focus_right)->execute(); return;
            case 34:  id(activate)->execute();    return;
            default: break;
          }

  # Halten laesst nachfeuern: erst eine Pause, damit ein normaler Druck nicht
  # doppelt ausloest, danach in kurzen Abstaenden bis zum Loslassen.
  - id: key_repeat
    mode: restart
    then:
      - lambda: 'id(rep_count) = 0;'
      - delay: 300ms
      - while:
          # Notbremse: bleibt ein Loslassen mal aus (verlorenes Tastenereignis),
          # liefe die Wiederholung sonst endlos weiter und wuerde den Fernseher
          # zuspammen. Nach rund 10 Sekunden ist Schluss.
          condition:
            lambda: "return id(held_key) != 0 && id(rep_count) < 180;"
          then:
            - script.execute: dispatch_key
            - lambda: 'id(rep_count)++;'
            - delay: 55ms
      - lambda: |-
          if (id(rep_count) >= 180) {
            ESP_LOGW("tasten", "Wiederholung nach 10 s abgebrochen - Loslassen der Taste %d kam nie an", id(held_key));
            id(held_key) = 0;
            id(kb).execute_action("release");
          }

  # Popup schliessen (X, Zurueck, Auswahl getroffen): zurueck dorthin, wo man vorher war -
  # Startseite oder die Menueseite, ueber der das Popup aufging. Nie als Menueseite merken.
  - id: popup_schliessen
    then:
      - lambda: |-
          const int von = id(popup_von);
          id(popup_min) = -1;
          // Kam es aus dem Menue (oder einer daraus geoeffneten Seite): dorthin zurueck
          id(popup_zurueck) = von == 98 || (von > 0 && tasten::spezial_name(von) != nullptr);
          if (id(popup_zurueck)) {
            id(last_menu_page) = von;
            id(last_menu_ms) = millis();
            id(popup_seite) = -1;
          }
      - if:
          condition: {lambda: 'return id(popup_zurueck);'}
          then: [{script.execute: open_menu}]
          else:
            - script.execute: go_home
            - lambda: 'id(popup_min) = -1;'   # go_home legt es sonst als "weggelegt" ab

  # Weggelegtes Popup per Menuetaste zurueckholen (Menue-Popup 98 oder Tastatur 41)
  - id: popup_wieder
    then:
      - lambda: |-
          const int p = id(popup_min);
          id(popup_min) = -1;
          id(popup_von) = id(cur_page);
          id(popup_seite) = p;
          if (p == 41) {
            id(kbd_popup_zu) = false;
            id(kbd_popup_x) = false;
            id(kbd_popup_zeigen)->execute();
          } else if (p == 98) {
            id(mn)->popup(id(mn)->popup_seite());
            tasten::seite_zeigen(page_konfig, LV_SCR_LOAD_ANIM_FADE_IN);
          } else if (p == 51) {
            tasten::seite_zeigen(page_maus, LV_SCR_LOAD_ANIM_MOVE_LEFT);
          }

  - id: go_home
    then:
      - lambda: |-
          int p = id(cur_page);
          // Ein offenes Popup verlassen (Menuetaste, Timeout ...) heisst: weglegen, nicht merken.
          if (id(popup_seite) >= 0 && id(popup_seite) == p) {
            id(popup_min) = p;
            id(popup_min_ms) = millis();
            p = 0;
          }
          id(popup_seite) = -1;
          // Media-Seite: Verlassen-Zeitpunkt fuer das Merkfenster der Markierung. Nur aus dem Menue
          // geoeffnet zaehlt sie als Menueseite, von der Startseite aus nicht.
          if (p == 6) {
            const bool weggelegt = id(media_left_ms) != 0xFFFFFFFFu;   // nicht per Zurueck verlassen
            if (weggelegt) id(media_left_ms) = millis();
            if (id(media_from) != 3) {
              if (weggelegt && id(media_merken)) id(media_home_ms) = millis();
              p = 0;
            }
          }
          // Menue (98) oder eine daraus geoeffnete eingebaute Seite: fuer das Merkfenster festhalten.
          // Ohne eigenes "merken" der eingebauten Seite gilt die Menueseite, von der sie kam.
          if (p == 98 || (p > 0 && p == id(mn)->einstieg())) {
            if (p == 98 || !id(mn)->einstieg_merken()) {
              id(mn)->verlassen();
              p = 98;
            }
            id(last_menu_page) = p;
            id(last_menu_ms) = millis();
          }
          id(home_aus_menue) = (p != 0);
      # Menue schliessen: wie ein Handy-Kontrollzentrum nach unten wegschieben (geoeffnet wird es mit
      # OVER_TOP von unten ueber die Startseite).
      - if:
          condition: {lambda: 'return id(home_aus_menue);'}
          then: [{lvgl.page.show: {id: page_home, animation: OUT_BOTTOM, time: 150ms}}]
          else: [{lvgl.page.show: {id: page_home, animation: MOVE_RIGHT, time: 150ms}}]
  # Tastatur-Popup zeigen / weglegen (s. Globals kbd_popup*). Weglegen geht ohne go_home zur
  # Startseite, damit die Menue-Erinnerung nicht angefasst wird.
  - id: kbd_popup_zeigen
    then:
      - lambda: |-
          id(kbd_mode) = id(kbd_popup_mode);
          id(kbd_popup) = true;
          popup_oeffnet(41);
      - lvgl.page.show: {id: page_keyboard, animation: MOVE_LEFT, time: 150ms}
  - id: kbd_popup_weg
    then:
      - lambda: 'id(kbd_popup) = false;'
      - lvgl.page.show: {id: page_home, animation: MOVE_RIGHT, time: 150ms}
  # Menue ganz oben oeffnen, ohne Erinnerung (Menuetaste lang): alle gemerkten Positionen vergessen.
  - id: open_menu_top
    then:
      - lambda: |-
          id(last_menu_ms) = 0;
          id(media_home_ms) = 0;
          id(popup_seite) = -1;
          id(popup_min) = -1;
          for (int i = 0; i < 44; i++) { id(fmem_row)[i] = 0; id(fmem_col)[i] = 0; }
          id(fmem_last_page) = -1;
          id(media_left_ms) = 0;
          if (!id(mn)->aktiv()) return;
          id(mn)->oeffnen(false);
          tasten::menue_zeigen();

  # Menue oeffnen: innerhalb des Merkfensters (mem_s) die zuletzt gezeigte Seite, sonst die Startseite.
  - id: open_menu
    then:
      - lambda: |-
          const bool recent = id(last_menu_ms) != 0 && (id(mem_s) < 0 || (millis() - id(last_menu_ms)) < (uint32_t) id(mem_s) * 1000);
          id(popup_seite) = -1;
          // Ueber die Startseiten-Karte geoeffnete Medienseite zurueckholen (media_merken = 1, im Merkfenster)
          const uint32_t mh = id(media_home_ms);
          id(media_home_ms) = 0;
          if (!id(popup_zurueck) && mh != 0 && id(media_merken) && (id(mem_s) < 0 || millis() - mh < (uint32_t) id(mem_s) * 1000)) {
            id(popup_min) = -1;
            id(media_from) = 0;
            tasten::seite_zeigen(page_media, LV_SCR_LOAD_ANIM_MOVE_LEFT);
            return;
          }
          if (!id(popup_zurueck)) id(popup_min) = -1;   // normal ins Menue: weggelegtes Popup nicht mehr anbieten
          id(popup_zurueck) = false;
          // Merkfenster abgelaufen: auch die Markierungen aller Seiten vergessen
          if (!recent) {
            for (int i = 0; i < 44; i++) { id(fmem_row)[i] = 0; id(fmem_col)[i] = 0; }
            id(fmem_last_page) = -1;
            id(media_left_ms) = 0;
          }
          if (!id(mn)->aktiv()) return;
          // Gemerkte eingebaute Seite (aus dem Menue geoeffnet, mit "merken") wieder zeigen, sonst das Menue
          const char *spezial = recent && id(last_menu_page) != 98 ? tasten::spezial_name(id(last_menu_page)) : nullptr;
          if (spezial != nullptr) {
            id(mn)->oeffnen(true);
            id(mn)->spezial_oeffnen(spezial);
            return;
          }
          id(mn)->oeffnen(recent);
          tasten::menue_zeigen();
  # ---- Tasten-Test: einfach / doppelt / lang erkennen und anzeigen ----------------------------
  # Die Tastatur liefert nur "gedrueckt" und "losgelassen". Lang feuert schon beim Halten (gesture_long),
  # doppelt, wenn der zweite Druck innerhalb key_dbl_ms nach dem Loslassen beginnt, sonst einfach
  # (gesture_single). Im Betrieb erkennt der Tasten-Konfigurator (tasten_konfig) die Gesten selbst.
  - id: gesture_action
    then:
      - lambda: |-
          const int art = id(gest_kind);
          id(bt_result_key) = id(gest_key);
          id(bt_result_art) = art == 1 ? "Lang" : (art == 2 ? "Doppelt" : "Einzeln");
          id(bt_result_dur) = millis() - id(bt_press_ms);
      - script.execute: bt_show_result

  # Feuert den langen Druck, SOBALD die Haltezeit erreicht ist - nicht erst
  # beim Loslassen. Nur so merkt man beim Halten, dass es gezaehlt hat.
  - id: gesture_long
    mode: restart
    then:
      - delay: ${key_long_ms}ms
      - if:
          condition: {lambda: "return id(gest_held) != 0 && !id(gest_done);"}
          then:
            - lambda: |-
                id(gest_done) = true;
                id(gest_key) = id(gest_held);
                id(gest_kind) = 1;
            - script.execute: gesture_action

  # ---- Bildschirmtastatur (Seite 41) ----------------------------------------
  # Belegung (QWERTZ, 10 Einheiten pro Reihe), Umschalten (^) und Tastendruck.
  # Karten und Breiten sind static: LVGL merkt sich nur die Zeiger.
  - id: kbd_setup
    then:
      - lambda: |-
          // Belegung, Breiten und Navigation stehen in esphomeremote-eingabe.h.
          const auto &L = eingabe::layout(id(kbd_mode), id(kbd_shift));
          static lv_buttonmatrix_ctrl_t ctrl[50];
          static bool init = false;
          lv_obj_t *m = id(kbd_matrix)->obj;
          if (!init) {
            init = true;
            lv_obj_set_style_bg_opa(m, LV_OPA_TRANSP, LV_PART_MAIN);
            lv_obj_set_style_border_width(m, 0, LV_PART_MAIN);
            lv_obj_set_style_pad_all(m, 0, LV_PART_MAIN);
            lv_obj_set_style_pad_row(m, 5, LV_PART_MAIN);
            lv_obj_set_style_pad_column(m, 4, LV_PART_MAIN);
            lv_obj_set_style_bg_color(m, lv_color_hex(0x232A35), LV_PART_ITEMS);
            lv_obj_set_style_bg_opa(m, LV_OPA_COVER, LV_PART_ITEMS);
            lv_obj_set_style_radius(m, 6, LV_PART_ITEMS);
            lv_obj_set_style_border_width(m, 0, LV_PART_ITEMS);
            lv_obj_set_style_shadow_width(m, 0, LV_PART_ITEMS);
            lv_obj_set_style_text_color(m, lv_color_hex(0xF1F3F5), LV_PART_ITEMS);
            lv_obj_set_style_bg_color(m, lv_color_hex(0x2563EB), (lv_style_selector_t) LV_PART_ITEMS | LV_STATE_PRESSED);
            // Vom D-Pad markierte Taste (CHECKED): blauer Rahmen wie im Menue.
            lv_obj_set_style_bg_color(m, lv_color_hex(0x2A3340), (lv_style_selector_t) LV_PART_ITEMS | LV_STATE_CHECKED);
            lv_obj_set_style_border_width(m, 2, (lv_style_selector_t) LV_PART_ITEMS | LV_STATE_CHECKED);
            lv_obj_set_style_border_color(m, lv_color_hex(0x3B82F6), (lv_style_selector_t) LV_PART_ITEMS | LV_STATE_CHECKED);
            lv_obj_set_style_text_color(m, lv_color_hex(0xF1F3F5), (lv_style_selector_t) LV_PART_ITEMS | LV_STATE_CHECKED);
          }
          for (int i = 0; i < L.anzahl; i++) ctrl[i] = (lv_buttonmatrix_ctrl_t) L.breite[i];
          // Ziffernblock: grosse Schrift (a18 von der Play-Taste); Tastatur: a13
          lv_obj_set_style_text_font(m, lv_obj_get_style_text_font(id(kbd_mode) == 0 ? id(m_pp_lbl) : id(cv_state), LV_PART_MAIN), LV_PART_ITEMS);
          lv_buttonmatrix_set_map(m, L.map);
          lv_buttonmatrix_set_ctrl_map(m, ctrl);
          lv_buttonmatrix_clear_button_ctrl_all(m, LV_BUTTONMATRIX_CTRL_CHECKED);
          if (id(kbd_sel) >= 0 && id(kbd_sel) < L.anzahl)
            lv_buttonmatrix_set_button_ctrl(m, id(kbd_sel), LV_BUTTONMATRIX_CTRL_CHECKED);

  - id: kbd_press
    then:
      - lambda: |-
          lv_obj_t *m = id(kbd_matrix)->obj;
          const uint32_t i = lv_buttonmatrix_get_selected_button(m);
          if (i == LV_BUTTONMATRIX_BUTTON_NONE) return;
          const char *t = lv_buttonmatrix_get_button_text(m, i);
          if (t == nullptr) return;
          const std::string s(t);
          if (gestenseite::kbd_taste(s)) return;   // Namenseingabe fuer eine Geste (Gesten-Seite)
          if (s == "^") {
            id(kbd_shift) = !id(kbd_shift);
            id(kbd_setup)->execute();
          } else if (s == "<–") {
            touchpad::taste_raus(0, 0x2A);
          } else if (s == "‹" || s == "›") {
            // Cursor im Eingabefeld (2026-10-26): Pfeiltasten waeren am Fernseher Navigation in dessen Bildschirm-
            // tastatur - die Streamer-App setzt den Cursor direkt (per ADB, ueber HA bzw. das Dock). Ohne Streamer: Pfeil.
            const std::string adb = tk_cfg->ent("adb");
            if (adb.empty()) touchpad::taste_raus(0, s == "‹" ? 0x50 : 0x4F);
            else tk_cfg->ha_aufruf("androidtv.adb_command", {{"entity_id", adb}, {"command", std::string(
                "am broadcast -a de.esphomeremote.streamer.CURSOR -p de.esphomeremote.streamer --ei d ") + (s == "‹" ? "-1" : "1")}});
          } else if (s == "Ent" || s == "OK") {
            touchpad::taste_raus(0, 0x28);
          } else if (s == "Leer") {
            touchpad::taste_raus(0, 0x2C);
          } else {
            // "Tastatur: nur Ziffern" (2026-10-07): die Bluetooth-Tastatur kennt keine Buchstaben mehr (sonst laedt
            // SmartTube bei jedem Verbinden/Trennen neu). Ziffern gehen weiter per Bluetooth, alles andere tippt HA
            // per ADB direkt ins Eingabefeld des Streamers - wie die Google-TV-App am Handy.
            bool nur_ziffern = true;
            for (char ch : s) if (ch < '0' || ch > '9') nur_ziffern = false;
            if (tk_cfg->text_ueber_dock(s, [s]() { id(kb).send_string(s); })) {
              // ueber das Dock (2026-10-23)
            } else if (!id(kb).tastatur_voll() && !nur_ziffern) {
              std::string q = "input text '";
              for (char ch : s) {
                if (ch == ' ') q += "%s";
                else if (ch == '\'') q += "'\\''";
                else q += ch;
              }
              q += "'";
              id(adb_tippen)->execute(q);
            } else {
              id(kb).send_string(s);
            }
            if (id(kbd_shift)) { id(kbd_shift) = false; id(kbd_setup)->execute(); }   // einmaliges Umschalten
          }

  # OK auf dem Steuerkreuz gehalten (Tastatur-Seite, 2026-10-26): markierte Taste wiederholen, wie beim Touch
  - id: kbd_wdh
    mode: restart
    then:
      - delay: 450ms
      - while:
          condition:
            lambda: |-
              if (!id(kbd_ok_halten) || id(cur_page) != 41 || id(kbd_kopf) >= 0 || id(kbd_sel) < 0) return false;
              const char *t = lv_buttonmatrix_get_button_text(id(kbd_matrix)->obj, id(kbd_sel));
              return t != nullptr && strcmp(t, "^") != 0;
          then:
            - lambda: 'lv_buttonmatrix_set_selected_button(id(kbd_matrix)->obj, id(kbd_sel));'
            - script.execute: kbd_press
            - delay: 110ms

  # Text per ADB auf dem Streamer eintippen (Tastatur-Seite bei "nur Ziffern"). queued: schnelles Tippen bleibt in
  # der Reihenfolge. Hinweis: "input text" kann keine Umlaute.
  - id: adb_tippen
    mode: queued
    max_runs: 30
    parameters: {cmd: string}
    then:
      - if:
          condition: {lambda: 'return id(tk_cfg).ent("adb").empty();'}
          then:
            - lambda: 'ESP_LOGW("adb", "Kein Streamer gewaehlt (Konfigurator > Verknuepfungen)");'
          else:
            - homeassistant.action:
                action: androidtv.adb_command
                data:
                  entity_id: !lambda 'return id(tk_cfg).ent("adb");'
                  command: !lambda 'return cmd;'

  - id: gesture_single
    mode: restart
    then:
      - delay: ${key_dbl_ms}ms
      - lambda: 'id(gest_kind) = 0;'
      - script.execute: gesture_action

  # ---- Tasten-Test ---------------------------------------------------------
  # Traegt ein Ergebnis in die kleine Verlaufsliste ein und in die grosse
  # Anzeige oben - beides nur, wenn die Seite gerade offen ist (sonst
  # unnoetiges LVGL-Redraw im Hintergrund).
  - id: bt_show_result
    then:
      - lambda: |-
          if (id(cur_page) != 34) return;
          std::string art = id(bt_result_art);
          uint32_t col = 0x8B94A3;
          if (art == "Einzeln")      col = 0x22C55E;
          else if (art == "Doppelt") col = 0x3B82F6;
          else if (art == "Lang")    col = 0xEF9F1A;
          lv_label_set_text(id(bt_result_kind), art.c_str());
          lv_obj_set_style_text_color(id(bt_result_kind), lv_color_hex(col), LV_PART_MAIN);
          char detail[48];
          snprintf(detail, sizeof(detail), "Taste %d · %u ms", id(bt_result_key), (unsigned) id(bt_result_dur));
          lv_label_set_text(id(bt_result_detail), detail);
          // Verlauf: neuester Eintrag oben, fuenf sichtbar. Ein simples
          // Durchschieben reicht - die Liste ist bewusst kurz und einfach
          // gehalten ("schoene Auswertung" heisst hier: klar lesbar, nicht
          // ueberladen).
          lv_obj_t *rows[5] = {id(bt_hist_0), id(bt_hist_1), id(bt_hist_2),
                                id(bt_hist_3), id(bt_hist_4)};
          for (int i = 4; i > 0; i--)
            lv_label_set_text(rows[i], lv_label_get_text(rows[i - 1]));
          id(bt_count)++;
          char row0[64];
          snprintf(row0, sizeof(row0), "#%d  Taste %d  %s  %u ms",
                   id(bt_count), id(bt_result_key), art.c_str(), (unsigned) id(bt_result_dur));
          lv_label_set_text(rows[0], row0);


  - id: nav_back
    then:
      - if:
          condition: {lambda: "return id(popup_seite) >= 0 && id(popup_seite) == id(cur_page);"}
          then:
            - if:
                # Knopf "_" (Konfigurator: Popup minimieren, 2026-10-27): weglegen wie die Menuetaste
                condition: {lambda: 'return tasten::popup_knopf_min();'}
                then: [{lambda: 'tasten::popup_minimieren();'}]
                else:
                  - lambda: |-
                      id(popup_seite) = -1;
                      // Tastatur per X geschlossen: nicht wiederkommen, solange sie am Streamer offen bleibt (max. 30 min)
                      if (id(cur_page) == 41) { id(kbd_popup) = false; id(kbd_popup_zu) = true; id(kbd_popup_x) = true; id(kbd_popup_zu_ms) = millis(); }
                  - script.execute: popup_schliessen
          else:
            - script.execute: nav_back_menue

  # Kopf der Tastatur-Seite: "X" als Popup (schliessen), sonst "<" (zurueck ins Menue)
  - id: popup_kopf
    then:
      - lambda: 'lv_label_set_text(id(back_kbd_lbl), id(popup_seite) == 41 ? (id(mn)->inhalt_knopf_min() ? "_" : "X") : "<");'

  # Zurueck: im Menue eine Seite hoch (oben: Startseite); eine aus dem Menue geoeffnete eingebaute Seite
  # fuehrt zurueck ins Menue.
  - id: nav_back_menue
    then:
      - if:
          condition: {lambda: 'return id(cur_page) == 98 || (id(mn)->aktiv() && id(cur_page) == id(mn)->einstieg());'}
          then:
            - if:
                condition: {lambda: 'return id(cur_page) == 98 && !id(mn)->zurueck();'}
                then: [{script.execute: go_home}]
            - if:
                condition: {lambda: 'return id(cur_page) != 98;'}
                then:
                  - lambda: 'id(mn)->anzeigen();'
                  - lvgl.page.show: {id: page_konfig, animation: MOVE_RIGHT, time: 150ms}
          else: [{script.execute: nav_back_alt}]
  # Uebrige Seiten: Unterseiten der Wartung (Neustart-Frage, Tasten-/Touch-Test, SD-Karte) zurueck zur
  # Wartung, alles andere zur Startseite.
  - id: nav_back_alt
    then:
      - lambda: |-
          const int seite = id(cur_page);
          // Verlassene Seite vergessen: ein spaeterer, neuer Besuch beginnt wieder oben
          if (seite >= 0 && seite < 44) {
            id(fmem_row)[seite] = 0;
            id(fmem_col)[seite] = 0;
          }
          if (seite == 41) id(kbd_popup) = false;
          // Media-Seite per Zurueck verlassen: go_home darf den Zeitpunkt nicht setzen (Markierung vergessen)
          if (seite == 6) id(media_left_ms) = 0xFFFFFFFFu;
      - if:
          condition: {lambda: "const int p = id(cur_page); return p == 25 || p == 34 || p == 36 || p == 42;"}
          then: [{lvgl.page.show: {id: page_service, animation: MOVE_RIGHT, time: 150ms}}]
          else:
            # Begruessung (24): nur, wenn das Display beim Druck schon an war - die Taste, mit der man die
            # Remote aufweckt, soll sie nicht gleich wieder wegschalten. millis() > 6000: nach einem Neustart
            # aus dem Tiefschlaf ist disp_off beim weckenden Druck noch false.
            - if:
                condition: {lambda: "return id(cur_page) != 24 || (!id(key_was_dark) && millis() > 6000);"}
                then: [{script.execute: go_home}]

  - id: toggle_kbd_light
    then:
      - lambda: 'id(kbd_light_on) = !id(kbd_light_on);'
      - if:
          condition: {lambda: "return id(kbd_light_on);"}
          then:  [{light.turn_on: button_backlight}]
          else:  [{light.turn_off: button_backlight}]
      - lvgl.label.update:
          id: kbd_light_lbl
          text: !lambda 'return id(kbd_light_on) ? std::string("AN") : std::string("AUS");'
      - lvgl.label.update:
          id: kbd_light_lbl
          text_color: !lambda 'return id(kbd_light_on) ? lv_color_hex(0x22C55E) : lv_color_hex(0x8B94A3);'

  # Knoepfe der Media-Player-Seite: bei Multiroom-Musik an Music Assistant, sonst Bluetooth-Medientasten an
  # das verbundene Geraet (Einzeldruck). was: 0 Play/Pause, 1 vor, 2 zurueck, 3 lauter, 4 leiser
  - id: mp_taste
    parameters: {was: int}
    then:
      - if:
          condition:
            lambda: 'return id(mp_quelle).state == "multiroom" && !id(tk_cfg).ent("multiroom").empty();'
          then:
            - homeassistant.service:
                service: !lambda |-
                  static const char *const S[] = {"media_player.media_play_pause", "media_player.media_next_track",
                    "media_player.media_previous_track", "media_player.volume_up", "media_player.volume_down"};
                  return std::string(S[was < 0 || was > 4 ? 0 : was]);
                data:
                  entity_id: !lambda 'return id(tk_cfg).ent("multiroom");'
          else:
            - lambda: |-
                static const char *const C[] = {"consumer:0x00CD", "consumer:0x00B5", "consumer:0x00B6", "consumer:0x00E9", "consumer:0x00EA"};
                id(kb).execute_action(C[was < 0 || was > 4 ? 0 : was]);

  # ---- Akku-Seite (43) ------------------------------------------------------------------
  - id: akku_anzeige
    then:
      - lambda: |-
          char b[40];
          const float pct = id(akku_level).state;
          const float u = id(akku_spannung).state;
          const float chip = id(entladerate).state;
          const bool kabel = id(charger_present).state;
          const bool zeit_ok = id(sntp_time).now().is_valid();
          const uint32_t jetzt = zeit_ok ? id(sntp_time).now().timestamp : 0;
          auto setz = [](lv_obj_t *o, const char *s) { lv_label_set_text(o, s); };
          auto rate_txt = [&](float r, char *out, size_t n) {
            if (std::isnan(r)) snprintf(out, n, "--");
            else snprintf(out, n, "%+.1f %%/h", (double) r);
          };
          setz(id(ak_status), kabel ? (id(laedt) ? "lädt" : "am Kabel, voll") : "Akku");
          snprintf(b, sizeof(b), std::isnan(pct) ? "--" : "%.0f %%", (double) pct); setz(id(ak_pct), b);
          snprintf(b, sizeof(b), std::isnan(u) ? "--" : "%.2f V", (double) u);      setz(id(ak_volt), b);
          rate_txt(chip, b, sizeof(b)); setz(id(ak_rate), b);
          uint32_t sp1 = 0, sp24 = 0;
          const float r1  = akkustat::rate(jetzt, pct, 3900, 1800, sp1);     // ~1 h (mind. 30 min Daten)
          const float r24 = akkustat::rate(jetzt, pct, 86400 + 600, 3 * 3600, sp24);
          if (kabel) { setz(id(ak_r1), "beim Laden --"); setz(id(ak_r24), "beim Laden --"); }
          else {
            rate_txt(r1, b, sizeof(b)); setz(id(ak_r1), b);
            if (std::isnan(r24)) setz(id(ak_r24), "zu wenig Daten");
            else if (sp24 < 23 * 3600) {
              snprintf(b, sizeof(b), "%+.1f %%/h (%u h)", (double) r24, (unsigned) (sp24 / 3600)); setz(id(ak_r24), b);
            } else { rate_txt(r24, b, sizeof(b)); setz(id(ak_r24), b); }
          }
          setz(id(ak_r24_titel), (!kabel && !std::isnan(r24) && sp24 < 23 * 3600) ? "Seit Ladung" : "Letzte 24 h");
          // Restlaufzeit: beste verfuegbare Rate (24 h > 1 h > Chip), nur bei Entladung
          float r = !std::isnan(r24) ? r24 : (!std::isnan(r1) ? r1 : chip);
          if (kabel || std::isnan(pct)) setz(id(ak_rest), "--");
          else if (std::isnan(r) || r > -0.05f) setz(id(ak_rest), "sehr lang");
          else setz(id(ak_rest), ("~" + akkustat::dauer((uint32_t) (pct / -r * 3600.0f))).c_str());
          // Zuletzt geladen
          const uint32_t gt = akkustat::g_akku.geladen_t;
          if (kabel) setz(id(ak_geladen), "jetzt");
          else if (gt == 0 || !zeit_ok || jetzt < gt) setz(id(ak_geladen), "unbekannt");
          else {
            auto z = ESPTime::from_epoch_local(gt);
            snprintf(b, sizeof(b), "%02d.%02d. %02d:%02d", z.day_of_month, z.month, z.hour, z.minute);
            setz(id(ak_geladen), b);
            snprintf(b, sizeof(b), "vor %s, auf %u %%", akkustat::dauer(jetzt - gt).c_str(),
                     (unsigned) lroundf(akkustat::g_akku.geladen_pct10 / 10.0f));
            setz(id(ak_geladen2), b);
          }
          if (kabel || gt == 0) setz(id(ak_geladen2), "");
          // Tiefschlaf seit Ladung
          const uint32_t bs = akkustat::g_akku.basis;
          if (kabel) setz(id(ak_schlaf), "--");
          else if (bs == 0 || !zeit_ok || jetzt <= bs) setz(id(ak_schlaf), "unbekannt");
          else {
            const uint32_t ges = jetzt - bs, sl = akkustat::g_akku.schlaf_summe;
            snprintf(b, sizeof(b), "%s (%u %%)", akkustat::dauer(sl).c_str(),
                     (unsigned) (ges ? (uint64_t) sl * 100 / ges : 0));
            setz(id(ak_schlaf), b);
          }
          // Verlauf der letzten 24 h (216 x 60 px, oben 100 %, unten 0 %). Nur Entladung
          // seit der letzten Ladung - beim Laden beginnt die Aufzeichnung neu.
          {
            static lv_point_precise_t pts[110];
            const int W = 212, H = 56;
            int n = 0;
            const auto &g = akkustat::g_akku;
            const uint32_t t0 = jetzt > 86400 ? jetzt - 86400 : 0;
            const int schritt = g.anzahl > 100 ? (g.anzahl + 99) / 100 : 1;
            for (int i = 0; i < g.anzahl && zeit_ok; i += schritt) {
              const akkustat::Probe &q = g.p[(g.kopf + akkustat::N - g.anzahl + i) % akkustat::N];
              if (q.t < t0 || q.t > jetzt) continue;
              pts[n].x = 2 + (int32_t) ((uint64_t) (q.t - t0) * W / 86400);
              pts[n].y = 2 + H - (int32_t) (q.pct10 * H / 1000);
              n++;
            }
            if (n > 0 && !std::isnan(pct) && !kabel) {   // aktueller Stand als letzter Punkt
              pts[n].x = 2 + W; pts[n].y = 2 + H - (int32_t) (pct * H / 100.0f); n++;
            }
            if (n < 2) { pts[0] = {0, 0}; pts[1] = {0, 0}; n = 2; }
            lv_line_set_points(id(ak_graph)->obj, pts, n);
            if (n > 2 || (pts[1].x != 0)) lv_obj_add_flag(id(ak_graph_leer), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_remove_flag(id(ak_graph_leer), LV_OBJ_FLAG_HIDDEN);
          }

  # Bluetooth-Optionen auf der Bluetooth-Seite anzeigen
  - id: ble_optionen_anzeigen
    then:
      - lambda: |-
          lv_label_set_text(id(ble_par_lbl), id(ble_parallel) ? "AN" : "AUS");
          lv_obj_set_style_text_color(id(ble_par_lbl), lv_color_hex(id(ble_parallel) ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          {
            static const char *W[] = {"Automatisch", "Nur Remote", "Dock zuerst"};
            const int w = std::max(0, std::min(2, (int) id(bt_weg)));
            lv_label_set_text(id(bt_weg_lbl), W[w]);
            lv_obj_set_style_text_color(id(bt_weg_lbl), lv_color_hex(w != 1 ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
            lv_label_set_text(id(h_bt_weg), w == 0
                ? "Automatisch: Ist die Remote selbst mit dem Gerät verbunden, sendet sie selbst. Sonst geht die Taste per Funk ans Dock, das dauerhaft mit Fernseher, Tablet & Co. verbunden ist - sofort, auch direkt nach dem Aufwachen. Welcher Platz am Dock welches Gerät ist, stellst du im Konfigurator ein."
                : w == 1 ? "Nur Remote: Bluetooth-Tasten und Touchpad gehen nur über die eigene Verbindung der Remote (wie früher)."
                         : "Dock zuerst: Ist das Gerät am Dock gekoppelt, geht alles übers Dock - auch wenn die Remote selbst verbunden ist. Antwortet das Dock nicht, sendet die Remote selbst.");
          }

  # Herunterfahren: Merker im RTC-Speicher setzen, dann der normale Tiefschlaf-Weg.
  - id: herunterfahren
    then:
      - delay: 1500ms
      - lambda: |-
          g_ausgeschaltet = AUSGESCHALTET_MAGIC;
          ESP_LOGI("aus", "Herunterfahren - Einschalten mit Aus-Taste oder Ladekabel");
      - script.execute: deep_sleep_powerdown
      - deep_sleep.enter:
          id: nachtschlaf


# --- Mikrofon-/SD-Stromversorgung (Rev6) -------------------------------------
# GPIO45 = MIC_VDD (active-high, gegen das Rev6-PCB verifiziert: U7 Pad 26).
# GPIO16 = SD_EN (active-low, HIGH = Karte aus, gibt die geteilten I2S-Pins frei).
# GPIO18 = SD_CS, von der Firmware vor jeder Mic-Nutzung auf HIGH gezogen.
# Bedienung aus Home Assistant (2026-10-18, Nutzerwunsch): Helligkeiten als Regler. Wirken wie die Regler auf der
# Remote; der Lichtsensor (Konfigurator > Licht) stellt sie spaeter wieder nach, wenn er eingeschaltet ist.
number:
  - platform: template
    id: num_disp_bri
    name: "Display-Helligkeit"
    icon: "mdi:brightness-6"
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    mode: slider
    update_interval: never   # gemeldet von apply_brightness, nur bei Aenderung
    lambda: 'return id(disp_bri);'
    set_action:
      - lambda: 'id(disp_bri) = (int) x;'
      - script.execute: apply_brightness
  - platform: template
    id: num_kbd_bri
    name: "Tastenbeleuchtung Helligkeit"
    icon: "mdi:keyboard-settings"
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    mode: slider
    update_interval: never
    lambda: 'return id(kbd_bri);'
    set_action:
      - lambda: 'id(kbd_bri) = (int) x;'
      - script.execute: apply_brightness

switch:
  # Aus Home Assistant schaltbar (2026-10-18): Tastenbeleuchtung, Display, Smart Display im Dock
  - platform: template
    name: "Tastenbeleuchtung"
    icon: "mdi:keyboard-variant"
    restore_mode: DISABLED
    lambda: 'return id(kbd_light_on);'
    turn_on_action:
      - if: {condition: {lambda: 'return !id(kbd_light_on);'}, then: [{script.execute: toggle_kbd_light}]}
    turn_off_action:
      - if: {condition: {lambda: 'return id(kbd_light_on);'}, then: [{script.execute: toggle_kbd_light}]}
  - platform: template
    name: "Display"
    icon: "mdi:tablet-cellphone"
    restore_mode: DISABLED
    lambda: 'return !id(disp_off);'
    turn_on_action:
      - script.execute: wake_backlight
    turn_off_action:
      - lambda: 'id(sofort_aus) = true;'
      - script.execute: backlight_idle_timeout
  - platform: template
    name: "Smart Display im Dock"
    icon: "mdi:tablet-dashboard"
    restore_mode: DISABLED
    lambda: 'return id(dock_an);'
    turn_on_action:
      - lambda: 'id(dock_an) = true; extras::auffrischen();'
    turn_off_action:
      - lambda: 'id(dock_an) = false; extras::auffrischen();'
  - platform: gpio
    id: mic_power
    # Nicht mehr direkt in Home Assistant - stattdessen der verstaendliche
    # Schalter "Mikrofon stumm" weiter unten. Der Zustand wird von
    # apply_mic_power gesetzt (erlaubt UND Display wach), deshalb hier kein
    # ALWAYS_ON mehr.
    internal: true
    pin: GPIO45
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: sd_power_off
    # Interner Aufbau (gibt die geteilten I2S-Pins frei), nichts zum Schalten.
    internal: true
    pin: GPIO16
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: sd_cs_idle
    internal: true
    pin: GPIO18
    restore_mode: ALWAYS_ON

  # Konfig-Modus: startet fuer 10 Minuten einen HTTP-Endpunkt (/sd/api/...) zum Hoch-/Runterladen von
  # Dateien auf der SD-Karte (z. B. App-Logos, tools/sd_upload.py). KEIN Dauer-Webserver (Strom). Waehrend des Fensters kein
  # Tiefschlaf (ota_aktiv). Der Schalter spiegelt den echten Zustand.
  # Seit 2026-10-18 ohne Entitaet in HA (Nutzerwunsch) - geschaltet ueber den Dienst konfig_http (sd_upload.py, Fotos)
  - platform: template
    id: konfig_http_sw
    internal: true
    lambda: 'return id(sdkarte)->http_active();'
    turn_on_action:  [{script.execute: sd_konfig_start}]
    turn_off_action: [{script.stop: sd_konfig_start}, {script.execute: sd_konfig_stop}]
  # IR-Empfaenger-Versorgung (Rev6): GPIO6 = IR_VCC speist U6 (TSSP77038) direkt. Nur zum IR-Lernen an.
  - platform: gpio
    id: ir_rx_power
    internal: true   # schaltet die Remote beim IR-Lernen selbst (seit 2026-10-18 nicht mehr in HA)
    pin: GPIO6
    # Nach jedem Start aus (2026-10-25): mit RESTORE_DEFAULT_OFF blieb er an, wenn die Remote mitten im Lernen einschlief
    restore_mode: ALWAYS_OFF
    # RMT-Empfangskanal nur mit Strom am Empfaenger (IR-Lernen) - s. esphomeremote-rmt.h
    on_turn_on:
      - lambda: 'rmt_bedarf::empfaenger(id(ir_rx), true);'
    on_turn_off:
      - lambda: 'rmt_bedarf::empfaenger(id(ir_rx), false);'

  # Assistentenwahl auch aus Home Assistant heraus.
  - platform: template
    name: "Assistent: Home Assistant"
    icon: "mdi:home-assistant"
    lambda: 'return id(assistant) == 1;'
    turn_on_action:
      - lambda: 'id(assistant) = 1;'
      - script.execute: apply_assistant
    turn_off_action:
      - lambda: 'id(assistant) = 0;'
      - script.execute: apply_assistant

  # Datenschutz: kappt die Versorgung des Mikrofons komplett - mehr als eine Software-Stummschaltung.
  - platform: template
    name: "Mikrofon stumm"
    icon: "mdi:microphone-off"
    # Fragt den Merker ab, nicht die Versorgung - die folgt zusaetzlich dem
    # Display und wuerde den Schalter sonst von selbst umlegen.
    lambda: 'return !id(mic_allowed);'
    turn_on_action:
      - globals.set: {id: mic_allowed, value: "false"}
      - script.execute: apply_mic_power
    turn_off_action:
      - globals.set: {id: mic_allowed, value: "true"}
      - script.execute: apply_mic_power

  # Tiefschlaf im Ruhezustand - derselbe Schalter wie unter Einstellungen ->
  # Energie sparen, nur zusaetzlich aus Home Assistant erreichbar (praktisch
  # fuer Fernwartung: aus = Geraet bleibt sicher online, an = Akku schonen).
  - platform: template
    name: "Tiefschlaf im Ruhezustand"
    icon: "mdi:power-sleep"
    # DISABLED: der Schalter spiegelt nur das Global, das Global ist die
    # Wahrheit. Ohne das ruft der Schalter beim Boot turn_off_action und wuerde
    # ps_deep bei jedem Neustart (auch nach jedem Deep-Sleep-Wake!) auf false
    # zwingen.
    restore_mode: DISABLED
    lambda: 'return id(ps_deep);'
    turn_on_action:
      - lambda: 'id(ps_deep) = true; g_deep_active = 0x5EEEu;'
      - script.execute: apply_power
      # Den Ruhe-/Schlafablauf neu anstossen, damit der Tiefschlaf auch dann
      # greift, wenn das Display schon aus ist.
      - script.execute: backlight_idle_timeout
    turn_off_action:
      - lambda: 'id(ps_deep) = false; g_deep_active = 0;'
      - script.execute: apply_power


  # Testmodus (Sicherheitsnetz): AN = Tiefschlaf und "WLAN aus im Ruhezustand"
  # sind komplett ausgehebelt, das Geraet bleibt immer per WLAN erreichbar und
  # flashbar. AUS = echtes Stromsparverhalten (fuer Akku-Messungen).
  # restore_mode DISABLED + Global restore_value:false/initial:true =>
  # nach JEDEM Boot wieder AN (sicherer Ausgangszustand).
  - platform: template
    name: "Testmodus (immer online)"
    icon: "mdi:shield-check"
    restore_mode: DISABLED
    lambda: 'return id(testmodus);'
    turn_on_action:
      - globals.set: {id: testmodus, value: "true"}
      - lambda: 'ESP_LOGI("test", "Testmodus AN - kein Tiefschlaf, kein WLAN-Aus");'
      - script.execute: apply_power
    turn_off_action:
      - globals.set: {id: testmodus, value: "false"}
      - lambda: 'ESP_LOGW("test", "Testmodus AUS - Stromsparfunktionen aktiv");'
      - script.execute: apply_power
      - script.execute: backlight_idle_timeout

  # Spiegel der drei Geraete-Toggles fuer HA (fuer Messungen aus der Ferne).
  - platform: template
    name: "Sparen: WLAN-Sparmodus"
    icon: "mdi:wifi-cog"
    restore_mode: DISABLED
    lambda: 'return id(ps_wifi);'
    turn_on_action:  [{globals.set: {id: ps_wifi, value: "true"}},  {script.execute: apply_power}]
    turn_off_action: [{globals.set: {id: ps_wifi, value: "false"}}, {script.execute: apply_power}]
  - platform: template
    name: "Sparen: Leichtschlaf"
    icon: "mdi:sleep"
    restore_mode: DISABLED
    lambda: 'return id(ps_light);'
    turn_on_action:  [{globals.set: {id: ps_light, value: "true"}},  {script.execute: apply_cpu}]
    turn_off_action: [{globals.set: {id: ps_light, value: "false"}}, {script.execute: apply_cpu}]
  - platform: template
    name: "Bluetooth: parallel verbunden"
    icon: "mdi:bluetooth-connect"
    restore_mode: DISABLED
    lambda: 'return id(ble_parallel);'
    turn_on_action:  [{globals.set: {id: ble_parallel, value: "true"}},  {lambda: 'id(kb).set_parallel(true);'},  {script.execute: ble_optionen_anzeigen}]
    turn_off_action: [{globals.set: {id: ble_parallel, value: "false"}}, {lambda: 'id(kb).set_parallel(false);'}, {script.execute: ble_optionen_anzeigen}]
  - platform: template
    name: "WLAN früh einschalten (Taste, Bewegung)"
    icon: "mdi:wifi-arrow-up"
    entity_category: config
    restore_mode: DISABLED
    lambda: 'return id(wlan_frueh);'
    turn_on_action:  [{globals.set: {id: wlan_frueh, value: "true"}},  {script.execute: apply_power}]
    turn_off_action: [{globals.set: {id: wlan_frueh, value: "false"}}, {script.execute: apply_power}]
  - platform: template
    name: "Tiefschlaf nur ohne Bluetooth"
    icon: "mdi:bluetooth-connect"
    entity_category: config
    restore_mode: DISABLED
    lambda: 'return id(deep_ohne_ble);'
    turn_on_action:  [{globals.set: {id: deep_ohne_ble, value: "true"}},  {script.execute: apply_power}]
    turn_off_action: [{globals.set: {id: deep_ohne_ble, value: "false"}}, {script.execute: apply_power}]
  - platform: template
    name: "WLAN-Schnellstart (feste IP)"
    icon: "mdi:wifi-arrow-up-down"
    entity_category: config
    restore_mode: DISABLED
    lambda: 'return id(wifi_fest);'
    turn_on_action:  [{globals.set: {id: wifi_fest, value: "true"}},  {script.execute: apply_power}]
    turn_off_action: [{globals.set: {id: wifi_fest, value: "false"}}, {script.execute: apply_power}]
  - platform: template
    name: "Sparen: WLAN aus im Ruhezustand"
    icon: "mdi:wifi-off"
    restore_mode: DISABLED
    lambda: 'return id(ps_wifi_off);'
    turn_on_action:  [{globals.set: {id: ps_wifi_off, value: "true"}},  {script.execute: apply_power}]
    turn_off_action: [{globals.set: {id: ps_wifi_off, value: "false"}}, {if: {condition: {lambda: "return !wlan_zugriff::g_nur_ble;"}, then: [{wifi.enable:}]}}, {script.execute: apply_power}]
  - platform: template
    name: "Sparen: Prozessor drosseln"
    icon: "mdi:speedometer-slow"
    restore_mode: DISABLED
    lambda: 'return id(ps_cpu);'
    turn_on_action:  [{globals.set: {id: ps_cpu, value: "true"}},  {script.execute: apply_cpu}, {script.execute: apply_power}]
    turn_off_action: [{globals.set: {id: ps_cpu, value: "false"}}, {script.execute: apply_cpu}, {script.execute: apply_power}]

  # BLE-Verbindung im Ruhezustand verlangsamen (Intervall 150 ms, Latency 3).
  - platform: template
    name: "BLE-Verbindung verlangsamen"
    icon: "mdi:bluetooth-settings"
    restore_mode: DISABLED
    lambda: 'return id(ps_bleidle);'
    turn_on_action:
      - globals.set: {id: ps_bleidle, value: "true"}
      - script.execute: apply_power
      - if:
          condition:
            lambda: 'return id(disp_off) && !id(voice_active) && !id(host_mic);'
          then: [{lambda: 'id(kb).request_conn_profile(true);'}]
    turn_off_action:
      - globals.set: {id: ps_bleidle, value: "false"}
      - lambda: 'id(kb).request_conn_profile(false);'
      - script.execute: apply_power

# --- I2S-Mikrofon (MS3625, Rev6) ---------------------------------------------
# Pins aus dem Rev6-PCB: SD_SCK=IO15, SD_MOSI=IO17, SD_MISO=IO7. L/R liegt auf
# GND -> linker Slot. NICHT gegen die Referenz-Firmware pruefen, die ist Rev5
# und hat gar kein Mikrofon.
i2s_audio:
  - id: i2s_mic_bus
    i2s_lrclk_pin: GPIO17
    i2s_bclk_pin: GPIO15

microphone:
  - platform: i2s_audio
    id: remote_mic
    i2s_audio_id: i2s_mic_bus
    adc_type: external
    i2s_din_pin: GPIO7
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    # 04.09. dreimal geprueft, zuletzt mit nachweislich freien Leitungen:
    # links UND rechts liefern exakt Null. Das ist nicht der Kanal, sondern ein
    # frei liegender L/R-Anschluss - dann sendet das MS3625 in keinem
    # Zeitfenster. 'left' ist richtig, sobald L/R Masse hat.
    channel: left
    correct_dc_offset: true

# --- Sprachassistent von Home Assistant --------------------------------------
# Laeuft ueber die ESPHome-API, nicht ueber Bluetooth. Teilt sich das Mikrofon
# mit atv_voice: dessen Datenrueckruf steigt aus, solange dort nichts laeuft
# (Zustand ATVV_IDLE), und umgekehrt greift dieser hier nur waehrend einer
# eigenen Abfrage. Gleichzeitig benutzen laesst sich beides nicht - deshalb
# schaltet die Fernbedienung zwischen ihnen um.
# Kein Lautsprecher an Bord: Antworten kommen nicht auf der Fernbedienung,
# sondern werden von der Pipeline in Home Assistant ausgegeben.
voice_assistant:
  id: ha_voice
  microphone:
    microphone: remote_mic
    bits_per_sample: 16
    channels: [0]
  # Gleiche Verstaerkung wie beim Google-Weg (atv_voice gain 6.5) - ohne war das Signal fuer die Erkennung zu leise.
  volume_multiplier: 6.5
  on_start:
    - lambda: 'ESP_LOGI("assi", "Home-Assistant-Abfrage gestartet"); weck_log("HA-Assistent");'
    - script.execute: wake_backlight
    - lvgl.label.update: {id: voice_you,    text: "..."}
    - lvgl.label.update: {id: voice_answer, text: "hört zu"}
    - lvgl.page.show: {id: page_voice, animation: FADE_IN, time: 150ms}
  on_stt_end:
    - lambda: 'ESP_LOGI("assi", "verstanden: %s", x.c_str());'
    - lvgl.label.update: {id: voice_you, text: !lambda 'return x;'}
    - lvgl.label.update: {id: voice_answer, text: "denkt nach"}
  on_tts_start:
    - lambda: 'ESP_LOGI("assi", "Antwort: %s", x.c_str());'
    - lvgl.label.update: {id: voice_answer, text: !lambda 'return x;'}
    - lambda: 'lv_obj_scroll_to_y(id(voice_box), 0, LV_ANIM_OFF);'
  # on_tts_end liefert die Adresse der fertigen Sprachdatei: auf dem gewaehlten Lautsprecher (Verknuepfung "tts") abspielen,
  # waehrend die Fernbedienung den Text zeigt (Einstellung "Antwort hoerbar").
  on_tts_end:
    - if:
        condition: {lambda: 'return id(tts_speaker) && !id(tk_cfg).ent("tts").empty();'}
        then:
          - homeassistant.service:
              service: media_player.play_media
              data:
                entity_id: !lambda 'return id(tk_cfg).ent("tts");'
                media_content_type: "music"
              data_template:
                media_content_id: "{{ url }}"
              variables:
                url: !lambda 'return x;'
          - lambda: 'ESP_LOGI("assi", "Antwort an den Lautsprecher: %s", x.c_str());'
  on_error:
    - lambda: 'ESP_LOGW("assi", "Fehler: %s - %s", code.c_str(), message.c_str());'
    - lvgl.label.update: {id: voice_answer, text: !lambda 'return std::string("Fehler: ") + message;'}
  # Erst wenn die Pipeline wirklich fertig ist, faellt der Mikrofonstrom weg.
  on_end:
    - lambda: 'ESP_LOGI("assi", "Abfrage beendet");'
    - globals.set: {id: voice_active, value: "false"}
    - script.execute: apply_mic_power
    - lambda: 'id(kb).set_rssi_paused(false);'

# --- BLE-HID-Tastatur (4 Host-Slots) -----------------------------------------
espidf_ble_keyboard:
  id: kb
  # Name, unter dem sich die Fernbedienung per Bluetooth meldet (Nutzerwunsch
  # 2026-09-17, vorher "OpenRemote"). Achtung: gekoppelte Hosts merken sich den
  # alten Namen - Fernseher, Streamer und Tablet zeigen ihn bis zum erneuten
  # Koppeln weiter an.
  device_name: "${friendly_name}"   # ohne "ESPHome" im Namen: sonst greift die MTK-Interop-Liste mancher Sony-TVs
  host_slots: 4
  # Ohne Zeigegeraet melden. Android TV schaltet die Oberflaeche um, sobald ein
  # Zeigegeraet auftaucht - YouTube und der Launcher bauen ihr Bild dann bei
  # jedem Verbinden komplett neu auf. Echte Fernbedienungen melden nur Tastatur
  # und Medientasten. Achtung: der Host merkt sich die Geraetebeschreibung pro
  # Kopplung, nach dieser Aenderung muss neu gekoppelt werden.
  # 2026-10-17: Maus einkompiliert, aber JE PLATZ geschaltet (maus_slots, Konfigurator > Bluetooth): Ohne Maus-Platz
  # ist die Geraetebeschreibung genau wie vorher (ohne Zeiger); ein Platz mit Maus bekommt sie zusaetzlich.
  pointer: true
  # Auch die Tastatur weg. Wir brauchen sie nicht - D-Pad, OK, Zurueck, Home,
  # Lautstaerke und Transport laufen alle ueber die Medientasten-Seite
  # (consumer:0x00xx). Android behandelt eine angeschlossene Tastatur wie eine
  # Konfigurationsaenderung, woraufhin laufende Apps ihre Oberflaeche neu
  # aufbauen - genau das "Bild laedt neu" beim Verbinden.
  alpha_keyboard: ${kb_tasten}
  keyboard_layout: de
  web_control: false
  # Frueher Start (2026-10-22 wieder an): Bluetooth zum Fernseher verbindet schon waehrend Display/WLAN/LVGL starten -
  # ~1-1,5 s schneller nach dem Tiefschlaf. War am 21.10. kurz zurueckgenommen (Absturz: Fernseher oeffnete das
  # Mikrofon vor dessen Setup) - seit dem atv_voice-Schutz (bereit_/mic_offen_) sicher. Optionen setzt on_boot 795.
  start_prioritaet: 790

# --- Android TV Voice (ATVV) -------------------------------------------------
atv_voice:
  id: voice
  keyboard_id: kb
  microphone: remote_mic
  codec: adpcm_16k
  agc: false
  # 04.09. eingeschaltet, nachdem der Mitschnitt es belegt hat: 19 von 58
  # Sprachabfragen wurden beschnitten, im schlimmsten Fall zu 11,6 %. Die
  # Verstaerkung bleibt bewusst bei 6.5 - beim ersten Versuch heute hatte ich
  # sie gleichzeitig auf 4.0 gesenkt, und DAS hat die Erkennung verschlechtert,
  # nicht die Begrenzung. Unterhalb des Knies (15000, rund 46 % Vollausschlag)
  # bleibt alles unveraendert; der gemessene Mittelwert liegt darunter.
  soft_limit: true
  # Der Fernseher kann die Aufnahme auch selbst anfordern - etwa das
  # Mikrofonsymbol in SmartTube, statt die Taste an der Fernbedienung zu
  # halten. Dann laeuft der Strom fuer das Mikrofon nicht, weil apply_mic_power
  # ihn nur waehrend einer eigenen Abfrage anlegt: der Fernseher bekam Stille.
  # Jetzt wird bei MIC_OPEN erst eingeschaltet, dann nach der Anlaufzeit
  # gestreamt, und am Ende faellt der Strom wieder weg.
  host_warmup: 250ms
  on_host_open:
    - lambda: 'weck_log("Host oeffnet Mikrofon");'
    - globals.set: {id: host_mic, value: "true"}
    - globals.set: {id: voice_active, value: "true"}
    - script.execute: apply_mic_power
    # Wie bei der Taste: RSSI-Abfrage pausieren (teilt sich den BT-Controller mit dem Audio -
    # ohne das gingen hier Pakete verloren, "Audio chunk dropped", live 2026-09-28).
    - lambda: 'id(kb).set_rssi_paused(true);'
    - script.stop: voice_power_guard
    - script.execute: wake_backlight
    - lvgl.label.update: {id: voice_you,    text: "Sprich jetzt"}
    - lvgl.label.update: {id: voice_answer, text: "Der Fernseher hat das Mikrofon angefordert. Das Erkannte erscheint auf dem Fernseher."}
    - lvgl.page.show: {id: page_voice, animation: FADE_IN, time: 150ms}
    - lambda: 'ESP_LOGI("assi", "Fernseher fordert das Mikrofon an");'
  on_stream_end:
    - globals.set: {id: host_mic, value: "false"}
    - globals.set: {id: voice_active, value: "false"}
    - script.execute: apply_mic_power
    - lambda: 'id(kb).set_rssi_paused(false);'
    - lambda: 'ESP_LOGI("assi", "Aufnahme fuer den Fernseher beendet - Mikrofon aus");'
    - delay: 1200ms
    - if:
        condition: {lambda: "return id(cur_page) == 26 && !id(host_mic);"}
        then: [{script.execute: go_home}]
  # Verstaerkung 6.5 (belegt funktionierender Stand; 3.0, 4.0 und 10.0 verschlechterten die Erkennung).
  gain: 6.5
  max_duration: 10s
  sync_interval: 0
  # send_hid_key AUS: der Antipper der "AC Search"-Taste (0x0221) passiert jetzt gezielt VOR dem
  # Streamen im YAML selbst (Mikrofon-Taste, gesture_action case 45) - sonst wuerde diese
  # eingebaute Funktion sie zusaetzlich die ganze Aufnahme ueber halten, zwei Mechanismen fuer
  # dieselbe Taste waeren redundant.
  send_hid_key: false

# --- Tastenmatrix ------------------------------------------------------------
tca8418:
  id: keypad
  address: 0x34
  # GPIO8 ist zugleich Weckpin fuer den Tiefschlaf - aber ueber die ext1-Maske
  # in deep_sleep_powerdown (esp_sleep_enable_ext1_wakeup), nicht ueber eine
  # zweite ESPHome-Pin-Deklaration. Daher hier kein allow_other_uses noetig.
  interrupt_pin:
    number: GPIO8
  rows: 5
  columns: 5
  extra_gpi_pins: [5]
  debounce: ${key_debounce_ms}ms
  long_press: ${key_long_ms}ms
  on_key:
    - then:
        # Zustand VOR dem Wecken festhalten - wake_backlight setzt disp_off
        # sofort zurueck.
        - lambda: |-
            id(key_was_dark) = id(disp_off);
            if (id(disp_off)) { char b[24]; snprintf(b, sizeof(b), "Taste %d", keycode); weck_log(b); }
        # "Tasten wecken" = Nur Menue-Taste: andere Tasten lassen das Display aus, bekommen aber
        # die schnelle Bluetooth-Verbindung, damit ihr Befehl ohne Verzoegerung ankommt.
        - if:
            # Weckt: die Taste mit Menue-/Display-Funktion (Tasten-Konfigurator).
            # Gerade erst von selbst ausgegangen (< 3 s): jede Taste weckt wieder (2026-10-07)
            condition: {lambda: 'return !id(disp_off) || id(keys_wake_all) || tasten::weckt(keycode) || (id(disp_aus_ms) != 0 && millis() - id(disp_aus_ms) < 3000);'}
            then: [{script.execute: wake_backlight}]
            else: [{script.execute: key_ohne_wecken}]
        - lambda: |-
            id(last_input_ms) = millis();
            // Roh-Ereignis mit Zeitstempel (Fehlersuche Doppel/Einzel-Erkennung).
            ESP_LOGD("taste", "%d %s t=%u", (int) keycode, pressed ? "runter" : "hoch", (unsigned) millis());
            // ---- Reinigungsmodus: alle Tasten gesperrt, nur Zurueck LANG bricht ab.
            if (id(clean_mode)) {
              if (!pressed && keycode == 13 && long_press) id(clean_mode) = false;
              return;
            }
            // ---- Touch-Test: nur die Zurueck-Taste beendet ihn, alles andere ignorieren.
            if (id(cur_page) == 36) {
              if (pressed && keycode == 13) id(nav_back)->execute();
              return;
            }
            // ---- Tasten-Konfigurator (HA-Panel "Fernbedienung"): die Belegung uebernimmt alle Tasten -
            // ausser im Tasten-Test und der Navigation (D-Pad/OK/Zurueck) auf den Seiten der Remote.
            if (tasten::ereignis(keycode, pressed)) return;
            // ---- Tasten-Test: alle Tasten nur auswerten und anzeigen, nichts geht an ein Geraet ----
            if (id(button_test_mode)) {
              id(held_key) = 0;
              if (pressed) {
                // Zeit selbst messen: die Tastatur meldet die Haltedauer erst
                // beim Loslassen, wir wollen aber frueher ausloesen.
                id(gest_held) = keycode;
                id(gest_done) = false;
                id(bt_press_ms) = millis();
                // Zweiter Tipp innerhalb key_dbl_ms: Warte-Skript stoppen, das Loslassen entscheidet dann "doppelt".
                id(gest_dbl) = id(gest_last_key) == keycode && (millis() - id(gest_last_ms)) < ${key_dbl_ms};
                if (id(gest_dbl)) id(gesture_single)->stop();
                id(gesture_long)->execute();
                return;
              }
              id(gesture_long)->stop();
              id(gest_held) = 0;
              const uint32_t jetzt = millis();
              if (id(gest_done)) {   // der lange Druck hat waehrend des Haltens bereits gefeuert
                id(gest_done) = false;
                id(gest_last_key) = 0;
              } else if (id(gest_dbl) && id(gest_last_key) == keycode) {
                id(gesture_single)->stop();
                id(gest_key) = keycode; id(gest_kind) = 2;
                id(gest_last_key) = 0;
                id(gesture_action)->execute();
              } else {
                id(gest_last_key) = keycode; id(gest_last_ms) = jetzt;
                id(gest_key) = keycode;
                id(gesture_single)->execute();      // wartet auf einen zweiten
              }
              return;
            }

            // Ab hier nur noch die Navigation (D-Pad, OK, Zurueck) auf den Seiten der Remote - alle anderen
            // Tasten hat der Tasten-Konfigurator oben schon behandelt.
            if (!pressed) {
              if (keycode == id(held_key)) id(held_key) = 0;
              return;
            }
            id(held_key) = 0;
            const bool nav = keycode == 14 || keycode == 35 || keycode == 15 || keycode == 32 || keycode == 34 || keycode == 13;
            // Startseite, Begruessung und Sprachantwort: das Steuerkreuz gehoert dem Geraet. War das Display dunkel
            // (Menue noch im Hintergrund offen), weckt der erste Druck nur.
            if (!nav || id(cur_page) == 0 || id(cur_page) == 24 || id(cur_page) == 26 || id(key_was_dark)) return;
            id(cur_key) = keycode;
            id(dispatch_key)->execute();
            // Beim Halten wiederholen (ausser OK)
            if (keycode != 34) {
              id(held_key) = keycode;
              id(key_repeat)->execute();
            }

# --- Buttons ------------------------------------------------------------------
# PFLICHT, nicht optional: espidf_ble_keyboard ruft intern App.get_buttons()
# auf, und die Methode existiert nur, wenn ESPHome USE_BUTTON definiert - also
# nur, wenn die Konfiguration mindestens eine Button-Entity enthaelt. Fehlt der
# Block, bricht der Build mit
#   "class esphome::Application has no member named get_buttons"
# ab. Nicht loeschen.
button:
  - platform: restart
    name: "Neu starten"
    id: btn_restart
    icon: "mdi:restart"
  # Protokoll-Puffer ins Protokoll schreiben (s. esphomeremote-logpuffer.h)
  - platform: template
    name: "Protokoll-Puffer ausgeben"
    icon: "mdi:text-box-search-outline"
    entity_category: diagnostic
    on_press:
      - lambda: 'logpuffer::ausgeben();'
  # SD-Karte (Mikrofon ist gesperrt, solange sie eingebunden ist - geteilte Pins)
  - platform: template
    name: "SD: mounten"
    icon: "mdi:sd"
    entity_category: diagnostic
    on_press:
      - script.execute: sd_einbinden
  - platform: template
    name: "SD: auswerfen"
    icon: "mdi:sd"
    entity_category: diagnostic
    on_press:
      - script.execute: sd_auswerfen
  - platform: template
    name: "SD: auswerfen und neu starten"
    icon: "mdi:sd"
    entity_category: diagnostic
    on_press:
      - script.execute: sd_auswerfen_neustart

  # WLAN fuer 3 min erzwingen (Fernwartung/Flashen, auch im Modus "Nur Bluetooth")
  - platform: template
    name: "Wartungsfenster jetzt"
    icon: "mdi:wifi-refresh"
    entity_category: diagnostic
    on_press:
      - script.execute: wartungsfenster


binary_sensor:
  # Verbindung zu Home Assistant (ESPHome-Status). Hiess bis 2026-10-06 "WLAN verbunden" - mit dem Bluetooth-Tunnel
  # ist HA aber auch ohne WLAN verbunden, deshalb umbenannt (Entitaets-ID in HA bleibt).
  - platform: status
    name: "HA verbunden"
    id: ha_status
  # Echter WLAN-Zustand (2026-10-06)
  - platform: template
    name: "WLAN aktiv"
    icon: mdi:wifi
    lambda: 'return wifi::global_wifi_component->is_connected();'

  - platform: espidf_ble_keyboard
    keyboard_id: kb
    type: paired
    name: "Bluetooth verbunden"
    id: ble_paired
    on_state:
      - lambda: 'weck_log(x ? "BT verbunden" : "BT getrennt");'
      - lvgl.label.update:
          id: ble_state_lbl
          text: !lambda 'return x ? std::string("Verbunden") : std::string("Nicht verbunden");'
      # Verbindungszustand als Balken oben neben dem Akku.
      - script.execute: refresh_ble_bars
      - if:
          condition: {lambda: "return id(cur_page) == 10;"}
          then: [{script.execute: refresh_ble_slots}]
      # Konfigurator (Bluetooth-Fenster) live mitlaufen lassen, z. B. beim Koppeln
      - if:
          condition: {api.connected:}
          then: [{script.execute: bt_status_melden}]



  # Ladekabel: TP4056 ~CHRG (GPIO1, LOW = laedt). Solange er LOW ist, kein Tiefschlaf (der ext1-Wecker wuerde
  # sofort wieder wecken). Bei vollem Akku geht der Pin hochohmig - das Einstecken oeffnet deshalb ein Wartungsfenster.
  - platform: gpio
    id: charger_present
    name: "Ladekabel"
    device_class: battery_charging
    pin: {number: GPIO1, mode: {input: true, pullup: true}, inverted: true}
    filters:
      - delayed_off: 2s
      - delayed_on: 200ms
    on_press:
      # Nachladen bei vollem Akku (2026-10-28): der TP4056 beendet das Laden, die Zelle sinkt unter Last, er laedt
      # kurz nach - der Pin flackert dann alle paar Sekunden (Remote 2: ~2700x, Display 80 min an). Kommt das Kabel
      # binnen 2 min nach "weg" zurueck und ist der Akku >= 95 %, ist das kein Einstecken: nur das Symbol nachziehen.
      - lambda: |-
          id(kabel_ruhig) = id(kabel_weg_ms) != 0 && millis() - id(kabel_weg_ms) < 120000 &&
                            !std::isnan(id(akku_level).state) && id(akku_level).state >= 95.0f;
      - script.execute: apply_charge_icon
      - script.execute: refresh_laden
      - if:
          condition: {lambda: 'return !id(kabel_ruhig);'}
          then:
            - lambda: 'akkustat::laden_start();'   # Akku-Statistik: Entladung beginnt nach dem Laden neu
            - script.execute: wake_backlight
            # "Nur Bluetooth": kein Wartungsfenster beim Einstecken - Updates laufen durch den Bluetooth-Tunnel,
            # WLAN bleibt aus (2026-10-07, Nutzerwunsch). Notausgang: Knopf "Wartungsfenster jetzt" in HA.
            - if:
                condition: {lambda: 'return !wlan_zugriff::g_nur_ble;'}
                then: [{script.execute: wartungsfenster}]
            - script.execute: lade_popup
    # Icon jetzt direkt hier (apply_charge_icon), nicht mehr nur ueber den
    # Umweg refresh_laden -> CRATE-Register - das reagiert traege, s.
    # Kommentar bei apply_charge_icon weiter oben. Nutzerhinweis
    # 2026-09-19: "auch beim Ausstecken dauert es lange".
    on_release:
      # Akku-Statistik: "zuletzt geladen" = Ende des Ladens (Kabel ab oder Akku voll)
      - lambda: |-
          if (id(sntp_time).now().is_valid())
            akkustat::laden_ende(id(sntp_time).now().timestamp, id(akku_level).state);
          id(kabel_weg_ms) = millis() | 1;
      - script.execute: apply_charge_icon
      - script.execute: refresh_laden
      # beim Nachladen-Flackern (s. on_press) das Display nicht wecken
      - if:
          condition: {lambda: 'return !id(kabel_ruhig);'}
          then: [{script.execute: wake_backlight}]



sensor:
  # Laufende Aktivitaet (Index in der Konfiguration, -1 = keine) fuer die Aktivitaets-Schalter in HA (2026-10-16)
  - platform: template
    id: akt_sensor
    name: "Aktivität"
    icon: mdi:remote-tv
    accuracy_decimals: 0
    update_interval: never
  # Internes RAM (2026-10-04): knappes internes RAM legt WLAN, HA-Verbindung und BT-Kopplung lahm
  - platform: template
    id: ram_frei
    name: "RAM intern frei"
    unit_of_measurement: "KB"
    icon: mdi:memory
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never   # Debug-Modus: Intervall "diagnose_60s"
    lambda: 'return heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024.0f;'
  - platform: template
    id: ram_min
    name: "RAM intern minimum seit Start"
    unit_of_measurement: "KB"
    icon: mdi:memory
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: never   # Debug-Modus: Intervall "diagnose_60s"
    lambda: 'return heap_caps_get_minimum_free_size(MALLOC_CAP_INTERNAL) / 1024.0f;'
  - platform: template
    id: ram_block
    name: "RAM intern groesster Block"
    unit_of_measurement: "KB"
    icon: mdi:memory
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never   # Debug-Modus: Intervall "diagnose_60s"
    lambda: 'return heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024.0f;'
  # Position/Dauer der Wiedergabe (SmartTube, Netflix, Cast, Fernseher - alles, was
  # dem gewaehlten "Jetzt laeuft"-Player (Verknuepfung "jetzt") zusammenfasst). Die Attribute kommen nur, solange
  # eine Position bekannt ist; sonst bleibt die Anzeige aus.
  - platform: homeassistant
    id: mp_pos
    entity_id: sensor.esphomeremote_spiegel_${ha_name}_jetzt
    attribute: media_position
    internal: true
    on_value:
      - lambda: |-
          id(media_pos_s) = std::isnan(x) ? -1 : (int) x;
          id(media_pos_at) = millis();
      - script.execute: update_media_pos
  - platform: homeassistant
    id: mp_tempo
    entity_id: sensor.esphomeremote_spiegel_${ha_name}_jetzt
    attribute: tempo
    internal: true
    on_value:
      - lambda: 'id(media_tempo) = (std::isnan(x) || x <= 0) ? 1.0f : x;'
  - platform: homeassistant
    id: mp_dur
    entity_id: sensor.esphomeremote_spiegel_${ha_name}_jetzt
    attribute: media_duration
    internal: true
    on_value:
      - lambda: 'id(media_dur_s) = std::isnan(x) ? 0 : (int) x;'
      - script.execute: update_media_pos

  # Empfangsstaerke der BLE-Verbindung. Speist die Balkenanzeige oben rechts;
  # taucht in Home Assistant nicht auf (internal).
  - platform: espidf_ble_keyboard
    keyboard_id: kb
    type: rssi
    id: ble_rssi
    internal: true
    update_interval: 3s
    on_value:
      - script.execute: refresh_ble_bars

  # WLAN-Staerke fuer die zweite Balkenanzeige oben.
  - platform: wifi_signal
    id: wifi_rssi
    internal: true
    update_interval: 10s
    on_value:
      - script.execute: refresh_wifi_bars

  - platform: uptime
    id: laufzeit
    name: "Laufzeit"
    entity_category: diagnostic
    update_interval: never   # Debug-Modus
  - platform: template
    id: entladerate
    name: "Akku Rate"
    unit_of_measurement: "%/h"
    accuracy_decimals: 2
    state_class: measurement
    force_update: true
    update_interval: never

  - platform: max17048
    id: akku
    address: 0x36
    # War 60s. refresh_laden (Ladeanzeige oben) haengt an diesem Update, s.
    # on_value unten - das Stecker-Ein/Aus-Signal (charger_present) fuellt
    # die Luecke inzwischen zwar mit einer sofortigen Extra-Messung (s.
    # on_press/on_release dort), aber 60s war als Ruecksicherungs-Fall immer
    # noch spuerbar traege. 20s ist ein guter Mittelweg (noch immer ein
    # niedrigfrequenter I2C-Read, kein spuerbarer Mehrverbrauch).
    update_interval: 20s
    voltage:
      id: akku_spannung
      name: "Akkuspannung"
      # Tiefentladeschutz (2026-10-01), s. esphomeremote-pm.h
      on_value:
        - lambda: |-
            static uint8_t tief = 0;
            if (x > 1.0f && x < AKKU_LEER_V && !id(charger_present).state && !id(laedt)) tief++;
            else tief = 0;
            if (tief < 2) return;
            ESP_LOGW("akku", "Akku leer (%.2f V) - Tiefentladeschutz, schlafe bis Ladekabel/Taste", x);
            g_akku_leer = AKKU_LEER_MAGIC;
            global_preferences->sync();
            delay(200);
            aus_wieder_schlafen();
    battery_level:
      id: akku_level
      name: "Akkustand"
      on_value:
        - lvgl.label.update:
            id: lbl_batt
            text: !lambda |-
              char b[8];
              snprintf(b, sizeof(b), "%d%%", akku_anzeige_pct(x, id(akku_voll)));
              return std::string(b);
        - lambda: 'id(akku_pct) = (int) x;'
        - script.execute: apply_low_bat
        - script.execute: refresh_laden
        # Ohne diesen Aufruf meldet die Fernbedienung dem Fernseher dauerhaft
        # 100 %, weil der Wert in der Komponente fest angelegt und nie
        # aktualisiert wurde.
        - lambda: 'id(kb).set_battery_level((uint8_t) x);'
        # Akku-Statistik: Messpunkt (alle 5 min, nicht beim Laden), Seite aktualisieren
        - lambda: |-
            if (!id(charger_present).state && id(sntp_time).now().is_valid())
              akkustat::probe(id(sntp_time).now().timestamp, x);
        - if:
            condition: {lambda: "return id(cur_page) == 43;"}
            then: [{script.execute: akku_anzeige}]



text_sensor:
  # Tasten-Konfigurator: welcher Stand ist geladen (Hash, "... aus" oder "eingebaut")
  - platform: template
    id: tk_status
    name: "Tasten-Konfiguration"
    icon: mdi:remote
    entity_category: diagnostic
    update_interval: never
  # Fortschritt/Ergebnis der letzten Uebertragung (Panel "Fernbedienung" zeigt ihn als Balken)
  - platform: template
    id: tk_transfer
    name: "Tasten-Konfiguration Übertragung"
    icon: mdi:progress-upload
    entity_category: diagnostic
    update_interval: never
  # Von HA angekuendigter Stand -> bei Abweichung neu holen
  - platform: homeassistant
    id: tk_hash_ha
    entity_id: sensor.esphomeremote_konfig_${ha_name}
    internal: true
    on_value:
      - lambda: 'id(tk_cfg).angekuendigt(x);'
  # Adresse von Home Assistant (Attribut "basis", 2026-10-19): Bilder und Konfiguration kommen von dort
  - platform: homeassistant
    id: ha_basis
    entity_id: sensor.esphomeremote_konfig_${ha_name}
    attribute: basis
    internal: true
    on_value:
      - lambda: |-
          if (x.empty() || ${ha_ueber_tunnel} || x == id(tk_cfg).host()) return;
          ESP_LOGI("konfig", "HA-Adresse: %s (vorher %s)", x.c_str(), id(tk_cfg).host().c_str());
          id(tk_cfg).set_host(x);

  # SD-Test-Ausgaben
  - platform: template
    id: sd_status
    name: "SD Status"
    entity_category: diagnostic
    update_interval: never
  # Welche App laeuft und welches Bild der "Jetzt laeuft"-Player hat (Ausloeser fuer die Logos von der SD-Karte)
  - platform: homeassistant
    id: mp_app_name
    entity_id: sensor.esphomeremote_spiegel_${ha_name}_jetzt
    attribute: app_name
    internal: true
    on_value:
      - script.execute: sd_logo_pruefen
  - platform: homeassistant
    id: mp_cover_url
    entity_id: sensor.esphomeremote_spiegel_${ha_name}_jetzt
    attribute: entity_picture
    internal: true
    on_value:
      - script.execute: sd_logo_pruefen
  # Beantwortet die Frage "verbunden - womit?" in einem Blick.
  - platform: template
    name: "Verbunden mit"
    id: ble_host_txt
    icon: "mdi:remote-tv"
    update_interval: never   # Debug-Modus (vorher alle 10 s an HA)
    lambda: |-
      if (!id(ble_paired).state) return std::string("nicht verbunden");
      {
        const std::string n = id(tk_cfg).slot_name((int) id(kb).active_host_slot());
        if (!n.empty()) return n;
      }
      return std::string("Platz ") + std::to_string(id(kb).active_host_slot() + 1);

  # ---- "Jetzt laeuft": eine HA-Entitaet fasst Streamer, Multiroom, Chromecast und Fernseher zusammen
  # (Konfigurator > Wiedergabe, esphomeremote_konfig/jetzt.py). Welche, waehlt die Verknuepfung "jetzt"; gelesen ueber den
  # Spiegel sensor.esphomeremote_spiegel_<remote>_jetzt.
  - platform: homeassistant
    id: mp_state
    entity_id: sensor.esphomeremote_spiegel_${ha_name}_jetzt
    internal: true
    on_value:
      - script.execute: update_media_state
      - script.execute: update_media_pos

  - platform: homeassistant
    id: mp_title
    entity_id: sensor.esphomeremote_spiegel_${ha_name}_jetzt
    attribute: media_title
    internal: true
    on_value:
      # Leer: kurzer, gedaempfter Text - "Nichts ausgewählt" war fuer die
      # Titelzeile neben dem Zurueck-Button zu lang und wurde abgeschnitten.
      - lvgl.label.update:
          id: media_title
          text: !lambda 'return x.empty()?std::string("Nichts läuft"):x;'
          text_color: !lambda 'return lv_color_hex(x.empty() ? 0x8B94A3 : 0xF1F3F5);'
      - lvgl.label.update: {id: home_player_lbl,   text: !lambda 'return x.empty()?std::string("Player"):x;'}
      - script.execute: media_layout

  - platform: homeassistant
    id: mp_artist
    entity_id: sensor.esphomeremote_spiegel_${ha_name}_jetzt
    attribute: media_artist
    internal: true
    on_value:
      - lvgl.label.update: {id: media_artist, text: !lambda 'return x.empty() ? std::string("Media Player") : x;'}
      - lvgl.label.update: {id: home_player_artist, text: !lambda "return x;"}
      - script.execute: media_layout

  # Welche Quelle der "Jetzt läuft"-Player gerade zeigt (2026-10-12). Bei "multiroom" gehen
  # die Knoepfe der Media-Player-Seite an Music Assistant statt per Bluetooth an den Streamer.
  - platform: homeassistant
    id: mp_quelle
    entity_id: sensor.esphomeremote_spiegel_${ha_name}_jetzt
    attribute: quelle
    internal: true
  - platform: homeassistant
    id: mp_app
    entity_id: sensor.esphomeremote_spiegel_${ha_name}_jetzt
    attribute: app_name
    internal: true
    on_value:
      - lvgl.label.update:
          id: media_artist
          text: !lambda 'std::string v = id(mp_artist).state.empty() ? x : id(mp_artist).state; return v.empty() ? std::string("Media Player") : v;'
      - script.execute: media_layout

  # Roher SmartTube-Titel: wird er leer, das Cover der Media-Seite ausblenden (Nachladen: Dienst refresh_cover).
  - platform: homeassistant
    id: adb_title
    entity_id: sensor.esphomeremote_spiegel_${ha_name}_jetzt
    attribute: media_title
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return x.empty();'
          then:
            - lvgl.widget.hide: media_cover






  # ---- Countdown "Timer Wohnung" neben der Uhr (Nutzerwunsch 2026-09-17) -----
  # Nur das Icon hier ein-/ausblenden - der eigentliche Countdown-Text laeuft
  # im interval: 1s oben (zeigt dort statt der Uhrzeit), damit er wirklich
  # sekundengenau tickt statt nur bei HA-Updates zu springen.
  - platform: homeassistant
    id: timer_wohnung_state
    entity_id: sensor.esphomeremote_spiegel_${ha_name}_timer
    internal: true
    on_value:
      - lambda: |-
          id(timer_wohnung_active) = (x == "active");
          if (id(timer_wohnung_active)) {
            lv_obj_clear_flag(id(timer_wohnung_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(timer_wohnung_lbl),  LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(timer_wohnung_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(timer_wohnung_lbl),  LV_OBJ_FLAG_HIDDEN);
          }

  # Liefert nur "H:MM:SS" bei Start/Pause/Ende (kein Sekundentakt von HA aus) -
  # setzt hier lediglich die lokale Sekundenbasis, die das interval: 1s dann
  # selbst runterzaehlt.
  - platform: homeassistant
    id: timer_wohnung_remaining_attr
    entity_id: sensor.esphomeremote_spiegel_${ha_name}_timer
    attribute: remaining
    internal: true
    on_value:
      - lambda: |-
          int h = 0, m = 0, s = 0;
          if (sscanf(x.c_str(), "%d:%d:%d", &h, &m, &s) == 3)
            id(timer_wohnung_remaining) = h * 3600 + m * 60 + s;

  # Endzeitpunkt des Timers, z. B. "2026-09-20T01:15:30+00:00" (HA liefert UTC).
  # Daraus rechnet das interval: 1s die Restzeit - stimmt damit auch nach einem
  # Neustart der Remote.
  - platform: homeassistant
    id: timer_wohnung_end_attr
    entity_id: sensor.esphomeremote_spiegel_${ha_name}_timer
    attribute: finishes_at
    internal: true
    on_value:
      - lambda: |-
          id(timer_wohnung_end) = 0;
          int Y, M, D, h, mi, se;
          if (sscanf(x.c_str(), "%d-%d-%dT%d:%d:%d", &Y, &M, &D, &h, &mi, &se) != 6) return;
          // Tage seit 1970-01-01 (Zivilkalender, ohne timegm)
          int y = Y - (M <= 2);
          const int era = (y >= 0 ? y : y - 399) / 400;
          const unsigned yoe = (unsigned) (y - era * 400);
          const unsigned doy = (153 * (M + (M > 2 ? -3 : 9)) + 2) / 5 + D - 1;
          const unsigned doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
          long tage = (long) era * 146097 + (long) doe - 719468;
          long t = tage * 86400L + h * 3600L + mi * 60L + se;
          // Zeitzonen-Versatz am Ende (+HH:MM / -HH:MM), "Z" oder nichts = UTC.
          const size_t tp = x.find('T');
          const size_t op = (tp == std::string::npos) ? std::string::npos : x.find_first_of("+-", tp);
          if (op != std::string::npos) {
            int oh = 0, om = 0;
            if (sscanf(x.c_str() + op + 1, "%d:%d", &oh, &om) >= 1)
              t -= (x[op] == '-' ? -1L : 1L) * (oh * 3600L + om * 60L);
          }
          if (t > 0) id(timer_wohnung_end) = (uint32_t) t;


  - platform: homeassistant
    id: tv_state
    entity_id: sensor.esphomeremote_spiegel_${ha_name}_tv
    internal: true
    on_value:
      - lambda: |-
          // Alles ausser aus/Bereitschaft/unbekannt heisst: der Fernseher laeuft.
          id(tv_on) = !(x == "off" || x == "standby" || x == "unavailable" || x == "unknown" || x.empty());
      - script.execute: tv_knopf_pruefen
      - lambda: |-
          id(update_media_state)->execute();
          id(media_layout)->execute();
          // Der Knopf kommt und geht - steht man gerade auf der
          // Media-Player-Seite, muss das Fokus-Raster neu aufgebaut werden,
          // sonst zeigt die Markierung ins Leere.
          if (id(cur_page) == 6) id(focus_apply)->execute();

  - platform: template
    id: weck_text
    name: "Weckprotokoll"
    icon: "mdi:alarm-check"
    entity_category: diagnostic
  # Diagnose (2026-10-19): warum die Remote gerade (noch) nicht im Tiefschlaf ist - "wartet ..." oder der Grund
  # (Fernseher an, laedt, Sprachabfrage ...). Nur bei Aenderung gesendet (schlaf_status_melden), landet im Recorder.
  - platform: template
    id: schlaf_status_txt
    name: "Tiefschlaf-Status"
    icon: "mdi:sleep"
    entity_category: diagnostic
    update_interval: never
  # Diagnose (2026-09-29): Grund des letzten Neustarts - belegt Abstuerze eindeutig.
  - platform: template
    id: letzter_neustart
    name: "Letzter Neustart"
    icon: "mdi:restart-alert"
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      switch (esp_reset_reason()) {
        case ESP_RST_POWERON:   return std::string("Einschalten");
        case ESP_RST_SW:        return std::string("Neustart (Software/OTA)");
        case ESP_RST_PANIC:     return std::string("ABSTURZ (Panic)");
        case ESP_RST_INT_WDT:   return std::string("ABSTURZ (Interrupt-Watchdog)");
        case ESP_RST_TASK_WDT:  return std::string("ABSTURZ (Task-Watchdog)");
        case ESP_RST_WDT:       return std::string("ABSTURZ (Watchdog)");
        case ESP_RST_DEEPSLEEP: return std::string("Aufwachen aus Tiefschlaf");
        case ESP_RST_BROWNOUT:  return std::string("Spannungseinbruch");
        default:                return std::string("anderer Grund");
      }



# =============================================================================
lvgl:
  setup_priority: 243   # nach dem WLAN-Start, s. display:
  displays: [main_display]
  touchscreens: [main_touch]
  default_font: a15
  # Fuer ALLE Buttons gleich (vorher an ~210 Buttons einzeln notiert): gedrueckt =
  # blau, Fokus (D-Pad) = blauer Rahmen. ESPHome erzeugt daraus sonst pro Button
  # mehrere Aufrufe in setup(); zusammen mit der Groesse des Seitenbaums scheiterte
  # der Linker (l32r, 256 KB Reichweite: "literal target out of range").
  # Einzelne Buttons koennen es weiter selbst ueberschreiben.
  # NICHT loeschen: ohne diesen Block leuchtet kein Button beim Antippen/Markieren.
  theme:
    button:
      # Kein Schatten (2026-10-01): LVGLs Standard-Theme gibt im hellen Modus JEDEM Button einen weichen
      # Schatten (lv_theme_default.c, shadow_width LV_DPX(3), offset_y). Auf dem dunklen Hintergrund
      # unsichtbar, kostete aber bei jedem Bild Software-Rendering je Button (Schatten-Cache ist aus).
      shadow_width: 0
      shadow_opa: TRANSP
      pressed: {bg_color: 0x2563EB, border_color: 0x60A5FA, outline_width: 0}
      focused: {border_color: 0x3B82F6}
      # Kein "scrolled:" noetig: das Standard-Theme faerbt im Zustand SCROLLED nur die Scrollleiste.
  buffer_size: 25%
  bg_color: 0x0E1116
  text_color: 0xF1F3F5
  border_color: 0x2E3643

  style_definitions:
    - id: st_screen
      bg_color: 0x0E1116
      bg_opa: COVER
      pad_all: 12
      pad_top: 10
      pad_row: 9
      border_width: 0
      text_color: 0xF1F3F5
    - id: st_title
      text_font: a18
      text_color: 0xF1F3F5
      pad_bottom: 4
    - id: st_tile
      bg_color: 0x1A1F27
      bg_opa: COVER
      radius: 14
      border_width: 2
      border_color: 0x1A1F27
      pad_all: 12
      width: 100%
      height: 44
      text_color: 0xF1F3F5
      text_font: a15
    # Zwei Zeilenformate, an die sich alles haelt:
    #   st_tile / st_ctrlbtn = einzeilig, 44 px
    #   st_tile2             = zweizeilig (Name + Zustand darunter), 60 px
    - id: st_tile2
      bg_color: 0x1A1F27
      bg_opa: COVER
      radius: 14
      border_width: 2
      border_color: 0x1A1F27
      pad_all: 10
      width: 100%
      height: 60
      text_color: 0xF1F3F5
    - id: st_ctrlbtn
      bg_color: 0x232A35
      bg_opa: COVER
      radius: 11
      border_width: 2
      border_color: 0x232A35
      pad_all: 8
      text_color: 0xF1F3F5
      text_font: a13
    # Zurueck-Knopf blau wie das aktive Dock-Segment, sitzt im blauen Feld der Kopflinie (tasten::kopf_linie,
    # 2026-10-13). Fokus (D-Pad): weisser Rahmen rundum, damit er vor Feld und Linie steht.
    - id: st_back
      bg_color: 0x3B82F6
      bg_opa: COVER
      radius: 10   # wie die Menuekarten (2026-10-12, vorher 20 = Pille)
      border_width: 2
      border_color: 0x3B82F6
      pad_all: 8
      text_color: 0xF1F3F5
      text_font: a13
    - id: st_muted
      text_color: 0x8B94A3
      text_font: a13
      bg_opa: TRANSP
      border_width: 0
    # ---- Flex-Layouts als gemeinsame Styles (Stand 2026-09-28) ----------------------------
    # Ein "layout: {type: flex, ...}" am Widget erzeugt in setup() 6 Aufrufe PRO Widget (bei
    # 215 Widgets ~25 KB - setup() stand kurz vor der l32r-Linkergrenze). ESPHome erlaubt
    # layout/flex_* nicht in style_definitions, LVGL aber schon: on_boot Prioritaet 450 (frueher Script laufzeit_styles)
    # setzt Layout, Richtung und Ausrichtung beim Start einmal AN DIESEN STYLES - jedes
    # Widget braucht so nur noch einen add_style-Aufruf. Aussehen identisch zu vorher.
    # Neues Widget mit so einer Zeile: statt "layout: ..." den passenden Style anhaengen,
    # und flex_grow: 1 bei Kindern durch "styles: [st_grow]" ersetzen.
    #   st_fx_r10 = row,    cross center,          pad_column 10  (Bedienzeilen/Buttons)
    #   st_fx_r8  = row,    cross center,          pad_column 8   (Kopfzeilen)
    #   st_fx_c10 = column, cross start,           pad_row 10     (Seiten)
    #   st_fx_sb8 = row,    space_between, center, pad_column 8
    #   st_fx_sb  = row,    space_between, center
    #   st_grow   = flex_grow 1
    - id: st_fx_r10
      pad_column: 10
    - id: st_fx_r8
      pad_column: 8
    - id: st_fx_c10
      pad_row: 10
    - id: st_fx_sb8
      pad_column: 8
    - id: st_fx_sb
      pad_column: 0
    - id: st_grow
      pad_column: 0

  # ==========================================================================================
  # ==========================================================================================
  # CHECKLISTE NEUES BEDIENELEMENT auf einer eingebauten Seite:
  #  1. focus_apply: Widget in die row(...)-Liste des "case <cur_page>:" eintragen (Reihenfolge = Navigation,
  #     bis zu drei nebeneinander in einer Zeile) - sonst ist es per D-Pad nicht erreichbar.
  #  2. Neuer Regler: in fix_slider_geometry eintragen (sonst LVGL-Standardgroesse und -farben).
  #  3. on_load der Seite: "id(cur_page) = <Nummer>; id(frow) = 0; id(fcol) = 0;" + focus_apply.
  #  4. Hinweistext (h_*): Text in apply_hints setzen, sonst bleibt das Feld leer.
  #  5. Einstellungsseiten: danach tools/einst_parse.py + einst_gen.py laufen lassen (Konfigurator-Eintraege).
  # ==========================================================================================
  pages:
    # ================================================ 0: HOME
    - id: page_home
      styles: [st_screen]
      scrollbar_mode: "off"
      scrollable: false
      on_load:
        # Fokus-Erinnerung hier nicht loeschen (Merkfenster); fmem_last_page = -1, damit beim naechsten Betreten jeder
        # Seite die gemerkte Position eingelesen wird.
        - lambda: |-
            id(fmem_last_page) = -1;
            id(cur_page) = 0; id(frow) = 0; id(fcol) = 0;
            id(cover_sichtbar).execute();   // vorgemerktes Cover dieser Seite (2026-10-20)
        - script.execute: fix_slider_geometry
        - script.execute: apply_home_layout
        - script.execute: focus_apply
        - lambda: 'tasten::dock_anim(400);'   # Dock baut sich auf (2026-10-13); 400 ms spaeter, sonst vorbei, bevor man hinsieht
      widgets:
        - obj:
            id: home_status_bar
            align: TOP_MID
            y: 0
            width: 228
            height: 24
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            # Kein gemeinsames Flex-Layout mehr: linke Gruppe (Uhr + Timer) klebt
            # links, rechte Gruppe (Symbole/Akku) rechts - jede so breit wie ihr
            # Inhalt. Ohne festes 116-px-Fenster wird der Timer nicht mehr rechts
            # abgeschnitten (bei 1:00:00 fehlte die letzte Ziffer), und blendet man
            # die Uhr aus, rutscht der Timer nach links.
            widgets:
              - obj:
                  id: home_clock_group
                  align: LEFT_MID
                  width: SIZE_CONTENT
                  height: 22
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 3}
                  widgets:
                    # Uhr UND Sanduhr+Countdown nebeneinander (Nutzerwunsch
                    # 2026-09-17: "neben der Uhr, nicht statt der Uhr") -
                    # Icon+Label nur sichtbar, waehrend der gewaehlte Timer (Verknuepfung "timer")
                    # laeuft. home_status_btn daneben ist dafuer von 132 auf
                    # 108 geschrumpft (passt dort weiterhin locker).
                    - label: {id: idle_clock, text: "--:--", styles: [st_muted], text_font: a15}
                    - label: {id: timer_wohnung_icon, text: "\U000F051F", text_font: ico_timer, text_color: 0x3B82F6, hidden: true}
                    - label: {id: timer_wohnung_lbl, text: "0:00", text_font: a15, text_color: 0x3B82F6, hidden: true}
              # Nur noch Anzeige. Antippen laeuft ueber die unsichtbare
              # Tippflaeche home_bri_hit (letztes Widget dieser Seite = ganz
              # oben) - vorher schluckten die Symbole/Balken darin (einfache
              # obj = klickbar) so manchen Tipp, das Oeffnen war unzuverlaessig.
              - obj:
                  id: home_status_btn
                  align: RIGHT_MID
                  width: SIZE_CONTENT
                  height: 22
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  shadow_width: 0
                  scrollable: false
                  clickable: false
                  layout: {type: flex, flex_flow: row, flex_align_main: end, flex_align_cross: center, pad_column: 3}
                  widgets:
                    # Diese Reihe ist rechtsbuendig gepackt (flex_align_main: end) - dabei
                    # kehrt sich die Lesereihenfolge um: das ERSTE Widget hier landet ganz
                    # RECHTS, das letzte ganz links. Damit das Bewegungs-Icon NACH (rechts von)
                    # dem Assistenten-Symbol erscheint, muss es VOR den beiden Assistenten-
                    # Icons in der Liste stehen (Nutzerkorrektur 2026-09-22).
                    - label: {id: motion_icon, text: "\U000F1370", text_font: ico_motion, text_color: 0x3B82F6, hidden: true}
                    # Durchgestrichenes Mikrofon: sichtbar, solange kein Ton aufgenommen werden
                    # kann - egal ob durch den Datenschutz-Schalter "Mikrofon" oder weil die
                    # SD-Karte gerade eingebunden ist (teilt sich Pins mit dem Mikrofon). Zwischen
                    # Bewegungs- und Assistenten-Symbol (Nutzerwunsch 2026-09-24); gleiche
                    # Reihenfolge-Logik wie beim Bewegungs-Icon oben: steht VOR den Assistenten-
                    # Icons, damit es zwischen ihnen und dem Bewegungs-Icon landet.
                    - label: {id: mic_off_icon, text: "\U000F036D", text_font: ico_mic_off, text_color: 0x3B82F6, hidden: true}
                    # Zeigt, welcher Sprachassistent gerade gewaehlt ist -
                    # nur eines von beiden sichtbar (s. apply_show/
                    # apply_assistant), komplett ausblendbar ueber die
                    # "Anzeige"-Einstellungen (Nutzerwunsch 2026-09-18).
                    # Ein Symbol fuer beide (2026-10-07, Nutzerwunsch): Mikrofon mit Sprechblase, blau = Google (ueber
                    # Bluetooth), gruen = Home Assistant
                    - label: {id: assi_icon_google, text: "\U000F050A", text_font: ico_home_assistant, text_color: 0x3B82F6, hidden: true}
                    - label: {id: assi_icon_ha,     text: "\U000F050A", text_font: ico_home_assistant, text_color: 0x22C55E, hidden: true}
                    # Drei gezeichnete Balken statt eines Textzeichens - das
                    # sass in dieser Schrift schief und zeigte nur an/aus.
                    # Jetzt: Hoehe fest, Farbe nach Empfangsstaerke.
                    - obj:
                        id: ble_bars
                        width: 15
                        height: 16
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        widgets:
                          # Alle drei am UNTEREN Rand ausgerichtet, damit sie
                          # als Treppe stehen. Mit freien y-Werten sassen sie
                          # versetzt und sahen aus wie ein Hufeisen.
                          - obj: {id: ble_bar0, align: BOTTOM_LEFT, x: 0,  y: 0, width: 3, height: 6,  radius: 1, bg_color: 0x2A3340, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false}
                          - obj: {id: ble_bar1, align: BOTTOM_LEFT, x: 5,  y: 0, width: 3, height: 11,  radius: 1, bg_color: 0x2A3340, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false}
                          - obj: {id: ble_bar2, align: BOTTOM_LEFT, x: 10, y: 0, width: 3, height: 15, radius: 1, bg_color: 0x2A3340, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false}
                    - obj:
                        id: wifi_bars
                        width: 15
                        height: 16
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        widgets:
                          - obj: {id: wifi_bar0, align: BOTTOM_LEFT, x: 0,  y: 0, width: 3, height: 6,  radius: 1, bg_color: 0x2A3340, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false}
                          - obj: {id: wifi_bar1, align: BOTTOM_LEFT, x: 5,  y: 0, width: 3, height: 11,  radius: 1, bg_color: 0x2A3340, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false}
                          - obj: {id: wifi_bar2, align: BOTTOM_LEFT, x: 10, y: 0, width: 3, height: 15, radius: 1, bg_color: 0x2A3340, bg_opa: COVER, border_width: 0, pad_all: 0, scrollable: false}
                    # Verbindung zu Home Assistant, HINTER beiden Balken (2026-10-07). Seit 2026-10-10 immer sichtbar
                    # (abschaltbar: Anzeige > Home-Assistant-Symbol): gruen = ueber WLAN, blau = ueber Bluetooth,
                    # grau = nicht verbunden - s. refresh_wifi_bars.
                    - label: {id: ha_ble_dot, text: "\U000F07D0", text_font: ico_ha_verbindung, text_color: 0x6B7280, hidden: true}
                    # Dock-Symbol (2026-10-20): nur sichtbar, solange HA-Befehle ueber das Dock gehen (Einstellung "HA-Befehle
                    # ueber das Dock") und die eigene HA-Verbindung noch nicht steht: blau = Dock hat bestaetigt (Funk wie
                    # Bluetooth), grau = wird gerade geprueft, rot = kein Dock erreicht - s. refresh_wifi_bars.
                    - label: {id: dock_weg_ico, text: "\U000F011F", text_font: ico_ha_verbindung, text_color: 0x6B7280, hidden: true}
                    # Ladesymbol (Blitz) - nur sichtbar waehrend geladen wird.
                    - label:
                        id: lbl_batt_chg
                        text: "\U000F0241"
                        text_font: ico_charge
                        text_color: 0x22C55E
                        hidden: true
                    - label: {id: lbl_batt, text: "-%", styles: [st_muted], text_font: a15}
        - button:
            id: menu_home_btn
            align: BOTTOM_MID
            x: -54
            y: -46
            width: 104
            height: 44
            bg_color: 0x1A1F27
            radius: 12
            border_width: 2
            border_color: 0x1A1F27
            on_click:   # Ziel einstellbar im Konfigurator (Startseite > Menue-Knopf), Standard: das Menue
              - lambda: 'tasten::home_knopf("menu");'
            widgets: [{label: {align: CENTER, text: "Menü", text_font: a15}}]
        - button:
            id: app_home_btn
            align: BOTTOM_MID
            x: 54
            y: -46
            width: 104
            height: 44
            # Gleicher Hintergrund wie MENUE - vorher 0x232A35 gegen 0x1A1F27.
            bg_color: 0x1A1F27
            radius: 12
            border_width: 2
            border_color: 0x1A1F27
            # Apps-Seite des Konfigurator-Menues als Pop-up (X fuehrt zurueck auf die Startseite).
            # Die eingebaute Apps-Seite gibt es seit 2026-10-06 nicht mehr.
            on_click:
              - lambda: 'tasten::home_knopf("apps");'   # Ziel einstellbar (Startseite > Apps-Knopf)
            widgets: [{label: {align: CENTER, text: "Apps", text_font: a15}}]
        # Wiedergabe-Karte: oeffnet die Media-Seite. Cover (216x172) kommt aus HA schon in Kartengroesse - das Bild ist
        # nie groesser als die Karte und kann weder darueber ragen noch deren Touch schlucken.
        - button:
            id: home_player_btn
            align: TOP_MID
            y: 144
            width: 216
            height: 56
            radius: 12
            border_width: 2
            border_color: 0x1A1F27
            bg_color: 0x1A1F27
            clip_corner: true
            # Ohne das erbt der Knopf den Innenabstand des LVGL-Standardthemas.
            # Das Cover ist exakt so gross wie die Karte und sass dadurch
            # verschoben in der eingerueckten Inhaltsflaeche - rechts und unten
            # abgeschnitten. Den verbleibenden Versatz durch den 2px-Rahmen
            # gleicht home_cover_img mit x/y: -2 aus.
            pad_all: 0
            on_click:
              - lambda: 'id(media_from) = 0; id(media_home_ms) = 0;'
              - lvgl.page.show: {id: page_media, animation: MOVE_LEFT, time: 150ms}
            widgets:
              # Reihenfolge ist Zeichenreihenfolge (LVGL): Cover ganz unten,
              # dann Scrim, dann Text, dann der schwebende Kameras-Button
              # obenauf.
              # x/y: -2 hebt den 2px-Rahmen auf, damit das 216x160-Bild genau
              # auf der 216x160-Karte liegt (s. pad_all-Kommentar oben).
              - image: {id: home_cover_img, src: home_cover_image, x: -2, y: -2, width: 216, height: 172, hidden: true}
              - obj:
                  id: home_card_scrim
                  align: BOTTOM_MID
                  # y: 2 / height: 58 = bis in den 2-px-Rahmen der Karte hinein.
                  # Das Cover liegt auch ueber dem Rahmen; das Banner endete am
                  # Innenrand, darunter blitzte ein Streifen Cover hervor.
                  y: 2
                  width: 216
                  height: 58
                  radius: 0
                  bg_color: 0x000000
                  bg_opa: 55%
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  hidden: true
              # long_mode DOT kuerzt nur bei FESTER Hoehe (s. tile_wz_media_sub
              # oben) - ohne die brach ein langer Titel auf 3 Zeilen um und
              # sprengte den Button nach unten in Apps rein. Position wird von
              # apply_home_layout je nach Zustand (kompakt/ausgeklappt) neu
              # gesetzt.
              - label: {id: home_player_lbl, align: CENTER, text: "Player", text_font: a15, text_color: 0xF1F3F5, width: 190, height: 20, long_mode: DOT}
              - label: {id: home_player_artist, align: BOTTOM_MID, y: -10, text: " ", styles: [st_muted], width: 190, height: 18, long_mode: DOT, hidden: true}
              # Kleiner Fortschrittsbalken ganz unten, unter dem Interpreten (Nutzerwunsch
              # 2026-09-22) - nur der Balken, keine Zeit-Zahlen (die stehen auf der grossen
              # Media-Seite). Sichtbarkeit/Wert kommen aus update_media_pos.
              - bar: {id: home_media_bar, align: BOTTOM_MID, y: -3, width: 190, height: 4, min_value: 0, max_value: 1000, value: 0, radius: 2, bg_color: 0x4B5563, border_width: 0, indicator: {bg_color: 0xEF4444, radius: 2}, hidden: true}
        # Eigene Startseite der Aktivitaet (2026-10-27, mn_home): Menueseite zwischen Statusleiste und Aktivitaetsleiste,
        # Lage/Groesse setzt tasten::startseite_anwenden
        - obj:
            id: home_eigen
            x: 0
            y: 26
            width: 240
            height: 244
            align: TOP_LEFT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: true
            scrollbar_mode: "off"
            hidden: true
        # Aktivitaetsleiste (Dock): durchgehende schwarze Leiste ueber die ganze Breite, buendig mit dem unteren
        # Rand (270..320), oben eine blaue Linie. Die Knoepfe (Aktivitaeten aus dem Konfigurator) legt
        # tasten::dock_anwenden an - Segmente ohne Rundung, durch 2 px getrennt, das aktive blau.
        - obj:
            id: home_dock
            align: BOTTOM_MID
            y: 12
            width: 240
            height: 50
            radius: 0
            bg_color: 0x000000
            bg_opa: COVER
            border_width: 3
            border_side: TOP
            border_color: 0x3B82F6
            pad_all: 0
            scrollable: false
        # Unsichtbare Tippflaeche ueber der RECHTEN Haelfte der Statusleiste
        # (Displayrand bis Displayrand, oben 0..36 px): oeffnet den
        # Helligkeitsregler. Als LETZTES Widget liegt sie ueber allem - die
        # Symbole darunter (WLAN, Bluetooth, Akku ...) koennen keinen Tipp mehr
        # abfangen. Endet vor der Wiedergabe-Karte (ab ca. 38 px).
        - obj:
            id: home_bri_hit
            align: TOP_RIGHT
            x: 12
            y: -10
            width: 120
            height: 36
            bg_opa: TRANSP
            border_width: 0
            outline_width: 0
            shadow_width: 0
            pad_all: 0
            scrollable: false
            on_click: [{script.execute: toggle_bri_overlay}]
        # Linke Haelfte: Tastenlicht (s. oben).
        - obj:
            id: home_kbd_hit
            align: TOP_LEFT
            x: -12
            y: -10
            width: 120
            height: 36
            bg_opa: TRANSP
            border_width: 0
            outline_width: 0
            shadow_width: 0
            pad_all: 0
            scrollable: false
            on_click: [{script.execute: toggle_kbd_overlay}]
        # ---- Schnellmenue (s. Skript toggle_bri_overlay) ----
        # Schleier ueber der ganzen Seite: dunkelt ab und faengt Tipps ab, die
        # sonst Knoepfe der Startseite ausloesen wuerden. Tipp = schliessen.
        - obj:
            id: qs_scrim
            hidden: true
            align: CENTER
            # groesser als das Display: die Startseite hat oben/unten verschiedene Innenabstaende, mit genau
            # 240x320 blieb unten ein Streifen frei (2026-10-07). Der Rest wird vom Bildschirmrand abgeschnitten.
            width: 264
            height: 348
            bg_color: 0x000000
            bg_opa: 60%
            radius: 0
            border_width: 0
            pad_all: 0
            scrollable: false
            on_click: [{script.stop: hide_bri_overlay}, {script.execute: close_bri_overlay}]
        - obj:
            id: qs_panel
            hidden: true
            align: TOP_MID
            y: 24
            width: 228
            height: SIZE_CONTENT
            bg_color: 0x111418
            bg_opa: COVER
            radius: 14
            border_width: 2
            border_color: 0x3A424E
            pad_all: 8
            scrollable: false
            styles: [st_fx_c10]
            widgets:
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  styles: [st_fx_sb8]
                  widgets:
                    - button:
                        id: qs_wlan_btn
                        width: 100
                        height: 50
                        styles: [st_ctrlbtn]
                        on_click: [{script.execute: qs_wlan_toggle}]
                        widgets:
                          # Symbol + Name oben, Zustand darunter in eigener Zeile (vorher ueberlappte "verbunden" das Symbol)
                          - label: {align: TOP_LEFT, x: -2, y: -4, text: "\U000F05A9", text_font: mdi_menu}
                          - label: {align: TOP_LEFT, x: 22, y: 0, text: "WLAN", text_font: a13}
                          - label: {id: qs_wlan_lbl, align: BOTTOM_LEFT, y: 3, text: "-", text_font: a13}
                    - button:
                        id: qs_bt_btn
                        width: 100
                        height: 50
                        styles: [st_ctrlbtn]
                        on_click: [{script.execute: qs_bt_toggle}]
                        widgets:
                          # Symbol + Name oben, Zustand darunter in eigener Zeile (vorher ueberlappte "verbunden" das Symbol)
                          - label: {align: TOP_LEFT, x: -2, y: -4, text: "\U000F00AF", text_font: mdi_menu}
                          - label: {align: TOP_LEFT, x: 22, y: 0, text: "Bluetooth", text_font: a13}
                          - label: {id: qs_bt_lbl, align: BOTTOM_LEFT, y: 3, text: "-", text_font: a13}
              # Regler wie im Menue (Einstellungen > Bildschirm): Zeile Name + Prozent,
              # darunter waagerechter Regler. Groesse/Farben setzt fix_slider_geometry.
              - obj:
                  width: 100%
                  height: 22
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  styles: [st_fx_sb]
                  widgets:
                    - label: {text: "Display", styles: [st_muted]}
                    - label: {id: qs_bri_pct, text: "--", text_font: a13, text_color: 0xF1F3F5}
              - slider:
                  id: home_bri_sld
                  width: 180
                  height: 26
                  min_value: 5
                  max_value: 100
                  value: 100
                  on_value:
                    - lambda: 'id(disp_bri) = (int) x;'
                    - script.execute: apply_brightness
                    - script.execute: hide_bri_overlay
              - obj:
                  width: 100%
                  height: 26
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  styles: [st_fx_r10]
                  widgets:
                    - label: {text: "Tastenlicht", styles: [st_muted, st_grow]}
                    - label: {id: qs_kbd_pct, text: "--", text_font: a13, text_color: 0xF1F3F5}
                    # AN/AUS der Tastenbeleuchtung (s. kbd_box_refresh)
                    - button:
                        id: home_kbd_box
                        width: 52
                        height: 26
                        radius: 8
                        bg_color: 0x1A1F27
                        border_width: 2
                        border_color: 0x3A424E
                        pad_all: 0
                        pressed: {bg_color: 0x2563EB}
                        on_click: [{script.execute: kbd_overlay_light}]
                        widgets: [{label: {id: home_kbd_lbl, align: CENTER, text: "AUS", text_font: a13, text_color: 0x8B94A3}}]
              - slider:
                  id: home_kbd_sld
                  width: 180
                  height: 26
                  min_value: 5
                  max_value: 100
                  value: 60
                  on_value:
                    - lambda: 'id(kbd_bri) = (int) x;'
                    - script.execute: apply_brightness
                    - script.execute: hide_bri_overlay
        - label: {hidden: true, text: !lambda "return lv_label_rueckrufe_leeren();"}   # schneller Start, s. esphomeremote-wlan.h

    # ================================================ 43: AKKU (Statistik)
    - id: page_akku
      styles: [st_screen, st_fx_c10]
      scrollbar_mode: "off"
      pad_top: 50
      pad_bottom: 6
