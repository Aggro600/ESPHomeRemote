              break;
            case 14: // Wartung & Tests
              row(id(tile_touchtest),    nullptr, nullptr);
              row(id(tile_button_test),  nullptr, nullptr);
              row(id(clean_dur_btn),     nullptr, nullptr);
              row(id(tile_clean),        nullptr, nullptr);
              row(id(tile_sd),           nullptr, nullptr);
              row(id(ps_log_btn),        nullptr, nullptr);
              row(id(testmod_btn),       nullptr, nullptr);
              row(id(tile_restart),      nullptr, nullptr);
              row(id(back_service),      nullptr, nullptr);
              break;
            case 10: // Bluetooth
              row(id(ble_slot0),   nullptr, nullptr);
              row(id(ble_slot1),   nullptr, nullptr);
              row(id(ble_slot2),   nullptr, nullptr);
              row(id(ble_slot3),   nullptr, nullptr);
              row(id(ble_connect), nullptr, nullptr);
              row(id(ble_pair),    nullptr, nullptr);
              row(id(ble_forget),  nullptr, nullptr);
              row(id(back_ble),    nullptr, nullptr);
              break;
            case 34: // Tasten-Test
              row(id(bt_toggle_btn),     nullptr, nullptr);
              row(id(back_button_test),  nullptr, nullptr);
              break;
            default: return;
          }
          if (nr == 0) return;

          // ---- Fokusposition je Seite merken -----------------------------
          // Kommt man aus einem Untermenue zurueck, steht die Markierung
          // wieder auf dem Eintrag, ueber den man hineingegangen ist
          // (Nutzerwunsch 2026-09-16). Bewusst HIER und nicht in jeder Seite
          // einzeln: die on_load-Lambdas setzen zwar weiterhin frow/fcol auf
          // 0, das wird beim Seitenwechsel aber sofort durch den gemerkten
          // Wert ersetzt. Dadurch gilt das Merken automatisch auch fuer jede
          // kuenftige Seite, ohne dass dort irgendetwas ergaenzt werden muss.
          // Ungueltig gewordene Positionen (Seite hat heute weniger Zeilen als
          // beim letzten Besuch) faengt die Gueltigkeitspruefung weiter unten
          // ab, die beim Seitenwechsel ohnehin laeuft.
          // fmem_row/fmem_col/fmem_last_page sind jetzt globals (nicht mehr
          // static hier drin) - nav_back setzt beim Verlassen einer Seite
          // deren Eintrag zurueck auf 0, open_menu_top (langer Druck) leert
          // beim Sprung ins Startmenue alles (Nutzerwunsch 2026-09-17: nur
          // merken, bis man wieder zurueckgeht - nicht dauerhaft).
          const int seite = id(cur_page);
          const bool seitenwechsel = (seite != id(fmem_last_page));
          if (seitenwechsel) {
            id(fmem_last_page) = seite;
            if (seite >= 0 && seite < 44) {
              id(frow) = id(fmem_row)[seite];
              id(fcol) = id(fmem_col)[seite];
            }
            // Eine noch anliegende Richtung gehoert zur VORHERIGEN Seite -
            // sonst wandert die wiederhergestellte Position sofort weiter.
            id(fdrow) = 0;
            id(fdcol) = 0;
          }

          // LVGL entscheidet selbst zuverlaessig, ob eine Beruehrung ein Klick
          // oder ein Wischen war - das muss man nicht nachbauen. Kinderklicks
          // an die Seite durchreichen und dort EINMAL einen Zuhoerer setzen,
          // der den Fokus auf das wirklich geklickte Feld zieht.
          {
            lv_obj_t *sc = lv_screen_active();
            for (int i2 = 0; i2 < nr; i2++)
              for (int j2 = 0; j2 < rl[i2]; j2++) {
                // Bis zur Seite hinauf durchreichen: liegt ein Knopf in einer
                // Zeile oder in der Kopfzeile, muss auch dieser Zwischenbehaelter
                // weiterreichen - sonst erreicht der Klick den Zuhoerer nie und
                // der Fokus springt nicht mit (fiel beim Zurueck-Knopf auf).
                for (lv_obj_t *up = g[i2][j2]; up != nullptr && up != sc;
                     up = lv_obj_get_parent(up))
                  lv_obj_add_flag(up, LV_OBJ_FLAG_EVENT_BUBBLE);
                // Entscheidend: LVGL nimmt anklickbare Felder beim Beruehren in
                // seine EIGENE Fokusgruppe auf und setzt dort LV_STATE_FOCUSED -
                // denselben Zustand, den auch unsere Tastensteuerung benutzt.
                // Dadurch waren zwei Felder gleichzeitig markiert (per Diagnose
                // nachgewiesen). Wir vergeben den Fokus selbst, also nehmen wir
                // LVGL diese Zustaendigkeit weg.
                lv_obj_remove_flag(g[i2][j2], LV_OBJ_FLAG_CLICK_FOCUSABLE);
              }
            // Die Kopfzeile ist der Elternteil des Zurueck-Knopfes (letzte
            // Zeile). FLOATING nimmt sie aus dem Fluss - sie bleibt beim
            // Scrollen stehen, statt mit nach oben zu wandern.
            if (nr > 0) {
              lv_obj_t *bk = g[nr - 1][0];
              lv_obj_t *hd = bk ? lv_obj_get_parent(bk) : nullptr;
              if (hd != nullptr && hd != sc) {
                lv_obj_add_flag(hd, LV_OBJ_FLAG_FLOATING);
                // Randlos: die Kopfzeile deckt die volle Displaybreite ab und
                // reicht bis an den oberen Rand. Sonst scheinen beim Scrollen
                // oben und seitlich Knoepfe daran vorbei. Die Ausrichtung
                // bezieht sich auf die INHALTSFLAECHE, deshalb der Versatz um
                // die Seitenraender (-12 / -42).
                // Versatz aus den Seitenraendern BERECHNEN statt fest
                // eintragen: die Ausrichtung bezieht sich auf die
                // Inhaltsflaeche, und feste Werte laufen aus dem Ruder, sobald
                // sich pad_top einer Seite aendert.
                const int pl = lv_obj_get_style_pad_left(sc, LV_PART_MAIN);
                const int pt = lv_obj_get_style_pad_top(sc, LV_PART_MAIN);
                lv_obj_set_width(hd, 240);
                lv_obj_set_height(hd, 44);
                lv_obj_align(hd, LV_ALIGN_TOP_LEFT, -pl, -pt);
                // Innenabstand, damit der Zurueck-Knopf nicht am Displayrand
                // klebt - links wie oben.
                lv_obj_set_style_pad_left(hd, 16, LV_PART_MAIN);
                lv_obj_set_style_pad_right(hd, 16, LV_PART_MAIN);
                lv_obj_set_style_pad_top(hd, 8, LV_PART_MAIN);
                lv_obj_move_foreground(hd);
              }
            }
            if (sc != nullptr && lv_obj_get_user_data(sc) == nullptr) {
              lv_obj_set_user_data(sc, (void *) 1);
              lv_obj_add_event_cb(sc, [](lv_event_t *e) {
                // Auf Seiten, die nicht scrollen, macht LVGL aus einem Wischen
                // trotzdem einen Klick - es gibt ja keine Scrollbewegung, die
                // ihn abbrechen wuerde. Deshalb hier zusaetzlich pruefen, ob
                // der Finger sich bewegt hat.
                if (id(touch_moved)) return;
                id(click_obj) = lv_event_get_target(e);
                // Helligkeits-Ueberlagerung schliessen, sobald woanders
                // hingetippt wird - ausser auf ihr selbst oder auf der
                // Statuszeile, die sie oeffnet.
                lv_obj_t *t = (lv_obj_t *) lv_event_get_target(e);
                if (t != id(home_bri_sld) && t != id(home_bri_hit))
                  id(close_bri_overlay)->execute();
                id(focus_apply)->execute();
              }, LV_EVENT_CLICKED, nullptr);
            }
          }

          bool moved = (id(fdrow) != 0 || id(fdcol) != 0);
          int r = id(frow);
          int c = id(fcol);

          // Beruehrung: den Fokus auf das angetippte Feld setzen, damit die
          // Tasten danach von dort weiterlaufen und nur EIN Feld markiert ist.
          bool from_touch = false;
          if (id(click_obj) != nullptr) {
            lv_obj_t *hit = (lv_obj_t *) id(click_obj);
            id(click_obj) = nullptr;
            id(fdrow) = 0;
            id(fdcol) = 0;
            bool found = false;
            for (int i2 = 0; i2 < nr && !found; i2++)
              for (int j2 = 0; j2 < rl[i2]; j2++)
                if (g[i2][j2] == hit) { r = i2; c = j2; found = true; break; }
            if (!found) return;      // Klick lag nicht auf einem Bedienfeld
            from_touch = true;
            moved = false;
          } else if (id(touch_sync)) {
            id(touch_sync) = false;
            from_touch = true;
            id(fdrow) = 0;
            id(fdcol) = 0;
            moved = false;
            const int tx = id(touch_x), ty = id(touch_y);
            bool hit = false;
            for (int i2 = 0; i2 < nr && !hit; i2++) {
              for (int j2 = 0; j2 < rl[i2]; j2++) {
                lv_area_t a;
                lv_obj_get_coords(g[i2][j2], &a);
                if (tx >= a.x1 && tx <= a.x2 && ty >= a.y1 && ty <= a.y2) {
                  r = i2; c = j2; hit = true; break;
                }
              }
            }
            if (!hit) return;   // daneben getippt - Fokus unveraendert lassen
          } else if (id(fdrow) != 0) {
            // Hoch/Runter: Zeile wechseln, unten/oben umlaufen. Die Spalte wird
            // in die neue Zeile eingepasst (nicht umgebrochen), damit man aus
            // der rechten Spalte auch rechts wieder herauskommt.
            const int from = rl[r];
            r += id(fdrow);
            if (r < 0)   r = nr - 1;
            if (r >= nr) r = 0;
            // Spalte proportional auf die neue Zeilenbreite abbilden und dabei
            // abrunden: aus der Mitte einer Dreierzeile geht es damit nach
            // links, nicht nach rechts. (Play/Pause -> leiser, nicht lauter.)
            if (from > 0 && rl[r] != from) c = (c * rl[r]) / from;
            // Media-Seite: in die Tastenreihe auf die zuletzt markierte Taste (beim
            // ersten Mal Play/Pause in der Mitte).
            if (id(cur_page) == 6 && rl[r] == 5) c = id(media_btn_col);
            if (c >= rl[r]) c = rl[r] - 1;
            if (c < 0)      c = 0;
          } else if (id(fdcol) != 0) {
            // Links/Rechts: nur innerhalb der Zeile, dort umlaufend.
            c += id(fdcol);
            if (c < 0)      c = rl[r] - 1;
            if (c >= rl[r]) c = 0;
          } else {
            // Seitenwechsel: nur auf Gueltigkeit pruefen.
            if (r < 0 || r >= nr)  r = 0;
            if (c < 0 || c >= rl[r]) c = 0;
          }
          id(fdrow) = 0;
          id(fdcol) = 0;
          id(frow) = r;
          id(fcol) = c;
          if (id(cur_page) == 6 && rl[r] == 5) id(media_btn_col) = c;
          if (seite >= 0 && seite < 44) {
            id(fmem_row)[seite] = (int8_t) r;
            id(fmem_col)[seite] = (int8_t) c;
          }

          for (int i = 0; i < nr; i++) {
            for (int j = 0; j < rl[i]; j++) {
              if (i == r && j == c) lv_obj_add_state(g[i][j], LV_STATE_FOCUSED);
              else                  lv_obj_remove_state(g[i][j], LV_STATE_FOCUSED);
              lv_obj_invalidate(g[i][j]);
            }
          }
          id(cur_focus) = g[r][c];
          lv_obj_t *scr = lv_obj_get_screen(g[r][c]);
          if (from_touch) {
            // Fokus nur setzen, Ansicht nicht bewegen.
          } else if (r == 0 && scr != nullptr) {
            // Erste Zeile = Seitenanfang. scroll_to_view scrollt nur so weit,
            // dass der Button gerade sichtbar wird - die Ueberschrift darueber
            // bliebe abgeschnitten. Also bewusst ganz nach oben.
            lv_obj_scroll_to_y(scr, 0, moved ? LV_ANIM_ON : LV_ANIM_OFF);
          } else if (scr != nullptr) {
            // Gilt fuer BEIDES: Bewegung per D-Pad (mit Animation) und
            // Seitenwechsel mit wiederhergestellter Position weiter unten
            // (ohne Animation - die Seite soll gleich richtig dastehen, nicht
            // sichtbar hinscrollen). Frueher sprang der Seitenwechsel-Fall
            // immer nach ganz oben; seit die Fokusposition gemerkt wird, waere
            // die Markierung dann ausserhalb des sichtbaren Bereichs.
            //
            // lv_obj_scroll_to_view() schiebt nur so weit, dass das Feld
            // GERADE eben anliegt - am unteren Rand blieb es dadurch halb
            // verdeckt. Deshalb selbst rechnen, mit etwas Luft.
            lv_obj_update_layout(scr);
            lv_area_t a, pa;
            lv_obj_get_coords(g[r][c], &a);
            lv_obj_get_coords(scr, &pa);
            // Oben schwebt die Kopfzeile ueber dem Inhalt. Mit einem festen
            // kleinen Abstand landete das ausgewaehlte Feld darunter - es war
            // markiert, aber verdeckt. Der Platz, den die Kopfzeile
            // beansprucht, steht als pad_top der Seite; den nehmen wir.
            const int32_t margin_oben = lv_obj_get_style_pad_top(scr, LV_PART_MAIN) + 4;
            const int32_t margin_unten = 10;
            int32_t sy = lv_obj_get_scroll_y(scr);
            if (a.y2 > pa.y2 - margin_unten)     sy += (a.y2 - (pa.y2 - margin_unten));
            else if (a.y1 < pa.y1 + margin_oben) sy -= ((pa.y1 + margin_oben) - a.y1);
            if (sy < 0) sy = 0;
            lv_obj_scroll_to_y(scr, sy, moved ? LV_ANIM_ON : LV_ANIM_OFF);
          }
  - id: focus_up
    then:
      - lambda: 'id(fdrow) = -1;'
      - script.execute: focus_apply
  - id: focus_down
    then:
      - lambda: 'id(fdrow) = 1;'
      - script.execute: focus_apply
  - id: focus_left
    then:
      - lambda: 'id(fdcol) = -1;'
      - script.execute: focus_apply
  - id: focus_right
    then:
      - lambda: 'id(fdcol) = 1;'
      - script.execute: focus_apply
  - id: activate
    then:
      # Beim Bestaetigen per D-Pad schicken wir nur das Klick-Ereignis - den
      # gedrueckten Zustand setzt LVGL dabei nicht, der entsteht nur bei echter
      # Beruehrung. Ohne ihn bleibt die blaue Rueckmeldung aus, die es per
      # Finger gibt. Also kurz selbst setzen.
      - lambda: |-
          if (id(cur_focus) == nullptr) return;
          lv_obj_t *o = (lv_obj_t *) id(cur_focus);
          id(flash_obj) = o;
          lv_obj_add_state(o, LV_STATE_PRESSED);
          lv_obj_send_event(o, LV_EVENT_CLICKED, nullptr);
      - script.execute: unflash

  # Nimmt die Faerbung nach kurzer Zeit wieder weg. Eigenes Skript, damit die
  # Aktion des Knopfes nicht auf die Wartezeit warten muss.
  # Sprachtaste gedrueckt: erst Strom, kurz warten, dann aufnehmen. Ohne den
  # Vorlauf faengt ein MEMS-Mikrofon die ersten Silben nicht sauber ein - es
  # braucht nach dem Einschalten einen Moment, bis es eingeschwungen ist.
  - id: voice_start
    mode: restart
    then:
      - if:
          condition: {lambda: "return id(sdkarte)->is_mounted();"}
          then:
            - lambda: 'ESP_LOGW("sd", "Sprache nicht moeglich: SD-Karte eingebunden (geteilte Pins) - Auswerfen startet neu");'
            - script.stop: voice_start
      # Jeder neue Druck beendet zuerst konsequent alles Alte, statt sich
      # darauf zu verlassen, dass ein vorheriger Ablauf sauber durchgelaufen
      # ist (Nutzerhinweis 2026-09-18: "wenn ich den Assistant frisch
      # gewechselt habe... manchmal oeffnet sich der Dialog nicht - jedes
      # Druecken muesste eigentlich alles Alte beenden"). request_stop() der
      # voice_assistant-Komponente ist fuer GENAU das gebaut: es raeumt aus
      # jedem moeglichen internen Zustand sauber auf (auch IDLE - dann ein
      # No-op). atv_mic_stop ebenso, falls zuvor eine ATV-Sitzung haengen
      # geblieben war.
      # ZUERST einen eventuell noch laufenden voice_stop abbrechen. Dessen
      # Google-Zweig haengt nach dem Loslassen noch ~1,8s nach (delay 1500ms
      # + 300ms) und setzt DANACH voice_active=false + apply_mic_power - er
      # wuerde also einer inzwischen frisch gestarteten Sitzung mitten im
      # Betrieb das Mikrofon abschalten. Genau das war der Fehler "nach dem
      # Wechsel auf HA schliesst sich der Dialog sofort wieder" (live
      # nachgewiesen 2026-09-18): beim Doppeltipp laeuft voice_stop noch mit
      # assistant==0, also im Google-Zweig mit diesem Nachlauf - deshalb trat
      # es NUR in der Richtung Google -> Home Assistant auf, nie umgekehrt
      # (der HA-Zweig hat keinen Nachlauf). Wartete man nach dem Wechsel
      # kurz, war der Nachlauf schon durch - daher "mit Warten geht es".
      - script.stop: voice_stop
      # Nur wenn tatsaechlich noch etwas lief (z.B. eine haengengebliebene
      # HA-Pipeline, bei der "STT started" kam, aber nie eine Antwort - live
      # nachgewiesen 2026-09-18), dem HA-Server nach dem erzwungenen Stop
      # kurz Zeit geben, die alte Sitzung serverseitig aufzuraeumen, bevor
      # wir gleich eine neue anfordern. Sofortiges start() nach dem
      # Erzwingen des stop() endete sonst selbst sofort wieder (Event Type 2
      # noch waehrend STARTING_PIPELINE) - vermutlich eine Race mit der
      # HA-seitigen Aufraeumarbeit der eben erst abgewuergten Pipeline. Im
      # Normalfall (nichts lief) kein Zusatz-Delay.
      - if:
          condition: {voice_assistant.is_running:}
          then:
            - voice_assistant.stop:
            - delay: 400ms
          else:
            - voice_assistant.stop:
      - lambda: 'id(kb).execute_action("atv_mic_stop");'
      # RSSI-Abfrage pausieren, solange eine Sprachsitzung laeuft: sie schickt
      # alle 3s einen HCI-Befehl (esp_ble_gap_read_rssi) - genau ueber denselben
      # Bluetooth-Controller, ueber den auch die ADPCM-Audiodaten laufen.
      # Live nachgewiesen (Stand 2026-09-17, Diagnose-Dienst mic_test_start):
      # eine 10s-Testsitzung war die ersten ~6s (zwei RSSI-Intervalle) sauber,
      # danach setzten "Link congested" und Paketverluste bis zum Ende ein -
      # passt zeitlich zur dritten RSSI-Abfrage. Nutzerhinweis "Sprachsuche
      # erkennt fast nichts mehr" ist damit wahrscheinlich erklaert.
      # 2026-09-18: probeweise versucht, hier zusaetzlich den WLAN-Sparmodus
      # waehrend der Sitzung auf NONE zu zwingen (Theorie: "light" verzoegert
      # Pakete auf der HA-Audio-Verbindung) - wieder entfernt, nachdem sich
      # herausstellte, dass die Verbindung OHNE diese Aenderung zuverlaessiger
      # lief als MIT ihr. Das Umschalten des Sparmodus mitten in der aktiven
      # Verbindung ist selbst ein plausibler Stoerer. Beleg nicht wasserdicht,
      # aber ohne A/B-Test schwer zu ignorieren.
      - lambda: 'id(kb).set_rssi_paused(true);'
      # Zuerst wecken - das schaltet bei Stufe 2 auch das WLAN wieder ein.
      # Frueher stand das nur im Google-Zweig, wodurch der Home-Assistant-
      # Assistent bei schlafendem Display gar keine Verbindung hatte.
      - script.execute: wake_backlight
      - globals.set: {id: voice_want, value: "true"}
      - globals.set: {id: voice_active, value: "true"}
      - script.execute: apply_mic_power
      # Feste Mindestwartezeit (Nutzerhinweis 2026-09-18: "beim ersten Druck
      # schon den Assistant ausgeloest" - der Doppeltipp zum Umschalten wurde
      # dadurch sichtbar unterbrochen). War die BLE-Verbindung bereits
      # schnell (Display schon wach - der haeufige Fall bei einem
      # Doppeltipp), kehrte wait_until vorher SOFORT zurueck, und die
      # Sprach-Seite blitzte schon beim ersten Tipp auf, bevor er ueberhaupt
      # losgelassen werden konnte. Jetzt IMMER erst 250ms warten (kurz genug,
      # dass ein echtes Halten nicht spuerbar verzoegert wirkt, aber lang
      # genug, dass ein kurzer Tipp/Doppeltipp vorher loslassen und die
      # weiter unten folgende voice_want-Pruefung ihn still abbrechen kann,
      # ohne dass irgendetwas sichtbar wird).
      - delay: 250ms
      # Frueher ein fester delay: 200ms (jetzt oben, s. Kommentar). wake_backlight
      # hat gerade erst das schnelle BLE-Profil angefordert
      # (request_conn_profile(false)) - aus dem Ruheprofil (120-150ms,
      # Latency 3) dauert die tatsaechliche Umschaltung oft laenger als
      # 200ms. Startete das ADPCM-Streaming davor, liefen die ersten Pakete
      # noch auf dem langsamen Intervall und wurden "congested" (live
      # nachgewiesen: echter Tastendruck aus dem Ruhezustand, Congestion ab
      # ~1.2s). Deshalb zusaetzlich auf die Bestaetigung warten - Budget auf
      # 450ms gekuerzt, damit der Gesamt-Worst-Case (250+450=700ms) gleich
      # bleibt wie vorher.
      - wait_until:
          condition: {lambda: "return id(kb).conn_fast_ready();"}
          timeout: 450ms
      # Nur starten, wenn die Taste noch gehalten wird. Ein kurzer Tipp - etwa
      # beim Doppeltipp zum Umschalten - startet sonst eine Abfrage, in die
      # niemand mehr hineinspricht.
      - if:
          condition: {lambda: "return id(voice_want);"}
          then:
            - if:
                condition: {lambda: "return id(assistant) == 0;"}
                then:
                  - lambda: 'id(kb).execute_action("atv_mic_start");'
                  # Anzeigen, DASS aufgenommen wird. Den erkannten Text kann
                  # die Fernbedienung hier nicht wissen: Der Android-TV-Dienst
                  # schickt Audio nur in eine Richtung, die Erkennung laeuft im
                  # Fernseher und kommt nie zu uns zurueck.
                  - script.execute: wake_backlight
                  - lvgl.label.update: {id: voice_you,    text: "Sprich jetzt"}
                  - lvgl.label.update: {id: voice_answer, text: "Google hört zu. Das Erkannte erscheint auf dem Fernseher."}
                  - lvgl.page.show: {id: page_voice, animation: FADE_IN, time: 150ms}
                else:
                  # Kommt die Fernbedienung gerade aus dem Ruhezustand, braucht
                  # das WLAN ein paar Sekunden. Ohne Verbindung tut
                  # voice_assistant.start schlicht nichts - man steht dann vor
                  # einem Geraet, das nicht reagiert und nichts sagt.
                  - if:
                      condition:
                        not: {api.connected:}
                      then:
                        - lvgl.label.update: {id: voice_you,    text: "Moment"}
                        - lvgl.label.update: {id: voice_answer, text: "Verbinde mit Home Assistant ..."}
                        - lvgl.page.show: {id: page_voice, animation: FADE_IN, time: 150ms}
                        - wait_until:
                            condition: {api.connected:}
                            timeout: 8s
                  - if:
                      condition: {api.connected:}
                      then: [{voice_assistant.start:}]
                      else:
                        - lvgl.label.update: {id: voice_you,    text: "Keine Verbindung"}
                        - lvgl.label.update: {id: voice_answer, text: "Home Assistant ist nicht erreichbar. Google geht trotzdem - mit doppeltem Druck umschalten."}
                        - lvgl.page.show: {id: page_voice, animation: FADE_IN, time: 150ms}
                        - lambda: 'ESP_LOGW("assi", "keine API-Verbindung - Abfrage nicht gestartet");'
                        - globals.set: {id: voice_active, value: "false"}
                        - script.execute: apply_mic_power
                        - lambda: 'id(kb).set_rssi_paused(false);'
            - script.execute: voice_power_guard
          else:
            - lambda: 'ESP_LOGD("assi", "zu kurz gedrueckt - keine Abfrage");'
            - globals.set: {id: voice_active, value: "false"}
            - script.execute: apply_mic_power
            - lambda: 'id(kb).set_rssi_paused(false);'

  # Loslassen: Aufnahme beenden, dann den Strom wieder wegnehmen. Die kurze
  # Nachlaufzeit verhindert, dass das letzte Stueck Audio abgeschnitten wird.
  # Notbremse: bleibt eine Home-Assistant-Abfrage haengen, faellt der
  # Mikrofonstrom trotzdem wieder weg.
  - id: voice_power_guard
    mode: restart
    then:
      - delay: 25s
      - globals.set: {id: voice_active, value: "false"}
      - script.execute: apply_mic_power
      - lambda: 'id(kb).set_rssi_paused(false);'
      - lambda: 'ESP_LOGW("assi", "Abfrage lief zu lange - Mikrofon abgeschaltet");'

  - id: voice_stop
    # restart statt Standard "single": der Google-Zweig unten haelt mit
    # delay: 1500ms eine Weile an - ohne restart wuerde ein zweiter Aufruf
    # waehrend dieser Zeit (schneller Doppeltipp) still verworfen, s.
    # ausfuehrlichen Kommentar an der Aufrufstelle (keycode 45) oben.
    mode: restart
    then:
      - globals.set: {id: voice_want, value: "false"}
      - if:
          condition: {lambda: "return id(assistant) == 0;"}
          then:
            # Google: Loslassen IST das Ende, der Fernseher wertet selbst aus.
            - lambda: 'id(kb).execute_action("atv_mic_stop");'
            - lvgl.label.update: {id: voice_answer, text: "Ergebnis auf dem Fernseher"}
            - delay: 1500ms
            - if:
                condition: {lambda: "return id(cur_page) == 26;"}
                then: [{script.execute: go_home}]
            - delay: 300ms
            - globals.set: {id: voice_active, value: "false"}
            - script.execute: apply_mic_power
            - lambda: 'id(kb).set_rssi_paused(false);'
          else:
            # Home Assistant: NICHT abbrechen. Die Pipeline erkennt das
            # Sprachende selbst und braucht danach noch einen Moment fuer
            # Erkennung und Absicht. Ein Abbruch beim Loslassen wirft die
            # Abfrage weg - genau das ist am 04.09. passiert: "Starting STT by
            # VAD" kam, das Ergebnis nie. Strom bleibt bis on_end an.
            - lambda: 'ESP_LOGD("assi", "losgelassen - Pipeline laeuft weiter");'

  - id: toggle_assistant
    then:
      - lambda: 'id(assistant) = id(assistant) == 0 ? 1 : 0;'
      - script.execute: apply_assistant

  # Der MAX17048 fuehrt in Register 0x16 (CRATE) die Lade- bzw. Entladerate in
  # 0,208 % pro Stunde je Schritt, mit Vorzeichen. ESPHome legt den Wert nicht
  # offen, also lesen wir ihn direkt vom Bus. Positiv heisst: der Akku fuellt
  # sich - das ist eine echte Ladeerkennung und kein Vergleich zweier
  # Messpunkte, der Minuten braeuchte.
  - id: refresh_laden
    then:
      - lambda: |-
          uint8_t d[2];
          i2c::I2CDevice dev;
          dev.set_i2c_bus(id(hauptbus));
          dev.set_i2c_address(0x36);
          if (dev.read_register(0x16, d, 2) != i2c::ERROR_OK) {
            ESP_LOGW("akku", "CRATE-Register nicht lesbar");
            return;
          }
          const int16_t roh = (int16_t) ((uint16_t) d[0] << 8 | d[1]);
          const float rate = roh * 0.208f;              // Prozent pro Stunde
          ESP_LOGD("akku", "CRATE roh=%d -> %.2f %%/h", roh, (double) rate);
          id(entladerate).publish_state(rate);
          const bool neu = rate > 0.5f;                 // kleiner Totbereich
          if (neu != id(laedt)) {
            const bool flanke_an = neu && !id(laedt);
            id(laedt) = neu;
            id(apply_low_bat)->execute();
            ESP_LOGI("akku", "%s (%.1f %%/h)",
                     neu ? "laedt" : "laedt nicht", (double) rate);
            // Ladegeraet gerade angesteckt -> aufwecken und WLAN 5 min
            // erzwingen. So wird die Fernbedienung ueber "ans Kabel legen"
            // zuverlaessig per Home Assistant / OTA erreichbar, auch wenn sie
            // im Ruhezustand (Stufe 2) das WLAN abgeschaltet hatte.
            if (flanke_an) {
              ESP_LOGI("akku", "Ladegeraet angesteckt -> Wartungsfenster");
              id(wake_backlight)->execute();
              id(wartungsfenster)->execute();
            }
          }
      - script.execute: apply_charge_icon

  # Blitz-Icon + Akkutext-Farbe: bewusst NICHT mehr an der CRATE-Rate (neu
  # oben), sondern direkt am charger_present-Pin (TP4056-Ladeausgang, echtes
  # Hardware-Signal, nur 200ms/2s gefiltert). Live nachgewiesen 2026-09-19:
  # die CRATE-Rate im MAX17048 aendert sich intern selbst nur alle paar bis
  # zig Sekunden - ein schnelleres Nachfragen (vorheriger Fixversuch) las
  # deshalb bloss denselben veralteten Wert schneller erneut, half also
  # weder beim Einstecken noch beim Ausstecken wirklich. charger_present
  # reagiert dagegen wirklich sofort in beide Richtungen. Eigenes Script,
  # damit es auch direkt von charger_present: on_press/on_release aus
  # (ohne Umweg ueber den I2C-Read) sofort auslösbar ist.
  - id: apply_charge_icon
    then:
      - lambda: |-
          const bool an = id(charger_present).state;
          // "voll": Der Lade-IC (Pin) meldet am Ladeende "laedt nicht mehr", der
          // Prozentwert steigt aber noch nach. War das Kabel dran (charge_latch),
          // zeigt der Akku-Text deshalb gruen "voll" statt der Prozent - ab 95 %
          // und solange der Messer kein Entladen meldet (Rate >= -0,5 %/h). Sobald
          // er Entladen sieht (Kabel ab), oder < 90 %, faellt es weg.
          const float rate = id(entladerate).state;
          if (an) id(charge_latch) = true;
          else if (id(akku_pct) < 90 || (!std::isnan(rate) && rate < -0.5f)) id(charge_latch) = false;
          const bool voll = !an && id(charge_latch) && id(akku_pct) >= 95;
          if (voll) {
            lv_label_set_text(id(lbl_batt), "voll");
          } else {
            char pb[8];
            snprintf(pb, sizeof(pb), "%d%%", id(akku_pct));
            lv_label_set_text(id(lbl_batt), pb);
          }
          lv_obj_set_style_text_color(id(lbl_batt),
            lv_color_hex((an || voll) ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          if (an) lv_obj_clear_flag(id(lbl_batt_chg), LV_OBJ_FLAG_HIDDEN);
          else    lv_obj_add_flag(id(lbl_batt_chg), LV_OBJ_FLAG_HIDDEN);

  # Prozessortakt: 80 MHz nur wenn "Prozessor drosseln" AN UND Display aus
  # (Referenz-Firmware laeuft BLE-HID nachweislich stabil bei 80 MHz). Bei
  # Display an oder waehrend OTA immer 240 MHz. Der BT-Treiber holt sich fuer
  # Funkarbeit ohnehin selbst wieder Takt.
  - id: apply_cpu
    then:
      - lambda: |-
          const bool spar = (id(ps_cpu) || id(low_bat)) && id(disp_off) && id(cpu_low) && !id(ota_aktiv);
          // Nur bei einer echten Aenderung neu einstellen und loggen - wake_backlight
          // ruft das bei JEDEM Tastendruck/Tipp auf.
          static int letzt = -1;
          if ((spar ? 80 : 240) == letzt) return;
          letzt = spar ? 80 : 240;
          esp_pm_config_t pm = {};
          pm.max_freq_mhz = spar ? 80 : 240;
          pm.min_freq_mhz = 80;
          pm.light_sleep_enable = false;
          const esp_err_t r = esp_pm_configure(&pm);
          ESP_LOGI("strom", "CPU max %d MHz (%s)", (int) pm.max_freq_mhz,
                   r == ESP_OK ? "ok" : "abgelehnt");

  - id: apply_power
    then:
      - script.execute: apply_wifi_ps
      - script.execute: apply_low_bat
      - script.execute: apply_cpu
      - lambda: |-
          ESP_LOGI("strom", "WLAN-Sparmodus %s | WLAN-Ruhe %s | BLE-Idle %s",
                   id(ps_wifi) ? "an" : "aus", id(ps_wifi_off) ? "an" : "aus",
                   id(ps_bleidle) ? "an" : "aus");
          lv_obj_t *m[6] = {id(ps_wifi_lbl), id(ps_off_lbl), id(ps_cpu_lbl), id(ps_deep_lbl), id(testmod_lbl), id(ps_bleidle_lbl)};
          bool v[6] = {id(ps_wifi), id(ps_wifi_off), id(ps_cpu), id(ps_deep), id(testmodus), id(ps_bleidle)};
          for (int i = 0; i < 6; i++) {
            lv_label_set_text(m[i], v[i] ? "AN" : "AUS");
            lv_obj_set_style_text_color(m[i],
              lv_color_hex(v[i] ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          }
          // ---- Zeiten, Hinweise und Ablauf (Energie-Seite) ----
          auto fmt = [](int sek) -> std::string {
            char b[16];
            if (sek <= 0)              return std::string("sofort");
            if (sek < 60)              snprintf(b, sizeof(b), "%d s", sek);
            else if (sek % 3600 == 0)  snprintf(b, sizeof(b), "%d Std", sek / 3600);
            else if (sek % 60 == 0)    snprintf(b, sizeof(b), "%d min", sek / 60);
            else                       snprintf(b, sizeof(b), "%d s", sek);
            return std::string(b);
          };
          auto an = [](bool v) { return v ? "AN" : "AUS"; };
          auto farbe = [](lv_obj_t *o, bool aktiv) {
            lv_obj_set_style_text_color(o, lv_color_hex(aktiv ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          };
          char pb[16];
          const int t_disp = id(disp_timeout_s);
          const std::string s_disp = t_disp > 0 ? fmt(t_disp) : std::string("nie");
          const std::string s_wifi = fmt(id(ps_wifi_off_s));
          const std::string s_ble  = fmt(id(ps_ble_s));
          const std::string s_cpu  = fmt(id(ps_cpu_s));
          const std::string s_deep = fmt(id(ps_deep_s));
          const std::string s_mem  = fmt(id(mem_s));
          auto s_disp2 = [&](int sek) { return fmt(sek); };
          const bool dim_ok = id(ps_dim_s) > 0 && (t_disp <= 0 || id(ps_dim_s) < t_disp);

          // ---- Beschriftungen der Werte ----
          lv_label_set_text(id(ps_dim_lbl), id(ps_dim_s) > 0 ? fmt(id(ps_dim_s)).c_str() : "AUS");
          lv_slider_set_value(id(ps_dim_sld), id(ps_dim_s), LV_ANIM_OFF);
          farbe(id(ps_dim_lbl), dim_ok);
          snprintf(pb, sizeof(pb), "%d %%", id(ps_dim_pct));
          lv_label_set_text(id(ps_dimp_lbl), pb);
          farbe(id(ps_dimp_lbl), dim_ok);
          lv_label_set_text(id(ps_wifimax_lbl), an(id(ps_wifi_max)));
          farbe(id(ps_wifimax_lbl), id(ps_wifi_max) && id(ps_wifi));
          lv_label_set_text(id(ps_wifis_lbl), s_wifi.c_str());
          farbe(id(ps_wifis_lbl), id(ps_wifi_off));
          lv_label_set_text(id(ps_cpu_lbl), id(ps_cpu) ? s_cpu.c_str() : "AUS");
          farbe(id(ps_cpu_lbl), id(ps_cpu));
          lv_label_set_text(id(ps_bles_lbl), s_ble.c_str());
          farbe(id(ps_bles_lbl), id(ps_bleidle));
          lv_label_set_text(id(ps_touch_lbl), an(id(ps_touch_wake)));
          snprintf(pb, sizeof(pb), "%d ms", id(ps_touch_ms));
          lv_label_set_text(id(ps_touchms_lbl), pb);
          farbe(id(ps_touchms_lbl), id(ps_touch_wake) && id(ps_touch_ms) > 50);
          farbe(id(ps_touch_lbl), id(ps_touch_wake));
          lv_label_set_text(id(ps_deeps_lbl), s_deep.c_str());
          farbe(id(ps_deeps_lbl), id(ps_deep));
          {
            const int tv = id(ps_deep_tv_s);
            lv_label_set_text(id(ps_deeptv_lbl), tv == 0 ? "nie" : (tv < 0 ? "wie oben" : fmt(tv).c_str()));
            farbe(id(ps_deeptv_lbl), id(ps_deep) && tv != 0);
          }
          if (id(ps_low_pct) > 0) { snprintf(pb, sizeof(pb), "%d %%", id(ps_low_pct)); lv_label_set_text(id(ps_low_lbl), pb); }
          else lv_label_set_text(id(ps_low_lbl), "AUS");
          farbe(id(ps_low_lbl), id(ps_low_pct) > 0);
          lv_label_set_text(id(mem_lbl), s_mem.c_str());
          farbe(id(mem_lbl), true);
          lv_label_set_text(id(ps_log_lbl), an(id(ps_log_debug)));
          farbe(id(ps_log_lbl), id(ps_log_debug));

          // ---- Hinweise ----
          if (id(ps_dim_s) <= 0)
            lv_label_set_text(id(ps_h_dim), "AUS: Das Display geht direkt aus, ohne vorher dunkler zu werden. Der Bildschirm ist meist der größte Verbraucher; zuerst abdunkeln spart Strom und ist beim Wegschauen unauffälliger. Tippen schaltet durch: AUS, 5 s, 10 s ...");
          else if (!dim_ok)
            lv_label_set_text(id(ps_h_dim), ("Achtung: Abdunkeln nach " + s_disp2(id(ps_dim_s)) + " ist nicht kürzer als der Display-Timeout (" + s_disp + ") und bleibt daher ohne Wirkung. Timeout unter Anzeige ändern oder kürzer wählen.").c_str());
          else
            lv_label_set_text(id(ps_h_dim), ("Nach " + s_disp2(id(ps_dim_s)) + " ohne Bedienung wird das Display abgedunkelt, nach " + s_disp + " geht es aus. Ein Tipp oder Tastendruck macht es sofort wieder hell.").c_str());
          lv_label_set_text(id(ps_h_dimp),
            "Helligkeit beim Abdunkeln in Prozent der eingestellten Bildschirmhelligkeit. Wirkt nur bei Abdunkeln nach = eine Zeit.");
          lv_label_set_text(id(ps_h_wifi),
            "Der WLAN-Chip schläft zwischen den Datenpaketen. Spart im Betrieb viel Strom, Home Assistant antwortet nur minimal später. Empfehlung: AN.");
          lv_label_set_text(id(ps_h_wifimax),
            "Im Ruhezustand (Display aus) schläft der WLAN-Chip noch länger zwischen den Datenpaketen. Spart mehr, Home Assistant antwortet dann träger. Bei Bedienung gilt wieder der normale Sparmodus. Wirkt nur bei WLAN-Sparmodus = AN.");
          lv_label_set_text(id(ps_h_off), id(ps_wifi_off)
            ? ("AN: Bei ausgeschaltetem Display wird das WLAN " + (id(ps_wifi_off_s) > 0 ? "nach " + s_wifi : std::string("sofort")) + " abgeschaltet. Bluetooth (Tasten) läuft weiter; Home Assistant und Flashen gehen dann nicht. Ein Tastendruck oder Tipp schaltet das WLAN sofort wieder ein, ebenso das Anstecken des Ladekabels (dann 3 min offen zum Flashen).").c_str()
            : "AUS: Das WLAN bleibt auch bei ausgeschaltetem Display immer an. Home Assistant erreicht die Remote jederzeit, das kostet aber Strom.");
          lv_label_set_text(id(ps_h_offs),
            "Wartezeit ab Display-Aus, bis das WLAN abgeschaltet wird (sofort = beim Display-Aus). Kürzer spart mehr, Home Assistant ist dann früher weg. Wirkt nur bei WLAN aus im Ruhezustand = AN.");
          lv_label_set_text(id(ps_h_cpu), id(ps_cpu)
            ? ("Der Prozessor läuft " + (id(ps_cpu_s) > 0 ? s_cpu + " nach Display-Aus" : std::string("ab Display-Aus")) + " mit 80 statt 240 MHz. Ein Tastendruck oder Tipp schaltet sofort wieder auf volle Leistung, bei der Bedienung merkst du keinen Unterschied. Tippen schaltet durch: AUS, sofort, 5 s, 15 s, 30 s, 1 min, 5 min.").c_str()
            : "AUS: Der Prozessor läuft immer mit bis zu 240 MHz, auch bei ausgeschaltetem Display. Kostet im Ruhezustand Strom. Tippen schaltet durch: AUS, sofort, 5 s, 15 s ...");
          lv_label_set_text(id(ps_h_ble), id(ps_bleidle)
            ? ("AN: " + s_ble + " nach Display-Aus meldet sich die Remote per Bluetooth nur noch alle ca. 0,6 s statt alle 15 ms. Die Verbindung bleibt bestehen, der erste Tastendruck kommt minimal später an.").c_str()
            : "AUS: Bluetooth bleibt auch im Ruhezustand voll aktiv. Der erste Tastendruck kommt sofort an, das kostet aber Strom.");
          lv_label_set_text(id(ps_h_bles),
            "Wartezeit ab Display-Aus, bis Bluetooth in den langsamen Takt wechselt. Wirkt nur bei BLE-Verbindung langsam = AN.");
          lv_label_set_text(id(ps_h_touch), id(ps_touch_wake)
            ? "AN: Ein Tipp aufs Display weckt die Remote, so wie eine Taste oder das Anheben."
            : "AUS: Im Ruhezustand wird der Touch-Chip nicht mehr abgefragt, nur Tasten, Anheben und Ladekabel wecken. Spart etwas Strom; der erste Tipp aufs dunkle Display bewirkt nichts.");
          lv_label_set_text(id(ps_h_touchms), id(ps_touch_ms) <= 50
            ? "50 ms (Standard): Der Touch-Chip wird auch im Ruhezustand alle 50 ms gefragt, jeder Tipp weckt sicher. Tippen schaltet durch: 50, 100, 200, 300 ms."
            : "Der Touch-Chip wird im Ruhezustand seltener gefragt. Das spart etwas Strom (nicht gemessen), aber ein kurzer Tipp kann zwischen zwei Abfragen durchfallen - dann musst du mehrfach tippen, bis das Display angeht. Wirkt nur bei Touch weckt = AN.");
          std::string h_deep;
          if (id(ps_deep)) {
            if (t_disp <= 0) h_deep = "AN, aber Display-Timeout ist auf nie gestellt: das Display geht nie aus, der Tiefschlaf beginnt daher nie.";
            else {
              h_deep = "AN: " + fmt(t_disp + id(ps_deep_s)) + " nach der letzten Bedienung (Display-Timeout " + s_disp + " + " + s_deep + ") schaltet sich der Chip fast ganz ab und wacht nie von selbst auf. Wecken: beliebige Taste, Anheben oder Ladekabel. Der erste Druck weckt nur - das ist dann ein kompletter Neustart und kann bis zu etwa einer Minute dauern (gemessen 2026-09-22: 58 s), erst danach reagiert sie wieder. Kein Tiefschlaf am Ladekabel und beim Sprechen.";
            }
          } else {
            h_deep = "AUS: Der Chip schläft nie ganz. Im Ruhezustand bleibt Bluetooth bereit und die Remote sofort bedienbar, verbraucht dadurch aber dauerhaft mehr Strom. Für langen Akku: AN.";
          }
          lv_label_set_text(id(ps_h_deep), h_deep.c_str());
          lv_label_set_text(id(ps_h_deeps),
            "Wartezeit ab Display-Aus, bis der Tiefschlaf beginnt. Kürzer spart mehr, dafür wartest du beim Aufwecken öfter auf die Neuverbindung. Wirkt nur bei Tiefschlaf im Ruhezustand = AN.");
          {
            const int tv = id(ps_deep_tv_s);
            lv_label_set_text(id(ps_h_deeptv), tv == 0
              ? "nie: Solange der Fernseher läuft, bleibt die Remote wach und sofort bedienbar. Das kostet viel Strom, wenn der Fernseher lange läuft. Tippen schaltet durch: nie, wie oben, 5 min, 10 min ..."
              : (tv < 0
                ? "wie oben: Bei laufendem Fernseher gilt dieselbe Tiefschlaf-Zeit wie sonst. Der erste Tastendruck weckt die Remote nur."
                : ("Bei laufendem Fernseher beginnt der Tiefschlaf erst " + fmt(tv) + " nach Display-Aus (sonst nach " + s_deep + "). Beim Fernsehen schläft die Remote so nicht zu früh ein.").c_str()));
          }
          lv_label_set_text(id(ps_h_low), id(ps_low_pct) > 0
            ? ("Fällt der Akku auf " + std::to_string(id(ps_low_pct)) + " % oder weniger (nicht beim Laden), gelten gekürzte Zeiten: Display nach höchstens 15 s aus, WLAN und Prozessor sofort gedrosselt, Bluetooth nach 5 s langsam, Tiefschlaf nach höchstens 30 s - auch bei laufendem Fernseher und wenn diese Optionen sonst AUS sind.").c_str()
            : "AUS: Bei niedrigem Akku ändert sich nichts. Tippen schaltet durch: AUS, 10 %, 15 %, 20 %, 30 %.");
          lv_label_set_text(id(ps_h_mem),
            "So lange nach dem Verlassen des Menüs (und ab Display-Aus) bleiben Menüseite und Markierung erhalten. Danach beginnt das Menü wieder ganz oben. Gilt auch für die Media-Player-Seite.");
          lv_label_set_text(id(ps_h_log), id(ps_log_debug)
            ? "AN: Ausführliche Log-Meldungen (Tasten, Takt, Funk) für die Fehlersuche. Mehr Ausgabe, minimal mehr Stromverbrauch."
            : "AUS: Nur wichtige Log-Meldungen. Spart minimal Strom und Rechenzeit. Zum Suchen von Fehlern auf AN stellen.");
          lv_label_set_text(id(ps_h_test),
            "AN: Kein Tiefschlaf und kein WLAN-Aus, die Remote ist immer per WLAN erreichbar (z. B. zum Flashen). Nach einem Neustart wird er automatisch ausgeschaltet; in den ersten 10 min nach dem Start sind Tiefschlaf und WLAN-Aus ohnehin gesperrt.");

          // ---- Ablauf-Plan, nach Zeit sortiert (alles ab Display-Aus) ----
          std::string ab = dim_ok
            ? "Ablauf: Nach " + s_disp2(id(ps_dim_s)) + " wird das Display abgedunkelt, nach " + s_disp + " geht es aus."
            : "Ablauf: Das Display geht nach " + s_disp + " ohne Bedienung aus.";
          if (id(low_bat)) ab += "\nAkku niedrig: gekürzte Zeiten aktiv!";
          if (id(testmodus)) {
            ab += "\nTestmodus AN: kein WLAN-Aus, kein Tiefschlaf.";
          } else {
            int   zt[6];
            std::string tx[6];
            int n = 0;
            auto add = [&](int sek, const std::string &t) {
              int k = n++;
              while (k > 0 && zt[k - 1] > sek) { zt[k] = zt[k - 1]; tx[k] = tx[k - 1]; k--; }
              zt[k] = sek; tx[k] = t;
            };
            auto fp = [&](int sek) { return sek <= 0 ? std::string("0 s") : fmt(sek); };
            if (id(ps_cpu))      add(id(ps_cpu_s), "Prozessor gedrosselt");
            if (id(ps_bleidle))  add(id(ps_ble_s), "Bluetooth langsam");
            add(id(mem_s), "Menü zurück auf Start");
            if (id(ps_wifi_off)) add(id(ps_wifi_off_s), "WLAN aus");
            if (id(ps_deep))     add(id(ps_deep_s), id(ps_deep_tv_s) == 0 ? "Tiefschlaf (nicht bei TV an)" : "Tiefschlaf");
            ab += "\nDanach ab Display-Aus:";
            for (int k = 0; k < n; k++) ab += "\n+" + fp(zt[k]) + "  " + tx[k];
          }
          lv_label_set_text(id(ps_timeline), ab.c_str());
          // (Stufe 2 greift jetzt auch mit HA-Assistent - voice_start weckt
          //  zuerst und wartet auf die API. Kein "ruht"-Hinweis mehr noetig.)

  # Erklaerungen zu den Einstellungen (Menue > Einstellungen). Die Texte, die vom
