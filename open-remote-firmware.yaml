            case 18: // TV
              row(id(tv_power), nullptr, nullptr);
              row(id(hdmi_1), nullptr, nullptr); row(id(hdmi_2), nullptr, nullptr);
              row(id(hdmi_3), nullptr, nullptr); row(id(hdmi_4), nullptr, nullptr);
              row(id(back_tv), nullptr, nullptr);
