            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click: [{script.execute: toggle_kbd_light}]
            widgets:
              - label: {text: "Tastenbeleuchtung", text_font: a13, flex_grow: 1}
              - label: {id: kbd_light_lbl, text: "AUS", text_font: a13, text_color: 0x8B94A3}
        - label: {id: h_kbdon, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - obj:
            width: 100%
            height: 22
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center}
            widgets:
              - label: {text: "Tastenbeleuchtung", styles: [st_muted]}
              - label: {id: kbd_bri_lbl, text: "--", text_font: a13, text_color: 0xF1F3F5}
        - slider:
            id: kbd_bri_sld
            # 204 statt 100 % (216). Der Fokusring liegt AUSSERHALB des
            # Sliders; bei voller Breite lief er rechts aus dem Display und war
            # damit unsichtbar - genau der Grund, warum die Auswahl nicht zu
            # erkennen war.
            width: 180
            height: 26
            align: TOP_MID
            min_value: 5
            max_value: 100
            value: 100
            # Fuellung um 3 px eingerueckt, damit die dunkle Schiene als Rand
            # sichtbar bleibt - sonst geht bei 100 % die Fuellung nahtlos in
            # den Rahmen ueber.
            main: {pad_all: 3}
            indicator:
              bg_color: 0x3B82F6
              focused: {bg_color: 0x60A5FA}
            knob:
              bg_color: 0xF1F3F5
              focused: {bg_color: 0x3B82F6}
            # Der Fokusrahmen lag frueher AUF der Schiene: blau auf blau war
            # bei 100 % nicht mehr zu erkennen. Jetzt liegt er als Ring mit
            # Abstand AUSSERHALB des Sliders.
            # Auswahl INNERHALB des Reglers zeigen. Ein Ring aussen herum
            # wurde am Displayrand abgeschnitten und war deshalb nicht zu
            # sehen - und er liess den Regler zugleich zu breit wirken.
            # Jetzt: helle Schiene, blauer Knopf, kraeftigerer Balken.
            focused: {border_width: 0, outline_width: 0, bg_color: 0x3A424E}
            on_value:
              - lambda: 'id(kbd_bri) = (int) x;'
              - script.execute: apply_brightness
        - label: {id: h_kbdbri, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - label: {text: "AUSSCHALTEN", text_font: a13, text_color: 0x3B82F6, pad_top: 6}
        # Slider mit sechs festen Stufen statt sechs Knoepfen. Zwischenwerte
        # waeren hier nicht sinnvoll, deshalb rastet er auf die Stufen ein und
        # zeigt sie als Klartext an - eine reine Sekundenzahl sagt wenig.
        - obj:
            width: 100%
            height: 26
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center}
            widgets:
              - label: {text: "Display aus nach", styles: [st_muted]}
              - label: {id: to_val_lbl, text: "--", text_font: a15, text_color: 0xF1F3F5}
        - slider:
            id: to_sld
            width: 180
            height: 26
            align: TOP_MID
            # Sekundengenau statt sechs Rasten: 0 heisst "Nie", darueber die
            # Sekunden direkt. Ueber das D-Pad sind es 15er-Schritte, per
            # Finger geht es feiner.
            min_value: 0
            max_value: 300
            value: 30
            main: {pad_all: 3}
            indicator:
              bg_color: 0x3B82F6
              focused: {bg_color: 0x60A5FA}
            knob:
              bg_color: 0xF1F3F5
              focused: {bg_color: 0x3B82F6}
            # Auswahl INNERHALB des Reglers zeigen. Ein Ring aussen herum
            # wurde am Displayrand abgeschnitten und war deshalb nicht zu
            # sehen - und er liess den Regler zugleich zu breit wirken.
            # Jetzt: helle Schiene, blauer Knopf, kraeftigerer Balken.
            focused: {border_width: 0, outline_width: 0, bg_color: 0x3A424E}
            on_value:
              - lambda: |-
                  int v = (int) x;
                  if (v > 0 && v < 5) v = 5;   // darunter ist es unbrauchbar
                  id(disp_timeout_s) = v;
              - script.execute: apply_disp_timeout

        - label: {id: h_to, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        # Abdunkeln nach: Slider, sekundengenau (wie beim Display-Timeout). 0 = AUS,
        # sonst 3..60 s. Ueber das D-Pad 1-s-Schritte (Halten wiederholt).
        - obj:
            width: 100%
            height: 26
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center}
            widgets:
              - label: {text: "Abdunkeln nach", text_font: a15, text_color: 0xF1F3F5}
              - label: {id: ps_dim_lbl, text: "AUS", text_font: a13, text_color: 0x8B94A3}
        - slider:
            id: ps_dim_sld
            width: 180
            height: 26
            align: TOP_MID
            min_value: 0
            max_value: 60
            value: 0
            main: {pad_all: 3}
            indicator:
              bg_color: 0x3B82F6
              focused: {bg_color: 0x60A5FA}
            knob:
              bg_color: 0xF1F3F5
              focused: {bg_color: 0x3B82F6}
            focused: {border_width: 0, outline_width: 0, bg_color: 0x3A424E}
            on_value:
              - lambda: |-
                  int v = (int) x;
                  if (v > 0 && v < 3) v = 3;   // darunter unbrauchbar
                  id(ps_dim_s) = v;
              - script.execute: apply_power
        - label: {id: ps_h_dim, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - button:
            id: ps_dimp_btn
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click:
              - lambda: |-
                  static const int v[] = {10, 20, 30, 50};
                  int i = 0;
                  for (int k = 0; k < 4; k++) if (v[k] == id(ps_dim_pct)) i = k;
                  id(ps_dim_pct) = v[(i + 1) % 4];
              - script.execute: apply_power
            widgets:
              - label: {text: "Abdunkeln auf", text_font: a15, flex_grow: 1}
              - label: {id: ps_dimp_lbl, text: "-", text_font: a13, text_color: 0x8B94A3}
        - label: {id: ps_h_dimp, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
    # ================================================ 23: ANZEIGE
    # ================================================ 24: BEGRUESSUNG
    # Wird nach jedem Start gezeigt. Nebenbei die Rueckmeldung, dass wirklich
    # eine neue Firmware drauf ist - deshalb steht die Kompilierzeit darunter.
    - id: page_welcome
      styles: [st_screen]
      scrollbar_mode: "off"
      scrollable: false
      on_load:
        - lambda: 'id(cur_page) = 24; id(frow) = 0; id(fcol) = 0; ESP_LOGI("boot", "Begruessung angezeigt");'
        # Der Abdunkel-/Ausschalt-Countdown wurde schon beim Booten gestartet (wake_backlight
        # laeuft VOR dieser Seite, mit dem cur_page-Stand von davor) - der galt aber noch fuer
        # die ALTE Seite. Hier einmal sauber NEU starten (nicht stoppen - die Begruessung soll
        # sich ganz normal wie jede andere Seite verhalten und nach der eingestellten Zeit auch
        # ganz normal abdunkeln/ausgehen, nur eben nicht durch den Aufweck-Tastendruck selbst
        # sofort verschwinden - das regeln touch_was_dark/key_was_dark unten.
        - if:
            condition: {lambda: "return id(disp_timeout_s) > 0 && !id(clean_mode);"}
            then:  [{script.execute: backlight_idle_timeout}]
            else:  [{script.stop: backlight_idle_timeout}]
        - script.execute: focus_apply
      widgets:
        - button:
            id: welcome_hit
            align: CENTER
            width: 240
            height: 320
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            # Nur wirken, wenn das Display beim Antippen schon an war (touch_was_dark, gesetzt
            # beim Touch-Runter noch VOR wake_backlight) - der Tipp, mit dem man die Remote
            # gerade erst aufweckt, egal wie lange sie vorher dunkel war, soll die Begruessung
            # nicht im selben Moment schon wieder wegschalten. millis() > 6000 wieder da (s.
            # Kommentar bei nav_back/id(cur_page)==24 oben - deckt den Neustart-Sonderfall ab).
            on_click:
              - if:
                  condition: {lambda: "return !id(touch_was_dark) && millis() > 6000;"}
                  then: [{script.execute: go_home}]
            widgets:
              - label:
                  align: CENTER
                  y: 0
                  text: "${friendly_name}"
                  text_font: a18
                  text_color: 0xF1F3F5
              # Hinweise ganz nach unten, die Begruessung bleibt mittig.
              - label:
                  align: BOTTOM_MID
                  y: -12
                  width: 216
                  text: "Zurück drücken oder tippen"
                  text_font: a13
                  text_color: 0x3B82F6
                  text_align: CENTER

    # ================================================ 25: NEUSTART-RUECKFRAGE
    - id: page_restart
      styles: [st_screen]
      scrollbar_mode: "off"
      scrollable: false
      on_load:
        - lambda: 'id(cur_page) = 25; id(frow) = 0; id(fcol) = 0;'
        - script.execute: focus_apply
      widgets:
        - label:
            align: TOP_MID
            y: 60
            width: 216
            text: "Gerät wirklich neu starten?"
            text_font: a15
            text_color: 0xF1F3F5
            text_align: CENTER
        - button:
            id: restart_yes
            align: CENTER
            y: 10
            width: 200
            height: 46
            styles: [st_ctrlbtn]
            on_click:
              - lvgl.label.update: {id: restart_lbl, text: ">"}
              - button.press: btn_restart
            widgets: [{label: {align: CENTER, text: "Ja, neu starten", text_font: a15}}]
        - button:
            id: restart_no
            align: CENTER
            y: 70
            width: 200
            height: 46
            styles: [st_ctrlbtn]
            on_click: [{script.execute: nav_back}]
            widgets: [{label: {align: CENTER, text: "Abbrechen", text_font: a15}}]

    # ================================================ 26: SPRACHANTWORT
    # Zeigt, was Home Assistant verstanden hat und was es antwortet. Die
    # Fernbedienung hat keinen Lautsprecher - ohne diese Seite bekaeme man von
    # der Antwort gar nichts mit.
    - id: page_voice
      styles: [st_screen]
      scrollbar_mode: "off"
      pad_top: 14
      layout: {type: flex, flex_flow: column, flex_align_cross: start, pad_row: 10}
      on_load:
        - lambda: 'id(cur_page) = 26; id(frow) = 0; id(fcol) = 0;'
        - script.execute: focus_apply
      widgets:
        # "Du sagst" und "Antwort" zusammen in EINEM scrollbaren Rahmen
        # (Nutzerwunsch 2026-09-18) - vorher hatte nur die Antwort ihre eigene
        # Box mit fester Hoehe (voice_you daneben war ein einzelnes Label mit
        # fester 44px-Hoehe: laenger als zwei Zeilen wurde dort abgeschnitten,
        # nicht erreichbar). Zwei getrennte Scroll-Bereiche auf der kleinen
        # Seite waeren zudem verwirrend (welcher scrollt gerade?) - jetzt
        # scrollt Hoch/Runter (s. dispatch_key, p==26) immer den ganzen
        # Verlauf.
        - obj:
            id: voice_box
            width: 216
            height: 250
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollbar_mode: AUTO
            layout: {type: flex, flex_flow: column, flex_align_cross: start, pad_row: 6}
            widgets:
              - label: {text: "Du sagst", styles: [st_muted]}
              - label:
                  id: voice_you
                  width: 210
                  text: "..."
                  text_font: a15
                  text_color: 0xF1F3F5
                  long_mode: WRAP
              - label: {text: "Antwort", styles: [st_muted]}
              - label:
                  id: voice_answer
                  width: 210
                  text: ""
                  text_font: a15
                  text_color: 0x3B82F6
                  long_mode: WRAP
        - button:
            id: voice_close
            width: 216
            height: 38
            styles: [st_ctrlbtn]
            on_click: [{script.execute: go_home}]
            widgets: [{label: {align: CENTER, text: "Schließen", text_font: a13}}]

    # ================================================ 27: ENERGIE SPAREN
    - id: page_power
      styles: [st_screen]
      scrollbar_mode: "off"
      pad_top: 50
      pad_bottom: 6
      layout: {type: flex, flex_flow: column, flex_align_cross: start, pad_row: 10}
      on_load:
        - lambda: 'id(cur_page) = 27; id(frow) = 0; id(fcol) = 0;'
        - script.execute: fix_slider_geometry
        - script.execute: apply_power
        - script.execute: apply_motion_on
        - script.execute: apply_motion_sens
        - lambda: |-
            lv_label_set_text(id(dim_wake_lbl), id(dim_wake) ? "AN" : "AUS");
            lv_obj_set_style_text_color(id(dim_wake_lbl),
                lv_color_hex(id(dim_wake) ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
            lv_label_set_text(id(dim_hold_lbl), id(dim_hold_motion) ? "AN" : "AUS");
            lv_obj_set_style_text_color(id(dim_hold_lbl),
                lv_color_hex(id(dim_hold_motion) ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
            int ds = id(dim_sens); if (ds < 0) ds = 0; if (ds > 2) ds = 2;
            lv_label_set_text(id(dim_sens_lbl), (const char *[]){"Hoch", "Mittel", "Niedrig"}[ds]);
            lv_slider_set_value(id(ds_sld), 2 - ds, LV_ANIM_OFF);
        - script.execute: apply_hints
        - script.execute: focus_apply
      widgets:
        - obj:
            id: hdr_back_power
            width: 100%
            height: 40
            bg_color: 0x0E1116
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 8}
            widgets:
              - button:
                  id: back_power
                  width: 46
                  height: 30
                  styles: [st_back]
                  focused: {border_color: 0x3B82F6, text_color: 0xF1F3F5}
                  scrolled: {bg_color: 0x1A1F27, border_color: 0x1A1F27, outline_width: 0}
                  on_click: [{script.execute: nav_back}]
                  widgets: [{label: {align: CENTER, text: "<", text_font: a15}}]
              - label: {text: "Energie & Wecken", styles: [st_title], flex_grow: 1, pad_bottom: 0, height: 28, long_mode: DOT}
        - label: {text: "WLAN", text_font: a13, text_color: 0x3B82F6, pad_top: 6}
        - button:
            id: ps_wifi_btn
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click:
              - lambda: 'id(ps_wifi) = !id(ps_wifi);'
              - script.execute: apply_power
            widgets:
              - label: {text: "WLAN-Sparmodus", text_font: a15, flex_grow: 1}
              - label: {id: ps_wifi_lbl, text: "-", text_font: a13, text_color: 0x8B94A3}
        - label: {id: ps_h_wifi, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - button:
            id: ps_wifimax_btn
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click:
              - lambda: 'id(ps_wifi_max) = !id(ps_wifi_max);'
              - script.execute: apply_power
            widgets:
              - label: {text: "Sparmodus stark (Ruhe)", text_font: a15, flex_grow: 1}
              - label: {id: ps_wifimax_lbl, text: "-", text_font: a13, text_color: 0x8B94A3}
        - label: {id: ps_h_wifimax, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - button:
            id: ps_wifi_off_btn
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click:
              - lambda: 'id(ps_wifi_off) = !id(ps_wifi_off);'
              - script.execute: apply_power
            widgets:
              - label: {text: "WLAN aus im Ruhezustand", text_font: a15, flex_grow: 1}
              - label: {id: ps_off_lbl, text: "-", text_font: a13, text_color: 0x8B94A3}
        - label: {id: ps_h_off, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - button:
            id: ps_wifis_btn
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click:
              - lambda: |-
                  static const int v[] = {0, 15, 30, 60, 120, 300, 600, 1800};
                  int i = 0;
                  for (int k = 0; k < 8; k++) if (v[k] == id(ps_wifi_off_s)) i = k;
                  id(ps_wifi_off_s) = v[(i + 1) % 8];
              - script.execute: apply_power
            widgets:
              - label: {text: "WLAN aus nach", text_font: a15, flex_grow: 1}
              - label: {id: ps_wifis_lbl, text: "-", text_font: a13, text_color: 0x8B94A3}
        - label: {id: ps_h_offs, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - label: {text: "PROZESSOR & BLUETOOTH", text_font: a13, text_color: 0x3B82F6, pad_top: 6}
        - button:
            id: ps_cpu_btn
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click:
              - lambda: |-
                  // AUS -> sofort -> 5 s -> 15 s -> 30 s -> 1 min -> 5 min -> AUS
                  static const int v[] = {-1, 0, 5, 15, 30, 60, 300};
                  const int cur = id(ps_cpu) ? id(ps_cpu_s) : -1;
                  int i = 0;
                  for (int k = 0; k < 7; k++) if (v[k] == cur) i = k;
                  const int nx = v[(i + 1) % 7];
                  id(ps_cpu) = (nx >= 0);
                  if (nx >= 0) id(ps_cpu_s) = nx;
              - script.execute: apply_power
            widgets:
              - label: {text: "Prozessor drosseln", text_font: a15, flex_grow: 1}
              - label: {id: ps_cpu_lbl, text: "-", text_font: a13, text_color: 0x8B94A3}
        - label: {id: ps_h_cpu, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - button:
            id: ps_bleidle_btn
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click:
              - lambda: 'id(ps_bleidle) = !id(ps_bleidle);'
              - script.execute: apply_power
              - if:
                  condition:
                    lambda: 'return id(disp_off) && id(ps_bleidle) && !id(voice_active) && !id(host_mic);'
                  then: [{lambda: 'id(kb).request_conn_profile(true);'}]
              - if:
                  condition: {lambda: 'return !id(ps_bleidle);'}
                  then: [{lambda: 'id(kb).request_conn_profile(false);'}]
            widgets:
              - label: {text: "BLE-Verbindung langsam", text_font: a15, flex_grow: 1}
              - label: {id: ps_bleidle_lbl, text: "-", text_font: a13, text_color: 0x8B94A3}
        - label: {id: ps_h_ble, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - button:
            id: ps_bles_btn
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click:
              - lambda: |-
                  static const int v[] = {5, 10, 15, 30, 60, 120, 300};
                  int i = 0;
                  for (int k = 0; k < 7; k++) if (v[k] == id(ps_ble_s)) i = k;
                  id(ps_ble_s) = v[(i + 1) % 7];
              - script.execute: apply_power
            widgets:
              - label: {text: "BLE langsam nach", text_font: a15, flex_grow: 1}
              - label: {id: ps_bles_lbl, text: "-", text_font: a13, text_color: 0x8B94A3}
        - label: {id: ps_h_bles, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - label: {text: "AUFWECKEN", text_font: a13, text_color: 0x3B82F6, pad_top: 6}
        - obj:
            width: 100%
            height: 22
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center}
            widgets:
              - label: {text: "Aufwecken bei", styles: [st_muted]}
              - label: {id: motion_mode_lbl, text: "Bewegung", text_font: a13, text_color: 0x22C55E}
        - button:
            id: mm_0
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click:
              - lambda: 'id(motion_mode) = 0;'
              - script.execute: apply_motion_sens
              - script.execute: apply_motion_on
            widgets:
              - label: {text: "Aus", text_font: a13, flex_grow: 1}
              - label: {id: mm_0_mk, text: " ", text_font: a13, text_color: 0x22C55E}
        - button:
            id: mm_1
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click:
              - lambda: 'id(motion_mode) = 1;'
              - script.execute: apply_motion_sens
              - script.execute: apply_motion_on
            widgets:
              - label: {text: "Bewegung", text_font: a13, flex_grow: 1}
              - label: {id: mm_1_mk, text: " ", text_font: a13, text_color: 0x22C55E}
        - button:
            id: mm_2
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click:
              - lambda: 'id(motion_mode) = 2;'
              - script.execute: apply_motion_sens
              - script.execute: apply_motion_on
            widgets:
              - label: {text: "Hochheben", text_font: a13, flex_grow: 1}
              - label: {id: mm_2_mk, text: " ", text_font: a13, text_color: 0x22C55E}
        - label: {id: h_motion, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - obj:
            width: 100%
            height: 22
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center}
            widgets:
              - label: {text: "Empfindlichkeit", styles: [st_muted]}
              - label: {id: motion_sens_lbl, text: "Mittel", text_font: a13, text_color: 0xF1F3F5}
        # Dreistufiger Slider statt drei Knoepfen. Die Stufe steht als Wort
        # darueber - eine blosse Zahl sagt nicht, ob hoch auch empfindlich
        # bedeutet.
        - slider:
            id: ms_sld
            width: 180
            height: 26
            align: TOP_MID
            min_value: 0
            max_value: 2
            value: 1
            main: {pad_all: 3}
            indicator:
              bg_color: 0x3B82F6
              focused: {bg_color: 0x60A5FA}
            knob:
              bg_color: 0xF1F3F5
              focused: {bg_color: 0x3B82F6}
            # Auswahl INNERHALB des Reglers zeigen. Ein Ring aussen herum
            # wurde am Displayrand abgeschnitten und war deshalb nicht zu
            # sehen - und er liess den Regler zugleich zu breit wirken.
            # Jetzt: helle Schiene, blauer Knopf, kraeftigerer Balken.
            focused: {border_width: 0, outline_width: 0, bg_color: 0x3A424E}
            on_value:
              - lambda: |-
                  // Slider links = niedrig, rechts = hoch. Intern ist 0 die
                  // hoechste Empfindlichkeit, deshalb gedreht.
                  int i = (int) x; if (i < 0) i = 0; if (i > 2) i = 2;
                  id(motion_sens) = 2 - i;
              - script.execute: apply_motion_sens
        - label: {id: h_sens, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - button:
            id: dim_wake_btn
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click:
              - lambda: 'id(dim_wake) = !id(dim_wake);'
              - lvgl.label.update: {id: dim_wake_lbl, text: !lambda 'return id(dim_wake) ? std::string("AN") : std::string("AUS");'}
              - lvgl.label.update: {id: dim_wake_lbl, text_color: !lambda 'return id(dim_wake) ? lv_color_hex(0x22C55E) : lv_color_hex(0x8B94A3);'}
            widgets:
              - label: {text: "Auch beim Abdunkeln", text_font: a15, flex_grow: 1}
              - label: {id: dim_wake_lbl, text: "AN", text_font: a13, text_color: 0x22C55E}
        - label: {id: h_dim_wake, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - button:
            id: dim_hold_btn
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click:
              - lambda: 'id(dim_hold_motion) = !id(dim_hold_motion);'
              - lvgl.label.update: {id: dim_hold_lbl, text: !lambda 'return id(dim_hold_motion) ? std::string("AN") : std::string("AUS");'}
              - lvgl.label.update: {id: dim_hold_lbl, text_color: !lambda 'return id(dim_hold_motion) ? lv_color_hex(0x22C55E) : lv_color_hex(0x8B94A3);'}
            widgets:
              - label: {text: "Nicht abdunkeln bei Bewegung", text_font: a15, flex_grow: 1}
              - label: {id: dim_hold_lbl, text: "AUS", text_font: a13, text_color: 0x8B94A3}
        - label: {id: h_dim_hold, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - obj:
            width: 100%
            height: 22
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center}
            widgets:
              - label: {text: "Empfindlichkeit (beide oben)", styles: [st_muted]}
              - label: {id: dim_sens_lbl, text: "Mittel", text_font: a13, text_color: 0xF1F3F5}
        # Eigener Regler fuer dim_wake/dim_hold_motion, getrennt vom "Empfindlichkeit"-Regler
        # bei "Aufwecken bei" oben (ms_sld/motion_sens) - gleiche Bauart, gleiche Drehung
        # (rechts = empfindlicher).
        - slider:
            id: ds_sld
            width: 180
            height: 26
            align: TOP_MID
            min_value: 0
            max_value: 2
            value: 1
            main: {pad_all: 3}
            indicator:
              bg_color: 0x3B82F6
              focused: {bg_color: 0x60A5FA}
            knob:
              bg_color: 0xF1F3F5
              focused: {bg_color: 0x3B82F6}
            focused: {border_width: 0, outline_width: 0, bg_color: 0x3A424E}
            on_value:
              - lambda: |-
                  int i = (int) x; if (i < 0) i = 0; if (i > 2) i = 2;
                  id(dim_sens) = 2 - i;
              - lambda: |-
                  lv_label_set_text(id(dim_sens_lbl), (const char *[]){"Hoch", "Mittel", "Niedrig"}[id(dim_sens)]);
        - label: {id: h_dim_sens, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - button:
            id: ps_touch_btn
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click:
              - lambda: 'id(ps_touch_wake) = !id(ps_touch_wake);'
              - script.execute: apply_power
            widgets:
              - label: {text: "Touch weckt", text_font: a15, flex_grow: 1}
              - label: {id: ps_touch_lbl, text: "-", text_font: a13, text_color: 0x8B94A3}
        - label: {id: ps_h_touch, width: 216, text: " ", text_font: a13, text_color: 0x8B94A3, long_mode: WRAP}
        - button:
            id: ps_touchms_btn
            width: 100%
            height: 44
            styles: [st_ctrlbtn]
            scrolled: {bg_color: 0x232A35, border_color: 0x232A35, outline_width: 0}
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            on_click:
              - lambda: |-
                  static const int v[] = {50, 100, 200, 300};
                  int i = 0;
                  for (int k = 0; k < 4; k++) if (v[k] == id(ps_touch_ms)) i = k;
                  id(ps_touch_ms) = v[(i + 1) % 4];
              - script.execute: apply_power
            widgets:
              - label: {text: "Touch-Abfrage", text_font: a15, flex_grow: 1}
