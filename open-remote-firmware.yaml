globals:
  # Kamerabild (Standbild): Anzahl Abrufversuche - Abruf kann direkt nach dem Dienstaufruf scheitern.
  - {id: cam_try,           type: int,      restore_value: false, initial_value: "0"}
  # Live-Bild: Bedienung hat Vorrang. Ein Bild dekodieren blockiert die Remote 260-470 ms.
  # last_input_ms = letzte Taste/Beruehrung, live_next_ms = fruehester Start des naechsten Bildes.
  - {id: last_input_ms,     type: uint32_t, restore_value: false, initial_value: "0"}
  - {id: live_next_ms,      type: uint32_t, restore_value: false, initial_value: "0"}
  # Live-Bild (schnell): laeuft bis live_until (millis), live_busy = Download laeuft gerade.
  - {id: live_until,        type: uint32_t, restore_value: false, initial_value: "0"}
  - {id: live_req_ms,       type: uint32_t, restore_value: false, initial_value: "0"}
  - {id: live_busy,         type: bool,     restore_value: false, initial_value: "false"}
  # Live-Bild (Menue > Kameras > Live-Bild): gewaehlte Kamera 0..4.
  - {id: cv_idx,            type: int,      restore_value: false, initial_value: "0"}
  # Touch-Abfrage im Ruhezustand in ms (Einstellung Energie sparen). 50 = normal,
  # groessere Werte sparen etwas Strom, aber kurze Tipps fallen zwischen zwei Abfragen
  # durch (mehrfach tippen noetig, um aufzuwecken).
  - {id: ps_touch_ms,       type: int,      restore_value: true,  initial_value: "75"}
  # Media-Seite: zuletzt markierte Taste der Reihe - << Play >> + (Spalte 0..4). Runter
  # aus Zurueck landet dort; beim ersten Mal (und nach dem Vergessen) auf Play (2).
  - {id: media_btn_col,     type: int,      restore_value: false, initial_value: "2"}
  # Hash der Kompilierzeit der zuletzt gemeldeten Firmware (bleibt ueber Neustarts und
  # OTA erhalten). Weicht er beim Verbinden ab, ist eine NEUE Version live - dann
  # meldet die Remote das einmal an Home Assistant (Haengelampe blinkt).
  - {id: fw_hash,           type: uint32_t, restore_value: true,  initial_value: "0"}
  # Finger liegt dauerhaft auf dem Display (Halten/Wischen): Ruhe-Timer laufend
  # zuruecksetzen (idle_touch_ping), disp_dimmed = Display gerade abgedunkelt.
  - {id: touch_ping_ms,     type: uint32_t, restore_value: false, initial_value: "0"}
  - {id: disp_dimmed,       type: bool,     restore_value: false, initial_value: "false"}
  # Touch-Abfrage im Ruhezustand langsamer (300 ms statt 50 ms), s. backlight_idle_timeout.
  - {id: touch_slow,        type: bool,   restore_value: false, initial_value: "false"}
  - {id: cur_page,       type: int,       restore_value: false, initial_value: "0"}
  - {id: frow,           type: int,       restore_value: false, initial_value: "0"}   # Fokus: Zeile
  - {id: fcol,           type: int,       restore_value: false, initial_value: "0"}   # Fokus: Spalte in der Zeile
  - {id: fdrow,          type: int,       restore_value: false, initial_value: "0"}
  - {id: fdcol,          type: int,       restore_value: false, initial_value: "0"}
  - {id: cur_focus,      type: "void *",  restore_value: false, initial_value: "nullptr"}
  - {id: media_from,     type: int,       restore_value: false, initial_value: "0"}   # 0 = vom Home, 3 = aus WZ
  # Zeitpunkt, an dem die Media-Seite zuletzt ueber go_home verlassen wurde -
  # page_media: on_load vergisst die Markierung, wenn das laenger als 10 s her ist.
  - {id: media_left_ms,  type: uint32_t,  restore_value: false, initial_value: "0"}
  # Media-Karte der Startseite (2026-10-25, Konfigurator "Medienseite von der Startseite"): 0 = Verlassen merkt
  # nichts, die Menuetaste oeffnet danach das Menue (wie bisher); 1 = wie eine gemerkte Seite: die Menuetaste
  # holt die Medienseite im Merkfenster (mem_s) zurueck. media_home_ms = Zeitpunkt des Verlassens (0 = nichts).
  - {id: media_merken,   type: int,       restore_value: true,  initial_value: "0"}
  - {id: media_home_ms,  type: uint32_t,  restore_value: false, initial_value: "0"}
