                  height: 32
                  bg_color: 0x1A1F27
                  radius: 10
                  border_width: 2
                  border_color: 0x1A1F27
                  on_click:
                    - script.execute: svc_cam_aus
                    # Rueckmeldung bleibt eine knappe Sekunde stehen - beim
                    # blossen Antippen waere sie sonst kaum zu sehen.
                    - lambda: |-
                        lv_obj_set_style_bg_color(id(cam_x), lv_color_hex(0x2563EB), LV_PART_MAIN);
                        lv_obj_set_style_border_color(id(cam_x), lv_color_hex(0x60A5FA), LV_PART_MAIN);
                    - delay: 900ms
                    - lambda: |-
                        lv_obj_set_style_bg_color(id(cam_x), lv_color_hex(0x1A1F27), LV_PART_MAIN);
                        lv_obj_set_style_border_color(id(cam_x), lv_color_hex(0x1A1F27), LV_PART_MAIN);
