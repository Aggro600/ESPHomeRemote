  # motion_sens), und fuer dim_hold_motion.
  - {id: dim_sens,       type: int,       restore_value: true,  initial_value: "1"}   # 0 hoch, 1 mittel, 2 niedrig
  - {id: mj_x,           type: int,       restore_value: false, initial_value: "0"}   # Ruck-Erkennung:
  - {id: mj_y,           type: int,       restore_value: false, initial_value: "0"}   # letzte Messung,
  - {id: mj_z,           type: int,       restore_value: false, initial_value: "0"}   # fuer die Differenz
  - {id: mj_have,        type: bool,      restore_value: false, initial_value: "false"}  # erste Messung noch ohne Vorwert
  - {id: mj_cnt,         type: int,       restore_value: false, initial_value: "0"}   # Haelt zwei Messungen in Folge ab,
                                                                                        # bevor sie zaehlt (gegen einzelne Ausreisser)
  # Dieselbe Ruck-Erkennung, aber als Ersatz fuer den unzuverlaessigen GPIO2-Hardware-Interrupt
  # bei "Aufwecken bei" = Bewegung (motion_mode 1) - eigene Messwerte, damit sich diese Erkennung
  # nicht mit der von dim_hold_motion (oben) in die Quere kommt.
  - {id: bw_x,           type: int,       restore_value: false, initial_value: "0"}
  - {id: bw_y,           type: int,       restore_value: false, initial_value: "0"}
  - {id: bw_z,           type: int,       restore_value: false, initial_value: "0"}
  - {id: bw_have,        type: bool,      restore_value: false, initial_value: "false"}
  - {id: bw_cnt,         type: int,       restore_value: false, initial_value: "0"}

i2c:
  id: hauptbus
  sda: GPIO20
  scl: GPIO19
  scan: true

lis3dh:
  id: motion_chip

http_request:
  # Pflicht-Abhaengigkeit von online_image (Cover-Art fuer die Media-Player-
  # Seite). Syntax/Vorlage aus open-remote.yaml uebernommen, hier aber an
  # die echte HA-Instanz und media_player.android_tv (ent_adb)
  # angebunden statt an den Platzhalter media_player.wohnzimmer.
  verify_ssl: false
  # Kuerzer als der Standard (4,5 s): haengt ein Abruf (WLAN im Sparmodus, HA beschaeftigt),
  # blockiert er die Remote sonst so lange.
  timeout: 2500ms

# Cover-Art fuer die Media-Player-Seite (mp_cover_url-Textsensor unten setzt
# die echte URL per online_image.set_url, sobald HA eine entity_picture
# liefert). Platzhalter-URL hier nur fuers Schema - wird beim Boot noch
# nicht abgerufen (update_interval ist "never", siehe online_image-Default).
image:
  - platform: online_image
    id: mp_cover_image
    url: "http://${ha_host}/"
    # Cover als Vollbild-Hintergrund der Media-Seite (240x320, volle
    # Displayaufloesung). JPEG, weil es der einzige Format+Groessen-Weg
    # ohne die zwei Bugs ist, die BMP hier gezeigt hat (Haeppchen-Farbfehler
    # bei >64-KB-Downloadpuffer, Stride-Streifen bei LVGL-scale) - s.
    # ausfuehrliche Format-Historie in smarttube_cover_resize.py.
    #
    # Zwei echte Bugs geloest, live gegen das Geraet verifiziert (nicht
    # geraten):
    # 1. Absturz beim Dekodieren (JpegDecoder ~20-30 KB fester Speicher per
    #    plain `new`, ESPHomes psram-Default CONFIG_SPIRAM_USE_CAPS_ALLOC
    #    macht new/malloc NIE automatisch PSRAM-faehig) - behoben ueber
    #    sdkconfig_options (CONFIG_SPIRAM_USE_MALLOC, s. esp32:-Block oben).
    # 2. byte_order: BIG_ENDIAN (aus der .rgb565-Wallpaper-Logik der
    #    SD-Version uebernommen, wo eigener Code das lv_image_dsc_t von Hand
    #    baut) war fuer diesen eingebauten online_image-Weg falsch - echte
    #    Fotos kamen als reines Rauschen an (RGB565 zerlegt bei falschem
    #    Byte-Swap jeden Pixel komplett neu). KEIN byte_order: hier =
    #    Default LITTLE_ENDIAN, damit korrekt.
    format: JPEG
    type: RGB565
    # home_cover_image erst NACH diesem Download anstossen (egal ob
    # erfolgreich oder Fehler), nicht mehr gleichzeitig aus refresh_cover
    # (Stand 2026-09-17, Nutzerhinweis "Cover wird auf dem Homescreen nicht
    # zuverlaessig geladen, auf der Media-Player-Seite schon"). Beide
    # Downloads liefen vorher back-to-back ohne Pause - zwei echte,
    # ueberlappende HTTP-Downloads auf demselben ESP32 sind ein bekannt
    # wackliger Fall (geteilter http_request-Client/Puffer), und
    # mp_cover_image lief immer zuerst los. Damit war die Zweitanfrage
    # (home_cover_image) die, die haeufiger scheiterte. Jetzt strikt
    # nacheinander.
    on_download_finished:
      - lvgl.image.update: {id: media_cover, src: mp_cover_image}
      - script.execute: sd_logo_pruefen
      # Pause, BEVOR das zweite Bild geholt wird. Ohne sie scheiterte der
      # Startseiten-Download reproduzierbar in derselben Millisekunde mit
      # ESP_ERR_HTTP_CONNECT (live nachgewiesen 2026-09-18): dieser
      # Callback laeuft noch waehrend der erste Download abgeraeumt wird,
      # der gemeinsame http_request-Client ist dann noch nicht wieder frei
      # (er meldet sein Fehler-Flag auch erst rund eine Sekunde spaeter
      # wieder ab). Folge war: Media-Player-Seite hatte ein Cover, die
      # Startseite nie.
      - delay: 1500ms
      - online_image.set_url:
          id: home_cover_image
          url: "http://${ha_host}/local/esphomeremote_smarttube_cover_home_${device_name}.jpg"
    on_error:
      - lvgl.widget.hide: media_cover
      - script.execute: sd_logo_pruefen
      - delay: 1500ms
      - online_image.set_url:
          id: home_cover_image
          url: "http://${ha_host}/local/esphomeremote_smarttube_cover_home_${device_name}.jpg"
  # Zweites, kleineres Banner fuer die Player-Karte auf der Startseite
  # (page_home, home_player_btn/home_cover_img) - server-seitig SCHON auf
  # 216x160 zugeschnitten (smarttube_cover_resize.py, HOME_SIZE), damit das
  # Geraet nicht selbst skalieren muss - gleiches Groessen-Match-Prinzip wie
  # bei mp_cover_image (240x320 = volle Displayaufloesung). Wird jetzt erst
  # NACH mp_cover_image angestossen (s. dessen on_download_finished/on_error
  # oben), nicht mehr gleichzeitig - Platzhalter-URL hier aus demselben
  # Grund wie bei mp_cover_image oben (echte URL kommt beim ersten
  # refresh_cover per set_url).
  - platform: online_image
    id: home_cover_image
    url: "http://${ha_host}/"
    format: JPEG
    type: RGB565
    on_download_finished:
      - lvgl.image.update: {id: home_cover_img, src: home_cover_image}
      - script.execute: sd_logo_pruefen
    on_error:
      - lambda: 'ESP_LOGW("cover", "Startseiten-Cover-Download fehlgeschlagen");'

  # Klingel-Bild (Haustuer): dasselbe Foto wie aufs Handy, in HA auf 216x112
  # verkleinert (doorbell_image.py). Wird vom Dienst doorbell_image nachgeladen.
  - platform: online_image
    id: db_haus_image
    url: "http://${ha_host}/"
    format: JPEG
    type: RGB565
    on_download_finished:
      - lvgl.image.update: {id: db_img_haus, src: db_haus_image}
      - lvgl.widget.show: db_img_haus
      - lvgl.widget.hide: db_ph_haus
    on_error:
      - lambda: 'ESP_LOGW("klingel", "Klingelbild (Haustuer) konnte nicht geladen werden");'
  # Klingel-Bild (Wohnungstuer): dasselbe Foto wie aufs Handy, in HA auf 216x112
  # verkleinert (doorbell_image.py). Wird vom Dienst doorbell_image nachgeladen.
  - platform: online_image
    id: db_wohn_image
    url: "http://${ha_host}/"
    format: JPEG
    type: RGB565
    on_download_finished:
      - lvgl.image.update: {id: db_img_wohn, src: db_wohn_image}
      - lvgl.widget.show: db_img_wohn
      - lvgl.widget.hide: db_ph_wohn
    on_error:
      - lambda: 'ESP_LOGW("klingel", "Klingelbild (Wohnungstuer) konnte nicht geladen werden");'

  # Schnelles Live-Bild: HA schreibt ~45 s lang laufend neue Bilder (live_image.py), die
  # Remote laedt sie fortlaufend nach (script live_loop), sobald das letzte fertig ist.
  - platform: online_image
    id: cam_fast_image
    url: "http://${ha_host}/"
    format: JPEG
    type: RGB565
    on_download_finished:
      - lvgl.image.update: {id: cf_img, src: cam_fast_image}
      - lvgl.widget.show: cf_img
      - lvgl.widget.hide: cf_ph
      # 350 ms Pause bis zum naechsten Bild: Tasten/Touch werden in den Luecken bedient.
      - lambda: |-
          id(live_busy) = false;
          id(live_next_ms) = millis() + 350;
      - lvgl.label.update: {id: cf_state, text: "Live"}
    on_error:
      - lambda: |-
          id(live_busy) = false;
          id(live_next_ms) = millis() + 1500;

  # Live-Bild einer Kamera (Menue > Kameras > Live-Bild): Snapshot von HA, dort auf
  # 216x122 verkleinert (cam_image.py). Wird vom Dienst cam_image (HA) nachgeladen.
  - platform: online_image
    id: cam_live_image
    url: "http://${ha_host}/"
    format: JPEG
    type: RGB565
    on_download_finished:
      - lvgl.image.update: {id: cv_img, src: cam_live_image}
      - lvgl.widget.show: cv_img
      - lvgl.widget.hide: cv_ph
      - lvgl.label.update: {id: cv_state, text: "Aktuell"}
    on_error:
      # Abruf scheiterte (z. B. ESP_ERR_HTTP_CONNECT direkt nach dem Dienstaufruf): bis zu
      # 5 Mal wiederholen, aber nur solange die Seite offen ist und gerade niemand bedient.
      - lambda: |-
          id(cam_try)++;
          ESP_LOGW("kamera", "Kamerabild-Abruf gescheitert (Versuch %d)", id(cam_try));
      - if:
          condition: {lambda: "return id(cam_try) < 5 && id(cur_page) == 37;"}
          then:
            - delay: 1500ms
            - script.execute: cam_load
          else:
            - lvgl.label.update: {id: cv_state, text: "Bild nicht geladen - Aktualisieren"}

display:
  - platform: ili9341_i80
    id: main_display
    cs_pin: GPIO39
    dc_pin: GPIO40
    wr_pin: GPIO41
    rd_pin: GPIO42
    enable_pin: {number: GPIO38}
    invert_colors: true
    data_pins: [GPIO48, GPIO47, GPIO21, GPIO14, GPIO13, GPIO12, GPIO11, GPIO10]
    dimensions: {width: 240, height: 320}
    # Die Referenz-Firmware faehrt LovyanGFX mit 40 MHz; ihr eigenes
    # Ghost-Touch-Protokoll (Changelog 2.42/2.46) sagt aber, dass ein
    # niedrigerer Takt weniger Stoerung in den I2C-Touch-Bus einkoppelt.
    bus_frequency: 20MHz
    # update() schiebt nichts mehr zum Panel - LVGL schickt nur noch die
    # geaenderten Rechtecke ueber draw_pixels_at(). Vorher ging alle 16 ms der
    # komplette Framebuffer raus, egal ob sich etwas geaendert hatte: genau das
    # hat den Bus gesaettigt und die Bilder zerrissen.
    update_interval: 1s

touchscreen:
  - platform: ft63x6
    id: main_touch
    display: main_display
    transform:
      mirror_x: true
      mirror_y: true
    on_touch:
      # ZUERST festhalten, ob das Display dunkel war - wake_backlight setzt
      # disp_off sofort zurueck, danach waere es nicht mehr feststellbar.
      - lambda: |-
          if (id(touch_active)) return;
          id(touch_active) = true;
          id(touch_moved) = false;
          id(touch_was_dark) = id(disp_off);
          id(touch_x) = touch.x;
          id(touch_y) = touch.y;
          lv_obj_t *scr0 = lv_screen_active();
          id(touch_sy0) = scr0 ? lv_obj_get_scroll_y(scr0) : 0;
          id(touch_page0) = id(cur_page);
          id(last_input_ms) = millis();
          // Touch-Test: Punkt setzen und Ring an die Fingerposition.
          if (id(cur_page) == 36) {
            id(tt_x) = touch.x; id(tt_y) = touch.y;
            id(tt_press)->execute();
            id(tt_move)->execute();
          }
      - script.execute: wake_backlight
    on_update:
      - lambda: |-
          // Solange der Finger liegt (langes Halten/Wischen) kommt nach dem ersten
          // Tipp kein neues Ereignis - der Display-Timeout lief trotzdem weiter und
          // dimmte/schaltete aus. Deshalb jede Sekunde den Ruhe-Timer erneuern.
          if (id(touch_active) && (millis() - id(touch_ping_ms)) > 1000) {
            id(touch_ping_ms) = millis();
            id(idle_touch_ping)->execute();
          }
          if (id(cur_page) == 36) {
            for (auto t : touches) { id(tt_x) = t.x; id(tt_y) = t.y; }
            id(tt_move)->execute();
          }
          bool neu_bewegt = false;
          for (auto t : touches) {
            if (abs(t.x - id(touch_x)) > 8 || abs(t.y - id(touch_y)) > 8) {
              if (!id(touch_moved)) neu_bewegt = true;
              id(touch_moved) = true;
            }
          }
          // Sobald aus der Beruehrung ein Wischen wird, die laufende Eingabe
          // bei LVGL abbrechen. Auf scrollbaren Seiten macht LVGL daraus von
          // selbst ein Scrollen und verwirft den Klick - auf der Startseite
          // gibt es aber nichts zu scrollen, dort bleibt der Druck am Knopf
          // haengen und wird beim Abheben ausgeloest, obwohl der Finger
          // laengst woanders ist. lv_indev_reset beendet die Eingabe sauber,
          // ohne ein Klick-Ereignis zu erzeugen.
          if (neu_bewegt) {
            lv_obj_t *sc = lv_screen_active();
            if (sc != nullptr && !lv_obj_has_flag(sc, LV_OBJ_FLAG_SCROLLABLE)) {
              lv_indev_t *ind = lv_indev_get_next(nullptr);
              while (ind != nullptr) {
                if (lv_indev_get_type(ind) == LV_INDEV_TYPE_POINTER)
                  lv_indev_reset(ind, nullptr);
                ind = lv_indev_get_next(ind);
              }
            }
          }
    on_release:
      - lambda: |-
          id(touch_active) = false;
          if (id(cur_page) == 36) lv_obj_add_flag(id(tt_ring), LV_OBJ_FLAG_HIDDEN);
output:
  - platform: ledc
    id: backlight_pwm
    pin: {number: GPIO9, inverted: true}
  - platform: ledc
    id: button_backlight_pwm
    pin: {number: GPIO46}

light:
  - platform: monochromatic
    id: display_backlight
    output: backlight_pwm
    default_transition_length: 120ms
    restore_mode: ALWAYS_ON
  - platform: monochromatic
    id: button_backlight
    output: button_backlight_pwm
    default_transition_length: 120ms
    restore_mode: ALWAYS_OFF        # Tastenbeleuchtung standardmaessig aus

interval:
  # WLAN-Wache: ist das Display an und das WLAN "verbunden", aber Home Assistant nicht erreichbar
  # (kein API-Client), greift nach 30 s Stufe 1 (Sparmodus neu setzen) und nach 90 s Stufe 2
  # (WLAN neu starten). Im Ruhezustand ist die Trennung gewollt (WLAN aus/Sparstufen) - dann zaehlt nichts.
  - interval: 10s
    then:
      - lambda: |-
          const bool wach = !id(disp_off) && !id(ota_aktiv) && !id(clean_mode);
          const bool wlan = wifi::global_wifi_component->is_connected();
          const bool api_ok = api::global_api_server->is_connected();
          if (!wach || !wlan || api_ok) { id(api_down_s) = 0; return; }
          id(api_down_s) += 10;
      - if: {condition: {lambda: "return id(api_down_s) == 30;"}, then: [{script.execute: wifi_heilen}]}
      - if: {condition: {lambda: "return id(api_down_s) == 90;"}, then: [{script.execute: wifi_neu}]}
  # Positionsanzeige weiterzaehlen (Media-Seite offen und Wiedergabe laeuft - oder Startseite mit
  # ausgeklappter, grosser Player-Karte: dort zeigt der Fortschrittsbalken jetzt mit, Nutzerwunsch
  # 2026-09-22 "unterm Interpret").
  - interval: 1s
    then:
      - if:
          condition: {lambda: 'return ((id(cur_page) == 6) || (id(cur_page) == 0 && !id(home_cams_visible))) && id(media_pos_s) >= 0 && id(mp_state).state == "playing";'}
          then: [{script.execute: update_media_pos}]
  # Hochheben erkennen: Winkel zwischen aktuellem Schwerkraftvektor und der
  # Lage beim Ablegen. Pollen, sobald das Display aus ist ODER (nur abgedunkelt
  # ist UND der Schalter "Auch beim Abdunkeln" an ist) und der Modus aktiv ist -
  # sonst kostet es unnoetig I2C-Verkehr. Die Lage "beim Ablegen" wird in beiden
  # Faellen frisch erfasst (capture_baseline in backlight_idle_timeout, sowohl
  # beim Abdunkeln als auch beim Ausschalten).
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: "return (id(disp_off) || (id(disp_dimmed) && id(dim_wake))) && id(motion_mode) == 2;"
          then:
            - lambda: |-
                uint8_t d[6];
                if (!id(motion_chip)->read_bytes(0x28 | 0x80, d, 6)) return;
                const float x = ((int16_t)((uint16_t) d[1] << 8 | d[0])) >> 4;
                const float y = ((int16_t)((uint16_t) d[3] << 8 | d[2])) >> 4;
                const float z = ((int16_t)((uint16_t) d[5] << 8 | d[4])) >> 4;
                const float bx = id(mb_x), by = id(mb_y), bz = id(mb_z);
                const float mb = sqrtf(bx*bx + by*by + bz*bz);
                const float mc = sqrtf(x*x + y*y + z*z);
                if (mb < 1.0f || mc < 1.0f) return;
                float cosang = (x*bx + y*by + z*bz) / (mb * mc);
                if (cosang > 1.0f) cosang = 1.0f;
                if (cosang < -1.0f) cosang = -1.0f;
                const float deg = acosf(cosang) * 57.2957795f;
                // Schwellen gesenkt (vorher 25/40/60) - beim normalen
                // Hochnehmen kippt die Fernbedienung weniger weit als
                // angenommen. Die Haltezeit von 750 ms filtert das Wackeln
                // ohnehin, der Winkel darf daher kleiner sein.
                const float lim[3] = {12.0f, 20.0f, 35.0f};
                // Beim eigentlichen Aufwecken (disp_off) gilt weiter die eingespielte
                // Empfindlichkeit "Aufwecken bei" (motion_sens). Beim Abdunkeln greift
                // stattdessen die eigene, getrennte Empfindlichkeit (dim_sens).
                int i = id(disp_off) ? id(motion_sens) : id(dim_sens);
                if (i < 0) i = 0;
                if (i > 2) i = 2;

                // Wackeln auf der Couch kippt die Fernbedienung kurz und laesst
                // sie zurueckfallen - der Winkel ist also nur einen Augenblick
                // gross. Echtes Hochnehmen HAELT die neue Lage. Deshalb erst
                // wecken, wenn die Abweichung mehrere Messungen ueberdauert
                // (3 x 250 ms = 750 ms), statt beim ersten Ausschlag.
                if (deg >= lim[i]) {
                  id(lift_cnt)++;
                  ESP_LOGD("motion", "Winkel %.0f Grad (%d/3)", deg, id(lift_cnt));
                  if (id(lift_cnt) >= 3) {
                    ESP_LOGI("motion", "Hochheben erkannt: %.0f Grad, gehalten (%s)", deg,
                             id(disp_off) ? "war aus" : "war abgedunkelt");
                    id(lift_cnt) = 0;
                    // Das Icon erst HIER, wenn wirklich etwas passiert - nicht schon bei der
                    // ersten Einzelmessung ueber der Schwelle (sonst blinkt es, ohne dass sich
                    // am Display etwas tut - genau das hatte der Nutzer bemaengelt 2026-09-22).
                    id(motion_icon_blip)->execute();
                    // War die Remote nur abgedunkelt (noch nicht in disp_off): idle_touch_ping
                    // hellt auf UND setzt den Ruhe-Timer zurueck, wie ein Tipp auf den Schirm.
                    // wake_backlight bleibt fuer den Weg aus disp_off/Tiefschlaf-Anlauf.
                    if (id(disp_off)) {
                      id(wake_backlight)->execute();
                    } else {
                      id(idle_touch_ping)->execute();
                    }
                  }
                } else if (id(lift_cnt) != 0) {
                  ESP_LOGD("motion", "Winkel wieder unter Schwelle (%.0f Grad) - verworfen", deg);
                  id(lift_cnt) = 0;
                }

  # Option "Nicht abdunkeln bei Bewegung" (dim_hold_motion): Ruck zwischen zwei aufeinander
  # folgenden Messungen statt Winkel-zur-Ablage - so zaehlt JEDE Handhabung, nicht nur eine
  # bestimmte Endlage. Laeuft nur, solange das Display noch hell UND nicht abgedunkelt ist;
  # ist sie schon abgedunkelt, ist stattdessen "Auch beim Abdunkeln" (dim_wake) zustaendig.
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: "return !id(disp_off) && !id(disp_dimmed) && id(dim_hold_motion);"
          then:
            - lambda: |-
                uint8_t d[6];
                if (!id(motion_chip)->read_bytes(0x28 | 0x80, d, 6)) return;
                const float x = ((int16_t)((uint16_t) d[1] << 8 | d[0])) >> 4;
                const float y = ((int16_t)((uint16_t) d[3] << 8 | d[2])) >> 4;
                const float z = ((int16_t)((uint16_t) d[5] << 8 | d[4])) >> 4;
                if (!id(mj_have)) {
                  // Erste Messung nach dem Einschalten/Aufwachen: nur merken, noch nicht
                  // vergleichen - sonst zaehlt der Sprung vom letzten (veralteten) Wert.
                  id(mj_x) = (int) x; id(mj_y) = (int) y; id(mj_z) = (int) z;
                  id(mj_have) = true;
                  return;
                }
                const float dx = x - id(mj_x), dy = y - id(mj_y), dz = z - id(mj_z);
                id(mj_x) = (int) x; id(mj_y) = (int) y; id(mj_z) = (int) z;
                const float ruck = sqrtf(dx*dx + dy*dy + dz*dz);
                // Echte Messung (2026-09-23, 90s im Ruhezustand liegend): 41 Auslöser, Werte
                // 51-180, Median 72 - die vorige Schwelle {50,90,150} war also selbst bei
                // "Niedrig" noch zu niedrig. Erst {200,350,550}, auf Nutzerwunsch ("bei Hoch
                // bitte noch etwas empfindlicher") wieder etwas gesenkt - die drei Messungen in
                // Folge (750 ms) bleiben als Schutz gegen einzelne Ausreisser bestehen, das faengt
                // kurze Stoerspitzen weiterhin ab. Bei zu vielen Fehlauslösern hilft "Mittel"
                // statt "Hoch". Eigene Empfindlichkeit (dim_sens), nicht die von "Aufwecken bei".
                const float lim[3] = {120.0f, 250.0f, 400.0f};
                int i = id(dim_sens);
                if (i < 0) i = 0;
                if (i > 2) i = 2;
                if (ruck >= lim[i]) {
                  id(mj_cnt)++;
                  ESP_LOGD("motion", "Ruck %.0f (Schwelle %.0f, %d/3)", ruck, lim[i], id(mj_cnt));
                  if (id(mj_cnt) >= 3) {
                    id(mj_cnt) = 0;
                    ESP_LOGI("motion", "Ruck erkannt: %.0f - Abdunkeln aufgeschoben", ruck);
                    // Icon erst hier (siehe gleiche Begruendung oben bei "Hochheben").
                    id(motion_icon_blip)->execute();
                    id(idle_touch_ping)->execute();
                  }
                } else {
                  id(mj_cnt) = 0;
                }
          else:
            - lambda: 'id(mj_have) = false; id(mj_cnt) = 0;'   # naechstes Mal wieder frisch anfangen, kein Sprung ueber die Pause

  # "Aufwecken bei" = Bewegung (motion_mode 1): jetzt mit denselben gehaerteten Werten wie
  # "Nicht abdunkeln bei Bewegung" oben - echte Messung 2026-09-23 (90s Ruhezustand liegend)
  # ergab 41 Fehlauslöser mit Werten 51-180, darum {200,350,550} und drei Messungen in Folge
  # (750 ms) statt zwei, wie beim Hochheben.
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: "return (id(disp_off) || (id(disp_dimmed) && id(dim_wake))) && id(motion_mode) == 1;"
          then:
            - lambda: |-
                uint8_t d[6];
                if (!id(motion_chip)->read_bytes(0x28 | 0x80, d, 6)) return;
                const float x = ((int16_t)((uint16_t) d[1] << 8 | d[0])) >> 4;
                const float y = ((int16_t)((uint16_t) d[3] << 8 | d[2])) >> 4;
                const float z = ((int16_t)((uint16_t) d[5] << 8 | d[4])) >> 4;
                if (!id(bw_have)) {
                  id(bw_x) = (int) x; id(bw_y) = (int) y; id(bw_z) = (int) z;
                  id(bw_have) = true;
                  return;
                }
                const float dx = x - id(bw_x), dy = y - id(bw_y), dz = z - id(bw_z);
                id(bw_x) = (int) x; id(bw_y) = (int) y; id(bw_z) = (int) z;
                const float ruck = sqrtf(dx*dx + dy*dy + dz*dz);
                // Gleiche Anpassung wie beim Ruck-Intervall oben (Nutzerwunsch 2026-09-23: bei
                // Hoch noch etwas empfindlicher) - drei Messungen in Folge bleiben als Schutz.
                const float lim[3] = {120.0f, 250.0f, 400.0f};
                int i = id(disp_off) ? id(motion_sens) : id(dim_sens);
                if (i < 0) i = 0;
                if (i > 2) i = 2;
                if (ruck >= lim[i]) {
                  id(bw_cnt)++;
                  ESP_LOGD("motion", "Bewegung-Ruck %.0f (Schwelle %.0f, %d/3)", ruck, lim[i], id(bw_cnt));
                  if (id(bw_cnt) >= 3) {
                    id(bw_cnt) = 0;
                    ESP_LOGI("motion", "Bewegung erkannt: %.0f (%s)", ruck, id(disp_off) ? "war aus" : "war abgedunkelt");
                    id(motion_icon_blip)->execute();
                    if (id(disp_off)) {
                      id(wake_backlight)->execute();
                    } else {
                      id(idle_touch_ping)->execute();
                    }
                  }
                } else {
                  id(bw_cnt) = 0;
                }
          else:
            - lambda: 'id(bw_have) = false; id(bw_cnt) = 0;'

  # Ergebnis des fruehen Leitungstests ausgeben, sobald das Log haengt.
  - interval: 1s
    then:
      # Nur aktualisieren, wenn die Uhr auch zu sehen ist. Sie bleibt zwar als
      # Platzhalter stehen, damit die Statuszeile ihre Form behaelt - aber der
      # sekuendliche Textwechsel wuerde die Flaeche jedes Mal als veraendert
      # markieren und LVGL zum Neuzeichnen zwingen, ohne dass sich sichtbar
      # etwas tut. Wenig Aufwand, aber unnoetiger.
      - if:
          condition: {lambda: "return id(show_clock) && !id(disp_off);"}
          then:
            - lvgl.label.update:
                id: idle_clock
                text: !lambda |-
                  auto t = id(sntp_time).now();
                  if (!t.is_valid()) return std::string("--:--");
                  char b[6]; snprintf(b,sizeof(b),"%02d:%02d",t.hour,t.minute);
                  return std::string(b);
      # Countdown "Timer Wohnung" NEBEN der Uhr (Nutzerwunsch 2026-09-17:
      # "neben der Uhr, nicht statt der Uhr") - unabhaengig von show_clock,
      # eigener kleiner Indikator. Lokale Sekunde runterzaehlen: HA schickt
      # das "remaining"-Attribut nur bei Start/Pause/Ende neu, nicht jede
      # Sekunde (s. timer_wohnung_remaining_attr weiter unten).
      - if:
          condition: {lambda: "return id(timer_wohnung_active) && !id(disp_off);"}
          then:
            - lvgl.label.update:
                id: timer_wohnung_lbl
                text: !lambda |-
                  // Restzeit aus dem Endzeitpunkt (finishes_at) - sonst, solange
                  // Uhrzeit oder Endzeit fehlen, sekundenweise runterzaehlen.
                  auto jetzt = id(sntp_time).now();
                  if (id(timer_wohnung_end) > 0 && jetzt.is_valid()) {
                    const long r = (long) id(timer_wohnung_end) - (long) jetzt.timestamp;
                    id(timer_wohnung_remaining) = r > 0 ? (int) r : 0;
                  } else if (id(timer_wohnung_remaining) > 0) {
                    id(timer_wohnung_remaining) -= 1;
                  }
                  int total = id(timer_wohnung_remaining);
                  if (total < 0) total = 0;
                  int hh = total / 3600, mm = (total % 3600) / 60, ss = total % 60;
                  char b[12];
                  if (hh > 0) snprintf(b, sizeof(b), "%d:%02d:%02d", hh, mm, ss);
                  else        snprintf(b, sizeof(b), "%d:%02d", mm, ss);
                  return std::string(b);

  # Speicher-Diagnose (Fehlersuche: HA konnte die Remote zeitweise nicht einrichten).
  - interval: 10s
    then:
      - lambda: |-
          ESP_LOGD("heap", "intern frei %u KB (groesster Block %u KB), PSRAM frei %u KB",
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024),
                   (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024),
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024));

  # Tiefschlaf-Sicherheitsnetz: deep_ruhe_timer laeuft nur einmal je Display-Aus.
  # Endet er ohne Schlaf (Ladekabel, Sprachabfrage ...), probiert dieser Timer
  # es alle 4 min neu, solange das Display aus ist. Laeuft er noch, wird er
  # NICHT neu gestartet (sonst begaenne sein Countdown immer wieder von vorn).
  - interval: 4min
    then:
      - if:
          condition:
            and:
              - not: {script.is_running: deep_ruhe_timer}
              - lambda: 'return id(disp_timeout_s) > 0 && id(disp_off) && (id(ps_deep) || id(low_bat)) && remote_strom::eff_deep_s(id(ps_deep_s), id(ps_deep_tv_s), id(tv_on), id(low_bat)) >= 0 && !id(testmodus) && !id(boot_grace) && id(api_ever) && !id(laedt) && !id(charger_present).state && !id(voice_active) && !id(host_mic) && !id(ota_aktiv) && (int32_t)(millis() - id(wartung_bis)) >= 0;'
          then:
            - script.execute: deep_ruhe_timer

script:
  # ---- Ruhe-Zeiten (Einstellungen > Energie sparen) ----------------------------
  # Alle starten gleichzeitig beim Display-AUS (backlight_idle_timeout) und
  # zaehlen ab da - jede Zeit ist einzeln einstellbar. wake_backlight stoppt
  # sie, sobald jemand die Remote benutzt. Bei niedrigem Akku (low_bat) gelten
  # gekuerzte Zeiten und die Schalter sind uebersteuert (open-remote-strom.h).
  #
  # WLAN aus: ps_wifi_off_s Sekunden nach Display-Aus (0 = sofort).
  - id: wifi_ruhe_timer
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t) remote_strom::eff_wifi_s(id(ps_wifi_off_s), id(low_bat)) * 1000;'
      - if:
          condition:
            lambda: "return id(disp_off) && (id(ps_wifi_off) || id(low_bat)) && !id(testmodus) && !id(boot_grace) && (int32_t)(millis() - id(wartung_bis)) >= 0 && !id(ota_aktiv);"
          then:
            - lambda: 'ESP_LOGI("strom", "WLAN aus (%d s nach Display-Aus)", id(ps_wifi_off_s));'
            - wifi.disable:

  # Prozessor drosseln: ps_cpu_s Sekunden nach Display-Aus (0 = sofort), 80 statt
  # 240 MHz. wake_backlight nimmt es sofort zurueck.
  - id: cpu_ruhe_timer
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t) remote_strom::eff_cpu_s(id(ps_cpu_s), id(low_bat)) * 1000;'
      - lambda: 'id(cpu_low) = true;'
      - script.execute: apply_cpu

  # Bluetooth langsam: ps_ble_s Sekunden nach Display-Aus. Intervall 150 ms +
  # Slave-Latency 3, damit der Funk im Leerlauf nur ~alle 600 ms statt alle
  # 15 ms aufwacht. Der HID-Link bleibt - ein Tastendruck geht beim naechsten
  # Event raus. NICHT waehrend einer Sprachabfrage.
  - id: ble_ruhe_timer
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t) remote_strom::eff_ble_s(id(ps_ble_s), id(low_bat)) * 1000;'
      - if:
          condition:
            lambda: 'return id(disp_off) && (id(ps_bleidle) || id(low_bat)) && !id(voice_active) && !id(host_mic);'
          then:
            - lambda: 'id(kb).request_conn_profile(true);'

  # Tiefschlaf: ps_deep_s Sekunden nach Display-Aus (bei laufendem Fernseher
  # ps_deep_tv_s). Der Chip schaltet sich fast ganz ab und wacht NUR auf, wenn du
  # ihn weckst (Taste, Anheben, Ladekabel) - kein Timer-Wake. Nicht am Ladekabel,
  # nicht waehrend einer Sprachabfrage. Die Wartezeit wird jede Sekunde neu
  # bewertet, damit ein wechselnder Fernseher-Status sofort greift.
  - id: deep_ruhe_timer
    mode: restart
    then:
      - lambda: 'id(deep_t0) = millis();'
      - while:
          condition:
            lambda: |-
              // Tiefschlaf aus (und kein Akku-Sparmodus): gar nicht erst warten -
              // das Sicherheitsnetz (alle 4 min) startet den Timer bei Bedarf neu.
              if (!id(disp_off) || !(id(ps_deep) || id(low_bat))) return false;
              const int lim = remote_strom::eff_deep_s(id(ps_deep_s), id(ps_deep_tv_s), id(tv_on), id(low_bat));
              return lim < 0 || (millis() - id(deep_t0)) < (uint32_t) lim * 1000;
          then:
            - delay: 5s
      - if:
          condition:
            lambda: 'return id(disp_off) && (id(ps_deep) || id(low_bat)) && remote_strom::eff_deep_s(id(ps_deep_s), id(ps_deep_tv_s), id(tv_on), id(low_bat)) >= 0 && !id(testmodus) && !id(boot_grace) && id(api_ever) && !id(laedt) && !id(charger_present).state && !id(voice_active) && !id(host_mic) && !id(ota_aktiv) && (int32_t)(millis() - id(wartung_bis)) >= 0;'
          then:
            - lambda: |-
                ESP_LOGI("schlaf", "Tiefschlaf: %d s nach Display-Aus - Deep-Sleep (Wecken: Taste/Bewegung/Ladekabel)", (int) ((millis() - id(deep_t0)) / 1000));
                // Nur merken, wenn der Nutzer den Tiefschlaf selbst eingeschaltet
                // hat - ein Schlaf wegen niedrigem Akku darf die Einstellung
                // nach dem Aufwachen nicht auf AN setzen.
                g_deep_active = id(ps_deep) ? 0x5EEEu : 0;
            - script.execute: deep_sleep_powerdown
            - deep_sleep.enter:
                id: nachtschlaf

  - id: backlight_idle_timeout
    mode: restart
    then:
      # Optional erst abdunkeln (ps_dim_s < Display-Timeout), dann ausschalten.
      # wake_backlight stellt die volle Helligkeit bei jeder Bedienung wieder her.
      - if:
          condition:
            lambda: "return id(ps_dim_s) > 0 && id(ps_dim_s) < remote_strom::eff_disp_s(id(disp_timeout_s), id(low_bat));"
          then:
            - delay: !lambda 'return (uint32_t) id(ps_dim_s) * 1000;'
            - light.turn_on:
                id: display_backlight
                brightness: !lambda 'return fmaxf(0.03f, (id(disp_bri) / 100.0f) * (id(ps_dim_pct) / 100.0f));'
            - lambda: 'id(disp_dimmed) = true;'
            # Lage beim Abdunkeln merken, damit "Hochheben" auch aus dem abgedunkelten
            # Zustand (noch nicht disp_off) aufhellen kann, nicht erst nach dem Ausschalten.
            - script.execute: capture_baseline
            - delay: !lambda 'return (uint32_t) (remote_strom::eff_disp_s(id(disp_timeout_s), id(low_bat)) - id(ps_dim_s)) * 1000;'
          else:
            - delay: !lambda 'return (uint32_t) remote_strom::eff_disp_s(id(disp_timeout_s), id(low_bat)) * 1000;'
      - light.turn_off: display_backlight
      - light.turn_off: button_backlight
      - globals.set: {id: disp_off, value: "true"}
      - globals.set: {id: lift_cnt, value: "0"}
      # Reine Anzeigewerte anhalten, solange niemand hinschaut. Der Akkustand
      # laeuft weiter (alle 20 s ein I2C-Read faellt nicht ins Gewicht).
      # Die BLE-Empfangsstaerke fragt die Tastatur-Komponente selbst ab, nicht
      # der Sensor - component.suspend greift dort nicht. Stattdessen das
      # Intervall auf eine Stunde setzen, das haelt sie praktisch an.
      - lambda: 'id(kb).set_rssi_update_interval(3600000);'
      - component.suspend: wifi_rssi
      - component.suspend: ble_host_txt
      # WLAN-Sparmodus "max" im Ruhezustand (falls gewaehlt).
      - script.execute: apply_wifi_ps
      # Die einstellbaren Ruhe-Zeiten starten (s. oben).
      - script.execute: wifi_ruhe_timer
      - script.execute: ble_ruhe_timer
      - script.execute: deep_ruhe_timer
      - script.execute: capture_baseline
      - script.execute: cpu_ruhe_timer
      # Angehalten sieht LVGL die Beruehrung nicht - der erste Tipp weckt also
      # nur, statt gleich etwas auszuloesen.
      - lvgl.pause:
      # "Touch weckt" aus: Touch-Chip im Ruhezustand gar nicht mehr abfragen.
      - if:
          condition: {lambda: "return !id(ps_touch_wake);"}
          then:
            - component.suspend: main_touch
            - lambda: 'id(touch_susp) = true;'
          else:
            # Touch weckt AN: Abfrage im Ruhezustand nach Einstellung (Standard 50 ms
            # = normal). Groessere Werte sparen etwas Strom, lassen aber kurze Tipps
            # durchfallen.
            - if:
                condition: {lambda: "return id(ps_touch_ms) > 50;"}
                then:
                  - lambda: |-
                      id(main_touch)->set_update_interval(id(ps_touch_ms));
                      id(main_touch)->stop_poller();
                      id(main_touch)->start_poller();
                      id(touch_slow) = true;
      # Nach mem_s Sekunden (Einstellung "Menue merken") auch aus dem Menue
      # heraus, damit man beim naechsten Aufwecken auf der Startseite landet.
      # NICHT bei der Begruessung (24): die soll bei jedem naechsten Aufwecken noch da sein,
      # egal wie lange es dunkel war, bis sie aktiv weggetippt/-gedrueckt wird - das war der
      # eigentliche Grund fuer "kurze Pause: bleibt da, laengere Pause: weg" (Nutzerbefund
      # 2026-09-23) - NICHT ein Neustart, wie zuerst vermutet.
      - delay: !lambda 'return (uint32_t) id(mem_s) * 1000;'
      - if:
          condition: {lambda: "return id(disp_off) && id(cur_page) != 24;"}
          then:
            - lvgl.resume:
            - script.execute: go_home
            # Ruhe bei ausgeschaltetem Display: Menue-Seite UND Markierungen
            # vergessen. go_home merkt sich die Seite fuer das Merk-Fenster von
            # open_menu - das hier hebt es wieder auf.
            - lambda: |-
                id(last_menu_ms) = 0;
                for (int i = 0; i < 44; i++) { id(fmem_row)[i] = 0; id(fmem_col)[i] = 0; }
                id(fmem_last_page) = -1;
                id(media_left_ms) = 0;
            - lvgl.widget.redraw:
            - delay: 400ms
            - lvgl.pause:

  # WLAN-Sparmodus: light = Funkteil schlaeft zwischen den Empfangsfenstern,
  # none = nie, max = nur im Ruhezustand (Display aus) und nur wenn gewaehlt -
  # laengere Schlafphasen, Home Assistant antwortet dann traeger.
  # WLAN-Selbstheilung, Stufe 1: Sparmodus kurz auf "aus" und wieder auf den Sollwert - dasselbe,
  # was der Nutzer per Hand ueber die Einstellung macht. Stufe 2: WLAN aus und wieder ein.
  - id: wifi_heilen
    mode: single
    then:
      - lambda: |-
          id(heal_ps_n)++;
          ESP_LOGW("wlan", "Keine Verbindung zu Home Assistant seit %d s bei verbundenem WLAN - WLAN-Sparmodus wird neu gesetzt (%dx)", id(api_down_s), id(heal_ps_n));
          wifi::global_wifi_component->set_power_save_mode(wifi::WIFI_POWER_SAVE_NONE);
          id(ps_last_mode) = -1;   // Zwischenspeicher von apply_wifi_ps verwerfen, sonst bliebe "aus" stehen
      - delay: 3s
      - script.execute: apply_wifi_ps
      - script.execute: wifi_status_text
  - id: wifi_neu
    mode: single
    then:
      - lambda: |-
          id(heal_wifi_n)++;
          ESP_LOGW("wlan", "Immer noch keine Verbindung zu Home Assistant seit %d s - WLAN wird neu gestartet (%dx)", id(api_down_s), id(heal_wifi_n));
      - wifi.disable:
      - delay: 2s
      - wifi.enable:
      - script.execute: wifi_status_text
  - id: wifi_status_text
    then:
      - lambda: |-
          char b[64];
          snprintf(b, sizeof(b), "Sparmodus neu %dx, WLAN neu %dx", id(heal_ps_n), id(heal_wifi_n));
          id(wifi_heal_txt).publish_state(b);

  - id: apply_wifi_ps
    then:
      - lambda: |-
          wifi::WiFiPowerSaveMode m = id(ps_wifi) ? wifi::WIFI_POWER_SAVE_LIGHT : wifi::WIFI_POWER_SAVE_NONE;
          if (id(ps_wifi) && id(ps_wifi_max) && id(disp_off)) m = wifi::WIFI_POWER_SAVE_HIGH;
          // Gleicher Wunsch wie zuletzt: nur alle 30 s erneut setzen, nicht bei jedem Aufruf (dieses Skript
          // laeuft bei jedem Touch/Tastendruck - ohne Begrenzung ging das mehrmals pro Sekunde an den
          // Treiber). Ganz ohne Wiederholung (frueherer Zwischenspeicher) blieb ein nach einem WLAN-
          // Neuaufbau abweichender Treiberstand unentdeckt (Verdacht bei "WLAN haengt";
          // Aus- und wieder Einschalten des Sparmodus hat es behoben).
          if ((int) m == id(ps_last_mode) && (uint32_t) (millis() - id(ps_last_ms)) < 30000) return;
          id(ps_last_mode) = (int) m;
          id(ps_last_ms) = millis();
          wifi::global_wifi_component->set_power_save_mode(m);
          ESP_LOGI("strom", "WLAN-Sparmodus %s", m == wifi::WIFI_POWER_SAVE_HIGH ? "max" : (m == wifi::WIFI_POWER_SAVE_LIGHT ? "light" : "none"));

  # Sparmodus bei niedrigem Akku ein-/ausschalten. Aufgerufen bei jeder
  # Akku-Messung, bei Lade-Wechsel und beim Aendern der Einstellung.
  # Cover-Einstellungen nach Home Assistant spiegeln (input_boolean, bleibt dort
  # erhalten, auch wenn die Remote schlaeft). Beim Verbinden und nach jeder
  # Aenderung. An = GANZ.
  - id: sync_cover_prefs
    then:
      - if:
          condition: {lambda: "return id(cover_ganz_player);"}
          then: [{homeassistant.service: {service: input_boolean.turn_on,  data: {entity_id: input_boolean.remote_cover_player_ganz}}}]
          else: [{homeassistant.service: {service: input_boolean.turn_off, data: {entity_id: input_boolean.remote_cover_player_ganz}}}]
      - if:
          condition: {lambda: "return id(cover_ganz_home);"}
          then: [{homeassistant.service: {service: input_boolean.turn_on,  data: {entity_id: input_boolean.remote_cover_startseite_ganz}}}]
          else: [{homeassistant.service: {service: input_boolean.turn_off, data: {entity_id: input_boolean.remote_cover_startseite_ganz}}}]

  # Cover nach einem Neustart oder Aufwachen (WLAN war aus) nachladen. HA stoesst
  # das Cover nur bei einem TITELWECHSEL an (refresh_cover) - liefen Titel und
  # Interpret schon, kam das Cover bis zum naechsten Video nie. Die Datei liegt
  # in HA bereits fertig (die Automation baut sie auch ohne erreichbare Remote).
  # Laeuft bei jedem Verbinden der API; laedt nur, wenn ein SmartTube-Titel da ist
  # und das Cover dazu noch nicht geladen wurde.
  - id: cover_sync
    mode: restart
    then:
      - delay: 4s
      - if:
          condition:
            lambda: "return id(adb_title).has_state() && !id(adb_title).state.empty() && id(adb_title).state != id(cover_title);"
          then:
            - lambda: |-
                id(cover_title) = id(adb_title).state;
                ESP_LOGI("cover", "Cover nach dem Verbinden nachladen: %s", id(cover_title).c_str());
            - lvgl.widget.show: media_cover
            - online_image.set_url:
                id: mp_cover_image
                url: "http://${ha_host}/local/esphomeremote_smarttube_cover_${device_name}.jpg"

  # Wiedergabestatus als Farbe des Play/Pause-Symbols (Nutzerwunsch 2026-09-20):
  # aus = rot, spielt = gruen, pausiert = blau, alles andere = weiss.
  # Position anzeigen: Stand beim Empfang + seit dem vergangene Zeit (nur bei "playing").
  # Ohne Position (-1) bleibt das Label ganz weg und die Kopfspalte schrumpft.
  - id: update_media_pos
    then:
      - lambda: |-
          const int base = id(media_pos_s);
          const int d = id(media_dur_s);
          const bool zeigen = base >= 0;
          const bool mit_dauer = zeigen && d > 0;
          const bool war_zeile = !lv_obj_has_flag(id(media_time_row), LV_OBJ_FLAG_HIDDEN);
          const bool war_balken = !lv_obj_has_flag(id(media_bar), LV_OBJ_FLAG_HIDDEN);
          if (zeigen) {
            int p = base;
            if (id(mp_state).state == "playing") p += (int) ((millis() - id(media_pos_at)) / 1000);
            if (d > 0 && p > d) p = d;
            auto fmt = [](int sek, char *b, size_t n) {
              if (sek >= 3600) snprintf(b, n, "%d:%02d:%02d", sek / 3600, (sek / 60) % 60, sek % 60);
              else             snprintf(b, n, "%d:%02d", sek / 60, sek % 60);
            };
            char a[16], c[20];
            fmt(p, a, sizeof(a));
            lv_label_set_text(id(media_pos_lbl), a);
            lv_obj_remove_flag(id(media_time_row), LV_OBJ_FLAG_HIDDEN);
            if (mit_dauer) {
              c[0] = '-';
              fmt(d - p, c + 1, sizeof(c) - 1);
              lv_label_set_text(id(media_rest_lbl), c);
              lv_obj_remove_flag(id(media_rest_lbl), LV_OBJ_FLAG_HIDDEN);
              lv_bar_set_value(id(media_bar), (int) (((int64_t) p * 1000) / d), LV_ANIM_OFF);
              lv_obj_remove_flag(id(media_bar), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(media_rest_lbl), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(media_bar), LV_OBJ_FLAG_HIDDEN);
            }
          } else {
            lv_obj_add_flag(id(media_time_row), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(media_bar), LV_OBJ_FLAG_HIDDEN);
          }
          // Kleiner Fortschrittsbalken auf der ausgeklappten Startseiten-Karte (nur der Balken,
          // ohne Zeit-Zahlen - Nutzerwunsch 2026-09-22 "ganz unten unterm Interpret"). Nur bei
          // bekannter Dauer sichtbar, wie beim grossen Balken auch.
          if (zeigen && mit_dauer) {
            int p = base;
            if (id(mp_state).state == "playing") p += (int) ((millis() - id(media_pos_at)) / 1000);
            if (p > d) p = d;
            lv_bar_set_value(id(home_media_bar), (int) (((int64_t) p * 1000) / d), LV_ANIM_OFF);
            if (id(cur_page) == 0 && !id(home_cams_visible)) lv_obj_remove_flag(id(home_media_bar), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(home_media_bar), LV_OBJ_FLAG_HIDDEN);
          }
          id(media_pos_neu_layout) = (zeigen != war_zeile) || (mit_dauer != war_balken);
      # Erscheint/verschwindet die Zeile oder der Balken, muss das Banner hinter Titel/Interpret neu passen.
      - if:
          condition: {lambda: "return id(media_pos_neu_layout);"}
          then: [{script.execute: media_layout}]

  - id: update_media_state
    then:
      - lambda: |-
          const std::string x = id(mp_state).state;
          uint32_t c = 0xF1F3F5;
          if (!id(tv_on) || x == "off" || x == "standby" || x == "unavailable") c = 0xEF4444;
          else if (x == "playing")  c = 0x22C55E;
          else if (x == "paused")   c = 0x3B82F6;
          lv_obj_set_style_text_color(id(m_pp_lbl), lv_color_hex(c), LV_PART_MAIN);

  # Titel auf hoechstens 2 Zeilen, Spalte an den Inhalt, schwarzes Banner dahinter
  # bis knapp unter die Spalte.
  - id: media_layout
    then:
      - lambda: |-
          lv_obj_t *t = id(media_title);
          const lv_font_t *f = lv_obj_get_style_text_font(t, LV_PART_MAIN);
          lv_point_t sz;
          lv_text_get_size(&sz, lv_label_get_text(t), f, 0, 0, 220, LV_TEXT_FLAG_NONE);
          const int lh = lv_font_get_line_height(f);
          lv_obj_set_height(t, sz.y > 2 * lh ? 2 * lh : (sz.y < lh ? lh : sz.y));
          lv_obj_t *c = id(media_head_col);
          lv_obj_update_layout(c);
          lv_area_t a;
          lv_obj_get_coords(c, &a);
          lv_obj_t *seite = lv_obj_get_parent(id(media_scrim_top));
          const int pl = lv_obj_get_style_pad_left(seite, LV_PART_MAIN);
          const int pt = lv_obj_get_style_pad_top(seite, LV_PART_MAIN);
          lv_obj_set_size(id(media_scrim_top), 240, a.y2 + 7);
          lv_obj_align(id(media_scrim_top), LV_ALIGN_TOP_LEFT, -pl, -pt);

  # ---- Touch-Test (Einstellungen > Touch-Test) ------------------------------------
  # Ring folgt dem Finger, bei jedem Tipp bleibt ein kleiner Punkt stehen (die
  # letzten 60). Koordinaten unten. Beenden nur mit der Zurueck-Taste.
  - id: tt_move
    then:
      - lambda: |-
          lv_obj_remove_flag(id(tt_ring), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_pos(id(tt_ring), id(tt_x) - 16, id(tt_y) - 16);
          char b[32];
          snprintf(b, sizeof(b), "x=%d  y=%d", id(tt_x), id(tt_y));
          lv_label_set_text(id(tt_lbl), b);
  - id: tt_press
    then:
      - lambda: |-
          lv_obj_t *page = lv_obj_get_parent(id(tt_ring));
          const int i = id(tt_n) % 60;
          id(tt_n)++;
          if (id(tt_dots)[i] != nullptr) lv_obj_delete((lv_obj_t *) id(tt_dots)[i]);
          lv_obj_t *d = lv_obj_create(page);
          lv_obj_remove_style_all(d);
          lv_obj_set_size(d, 10, 10);
          lv_obj_set_pos(d, id(tt_x) - 5, id(tt_y) - 5);
          lv_obj_set_style_radius(d, LV_RADIUS_CIRCLE, 0);
          lv_obj_set_style_border_width(d, 2, 0);
          lv_obj_set_style_border_color(d, lv_color_hex(0xF1F3F5), 0);
          lv_obj_set_style_bg_opa(d, LV_OPA_TRANSP, 0);
          lv_obj_remove_flag(d, LV_OBJ_FLAG_CLICKABLE);
          lv_obj_remove_flag(d, LV_OBJ_FLAG_SCROLLABLE);
          id(tt_dots)[i] = d;
          lv_obj_move_foreground(id(tt_ring));
  - id: tt_clear
    then:
      - lambda: |-
          for (int i = 0; i < 60; i++) {
            if (id(tt_dots)[i] != nullptr) { lv_obj_delete((lv_obj_t *) id(tt_dots)[i]); id(tt_dots)[i] = nullptr; }
          }
          id(tt_n) = 0;
          lv_obj_add_flag(id(tt_ring), LV_OBJ_FLAG_HIDDEN);
          lv_label_set_text(id(tt_lbl), "Tippe irgendwo");

  # ---- Reinigungsmodus: Touch und Tasten clean_s Sekunden tot. Zurueck-Taste LANG
  # haelt ab. Das Display bleibt solange an (Timeout gestoppt).
  - id: clean_run
    mode: restart
    then:
      - script.stop: backlight_idle_timeout
      - lambda: |-
          id(clean_mode) = true;
          id(clean_left) = id(clean_s);
      - lvgl.page.show: {id: page_clean, animation: FADE_IN, time: 150ms}
      - while:
          condition: {lambda: "return id(clean_mode) && id(clean_left) > 0;"}
          then:
            - lambda: |-
                char b[16];
                snprintf(b, sizeof(b), "%d s", id(clean_left));
                lv_label_set_text(id(clean_lbl), b);
            - delay: 1s
            - lambda: 'id(clean_left)--;'
      - lambda: 'id(clean_mode) = false;'
      - lvgl.page.show: {id: page_service, animation: FADE_IN, time: 150ms}

  # Finger liegt auf dem Display: nicht abdunkeln/ausschalten (s. on_update des Touch).
  - id: idle_touch_ping
    then:
      - if:
          condition: {lambda: "return id(disp_timeout_s) > 0 && !id(clean_mode) && id(cur_page) != 36 && !id(disp_off);"}
          then:
            - if:
                condition: {lambda: "return id(disp_dimmed);"}
                then:
                  - lambda: 'id(disp_dimmed) = false;'
                  - light.turn_on:
                      id: display_backlight
                      brightness: !lambda 'return id(disp_bri) / 100.0f;'
            - script.execute: backlight_idle_timeout

  # ---- Live-Bild: Kamera waehlen, Bild bei HA anfordern ----
  - id: cam_view_request
    then:
      - lambda: |-
          static const char *namen[] = {"Haustür", "Wohnungstür", "3D-Drucker", "Zelt", "Garten"};   // < von Haustür = Garten, > = Wohnungstür
          lv_label_set_text(id(cv_name), namen[id(cv_idx) % 5]);
          lv_label_set_text(id(cv_state), "Lade Bild ...");
          lv_obj_add_flag(id(cv_img), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(cv_ph), LV_OBJ_FLAG_HIDDEN);
      - homeassistant.event:
          event: esphome.remote_cam_snapshot
          data:
            kamera: !lambda |-
              static const char *ent[] = {"camera.haustur", "camera.wohnungstur", "camera.3d_drucker", "camera.zelt", "camera.garten"};
              return std::string(ent[id(cv_idx) % 5]);
            geraet: !lambda 'return App.get_name();'

  # ---- Live-Bild (schnell): Kamera bei HA anfordern, dann Bilder fortlaufend nachladen ----
  - id: live_start
    then:
      - lambda: |-
          static const char *namen[] = {"Haustür", "Wohnungstür", "3D-Drucker", "Zelt", "Garten"};
          lv_label_set_text(id(cf_name), namen[id(cv_idx) % 5]);
          lv_label_set_text(id(cf_state), "Starte ...");
          lv_obj_add_flag(id(cf_img), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(cf_ph), LV_OBJ_FLAG_HIDDEN);
          id(live_until) = millis() + 45000;
          id(live_busy) = false;
      - homeassistant.event:
          event: esphome.remote_live_start
          data:
            kamera: !lambda |-
              static const char *ent[] = {"camera.haustur", "camera.wohnungstur", "camera.3d_drucker", "camera.zelt", "camera.garten"};
              return std::string(ent[id(cv_idx) % 5]);
            geraet: !lambda 'return App.get_name();'
      - script.execute: live_loop
  - id: live_loop
    mode: restart
    then:
      - delay: 1500ms
      - while:
          condition: {lambda: "return id(cur_page) == 38 && (int32_t) (id(live_until) - millis()) > 0;"}
          then:
            - if:
                # Nur laden, wenn kein Bild laeuft, die Pause vorbei ist und gerade niemand
                # bedient (Taste/Touch in den letzten 1,2 s).
                condition: {lambda: "return (!id(live_busy) || (millis() - id(live_req_ms)) > 4000) && (int32_t) (millis() - id(live_next_ms)) >= 0 && (millis() - id(last_input_ms)) > 1200;"}
                then:
                  - lambda: |-
                      id(live_busy) = true;
                      id(live_req_ms) = millis();
                  - online_image.set_url: {id: cam_fast_image, url: "http://${ha_host}/local/esphomeremote_live.jpg"}
            - delay: 100ms
      - lambda: |-
          if (id(cur_page) == 38) lv_label_set_text(id(cf_state), "Beendet - Neu starten drücken");

  # Kamerabild (Standbild) abrufen: kurz warten, nicht waehrend der Bedienung (ein Abruf
  # blockiert die Remote), dann laden. on_error von cam_live_image wiederholt bei Bedarf.
  - id: cam_load
    mode: restart
    then:
      - delay: 400ms
      - wait_until:
          condition: {lambda: "return (millis() - id(last_input_ms)) > 1200 || id(cur_page) != 37;"}
          timeout: 5s
      - if:
          condition: {lambda: "return id(cur_page) == 37;"}
          then:
            - online_image.set_url: {id: cam_live_image, url: "http://${ha_host}/local/esphomeremote_cam.jpg"}

  - id: apply_low_bat
    then:
      - lambda: |-
          const bool neu = id(ps_low_pct) > 0 && id(akku_pct) <= id(ps_low_pct) && !id(laedt) && !id(charger_present).state;
          if (neu != id(low_bat)) {
            id(low_bat) = neu;
            ESP_LOGI("strom", "Sparmodus bei niedrigem Akku %s (%d %%)", neu ? "AN" : "AUS", id(akku_pct));
          }

  # Peripherie-Vorbereitung fuer den Deep-Sleep - nach dem Rev6-Vorbild der
  # Original-Firmware (sleep_hal_esp32.cpp / enterSleep()).
  #
  # WICHTIG: dieses Script darf NICHT yielden (kein `- delay:`), sonst laeuft
  # der Aufrufer (g_deep_active + deep_sleep.enter) los, BEVOR die Rail
  # abgeschaltet ist. Solange alles synchron ist, fuehrt script.execute das
  # Script komplett aus, bevor die naechste Aktion drankommt - und zwischen
  # "Rail aus" und esp_deep_sleep_start() laeuft dann KEIN Component-loop()
  # mehr, der auf den pull-up-losen I2C-Bus pollen und haengenbleiben koennte
  # (das war die Absturz-Ursache am 06.09.). Settle-Zeiten daher als
  # blockierendes delay() in der Lambda.
  #
  # Rev6-Power-Architektur:
  #   +VSW  = +3.3V ueber Q4 (P-MOSFET), Gate an GPIO38 (LCD_EN) + R26 10k->+3.3V.
  #           GPIO38 HIGH/Hi-Z -> Q4 AUS -> Panel, Touch-Controller, die
  #           I2C-Pull-ups R11/R12 und (analog, Q7) microSD sind stromlos.
  #   +3.3V = Dauerstrom: TCA8418 (Keypad) + LIS3DH (Accel) bleiben an ->
  #           Wecken ueber GPIO8 / GPIO2 funktioniert.
  - id: deep_sleep_powerdown
    then:
      # Funk aus (BT geht mit esp_deep_sleep_start() sowieso vollstaendig aus).
      - wifi.disable:
      - script.execute: apply_mic_power        # MIC_VDD (GPIO45) aus
      - component.suspend: main_touch          # ft63x6 pollt nicht mehr
      - light.turn_off: display_backlight
      - light.turn_off: button_backlight
      - lambda: |-
          // --- 1. LIS3DH fuer den Bewegungs-Weck-Interrupt (Bus noch versorgt) ---
          uint64_t mask = (1ULL << 8);   // GPIO8 = TCA8418-INT (HW-Pull-up R36)
          if (id(motion_mode) != 0) {
            id(motion_chip)->write_byte(0x20, 0x2F);   // CTRL_REG1: 10 Hz Low-Power, XYZ
            id(motion_chip)->write_byte(0x21, 0x09);   // CTRL_REG2: HPIS1 + FDS (Hochpass -> INT1)
            id(motion_chip)->write_byte(0x23, 0x80);   // CTRL_REG4: BDU
            id(motion_chip)->write_byte(0x24, 0x00);   // CTRL_REG5: kein Latch
            id(motion_chip)->write_byte(0x25, 0x02);   // CTRL_REG6: INT-Polaritaet aktiv-LOW
            const uint8_t thr[3] = {0x10, 0x20, 0x30};
            int si = id(motion_sens); if (si < 0) si = 0; if (si > 2) si = 2;
            id(motion_chip)->write_byte(0x32, thr[si]); // INT1_THS
            id(motion_chip)->write_byte(0x33, 0x02);    // INT1_DURATION (~2/ODR)
            uint8_t dmy = 0;
            id(motion_chip)->read_byte(0x26, &dmy);     // REFERENCE lesen -> Nulllage
            id(motion_chip)->read_byte(0x31, &dmy);     // INT1_SRC lesen -> Latch klaeren
            id(motion_chip)->write_byte(0x30, 0x2A);    // INT1_CFG: X/Y/Z high, OR
            id(motion_chip)->write_byte(0x22, 0x40);    // CTRL_REG3: AOI1 -> INT1
            mask |= (1ULL << 2);                        // GPIO2 = LIS3DH INT1
          }

          // --- 2. Verbraucher auf +VSW / Sonderpfade abschalten ---
          const gpio_num_t lcd_ctrl[] = { GPIO_NUM_39, GPIO_NUM_40, GPIO_NUM_41, GPIO_NUM_42 };
          const gpio_num_t lcd_data[] = { GPIO_NUM_48, GPIO_NUM_47, GPIO_NUM_21, GPIO_NUM_14,
                                          GPIO_NUM_13, GPIO_NUM_12, GPIO_NUM_11, GPIO_NUM_10 };
          for (auto p : lcd_ctrl) { gpio_set_direction(p, GPIO_MODE_OUTPUT); gpio_set_level(p, 0); }
          for (auto p : lcd_data) { gpio_set_direction(p, GPIO_MODE_OUTPUT); gpio_set_level(p, 0); }
          // LCD_EN (GPIO38) HIGH treiben -> Q4 sicher AUS -> +VSW weg. Ab hier
          // hat der I2C-Bus keine Pull-ups mehr - keine I2C-Zugriffe mehr!
          gpio_set_direction(GPIO_NUM_38, GPIO_MODE_OUTPUT); gpio_set_level(GPIO_NUM_38, 1);
          // Display-Backlight-PWM (GPIO9, invertiert -> HIGH = aus).
          gpio_set_direction(GPIO_NUM_9, GPIO_MODE_OUTPUT);  gpio_set_level(GPIO_NUM_9, 1);
          // Tasten-Backlight (GPIO46) aus.
          gpio_set_direction(GPIO_NUM_46, GPIO_MODE_OUTPUT); gpio_set_level(GPIO_NUM_46, 0);
          // microSD: SD_EN (GPIO16) HIGH -> Q7 AUS -> Karte stromlos.
          gpio_set_direction(GPIO_NUM_16, GPIO_MODE_OUTPUT); gpio_set_level(GPIO_NUM_16, 1);
          // IR-Empfaenger: IR_VCC (GPIO6) LOW -> TSSP77038 stromlos.
          // IR-Sender:     IR_LED (GPIO5) HIGH -> Q5 (P-MOSFET) AUS -> IR-Dioden
          //                D2/D5 von +3.3V getrennt (R20 10k haelt das Gate eh
          //                oben, wir setzen es nur sauber).
          // IR_RX (GPIO4) hochohmig -> kein Querstrom in den toten Empfaenger
          // (Referenz: sonst ~60 uA).
          gpio_set_direction(GPIO_NUM_6, GPIO_MODE_OUTPUT); gpio_set_level(GPIO_NUM_6, 0);
          gpio_set_direction(GPIO_NUM_5, GPIO_MODE_OUTPUT); gpio_set_level(GPIO_NUM_5, 1);
          gpio_reset_pin(GPIO_NUM_4);
          // I2C-Pins (GPIO19/20) vom Bus loesen und hochohmig: der Touch-
          // Controller haengt an +VSW (jetzt tot) - keine internen Pull-ups
          // sollen ueber seine ESD-Dioden die tote Rail speisen.
          gpio_reset_pin(GPIO_NUM_19);
          gpio_reset_pin(GPIO_NUM_20);

          // --- 3. Schalt-/Power-Pins ueber den Schlaf HALTEN ---
          // (Referenz: "Force display pins to high impedance / gpio_hold_en -
          //  ohne das wacht das Display evtl. nicht auf.")
          gpio_hold_en(GPIO_NUM_38);   // LCD_EN -> Q4 (Display/Touch/+VSW/I2C-Pullups) aus
          gpio_hold_en(GPIO_NUM_9);    // LCD_BL -> Q3 (Display-Backlight von +3.3V) aus
          gpio_hold_en(GPIO_NUM_16);   // SD_EN  -> Q7 (microSD) aus
          gpio_hold_en(GPIO_NUM_6);    // IR_VCC      (IR-Empfaenger TSSP77038) aus
          gpio_hold_en(GPIO_NUM_5);    // IR_LED -> Q5 (IR-Sendedioden von +3.3V) aus
          // GPIO46 (SW_BL) NICHT halten - Strapping-Pin. Nur LOW getrieben,
          // im Schlaf hochohmig (Tasten-Backlight ist dann ohnehin aus).
          gpio_deep_sleep_hold_en();

          // --- 4. Weckquellen scharf: ext1 ANY_LOW ---
          // GPIO1 (TP4056 ~CHRG) hat KEINEN HW-Pull-up -> interner RTC-Pull-up,
          // damit "nicht am Laden" sicher HIGH ist; im Schlaf gehalten.
          rtc_gpio_init(GPIO_NUM_1);
          rtc_gpio_set_direction(GPIO_NUM_1, RTC_GPIO_MODE_INPUT_ONLY);
          rtc_gpio_pulldown_dis(GPIO_NUM_1);
          rtc_gpio_pullup_en(GPIO_NUM_1);
          rtc_gpio_hold_en(GPIO_NUM_1);
          // GPIO1 NUR als Weckquelle scharf schalten, wenn KEIN Kabel dran ist.
          // Bei angestecktem Kabel wuerde ANY_LOW das Geraet sofort wieder
          // wecken - Endlosschleife. Die Tiefschlaf-Bedingung oben verhindert
          // das eigentlich schon (!charger_present), doppelt haelt besser.
          const bool gpio1_frei = !id(charger_present).state;
          if (gpio1_frei) mask |= (1ULL << 1);
          esp_sleep_enable_ext1_wakeup(mask, ESP_EXT1_WAKEUP_ANY_LOW);
          ESP_LOGI("schlaf", "ext1 scharf: mask=0x%llx (GPIO8 Taste%s%s)",
                   (unsigned long long) mask,
                   id(motion_mode) ? " + GPIO2 Bewegung" : "",
                   gpio1_frei ? " + GPIO1 Ladekabel" : " [GPIO1 aktiv - nicht scharf]");
          // Rail + Pegel setzen lassen, bevor esp_deep_sleep_start() folgt
          // (Referenz: delay(100) vor dem Schlaf).
          delay(80);

  # Bewegungs-Icon in der Statusleiste (neben den Assistenten-Symbolen): kurz einblenden,
  # sobald der Sensor etwas registriert, nach 1,5 s ohne neue Meldung wieder ausblenden.
  # Rein informativ - unabhaengig von den Schaltern dim_wake/dim_hold_motion.
  - id: motion_icon_blip
    then:
      - lvgl.widget.show: motion_icon
      - script.execute: motion_icon_hide_timer
  - id: motion_icon_hide_timer
    mode: restart
    then:
      - delay: 1500ms
      - lvgl.widget.hide: motion_icon

  - id: wake_backlight
    mode: restart
    then:
      # Ein Weckereignis (Taste, Bewegung, HA) bricht die Ruhe-Timer ab.
      - script.stop: ble_ruhe_timer
      - script.stop: deep_ruhe_timer
      - globals.set: {id: disp_off, value: "false"}
      # BLE-Verbindung wieder auf das schnelle HID-Profil, Takt zurueck auf voll.
      - lambda: 'id(kb).request_conn_profile(false);'
      - script.stop: cpu_ruhe_timer
      - lambda: 'id(cpu_low) = false;'
      - script.execute: apply_cpu
      - script.execute: apply_wifi_ps
      # Touch-Abfrage wieder auf normalen Takt (50 ms) bzw. wieder starten.
      - if:
          condition: {lambda: "return id(touch_slow);"}
          then:
            - lambda: |-
                id(main_touch)->set_update_interval(50);
                id(main_touch)->stop_poller();
                id(main_touch)->start_poller();
                id(touch_slow) = false;
      - if:
          condition: {lambda: "return id(touch_susp);"}
          then:
            - component.resume: main_touch
            - lambda: 'id(touch_susp) = false;'
      - lambda: 'id(kb).set_rssi_update_interval(3000);'
      - component.resume: wifi_rssi
      - component.resume: ble_host_txt
      - script.stop: wifi_ruhe_timer
      - if:
          condition: {lambda: "return id(ps_wifi_off);"}
          then: [{wifi.enable:}]
      - lvgl.resume:
      - lvgl.widget.redraw:
      - light.turn_on:
          id: display_backlight
          brightness: !lambda 'return id(disp_bri) / 100.0f;'
      - lambda: 'id(disp_dimmed) = false;'
      - if:
          condition: {lambda: "return id(kbd_light_on);"}
          then:
            - light.turn_on:
                id: button_backlight
                brightness: !lambda 'return id(kbd_bri) / 100.0f;'
      # 0 = nie abschalten: dann gar keinen Ablauf starten, statt mit
      # Verzoegerung 0 sofort wieder auszuschalten.
      - if:
          condition: {lambda: "return id(disp_timeout_s) > 0 && !id(clean_mode) && id(cur_page) != 36;"}
          then:  [{script.execute: backlight_idle_timeout}]
          else:  [{script.stop: backlight_idle_timeout}]

  # ---- SD-Karte ----------------------------------------------------------------
  # Anzeige auf der Seite "SD-Karte" aktualisieren.
  - id: sd_anzeige
    then:
      - lambda: |-
          const bool ok = id(sdkarte)->is_mounted();
          char b[96];
          if (ok) snprintf(b, sizeof(b), "Karte eingebunden: %.1f GB, %.1f GB frei",
                           id(sdkarte)->card_size_bytes() / 1073741824.0, id(sdkarte)->free_bytes() / 1073741824.0);
          else    snprintf(b, sizeof(b), "Keine Karte eingebunden");
          lv_label_set_text(id(sd_stat_lbl), b);
          lv_obj_set_style_text_color(id(sd_stat_lbl), lv_color_hex(ok ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          std::string c;
          if (ok) {
            c = "Geraete: " + std::to_string(id(rc)->device_names().size()) +
                ", Aktivitaeten: " + std::to_string(id(rc)->activity_names().size()) +
                ", Menue: " + (id(menu)->loaded() ? "ja" : "nein");
          }
          if (ok) c += " | Mikrofon gesperrt";
          lv_label_set_text(id(sd_info_lbl), c.empty() ? " " : c.c_str());
  # Karte einbinden und die Konfiguration laden. Danach ist das Mikrofon bis zum Neustart tot.
  - id: sd_einbinden
    mode: restart
    then:
      - lambda: |-
          lv_label_set_text(id(sd_stat_lbl), "Karte wird eingebunden ...");
          id(voice)->set_mic_blocked(true);       // I2S-Treiber stoppen: gibt GPIO15/17/7 frei
      - wait_until:
          condition: {lambda: "return id(remote_mic).is_stopped();"}
          timeout: 2s
      # Mikrofon-Versorgung AN lassen (nicht abschalten!): ein stromloses Mikrofon klemmt ueber seine ESD-Diode die
      # gemeinsame Leitung MISO (GPIO7) nach Low. ESP-IDF wartet vor JEDEM SD-Befehl, bis MISO hoch geht (bis 40 ms) -
      # gemessen 83 ms je Lesebefehl statt 1-3 ms. Bei anliegender Versorgung ist der Mikrofonausgang hochohmig.
      - lambda: 'id(mic_power).turn_on();'
      - delay: 100ms
      - switch.turn_off: sd_power_off        # SD_EN LOW = Karte an
      - delay: 150ms
      - lambda: |-
          const bool ok = id(sdkarte)->mount();
          id(sd_status)->publish_state(ok ? "gemountet" : "Mount fehlgeschlagen");
          if (ok) {
            id(rc)->load();
            id(menu)->load();
            id(sd_info)->publish_state("eingebunden");
          }
      - script.execute: sd_anzeige
  - id: sd_neuladen
    mode: restart
    then:
      - if:
          condition: {lambda: "return !id(sdkarte)->is_mounted();"}
          then: [{script.execute: sd_einbinden}]
          else:
            - lambda: |-
                id(rc)->load();
                id(menu)->load();
            - script.execute: sd_anzeige
  # Karte auswerfen und das Mikrofon zurueckholen (ohne Neustart): SPI-Treiber gibt die Pins frei,
  # SD_EN aus, dann startet der I2S-Treiber wieder und legt die Pins neu an.
  - id: sd_auswerfen
    then:
      - lambda: |-
          id(sdkarte)->unmount();
          id(sd_status)->publish_state("ausgeworfen");
          lv_label_set_text(id(sd_stat_lbl), "Ausgeworfen");
      - switch.turn_on: sd_power_off         # Karte stromlos
      - delay: 300ms
      - lambda: 'id(voice)->set_mic_blocked(false);'
      - script.execute: apply_mic_power
      - script.execute: sd_anzeige
  # Karte auswerfen und die Remote neu starten (Rueckfall, falls das Mikrofon danach nicht geht).
  - id: sd_auswerfen_neustart
    then:
      - script.execute: sd_auswerfen
      - delay: 500ms
      - button.press: btn_restart
  # ---- Konfig-Modus (HTTP-Upload runtime.json/menu.json), 10 Minuten -------------
  - id: sd_konfig_start
    mode: restart
    then:
      - lambda: 'id(voice)->set_mic_blocked(true);'
      - wait_until:
          condition: {lambda: "return id(remote_mic).is_stopped();"}
          timeout: 2s
      # Mikrofon-Versorgung AN lassen (nicht abschalten!): ein stromloses Mikrofon klemmt ueber seine ESD-Diode die
      # gemeinsame Leitung MISO (GPIO7) nach Low. ESP-IDF wartet vor JEDEM SD-Befehl, bis MISO hoch geht (bis 40 ms) -
      # gemessen 83 ms je Lesebefehl statt 1-3 ms. Bei anliegender Versorgung ist der Mikrofonausgang hochohmig.
      - lambda: 'id(mic_power).turn_on();'
      - delay: 100ms
      - switch.turn_off: sd_power_off
      - delay: 150ms
      - lambda: |-
          if (!id(sdkarte)->is_mounted()) id(sdkarte)->mount();
          id(sdkarte)->http_enable(0);
          id(ota_aktiv) = true;
          char ipb[48] = {0};
          wifi::global_wifi_component->get_ip_addresses()[0].str_to(ipb);
          const std::string ip = ipb;
          std::string t = "http://" + ip + "/sd/api/list?path=/";
          lv_label_set_text(id(sd_info_lbl), t.c_str());
          lv_label_set_text(id(sd_stat_lbl), "Konfig-Modus AN (10 min)");
          ESP_LOGI("sd", "Konfig-Modus AN fuer 10 min - /sd/api/ auf %s", ip.c_str());
      - delay: 10min
      - script.execute: sd_konfig_stop
  - id: sd_konfig_stop
    then:
      - lambda: |-
          id(sdkarte)->http_disable();
          id(ota_aktiv) = false;
          ESP_LOGI("sd", "Konfig-Modus AUS");
      - script.execute: sd_anzeige
      - script.execute: backlight_idle_timeout       # Tiefschlaf-Pfad neu anstossen
  # ---- Logos/Cover von der SD-Karte ---------------------------------------------
  # Wird bei jeder Aenderung von App oder Cover-URL aufgerufen (und nach jedem Cover-Download). Hat Home
  # Assistant KEIN echtes Cover (Netflix-Logo bzw. neutrales Bild), zeigt die Remote das Logo der App von der
  # SD-Karte: aus dem Cache oder, falls noch nicht geladen, nach kurzem Einbinden der Karte.
  - id: sd_logo_pruefen
    then:
      - lambda: |-
          // Absturz-Schutz: endete der letzte Start mit einem Watchdog/Panic, werden die Logos von der SD-Karte
          // abgeschaltet (einmal pro Start geprueft) - sonst koennte ein Fehler hier eine Neustart-Schleife ausloesen.
          static bool geprueft = false;
          if (!geprueft) {
            geprueft = true;
            const esp_reset_reason_t r = esp_reset_reason();
            if (r == ESP_RST_TASK_WDT || r == ESP_RST_INT_WDT || r == ESP_RST_WDT || r == ESP_RST_PANIC) {
              id(sd_logos) = false;
              ESP_LOGW("sd", "Letzter Start endete mit Absturz (Grund %d): Logos von der SD-Karte sind abgeschaltet", (int) r);
            }
          }
      - lambda: |-
          const std::string cov = id(mp_cover_url).state;
          const bool ohne = cov.find("esphomeremote_netflix_n.png") != std::string::npos ||
                            cov.find("esphomeremote_cover_leer.png") != std::string::npos;
          const std::string s = sdbilder::slug(id(mp_app_name).state);
          id(logo_slug) = (id(sd_logos) && ohne && !s.empty()) ? s : std::string();
      - if:
          condition: {lambda: "return !id(logo_slug).empty();"}
          then:
            - if:
                condition: {lambda: "auto &c = sdbilder::cache(); auto it = c.find(id(logo_slug)); return it != c.end() && it->second.player.ok;"}
                then:
                  - script.execute: sd_logo_zeigen
                else:
                  - if:
                      condition: {lambda: "auto &c = sdbilder::cache(); auto it = c.find(id(logo_slug)); const bool erlaubt = it == c.end() || (it->second.fehlt_bis != 0 && (int32_t) (millis() - it->second.fehlt_bis) >= 0); return erlaubt && !id(sd_bild_laeuft) && !id(sdkarte)->is_mounted() && !id(voice_active) && !id(host_mic) && !id(ota_aktiv);"}
                      then:
                        - script.execute: sd_logo_holen
  - id: sd_logo_zeigen
    then:
      - lambda: |-
          auto &c = sdbilder::cache();
          auto it = c.find(id(logo_slug));
          if (it == c.end()) return;
          if (it->second.player.ok) {
            lv_image_set_src(id(media_cover), &it->second.player.dsc);
            lv_obj_remove_flag(id(media_cover), LV_OBJ_FLAG_HIDDEN);
          }
          if (it->second.home.ok) lv_image_set_src(id(home_cover_img), &it->second.home.dsc);
          ESP_LOGI("sd", "Logo von der SD-Karte: %s", id(logo_slug).c_str());
          // Speicher schonen: hoechstens 6 Apps im Cache, die gerade gezeigte bleibt.
          for (auto e = c.begin(); e != c.end() && c.size() > 6;) {
            if (e->first != id(logo_slug)) e = c.erase(e); else ++e;
          }
  # Karte kurz einbinden, beide Bilder der App in den Cache lesen, Karte auswerfen, Mikrofon zurueckholen.
  - id: sd_logo_holen
    mode: single
    then:
      - lambda: |-
          id(sd_bild_laeuft) = true;
          id(voice)->set_mic_blocked(true);
      - wait_until:
          condition: {lambda: "return id(remote_mic).is_stopped();"}
          timeout: 2s
      # Mikrofon-Versorgung AN lassen (nicht abschalten!): ein stromloses Mikrofon klemmt ueber seine ESD-Diode die
      # gemeinsame Leitung MISO (GPIO7) nach Low. ESP-IDF wartet vor JEDEM SD-Befehl, bis MISO hoch geht (bis 40 ms) -
      # gemessen 83 ms je Lesebefehl statt 1-3 ms. Bei anliegender Versorgung ist der Mikrofonausgang hochohmig.
      - lambda: 'id(mic_power).turn_on();'
      - delay: 100ms
      - switch.turn_off: sd_power_off
      - delay: 150ms
      # Lesen im Hintergrund-Task (die Karte ist langsam; im Hauptprogramm loeste das den Task-Watchdog aus)
      - lambda: 'sdbilder::starte(id(sdkarte), id(logo_slug));'
      - wait_until:
          condition: {lambda: "return !sdbilder::busy();"}
          timeout: 45s
      - lambda: |-
          auto &c = sdbilder::cache();
          const std::string s = id(logo_slug);
          const bool fertig = !sdbilder::busy();
          if (fertig && sdbilder::ergebnis().fehlt_bis == 0) {
            c[s] = std::move(sdbilder::ergebnis());
            ESP_LOGI("sd", "Logo %s: geladen", s.c_str());
          } else {
            c[s].fehlt_bis = millis() + 600000;   // Karte/Datei fehlt oder Zeitueberschreitung: 10 min nicht erneut versuchen
            ESP_LOGW("sd", "Logo %s: nicht verfuegbar%s", s.c_str(), fertig ? "" : " (Zeitueberschreitung)");
          }
          if (id(sdkarte)->is_mounted()) id(sdkarte)->unmount();
      - switch.turn_on: sd_power_off
      - delay: 200ms
      - lambda: |-
          id(voice)->set_mic_blocked(false);
          id(sd_bild_laeuft) = false;
      - script.execute: apply_mic_power
      - script.execute: sd_logo_zeigen
  # Cache leeren (nach dem Wechseln der Karte oder neuen Dateien). Die Bilder vorher vom Bildschirm nehmen,
  # sonst zeigt LVGL noch auf freigegebenen Speicher.
  - id: sd_logo_leeren
    then:
      - lvgl.image.update: {id: media_cover, src: mp_cover_image}
      - lvgl.image.update: {id: home_cover_img, src: home_cover_image}
      - lambda: 'sdbilder::cache().clear();'
      - script.execute: sd_logo_pruefen
  # Geschwindigkeitstest der Karte (HA-Knopf "SD: Geschwindigkeitstest"): Ergebnis im Log, Tag "sdtest".
  - id: sd_bench
    mode: single
    then:
      - lambda: 'id(voice)->set_mic_blocked(true);'
      - wait_until:
          condition: {lambda: "return id(remote_mic).is_stopped();"}
          timeout: 2s
      # Mikrofon-Versorgung AN lassen (nicht abschalten!): ein stromloses Mikrofon klemmt ueber seine ESD-Diode die
      # gemeinsame Leitung MISO (GPIO7) nach Low. ESP-IDF wartet vor JEDEM SD-Befehl, bis MISO hoch geht (bis 40 ms) -
      # gemessen 83 ms je Lesebefehl statt 1-3 ms. Bei anliegender Versorgung ist der Mikrofonausgang hochohmig.
      - lambda: 'id(mic_power).turn_on();'
      - delay: 100ms
      - switch.turn_off: sd_power_off
      - delay: 150ms
      - lambda: 'sdbilder::bench_starten(id(sdkarte));'
      - wait_until:
          condition: {lambda: "return !sdbilder::busy();"}
          timeout: 120s
      - lambda: 'if (id(sdkarte)->is_mounted()) id(sdkarte)->unmount();'
      - switch.turn_on: sd_power_off
      - delay: 200ms
      - lambda: 'id(voice)->set_mic_blocked(false);'
      - script.execute: apply_mic_power
  - id: sd_logo_label
    then:
      - lvgl.label.update: {id: sd_logos_lbl, text: !lambda 'return id(sd_logos) ? std::string("AN") : std::string("AUS");'}
      - lvgl.label.update: {id: sd_logos_lbl, text_color: !lambda 'return id(sd_logos) ? lv_color_hex(0x22C55E) : lv_color_hex(0x8B94A3);'}

  # Wartungsfenster: WLAN fuer 3 min erzwingen (Fernwartung / OTA). Nur noch auf
  # Anstoss - Ladekabel anstecken oder Schalter "Wartungsfenster jetzt" in HA;
  # kein stuendliches Aufwachen mehr. mode: restart, damit ein neuer Anstoss das
  # Fenster verlaengert statt zu stapeln.
  - id: wartungsfenster
    mode: restart
    then:
      - lambda: |-
          id(wartung_bis) = millis() + 180000UL;
          ESP_LOGI("wartung", "Wartungsfenster: WLAN 3 min erzwungen an");
      - wifi.enable:
      - delay: 180s
      - lambda: 'id(wartung_bis) = millis();'
      - if:
          condition:
            lambda: 'return id(disp_off) && id(ps_wifi_off) && !id(testmodus) && !id(boot_grace) && !id(ota_aktiv);'
          then:
            - lambda: 'ESP_LOGI("wartung", "Wartungsfenster vorbei - WLAN wieder aus");'
            - wifi.disable:

  # 10-min-Boot-Schonfrist: nach jedem echten Boot (auch nach jedem OTA-Reboot)
  # sind Tiefschlaf und WLAN-Aus fuer 10 min gesperrt. So gibt es nach jedem
  # Flash sicher ein Fenster, um einen Fehler zu korrigieren. Nach dem Aufwachen
  # aus dem Tiefschlaf ist boot_grace schon in on_boot auf false gesetzt.
  - id: boot_grace_timer
    then:
      - if:
          condition: {lambda: 'return id(boot_grace);'}
          then:
            - lambda: 'ESP_LOGI("test", "Boot-Schonfrist: 10 min kein Tiefschlaf / kein WLAN-Aus");'
            - delay: 600s
            - globals.set: {id: boot_grace, value: "false"}
            - lambda: 'ESP_LOGI("test", "Boot-Schonfrist vorbei");'
            - script.execute: backlight_idle_timeout

  # Empfindlichkeit der Bewegungserkennung: INT1_THS (0x32) des LIS3DH.
  # Kleinerer Wert = empfindlicher. Wird direkt ins Register geschrieben,
  # damit die Aenderung sofort greift und nicht erst nach einem Neustart.
  # Liest den tatsaechlichen Zustand der vier Host-Slots aus dem
  # BLE-Component (get_host_slot(n).occupied) - nicht nur, was zuletzt
  # angetippt wurde.
  - id: apply_brightness
    then:
      - light.turn_on:
          id: display_backlight
          brightness: !lambda 'return id(disp_bri) / 100.0f;'
      - if:
          condition: {lambda: "return id(kbd_light_on);"}
          then:
            - light.turn_on:
                id: button_backlight
                brightness: !lambda 'return id(kbd_bri) / 100.0f;'
      - lvgl.label.update: {id: disp_bri_lbl, text: !lambda 'char b[8]; snprintf(b,sizeof(b),"%d%%", id(disp_bri)); return std::string(b);'}
      - lvgl.label.update: {id: kbd_bri_lbl,  text: !lambda 'char b[8]; snprintf(b,sizeof(b),"%d%%", id(kbd_bri));  return std::string(b);'}
      - lvgl.slider.update: {id: disp_bri_sld, value: !lambda 'return id(disp_bri);'}
      - lvgl.slider.update: {id: kbd_bri_sld,  value: !lambda 'return id(kbd_bri);'}

  - id: apply_disp_timeout
    then:
      - lambda: |-
          // Slider auf die passende Stufe stellen und den Klartext darueber
          // setzen. Der Slider selbst kennt nur 0..5.
          const int t = id(disp_timeout_s);
          lv_slider_set_value(id(to_sld), t, LV_ANIM_OFF);
          char b[16];
          if (t == 0)        snprintf(b, sizeof(b), "Nie");
          else if (t < 60)   snprintf(b, sizeof(b), "%d s", t);
          else if (t % 60 == 0) snprintf(b, sizeof(b), "%d min", t / 60);
          else               snprintf(b, sizeof(b), "%d:%02d min", t / 60, t % 60);
          lv_label_set_text(id(to_val_lbl), b);
      - script.execute: wake_backlight

  - id: apply_motion_on
    then:
      - lambda: |-
          lv_obj_t *mk[3] = {id(mm_0_mk), id(mm_1_mk), id(mm_2_mk)};
          for (int i = 0; i < 3; i++)
            lv_label_set_text(mk[i], i == id(motion_mode) ? "AKTIV" : " ");
      - lvgl.label.update:
          id: motion_mode_lbl
          text: !lambda |-
            switch (id(motion_mode)) {
              case 1:  return std::string("Bewegung");
              case 2:  return std::string("Hochheben");
              default: return std::string("AUS");
            }
      - lvgl.label.update:
          id: motion_mode_lbl
          text_color: !lambda 'return id(motion_mode) ? lv_color_hex(0x22C55E) : lv_color_hex(0x8B94A3);'

  # Aktivitaet 0 = Google Streamer (BLE-Platz 1), 1 = TV (BLE-Platz 2).
  # Die Aktivitaet bestimmt, an WELCHES Geraet das D-Pad geht - deshalb
  # schaltet sie den BLE-Host gleich mit um.
  - id: apply_activity
    then:
      - lambda: |-
          const int a = id(activity);
          if ((int) id(kb).active_host_slot() != a) {
            char act[24];
            snprintf(act, sizeof(act), "switch_host:%d", a);
            id(kb).execute_action(act);
          }
          // Aktivitaet 0 = Streamer (Platz 1), 1 = TV (Platz 2),
          // 2 = Tablet Wohnzimmer (Platz 3).
          lv_obj_t *b[3] = {id(home_act_0), id(home_act_1), id(home_act_2)};
          for (int i = 0; i < 3; i++) {
            if (i == a) {
              lv_obj_set_style_bg_color(b[i], lv_color_hex(0x3B82F6), LV_PART_MAIN);
              lv_obj_set_style_text_color(b[i], lv_color_hex(0xF1F3F5), LV_PART_MAIN);
            } else {
              lv_obj_set_style_bg_color(b[i], lv_color_hex(0x1A1F27), LV_PART_MAIN);
              lv_obj_set_style_text_color(b[i], lv_color_hex(0x8B94A3), LV_PART_MAIN);
            }
          }
          // Dock-Ausrundungen zum aktiven Segment (TV = 1, Streamer = 0, Tablet = 2).
          lv_obj_t *fo[4] = {id(dock_f_b1_s1), id(dock_f_b1_s2), id(dock_f_b2_s2), id(dock_f_b2_s3)};
          const bool fan[4] = {a == 1, a == 0, a == 0, a == 2};
          for (int i = 0; i < 4; i++) {
            if (fan[i]) lv_obj_remove_flag(fo[i], LV_OBJ_FLAG_HIDDEN);
            else        lv_obj_add_flag(fo[i], LV_OBJ_FLAG_HIDDEN);
          }
          // Dieselbe Auswahl auf der Menueseite markieren.
          lv_obj_t *mk[3] = {id(akt_str_mk), id(akt_tv_mk), id(akt_tab_mk)};
          for (int i = 0; i < 3; i++)
            lv_label_set_text(mk[i], i == a ? "AKTIV" : " ");

  # Balkenanzeige oben rechts. Getrennt = alle drei dunkel. Verbunden = so
  # viele Balken blau, wie die Empfangsstaerke hergibt; die restlichen bleiben
  # als Umriss sichtbar, damit man sieht, dass es drei sein koennten.
  # Die Breite aus dem YAML kommt bei den Reglern nicht an - gemessen wurden
  # 260 px, obwohl 180 bzw. 30 eingetragen sind. Deshalb hier zur Laufzeit
  # setzen, wo nichts mehr dazwischengeraet. Ausserdem den Startseiten-Regler
  # sicher ausblenden; auch "hidden: true" im YAML hat nicht gegriffen.
  # Kamera-Raster ein-/ausblenden und die Wiedergabe-Karte in den freien Platz
  # hinein- bzw. wieder herauswachsen lassen (Nutzerwunsch 2026-09-16).
  # Aufgerufen bei jedem page_home on_load (state kann sich ueber die
  # HA-gespiegelte Switch-Entity geaendert haben) und vom Umschalt-Button
  # selbst.
  - id: apply_home_layout
    then:
      - lambda: |-
          // Die Abdunklung hinter Titel/Interpret ist ein einfaches obj - und
          // LVGL setzt bei dessen Konstruktor grundsaetzlich
          // LV_OBJ_FLAG_CLICKABLE (lv_obj.c: obj->flags = LV_OBJ_FLAG_CLICKABLE).
          // Dadurch schluckte sie jeden Tipp auf die Beschriftung, waehrend ein
          // Tipp aufs Cover ankam (Bild-Widgets sind nicht klickbar und reichen
          // durch). Ergebnis: die Karte liess sich nur auf dem oberen Teil
          // oeffnen (Nutzerhinweis 2026-09-16). Flag wegnehmen, dann faellt der
          // Klick auf den darunterliegenden Kartenknopf durch. Gleiches
          // vorsorglich fuer die beiden Beschriftungen.
          lv_obj_remove_flag(id(home_card_scrim), LV_OBJ_FLAG_CLICKABLE);
          lv_obj_remove_flag(id(home_player_lbl), LV_OBJ_FLAG_CLICKABLE);
          lv_obj_remove_flag(id(home_player_artist), LV_OBJ_FLAG_CLICKABLE);
          if (id(home_cams_visible)) {
            // Kompakt: schlichter Text-Button wie ganz zu Anfang, kein
            // Cover (bei 48px Hoehe waere ein 216x160-Bild ohnehin fast nur
            // Beschnitt) - bewaehrter, risikoarmer Zustand.
            lv_obj_clear_flag(id(cam_grid), LV_OBJ_FLAG_HIDDEN);
            // Abstaende (Anzeige-Koordinaten): Raster 38..146 (Behaelter bis 152),
            // Karte 154..210, Menue/Apps 218..262, Dock 270..320 - 8 px dazwischen.
            lv_obj_set_size(id(home_player_btn), 216, 56);
            lv_obj_align(id(home_player_btn), LV_ALIGN_TOP_MID, 0, 144);
            lv_obj_add_flag(id(home_cover_img), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(home_card_scrim), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(home_player_artist), LV_OBJ_FLAG_HIDDEN);
            // Sonst wuerde er sich in der viel kleineren 56px-Karte an DEREN
            // unteren Rand haengen und die Kompakt-Beschriftung ueberlappen.
            lv_obj_add_flag(id(home_media_bar), LV_OBJ_FLAG_HIDDEN);
            lv_obj_align(id(home_player_lbl), LV_ALIGN_CENTER, 0, 0);
            // Karte ist hier 48 hoch, der 30er Button sass mit y:4 3px zu hoch.
            lv_obj_align(id(cam_toggle_btn), LV_ALIGN_RIGHT_MID, -4, 0);
          } else {
            // Ausgeklappt: Cover-Banner (216x160, server-seitig schon exakt
            // so gross), Titel/Interpret unten drueber. Feste Groesse statt
            // dynamisch bis knapp vor Apps - die erste Fassung ist trotz
            // rechnerisch 6px Abstand am echten Geraet ueber Apps
            // hinausgeraten (Nutzerfeedback 2026-09-16), hier reichlich
            // Sicherheitsabstand (y:30..190, Apps beginnt bei ~228).
            lv_obj_add_flag(id(cam_grid), LV_OBJ_FLAG_HIDDEN);
            // 216x172 = Startseiten-Cover, 38..210.
            lv_obj_set_size(id(home_player_btn), 216, 172);
            lv_obj_align(id(home_player_btn), LV_ALIGN_TOP_MID, 0, 28);
            lv_obj_clear_flag(id(home_cover_img), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(home_card_scrim), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(home_player_artist), LV_OBJ_FLAG_HIDDEN);
            lv_obj_align(id(home_player_lbl), LV_ALIGN_BOTTOM_MID, 0, -26);
            lv_obj_align(id(cam_toggle_btn), LV_ALIGN_TOP_RIGHT, -4, 4);
          }
          // Icon bleibt immer dasselbe (Kamera-Symbol) - nur die Farbe zeigt
          // den Zustand: Markierfarbe (gleiches Blau wie ueberall sonst bei
          // "aktiv"/fokussiert) = Kameras sichtbar, gedaempft = ausgeblendet.
          lv_obj_set_style_text_color(id(cam_toggle_lbl),
            lv_color_hex(id(home_cams_visible) ? 0x3B82F6 : 0x8B94A3), LV_PART_MAIN);

  - id: fix_slider_geometry
    then:
      - lambda: |-
          // JEDER neue horizontale Slider MUSS hier mit rein - ohne das bleibt er bei LVGLs
          // eigener (viel kleinerer) Standardgroesse, egal was width/height im YAML sagen.
          // Genau das fehlte bei ds_sld (Nutzerkorrektur 2026-09-22: "duenner und schmaler").
          lv_obj_t *waag[6] = {id(disp_bri_sld), id(kbd_bri_sld),
                               id(to_sld), id(ms_sld), id(ps_dim_sld), id(ds_sld)};
          for (int i = 0; i < 6; i++) {
            lv_obj_set_width(waag[i], 180);
            lv_obj_set_height(waag[i], 26);
            // Mittig statt linksbuendig: die Seite ist 216 breit, der Regler
            // 180 - also 18 auf jede Seite. Sonst klebte der Knopf am linken
            // Rand und rechts blieb eine grosse Luecke.
            lv_obj_set_style_margin_left(waag[i], 18, LV_PART_MAIN);
            lv_obj_set_style_margin_right(waag[i], 18, LV_PART_MAIN);
          }
          // Hochkant: Hoehe deutlich groesser als Breite, daran erkennt LVGL
          // die Ausrichtung.
          lv_obj_set_width(id(home_bri_sld), 30);
          lv_obj_set_height(id(home_bri_sld), 176);
          lv_obj_align(id(home_bri_sld), LV_ALIGN_RIGHT_MID, -6, 6);
          lv_obj_add_flag(id(home_bri_sld), LV_OBJ_FLAG_HIDDEN);
          // Gleiche Laenge/Lage wie home_bri_sld (gespiegelt: LEFT_MID statt RIGHT_MID, x
          // positiv statt negativ, sonst identisch) - vorher 140 statt 176 hoch und mit
          // LV_ALIGN_TOP_LEFT, 74 zu dicht unter dem AN/AUS-Knopf (bis y:66) begonnen, der
          // Regler-Knopf konnte damit am oberen Anschlag kollidieren (Nutzerkorrektur
          // 2026-09-23).
          lv_obj_set_width(id(home_kbd_sld), 30);
          lv_obj_set_height(id(home_kbd_sld), 176);
          lv_obj_align(id(home_kbd_sld), LV_ALIGN_LEFT_MID, 6, 6);
          lv_obj_add_flag(id(home_kbd_sld), LV_OBJ_FLAG_HIDDEN);

  # Mikrofon-Versorgung = erlaubt UND Display wach. Die LED an MIC_VDD leuchtet
  # sonst rund um die Uhr, und Mikrofon plus LED ziehen zusammen rund 2,5 mA -
  # auf einem Akkugeraet Verschwendung, solange es nur herumliegt. Erst beim
  # Sprechen einzuschalten waere sparsamer, wuerde aber die ersten Silben
  # abschneiden: ein MEMS-Mikrofon braucht nach dem Einschalten Anlaufzeit.
  - id: apply_mic_power
    then:
      - if:
          condition:
            lambda: "return (id(mic_allowed) && id(voice_active)) || id(voice)->mic_blocked();"
          then:  [{switch.turn_on:  mic_power}]
          else:  [{switch.turn_off: mic_power}]

  - id: hide_bri_overlay
    mode: restart
    then:
      - delay: 4s
      - lambda: 'lv_obj_add_flag(id(home_bri_sld), LV_OBJ_FLAG_HIDDEN);'

  # Schliesst die Helligkeits-Ueberlagerung, sobald irgendwo anders getippt
  # wird - vorher blieb sie bis zum Ablauf der vier Sekunden stehen.
  - id: close_bri_overlay
    then:
      - lambda: 'lv_obj_add_flag(id(home_bri_sld), LV_OBJ_FLAG_HIDDEN);'

  - id: toggle_bri_overlay
    then:
      - lambda: |-
          lv_obj_t *o = id(home_bri_sld);
          lv_obj_add_flag(id(home_kbd_sld), LV_OBJ_FLAG_HIDDEN);   // Tastenlicht-Regler zu
          lv_obj_add_flag(id(home_kbd_box), LV_OBJ_FLAG_HIDDEN);
          if (lv_obj_has_flag(o, LV_OBJ_FLAG_HIDDEN)) {
            lv_slider_set_value(o, id(disp_bri), LV_ANIM_OFF);
            lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
            lv_obj_move_foreground(o);
          } else {
            lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          }
      - script.execute: hide_bri_overlay

  # ---- Tastenlicht-Overlay auf der Startseite ----
  - id: hide_kbd_overlay
    mode: restart
    then:
      - delay: 4s
      - lambda: |-
          lv_obj_add_flag(id(home_kbd_sld), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(home_kbd_box), LV_OBJ_FLAG_HIDDEN);
  - id: kbd_box_refresh
    then:
      - lambda: |-
          lv_label_set_text(id(home_kbd_lbl), id(kbd_light_on) ? "AN" : "AUS");
          lv_obj_set_style_text_color(id(home_kbd_lbl), lv_color_hex(id(kbd_light_on) ? 0xF59E0B : 0x8B94A3), LV_PART_MAIN);
          lv_obj_set_style_border_color(id(home_kbd_box), lv_color_hex(id(kbd_light_on) ? 0xF59E0B : 0x3A424E), LV_PART_MAIN);
  - id: toggle_kbd_overlay
    then:
      - lambda: |-
          lv_obj_t *o = id(home_kbd_sld);
          lv_obj_t *b = id(home_kbd_box);
          if (lv_obj_has_flag(o, LV_OBJ_FLAG_HIDDEN)) {
            lv_slider_set_value(o, id(kbd_bri), LV_ANIM_OFF);
            lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(b, LV_OBJ_FLAG_HIDDEN);
            lv_obj_move_foreground(o);
            lv_obj_move_foreground(b);
            lv_obj_add_flag(id(home_bri_sld), LV_OBJ_FLAG_HIDDEN);   // Display-Regler zu
          } else {
            lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(b, LV_OBJ_FLAG_HIDDEN);
          }
      - script.execute: kbd_box_refresh
      - script.execute: hide_kbd_overlay
  - id: kbd_overlay_light
    then:
      - script.execute: toggle_kbd_light
      - if:
          condition: {lambda: "return id(kbd_light_on);"}
          then: [{script.execute: apply_brightness}]
      - script.execute: kbd_box_refresh
      - script.execute: hide_kbd_overlay

  - id: refresh_wifi_bars
    then:
      - lambda: |-
          // Die Balken zeigten bisher NUR die WLAN-Feldstaerke (RSSI) - nach dem Aufwachen
          // war das WLAN oft schon lange verbunden (volle Balken), aber die eigentliche
          // Verbindung zu Home Assistant (API) brauchte noch bis zu 15+ s laenger. Das sah
          // aus wie "voll verbunden", war es aber nicht (Nutzerbeobachtung 2026-09-22).
          // Jetzt: gruen nur, wenn zusaetzlich Home Assistant (API) verbunden ist - sonst
          // Bernstein, auch bei vollem WLAN-Empfang.
          lv_obj_t *b[3] = {id(wifi_bar0), id(wifi_bar1), id(wifi_bar2)};
          const float r = id(wifi_rssi).state;   // dBm
          int an = 0;
          if (!std::isnan(r)) {
            an = 1;
            if (r > -60.0f) an = 3;
            else if (r > -75.0f) an = 2;
          }
          const bool ha_da = api::global_api_server->is_connected();
          const uint32_t farbe = ha_da ? 0x22C55E : 0xF59E0B;
          for (int i = 0; i < 3; i++)
            lv_obj_set_style_bg_color(b[i],
              lv_color_hex(i < an ? farbe : 0x2A3340), LV_PART_MAIN);

  # Sichtbarkeit der vier Kopfzeilen-Elemente anwenden.
  - id: apply_show
    then:
      - lambda: |-
          // Balken und Akku sitzen in einem eigenen, rechtsbuendigen Rahmen -
          // die duerfen aus der Anordnung verschwinden, der Rest rutscht dann
          // sauber nach.
          struct { lv_obj_t *o; bool an; } e[3] = {
            {id(ble_bars),  id(show_ble)},
            {id(wifi_bars), id(show_wifi)},
            {id(lbl_batt),  id(show_batt)},
          };
          for (int i = 0; i < 3; i++) {
            if (e[i].an) lv_obj_remove_flag(e[i].o, LV_OBJ_FLAG_HIDDEN);
            else         lv_obj_add_flag(e[i].o, LV_OBJ_FLAG_HIDDEN);
          }
          // Die Uhr wirklich ausblenden: die linke Gruppe (Uhr + Timer) ist von der
          // rechten unabhaengig, der Timer rutscht dann nach links.
          if (id(show_clock)) lv_obj_remove_flag(id(idle_clock), LV_OBJ_FLAG_HIDDEN);
          else                lv_obj_add_flag(id(idle_clock), LV_OBJ_FLAG_HIDDEN);
          // Assistenten-Symbol: nur eines von beiden sichtbar, passend zum
          // gerade gewaehlten Assistenten (id(assistant): 0 = Google,
          // 1 = Home Assistant) - komplett aus, wenn der Schalter
          // "Anzeige" -> "Assistenten-Symbol" aus ist.
          const bool ha_gewaehlt = id(assistant) == 1;
          const bool zeig_google = id(show_assi_icon) && !ha_gewaehlt;
          const bool zeig_ha     = id(show_assi_icon) && ha_gewaehlt;
          if (zeig_google) lv_obj_remove_flag(id(assi_icon_google), LV_OBJ_FLAG_HIDDEN);
          else              lv_obj_add_flag(id(assi_icon_google), LV_OBJ_FLAG_HIDDEN);
          if (zeig_ha)      lv_obj_remove_flag(id(assi_icon_ha), LV_OBJ_FLAG_HIDDEN);
          else              lv_obj_add_flag(id(assi_icon_ha), LV_OBJ_FLAG_HIDDEN);
          lv_obj_t *m[5] = {id(sh_ble_lbl), id(sh_wifi_lbl), id(sh_batt_lbl), id(sh_clock_lbl), id(sh_assi_lbl)};
          bool v[5] = {id(show_ble), id(show_wifi), id(show_batt), id(show_clock), id(show_assi_icon)};
          for (int i = 0; i < 5; i++) {
            lv_label_set_text(m[i], v[i] ? "AN" : "AUS");
            lv_obj_set_style_text_color(m[i],
              lv_color_hex(v[i] ? 0x22C55E : 0x8B94A3), LV_PART_MAIN);
          }

  - id: refresh_ble_bars
    then:
      - lambda: |-
          lv_obj_t *b[3] = {id(ble_bar0), id(ble_bar1), id(ble_bar2)};
          int an = 0;
          if (id(ble_paired).state) {
            const float r = id(ble_rssi).state;   // dBm, typisch -40 bis -95
            an = 1;
            if (!std::isnan(r)) {
              if (r > -70.0f) an = 3;
              else if (r > -85.0f) an = 2;
            }
          }
          for (int i = 0; i < 3; i++)
            lv_obj_set_style_bg_color(b[i],
              lv_color_hex(i < an ? 0x3B82F6 : 0x2A3340), LV_PART_MAIN);

  - id: refresh_ble_slots
    then:
      - lambda: |-
          lv_obj_t *lbl[4] = {id(ble_slot0_lbl), id(ble_slot1_lbl),
                              id(ble_slot2_lbl), id(ble_slot3_lbl)};
          const bool conn = id(ble_paired).state;
          static const char *names[4] = {"Google Streamer", "Sony TV", "Tablet Wohnzimmer", "Slot 4"};
          {
            char hdr[48];
            snprintf(hdr, sizeof(hdr), "Aktion für:  %d  %s",
                     id(sel_slot) + 1, names[id(sel_slot) & 3]);
            lv_label_set_text(id(ble_target_lbl), hdr);
          }
          for (int k = 0; k < 4; k++) {
            const bool occ = id(kb).get_host_slot(k).occupied;
            const bool sel = (k == id(sel_slot));
            // conn ist der GLOBALE Verbindungszustand. Frueher stand er an
            // jedem gewaehlten Slot - also auch "Frei · VERBUNDEN" an einem
            // Slot, der nie gekoppelt war. Verbunden kann immer nur der aktive
            // Slot sein, und nur wenn er ueberhaupt belegt ist.
            const bool active = (k == id(kb).active_host_slot());
            std::string t = occ ? std::string("Gekoppelt") : std::string("Frei");
            if (occ && active && conn) t += "  ·  VERBUNDEN";
            if (sel)                   t += "  ·  GEWÄHLT";
            lv_label_set_text(lbl[k], t.c_str());
            lv_obj_set_style_text_color(lbl[k],
                lv_color_hex(occ && active && conn ? 0x22C55E
                                                  : (occ ? 0xF1F3F5 : 0x8B94A3)),
                LV_PART_MAIN);
            // Gewaehlter Slot bekommt einen gruenen Grund. Der Fokusrahmen
            // bleibt blau - so sieht man beide Zustaende gleichzeitig und
            // verwechselt "worauf stehe ich" nicht mit "was ist gewaehlt".
            lv_obj_t *row_obj[4] = {id(ble_slot0), id(ble_slot1),
                                    id(ble_slot2), id(ble_slot3)};
            lv_obj_set_style_bg_color(row_obj[k],
                lv_color_hex(sel ? 0x2A3340 : 0x1A1F27), LV_PART_MAIN);
          }


  - id: apply_motion_sens
    then:
      - lambda: |-
          int i = id(motion_sens);
          if (i < 0) i = 0;
          if (i > 2) i = 2;
          const int m = id(motion_mode);

          if (m == 2) {
            // Hochheben: ungefilterte Achsen, kein Interrupt.
            // CTRL_REG1 0x3F = 25 Hz Low-Power, alle Achsen an.
            id(motion_chip)->write_byte(0x20, 0x3F);
            id(motion_chip)->write_byte(0x21, 0x00);  // kein Hochpass -> Schwerkraft bleibt
            id(motion_chip)->write_byte(0x22, 0x00);  // INT1 aus
            id(motion_chip)->write_byte(0x30, 0x00);
            id(motion_chip)->write_byte(0x23, 0x80);  // BDU
          } else {
            // Bewegung: Hochpass in den Interruptgenerator, INT1 auf GPIO2.
            const uint8_t thr[3] = {0x08, 0x10, 0x20};
            id(motion_chip)->write_byte(0x20, 0x3F);
            id(motion_chip)->write_byte(0x21, 0x09);  // HPIS1 + FDS
            id(motion_chip)->write_byte(0x23, 0x80);
            id(motion_chip)->write_byte(0x24, 0x00);
            id(motion_chip)->write_byte(0x32, thr[i]);
            id(motion_chip)->write_byte(0x33, 0x02);
            uint8_t dummy = 0;
            id(motion_chip)->read_byte(0x26, &dummy);  // Nulllage setzen
            id(motion_chip)->read_byte(0x31, &dummy);
            id(motion_chip)->write_byte(0x30, 0x2A);  // INT1_CFG
            id(motion_chip)->write_byte(0x22, 0x40);  // CTRL_REG3
          }
      - lvgl.label.update:
          id: motion_sens_lbl
          text: !lambda |-
            switch (id(motion_sens)) {
              case 0:  return std::string("Hoch");
              case 2:  return std::string("Niedrig");
              default: return std::string("Mittel");
            }
      - lambda: |-
          // Slider nachfuehren (gedreht: rechts = empfindlicher).
          int st = id(motion_sens); if (st < 0) st = 0; if (st > 2) st = 2;
          lv_slider_set_value(id(ms_sld), 2 - st, LV_ANIM_OFF);

  # Grundlage merken, sobald das Display ausgeht - der Winkel wird immer
  # gegen die Lage gemessen, in der die Fernbedienung abgelegt wurde.
  - id: capture_baseline
    then:
      - lambda: |-
          uint8_t d[6];
          if (!id(motion_chip)->read_bytes(0x28 | 0x80, d, 6)) return;
          id(mb_x) = ((int16_t)((uint16_t) d[1] << 8 | d[0])) >> 4;
          id(mb_y) = ((int16_t)((uint16_t) d[3] << 8 | d[2])) >> 4;
          id(mb_z) = ((int16_t)((uint16_t) d[5] << 8 | d[4])) >> 4;

  # ---- Fokus setzen: haelt den Fokus IMMER auf einem sichtbaren Button der
  #      aktuellen Seite und scrollt ihn in den sichtbaren Bereich. -----------
  - id: focus_apply
    then:
      - lambda: |-
          // Fokus-Raster der aktuellen Seite: eine Zeile pro Bedienzeile.
          // Hoch/Runter wechselt die ZEILE, Links/Rechts nur die Spalte
          // INNERHALB der Zeile - nebeneinanderliegende Buttons werden beim
          // Runterdruecken also uebersprungen, nicht durchlaufen.
          // 20 Zeilen mit Reserve. Die Kueche hatte 13 und schrieb damit
          // ueber das Ende des Feldes hinaus - das hat das Geraet zum
          // Absturz gebracht. Die Begrenzung unten faengt so etwas kuenftig ab.
          lv_obj_t *g[20][5] = {};   // bis zu 5 Spalten (Media-Seite: - << Play >> +)
          int rl[20] = {};
          int nr = 0;
          auto row = [&](lv_obj_t *a, lv_obj_t *b, lv_obj_t *c) {
            if (nr >= 20) {
              ESP_LOGE("fokus", "Seite %d hat mehr als 20 Zeilen - Rest ignoriert",
                       id(cur_page));
              return;
            }
            int k = 0;
            g[nr][k++] = a;
            if (b != nullptr) g[nr][k++] = b;
            if (c != nullptr) g[nr][k++] = c;
            rl[nr] = k;
            nr++;
          };
          // Zeile mit bis zu fuenf Feldern (Media-Seite).
          auto row5 = [&](lv_obj_t *a, lv_obj_t *b, lv_obj_t *c, lv_obj_t *d, lv_obj_t *e) {
            if (nr >= 20) return;
            lv_obj_t *l[5] = {a, b, c, d, e};
            int k = 0;
            for (int i = 0; i < 5; i++) if (l[i] != nullptr) g[nr][k++] = l[i];
            rl[nr] = k;
            nr++;
          };
          switch (id(cur_page)) {
            case 25: // Neustart-Rueckfrage - Abbrechen steht vorne, damit
                     // ein versehentliches OK nichts ausloest.
              row(id(restart_no),  nullptr, nullptr);
              row(id(restart_yes), nullptr, nullptr);
              break;
            case 26: // Sprachantwort
              row(id(voice_close), nullptr, nullptr);
              break;
            case 24: // Begruessung - nichts zu fokussieren, sie wird
                     // weggetippt oder mit Zurueck geschlossen.
              id(cur_focus) = nullptr;
              return;
            case 0:  // Home - kein Fokus: das D-Pad steuert hier den Fernseher,
                     // die Kacheln werden per Touch bedient.
              // Ohne das hier behalten angetippte Knoepfe ihre Markierung:
              // LVGL setzt sie beim Klick, und auf dieser Seite raeumt sie
              // niemand wieder weg. Die kurze Rueckmeldung beim Druecken
              // uebernimmt der pressed-Zustand.
              {
                std::function<void(lv_obj_t *)> putzen = [&](lv_obj_t *o) {
                  uint32_t n = lv_obj_get_child_count(o);
                  for (uint32_t i = 0; i < n; i++) {
                    lv_obj_t *c = lv_obj_get_child(o, i);
                    lv_obj_remove_flag(c, LV_OBJ_FLAG_CLICK_FOCUSABLE);
                    lv_obj_remove_state(c, LV_STATE_FOCUSED);
                    putzen(c);
                  }
                };
                // `sc` wird erst nach diesem Auswahlblock deklariert -
                // deshalb den aktiven Bildschirm direkt holen.
                lv_obj_t *akt = lv_screen_active();
                if (akt != nullptr) putzen(akt);
              }
              lv_obj_remove_state(id(app_home_btn), LV_STATE_FOCUSED);
              lv_obj_remove_state(id(home_player_btn), LV_STATE_FOCUSED);
              id(cur_focus) = nullptr;
              return;
            case 1:  // Menue: fuenf Eintraege
              row(id(tile_rooms),         nullptr, nullptr);
              row(id(tile_apps),          nullptr, nullptr);
              row(id(tile_smarthome),     nullptr, nullptr);
              row(id(tile_devices),       nullptr, nullptr);
              row(id(tile_settings_main), nullptr, nullptr);
              row(id(back_menu),          nullptr, nullptr);
              break;
            case 2:  // Raeume
              row(id(tile_wz),    nullptr, nullptr);
              row(id(tile_sz),    nullptr, nullptr);
              row(id(tile_ku),    nullptr, nullptr);
              row(id(tile_bad),   nullptr, nullptr);
              row(id(tile_flur),  nullptr, nullptr);
              row(id(tile_all),   nullptr, nullptr);
              row(id(back_rooms), nullptr, nullptr);
              break;
            case 3:  // Wohnzimmer
              row(id(sc_tv),         id(sc_kino),      id(sc_hell));
              row(id(wz_light_btn),  nullptr,          nullptr);
              row(id(wz_dim_down),   id(wz_dim_up),    nullptr);
              row(id(tile_wz_media), nullptr,          nullptr);
              row(id(wz_stern_btn),  nullptr,          nullptr);
              row(id(wz_ambi_btn),   nullptr,          nullptr);
              row(id(wz_fan_btn),    nullptr,          nullptr);
              row(id(wz_fan_down),   id(wz_fan_up),    id(wz_fan_dreh));
              row(id(wz_rollo_up),   id(wz_rollo_stop), id(wz_rollo_down));
              row(id(wz_r20),        id(wz_r50),       nullptr);
              row(id(back_room_wz),  nullptr,          nullptr);
              break;
            case 9:  // Schlafzimmer
              row(id(sz_light_btn),  nullptr,           nullptr);
              row(id(sz_dim_down),   id(sz_dim_up),     nullptr);
              row(id(sz_rollo_up),   id(sz_rollo_stop), id(sz_rollo_down));
              row(id(sz_r20),        id(sz_r50),        nullptr);
              row(id(back_room_sz),  nullptr,           nullptr);
              break;
            case 19: // Badezimmer
              row(id(bad_sc0), id(bad_sc1), id(bad_sc2));
              row(id(bad_light_btn), nullptr, nullptr);
              row(id(bad_dim_down),  id(bad_dim_up), nullptr);
              row(id(bad_fan_btn),   nullptr, nullptr);
              row(id(back_room_bad), nullptr, nullptr);
              break;
            case 20: // Flur
              row(id(fl_sc0), id(fl_sc1), id(fl_sc2));
              row(id(fl_light_btn), nullptr, nullptr);
              row(id(fl_dim_down),  id(fl_dim_up), nullptr);
              row(id(back_room_flur), nullptr, nullptr);
              break;
            case 21: // Alle Raeume
              row(id(all_off_btn),     nullptr, nullptr);
              row(id(back_all_rooms),  nullptr, nullptr);
              break;
            case 4:  // Geraete & Medien
              row(id(tile_activities), nullptr, nullptr);
              row(id(tile_tv),       nullptr, nullptr);
              row(id(tile_streamer), nullptr, nullptr);
              row(id(tile_tablet),   nullptr, nullptr);
              row(id(tile_music),    nullptr, nullptr);
              row(id(tile_sdmenu),   nullptr, nullptr);
              row(id(tile_numpad),   nullptr, nullptr);
              row(id(tile_keyboard), nullptr, nullptr);
              row(id(back_devices),  nullptr, nullptr);
              break;
            case 18: // TV
              row(id(tv_power), nullptr, nullptr);
              row(id(hdmi_1), nullptr, nullptr); row(id(hdmi_2), nullptr, nullptr);
              row(id(hdmi_3), nullptr, nullptr); row(id(hdmi_4), nullptr, nullptr);
              row(id(back_tv), nullptr, nullptr);
              break;
            case 32: // Streamer
              row(id(streamer_refresh), nullptr, nullptr);
              row(id(back_streamer),    nullptr, nullptr);
              break;
            case 33: // Tablet
              row(id(tablet_connect), nullptr, nullptr);
              row(id(back_tablet),    nullptr, nullptr);
              break;
            case 16: // Kueche
              row(id(ku_sc_0),       nullptr,          nullptr);
              row(id(ku_sc_1),       nullptr,          nullptr);
              row(id(ku_sc_2),       nullptr,          nullptr);
              row(id(ku_sc_3),       nullptr,          nullptr);
              row(id(ku_room_light_btn), nullptr,      nullptr);
