# OpenRemote Dock (Rev 6) in ESPHome - gemeinsame Basis aller Docks (2026-10-11, Basis seit 2026-10-16)
#
# Jedes Dock ist eine kleine Datei dock-<name>.yaml (Name + Anzeigename), die diese Basis einbindet. Neue Docks
# legt der Konfigurator an (Fernbedienung -> Dockingstation -> Docks).
#
# Hardware laut github.com/LORDSn1per/OpenRemote-Firmware (dock/README.md) und
# OpenRemote-Hardware (PCB/Dock Rev6/README.md):
#   ESP32-C3 Super Mini (4 MB Flash, kein PSRAM)
#   GPIO0  IR-Sender (Rev6: MOSFET Q1 auf 4 IR-LEDs, 39R; ohne Platine: IR-LED ueber 100R)
#          -> nur gepulst betreiben, nie dauerhaft HIGH (~95 mA pro LED)
#   GPIO1  gruene Status-LED D5 (Rev6, aktiv HIGH)
#   GPIO8  blaue LED des Super Mini (aktiv LOW)
#   GPIO3  Taste SW1 (Rev6, 10k Pull-up + 100nF)
#   GPIO9  BOOT-Taste des Super Mini
#   CC1101 433 MHz: SCK 4, MISO 5, MOSI 6, CSN 7, GDO0 10 (Senden), GDO2 20 (Empfang/Lernen)
#   GPIO2  Nachruestung: Ladekontakte schalten (P-MOSFET, externer 10k Pull-up = an), GPIO21 reserviert.
#
# Die Original-Firmware spricht ESP-NOW mit der OpenRemote-Firmware. Unsere Remote laeuft mit ESPHome und
# redet mit Home Assistant - deshalb ist das Dock hier ein normales HA-Geraet:
#   - IR- und 433-MHz-Sender als infrared/radio_frequency-Entitaeten (HA-IR/RF-Proxy)
#   - HA-Aktionen esphome.<dock>_ir_* / rf_* zum Senden aus Remote, Skripten und Automationen;
#     ir_roh nimmt die fertigen Zeiten der Remote an (Sendeweg "Dock" im Konfigurator)
#   - Ladekontakte schaltbar + "Remote wecken" (ersetzt den Smart Plug)
#   - Bluetooth-Proxy (aktiv) fuer den HA-Link der Remote ueber Bluetooth
#   - 433-MHz-Lernen: Aktion rf_lernen -> Ereignis esphome.dock_rf_gelernt mit den Rohzeiten
#   - Status-LED wie im Original: an = mit HA verbunden, schnell blinken = Lernfenster, kurz aus = sendet
#   - Taste: kurz/doppelt/lang als Ereignis-Entitaet; 10 s halten = Neustart
#
# Erstes Flashen per USB (C3 ohne USB-Seriell-Wandler: BOOT halten, RESET tippen, BOOT loslassen),
# danach per WLAN.

#
# Seit 2026-11-01 in zwei Teilen: dock-kern.yaml (laeuft auf jedem ESP32, auch fuer Dock-Nachbauten) und
# dock-platine.yaml (IR, 433 MHz, LEDs, Taste, Ladekontakte des Original-Docks).

packages:
  kern: !include dock-kern.yaml
  platine: !include dock-platine.yaml
