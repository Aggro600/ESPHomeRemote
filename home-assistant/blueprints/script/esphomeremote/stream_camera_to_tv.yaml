blueprint:
  name: Stream Camera to TV (Groesse waehlbar)
  description: 'Stream a camera to Android TV using a HA TV Dashboard notification.

    Requires HA TV Dashboard 2026.2.1 (139) or newer.

    https://play.google.com/store/apps/details?id=io.homeassistant.companion.androidtv

    Blueprint version 1.1.0

    '
  domain: script
  author: nodinosaur / George
  source_url: https://github.com/nodinosaur/ha_tv_dashboard_blueprints/blob/main/script/stream_camera_to_tv.yaml
  homeassistant:
    min_version: 2024.6.0
  input:
    notify_service:
      name: Notification Service
      description: 'Enter the notify service (auto-complete works). Example: notify.mobile_app_lounge_tv

        '
      default: notify.notify
      selector:
        text:
          multiline: false
          multiple: false
    camera_config:
      name: Camera config
      icon: hass:cctv
      collapsed: true
      input:
        camera_entity:
          name: Camera Entity
          selector:
            entity:
              domain:
              - camera
              multiple: false
              reorder: false
        camera_name:
          name: Camera Name
          default: ''
          selector:
            text:
              multiline: false
              multiple: false
        format:
          name: Stream Format
          description: "Specify the video format. \n- HLS feeds are generated by Home
            Assistant for some cameras.\n- RTSP for direct video feed.\n- WebRTC feeds
            generated by go2rtc. \n"
          default: hls
          selector:
            select:
              options:
              - label: HLS - Built into HA for some cameras
                value: hls
              - label: RTSP - Enter URL below
                value: rtsp
              - label: WebRTC - Enter URL below
                value: webrtc
              multiple: false
              custom_value: false
              sort: false
        camera_feed:
          name: Video source URL
          description: "Used only when Source type = RTSP or WebRTC. \ni.e.\n- rtsp://user:pass@host:554/path\n-
            http://<go2rtc:1984>/stream.html?src=driveway_cam&mode=webrtc\n"
          default: ''
          selector:
            text:
              multiline: false
              multiple: false
        rtsp_mode:
          name: RTSP Transport
          description: 'Select the RTSP transport protocol. Only applies when Stream
            Format is RTSP.

            - UDP is the default and works for most cameras.

            - TCP can help when UDP is blocked by firewalls or causes packet loss.

            '
          default: ''
          selector:
            select:
              options:
              - label: Default
                value: ''
              - label: UDP
                value: udp
              - label: TCP
                value: tcp
              multiple: false
              custom_value: false
              sort: false
        image:
          description: 'Path to camera snapshot image "/local/… or http://… ".

            Assets available here -

            https://github.com/nodinosaur/ha_tv_dashboard_wiki/wiki/Graphical-assets

            '
          name: Preview Image URL / Path
          default: ''
          selector:
            text:
              multiline: false
              multiple: false
    decoration_prefs:
      name: Decoration
      icon: hass:party-popper
      collapsed: true
      input:
        title:
          name: Title
          default: ''
          selector:
            text:
              multiline: false
              multiple: false
        message:
          name: Message
          default: ''
          selector:
            text:
              multiline: false
              multiple: false
        icon:
          description: "Specify icon to signify which camera was used. \nAssets available
            here - \nhttps://github.com/nodinosaur/ha_tv_dashboard_wiki/wiki/Graphical-assets\n"
          name: Icon URL / Path
          default: ''
          selector:
            text:
              multiline: false
              multiple: false
    notification_prefs:
      name: Frame preferences
      icon: hass:message-flash-outline
      collapsed: true
      input:
        filter:
          name: Filter
          description: "Group notifications by filter types. \ni.e. person, doorbell,
            etc\n"
          default: ''
          selector:
            text:
              multiline: false
              multiple: false
        position:
          name: Position
          description: 'Choose the screen corner where you want the camera pop-up
            overlay to appear.

            '
          default: bottom-right
          selector:
            select:
              options:
              - label: Top left
                value: top-left
              - label: Top right
                value: top-right
              - label: Bottom left
                value: bottom-left
              - label: Bottom right
                value: bottom-right
              multiple: false
              custom_value: false
              sort: false
        duration:
          name: Duration
          description: 'Specify the duration the notification displays in seconds.

            '
          default: 3
          selector:
            number:
              min: 3.0
              max: 300.0
              unit_of_measurement: seconds
              step: 1.0
              mode: slider
        fontsize:
          name: Font Size
          description: 'The size of the title and message text.

            '
          default: medium
          selector:
            select:
              options:
              - label: Small
                value: small
              - label: Medium
                value: medium
              - label: Large
                value: large
              - label: Max
                value: max
              multiple: false
              custom_value: false
              sort: false
        width:
          name: Width (px)
          description: 'The width of the camera pop-up notification. Kopie fuer die Fernbedienungen
            (2026-10-04): freier Text, damit eine Vorlage moeglich ist (Groesse aus input_select.tv_wz_kamera_groesse).

            '
          default: '240'
          selector:
            text: {}
        transparency:
          description: 'The opacity of the camera pop-up notification.

            '
          name: Transparency
          default: '5'
          selector:
            select:
              options:
              - label: 100%
                value: '5'
              - label: 80%
                value: '1'
              - label: 75%
                value: '4'
              - label: 50%
                value: '3'
              - label: 25%
                value: '2'
              multiple: false
              custom_value: false
              sort: false
        color:
          name: Background Color
          description: 'The colour of camera pop-up notification frame.

            '
          default:
          - 40
          - 44
          - 53
          selector:
            color_rgb: {}
        show_frame:
          name: Show Frame
          description: 'Specify if the frame shows.

            '
          default: true
          selector:
            boolean: {}
variables:
  notify_service: !input notify_service
  title: !input title
  message: !input message
  camera_entity: !input camera_entity
  camera_name: !input camera_name
  format: !input format
  camera_feed: !input camera_feed
  rtsp_mode: !input rtsp_mode
  image: !input image
  icon: !input icon
  filter: !input filter
  position: !input position
  duration: !input duration
  fontsize: !input fontsize
  width: !input width
  transparency: !input transparency
  color: !input color
  show_frame: !input show_frame
sequence:
- choose:
  - conditions:
    - condition: template
      value_template: '{{ format != ''hls'' and not (camera_feed | string | trim)
        }}'
    sequence:
    - stop: Please enter a Video source URL for RTSP or WebRTC format.
- action: !input notify_service
  data:
    title: '{{ title if title | trim else state_attr(camera_entity, ''friendly_name'')
      }}'
    message: '{{ message }}'
    data:
      notif_type: stream
      entity_id: '{{ camera_entity }}'
      camera_name: "{{ camera_name if camera_name | trim\n  else state_attr(camera_entity,
        'friendly_name') }}"
      video: '{{ format if format == ''hls'' else camera_feed }}'
      image: '{{ image if image | trim else none }}'
      icon: '{{ icon if icon | trim else none }}'
      filter: '{{ filter if filter | trim else none }}'
      config:
        position: '{{ position }}'
        duration: '{{ duration }}'
        fontsize: '{{ fontsize }}'
        width: '{{ width | int }}'
        transparency: '{{ transparency | int }}'
        color: '{{ ''#%02x%02x%02x'' | format(color[0], color[1], color[2]) }}'
        show_frame: '{{ show_frame }}'
        rtsp_mode: '{{ rtsp_mode if rtsp_mode | trim else none }}'
